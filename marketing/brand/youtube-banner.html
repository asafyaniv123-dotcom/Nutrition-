<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Olimei - YouTube banner 2560x1440</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
<style>
/* YouTube's banner: 2560x1440, and only the centre 1546x423 shows on every
   device - so everything that matters sits inside that box. The lockup is
   the one already approved (the sun, then the name in Fraunces 700); which
   way the o/O becomes the sun is still Asaf's open choice, so it is not used. */
html,body{margin:0}
.card{width:2560px;height:1440px;background:#fbf6ee;position:relative;overflow:hidden}
.safe{position:absolute;left:507px;top:520px;width:1546px;height:300px;display:flex;align-items:center;justify-content:center;gap:56px}
.wm{font-family:Fraunces,serif;font-weight:700;font-size:190px;letter-spacing:-3px;color:#2e2925;line-height:1}
.tag{position:absolute;left:0;right:0;top:855px;text-align:center;font:italic 400 54px/1 Fraunces,serif;color:#6b625a}
</style></head><body>
<div class="card" id="banner">
  <div class="safe"><img src="../../brand/sun.svg" width="210" height="210" alt=""><span class="wm">Olimei</span></div>
  <div class="tag">A journal that knows your day</div>
</div>
<script>document.fonts.ready.then(function(){window.READY=1;});</script>
</body></html>
