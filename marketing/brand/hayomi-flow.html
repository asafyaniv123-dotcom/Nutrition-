<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Hayomi - the logo and the name together</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
/* Asaf, 24 Oct: "show me this together with the logo, to see if it flows".
   Each column is one way to set the o; each row is a place the name and the
   icon meet. The icon is brand/icon-cream.svg, unchanged. */
:root{--cream:#fbf6ee;--ink:#2e2925;--night:#221f1c;--or:#ff7a1a;--muted:#625951}
*{box-sizing:border-box}
body{margin:0;background:#efe9df;color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif}
h1{font-size:26px;margin:28px 28px 4px}
.sub{margin:0 28px 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:130px repeat(4,minmax(0,1fr));gap:14px;padding:0 28px 40px}
.rowh{font-weight:700;align-self:center}
.colh{font-weight:700;text-align:center;padding:6px 0}
.cell{background:var(--cream);border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:120px;direction:ltr}
.cell.night{background:var(--night);color:var(--cream)}
.wm{font-family:Fraunces,serif;font-weight:700;line-height:1;display:inline-flex;align-items:baseline;letter-spacing:-.02em;white-space:nowrap}
.wm svg{flex:none}
.icon{border-radius:22.5%;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18);flex:none}
/* store header */
.store{display:flex;gap:12px;align-items:center;width:100%}
.store .t{font:600 16px/1.2 -apple-system,system-ui,sans-serif}
.store .s{font-size:13px;color:var(--muted)}
.store .get{margin-top:6px;background:#0a84ff;color:#fff;font-weight:700;font-size:12px;border-radius:12px;padding:3px 14px;display:inline-block}
/* home screen */
.home{display:flex;gap:14px;background:linear-gradient(160deg,#f3c79c,#c98a6c 60%,#6f5a7d);padding:14px 12px;border-radius:14px}
.app{width:58px;text-align:center;color:#fff;font:11px/1.2 -apple-system,system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.app .ph{width:52px;height:52px;border-radius:12px;margin:0 auto 4px;background:rgba(255,255,255,.35)}
/* splash */
.splash{width:120px;height:210px;border-radius:18px;background:var(--cream);border:1px solid #e3d9c9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
/* lockup */
.lock{display:flex;align-items:center;gap:12px}
/* profile */
.prof{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:var(--cream);display:grid;place-items:center;box-shadow:0 0 0 1px #e3d9c9}
.handle{font-size:12px;color:var(--muted);margin-top:3px;font-family:system-ui}
</style></head><body>
<h1>Hayomi: השם והאייקון יחד</h1>
<p class="sub">כל עמודה היא גרסה אחרת של ה-o. כל שורה היא מקום שבו השם והאייקון נפגשים. האייקון הוא השמש על שמנת, בלי שינוי.</p>
<div class="grid" id="g"></div>
<script>
var OR='#ff7a1a',P={n:9,c:19.5,d:5.6,r:33,rot:0.5};
function sun(kind,fg){var s='';
  if(kind!=='ring')s+='<circle cx="50" cy="50" r="'+(kind==='disc'?30:P.c)+'" fill="'+fg+'"/>';
  if(kind!=='disc')for(var i=0;i<P.n;i++){var a=(i+P.rot)/P.n*Math.PI*2-Math.PI/2;
    s+='<circle cx="'+(50+Math.cos(a)*P.r).toFixed(2)+'" cy="'+(50+Math.sin(a)*P.r).toFixed(2)+'" r="'+P.d+'" fill="'+fg+'"/>';}
  return s;}
function o(v){return '<svg viewBox="11 11 78 78" style="width:'+v.size+'em;height:'+v.size+'em;margin:0 .02em;transform:translateY('+(-v.lift)+'em)">'+sun(v.kind,OR)+'</svg>';}
function wm(v,px){return '<span class="wm" style="font-size:'+px+'px">Hay'+o(v)+'mi</span>';}
function icon(px){return '<svg class="icon" viewBox="0 0 100 100" width="'+px+'" height="'+px+'"><rect width="100" height="100" fill="#fbf6ee"/>'+sun('full',OR)+'</svg>';}
var V=[{h:'א · השמש כולה',kind:'full',size:.72,lift:0},{h:'ב · רק העיגול',kind:'disc',size:.56,lift:0},
       {h:'ג · טבעת הנקודות',kind:'ring',size:.66,lift:0},{h:'ד · שמש שעולה',kind:'full',size:.92,lift:.16}];
var ROWS=[
  ['האייקון והשם, זה ליד זה',function(v){return '<div class="lock">'+icon(64)+wm(v,52)+'</div>';},''],
  ['מסך הפתיחה',function(v){return '<div class="splash">'+icon(56)+wm(v,26)+'</div>';},''],
  ['בחנות',function(v){return '<div class="store">'+icon(72)+'<div><div class="t">Hayomi: Daily Reflection</div><div class="s">A journal that knows your day</div><span class="get">GET</span></div></div>';},''],
  ['במסך הבית',function(v){return '<div class="home"><div class="app"><div class="ph"></div>Photos</div><div class="app">'+icon(52).replace('class="icon"','class="icon" style="display:block;margin:0 auto 4px"')+'Hayomi</div><div class="app"><div class="ph"></div>Notes</div></div>';},''],
  ['פרופיל ברשתות',function(v){return '<div class="prof"><div class="av">'+'<svg viewBox="11 11 78 78" width="40" height="40">'+sun('full',OR)+'</svg></div><div>'+wm(v,30)+'<div class="handle">@hayomiapp</div></div></div>';},''],
  ['על רקע לילה',function(v){return '<div class="lock">'+icon(64)+wm(v,52)+'</div>';},'night']
];
var h='<div></div>'+V.map(function(v){return '<div class="colh">'+v.h+'</div>';}).join('');
ROWS.forEach(function(r){h+='<div class="rowh">'+r[0]+'</div>'+V.map(function(v){return '<div class="cell '+r[2]+'">'+r[1](v)+'</div>';}).join('');});
document.getElementById('g').innerHTML=h;
document.fonts.ready.then(function(){window.READY=1;});
</script>
</body></html>
