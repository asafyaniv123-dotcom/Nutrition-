<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Hayomi - the o is the sun</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
/* Asaf, 24 Oct: "Hayomi, and the letter o is the sun". Each card is one way
   to set it, in Fraunces 700 (the brand's type) with the brand's own sun -
   the same geometry as brand/build-svgs.mjs, n=9 c=19.5 d=5.6 r=33. Every card
   is shot on its own by marketing/brand/shoot-lockups.mjs. */
html,body{margin:0;background:#ddd}
.card{width:1200px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;box-sizing:border-box}
.cream{background:#fbf6ee;color:#2e2925}
.night{background:#221f1c;color:#fbf6ee}
.wm{font-family:Fraunces,serif;font-weight:700;font-size:150px;line-height:1;letter-spacing:-2px;display:flex;align-items:baseline}
.wm svg{display:inline-block;flex:none}
.cap{font:600 22px/1.3 system-ui,sans-serif;opacity:.55;letter-spacing:.2px}
.small{display:flex;gap:60px;align-items:baseline}
.small .wm{font-size:44px;letter-spacing:-.5px}
</style></head><body>
<div id="cards"></div>
<script>
var OR='#ff7a1a',P={n:9,c:19.5,d:5.6,r:33,rot:0.5};
/* a sun drawn in a 100-unit box; parts: 'full' | 'disc' | 'ring' */
function sun(kind,fg){
  var s='';
  if(kind!=='ring')s+='<circle cx="50" cy="50" r="'+(kind==='disc'?30:P.c)+'" fill="'+fg+'"/>';
  if(kind!=='disc')for(var i=0;i<P.n;i++){var a=(i+P.rot)/P.n*Math.PI*2-Math.PI/2;
    s+='<circle cx="'+(50+Math.cos(a)*P.r).toFixed(2)+'" cy="'+(50+Math.sin(a)*P.r).toFixed(2)+'" r="'+P.d+'" fill="'+fg+'"/>';}
  return s;
}
/* the o: an svg sized against the x-height (Fraunces x-height ~0.5em).
   size = box in em; drop = how far the box's centre sits above the baseline, in em */
function o(kind,size,lift,fg){
  return '<svg viewBox="11 11 78 78" style="width:'+size+'em;height:'+size+'em;margin:0 .02em;transform:translateY('+(-lift)+'em)">'+sun(kind,fg||OR)+'</svg>';
}
function wm(kind,size,lift,fg){return 'Hay'+o(kind,size,lift,fg)+'mi';}
var V=[
  {id:'a',cap:'א · השמש כולה במקום ה-o, בגובה האותיות הקטנות',kind:'full',size:.72,lift:.0},
  {id:'b',cap:'ב · רק עיגול כתום במקום ה-o, בלי הקרניים',kind:'disc',size:.56,lift:.0},
  {id:'c',cap:'ג · ה-o הוא טבעת הנקודות של השמש, ריקה באמצע',kind:'ring',size:.66,lift:.0},
  {id:'d',cap:'ד · השמש גדולה יותר ועולה מעל השורה, כמו שמש שזורחת',kind:'full',size:.92,lift:.16}
];
var h='';
V.forEach(function(v){
  ['cream','night'].forEach(function(bg){
    h+='<div class="card '+bg+'" id="'+v.id+'-'+bg+'"><div class="wm">'+wm(v.kind,v.size,v.lift)+'</div>'+
       '<div class="small"><div class="wm">'+wm(v.kind,v.size,v.lift)+'</div><div class="cap" dir="rtl">'+v.cap+'</div></div></div>';
  });
});
document.getElementById('cards').innerHTML=h;
document.fonts.ready.then(function(){window.READY=1;});
</script>
</body></html>
