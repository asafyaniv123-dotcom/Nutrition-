<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olimei · A journal that knows your day</title>
<meta name="description" content="Every evening, a few gentle questions about the day you actually lived. Coming soon to the App Store.">
<meta property="og:title" content="Olimei">
<meta property="og:description" content="A journal that knows your day. Coming soon to the App Store.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<!-- The brand type is self-hosted (assets/fonts.css): like the privacy page,
     this page hands nobody's address to a font server. -->
<link rel="stylesheet" href="assets/fonts.css">
<style>
  /* The approved lockup (the sun, then the name in Fraunces 700, 23 Oct) on
     the approved cream. Which way the O becomes the sun is still open, so it
     is not used here. Every sentence comes from marketing/store/ - written
     for each language, not translated by this page. */
  :root{--ground:#fbf6ee;--ink:#2e2925;--muted:#625951;--sun:#c2560f;--line:#e6dccd}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:17px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       display:flex;flex-direction:column;min-height:100vh}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:48px 24px 24px}
  .lock{display:flex;align-items:center;gap:18px;direction:ltr}
  .lock img{width:76px;height:76px}
  .wm{font-family:Fraunces,serif;font-weight:700;font-size:68px;line-height:1;letter-spacing:-1px}
  .tag{font-family:Fraunces,system-ui,sans-serif;font-style:italic;font-size:24px;color:var(--muted);margin:22px 0 0}
  :lang(he) .tag,:lang(ar) .tag,:lang(ja) .tag,:lang(zh) .tag{font-style:normal;font-family:system-ui,sans-serif}
  .promo{max-width:30em;margin:22px auto 0;font-size:18px}
  .soon{display:inline-block;margin-top:30px;padding:10px 20px;border-radius:999px;
        border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px}
  footer{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:26px 20px 34px;font-size:15px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--sun);text-decoration:underline}
  @media (max-width:520px){.lock img{width:56px;height:56px}.wm{font-size:50px}.tag{font-size:20px}.promo{font-size:16px}}
</style>
</head>
<body>
<main>
  <div class="lock" aria-label="Olimei"><img src="assets/sun.svg" alt=""><span class="wm">Olimei</span></div>
  <p class="tag" id="tag">A journal that knows your day</p>
  <p class="promo" id="promo">Every evening, a few gentle questions about the day you actually lived. What you ate, how you moved, who you saw. No blank page, and nothing is required.</p>
  <span class="soon" id="soon">Coming soon to the App Store.</span>
</main>
<footer>
  <a href="https://www.instagram.com/olimeiapp/" rel="noopener">Instagram</a>
  <a href="https://www.youtube.com/@Olimei" rel="noopener">YouTube</a>
  <a href="mailto:hello@olimei.app">hello@olimei.app</a>
  <a href="privacy/" id="privacy">Privacy</a>
</footer>
<script>
/* The reader's language, from the browser; English when it is not one of
   the eleven. tag and promo are the store listing's own lines (fa5b95f). */
var T={
 en:{tag:"A journal that knows your day",promo:"Every evening, a few gentle questions about the day you actually lived. What you ate, how you moved, who you saw. No blank page, and nothing is required.",soon:"Coming soon to the App Store.",privacy:"Privacy"},
 he:{tag:"יומן שמכיר את היום שעבר",promo:"בכל ערב, כמה שאלות עדינות על היום כפי שהיה באמת. מה אכלתי, איך זזתי, את מי פגשתי. בלי דף ריק, ושום דבר אינו חובה.",soon:"בקרוב ב-App Store.",privacy:"פרטיות"},
 ar:{tag:"يوميات تعرف كيف مضى يومك",promo:"كل مساء، بضعة أسئلة لطيفة عن اليوم كما عشته فعلًا: ماذا أكلت، وكيف تحرّكت، ومن رأيت. لا صفحة بيضاء، ولا شيء إلزامي.",soon:"قريبًا على App Store.",privacy:"الخصوصية"},
 de:{tag:"Tagebuch, das deinen Tag kennt",promo:"Jeden Abend ein paar behutsame Fragen zu dem Tag, den du wirklich erlebt hast. Was du gegessen, wie du dich bewegt, wen du getroffen hast. Kein leeres Blatt, kein Muss.",soon:"Bald im App Store.",privacy:"Datenschutz"},
 es:{tag:"Un diario que conoce tu día",promo:"Cada noche, unas preguntas amables sobre el día que de verdad viviste. Qué comiste, cómo te moviste, a quién viste. Sin página en blanco, y nada es obligatorio.",soon:"Muy pronto en la App Store.",privacy:"Privacidad"},
 fr:{tag:"Journal qui connaît ta journée",promo:"Chaque soir, quelques questions douces sur la journée que tu as vraiment vécue. Ce que tu as mangé, comment tu as bougé, qui tu as vu. Pas de page blanche, rien d'imposé.",soon:"Bientôt sur l'App Store.",privacy:"Confidentialité"},
 it:{tag:"Il diario che sa com'è andata",promo:"Ogni sera qualche domanda gentile sul giorno che hai vissuto davvero. Cosa hai mangiato, quanto movimento hai fatto, chi hai visto. Niente pagina bianca, niente obblighi.",soon:"Presto sull'App Store.",privacy:"Privacy"},
 pt:{tag:"Um diário que conhece seu dia",promo:"Toda noite, algumas perguntas gentis sobre o dia que você realmente viveu. O que comeu, como se mexeu, quem encontrou. Sem página em branco, e nada é obrigatório.",soon:"Em breve na App Store.",privacy:"Privacidade"},
 ja:{tag:"あなたの一日を知っている日記帳",promo:"毎晩、あなたが本当に過ごした一日について、やさしい質問がいくつか届きます。何を食べたか、どう体を動かしたか、誰と会ったか。白紙のページはなく、答えなくてはいけないこともありません。",soon:"App Storeで近日公開。",privacy:"プライバシー"},
 "zh-Hans":{tag:"一本懂你这一天的日记",promo:"每天晚上，几个温和的问题，问的是你真正度过的这一天：吃了什么，怎么活动，见了谁。没有空白页，也没有哪一项是必填的。",soon:"即将登陆 App Store。",privacy:"隐私"},
 "zh-Hant":{tag:"一本懂你今天的日記",promo:"每天晚上，幾個溫柔的問題，問的是你真正過的這一天：吃了什麼、怎麼動、見了誰。沒有空白的頁面，也沒有哪一題非答不可。",soon:"即將登上 App Store。",privacy:"隱私"}
};
function pick(){
  var q=(location.search.match(/[?&]lang=([\w-]+)/)||[])[1];
  var c=[q].concat(navigator.languages||[navigator.language]);
  for(var i=0;i<c.length;i++){var l=(c[i]||'');if(!l)continue;
    if(T[l])return l;
    var b=l.split('-')[0].toLowerCase();
    if(b==='zh')return /hant|tw|hk|mo/i.test(l)?'zh-Hant':'zh-Hans';
    if(b==='iw')return 'he';
    if(T[b])return b;}
  return 'en';
}
var L=pick(),t=T[L];
document.documentElement.lang=L;
document.documentElement.dir=(L==='he'||L==='ar')?'rtl':'ltr';
['tag','promo','soon','privacy'].forEach(function(k){document.getElementById(k).textContent=t[k];});
</script>
</body>
</html>
