<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olimei · Try it first</title>
<!-- a page for the people we send it to, not for search -->
<meta name="robots" content="noindex">
<meta name="description" content="How to put Olimei on your phone, and what we ask of you while you try it.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<!-- Self-hosted brand type, exactly as on the coming-soon page: no font
     server, no tracker, no script from anywhere but this file. -->
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  /* The coming-soon page's lockup, cream and tokens, unchanged; it has no
     dark scheme, so neither does this. What is added is only what a set of
     instructions needs: two cards of numbered steps and one list. */
  :root{--ground:#fbf6ee;--ink:#2e2925;--muted:#625951;--sun:#c2560f;--line:#e6dccd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:17px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  .bar{display:flex;justify-content:flex-end;padding:14px 16px 0}
  .bar select{font:inherit;font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);
       border-radius:999px;padding:6px 12px;max-width:60vw}
  main{max-width:34em;margin:0 auto;padding:18px 16px 8px}
  .hero{text-align:center;padding:18px 0 6px}
  .lock{display:inline-flex;align-items:center;gap:14px;direction:ltr}
  .lock img{width:56px;height:56px}
  .wm{font-family:Fraunces,serif;font-weight:700;font-size:50px;line-height:1;letter-spacing:-1px}
  .tag{font-family:Fraunces,system-ui,sans-serif;font-style:italic;font-size:21px;color:var(--muted);margin:16px 0 0}
  :lang(he) .tag,:lang(ar) .tag,:lang(ja) .tag,:lang(zh) .tag{font-style:normal;font-family:system-ui,sans-serif}
  .lead{margin:18px 0 0;font-size:18px;font-weight:600}
  .promo{margin:10px 0 0;font-size:16px;color:var(--muted)}
  h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px;font-weight:700}
  :lang(he) h2,:lang(ar) h2,:lang(ja) h2,:lang(zh) h2{letter-spacing:0}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin:0 0 14px}
  .card h3{margin:0 0 8px;font-size:19px}
  ol{margin:0;padding-inline-start:1.3em}
  ol li{margin:0 0 8px;padding-inline-start:4px}
  ol li::marker{color:var(--sun);font-weight:700}
  .btn{display:inline-block;margin:8px 0 4px;padding:11px 20px;border-radius:999px;background:var(--ink);color:#fff;
       text-decoration:none;font-weight:700;font-size:16px}
  .btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .desk{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:16px}
  .desk a{color:var(--sun);word-break:break-all}
  .ask{list-style:none;margin:0;padding:0}
  .ask li{margin:0 0 14px;padding-inline-start:18px;position:relative}
  .ask li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--sun)}
  .ask b{display:block}
  .mail{text-align:center;margin:22px 0 0}
  .mail small{display:block;color:var(--muted);font-size:14px;margin-top:4px;direction:ltr}
  footer{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:30px 20px 34px;font-size:15px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--sun);text-decoration:underline}
  .nw{white-space:nowrap}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar"><select id="lang" aria-label="Language"></select></div>
<main>
  <div class="hero">
    <div class="lock" aria-label="Olimei"><img src="../assets/sun.svg" alt=""><span class="wm">Olimei</span></div>
    <p class="tag" data-k="tag"></p>
    <p class="lead" data-k="lead"></p>
    <p class="promo" data-k="promo"></p>
  </div>

  <h2 data-k="installH"></h2>
  <p class="desk" id="desk" hidden><span data-k="desk"></span><br><a class="applink"></a></p>
  <div id="cards">
    <section class="card" id="ios">
      <h3>iPhone</h3>
      <div id="ios-tf" hidden>
        <p data-k="tf" style="margin:0"></p>
        <a class="btn" id="tf-btn" data-k="tfBtn"></a>
      </div>
      <ol id="ios-web">
        <li><span data-k="ios1"></span><br><a class="btn applink" data-k="openBtn"></a></li>
        <li data-k="ios2"></li>
        <li data-k="ios3"></li>
        <li data-k="ios4"></li>
      </ol>
    </section>
    <section class="card" id="android">
      <h3>Android</h3>
      <ol>
        <li><span data-k="and1"></span><br><a class="btn applink" data-k="openBtn"></a></li>
        <li data-k="and2"></li>
        <li data-k="and3"></li>
        <li data-k="and4"></li>
      </ol>
    </section>
  </div>

  <h2 data-k="askH"></h2>
  <ul class="ask">
    <li data-k="ask1"></li>
    <li data-k="ask2"></li>
    <li data-k="ask3"></li>
  </ul>
  <div class="mail"><a class="btn soft" id="mail" data-k="mail"></a><small id="mail-addr"></small></div>
</main>
<footer>
  <a href="../" data-k="home">Olimei</a>
  <a href="../privacy/" data-k="privacy"></a>
</footer>

var ORDER=['en','he','ar','de','fr','it','es','pt','ja','zh-Hans','zh-Hant'];

/* The reader's language: ?lang= first, then the browser's list; English
   when none of the eleven. The same rule as the coming-soon page. */
function pick(){
  var q=(location.search.match(/[?&]lang=([\w-]+)/)||[])[1];
  var c=[q].concat(navigator.languages||[navigator.language]);
  for(var i=0;i<c.length;i++){var l=(c[i]||'');if(!l)continue;
    if(T[l])return l;
    var b=l.split('-')[0].toLowerCase();
    if(b==='zh')return /hant|tw|hk|mo/i.test(l)?'zh-Hant':'zh-Hans';
    if(b==='iw')return 'he';
    if(T[b])return b;}
  return 'en';
}
/* iPadOS reports itself as a Mac; the touch points give it away */
function platform(){
  var ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return 'ios';
  if(/Android/.test(ua))return 'android';
  return 'other';
}
function paint(L){
  var t=T[L],root=document.documentElement;
  root.lang=L;root.dir=(L==='he'||L==='ar')?'rtl':'ltr';
  document.title='Olimei · '+t.tag;
  var els=document.querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute('data-k');if(t[k]!=null)els[i].innerHTML=t[k];}
  var sel=document.getElementById('lang');sel.value=L;
}
var P=platform(),L=pick();
/* the visitor's own phone first; on a computer, both, iPhone first, under a
   line saying to open this on the phone */
if(P==='android'){var c=document.getElementById('cards');c.insertBefore(document.getElementById('android'),c.firstChild);}
if(P==='other')document.getElementById('desk').hidden=false;
var links=document.querySelectorAll('.applink');
for(var i=0;i<links.length;i++){links[i].href=APP_URL;if(!links[i].getAttribute('data-k'))links[i].textContent=APP_URL;}
if(TESTFLIGHT_URL){
  document.getElementById('ios-tf').hidden=false;
  document.getElementById('ios-web').hidden=true;
  document.getElementById('tf-btn').href=TESTFLIGHT_URL;
}
var m=document.getElementById('mail');
m.href='mailto:'+MAIL+'?subject='+encodeURIComponent('Olimei feedback');
document.getElementById('mail-addr').textContent=MAIL;
var sel=document.getElementById('lang');
for(var j=0;j<ORDER.length;j++){var o=document.createElement('option');o.value=ORDER[j];o.textContent=T[ORDER[j]].name;sel.appendChild(o);}
sel.addEventListener('change',function(){
  try{history.replaceState(null,'','?lang='+sel.value);}catch(e){}
  paint(sel.value);
});
paint(L);
</script>
