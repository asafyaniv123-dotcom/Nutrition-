<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Better Me · המסך הראשון</title>
<style>
  :root{--bg:#efece8;--ink:#4a453f;--muted:#6d675e;
        --lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.28);--shd:rgba(176,168,156,.44)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Rubik,Arial,sans-serif}
  body{display:flex;flex-direction:column;align-items:center}
  header{padding:14px 16px 10px;text-align:center;flex:0 0 auto}
  h1{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.3px}
  p{margin:0 auto;font-size:12px;color:var(--muted);line-height:1.65;max-width:520px}
  .bar{display:flex;gap:8px;justify-content:center;margin-top:10px}
  button{border:none;border-radius:13px;padding:9px 15px;font-family:inherit;font-size:12.5px;
    font-weight:700;cursor:pointer;background:var(--bg);color:var(--ink);
    box-shadow:-3px -3px 6px var(--lit),3px 4px 8px var(--sh)}
  button:active{box-shadow:inset 2px 3px 6px var(--shd),inset -2px -2px 5px var(--lit)}
  .stage{flex:1 1 auto;width:100%;position:relative;overflow:hidden}
  .wrap{position:absolute;top:0;left:50%;width:430px;height:860px;transform-origin:top center}
  .ph{width:430px;height:860px;border-radius:46px;overflow:hidden;background:#000;
      box-shadow:0 0 0 11px #2c2c30,0 0 0 13px #4a4a50,0 26px 60px rgba(0,0,0,.26)}
  iframe{width:430px;height:860px;border:0;display:block;background:#e9e7e3}
</style></head>
<body>
  <header>
    <h1>המסך הראשון · Better&nbsp;Me</h1>
    <p>זה בדיוק מה שנפתח למי שנכנסת לאפליקציה בפעם הראשונה — חמישה מסכים, ואז היא בפנים.
       אפשר ללחוץ ולעבור אותם כרגיל. התגית DEV לא תופיע אצלה.</p>
    <div class="bar">
      <button onclick="restart()">להתחיל מהתחלה</button>
      <button onclick="window.open(SRC+'&t='+Date.now(),'_blank')">לפתוח בחלון מלא</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <div class="wrap" id="wrap"><div class="ph"><iframe id="f"></iframe></div></div>
  </div>
<script>
  var SRC='https://asafyaniv123-dotcom.github.io/Nutrition-/dev/?door=1';
  function restart(){ document.getElementById('f').src = SRC + '&t=' + Date.now(); }
  function fit(){
    var st=document.getElementById('stage'), w=document.getElementById('wrap');
    var s=Math.min(1,(st.clientHeight-24)/886, (st.clientWidth-24)/456);
    w.style.transform='translateX(-50%) scale('+s+')';
  }
  addEventListener('resize',fit); fit(); restart();
</script>
</body></html>
