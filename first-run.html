<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>Better Me · המסך הראשון</title>
<style>
  :root{--bg:#efece8;--ink:#4a453f;--muted:#6d675e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Rubik,Arial,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
  h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
  p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7;max-width:430px;text-align:center}
  .bar{display:flex;gap:8px}
  button{border:none;border-radius:13px;padding:10px 16px;font-family:inherit;font-size:12.5px;
    font-weight:700;cursor:pointer;background:var(--bg);color:var(--ink);
    box-shadow:-3px -3px 6px rgba(255,255,255,.95),3px 4px 8px rgba(176,168,156,.28)}
  button:active{box-shadow:inset 2px 3px 6px rgba(176,168,156,.44),inset -2px -2px 5px rgba(255,255,255,.95)}
  .ph{width:430px;height:860px;border-radius:46px;overflow:hidden;background:#000;flex:0 0 auto;
      box-shadow:0 0 0 11px #2c2c30,0 0 0 13px #4a4a50,0 30px 70px rgba(0,0,0,.28)}
  iframe{width:430px;height:860px;border:0;display:block;background:#e9e7e3}
  /* on a short screen the phone scales down rather than being cut off */
  @media (max-height:980px){ .ph{transform:scale(calc((100vh - 190px) / 860));transform-origin:top center;
      margin-bottom:calc((100vh - 190px) - 860px)} }
</style></head>
<body>
  <h1>המסך הראשון · Better&nbsp;Me</h1>
  <p>זה בדיוק מה שנפתח למי שמתקינה את האפליקציה בפעם הראשונה — חמישה מסכים, ואז היא בפנים.
     אפשר ללחוץ ולעבור אותם כרגיל. "להתחיל מהתחלה" מאפס ומחזיר לשאלה הראשונה.</p>
  <div class="bar">
    <button onclick="restart()">להתחיל מהתחלה</button>
    <button onclick="open(SRC,'_blank')">לפתוח בחלון מלא</button>
  </div>
  <div class="ph"><iframe id="f"></iframe></div>
<script>
  var SRC='https://asafyaniv123-dotcom.github.io/Nutrition-/dev/?door=1';
  function restart(){ document.getElementById('f').src = SRC + '&t=' + Date.now(); }
  restart();
</script>
</body></html>
