<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כפתורי השרירים</title>
<style>
:root{--page:#ebe9e5;--ink:#3b3632;--mut:#615b55;--line:#d9d5ce}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:26px;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 4px}
p{color:var(--mut);margin:0 0 12px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
figure{margin:0}
figure img{width:100%;max-width:390px;display:block;border-radius:22px;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<div class="wrap">
<h1>כפתורי השרירים בעיצוב שלנו</h1>
<p>עכשיו הכפתורים שטוחים ונבלעים ברקע. בעיצוב שלנו כפתור שלא נבחר בולט מהמשטח, כמו הלשונית "לפי שריר", וכפתור שנבחר לחוץ פנימה. בכל צילום "חזה" נבחר, כדי שיראו את שני המצבים. השם מודגש כמו בלשוניות. אלה צילומים של המסך האמיתי, ו-dev לא השתנה.</p>
<div class="grid">
<figure><h2>א · כפתור בולט</h2><p>הכפתור בולט מהמשטח; העיגול כמו היום.</p><img src="muscle-buttons/a.png" alt=""></figure>
<figure><h2>ב · כפתור בולט, העיגול בגומה</h2><p>כמו א, והעיגול יושב בגומה לחוצה - "אור בתוך ערוץ לחוץ".</p><img src="muscle-buttons/b.png" alt=""></figure>
<figure><h2>מה שיש עכשיו ב-dev</h2><p>להשוואה.</p><img src="muscle-buttons/now.png" alt=""></figure>
</div>
</div>
</body>
</html>
