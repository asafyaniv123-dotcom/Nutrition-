<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אנימציות תרגילים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap">
<style>
/* THE EXERCISE ANIMATIONS, started over on 6 Nov (Asaf). Per exercise: he sends two pictures,
   they are copied in the app's style, he approves the two frames, and the animation is a GIF
   that only moves between them. progress.json says where each exercise stands; the checklist
   is every exercise in data/exercises.json, so none can be missed. The earlier sheets are a
   draft in drafts/exercise-sheets-v1/. */
:root{--ground:#140f0c;--card:#1d1612;--line:#33261d;--ink:#f2e2c8;--soft:#c2a98c;--amber:#e8a24e;--ok:#9cc37a;--wait:#8a7560;
  --f:Assistant,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
main>*,article>*,section{min-width:0}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--f);overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
main{max-width:760px;margin:0 auto;display:grid;gap:28px}
h1{margin:0;font-size:1.6rem}
h2{margin:0;font-size:1.25rem}
.lead{margin:0;color:var(--soft)}
.count{display:grid;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber)}
.feed{display:grid;gap:24px}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;scroll-margin-top:12px}
article header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
article h3{margin:0;font-size:1.2rem}
.sub{color:var(--soft);font-size:.9rem}
.pending{color:var(--amber);font-size:.85rem;border:1px solid var(--amber);border-radius:999px;padding:0 10px}
.anim{width:100%;max-width:540px;aspect-ratio:1;margin-inline:auto;display:block;border-radius:8px;background:#000}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.frames figure{margin:0;display:grid;gap:4px}
.frames img{width:100%;height:auto;display:block;border-radius:6px}
.frames figcaption{font-size:.8rem;color:var(--soft)}
details.group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.group>summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-weight:600}
details.group>summary span{color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:10px 0 2px;padding:0;display:grid;gap:4px}
li{display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:baseline}
li .st{text-align:center}
li .id{color:var(--wait);font-size:.8rem;font-variant-numeric:tabular-nums}
li.done{color:var(--ok)} li.frames{color:var(--amber)} li.waiting{color:var(--soft)}
li a{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--soft)}
</style>
</head>
<body>
<main>
<header style="display:grid;gap:10px">
  <h1>אנימציות תרגילים</h1>
  <p class="lead">לכל תרגיל: שתי תמונות בעיצוב שלנו, ואנימציה שעוברת ביניהן.</p>
  <div class="count"><div id="count" class="lead"></div><div class="bar"><i id="bar" style="width:0"></i></div></div>
</header>
<section style="display:grid;gap:14px"><h2>תרגילים</h2><div id="feed" class="feed"><p class="lead">טוען…</p></div></section>
<section style="display:grid;gap:10px">
  <h2>צ'ק ליסט</h2>
  <div class="legend"><span>✓ מוכן</span><span>◐ פריימים מחכים לאישור</span><span>○ מחכה לתמונות</span></div>
  <div id="check" style="display:grid;gap:8px"></div>
</section>
</main>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MARK = { done: '✓', frames: '◐', waiting: '○' };
/* a fresh fetch every time: Pages caches for ten minutes, and this page is read right after a change */
const get = (u) => fetch(u, { cache: 'no-store' }).then((r) => r.json());
Promise.all([get('../data/exercises.json'), get('progress.json')]).then(([lib, prog]) => {
  const ex = lib.exercises, st = (e) => (prog[e.id] && prog[e.id].status) || 'waiting';
  const done = ex.filter((e) => st(e) === 'done');
  document.getElementById('count').textContent = `${done.length} מתוך ${ex.length} תרגילים מוכנים`;
  document.getElementById('bar').style.width = (100 * done.length / ex.length) + '%';
  /* the files carry the date they were made, so a remade GIF is never served from an old cache */
  const f = (p, n) => `${p.dir}/${n}?v=${encodeURIComponent(p.date || '')}`;
  /* an exercise whose GIF waits for Asaf's approval is shown too, marked, so he can approve it here */
  const shown = ex.filter((e) => st(e) !== 'waiting');
  document.getElementById('feed').innerHTML = shown.length ? shown.map((e) => { const p = prog[e.id];
    return `<article id="${esc(e.id)}"><header><h3>${esc(e.n)}</h3><span class="sub">${esc(e.en)} · ${esc(e.id)}</span>${st(e) === 'frames' ? '<span class="pending">מחכה לאישור שלך</span>' : ''}</header>
      <img class="anim" src="${esc(f(p, 'anim.gif'))}" alt="${esc(e.n)}" loading="lazy">
      <div class="frames"><figure><img src="${esc(f(p, 'start.jpg'))}" alt="התחלה" loading="lazy"><figcaption>התחלה</figcaption></figure>
      <figure><img src="${esc(f(p, 'end.jpg'))}" alt="סוף" loading="lazy"><figcaption>סוף</figcaption></figure></div></article>`; }).join('')
    : '<p class="lead">עוד אין תרגיל.</p>';
  /* grouped by the exercise's first muscle, in the library's own order */
  const groups = new Map();
  for (const e of ex) { const g = (e.m && e.m[0]) || 'אחר'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(e); }
  document.getElementById('check').innerHTML = [...groups].map(([g, list]) => {
    const n = list.filter((e) => st(e) === 'done').length;
    return `<details class="group"><summary>${esc(g)}<span>${n} מתוך ${list.length}</span></summary><ul>${list.map((e) => { const s = st(e);
      const name = s === 'done' ? `<a href="#${esc(e.id)}">${esc(e.n)}</a>` : esc(e.n);
      return `<li class="${s}"><span class="st">${MARK[s]}</span><span>${name}</span><span class="id">${esc(e.id)}</span></li>`; }).join('')}</ul></details>`;
  }).join('');
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}).catch((err) => { document.getElementById('feed').innerHTML = `<p class="lead">שגיאה בטעינה: ${esc(err.message)}</p>`; });
</script>
</body>
</html>
