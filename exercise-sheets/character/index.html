<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>הדמות</title>
<style>
:root{--bg:#0b0805;--fg:#f3e6cf;--mut:#b9a888;--line:#3a2f20;--amber:#f2a14a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;overflow-x:hidden}
header{padding:16px 16px 4px}
h1{font-size:21px;margin:0}
p{color:var(--mut);margin:4px 0 0}
#stage{position:relative;width:100%;height:min(78vh,720px);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);pointer-events:none}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 16px 4px}
.bar button{background:#1c150d;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit}
.bar button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px;max-width:720px;margin:0 auto}
.refs img{width:100%;display:block;border-radius:6px}
.refs figcaption{color:var(--mut);font-size:13px}
figure{margin:0}
</style>
</head>
<body>
<header>
  <h1>הדמות</h1>
  <p>גוררים עם האצבע כדי לסובב 360°, צובטים כדי להתקרב.</p>
</header>
<div id="stage"><div id="msg">טוען את הדמות…</div></div>
<div class="bar">
  <button id="play" aria-pressed="true">תנועה</button>
  <button id="spin" aria-pressed="false">סיבוב אוטומטי</button>
  <button id="reset">מבט מקדימה</button>
</div>
<section class="refs">
  <figure><img src="EARLY-stand.jpg" alt=""><figcaption>3.11 - הרפרנס</figcaption></figure>
  <figure><img src="EARLY-bench.jpg" alt=""><figcaption>3.11</figcaption></figure>
  <figure><img src="EARLY-seated.jpg" alt=""><figcaption>3.11</figcaption></figure>
</section>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage'), msg = document.getElementById('msg');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0805);
const Q = new URLSearchParams(location.search);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0805);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableDamping = true; controls.rotateSpeed = 0.9;
controls.minDistance = 1.6; controls.maxDistance = 7;
controls.autoRotateSpeed = 2.2;

// The one material: translucent amber, brighter at the silhouette, light from inside.
const AMBER = new THREE.Color(0xff9a3c);
const body = new THREE.MeshStandardMaterial({ color: 0x1a0c03, emissive: AMBER, emissiveIntensity: 0.42, roughness: 0.7, transparent: true, opacity: 0.92 });
body.onBeforeCompile = (s) => {
  s.uniforms.rimColor = { value: new THREE.Color(0xffb565) };
  s.fragmentShader = s.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform vec3 rimColor;')
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float rim = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
      totalEmissiveRadiance += rimColor * pow(rim, 2.4) * 2.2;`);
};
scene.add(new THREE.HemisphereLight(0xffd2a0, 0x120a04, 0.6));
const key = new THREE.DirectionalLight(0xffc68a, 0.8); key.position.set(2, 4, 3); scene.add(key);

// a warm pool of light on a dark floor, like the 3 Nov frames
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.9, 64), new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.0 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
{ const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const r = g.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, 'rgba(255,150,60,.35)'); r.addColorStop(1, 'rgba(255,150,60,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256); floor.material.map = new THREE.CanvasTexture(c); floor.material.opacity = 1; floor.material.depthWrite = false; }

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.45, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function size() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();

let mixer, action, home;
const metal = new THREE.MeshStandardMaterial({ color: 0x15110d, roughness: 0.45, metalness: 0.6, emissive: 0xff8a2a, emissiveIntensity: 0.0 });
metal.onBeforeCompile = (s) => { s.fragmentShader = s.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
  float rim = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition))); totalEmissiveRadiance += vec3(1.0, 0.55, 0.18) * pow(rim, 3.0) * 1.4;`); };
function dumbbell() { const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.17, 16), metal); bar.rotation.z = Math.PI / 2; g.add(bar);
  for (const x of [-0.085, 0.085]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.035, 28), metal); p.rotation.z = Math.PI / 2; p.position.x = x; g.add(p); }
  return g; }
const grips = [];
new GLTFLoader().load('../3d/figure.glb', (g) => {
  const root = g.scene;
  root.traverse((o) => { if (o.isMesh) { o.material = body; o.frustumCulled = false; } });
  scene.add(root); root.updateMatrixWorld(true);
  for (const side of ['Left', 'Right']) { const hand = root.getObjectByName(side + 'Hand'), fore = root.getObjectByName(side + 'ForeArm');
    if (hand && fore) { const d = dumbbell(); scene.add(d); grips.push({ hand, fore, d }); } }
  const box = new THREE.Box3().setFromObject(root, true), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = 1.78 / sz.y; root.scale.multiplyScalar(s); root.position.set(-c.x * s, -box.min.y * s, -c.z * s);
  home = { pos: new THREE.Vector3(1.4, 1.05, 4.1), target: new THREE.Vector3(0, 0.92, 0) };
  camera.position.copy(home.pos); controls.target.copy(home.target);
  if (g.animations.length) { mixer = new THREE.AnimationMixer(root); action = mixer.clipAction(g.animations[0]); action.play();
    if (Q.has('t')) { mixer.setTime(+Q.get('t')); action.paused = true; } }
  else document.getElementById('play').hidden = true;
  msg.remove();
}, undefined, () => { msg.textContent = 'הדמות עוד לא עלתה'; });

document.getElementById('play').onclick = (e) => { if (!action) return; action.paused = !action.paused; e.target.setAttribute('aria-pressed', String(!action.paused)); };
document.getElementById('spin').onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.target.setAttribute('aria-pressed', String(controls.autoRotate)); };
document.getElementById('reset').onclick = () => { if (!home) return; camera.position.copy(home.pos); controls.target.copy(home.target); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const d = clock.getDelta(); if (mixer) mixer.update(d);
  for (const g of grips) { const P = g.hand.getWorldPosition(new THREE.Vector3()), F = g.fore.getWorldPosition(new THREE.Vector3());
    g.d.position.copy(P).addScaledVector(P.clone().sub(F).normalize(), 0.075); } controls.update(); composer.render(); });
</script>
</body>
</html>
