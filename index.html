<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תזונה">
<title>מעקב תזונה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#fbf7f2;font-family:-apple-system,sans-serif;color:#4a4340;direction:rtl;min-height:100vh}
button,input,textarea{font-family:inherit}
#header{background:linear-gradient(135deg,#f0eafa,#eaf5ee);padding:16px 14px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.drow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dbtn{background:rgba(255,255,255,.8);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:20px;color:#4a4340}
.dlbl{text-align:center}
.dlbl-today{font-size:9px;color:#a690cf;letter-spacing:.12em;margin-bottom:2px}
.dlbl-date{font-size:15px;font-weight:700}
.tabs{display:flex;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px}
.tab{flex:1;padding:7px;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s}
.tab.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.tab:not(.on){background:transparent;color:#a89e97}
#content{padding:12px 12px 80px;max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:20px;padding:16px 14px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.cttl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:12px;text-align:center}
.mcols{display:flex;justify-content:space-around;gap:6px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.mpct{font-size:9px;font-weight:700}
.mtr{width:34px;height:110px;background:#f2ede6;border-radius:17px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.mfi{width:100%;border-radius:17px;transition:height 0.6s cubic-bezier(.4,0,.2,1)}
.f0{background:linear-gradient(180deg,#c9bce0,#a690cf)}
.f1{background:linear-gradient(180deg,#f3b9a8,#e08a72)}
.f2{background:linear-gradient(180deg,#bfe0c7,#8fc79e)}
.f3{background:linear-gradient(180deg,#f6dfa0,#e8c162)}
.mval{font-size:11px;font-weight:700;color:#4a4340}
.mlbl{font-size:9px;color:#a89e97;margin-top:-2px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.pill{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 4px 12px rgba(200,180,160,.1)}
.pv{font-size:17px;font-weight:700}
.pl{font-size:9px;color:#a89e97;margin-top:2px}
.wcard{background:linear-gradient(135deg,#e8f4fd,#d6eaf8);border-radius:20px;padding:13px 14px;margin-bottom:11px}
.whd{display:flex;justify-content:space-between;margin-bottom:7px}
.wt{font-size:12px;font-weight:700;color:#5b8fa8}
.wn{font-size:12px;font-weight:700;color:#3a7ca5}
.wb{background:rgba(255,255,255,.5);border-radius:4px;height:8px;overflow:hidden;margin-bottom:9px}
.wf{height:100%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:4px;transition:width 0.7s cubic-bezier(.4,0,.2,1)}
.wbtns{display:flex;gap:5px}
.wadd{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:9px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;color:#3a7ca5}
.wreset{background:rgba(255,255,255,.5);border:none;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;color:#a89e97}
.qacard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.qatog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.qalbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.qaarro{font-size:14px;color:#a89e97;transition:transform .2s}
.qalist{padding:0 10px 12px}
.qbtn{width:100%;display:flex;align-items:center;gap:10px;background:#fbf7f2;border:none;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px;transition:background .15s}
.qbtn:active{background:#f0eafa}
.qemj{font-size:20px;flex-shrink:0}
.qnm{font-size:12.5px;font-weight:700;color:#4a4340}
.qds{font-size:10px;color:#a89e97;margin-top:1px}
.qkc{font-size:10px;font-weight:700;color:#a89e97;flex-shrink:0;text-align:left;line-height:1.3}
.confirm-card{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:14px;margin:0 10px 10px;border:2px solid #c9bce0}
.confirm-name{font-size:14px;font-weight:700;color:#4a4340;margin-bottom:4px}
.confirm-mac{font-size:11px;color:#a89e97;margin-bottom:12px}
.confirm-btns{display:flex;gap:8px}
.confirm-yes{flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.confirm-no{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97}
.srcard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.srtog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.srlbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.srbody{padding:0 10px 12px}
.srow{display:flex;gap:7px;margin-bottom:10px}
.srinp{flex:1;border:1.5px solid #f2ede6;border-radius:9px;padding:9px 11px;font-size:13px;direction:rtl;outline:none}
.srinp:focus{border-color:#a690cf}
.srbtn{background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
.sres{background:#fbf7f2;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;border:1.5px solid transparent}
.sres:active{border-color:#a690cf}
.srname{font-size:13px;font-weight:700;color:#4a4340;margin-bottom:2px}
.srmac{font-size:10px;color:#a89e97}
.spick{font-size:13px;font-weight:700;color:#4a4340;margin-bottom:8px;padding:8px 12px;background:#f0eafa;border-radius:10px}
.sgrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sgnm{width:80px;border:1.5px solid #f2ede6;border-radius:8px;padding:7px;font-size:13px;text-align:center;outline:none}
.mtbtn{width:100%;border:none;border-radius:16px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px}
.mtbtn.cl{background:#fff;color:#a690cf;box-shadow:0 4px 14px rgba(200,180,160,.1)}
.mtbtn.op{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;border-radius:16px 16px 0 0}
/* LIBRARY */
.lib-save-btn{width:100%;background:linear-gradient(135deg,#f0eafa,#eaf5ee);border:none;border-radius:11px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#a690cf;margin-bottom:8px}
.lib-save-btn.saved{background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff}
.lbtn{width:100%;display:flex;align-items:center;gap:10px;background:#fbf7f2;border:none;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px;transition:background .15s}
.lbtn:active{background:#f0eafa}
.lnm{font-size:12.5px;font-weight:700;color:#4a4340}
.lmac{font-size:10px;color:#a89e97;margin-top:1px}
.ldel{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:14px;padding:4px 6px;flex-shrink:0;margin-right:auto}
.mtform{background:#fff;border-radius:0 0 16px 16px;padding:13px;box-shadow:0 6px 14px rgba(200,180,160,.1);margin-bottom:7px}
.mtin{width:100%;border:1.5px solid #f2ede6;border-radius:9px;padding:9px 11px;font-size:13px;direction:rtl;outline:none;margin-bottom:9px}
.mtgr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.mtfl{font-size:9px;font-weight:700;margin-bottom:3px}
.mtnm{width:100%;border:1.5px solid #f2ede6;border-radius:7px;padding:6px 5px;font-size:13px;text-align:center;outline:none}
.addbtn{width:100%;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f2ede6}
.mn{font-size:13px;font-weight:700;color:#4a4340}
.ms{font-size:10.5px;color:#a89e97;margin-top:2px}
.mdl{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:3px 7px;flex-shrink:0}
.ltot{display:flex;justify-content:space-between;margin-top:9px;padding-top:7px;border-top:2px solid #f2ede6}
.hbrs{display:flex;gap:4px;align-items:flex-end;position:relative}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hbar{width:100%;border-radius:5px 5px 0 0;min-height:3px}
.hdt{font-size:8px;color:#a89e97;margin-top:5px;font-weight:700}
.hvl{font-size:8.5px;color:#a89e97;margin-bottom:3px;font-weight:700}
.tln{position:absolute;left:0;right:0;border-top:2px dashed #a690cf;pointer-events:none}
.tlb{font-size:8px;color:#a690cf;position:absolute;right:0;top:-12px;font-weight:700}
.avgbox{background:linear-gradient(135deg,#eef5ee,#f0eafa);border-radius:18px;padding:14px 16px}
.avgin{display:flex;justify-content:space-around}
.avgv{font-size:22px;font-weight:700}
.avgl{font-size:9.5px;color:#a89e97;margin-top:2px}

/* ── DAY SUMMARY STYLES ── */
.day-hero{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:22px;padding:28px 20px;margin-bottom:12px;text-align:center}
.day-hero-title{font-size:22px;font-weight:700;margin-bottom:4px}
.day-hero-sub{font-size:12px;color:#a89e97}
.start-btn{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;margin-top:16px;box-shadow:0 6px 20px rgba(166,144,207,.3)}
.done-badge{background:linear-gradient(135deg,#bfe0c7,#8fc79e);border-radius:16px;padding:14px;text-align:center;margin-top:16px}
.done-badge-txt{font-size:14px;font-weight:700;color:#fff}

/* Interview */
.interview-wrap{background:#fff;border-radius:22px;padding:22px 18px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.q-step{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:6px}
.q-text{font-size:17px;font-weight:700;color:#4a4340;margin-bottom:18px;line-height:1.4}
.stars-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.star-btn{font-size:32px;background:none;border:none;cursor:pointer;transition:transform .15s;filter:grayscale(1);opacity:.4}
.star-btn.sel{filter:none;opacity:1;transform:scale(1.15)}
.q-input{width:100%;border:1.5px solid #f2ede6;border-radius:12px;padding:12px 14px;font-size:14px;direction:rtl;outline:none;min-height:70px;resize:none;line-height:1.5}
.q-input:focus{border-color:#a690cf}
.q-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;margin-top:14px}
.q-skip{width:100%;background:none;border:none;padding:8px;font-size:12px;color:#a89e97;cursor:pointer;margin-top:4px}

/* Photo upload */
.photo-upload-area{border:2px dashed #c9bce0;border-radius:16px;padding:24px;text-align:center;cursor:pointer;margin-bottom:8px;background:#faf8ff;transition:border-color .2s}
.photo-upload-area:active{border-color:#a690cf;background:#f0eafa}
.photo-upload-icon{font-size:36px;margin-bottom:8px}
.photo-upload-txt{font-size:13px;color:#a89e97}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-title{font-size:15px;font-weight:700}
.cal-nav{background:rgba(255,255,255,.8);border:none;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#4a4340}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-lbl{font-size:9px;color:#a89e97;text-align:center;font-weight:700;padding-bottom:4px}
.cal-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;min-height:40px}
.cal-day.empty{visibility:hidden}
.cal-day.no-data{background:#f2ede6}
.cal-day.no-data .cal-day-num{font-size:11px;color:#a89e97;font-weight:700}
.cal-day.has-data{background:#f0eafa;border:2px solid #c9bce0}
.cal-day.has-data .cal-day-num{font-size:11px;color:#a690cf;font-weight:700;position:relative;z-index:2}
.cal-day.today-ring{border:2px solid #a690cf}
.cal-day-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.cal-day-num{font-size:11px;font-weight:700;position:relative;z-index:2}

/* Summary modal */
.summary-overlay{position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0 0 0 0}
.summary-sheet{background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px 18px 40px}
.summary-pull{width:40px;height:4px;background:#c9bce0;border-radius:2px;margin:0 auto 16px}
.summary-close{float:left;background:none;border:none;font-size:22px;color:#a89e97;cursor:pointer;line-height:1}
.summary-date{font-size:11px;color:#a89e97;text-align:center;margin-bottom:4px;clear:both}
.summary-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:16px}
.summary-img{width:100%;max-height:320px;object-fit:contain;border-radius:16px;margin-bottom:14px;background:#f2ede6}
.summary-section{margin-bottom:12px}
.summary-lbl{font-size:9px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:4px}
.summary-val{font-size:14px;color:#4a4340;line-height:1.5}
.summary-moment{font-size:15px;font-weight:700;color:#a690cf;font-style:italic;line-height:1.5;margin-bottom:12px;border-right:3px solid #a690cf;padding-right:10px}
.summary-macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.summary-macro{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.summary-macro-v{font-size:15px;font-weight:700}
.summary-macro-l{font-size:9px;color:#a89e97;margin-top:2px}
.stars-display{font-size:20px;letter-spacing:2px}

#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#4a4340;color:#fff;font-size:13px;font-weight:700;padding:9px 18px;border-radius:18px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="toast"></div>
<div id="header">
  <div class="drow">
    <button class="dbtn" id="btnPrev">&#8249;</button>
    <div class="dlbl">
      <div class="dlbl-today" id="todayLbl"></div>
      <div class="dlbl-date" id="dateLbl"></div>
    </div>
    <button class="dbtn" id="btnNext">&#8250;</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabToday">יומי</button>
    <button class="tab" id="tabHist">היסטוריה</button>
    <button class="tab" id="tabDay">יום</button>
  </div>
</div>
<div id="content"></div>

<script>
var TARGETS={kcal:1975,p:155,c:200,f:60,water:3000};
var PRESETS=[
  {idx:0,emoji:'\u{1F373}',name:'\u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05E8\u05D2\u05D9\u05DC\u05D4',desc:'2 \u05D1\u05D9\u05E6\u05D9\u05DD + \u05DC\u05D7\u05DD + \u05E8\u05D9\u05E7\u05D5\u05D8\u05D4 + \u05D9\u05E8\u05E7\u05D5\u05EA',kcal:304,p:18.5,c:29,f:12},
  {idx:1,emoji:'\u{1F357}',name:'\u05DE\u05E0\u05EA \u05E2\u05D5\u05E3-\u05D0\u05D5\u05E8\u05D6',desc:'150\u05D2 \u05E2\u05D5\u05E3 + 150\u05D2 \u05D0\u05D5\u05E8\u05D6/\u05D0\u05E4\u05D5\u05E0\u05D4/\u05D2\u05D6\u05E8',kcal:321,p:39,c:33,f:3.5},
  {idx:2,emoji:'\u{1F41F}',name:'\u05E4\u05D7\u05D9\u05EA \u05D8\u05D5\u05E0\u05D4',desc:'\u05D8\u05D5\u05E0\u05D4 \u05D1\u05DE\u05D9\u05DD',kcal:90,p:24,c:0,f:1},
  {idx:3,emoji:'\u{1F964}',name:'\u05E9\u05D9\u05D9\u05E7 \u05E4\u05E8\u05D5\u05DE\u05E7\u05E1',desc:'Herbalife Promax',kcal:190,p:25,c:18,f:1.5},
  {idx:4,emoji:'\u2615',name:'PRO \u05D9\u05D8\u05D1\u05EA\u05D4',desc:'350\u05DE\u05DC \u05E7\u05E4\u05D4/\u05E9\u05D5\u05E7\u05D5\u05DC\u05D3',kcal:135,p:25,c:8.5,f:0.75}
];

// Interview questions
var QUESTIONS=[
  {id:'mood',type:'stars',text:'\u05D0\u05D9\u05DA \u05D4\u05D9\u05D9\u05EA\u05D4 \u05D4\u05DE\u05D6\u05D2 \u05E9\u05DC\u05DA \u05D4\u05D9\u05D5\u05DD?'},
  {id:'body',type:'stars',text:'\u05D0\u05D9\u05DA \u05D4\u05D2\u05D5\u05E3 \u05E9\u05DC\u05DA \u05D4\u05E8\u05D2\u05D9\u05E9?'},
  {id:'moment',type:'text',text:'\u05DE\u05D4 \u05D4\u05D9\u05D4 \u05D4\u05E8\u05D2\u05E2 \u05D4\u05DB\u05D9 \u05D8\u05D5\u05D1 \u05E9\u05DC\u05DA \u05D4\u05D9\u05D5\u05DD?',placeholder:'\u05DB\u05EA\u05D5\u05D1 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DC\u05DA...'},

function todayStr(){ return new Date().toISOString().slice(0,10); }
function pct(v,m){ return Math.min(100,Math.round(v/m*100)); }
function fmtTime(){ return new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(s){
  var d=new Date(s+'T12:00:00');
  var days=['\u05E8\u05D0\u05E9\u05D5\u05DF','\u05E9\u05E0\u05D9','\u05E9\u05DC\u05D9\u05E9\u05D9','\u05E8\u05D1\u05D9\u05E2\u05D9','\u05D7\u05DE\u05D9\u05E9\u05D9','\u05E9\u05D9\u05E9\u05D9','\u05E9\u05D1\u05EA'];
  var mos=['\u05D9\u05E0\u05D5\u05D0\u05E8','\u05E4\u05D1\u05E8\u05D5\u05D0\u05E8','\u05DE\u05E8\u05E5','\u05D0\u05E4\u05E8\u05D9\u05DC','\u05DE\u05D0\u05D9','\u05D9\u05D5\u05E0\u05D9','\u05D9\u05D5\u05DC\u05D9','\u05D0\u05D5\u05D2\u05D5\u05E1\u05D8','\u05E1\u05E4\u05D8\u05DE\u05D1\u05E8','\u05D0\u05D5\u05E7\u05D8\u05D5\u05D1\u05E8','\u05E0\u05D5\u05D1\u05DE\u05D1\u05E8','\u05D3\u05E6\u05DE\u05D1\u05E8'];
  return days[d.getDay()]+', '+d.getDate()+' \u05D1'+mos[d.getMonth()];
}
function fmtMonthYear(d){ var mos=['\u05D9\u05E0\u05D5\u05D0\u05E8','\u05E4\u05D1\u05E8\u05D5\u05D0\u05E8','\u05DE\u05E8\u05E5','\u05D0\u05E4\u05E8\u05D9\u05DC','\u05DE\u05D0\u05D9','\u05D9\u05D5\u05E0\u05D9','\u05D9\u05D5\u05DC\u05D9','\u05D0\u05D5\u05D2\u05D5\u05E1\u05D8','\u05E1\u05E4\u05D8\u05DE\u05D1\u05E8','\u05D0\u05D5\u05E7\u05D8\u05D5\u05D1\u05E8','\u05E0\u05D5\u05D1\u05DE\u05D1\u05E8','\u05D3\u05E6\u05DE\u05D1\u05E8']; return mos[d.getMonth()]+' '+d.getFullYear(); }

function loadLib(){ try{ var x=localStorage.getItem('my_meals'); return x?JSON.parse(x):[]; }catch(e){ return []; } }
function saveLib(arr){ try{ localStorage.setItem('my_meals',JSON.stringify(arr)); }catch(e){} }
function addMealToLib(meal){
  var lib=loadLib();
  // avoid duplicates by name
  if(lib.some(function(m){ return m.name===meal.name; })){ showToast('\u05DB\u05D1\u05E8 \u05E7\u05D9\u05D9\u05DD \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4'); return; }
  lib.push({name:meal.name,kcal:meal.kcal,p:meal.p,c:meal.c,f:meal.f});
  lib.sort(function(a,b){ return a.name.localeCompare(b.name,'he'); });
  saveLib(lib); showToast('\u2713 \u05E0\u05E9\u05DE\u05E8 \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4!');
}

function doSearch(){
  var inp=document.getElementById('srinp'); if(!inp) return;
  var q=inp.value.trim(); if(!q) return;
  var list=document.getElementById('srlist');
  if(list) list.innerHTML='<div style="font-size:12px;color:#a89e97;padding:8px">\u05DE\u05D7\u05E4\u05E9...</div>';
  fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&action=process&json=1&page_size=10&fields=product_name,product_name_he,nutriments')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var prods=(data.products||[]).filter(function(p){ return p.nutriments&&p.nutriments['energy-kcal_100g']>0; }).slice(0,7);
      var list2=document.getElementById('srlist'); if(!list2) return;
      if(!prods.length){ list2.innerHTML='<div style="font-size:12px;color:#a89e97;padding:8px">\u05DC\u05D0 \u05E0\u05DE\u05E6\u05D0\u05D5. \u05E0\u05E1\u05D4 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA.</div>'; return; }
      var html=''; window._srfoods=prods;
      prods.forEach(function(p,i){
        var nm=p.product_name_he||p.product_name||'\u05DE\u05D5\u05E6\u05E8'; nm=nm.length>40?nm.slice(0,40)+'...':nm;
        var kc=Math.round(p.nutriments['energy-kcal_100g']||0),pr=Math.round(p.nutriments.proteins_100g||0),cb=Math.round(p.nutriments.carbohydrates_100g||0),ft=Math.round(p.nutriments.fat_100g||0);
        html+='<div class="sres" onclick="selectFood('+i+','+kc+','+pr+','+cb+','+ft+')"><div class="srname">'+nm+'</div><div class="srmac">'+kc+' \u05E7\u05E7&quot;\u05DC/100\u05D2 &middot; '+pr+'\u05D7 '+cb+'\u05E4 '+ft+'\u05E9</div></div>';
      });
      list2.innerHTML=html;
    })
    .catch(function(){ var l=document.getElementById('srlist'); if(l) l.innerHTML='<div style="font-size:12px;color:#e08a72;padding:8px">\u05E9\u05D2\u05D9\u05D0\u05D4. \u05D1\u05D3\u05D5\u05E7 \u05D7\u05D9\u05D1\u05D5\u05E8.</div>'; });
}
function selectFood(i,kc,pr,cb,ft){

function startInterview(){
  interviewStep=0; interviewAnswers={}; render();
  window.scrollTo(0,0);
}
function starSelect(n){ interviewAnswers[QUESTIONS[interviewStep].id]=n; renderStars(n); }
function renderStars(selected){
  document.querySelectorAll('.star-btn').forEach(function(btn,i){
    btn.classList.toggle('sel',i<selected);
  });
}
function nextQuestion(){
  var q=QUESTIONS[interviewStep];
  if(q.type==='stars'){
    if(!interviewAnswers[q.id]){ showToast('\u05D1\u05D7\u05E8 \u05DB\u05D5\u05DB\u05D1'); return; }
  } else if(q.type==='text'){
    var inp=document.getElementById('q-inp');
    if(inp) interviewAnswers[q.id]=inp.value.trim();
  } else if(q.type==='photo'){
    // photo already stored in interviewAnswers via file input
  }
  interviewStep++;
  if(interviewStep>=QUESTIONS.length){
    finishInterview();
  } else {
    render(); window.scrollTo(0,0);
  }
}
function skipQuestion(){
  interviewStep++;
  if(interviewStep>=QUESTIONS.length){ finishInterview(); }
  else { render(); window.scrollTo(0,0); }
}
function finishInterview(){
  var day=loadDay(curDate);
  var tot={kcal:0,p:0,c:0,f:0};
  (day.meals||[]).forEach(function(m){ tot.kcal+=m.kcal||0; tot.p+=m.p||0; tot.c+=m.c||0; tot.f+=m.f||0; });
  var summary={
    date:curDate,
    mood:interviewAnswers.mood||0,
    body:interviewAnswers.body||0,
    moment:interviewAnswers.moment||'',
    flow:interviewAnswers.flow||'',
    workout:interviewAnswers.workout||'',
    photo:interviewAnswers.photo||'',
    song:interviewAnswers.song||'',
    quote:interviewAnswers.quote||'',
    kcal:Math.round(tot.kcal),
    p:Math.round(tot.p),
    c:Math.round(tot.c),
    f:Math.round(tot.f),
    water:day.water||0
  };
  saveSummary(curDate,summary);
  interviewStep=99;
  render();
}
function handlePhotoUpload(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      // Compress to max 600px on longest side, quality 0.7
      var MAX=600;
      var w=img.width, h=img.height;
      var scale=Math.min(MAX/w, MAX/h, 1);
      var cw=Math.round(w*scale), ch=Math.round(h*scale);
      var canvas=document.createElement('canvas');
      canvas.width=cw; canvas.height=ch;
      canvas.getContext('2d').drawImage(img,0,0,cw,ch);
      var compressed=canvas.toDataURL('image/jpeg',0.72);
      interviewAnswers.photo=compressed;
      var prev=document.getElementById('photo-prev');
      var area=document.getElementById('photo-area');
      if(prev){ prev.src=compressed; prev.style.display='block'; }
      if(area) area.style.display='none';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

  if(q.type==='stars'){
    var cur=interviewAnswers[q.id]||0;
    html+='<div class="stars-row">';
    for(var i=1;i<=5;i++) html+='<button class="star-btn'+(i<=cur?' sel':'')+'" onclick="starSelect('+i+')">\u2605</button>';
    html+='</div>';

function renderCalendar(){
  var year=calMonth.getFullYear(); var month=calMonth.getMonth();
  var firstDay=new Date(year,month,1).getDay(); // 0=Sun
  var daysInMonth=new Date(year,month+1,0).getDate();
  var today=todayStr();
  var dayLabels=['\u05D0','\u05D1','\u05D2','\u05D3','\u05D4','\u05D5','\u05E9'];
  var html='<div class="card"><div class="cal-header"><button class="cal-nav" onclick="calPrev()">&#8249;</button><div class="cal-title">'+fmtMonthYear(calMonth)+'</div><button class="cal-nav" onclick="calNext()">&#8250;</button></div>';
  html+='<div class="cal-grid">';
  dayLabels.forEach(function(l){ html+='<div class="cal-day-lbl">'+l+'</div>'; });
  // Empty cells before first day
  for(var e=0;e<firstDay;e++) html+='<div class="cal-day empty"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var ds=year+'-'+(month<9?'0':'')+(month+1)+'-'+(day<10?'0':'')+day;
    var sum=loadSummary(ds);
    var isToday=(ds===today);
    var cls='cal-day';
    if(sum) cls+=' has-data'; else cls+=' no-data';
    if(isToday) cls+=' today-ring';
    html+='<div class="'+cls+'" onclick="'+( sum?'openSummary(\''+ds+'\')':'')+'\">';
    if(sum&&sum.photo) html+='<img class="cal-day-img" src="'+sum.photo+'">';
    html+='<span class="cal-day-num">'+day+'</span>';
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

function parseFlow(text){
  if(!text) return [];
  // Split by arrows, commas, "אחר כך", "ואז"
  var parts=text.split(/,|←|→|➜|➝|\u05D0\u05D7\u05E8 \u05DB\u05DA|\u05D5\u05D0\u05D6|\n/);
  return parts.map(function(p){ return p.trim(); }).filter(function(p){ return p.length>0; });
}

    h+='<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">';
    flowStops.forEach(function(stop,i){
      h+='<div style="background:linear-gradient(135deg,#f0ebe3,#e8e0f5);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600">'+stop+'</div>';
      if(i<flowStops.length-1) h+='<div style="color:#a89e97;font-size:15px">\u2192</div>';
    });
    h+='</div></div>';
  }

  // NUTRITION BARS
  var kcalPct=Math.min(100,Math.round(sum.kcal/1975*100));
  var pPct=Math.min(100,Math.round(sum.p/155*100));
  var cPct=Math.min(100,Math.round(sum.c/200*100));
  var fPct=Math.min(100,Math.round(sum.f/60*100));
  h+='<div style="background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.1)">';
  h+='<div style="font-size:9.5px;color:#a89e97;letter-spacing:.1em;margin-bottom:12px">\u05EA\u05D6\u05D5\u05E0\u05D4 \u05D9\u05D5\u05DE\u05D9\u05EA</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">';
  var mbars=[
    {v:sum.kcal,pct:kcalPct,lbl:'\u05E7\u05E7"\u05DC',grad:'linear-gradient(180deg,#c9bce0,#a690cf)',col:'#a690cf'},
    {v:sum.p+'g',pct:pPct,lbl:'\u05D7\u05DC\u05D1\u05D5\u05DF',grad:'linear-gradient(180deg,#f3b9a8,#e08a72)',col:'#e08a72'},
    {v:sum.c+'g',pct:cPct,lbl:'\u05E4\u05D7\u05DE\u05D9\u05DE\u05D4',grad:'linear-gradient(180deg,#bfe0c7,#8fc79e)',col:'#8fc79e'},
    {v:sum.f+'g',pct:fPct,lbl:'\u05E9\u05D5\u05DE\u05DF',grad:'linear-gradient(180deg,#f6dfa0,#e8c162)',col:'#e8c162'}
  ];
  mbars.forEach(function(b){
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:4px">';
    h+='<div style="width:26px;height:72px;background:#f2ede6;border-radius:13px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">';
    h+='<div style="width:100%;height:'+b.pct+'%;background:'+b.grad+';border-radius:13px;min-height:'+(b.pct>0?3:0)+'px"></div></div>';
    h+='<div style="font-size:10.5px;font-weight:700;color:#4a4340">'+b.v+'</div>';
    h+='<div style="font-size:9px;color:#a89e97">'+b.lbl+'</div>';
    h+='<div style="font-size:9px;color:'+b.col+'">'+b.pct+'%</div>';
    h+='</div>';
  });
  h+='</div>';
  if(sum.water){
    var wp=Math.min(100,Math.round(sum.water/3000*100));
    h+='<div style="margin-top:10px;display:flex;align-items:center;gap:8px">';
    h+='<div style="font-size:11px;color:#5b8fa8">\u{1F4A7} \u05DE\u05D9\u05DD</div>';
    h+='<div style="flex:1;height:6px;background:#f2ede6;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+wp+'%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:3px"></div></div>';
    h+='<div style="font-size:10px;color:#5b8fa8">'+sum.water+'\u05DE"\u05DC</div>';
    h+='</div>';
  }
  h+='</div>';

  // WORKOUT
  if(sum.workout){
    h+='<div style="background:#fff;border-radius:18px;padding:13px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.1);display:flex;align-items:center;gap:12px">';
    h+='<div style="font-size:24px">\u{1F3CB}\uFE0F</div>';
    h+='<div><div style="font-size:9.5px;color:#a89e97;letter-spacing:.1em">\u05E4\u05E2\u05D9\u05DC\u05D5\u05EA \u05D2\u05D5\u05E4\u05E0\u05D9\u05EA</div><div style="font-size:13px;font-weight:600;margin-top:3px">'+sum.workout+'</div></div>';
    h+='</div>';
  }

  // SONG
  if(sum.song){
    h+='<div style="background:linear-gradient(135deg,#e8e0f5,#dff0e3);border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px">';
    h+='<div style="font-size:28px">\u{1F3B5}</div>';
    h+='<div><div style="font-size:9.5px;color:#8fc79e;letter-spacing:.1em">\u05E9\u05D9\u05E8 \u05E9\u05DC \u05D4\u05D9\u05D5\u05DD</div><div style="font-size:15px;font-weight:700;margin-top:2px">'+sum.song+'</div></div>';
    h+='</div>';
  }

  // QUOTE
  if(sum.quote){
    h+='<div style="border-right:3px solid #a690cf;padding:10px 14px;background:rgba(201,188,224,.09);border-radius:0 14px 14px 0;margin-bottom:12px">';
    h+='<div style="font-size:9.5px;color:#a89e97;letter-spacing:.1em;margin-bottom:5px">\u05DE\u05E9\u05E4\u05D8 \u05E9\u05EA\u05E4\u05E1</div>';
    h+='<div style="font-size:13.5px;line-height:1.7;font-style:italic;color:#4a4340">&#8220;'+sum.quote+'&#8221;</div>';
    h+='</div>';
  }

  h+='<div style="text-align:center;font-size:10.5px;color:#a89e97;margin-top:8px">\u{1F331} \u05D9\u05D5\u05DD \u05DE\u05D5\u05E6\u05DC\u05D7</div>';
  h+='</div></div>';
  var ov=document.createElement('div');
  ov.innerHTML=h;
  document.body.appendChild(ov.firstChild);
}

function render(){
  // Remove any existing overlay
  var existing=document.querySelector('.summary-overlay');
  if(existing) existing.remove();
  var isToday=curDate===todayStr();
  document.getElementById('todayLbl').textContent=isToday?'\u05D4\u05D9\u05D5\u05DD':'';
  document.getElementById('dateLbl').textContent=fmtDate(curDate);
  document.getElementById('btnNext').style.opacity=isToday?'0.2':'1';
  if(curTab==='today') renderToday();
  else if(curTab==='history') renderHistory();
  else renderDayTab();
}

document.getElementById('btnPrev').onclick=function(){ goDay(-1); };
document.getElementById('btnNext').onclick=function(){ goDay(1); };
document.getElementById('tabToday').onclick=function(){ setTab('today'); };
document.getElementById('tabHist').onclick=function(){ setTab('history'); };
document.getElementById('tabDay').onclick=function(){ setTab('day'); };
render();
</script>
</body>
</html>
