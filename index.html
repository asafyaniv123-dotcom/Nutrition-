<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>&#x05EA;&#x05D6;&#x05D5;&#x05E0;&#x05D4;</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik+Marker+Hand&family=Heebo:wght@400;500;600;700&display=swap');
:root{
  --paper:#faf5e6;
  --dot:rgba(93,78,54,.20);
  --card:#fffdf7;
  --ruled:rgba(217,130,47,.08);
  --border:#e6dbc0;
  --ink:#2e2822;
  --muted:#8a8073;
  --primary:#d9822f;
  --primary-lt:#e09e40;
  --primary-bg:#fbeada;
  --red:#c14a43;
  --red-lt:#dd8a85;
  --red-bg:rgba(221,138,133,.16);
  --green:#3f8f5f;
  --green-lt:#7fc79a;
  --green-bg:#e6f3ea;
  --gold:#c99a2e;
  --gold-lt:#e8cd85;
  --blue:#2b6a91;
  --blue-lt:#6fb0e0;
  --blue-bg:#eaf3fb;
  --panel:#f7f0dc;
  --shadow:2px 3px 0 rgba(46,40,34,.05),0 6px 16px rgba(120,95,50,.08);
  --dots:radial-gradient(circle at 1px 1px,var(--dot) 1.3px,transparent 0) 0 0/22px 22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dots),var(--paper);color:var(--ink);direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 100px;display:none;position:relative}
.hdr-userbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hdr-username{font-size:11px;color:var(--muted);font-weight:600}
.hdr-logout{background:none;border:none;color:var(--primary);font-weight:700;font-size:11px;cursor:pointer;padding:2px 4px;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:2px}
.auth-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px 16px;background:var(--dots),var(--paper)}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:32px 24px 28px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative}
.auth-card::before{content:'';position:absolute;top:-8px;right:22px;left:22px;height:14px;background-image:radial-gradient(circle,var(--paper) 3.6px,transparent 4px),radial-gradient(circle,#b6ad98 2px,transparent 2.4px);background-size:26px 14px,26px 14px;background-repeat:repeat-x}
.auth-logo{text-align:center;margin-bottom:10px}.auth-logo img{width:72px;height:72px;border-radius:20px;box-shadow:var(--shadow)}
.auth-title{text-align:center;font-size:23px;font-weight:700;margin-bottom:4px;font-family:'Rubik Marker Hand',cursive;color:var(--primary);letter-spacing:.02em}
.auth-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px}
.auth-tabs{display:flex;gap:4px;background:var(--primary-bg);border-radius:10px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px 4px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.auth-tab.on{background:var(--primary);color:#fff}
.auth-field{margin-bottom:12px}
.auth-lbl{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;display:block}
.auth-err{background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;border-radius:8px;padding:9px 12px;margin-bottom:12px;text-align:center;border:1.5px dashed var(--red-lt)}
.auth-btn{width:100%;background:var(--primary);border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;margin-top:6px;box-shadow:2px 2px 0 rgba(46,40,34,.18)}
.auth-btn:disabled{opacity:.6}
.hdr{background:linear-gradient(180deg,#fffdf7,var(--paper) 90%);padding:18px 16px 12px;position:sticky;top:0;z-index:10;border-bottom:2px dashed var(--border)}
.hdr::before{content:'';display:block;height:12px;margin:-18px -16px 10px;background-image:radial-gradient(circle,var(--paper) 3.6px,transparent 4px),radial-gradient(circle,#b6ad98 2px,transparent 2.4px);background-size:24px 12px,24px 12px;background-repeat:repeat-x}
.hdr-date{text-align:center;font-size:11px;color:var(--muted);margin-bottom:2px}
.hdr-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rubik Marker Hand',cursive;color:var(--ink)}
.hdr-nav{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nav-arrow{background:var(--card);border:1px solid var(--border);border-radius:9px;width:34px;height:34px;flex-shrink:0;font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:10px;padding:4px;flex:1;min-width:0}
.tab{flex:1;padding:7px 4px;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab.on{background:var(--primary);color:#fff}
.content{padding:14px 14px 0;position:relative}
.content::before{content:'';position:absolute;top:0;bottom:0;right:20px;width:1px;background:rgba(193,74,67,.22);pointer-events:none}
.macro-card{background:repeating-linear-gradient(to bottom,transparent,transparent 26px,var(--ruled) 27px),var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:12px}
.macro-title{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:700;text-align:center;margin-bottom:14px}
.macro-bars{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.macro-col{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px}
.macro-pct{font-size:10px;color:var(--muted);font-weight:600}
.macro-track{width:26px;height:80px;background:var(--primary-bg);border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--border)}
.macro-fill{width:100%;height:0%;border-radius:8px;position:absolute;bottom:0;transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.macro-val{font-size:13px;font-weight:700}
.macro-lbl{font-size:10px;color:var(--muted)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pill{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.pill-val{font-size:17px;font-weight:700}
.pill-lbl{font-size:9.5px;color:var(--muted);margin-top:2px}
.wcard{background:var(--blue-bg);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px dashed var(--blue-lt)}
.whd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wt{font-size:13px;font-weight:700;color:var(--blue)}
.wn{font-size:12px;color:var(--blue);font-weight:600;opacity:.85}
.wb{height:6px;background:rgba(255,255,255,.6);border-radius:3px;margin-bottom:10px;overflow:hidden}
.wf{height:100%;background:linear-gradient(90deg,var(--blue-lt),var(--blue));border-radius:3px;width:0%;transition:width .6s}
.wbtns{display:flex;gap:7px}
.wadd{flex:1;background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer}
.wreset{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:16px;cursor:pointer}
.qacard{background:var(--card);border-radius:14px;margin-bottom:11px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.qatog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.qalbl{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:700}
.qaarro{font-size:14px;color:var(--muted);transition:transform .2s}
.qalist{padding:0 10px 12px}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{flex:1;min-width:58px;padding:7px 4px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--muted)}
.cat-tab.on{background:var(--red);border-color:var(--red);color:#fff}
.comp-meal{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.comp-meal-info{flex:1}
.comp-meal-name{font-size:12.5px;font-weight:700;color:var(--ink)}
.comp-meal-mac{font-size:10px;color:var(--muted);margin-top:1px}
.comp-add-btn{background:var(--primary);border:none;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.comp-del-btn{background:none;border:none;cursor:pointer;color:var(--red-lt);font-size:16px;padding:3px 6px;flex-shrink:0}
.new-comp-btn{width:100%;background:var(--red-bg);border:1.5px dashed var(--red);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--red);margin-top:4px}
.lbtn{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px}
.lnm{font-size:12.5px;font-weight:700;color:var(--ink)}
.lmac{font-size:10px;color:var(--muted);margin-top:1px}
.ldel{background:none;border:none;cursor:pointer;color:var(--red-lt);font-size:14px;padding:4px 6px;margin-right:auto;flex-shrink:0}
.qkc{font-size:10px;font-weight:700;color:var(--muted);flex-shrink:0;text-align:left;line-height:1.3}
.confirm-card{background:var(--primary-bg);border-radius:12px;padding:14px;margin:0 0 10px;border:2px dashed var(--primary-lt)}
.confirm-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.confirm-mac{font-size:11px;color:var(--muted);margin-bottom:12px}
.confirm-btns{display:flex;gap:8px}
.confirm-yes{flex:1;background:var(--green);border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.confirm-no{flex:1;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.mtbtn{width:100%;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px}
.mtbtn.cl{background:var(--card);color:var(--primary);border:1px solid var(--border);box-shadow:var(--shadow)}
.mtbtn.op{background:var(--primary);color:#fff;border-radius:12px 12px 0 0}
.mtform{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:14px;box-shadow:var(--shadow)}
.mtin{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13px;direction:rtl;outline:none;margin-bottom:10px;background:#fff;color:var(--ink)}
.mtin:focus{border-color:var(--primary)}
.mtgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mtfl{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:3px;text-align:center}
.mtnm{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:7px 4px;font-size:13px;text-align:center;outline:none;background:#fff;color:var(--ink)}
.addbtn{width:100%;background:var(--green);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.lib-save-btn{width:100%;background:var(--primary-bg);border:1px dashed var(--primary-lt);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--primary);margin-bottom:8px}
.lib-save-btn.saved{background:var(--green);border-color:var(--green);color:#fff}
.log-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.log-title{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border)}
.log-item:last-child{border-bottom:none}
.log-name{font-size:12px;font-weight:600;color:var(--ink)}
.log-time{font-size:9.5px;color:var(--muted);margin-top:1px}
.log-kcal{font-size:13px;font-weight:700;color:var(--primary)}
.log-del{background:none;border:none;cursor:pointer;color:var(--red-lt);font-size:16px;padding:2px 6px}
.card{background:repeating-linear-gradient(to bottom,transparent,transparent 26px,var(--ruled) 27px),var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.cttl{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.avgbox{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.avgin{display:flex;justify-content:space-around}
.avgv{font-size:22px;font-weight:700}
.avgl{font-size:10px;color:var(--muted);margin-top:2px}
.cal-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-mn{font-size:13px;font-weight:700;font-family:'Rubik Marker Hand',cursive;color:var(--primary)}
.cal-nav{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{font-size:9px;color:var(--muted);text-align:center;padding:2px 0}
.cal-d{width:100%;aspect-ratio:1;border:none;border-radius:50%;background:none;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.cal-d.has{background:var(--primary-bg);border:1px dashed var(--primary-lt)}
.cal-d.today{font-weight:700;color:var(--primary)}
.cal-d.has-photo{padding:0;overflow:hidden}
.cal-d.has-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cal-d-dot{width:4px;height:4px;background:var(--primary);border-radius:50%;margin-top:1px}
.interview{padding:20px 16px;min-height:60vh;display:flex;flex-direction:column}
.q-num{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.q-text{font-size:21px;font-weight:700;margin-bottom:24px;line-height:1.4;font-family:'Rubik Marker Hand',cursive;color:var(--ink)}
.stars-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.star-btn{font-size:36px;background:none;border:none;cursor:pointer;opacity:.3;transition:opacity .15s}
.star-btn.sel{opacity:1}
.q-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-size:14px;direction:rtl;outline:none;resize:none;background:var(--card);min-height:90px;font-family:inherit;color:var(--ink)}
.q-input:focus{border-color:var(--primary)}
.q-next{width:100%;background:var(--primary);border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:16px;box-shadow:2px 2px 0 rgba(46,40,34,.18)}
.q-skip{width:100%;background:none;border:none;padding:10px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-style:dashed}
.photo-upload-area{border:2px dashed var(--primary-lt);border-radius:12px;padding:30px;text-align:center;cursor:pointer;margin-bottom:10px;background:var(--panel)}
.photo-preview{width:100%;max-height:200px;object-fit:contain;border-radius:12px;margin-bottom:10px;border:1px solid var(--border)}
.summary-overlay{position:fixed;inset:0;background:rgba(46,40,34,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.summary-sheet{background:var(--dots),var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px;position:relative;border-top:1px solid var(--border)}
.summary-pull{width:40px;height:4px;background:var(--primary-lt);border-radius:2px;margin:0 auto 14px}
.summary-close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--muted)}
.builder-overlay{position:fixed;inset:0;background:rgba(46,40,34,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.builder-sheet{background:var(--dots),var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px;border-top:1px solid var(--border)}
.builder-pull{width:40px;height:4px;background:var(--primary-lt);border-radius:2px;margin:0 auto 14px}
.builder-section{font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-weight:700;margin:12px 0 6px}
.bcat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.bcat-tab{flex:1;min-width:55px;padding:7px 3px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;background:var(--card);color:var(--muted)}
.bcat-tab.on{background:var(--red);border-color:var(--red);color:#fff}
.ing-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.ing-name{font-size:12px;font-weight:700;color:var(--ink)}
.ing-mac{font-size:9.5px;color:var(--muted)}
.ing-g{width:60px;border:1.5px solid var(--border);border-radius:7px;padding:5px;font-size:12px;text-align:center;outline:none;background:#fff;color:var(--ink)}
.ing-del{background:none;border:none;cursor:pointer;color:var(--red-lt);font-size:15px;padding:2px 5px}
.ing-total{background:var(--primary-bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12px;font-weight:700;text-align:center;color:var(--ink)}
.lib-pick-list{max-height:180px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;margin-bottom:8px}
.lib-pick-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:7px;cursor:pointer}
.lib-pick-item:active{background:var(--primary-bg)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:100;pointer-events:none}
/* ---- greet banner: date/time/greeting at the top of the app, flowing into tracking below ---- */
.greet-banner{position:relative;text-align:center}
.greet-photo{width:100%;height:200px;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 92%);mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 92%);transition:opacity .5s ease}
.greet-date{font-family:'Heebo',sans-serif;font-size:29px;color:var(--ink);font-weight:700;letter-spacing:.01em;margin-top:2px;direction:ltr}
.greet-time{font-family:'Heebo',sans-serif;font-size:19px;font-weight:500;color:var(--muted);margin:3px 0 7px;direction:ltr;letter-spacing:.02em}
.greet-msg{font-family:'Heebo',sans-serif;font-size:16px;font-weight:600;color:var(--primary);margin-bottom:16px;letter-spacing:.01em}
</style>
</head>
<body>
<div id="auth-screen" class="auth-screen"></div>
<div class="app">
  <div id="greet-banner" class="greet-banner"></div>
  <div class="hdr">
    <div class="hdr-userbar">
      <button class="hdr-logout" onclick="logout()">יציאה</button>
      <div class="hdr-username" id="hdr-username"></div>
    </div>
    <div class="hdr-date" id="hdr-date"></div>
    <div class="hdr-title" id="hdr-title"></div>
    <div class="hdr-nav">
      <button class="nav-arrow" id="btnPrev">&#8249;</button>
      <div class="tabs">
        <button class="tab" id="tab-day" onclick="switchTab('day')">יום</button>
        <button class="tab" id="tab-history" onclick="switchTab('history')">היסטוריה</button>
        <button class="tab on" id="tab-today" onclick="switchTab('today')">יומי</button>
      </div>
      <button class="nav-arrow" id="btnNext">&#8250;</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
var TARGETS={kcal:1975,p:155,c:200,f:60,water:3000};
var CATS=[
  ['breakfast','\u05D1\u05D5\u05E7\u05E8'],
  ['lunch','\u05E6\u05D4\u05E8\u05D9\u05D9\u05DD'],
  ['dinner','\u05E2\u05E8\u05D1'],
  ['snack','\u05E0\u05D9\u05E9\u05E0\u05D5\u05E9'],
  ['drinks','\u05DE\u05E9\u05E7\u05D0\u05D5\u05EA']

/* ---------- auth: accounts + login (client-side, localStorage-backed) ---------- */
var currentUser=null;
var authMode='login',authErr='';

function loadUsers(){try{var x=localStorage.getItem('users');return x?JSON.parse(x):[];}catch(e){return[];}}
function saveUsers(arr){try{localStorage.setItem('users',JSON.stringify(arr));}catch(e){}}
function findUser(name){
  var users=loadUsers();var ln=(name||'').trim().toLowerCase();
  for(var i=0;i<users.length;i++)if(users[i].username.toLowerCase()===ln)return users[i];
  return null;
}
function bufToHex(buf){var b=new Uint8Array(buf);var s='';for(var i=0;i<b.length;i++){var h=b[i].toString(16);s+=h.length<2?'0'+h:h;}return s;}
function randSalt(){
  if(window.crypto&&window.crypto.getRandomValues){var arr=new Uint8Array(16);crypto.getRandomValues(arr);return bufToHex(arr);}
  var s='';for(var i=0;i<32;i++)s+=Math.floor(Math.random()*16).toString(16);return s;
}
function simpleHash(str){
  var h=5381;
  for(var i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i);h=h&h;}
  return (h>>>0).toString(16);
}
function hashPassword(pw,salt){
  var input=salt+':'+pw;
  if(window.crypto&&window.crypto.subtle){
    try{
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(input)).then(bufToHex).catch(function(){return simpleHash(input);});
    }catch(e){}
  }
  return Promise.resolve(simpleHash(input));
}
function migrateLegacyData(username){
  var keys=Object.keys(localStorage);
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(/^day_\d{4}-\d{2}-\d{2}$/.test(k)){
      var v=localStorage.getItem(k);localStorage.setItem('day_'+username+'_'+k.slice(4),v);localStorage.removeItem(k);
    }else if(/^sum_\d{4}-\d{2}-\d{2}$/.test(k)){
      var v2=localStorage.getItem(k);localStorage.setItem('sum_'+username+'_'+k.slice(4),v2);localStorage.removeItem(k);
    }else if(k==='my_meals'){
      var v3=localStorage.getItem(k);localStorage.setItem('my_meals_'+username,v3);localStorage.removeItem(k);
    }else if(k==='composed_meals'){
      var v4=localStorage.getItem(k);localStorage.setItem('composed_meals_'+username,v4);localStorage.removeItem(k);
    }
  }
}

function setAuthMode(m){authMode=m;authErr='';renderAuth();}
function reRenderAuthKeepUser(){
  var uf=document.getElementById('auth-user');var uVal=uf?uf.value:'';
  renderAuth();
  var uf2=document.getElementById('auth-user');if(uf2)uf2.value=uVal;
}
function renderAuth(){
  var el=document.getElementById('auth-screen');if(!el)return;
  var h='<div class="auth-card">';
  h+='<div class="auth-logo"><img src="assets/logo.png" alt="תזונה"></div>';
  h+='<div class="auth-title">תזונה</div>';
  h+='<div class="auth-sub">'+(authMode==='signup'?'יצירת חשבון חדש':'התחברות לחשבון שלך')+'</div>';
  h+='<div class="auth-tabs">';
  h+='<button class="auth-tab'+(authMode==='login'?' on':'')+'" onclick="setAuthMode(\'login\')">כניסה</button>';
  h+='<button class="auth-tab'+(authMode==='signup'?' on':'')+'" onclick="setAuthMode(\'signup\')">הרשמה</button>';
  h+='</div>';
  if(authErr)h+='<div class="auth-err">'+esc(authErr)+'</div>';
  h+='<div class="auth-field"><span class="auth-lbl">שם משתמש</span><input id="auth-user" class="mtin" style="margin-bottom:0" autocomplete="username"></div>';
  h+='<div class="auth-field"><span class="auth-lbl">סיסמה</span><input id="auth-pass" type="password" class="mtin" style="margin-bottom:0" autocomplete="'+(authMode==='signup'?'new-password':'current-password')+'"></div>';
  if(authMode==='signup')h+='<div class="auth-field"><span class="auth-lbl">אימות סיסמה</span><input id="auth-pass2" type="password" class="mtin" style="margin-bottom:0" autocomplete="new-password"></div>';
  h+='<button class="auth-btn" id="auth-submit" onclick="'+(authMode==='signup'?'submitSignup()':'submitLogin()')+'">'+(authMode==='signup'?'יצירת חשבון':'כניסה')+'</button>';
  h+='</div>';
  el.innerHTML=h;
  var onEnter=function(e){if(e.key==='Enter'){if(authMode==='signup')submitSignup();else submitLogin();}};
  ['auth-user','auth-pass','auth-pass2'].forEach(function(id){var f=document.getElementById(id);if(f)f.onkeydown=onEnter;});
  var fu=document.getElementById('auth-user');if(fu)fu.focus();
}
function submitLogin(){
  authErr='';
  var u=(document.getElementById('auth-user').value||'').trim();
  var p=document.getElementById('auth-pass').value||'';
  if(!u||!p){authErr='נא למלא שם משתמש וסיסמה';reRenderAuthKeepUser();return;}
  var user=findUser(u);
  if(!user){authErr='משתמש לא נמצא';reRenderAuthKeepUser();return;}
  var btn=document.getElementById('auth-submit');if(btn){btn.disabled=true;btn.textContent='...';}
  hashPassword(p,user.salt).then(function(hash){
    if(hash===user.hash)loginAs(user.username);
    else{authErr='סיסמה שגויה';reRenderAuthKeepUser();}
  });
}
function submitSignup(){
  authErr='';
  var u=(document.getElementById('auth-user').value||'').trim();
  var p=document.getElementById('auth-pass').value||'';
  var p2=document.getElementById('auth-pass2').value||'';
  if(!u||u.length<2){authErr='שם משתמש קצר מדי';reRenderAuthKeepUser();return;}
  if(!/^[a-zA-Z0-9_א-ת]+$/.test(u)){authErr='שם משתמש יכול להכיל אותיות, ספרות וקו תחתון בלבד';reRenderAuthKeepUser();return;}
  if(p.length<4){authErr='הסיסמה חייבת להכיל לפחות 4 תווים';reRenderAuthKeepUser();return;}
  if(p!==p2){authErr='הסיסמאות אינן תואמות';reRenderAuthKeepUser();return;}
  if(findUser(u)){authErr='שם המשתמש כבר תפוס';reRenderAuthKeepUser();return;}
  var btn=document.getElementById('auth-submit');if(btn){btn.disabled=true;btn.textContent='...';}
  var salt=randSalt();
  hashPassword(p,salt).then(function(hash){
    var users=loadUsers();
    var isFirst=users.length===0;
    users.push({username:u,salt:salt,hash:hash,createdAt:Date.now()});
    saveUsers(users);
    if(isFirst)migrateLegacyData(u);
    loginAs(u);
  });
}
function loginAs(username){
  currentUser=username;
  try{localStorage.setItem('current_user',username);}catch(e){}
  authErr='';authMode='login';
  showApp(true);
  render();
  startGreetClock();
}
function logout(){
  currentUser=null;
  try{localStorage.removeItem('current_user');}catch(e){}
  authMode='login';authErr='';
  clearInterval(greetClock);greetClock=null;
  showApp(false);
  renderAuth();
}
function initAuth(){
  var saved=null;try{saved=localStorage.getItem('current_user');}catch(e){}
  if(saved&&findUser(saved)){
    currentUser=saved;
    showApp(true);
    render();
    startGreetClock();
  }else{
    currentUser=null;
    showApp(false);
    renderAuth();
  }
}

function renderGreetBanner(){
  var el=document.getElementById('greet-banner');if(!el)return;
  var now=new Date(),band=greetBand(now);
  var h='<div class="greet-photo" style="background-image:url('+GREET_IMG[band]+')"></div>';
  h+='<div class="greet-date">'+fmtGreetDate(now)+'</div>';
  h+='<div class="greet-time">'+fmtGreetTime(now)+'</div>';
  h+='<div class="greet-msg">'+greetMsg(band)+(currentUser?', '+esc(currentUser):'')+'</div>';
  el.innerHTML=h;
}
function startGreetClock(){
  renderGreetBanner();
  clearInterval(greetClock);
  greetClock=setInterval(renderGreetBanner,15000);
}

function addMealToLib(meal){
  var lib=loadLib();
  if(lib.some(function(m){return m.name===meal.name;})){showToast('\u05DB\u05D1\u05E8 \u05E7\u05D9\u05D9\u05DD \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4');return;}
  lib.push({name:meal.name,kcal:meal.kcal,p:meal.p,c:meal.c,f:meal.f});
  lib.sort(function(a,b){return a.name.localeCompare(b.name,'he');});
  saveLibData(lib);showToast('\u2713 \u05E0\u05E9\u05DE\u05E8 \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4!');
}
function removeFromLib(idx){var lib=loadLib();if(lib[idx]){var name=lib[idx].name;saveLibData(lib.filter(function(m){return m.name!==name;}));pendingLib=null;render();}}
function selectLib(idx){var lib=loadLib();if(lib[idx])pendingLib=lib[idx].name;render();}
function confirmLib(){
  if(!pendingLib)return;
  var lib=loadLib();var meal=lib.find(function(m){return m.name===pendingLib;});if(!meal){pendingLib=null;return;}
  var day=loadDay(curDate);
  day.meals.push({name:meal.name,kcal:meal.kcal,p:meal.p,c:meal.c,f:meal.f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);showToast('\u2713 '+meal.name+' \u05E0\u05D5\u05E1\u05E4\u05D4');pendingLib=null;render();
}
function cancelLib(){pendingLib=null;render();}
function toggleLib(){libOpen=!libOpen;pendingLib=null;render();}
function toggleComp(){compOpen=!compOpen;render();}
function setCompCat(c){compCat=c;render();}

function calcIng(ing){var m=ing.grams/100;return{kcal:Math.round(ing.kcal*m),p:Math.round(ing.p*m*10)/10,c:Math.round(ing.c*m*10)/10,f:Math.round(ing.f*m*10)/10};}
function calcComposed(meal){
  return meal.ingredients.reduce(function(a,ing){var v=calcIng(ing);return{kcal:a.kcal+v.kcal,p:Math.round((a.p+v.p)*10)/10,c:Math.round((a.c+v.c)*10)/10,f:Math.round((a.f+v.f)*10)/10};}  ,{kcal:0,p:0,c:0,f:0});
}
function addComposedToDay(id){
  var meals=loadComposed();var meal=meals.find(function(m){return m.id===id;});if(!meal)return;
  var tot=calcComposed(meal);var day=loadDay(curDate);
  day.meals.push({name:meal.name,kcal:tot.kcal,p:tot.p,c:tot.c,f:tot.f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);showToast('\u2713 '+meal.name+' \u05E0\u05D5\u05E1\u05E4\u05D4');render();
}
function deleteComposed(id){saveComposed(loadComposed().filter(function(m){return m.id!==id;}));render();}

function openBuilder(cat){
  builderCat=cat||'breakfast';builderName='';builderIngs=[];builderPickOpen=false;
  document.body.style.overflow='hidden';renderBuilderOverlay();
}
function closeBuilder(){document.body.style.overflow='';var ov=document.getElementById('builder-overlay');if(ov)ov.remove();}
function setBuildCat(c){builderCat=c;renderBuilderOverlay();}
function toggleBuilderPick(){builderPickOpen=!builderPickOpen;renderBuilderOverlay();}
function builderAddIng(idx){
  var lib=loadLib();var item=lib[idx];if(!item)return;
  builderIngs.push({name:item.name,kcal:item.kcal,p:item.p,c:item.c,f:item.f,grams:100});
  builderPickOpen=false;renderBuilderOverlay();
}
function builderUpdateGrams(i,v){
  if(builderIngs[i])builderIngs[i].grams=parseFloat(v)||0;
  var tot=calcBTotal();var el=document.getElementById('builder-total');
  if(el)el.textContent=tot.kcal+' \u05E7\u05E7"\u05DC \u00B7 '+tot.p+'\u05D7 '+tot.c+'\u05E4 '+tot.f+'\u05E9';
}
function calcBTotal(){
  return builderIngs.reduce(function(a,ing){var v=calcIng(ing);return{kcal:a.kcal+v.kcal,p:Math.round((a.p+v.p)*10)/10,c:Math.round((a.c+v.c)*10)/10,f:Math.round((a.f+v.f)*10)/10};}  ,{kcal:0,p:0,c:0,f:0});
}
function builderRemoveIng(i){builderIngs.splice(i,1);renderBuilderOverlay();}
function saveBuilderMeal(){
  var ne=document.getElementById('builder-name');if(ne)builderName=ne.value.trim();
  if(!builderName){alert('\u05E0\u05D0 \u05DC\u05EA\u05EA \u05E9\u05DD');return;}
  if(builderIngs.length===0){alert('\u05E0\u05D0 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05DE\u05E8\u05DB\u05D9\u05D1\u05D9\u05DD');return;}
  var meals=loadComposed();
  meals.push({id:Date.now(),name:builderName,category:builderCat,ingredients:builderIngs.slice()});
  saveComposed(meals);closeBuilder();showToast('\u2713 '+builderName+' \u05E0\u05E9\u05DE\u05E8\u05D4!');render();
}

function renderBuilderOverlay(){
  var old=document.getElementById('builder-overlay');if(old)old.remove();
  var lib=loadLib();var tot=calcBTotal();
  var div=document.createElement('div');div.id='builder-overlay';div.className='builder-overlay';
  div.onclick=function(e){if(e.target===div)closeBuilder();};
  var h='<div class="builder-sheet"><div class="builder-pull"></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div style="font-size:17px;font-weight:700">\u05D1\u05E0\u05D0\u05D9 \u05D0\u05E8\u05D5\u05D7\u05D4</div>';
  h+='<button onclick="closeBuilder()" style="background:none;border:none;font-size:22px;color:#8a8073;cursor:pointer">&times;</button></div>';
  h+='<div class="builder-section">\u05E9\u05DD</div>';
  h+='<input id="builder-name" class="mtin" placeholder="\u05E9\u05DD \u05D4\u05D0\u05E8\u05D5\u05D7\u05D4" value="" oninput="builderName=this.value">';
  h+='<div class="builder-section">\u05E7\u05D8\u05D2\u05D5\u05E8\u05D9\u05D4</div><div class="bcat-tabs">';
  for(var ci=0;ci<CATS.length;ci++){
    h+='<button class="bcat-tab'+(builderCat===CATS[ci][0]?' on':'')+'" onclick="setBuildCat(\''+CATS[ci][0]+'\')">'+CATS[ci][1]+'</button>';
  }
  h+='</div><div class="builder-section">\u05DE\u05E8\u05DB\u05D9\u05D1\u05D9\u05DD</div>';
  for(var ii=0;ii<builderIngs.length;ii++){
    var ing=builderIngs[ii];
    h+='<div class="ing-row"><div style="flex:1"><div class="ing-name">'+esc(ing.name)+'</div><div class="ing-mac">'+ing.kcal+' \u05E7\u05E7"\u05DC/100g</div></div>';
    h+='<input class="ing-g" type="number" value="'+ing.grams+'" oninput="builderUpdateGrams('+ii+',this.value)">';
    h+='<span style="font-size:10px;color:#8a8073">g</span>';
    h+='<button class="ing-del" onclick="builderRemoveIng('+ii+')">&times;</button></div>';
  }
  h+='<div class="ing-total" id="builder-total">'+tot.kcal+' \u05E7\u05E7"\u05DC &middot; '+tot.p+'\u05D7 '+tot.c+'\u05E4 '+tot.f+'\u05E9</div>';
  h+='<button onclick="toggleBuilderPick()" style="width:100%;background:'+(builderPickOpen?'#eaeef8':'rgba(118,144,207,.14)')+';border:1.5px dashed #34519e;border-radius:11px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;color:#34519e;margin-bottom:8px">+ \u05D4\u05D5\u05E1\u05E3 \u05DE\u05E8\u05DB\u05D9\u05D1 \u05DE\u05D4\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4</button>';
  if(builderPickOpen){
    h+='<div class="lib-pick-list">';
    if(lib.length===0)h+='<div style="font-size:12px;color:#8a8073;padding:10px;text-align:center">\u05D4\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4 \u05E8\u05D9\u05E7\u05D4 \u2014 \u05D4\u05D5\u05E1\u05E3 \u05D3\u05E8\u05DA "\u05D4\u05D5\u05E1\u05E4\u05D4 \u05D9\u05D3\u05E0\u05D9\u05EA"</div>';
    for(var li=0;li<lib.length;li++){
      h+='<div class="lib-pick-item" onclick="builderAddIng('+li+')">';
      h+='<div><div style="font-size:12.5px;font-weight:700">'+esc(lib[li].name)+'</div><div style="font-size:10px;color:#8a8073">'+lib[li].kcal+' \u05E7\u05E7"\u05DC/100g</div></div>';
      h+='<div style="font-size:12px;font-weight:700;color:#34519e">+ \u05D4\u05D5\u05E1\u05E3</div></div>';
    }
    h+='</div>';
  }
  h+='<button onclick="saveBuilderMeal()" style="width:100%;background:linear-gradient(135deg,#7fc79a,#3f8f5f);border:none;border-radius:13px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;margin-top:6px">\u05E9\u05DE\u05D5\u05E8 \u05D0\u05E8\u05D5\u05D7\u05D4 &#10003;</button>';
  h+='</div>';
  div.innerHTML=h;document.body.appendChild(div);
}

function addWater(ml){var d=loadDay(curDate);d.water=(d.water||0)+ml;saveDay(curDate,d);render();}
function resetWater(){var d=loadDay(curDate);d.water=0;saveDay(curDate,d);render();}
function toggleMan(){manOpen=!manOpen;render();}
function toggleSaveToLib(){

  if(btn){btn.className='lib-save-btn'+(saveToLib?' saved':'');btn.textContent=saveToLib?'\u2713 \u05D9\u05E9\u05DE\u05E8 \u05DC\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4':'\u05E9\u05DE\u05D5\u05E8 \u05DC\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4';}

function addManual(){
  var name=document.getElementById('mn')?document.getElementById('mn').value.trim():'';
  var kcal=document.getElementById('mk')?parseFloat(document.getElementById('mk').value)||0:0;
  if(!name||!kcal){alert('\u05E0\u05D0 \u05DC\u05DE\u05DC\u05D0 \u05E9\u05DD \u05D5\u05E7\u05DC\u05D5\u05E8\u05D9\u05D5\u05EA');return;}
  var p=parseFloat(document.getElementById('mp').value)||0;
  var c=parseFloat(document.getElementById('mc').value)||0;
  var f=parseFloat(document.getElementById('mf').value)||0;
  var meal={name:name,kcal:kcal,p:p,c:c,f:f};

function renderHistory(){
  var histTab=window._histTab||'intake';
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var s=d.toISOString().slice(0,10);
    var day=loadDay(s);var sum=loadSummary(s);
    var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
    var p=Math.round(day.meals.reduce(function(a,m){return a+(m.p||0);},0));
    var steps=sum?sum.steps||0:0;var tdee=steps>0?Math.round(2200+steps*0.04):0;
    var deficit=kcal>0&&tdee>0?tdee-kcal:0;
    var dt=new Date(s+'T12:00:00');
    days.push({date:s,kcal:kcal,p:p,deficit:deficit,label:dt.getDate()+'/'+(dt.getMonth()+1),isToday:s===todayStr()});
  }
  var active=days.filter(function(d){return d.kcal>0;});
  function makeSVG(series,refs,minV,maxV,h){
    var W=320,H=h||145,PL=40,PR=12,PT=14,PB=26,cW=W-PL-PR,cH=H-PT-PB;
    function xp(i){return PL+i*(cW/6);}function yp(v){return PT+cH*(1-(v-minV)/(maxV-minV));}
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
    for(var gi=0;gi<=4;gi++){var gv=minV+(maxV-minV)*gi/4;var gy=yp(gv);s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#ece2cb" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#a89a82">'+Math.round(gv)+'</text>';}
    for(var ri=0;ri<refs.length;ri++){var r=refs[ri];if(r.v>=minV&&r.v<=maxV){var ry=yp(r.v);s+='<line x1="'+PL+'" y1="'+ry+'" x2="'+(PL+cW)+'" y2="'+ry+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}}
    for(var si=0;si<series.length;si++){var ser=series[si];if(si===0&&ser.pts.length>1){var ap='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi=1;pi<ser.pts.length;pi++)ap+=' L'+xp(ser.pts[pi].i)+','+yp(ser.pts[pi].v);ap+=' L'+xp(ser.pts[ser.pts.length-1].i)+','+(PT+cH)+' L'+xp(ser.pts[0].i)+','+(PT+cH)+' Z';s+='<path d="'+ap+'" fill="'+ser.col+'" opacity="0.15"/>';}if(ser.pts.length>1){var lp='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi2=1;pi2<ser.pts.length;pi2++)lp+=' L'+xp(ser.pts[pi2].i)+','+yp(ser.pts[pi2].v);s+='<path d="'+lp+'" fill="none" stroke="'+ser.col+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}for(var dp=0;dp<ser.pts.length;dp++)s+='<circle cx="'+xp(ser.pts[dp].i)+'" cy="'+yp(ser.pts[dp].v)+'" r="4" fill="'+ser.col+'" stroke="#fff" stroke-width="2"/>';}
    for(var di=0;di<days.length;di++)s+='<text x="'+xp(di)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="'+(days[di].isToday?'#34519e':'#8a8073')+'" font-weight="'+(days[di].isToday?'700':'400')+'">'+days[di].label+'</text>';
    s+='</svg>';return s;
  }
  var tabs=[['intake','\u05E6\u05E8\u05D9\u05DB\u05D4 \u05D9\u05D5\u05DE\u05D9\u05EA'],['deficit','\u05D2\u05E8\u05E2\u05D5\u05DF \u05D0\u05DE\u05D9\u05EA\u05D9'],['cumulative','\u05DE\u05E6\u05D8\u05D1\u05E8']];
  var tabHTML='<div style="display:flex;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px;margin-bottom:12px">';
  for(var ti=0;ti<tabs.length;ti++){var on=histTab===tabs[ti][0];tabHTML+='<button onclick="window._histTab=\''+tabs[ti][0]+'\';renderHistory()" style="flex:1;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:'+(on?'linear-gradient(135deg,#7690cf,#34519e)':'transparent')+';color:'+(on?'#fff':'#8a8073')+'">'+tabs[ti][1]+'</button>';}
  tabHTML+='</div>';
  var chartCard='';
  if(histTab==='intake'){
    var kp=[];for(var ix=0;ix<days.length;ix++)if(days[ix].kcal>0)kp.push({i:ix,v:days[ix].kcal});
    var ak=days.map(function(d){return d.kcal;}).filter(function(v){return v>0;}).concat([TARGETS.kcal]);
    var minK=ak.length>1?Math.max(0,Math.min.apply(null,ak)-200):0,maxK=Math.max.apply(null,ak)+200;
    chartCard='<div class="card"><div class="cttl">\u05E6\u05E8\u05D9\u05DB\u05D4 \u05E7\u05DC\u05D5\u05E8\u05D9\u05EA \u05DE\u05D5\u05DC \u05D9\u05E2\u05D3</div>'+makeSVG([{pts:kp,col:'#c14a43'}],[{v:TARGETS.kcal,col:'#34519e',lbl:'\u05D9\u05E2\u05D3 '+TARGETS.kcal}],minK,maxK,150)+'<div style="display:flex;gap:14px;margin-top:8px;font-size:10px"><span style="color:#c14a43;font-weight:700">&#x25CF; \u05E7\u05DC\u05D5\u05E8\u05D9\u05D5\u05EA</span><span style="color:#34519e">-- \u05D9\u05E2\u05D3 '+TARGETS.kcal+'</span></div></div>';
  } else if(histTab==='deficit'){
    var dp=[];for(var ix2=0;ix2<days.length;ix2++)if(days[ix2].deficit>0)dp.push({i:ix2,v:days[ix2].deficit});
    var maxD=dp.length>0?Math.max.apply(null,dp.map(function(p){return p.v;}))+200:1500;
    chartCard='<div class="card"><div class="cttl">\u05D2\u05E8\u05E2\u05D5\u05DF \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D9\u05D5\u05DE\u05D9</div>'+(dp.length>0?makeSVG([{pts:dp,col:'#3f8f5f'}],[{v:500,col:'#c99a2e',lbl:'\u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD'}],0,maxD,150):'<div style="font-size:12px;color:#8a8073;padding:24px;text-align:center">\u05D4\u05D6\u05DF \u05E6\u05E2\u05D3\u05D9\u05DD \u05D1\u05E1\u05D9\u05DB\u05D5\u05DD \u05D9\u05D5\u05DD</div>')+'</div>';
  } else {
    var cum=0;var cp2=[];for(var ix3=0;ix3<days.length;ix3++)if(days[ix3].deficit>0){cum+=days[ix3].deficit;cp2.push({i:ix3,v:cum});}
    var maxC=cum>0?Math.max(cum+500,7700):7700;
    chartCard='<div class="card"><div class="cttl">\u05D2\u05E8\u05E2\u05D5\u05DF \u05DE\u05E6\u05D8\u05D1\u05E8 \u05DC\u05D0\u05D5\u05E8\u05DA \u05D4\u05E9\u05D1\u05D5\u05E2</div>'+makeSVG([{pts:cp2,col:'#3f8f5f'}],[{v:3500,col:'#c14a43',lbl:'~0.5\u05E7\u05D2'},{v:7000,col:'#c14a43',lbl:'~1\u05E7\u05D2'}],0,maxC,160);
    if(cum>0)chartCard+='<div style="display:flex;justify-content:space-around;background:linear-gradient(135deg,#e8f5ec,#eaeef8);border-radius:14px;padding:12px;margin-top:10px"><div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#3f8f5f">'+cum.toLocaleString()+'</div><div style="font-size:9px;color:#8a8073">\u05D2\u05E8\u05E2\u05D5\u05DF (\u05E7\u05E7"\u05DC)</div></div><div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#34519e">~'+(cum/7700).toFixed(2)+' \u05E7\u05D2</div><div style="font-size:9px;color:#8a8073">\u05E9\u05D5\u05DE\u05DF \u05E9\u05E0\u05E9\u05E8\u05E3</div></div></div>';
    else chartCard+='<div style="font-size:11px;color:#8a8073;text-align:center;padding:10px">\u05D4\u05D6\u05DF \u05E6\u05E2\u05D3\u05D9\u05DD \u05D1\u05E1\u05D9\u05DB\u05D5\u05DD \u05D9\u05D5\u05DD</div>';
    chartCard+='</div>';
  }
  var avgHTML='';
  if(active.length>0){var avgK=Math.round(active.reduce(function(a,d){return a+d.kcal;},0)/active.length);var avgP=Math.round(active.reduce(function(a,d){return a+d.p;},0)/active.length);var inT=active.filter(function(d){return d.kcal<=TARGETS.kcal;}).length;avgHTML='<div class="avgbox"><div style="font-size:10px;color:#8a8073;font-weight:700;margin-bottom:10px;letter-spacing:.1em">\u05DE\u05DE\u05D5\u05E6\u05E2\u05D9\u05DD ('+active.length+' \u05D9\u05DE\u05D9\u05DD)</div><div class="avgin"><div style="text-align:center"><div class="avgv" style="color:#34519e">'+avgK+'</div><div class="avgl">\u05E7\u05E7"\u05DC</div></div><div style="text-align:center"><div class="avgv" style="color:#c14a43">'+avgP+'g</div><div class="avgl">\u05D7\u05DC\u05D1\u05D5\u05DF</div></div><div style="text-align:center"><div class="avgv" style="color:#3f8f5f">'+inT+'/'+active.length+'</div><div class="avgl">\u05D1\u05D9\u05E2\u05D3</div></div></div></div>';}
  document.getElementById('content').innerHTML=tabHTML+chartCard+avgHTML;
}

function renderDay(){
  var mn=['\u05D9\u05E0\u05D5\u05D0\u05E8','\u05E4\u05D1\u05E8\u05D5\u05D0\u05E8','\u05DE\u05E8\u05E5','\u05D0\u05E4\u05E8\u05D9\u05DC','\u05DE\u05D0\u05D9','\u05D9\u05D5\u05E0\u05D9','\u05D9\u05D5\u05DC\u05D9','\u05D0\u05D5\u05D2\u05D5\u05E1\u05D8','\u05E1\u05E4\u05D8\u05DE\u05D1\u05E8','\u05D0\u05D5\u05E7\u05D8\u05D5\u05D1\u05E8','\u05E0\u05D5\u05D1\u05DE\u05D1\u05E8','\u05D3\u05E6\u05DE\u05D1\u05E8'];
  var dn=['\u05D0','\u05D1','\u05D2','\u05D3','\u05D4','\u05D5','\u05E9'];
  var y=calMonth.getFullYear(),mo=calMonth.getMonth();
  var first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  var html='<div class="cal-card"><div class="cal-hd"><button class="cal-nav" onclick="calPrev()">&#8250;</button><div class="cal-mn">'+mn[mo]+' '+y+'</div><button class="cal-nav" onclick="calNext()">&#8249;</button></div><div class="cal-grid">';
  for(var d=0;d<7;d++)html+='<div class="cal-dh">'+dn[d]+'</div>';
  var sd=first.getDay();for(var pad=0;pad<sd;pad++)html+='<div></div>';
  for(var day=1;day<=last.getDate();day++){
    var ds=y+'-'+(mo<9?'0':'')+(mo+1)+'-'+(day<10?'0':'')+day;
    var sum=loadSummary(ds);var isT=ds===todayStr();
    if(sum&&sum.photo)html+='<button class="cal-d has-photo" onclick="openSummary(\''+ds+'\')"><img src="'+sum.photo+'" alt=""></button>';
    else if(sum)html+='<button class="cal-d has'+(isT?' today':'')+'" onclick="openSummary(\''+ds+'\')"><span>'+day+'</span><div class="cal-d-dot"></div></button>';
    else html+='<button class="cal-d'+(isT?' today':'')+'" onclick="switchTab(\'today\')">'+(isT?'<strong>'+day+'</strong>':day)+'</button>';
  }
  html+='</div></div>';
  document.getElementById('content').innerHTML=html;
}

function renderSummaryOverlay(dateStr){
  var sum=loadSummary(dateStr);if(!sum)return;
  var old=document.getElementById('sum-overlay');if(old)old.remove();
  var flowStops=[];
  if(sum.flow){var fp=sum.flow.split(/,|\u2190|\u2192|\n/);for(var fi=0;fi<fp.length;fi++){var fs=fp[fi].trim();if(fs)flowStops.push(fs);}}
  var div=document.createElement('div');div.id='sum-overlay';div.className='summary-overlay';
  div.onclick=function(e){if(e.target===div)closeSummary();};
  var h='<div class="summary-sheet"><div class="summary-pull"></div><button class="summary-close" onclick="closeSummary()">&times;</button>';
  h+='<div style="background:linear-gradient(135deg,#f7f0dd,#dfe6f6);border-radius:22px;padding:20px;margin-bottom:14px">';
  h+='<div style="font-size:10px;color:#8a8073;letter-spacing:.1em;margin-bottom:5px">\u05E1\u05D9\u05DB\u05D5\u05DD \u05D9\u05D5\u05DD</div>';
  h+='<div style="font-size:20px;font-weight:700;margin-bottom:10px">'+fmtDate(dateStr)+'</div>';
  h+='<div style="display:flex;gap:20px"><div style="text-align:center"><div style="font-size:18px">'+starsHTML(sum.mood,5)+'</div><div style="font-size:9px;color:#8a8073">\u05DE\u05D6\u05D2</div></div><div style="text-align:center"><div style="font-size:18px">'+starsHTML(sum.body,5)+'</div><div style="font-size:9px;color:#8a8073">\u05D2\u05D5\u05E3</div></div></div></div>';
  if(sum.photo)h+='<img src="'+sum.photo+'" style="width:100%;max-height:260px;object-fit:contain;border-radius:16px;margin-bottom:12px">';
  if(sum.moment)h+='<div style="background:linear-gradient(135deg,#f8f0dd,#eef1fa);border-radius:16px;padding:14px;margin-bottom:12px"><div style="font-size:9px;color:#8a8073;margin-bottom:6px">&#x2728; \u05D4\u05E8\u05D2\u05E2 \u05D4\u05DB\u05D9 \u05D8\u05D5\u05D1</div><div style="font-size:14px;line-height:1.6">'+esc(sum.moment)+'</div></div>';
  if(flowStops.length>0){h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.1)"><div style="font-size:9px;color:#8a8073;margin-bottom:10px">\u05EA\u05E8\u05E9\u05D9\u05DD \u05D6\u05E8\u05D9\u05DE\u05EA \u05D4\u05D9\u05D5\u05DD</div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">';for(var fi2=0;fi2<flowStops.length;fi2++){h+='<div style="background:linear-gradient(135deg,#f7f0dd,#e2e6f5);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600">'+esc(flowStops[fi2])+'</div>';if(fi2<flowStops.length-1)h+='<span style="color:#8a8073">&#8594;</span>';}h+='</div></div>';}
  var kp=Math.min(100,Math.round(sum.kcal/TARGETS.kcal*100)),pp2=Math.min(100,Math.round(sum.p/TARGETS.p*100)),cp3=Math.min(100,Math.round(sum.c/TARGETS.c*100)),fp2=Math.min(100,Math.round(sum.f/TARGETS.f*100));
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.1)"><div style="font-size:9px;color:#8a8073;margin-bottom:10px">\u05EA\u05D6\u05D5\u05E0\u05D4 \u05D9\u05D5\u05DE\u05D9\u05EA</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">';
  var smb=[{v:sum.kcal,pct:kp,lbl:'\u05E7\u05E7"\u05DC',g:'linear-gradient(180deg,#7690cf,#34519e)',col:'#34519e'},{v:sum.p+'g',pct:pp2,lbl:'\u05D7\u05DC\u05D1\u05D5\u05DF',g:'linear-gradient(180deg,#dd8a85,#c14a43)',col:'#c14a43'},{v:sum.c+'g',pct:cp3,lbl:'\u05E4\u05D7\u05DE\u05D9\u05DE\u05D4',g:'linear-gradient(180deg,#7fc79a,#3f8f5f)',col:'#3f8f5f'},{v:sum.f+'g',pct:fp2,lbl:'\u05E9\u05D5\u05DE\u05DF',g:'linear-gradient(180deg,#e8cd85,#c99a2e)',col:'#c99a2e'}];
  for(var bi2=0;bi2<smb.length;bi2++){var sb=smb[bi2];h+='<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:24px;height:68px;background:#ece2cb;border-radius:12px;overflow:hidden;position:relative"><div style="position:absolute;bottom:0;width:100%;height:'+sb.pct+'%;background:'+sb.g+'"></div></div><div style="font-size:10.5px;font-weight:700">'+sb.v+'</div><div style="font-size:9px;color:#8a8073">'+sb.lbl+'</div></div>';}
  if(sum.water){var wp2=Math.min(100,Math.round(sum.water/3000*100));h+='<div style="margin-top:10px;display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#4f7f96">&#x1F4A7; \u05DE\u05D9\u05DD</span><div style="flex:1;height:6px;background:#ece2cb;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+wp2+'%;background:linear-gradient(90deg,#6fb0e0,#2b6a91)"></div></div><span style="font-size:10px;color:#4f7f96">'+sum.water+'\u05DE"\u05DC</span></div>';}
  h+='</div>';
  if(sum.workout||sum.steps){h+='<div style="background:#fff;border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.1)">';if(sum.workout)h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:'+(sum.steps?'10px':'0')+'"><span style="font-size:22px">&#x1F3CB;&#xFE0F;</span><div><div style="font-size:9px;color:#8a8073">\u05E4\u05E2\u05D9\u05DC\u05D5\u05EA \u05D2\u05D5\u05E4\u05E0\u05D9\u05EA</div><div style="font-size:13px;font-weight:600;margin-top:2px">'+esc(sum.workout)+'</div></div></div>';if(sum.steps)h+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">&#x1F463;</span><div><div style="font-size:9px;color:#8a8073">\u05E6\u05E2\u05D3\u05D9\u05DD</div><div style="font-size:18px;font-weight:700;color:#3f8f5f">'+sum.steps.toLocaleString()+'</div></div></div>';h+='</div>';}
  if(sum.song)h+='<div style="background:linear-gradient(135deg,#e2e6f5,#dcefe1);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px"><span style="font-size:28px">&#x1F3B5;</span><div><div style="font-size:9px;color:#3f8f5f;letter-spacing:.1em">\u05E9\u05D9\u05E8 \u05E9\u05DC \u05D4\u05D9\u05D5\u05DD</div><div style="font-size:15px;font-weight:700;margin-top:2px">'+esc(sum.song)+'</div></div></div>';
  if(sum.quote)h+='<div style="border-right:3px solid #34519e;padding:10px 14px;background:rgba(118,144,207,.10);border-radius:0 14px 14px 0;margin-bottom:12px"><div style="font-size:9px;color:#8a8073;margin-bottom:5px">\u05DE\u05E9\u05E4\u05D8 \u05E9\u05EA\u05E4\u05E1</div><div style="font-size:13px;line-height:1.7;font-style:italic">&#8220;'+esc(sum.quote)+'&#8221;</div></div>';
  h+='<div style="text-align:center;font-size:10px;color:#8a8073;margin-top:8px">&#x1F331; \u05D9\u05D5\u05DD \u05DE\u05D5\u05E6\u05DC\u05D7</div></div>';
  div.innerHTML=h;document.body.appendChild(div);
}

document.getElementById('btnPrev').onclick=function(){goDay(-1);};
document.getElementById('btnNext').onclick=function(){goDay(1);};
initAuth();
