<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>השמש — ייחוס</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  THE REFERENCE IMAGE. The approved character, 900px, alone on a plain ground,
  so a clean picture can be taken of him and handed to an image model as the
  thing to keep.

  THE DRAWING CODE IS LIFTED FROM sun-final.html at build time by
  tools-side make-ref.mjs - everything above function stage(). Nothing here was
  retyped, because a reference image drawn from a HAND COPY of the character is
  worse than no reference at all: it would quietly teach the model a slightly
  different sun, and every option that came back would be wrong in a way nobody
  could name.

  No blink keyframes are defined here on purpose, so the eyes stay open.
-->
<style>
  html,body{margin:0;height:100%;background:#e9e7e3}
  body{display:grid;place-items:center}
  #ref{width:900px;height:900px}
  .sm{display:block;width:100%;height:100%;overflow:visible}
</style>
<div id="ref"></div>
<script>

var N = 0, R = 34.2, EYE = '#32200f';
var COL = ['#f04a2e', '#f9913c', '#fcd238'];
var RR = [41, 47.5, 54];
function dots(r, n, duty){
  var c = 2*Math.PI*r, on = c/n*duty;
  return on.toFixed(2) + ' ' + (c/n - on).toFixed(2);
}

/* ── THE MARK. One function; the dot set follows the SIZE it is drawn at. ──
   Above the threshold it is א - 26 dots, 2.6 wide. Below it, ג - 14 dots,
   3.8 wide - because at 22px א's dots are thinner than a pixel and smear. */
function sunSVG(px){
  var k = 's' + (++N), big = (px == null) || px >= 48;
  var n = big ? 26 : 14, w = big ? 2.6 : 3.8, duty = big ? .06 : .07;
  var h = '<svg class="sm" viewBox="0 0 160 160" aria-hidden="true"><defs>' +
    '<linearGradient id="'+k+'b" gradientUnits="userSpaceOnUse" x1="80" y1="46" x2="80" y2="114">' +
    '<stop offset="0" stop-color="#fcd956"/><stop offset=".22" stop-color="#fbc744"/>' +
    '<stop offset=".42" stop-color="#f8ae34"/><stop offset=".62" stop-color="#f59d2c"/>' +
    '<stop offset=".82" stop-color="#ed8527"/><stop offset="1" stop-color="#e5530e"/></linearGradient>' +
    '<radialGradient id="'+k+'lim" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="'+R+'">' +
    '<stop offset=".58" stop-color="#8a3000" stop-opacity="0"/>' +
    '<stop offset="1" stop-color="#8a3000" stop-opacity=".32"/></radialGradient>' +
    '<radialGradient id="'+k+'bo" gradientUnits="userSpaceOnUse" cx="90" cy="104" r="22">' +
    '<stop offset="0" stop-color="#ffd089" stop-opacity=".5"/>' +
    '<stop offset="1" stop-color="#ffd089" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="'+k+'l" gradientUnits="userSpaceOnUse" cx="69" cy="66" r="26">' +
    '<stop offset="0" stop-color="#fff6d8" stop-opacity=".88"/>' +
    '<stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="'+k+'g" gradientUnits="userSpaceOnUse" cx="80" cy="80" r="76">' +
    '<stop offset=".42" stop-color="#ffb347" stop-opacity=".4"/>' +
    '<stop offset=".72" stop-color="#ffc766" stop-opacity=".15"/>' +
    '<stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>';
  h += '<circle cx="80" cy="80" r="76" fill="url(#'+k+'g)"/>';
  h += '<ellipse cx="80" cy="117" rx="25" ry="4.2" fill="#b0683a" opacity=".2"/>';
  h += '<g fill="none" stroke-linecap="round">';
  for (var i = 2; i >= 0; i--)
    h += '<circle class="sm-r sm-r'+(i+1)+'" cx="80" cy="80" r="'+RR[i]+'" stroke="'+COL[i]+'"' +
         ' stroke-width="'+w+'" stroke-dasharray="'+dots(RR[i], n, duty)+'"/>';
  h += '</g><g class="sm-body">' +
    '<circle cx="80" cy="80" r="'+R+'" fill="url(#'+k+'b)"/>' +
    '<circle cx="80" cy="80" r="'+R+'" fill="url(#'+k+'lim)"/>' +
    '<circle cx="80" cy="80" r="'+R+'" fill="url(#'+k+'bo)"/>' +
    '<circle cx="80" cy="80" r="'+R+'" fill="url(#'+k+'l)"/>' +
    '<g class="sm-eye"><ellipse cx="68.5" cy="82" rx="5.4" ry="11.4" fill="'+EYE+'"/>' +
    '<circle cx="66.6" cy="75.4" r="1.75" fill="#fff"/></g>' +
    '<g class="sm-eye r"><ellipse cx="91.5" cy="82" rx="5.4" ry="11.4" fill="'+EYE+'"/>' +
    '<circle cx="89.6" cy="75.4" r="1.75" fill="#fff"/></g></g>';
  return h + '</svg>';
}
document.getElementById('ref').innerHTML = sunSVG(900);
</script>
</html>
