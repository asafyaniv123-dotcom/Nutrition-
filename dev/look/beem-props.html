<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mip · חפצים</title>
<!-- Mip's props: 79 objects from four Higgsfield sheets (19.10, 15.75 credits
     in all), cut by beem-props/cut.mjs. One live Mip on top - a live Mip
     per card would be 79 of them - and a gallery underneath. Tapping an
     object sets it beside him. On the side, not in the sheet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ground:#e9e7e3;--ink:#433c38;--muted:#675f57;--line:rgba(176,168,156,.42);
    --nu-lit:rgba(255,255,255,.95);--nu-shade-soft:rgba(176,168,156,.28)}
  *{box-sizing:border-box;margin:0}
  html,body{background:#dedbd6;color:var(--ink);font:400 15px/1.55 Assistant,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 24px 80px}
  h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .tag{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:8px;
    border-top:2px solid var(--ink);padding-top:8px;display:inline-block}
  .lede{font-size:13.5px;line-height:1.85;color:var(--muted);margin-top:14px;max-width:92ch}
  b{color:var(--ink)}
  .top{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;margin-top:22px}
  .side{position:sticky;top:14px}
  .scene{position:relative;aspect-ratio:1.4;border-radius:20px;overflow:hidden;background:var(--ground);
    box-shadow:-3px -3px 9px var(--nu-lit),5px 6px 14px var(--nu-shade-soft)}
  .scene .stage{position:absolute;width:64%;aspect-ratio:1;top:50%;transform:translateY(-50%);inset-inline-start:0}
  .scene img{position:absolute;inset-inline-end:7%;bottom:15%;height:50%;width:auto;
    filter:drop-shadow(0 6px 8px rgba(120,92,60,.22));transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .now{font-size:15px;font-weight:800;margin-top:10px;text-align:center}
  h2{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px;
    border-bottom:1px solid var(--line);padding-bottom:7px;display:flex;gap:8px}
  h2 span{margin-inline-start:auto;font-weight:700}
  h2:first-child{margin-top:0}
  .gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .it{border:0;border-radius:14px;background:var(--ground);padding:8px 6px 7px;cursor:pointer;font:inherit;color:inherit;
    box-shadow:-2px -2px 6px var(--nu-lit),3px 4px 9px var(--nu-shade-soft)}
  .it.on{box-shadow:0 0 0 2px rgba(155,67,36,.5),-2px -2px 6px var(--nu-lit),3px 4px 9px var(--nu-shade-soft)}
  .it img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
  .it b{display:block;font-size:11.5px;font-weight:800;margin-top:4px;text-align:center}
  figure{margin-top:30px}
  figure img{width:100%;max-width:440px;display:block;border-radius:14px;background:#fff}
  figcaption{font-size:12px;color:var(--muted);margin-top:6px}
  .sheets{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  @media (max-width:900px){.top{grid-template-columns:1fr}.side{position:static;order:-1;max-width:420px}}
  @media (max-width:520px){.wrap{padding:22px 16px 60px}h1{font-size:36px}.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<div class="wrap">
  <h1 dir="ltr" style="text-align:right">Mip</h1>
  <div class="tag">79 חפצים · ארבעה גיליונות · מהצד</div>
  <div class="lede">
    כל החפצים יצאו מארבעה גיליונות ב־Higgsfield, עם Mip המקורי כרפרנס לסגנון.
    <b>סך הכול 15.75 קרדיטים, כ־0.2 לחפץ.</b> לחיצה על חפץ מציבה אותו ליד Mip החי, כדי לבדוק
    אם הוא נראה שייך. עוד לא הונפש אף חפץ.
  </div>
  <div class="top">
    <div id="gals"></div>
    <div class="side">
      <div class="scene"><div class="stage" id="stage"></div><img id="pimg" src="beem-props/glass.png" alt=""></div>
      <div class="now" id="pname"></div>
    </div>
  </div>
  <h2>הגיליונות, כמו שהגיעו</h2>
  <div class="sheets">
    <figure><img src="beem-props/sheet.png" alt=""><figcaption>גיליון 1 · 9 חפצים · 2.75 קרדיטים</figcaption></figure>
    <figure><img src="beem-props/sheet2.png" alt=""><figcaption>גיליון 2 · 20 חפצים · 4.25 קרדיטים</figcaption></figure>
    <figure><img src="beem-props/sheet3.png" alt=""><figcaption>גיליון 3 · 25 חפצים · 4.25 קרדיטים</figcaption></figure>
    <figure><img src="beem-props/sheet4.png" alt=""><figcaption>גיליון 4 · 25 חפצים · 4.25 קרדיטים</figcaption></figure>
  </div>
</div>

<script src="beem-engine.js"></script>
<script src="beem-special.js"></script>
<script src="beem-alive.js"></script>
<script>
var GROUPS = [
  ['יום ושינה, מים וכושר', [['glass','כוס מים'],['dumbbell','משקולת'],['plate','צלחת ומזלג'],['notebook','מחברת'],
    ['pillow','כרית'],['clock','שעון מעורר'],['gift','מתנה'],['ball','כדור'],['plant','עציץ']]],
  ['תזונה, כושר, תכנון, אנשים ותחביבים', [['apple','תפוח'],['salad','סלט'],['coffee','קפה'],['bottle','בקבוק מים'],
    ['shoe','נעל ריצה'],['kettlebell','קטלבל'],['rope','חבל קפיצה'],['yogamat','מזרן יוגה'],['candle','נר'],
    ['hourglass','שעון חול'],['checklist','רשימת משימות'],['envelope','מעטפה'],['phone','טלפון'],['heart','לב'],
    ['palette','פלטת צבעים'],['headphones','אוזניות'],['tshirt','חולצה'],['bulb','נורה'],['camera','מצלמה'],['trophy','גביע']]],
  ['אוכל, גוף ותנועה', [['banana','בננה'],['carrot','גזר'],['avocado','אבוקדו'],['juice','מיץ תפוזים'],['oatmeal','דייסה'],
    ['sandwich','כריך'],['egg','ביצה'],['strawberry','תות'],['cookie','עוגייה'],['teapot','קומקום'],
    ['sleepmask','מסכת שינה'],['toothbrush','מברשת שיניים'],['towel','מגבת'],['sunhat','כובע שמש'],['umbrella','מטרייה'],
    ['backpack','תיק גב'],['bicycle','אופניים'],['skateboard','סקייטבורד'],['basketball','כדורסל'],['tennis','טניס'],
    ['stopwatch','סטופר'],['drop','טיפה'],['flame','להבה'],['bolt','ברק'],['scale','משקל']]],
  ['ראש, אנשים וחגיגות', [['book','ספר'],['pen','עט'],['stickynote','פתק'],['calendar','לוח שנה'],['magnifier','זכוכית מגדלת'],
    ['guitar','גיטרה'],['keyboard','קלידים'],['microphone','מיקרופון'],['gamepad','שלט משחק'],['dice','קוביות'],
    ['flower','פרח'],['sunflower','חמנייה'],['gem','אבן חן'],['star','כוכב'],['rainbow','קשת'],
    ['balloon','בלון'],['popper','קונפטי'],['cupcake','קאפקייק'],['medal','מדליה'],['crown','כתר'],
    ['speech','בועת דיבור'],['puzzle','פאזל'],['rocket','טיל'],['plane','מטוס נייר'],['house','בית']]]
];
var ALL = [];
BEEM_READY.then(function(){
  var b = new Beem(document.getElementById('stage')); ALL.push(b);
  b.play({dur: 1e9, ev: [[0, 'mode', {breathe: [.014, 3.6], idle: 0}], [0, 'look', -16, -6], [0, 'face', 'curious']]});
  var pimg = document.getElementById('pimg'), pname = document.getElementById('pname'), host = document.getElementById('gals'), first = null;
  function pick(btn, id, he){
    [].forEach.call(document.querySelectorAll('.it.on'), function(x){ x.classList.remove('on'); });
    btn.classList.add('on'); pimg.src = 'beem-props/' + id + '.png'; pname.textContent = he;
    pimg.style.transform = 'scale(.6)'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ pimg.style.transform = ''; }); });
    b.verb('face', 'surprised'); b.verb('hop', 30); b.pend.push([b.sT + .7, 'face', 'curious']);
  }
  GROUPS.forEach(function(g){
    var h = document.createElement('h2'); h.innerHTML = g[0] + '<span>' + g[1].length + '</span>'; host.appendChild(h);
    var gal = document.createElement('div'); gal.className = 'gal'; host.appendChild(gal);
    g[1].forEach(function(p){
      var btn = document.createElement('button'); btn.className = 'it';
      btn.innerHTML = '<img loading="lazy" src="beem-props/' + p[0] + '.png" alt=""><b>' + p[1] + '</b>';
      btn.onclick = function(){ pick(btn, p[0], p[1]); };
      gal.appendChild(btn); if (!first) first = [btn, p[0], p[1]];
    });
  });
  pick.apply(null, first);
  beemRun(ALL);
});
</script>
</html>
