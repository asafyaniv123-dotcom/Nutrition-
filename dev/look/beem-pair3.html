<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mip · שלוש החלפות</title>
<!--
  THREE WAYS TO HIDE THE SWAP (19.10). Up-and-out failed because he never
  quite left the screen, and the colour change showed. Each option here hides
  the moment differently: A leaves for real (the height is computed from the
  phone), B swaps inside a white flash, C swaps at a point. None depends on
  which side the phones stand. On the side, not in the sheet.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ground:#e9e7e3;--ink:#433c38;--muted:#675f57;--line:rgba(176,168,156,.42);
    --nu-lit:rgba(255,255,255,.95);--nu-shade-soft:rgba(176,168,156,.28)}
  *{box-sizing:border-box;margin:0}
  html,body{background:#dedbd6;color:var(--ink);font:400 15px/1.55 Assistant,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:30px 24px 80px}
  h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .tag{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:8px;
    border-top:2px solid var(--ink);padding-top:8px;display:inline-block}
  .lede{font-size:13.5px;line-height:1.85;color:var(--muted);margin-top:14px;max-width:92ch}
  b{color:var(--ink)}
  .opt{margin-top:34px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    border-top:1px solid var(--line);padding-top:22px}
  .opt .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
  .opt h2{font-size:24px;font-weight:800;margin-top:2px}
  .opt p{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px}
  .opt button{margin-top:12px}
  .pair{display:flex;gap:18px}
  .phone{position:relative;width:min(190px,40vw);aspect-ratio:390/780;border-radius:24px;overflow:hidden;
    background:var(--ground);box-shadow:-4px -4px 10px var(--nu-lit),7px 9px 20px rgba(120,100,80,.24);
    display:flex;flex-direction:column;align-items:center;padding:16px 10px}
  .who{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .st{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;min-height:2.6em;text-align:center;line-height:1.4}
  .st.ok{color:#2f6b45}
  .box{position:relative;width:80%;aspect-ratio:1;margin-top:18px}
  .box .stage{position:absolute;inset:0}
  .qr,.view{position:absolute;inset:14%;border-radius:12px;transition:opacity .35s}
  .qr{background:var(--ground);box-shadow:inset 2px 3px 7px var(--nu-shade-soft),inset -2px -2px 6px var(--nu-lit);padding:10%}
  .qr canvas{width:100%;height:100%;display:block;opacity:.8;image-rendering:pixelated}
  .view{border:2.5px dashed rgba(103,95,87,.45)}
  .gone{opacity:0}
  button{font:800 13px Assistant,system-ui,sans-serif;color:var(--ink);border:0;border-radius:12px;padding:9px 15px;
    background:var(--ground);cursor:pointer;box-shadow:-2px -2px 5px var(--nu-lit),2px 3px 7px var(--nu-shade-soft)}
  .top{display:flex;gap:10px;margin-top:16px}
  @media (max-width:760px){.opt{grid-template-columns:1fr}.pair{justify-content:center}}
  @media (max-width:520px){.wrap{padding:22px 14px 60px}h1{font-size:36px}.phone{padding:12px 8px}}
</style>

<div class="wrap">
  <h1 dir="ltr" style="text-align:right">Mip</h1>
  <div class="tag">אימון ביחד · שלוש דרכים להחליף</div>
  <div class="lede">
    בגרסה הקודמת הוא לא באמת יצא מהמסך, ולכן ראו את החלפת הצבעים. כאן יש שלוש דרכים להסתיר
    את רגע ההחלפה. אף אחת מהן לא תלויה בצד שבו כל אחד עומד. כל זוג רץ בלולאה.
  </div>
  <div class="top"><button id="slow">הילוך איטי ×3 לכולם</button></div>
  <div id="opts"></div>
</div>

<script src="beem-engine.js"></script>
<script src="beem-special.js"></script>
<script src="beem-alive.js"></script>
<script src="beem-moon.js"></script>
<script src="beem-pair.js"></script>
<script src="beem-colors.js"></script>
<script src="beem-pairing.js"></script>
<script>
var ALL = [], PAIRS = [];
var OPTS = [
  {k: 'A', t: 'קפיצה גבוהה',
   p: 'אותה קפיצה למעלה, אבל <b>הגובה מחושב מהמסך</b>: מהמיקום של Mip ועד ראש הטלפון, כולל הטבעות שלו והפיגור שלהן. ההחלפה קורית רק כש־Mip באמת מחוץ למסך, ונבדקת בכל פריים. השני נופל מלמעלה ונמעך בנחיתה.'},
  {k: 'B', t: 'הבזק',
   p: 'קפיצה קטנה, ובשיא שלה <b>הטבעות נסגרות עליו והוא הופך לרגע לכדור אור לבן</b>, כמו האבולוציה בפוקימון וכמו ב־Mip זהב. ההחלפה קורית בתוך האור. האור דועך, הטבעות נפתחות בצבע של השני, והוא נוחת.'},
  {k: 'C', t: 'פורטל',
   p: 'הוא מסתחרר ו<b>מתכווץ לנקודה</b>, והטבעות נאספות אחריו פנימה. ההחלפה קורית כשאין כבר מה לראות, והשני פורץ החוצה מאותה נקודה וחוזר לגודלו דרך הקפיץ. אין תנועה למעלה ואין תנועה הצידה בכלל.'}
];
Promise.all([BEEM_READY, COLORS_READY]).then(function(){
  var host = document.getElementById('opts');
  OPTS.forEach(function(O){
    var d = document.createElement('div'); d.className = 'opt';
    d.innerHTML = '<div><div class="k">אפשרות ' + O.k + '</div><h2>' + O.t + '</h2><p>' + O.p + '</p>' +
      '<button>שוב מההתחלה</button></div><div class="ph"></div>';
    host.appendChild(d);
    var p = new BeemPair(d.querySelector('.ph'), O.k, ALL); PAIRS.push(p);
    d.querySelector('button').onclick = function(){ p.start(); };
  });
  document.getElementById('slow').onclick = function(){
    var old = BEEM_PAIR_SPEED; BEEM_PAIR_SPEED = BEEM_PAIR_SPEED === 1 ? 1/3 : 1;
    PAIRS.forEach(function(p){ p.retime(old); }); ALL.forEach(function(b){ b.speed = BEEM_PAIR_SPEED; });
    this.textContent = BEEM_PAIR_SPEED === 1 ? 'הילוך איטי ×3 לכולם' : 'מהירות רגילה';
  };
  requestAnimationFrame(function tick(now){ PAIRS.forEach(function(p){ p.tick(now); }); requestAnimationFrame(tick); });
  beemRun(ALL);
});
</script>
</html>
