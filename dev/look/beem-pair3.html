<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beem · שלוש החלפות</title>
<!--
  THREE WAYS TO HIDE THE SWAP (19.10). Up-and-out failed because he never
  quite left the screen, and the colour change showed. Each option here hides
  the moment differently: A leaves for real (the height is computed from the
  phone), B swaps inside a white flash, C swaps at a point. None depends on
  which side the phones stand. On the side, not in the sheet.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ground:#e9e7e3;--ink:#433c38;--muted:#675f57;--line:rgba(176,168,156,.42);
    --nu-lit:rgba(255,255,255,.95);--nu-shade-soft:rgba(176,168,156,.28)}
  *{box-sizing:border-box;margin:0}
  html,body{background:#dedbd6;color:var(--ink);font:400 15px/1.55 Assistant,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:30px 24px 80px}
  h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .tag{font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:8px;
    border-top:2px solid var(--ink);padding-top:8px;display:inline-block}
  .lede{font-size:13.5px;line-height:1.85;color:var(--muted);margin-top:14px;max-width:92ch}
  b{color:var(--ink)}
  .opt{margin-top:34px;display:grid;gap:22px;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    border-top:1px solid var(--line);padding-top:22px}
  .opt .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
  .opt h2{font-size:24px;font-weight:800;margin-top:2px}
  .opt p{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px}
  .opt button{margin-top:12px}
  .pair{display:flex;gap:18px}
  .phone{position:relative;width:min(190px,40vw);aspect-ratio:390/780;border-radius:24px;overflow:hidden;
    background:var(--ground);box-shadow:-4px -4px 10px var(--nu-lit),7px 9px 20px rgba(120,100,80,.24);
    display:flex;flex-direction:column;align-items:center;padding:16px 10px}
  .who{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
  .st{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;min-height:2.6em;text-align:center;line-height:1.4}
  .st.ok{color:#2f6b45}
  .box{position:relative;width:80%;aspect-ratio:1;margin-top:18px}
  .box .stage{position:absolute;inset:0}
  .qr,.view{position:absolute;inset:14%;border-radius:12px;transition:opacity .35s}
  .qr{background:var(--ground);box-shadow:inset 2px 3px 7px var(--nu-shade-soft),inset -2px -2px 6px var(--nu-lit);padding:10%}
  .qr canvas{width:100%;height:100%;display:block;opacity:.8;image-rendering:pixelated}
  .view{border:2.5px dashed rgba(103,95,87,.45)}
  .gone{opacity:0}
  button{font:800 13px Assistant,system-ui,sans-serif;color:var(--ink);border:0;border-radius:12px;padding:9px 15px;
    background:var(--ground);cursor:pointer;box-shadow:-2px -2px 5px var(--nu-lit),2px 3px 7px var(--nu-shade-soft)}
  .top{display:flex;gap:10px;margin-top:16px}
  @media (max-width:760px){.opt{grid-template-columns:1fr}.pair{justify-content:center}}
  @media (max-width:520px){.wrap{padding:22px 14px 60px}h1{font-size:36px}.phone{padding:12px 8px}}
</style>

<div class="wrap">
  <h1 dir="ltr" style="text-align:right">Beem</h1>
  <div class="tag">אימון ביחד · שלוש דרכים להחליף</div>
  <div class="lede">
    בגרסה הקודמת הוא לא באמת יצא מהמסך, ולכן ראו את החלפת הצבעים. כאן יש שלוש דרכים להסתיר
    את רגע ההחלפה. אף אחת מהן לא תלויה בצד שבו כל אחד עומד. כל זוג רץ בלולאה.
  </div>
  <div class="top"><button id="slow">הילוך איטי ×3 לכולם</button></div>
  <div id="opts"></div>
</div>

<script src="beem-engine.js"></script>
<script src="beem-special.js"></script>
<script src="beem-alive.js"></script>
<script src="beem-moon.js"></script>
<script src="beem-pair.js"></script>
<script src="beem-colors.js"></script>
<script>
var ALL = [], SPEED = 1, PAIRS = [];
var IDLE_IN = {dur: 1e9, ev: [[0, 'mode', {breathe: [.014, 3.6], idle: 1}]]};
var OPTS = [
  {k: 'A', t: 'קפיצה גבוהה',
   p: 'אותה קפיצה למעלה, אבל <b>הגובה מחושב מהמסך</b>: מהמיקום של Beem ועד ראש הטלפון, כולל הטבעות שלו והפיגור שלהן. ההחלפה קורית רק כש־Beem באמת מחוץ למסך, ונבדקת בכל פריים. השני נופל מלמעלה ונמעך בנחיתה.'},
  {k: 'B', t: 'הבזק',
   p: 'קפיצה קטנה, ובשיא שלה <b>הטבעות נסגרות עליו והוא הופך לרגע לכדור אור לבן</b>, כמו האבולוציה בפוקימון וכמו ב־Beem זהב. ההחלפה קורית בתוך האור. האור דועך, הטבעות נפתחות בצבע של השני, והוא נוחת.'},
  {k: 'C', t: 'פורטל',
   p: 'הוא מסתחרר ו<b>מתכווץ לנקודה</b>, והטבעות נאספות אחריו פנימה. ההחלפה קורית כשאין כבר מה לראות, והשני פורץ החוצה מאותה נקודה וחוזר לגודלו דרך הקפיץ. אין תנועה למעלה ואין תנועה הצידה בכלל.'}
];
function qr(c){
  var g = c.getContext('2d'); g.fillStyle = '#433c38';
  for (var y = 0; y < 21; y++) for (var x = 0; x < 21; x++){
    var eye = function(ox, oy){ var u = x - ox, v = y - oy; return u >= 0 && u < 7 && v >= 0 && v < 7 &&
      (u === 0 || u === 6 || v === 0 || v === 6 || (u > 1 && u < 5 && v > 1 && v < 5)); };
    var inEye = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
    if (inEye ? (eye(0,0) || eye(14,0) || eye(0,14)) : ((x*7 + y*13 + x*y) % 5 < 2)) g.fillRect(x, y, 1, 1);
  }
}
function Pair(host, O){
  host.innerHTML = '<div><div class="k">אפשרות ' + O.k + '</div><h2>' + O.t + '</h2><p>' + O.p + '</p>' +
    '<button>שוב מההתחלה</button></div><div class="pair">' +
    '<div class="phone"><div class="who">הטלפון של אסף</div><div class="st"></div><div class="box"><div class="qr"><canvas width="21" height="21"></canvas></div><div class="stage"></div></div></div>' +
    '<div class="phone"><div class="who">הטלפון של דנה</div><div class="st"></div><div class="box"><div class="view"></div><div class="stage"></div></div></div></div>';
  qr(host.querySelector('canvas'));
  var phones = host.querySelectorAll('.phone'), st = host.querySelectorAll('.st'), boxes = host.querySelectorAll('.box');
  var stages = host.querySelectorAll('.stage'), cover = [host.querySelector('.qr'), host.querySelector('.view')];
  var A = new Beem(stages[0]), B = new Beem(stages[1]); ALL.push(A, B);
  var me = this, T0 = 0, phase = '', T1 = 0, swapped = false, flags = {};
  function both(f){ [A, B].forEach(f); }
  function once1(k){ if (flags[k]) return false; flags[k] = 1; return true; }
  function swap(){ swapped = true; tintBeem(A, 'teal'); tintBeem(B, null); }
  this.start = function(){
    T0 = performance.now(); phase = 'wait'; swapped = false; flags = {};
    tintBeem(A, null); tintBeem(B, 'teal'); A.play(IDLE_IN); B.play(IDLE_IN);
    cover.forEach(function(c){ c.classList.remove('gone'); });
    st[0].textContent = 'מציג קוד לסריקה'; st[1].textContent = 'סורקת את הקוד…'; st[0].className = st[1].className = 'st';
    stages[0].style.transition = stages[1].style.transition = 'none';
    stages[0].style.transform = stages[1].style.transform = 'scale(.42) translateY(95%)';
  };
  /* A: how high he must go to leave the phone completely, in his own units -
     from the box's centre to the phone's top edge, plus the outer ring's
     radius, plus the most the rings can lag behind him, plus a margin */
  function exitHeight(){
    var b = boxes[0].getBoundingClientRect(), p = phones[0].getBoundingClientRect(), k = b.width/VB;
    var centre = (b.top + b.height/2 - p.top)/k;
    return centre + 430 + 90 + 80;
  }
  function offscreen(bm, i){
    var b = boxes[i].getBoundingClientRect(), p = phones[i].getBoundingClientRect(), k = b.width/VB;
    var lowest = Math.max(bm.y, bm.ry[0], bm.ry[1], bm.ry[2]);    // the lowest of body and rings
    return b.top - p.top + (b.height/2 + (lowest + 430)*k*bm.gate) < -4;
  }
  this.tick = function(now){
    var t = (now - T0)/1000*SPEED;
    if (phase === 'wait' && t > 1.6){ phase = 'found';
      st[0].textContent = st[1].textContent = 'מתחברים…';
      cover.forEach(function(c){ c.classList.add('gone'); });
      stages[0].style.transition = stages[1].style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1)';
      stages[0].style.transform = stages[1].style.transform = 'none';
      both(function(b){ b.verb('face', 'surprised'); b.verb('burst', .7); });
    }
    if (phase === 'found' && t > 2.4){ phase = 'crouch';
      both(function(b){ b.verb('squash', 4); b.verb('face', 'determined'); });
    }
    if (phase === 'crouch' && t > 2.62){ phase = 'go'; T1 = t;
      if (O.k === 'A'){ var H = exitHeight(); both(function(b){ b.verb('face', 'happy'); b.verb('launch', H); b.verb('stretch', .06); }); }
      if (O.k === 'B'){ both(function(b){ b.verb('face', 'happy'); b.verb('launch', 260); }); }
      if (O.k === 'C'){ both(function(b){ b.verb('face', 'happy'); b.verb('spin', 520); b.verb('gate', 0); }); }
    }
    if (phase === 'go'){
      var u = t - T1;
      if (O.k === 'A'){
        if (!swapped && offscreen(A, 0) && offscreen(B, 1)){ swap(); both(function(b){ b.verb('stretch', 0); b.verb('face', 'surprised'); }); }
        if (swapped && !A.air && u > .4) land();
        if (!swapped && u > 3){ swap(); land(); console.warn('A: never left the screen'); }   // must never happen
      }
      if (O.k === 'B'){
        if (u > .12 && once1('close')) both(function(b){ b.fxTween({t: 'rings', v: {sc: .25, op: 0}, d: 180, e: 'in'});
          b.fxTween({t: 'body', v: {white: 1}, d: 160}); b.verb('spin', 400); });
        if (u > .32 && once1('swap')) swap();
        if (u > .38 && once1('open')) both(function(b){ b.fxTween({t: 'rings', v: {sc: 1, op: 1}, d: 420, e: 'back'});
          b.fxTween({t: 'body', v: {white: 0}, d: 380, e: 'out'}); b.verb('face', 'surprised'); });
        if (swapped && !A.air && u > .6) land();
      }
      if (O.k === 'C'){
        if (u > .5 && A.gate < .03 && once1('swap')){ swap(); both(function(b){ b.verb('gate', 1); b.verb('face', 'surprised'); b.verb('spin', -300); }); }
        if (swapped && u > 1.0) land();
      }
    }
    if (phase === 'landed'){
      var w = t - T1;
      if (w > .7 && once1('l1')) both(function(b){ b.verb('look', 0, 20); b.verb('face', 'curious'); });
      if (w > 1.6 && once1('l2')) both(function(b){ b.verb('look', 0, 0); b.verb('face', 'calm'); });
      if (w > 2.1 && once1('l3')) both(function(b){ b.verb('face', 'happy'); b.verb('nod', 1, 9); });
      if (w > 3.1 && once1('l4')) both(function(b){ b.verb('face', 'content'); });
      if (w > 5) me.start();
    }
  };
  function land(){
    phase = 'landed'; T1 = (performance.now() - T0)/1000*SPEED;
    both(function(b){ b.verb('face', 'happy'); b.verb('burst', 1.6); b.verb('spin', 180); });
    st[0].textContent = 'מחוברים! ה־Beem של דנה אצלך'; st[1].textContent = 'מחוברים! ה־Beem של אסף אצלך';
    st[0].className = st[1].className = 'st ok';
  }
  host.querySelector('button').onclick = function(){ me.start(); };
  this.retime = function(old){ var t = (performance.now() - T0)/1000*old; T0 = performance.now() - t*1000/SPEED; };
  this.start();
}
Promise.all([BEEM_READY, COLORS_READY]).then(function(){
  var host = document.getElementById('opts');
  OPTS.forEach(function(O){ var d = document.createElement('div'); d.className = 'opt'; host.appendChild(d); PAIRS.push(new Pair(d, O)); });
  document.getElementById('slow').onclick = function(){
    var old = SPEED; SPEED = SPEED === 1 ? 1/3 : 1;
    PAIRS.forEach(function(p){ p.retime(old); }); ALL.forEach(function(b){ b.speed = SPEED; });
    this.textContent = SPEED === 1 ? 'הילוך איטי ×3 לכולם' : 'מהירות רגילה';
  };
  requestAnimationFrame(function tick(now){ PAIRS.forEach(function(p){ p.tick(now); }); requestAnimationFrame(tick); });
  beemRun(ALL);
});
</script>
</html>
