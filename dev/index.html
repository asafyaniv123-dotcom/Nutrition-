function vbSizeText(){
  var c=document.getElementById('vb-canvas');if(!c)return;
  var w=c.getBoundingClientRect().width;
  var els=c.querySelectorAll('.vb-text');
  for(var i=0;i<els.length;i++){
    els[i].style.fontSize=(parseFloat(els[i].getAttribute('data-fs'))/100*w)+'px';
  }
}

function vbPick(){var f=document.getElementById('vb-file');if(f)f.click();}

// Selection is a class swap rather than a re-render: re-rendering here would
// throw away the very element the finger is already holding.
function vbSelect(id){
  _vbSel=id;
  var c=document.getElementById('vb-canvas');if(!c)return;
  var els=c.querySelectorAll('.vb-item');
  for(var i=0;i<els.length;i++){
    var base='vb-item'+(els[i].className.indexOf('vb-text')>=0?' vb-text':'');
    els[i].className=base+(els[i].getAttribute('data-id')===id?' on':'');
  }
  if(!id)return;
  var a=loadVision(),it=vbFind(a,id);if(!it)return;
  var top=vbTop(a);
  if((it.z||1)<top){          // touching an item brings it to the front
    it.z=top+1;saveVision(a);
    var el=c.querySelector('.vb-item[data-id="'+id+'"]');if(el)el.style.zIndex=it.z;
  }
}

// Distance, angle and midpoint between the two fingers currently down.
function vbTwo(){
  var k=Object.keys(_vbPts),a=_vbPts[k[0]],b=_vbPts[k[1]];
  return {d:Math.max(8,Math.hypot(b.x-a.x,b.y-a.y)),
          a:Math.atan2(b.y-a.y,b.x-a.x),
          x:(a.x+b.x)/2,y:(a.y+b.y)/2};
}

function vbDown(e){
  var el=e.target.closest?e.target.closest('.vb-item'):null;
  if(!el){vbSelect(null);return;}
  // The two badges are buttons: let their click handlers run instead of dragging.
  if(e.target.closest('.vb-del')||e.target.closest('.vb-edit'))return;
  var id=el.getAttribute('data-id');
  if(id!==_vbSel)vbSelect(id);
  _vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var r=document.getElementById('vb-canvas').getBoundingClientRect();

  if(Object.keys(_vbPts).length>=2&&_vbG&&_vbG.id===id){
    var p=vbTwo();
    _vbG.mode='pinch';
    _vbG.it={x:_vbG.cur.x,y:_vbG.cur.y,w:_vbG.cur.w,rot:_vbG.cur.rot};
    _vbG.d0=p.d;_vbG.a0=p.a;_vbG.mx=p.x;_vbG.my=p.y;
  }else{
    var it=vbFind(loadVision(),id);if(!it)return;
    var text=it.kind==='text';
    var scale=text?it.fs:it.w;   // what the corner handle grows: font size or width
    var mode=e.target.closest('.vb-size')?'size':(e.target.closest('.vb-rot')?'rot':'move');
    var cx=r.left+it.x/100*r.width,cy=r.top+it.y/100*r.height;
    _vbG={id:id,el:el,mode:mode,r:r,text:text,
          it:{x:it.x,y:it.y,w:scale,rot:it.rot},
          cur:{x:it.x,y:it.y,w:scale,rot:it.rot},
          px:e.clientX,py:e.clientY,
          d0:Math.max(8,Math.hypot(e.clientX-cx,e.clientY-cy)),
          a0:Math.atan2(e.clientY-cy,e.clientX-cx)};
    window.addEventListener('pointermove',vbMove);
    window.addEventListener('pointerup',vbUp);
    window.addEventListener('pointercancel',vbUp);
  }
  e.preventDefault();
}

function vbMove(e){
  if(!_vbG)return;
  if(_vbPts[e.pointerId])_vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var g=_vbG,r=g.r,c=g.cur;
  var lo=g.text?2:8,hi=g.text?40:140;
  if(g.mode==='pinch'&&Object.keys(_vbPts).length>=2){
    var p=vbTwo();
    c.w=vbClamp(g.it.w*(p.d/g.d0),lo,hi);
    c.rot=g.it.rot+(p.a-g.a0)*180/Math.PI;
    c.x=vbClamp(g.it.x+(p.x-g.mx)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(p.y-g.my)/r.height*100,0,100);
  }else if(g.mode==='move'){
    c.x=vbClamp(g.it.x+(e.clientX-g.px)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(e.clientY-g.py)/r.height*100,0,100);
  }else{
    var cx=r.left+c.x/100*r.width,cy=r.top+c.y/100*r.height;
    if(g.mode==='size')c.w=vbClamp(g.it.w*Math.hypot(e.clientX-cx,e.clientY-cy)/g.d0,lo,hi);
    else c.rot=g.it.rot+(Math.atan2(e.clientY-cy,e.clientX-cx)-g.a0)*180/Math.PI;
  }
  g.el.style.left=c.x+'%';g.el.style.top=c.y+'%';
  if(g.text)g.el.style.fontSize=(c.w/100*r.width)+'px';
  else g.el.style.width=c.w+'%';
  g.el.style.transform='translate(-50%,-50%) rotate('+c.rot+'deg)';
  e.preventDefault();
}

function vbUp(e){
  delete _vbPts[e.pointerId];
  var g=_vbG;if(!g)return;
  var left=Object.keys(_vbPts);
  if(left.length===1&&g.mode==='pinch'){
    // one finger lifted out of a pinch - carry on dragging with the other
    var p=_vbPts[left[0]];
    g.mode='move';g.it={x:g.cur.x,y:g.cur.y,w:g.cur.w,rot:g.cur.rot};g.px=p.x;g.py=p.y;
    return;
  }
  if(left.length)return;
  vbCommit();
  window.removeEventListener('pointermove',vbMove);
  window.removeEventListener('pointerup',vbUp);
  window.removeEventListener('pointercancel',vbUp);
  _vbG=null;
}

function vbCommit(){

// Fit the photo inside VB_MAX and re-encode as JPEG - a 4MB camera shot comes
// out around 60KB, which is what lets a boardful of them live in localStorage.
function vbScale(file,cb,max){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,(max||VB_MAX)/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*s));
      cv.height=Math.max(1,Math.round(img.height*s));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL('image/jpeg',0.8));}catch(err){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=e.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}

function handleVisionPhoto(input){
  var files=Array.prototype.slice.call(input.files||[]);
  input.value='';   // so picking the same photo twice still fires onchange
  if(!files.length)return;
  var a=loadVision(),pending=files.length,added=0;
  files.forEach(function(file,i){
    vbScale(file,function(src){
      if(src){
        var spot=vbSpot(a.length);
        a.push({id:'vb'+Date.now()+'_'+i,src:src,
                x:spot.x,y:spot.y,w:38,
                rot:Math.round((Math.random()*14-7)*10)/10,z:vbTop(a)+1});
        added++;
      }
      if(--pending===0){
        if(added)saveVision(a);
        renderVisionBoard();
      }
    });
  });
}

/* ── BACKUP ──
   Everything the app knows lives in this browser's localStorage and nowhere
   else. Delete the app, change phone, and a year of tracking is gone - and
   there is no other way to carry data from this web prototype into the
   native build, or between the dev and stable copies.

   localStorage.length/key() are used rather than a list of known keys, so a
   feature added later is backed up without anyone remembering to add it
   here. In dev those go through the namespacing shim and return the app's
   own key names, which is exactly what should end up in the file.

   The steps token is deliberately left out: it is a bearer secret, and a
   backup file travels - through mail, a cloud drive, a chat. A fresh
   install mints its own. */
var BACKUP_SKIP={steps_token:1,last_export:1};

function collectAppData(){
  var out={},i,k;
  for(i=0;i<localStorage.length;i++){
    k=localStorage.key(i);
    if(!k||BACKUP_SKIP[k])continue;
    try{out[k]=localStorage.getItem(k);}catch(e){}
  }
  return out;
}

// Photos live in IndexedDB now, so a backup that only walked localStorage
// would quietly leave every picture behind.
/* Photos are 586KB of a 588KB backup. Everything else - every meal, every
   plan, the journal, the people, a year of it - is one kilobyte.

   So they are two different things and were wrong to be one. The records are
   small enough to paste into a note or a message, which is the only way of
   saving a file that works everywhere and needs nothing from the phone. The
   photos are a file, and a file needs the share sheet.

   The small one is what the panel offers first, because it is the one that
   matters: photos are pleasant and replaceable, and a year of what you ate is
   not. */
function buildBackup(withPhotos){
  var data=collectAppData();
  function pack(photos){
    return JSON.stringify({
      app:'better-me',version:2,
      exportedAt:new Date().toISOString(),
      keyCount:Object.keys(data).length,
      photoCount:photos?Object.keys(photos).length:0,
      data:data,photos:photos||{}
    });
  }
  if(!withPhotos)return Promise.resolve(pack(null));
  return photoAll().then(pack);
}

function exportShareText(text,name){

      .then(function(){showToast('✓ נשמר');},function(){});

  if(navigator.share&&text.length<60000){

  if(navigator.share){showToast('הטלפון לא מאפשר שיתוף קובץ — השתמש בהעתקה');return;}

/* ── LOCKING THE BACKUP ──
   A backup is every meal, every journal entry and every weight you have
   recorded, sitting in a mailbox as plain text. A password turns it into
   something nobody can read without it - including me, including anyone who
   gets into the mailbox, and including you if you forget it. That last one is
   not a caveat, it is the deal, and the panel says so before you use it.

   Standard parts, no invention: PBKDF2-SHA256 at 250,000 iterations to turn
   the password into a key, AES-GCM to encrypt with it. Both come with the
   browser. A fresh random salt and IV every time, so the same data and the
   same password never produce the same file twice, and GCM's tag means a
   file that has been altered fails to open rather than opening wrong.

   The envelope stays readable on purpose - which algorithm, how many
   iterations, the salt. None of that helps anyone without the password, and
   it means a backup can still be opened in ten years by someone who has only
   the file. */
var BK_ITER=250000;
function bkB64(buf){
  var b=new Uint8Array(buf),s='',i;
  for(i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s);
}
function bkUnB64(s){
  var bin=atob(s),b=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return b;
}
function bkKey(pass,salt,use){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:salt,iterations:BK_ITER,hash:'SHA-256'},
        base,{name:'AES-GCM',length:256},false,[use]);
    });
}
function backupEncrypt(text,pass){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return bkKey(pass,salt,'encrypt').then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));
  }).then(function(ct){
    return JSON.stringify({
      app:'better-me',enc:1,v:1,
      kdf:'PBKDF2-SHA256',iter:BK_ITER,
      salt:bkB64(salt),iv:bkB64(iv),ct:bkB64(ct),
      note:'AES-GCM. Import this in the app and give the password.'
    });
  });
}
function backupDecrypt(o,pass){
  var salt=bkUnB64(o.salt),iv=bkUnB64(o.iv),ct=bkUnB64(o.ct);
  return bkKey(pass,salt,'decrypt').then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  }).then(function(pt){
    return new TextDecoder().decode(pt);
  });
}

function importChosen(input){
  var f=input.files&&input.files[0];
  input.value='';
  if(!f)return;
  var r=new FileReader();
  r.onerror=function(){showToast('לא ניתן לקרוא את הקובץ');};
  r.onload=function(){
    var o=null;
    try{o=JSON.parse(r.result);}catch(e){}
    if(o&&o.app==='better-me'&&o.enc&&o.ct&&o.salt&&o.iv){
      _bkLocked=o;renderUnlockSheet();return;
    }
    if(!o||o.app!=='better-me'||!o.data||typeof o.data!=='object'){
      showToast('הקובץ לא נראה כמו גיבוי של האפליקציה');return;
    }
    _pendingImport=o;renderImportSheet();
  };
  r.readAsText(f);
}

function backupSummary(o){
  var keys=Object.keys(o.data),days=[],i,m;
  for(i=0;i<keys.length;i++){
    m=/^day_(\d{4}-\d{2}-\d{2})$/.exec(keys[i]);
    if(m)days.push(m[1]);
  }
  days.sort();
  return{keys:keys.length,days:days.length,from:days[0]||'',to:days[days.length-1]||''};
}

function closeImport(){
  _pendingImport=null;
  var el=document.getElementById('imp-overlay');
  if(el)el.remove();
}

function applyImport(mode){
  var o=_pendingImport;if(!o)return;
  var data=o.data,keys=Object.keys(data),i,k,n=0;
  if(mode==='replace'){
    var mine=[],j;
    for(j=0;j<localStorage.length;j++){k=localStorage.key(j);if(k&&!BACKUP_SKIP[k])mine.push(k);}
    for(j=0;j<mine.length;j++){try{localStorage.removeItem(mine[j]);}catch(e){}}
  }
  for(i=0;i<keys.length;i++){
    k=keys[i];
    if(BACKUP_SKIP[k])continue;
    if(mode==='merge'&&localStorage.getItem(k)!==null)continue;
    if(typeof data[k]!=='string')continue;
    try{localStorage.setItem(k,data[k]);n++;}catch(e){}
  }
  closeImport();
  // Pictures ride in the file separately and go back into the photo store.
  var jobs=[];
  if(o.photos&&typeof o.photos==='object'){
    Object.keys(o.photos).forEach(function(pk){
      if(typeof o.photos[pk]==='string')jobs.push(photoPutKeyed(pk,o.photos[pk]));
    });
  }
  showToast('✓ יובאו '+n+' פריטים');
  // Half the app caches its data in module variables; a reload is the honest
  // way to make every screen read the new state.
  Promise.all(jobs).then(function(){setTimeout(function(){location.reload();},600);});
}

// What counts as answered per question - an explicit "no" is an answer too.
function rfAnswered(q){
  var v=rfVal(q.id),i;
  if(q.kind==='branch')return v===true||v===false;
  if(q.kind==='chipsNote')return rfArr(q.id).length>0||!!rfVal(q.note);
  if(q.kind==='person')return !!rfVal('influentialPerson');
  if(q.kind==='timeline')return rfArr('dayTimeline').length>0;
  if(q.kind==='clock'){
    var c=rfVal('timeclock');
    if(!Array.isArray(c))return false;
    for(i=0;i<c.length;i++)if(c[i]&&c[i]!=='none')return true;
    return false;
  }
  if(q.kind==='steps')return (rfVal('steps')||0)>0;
  if(q.kind==='song')return !!rfVal('song');
  if(q.kind==='mood')return !!v;
  return typeof v==='string'?v.length>0:!!v;
}

// never a scrollbar inside the box: it grows to whatever is written in it
function rfGrow(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.max(200,el.scrollHeight)+'px';
}

   Fifteen questions is the right depth for somebody who wants it and far too
   many for somebody who wants to note the good bit and go to bed. Neither is
   wrong, so it is a choice rather than a default: turn a section off and its
   questions stop being asked AND stop appearing in the summary.

   Off means hidden, never deleted. A section switched off still holds
   everything ever written in it, and switching it back on brings all of it
   back - which is the only way this is safe to offer at all. */
var SUM_SECS_KEY='sum_sections';
var SUM_SECS=[
  {k:'moment', t:'הרגעים הטובים', d:'הרגע הכי טוב, מה שהשפיע, במה אתה גאה',
   ids:['moment','impactfulMoment','proudOf']},
  {k:'photo',  t:'תמונת היום',    d:'התמונה שמספרת את היום', ids:['photo']},
  {k:'food',   t:'סיכום תזונה',   d:'קלוריות, מאקרו ומים של אותו יום', auto:true},
  {k:'fit',    t:'כושר וצעדים',   d:'פעילות גופנית וספירת צעדים', ids:['steps'], auto:true},
  {k:'think',  t:'תובנות ומחשבות',d:'משפט שלקחת, מחשבה שחזרה, מה היית משנה',
   ids:['quote','recurringThought','differently','takeawayForTomorrow']},
  {k:'flow',   t:'זרימת היום',    d:'עוגנים לפי הסדר וציר היום', ids:['flow','dayTimeline']},
  {k:'time',   t:'לאן הלך הזמן',  d:'חלוקת השעות', ids:['timeclock']},
  {k:'energy', t:'אנרגיה',        d:'מה מילא אותך ומה רוקן', ids:['energyGivers','energyDrainers']},
  {k:'people', t:'אנשים',         d:'מי השפיע על היום', ids:['influentialPerson']},
  {k:'song',   t:'השיר של היום',  d:'', ids:['song']}
];
function sumSecsOn(){
  var raw=null;try{raw=localStorage.getItem(SUM_SECS_KEY);}catch(e){}
  if(raw===null)return null;                 // never chosen: everything is on
  try{var a=JSON.parse(raw);return Array.isArray(a)?a:null;}catch(e){return null;}
}
function sumSecOn(k){
  var on=sumSecsOn();
  return on?on.indexOf(k)>=0:true;
}
function sumSecToggle(k){
  var on=sumSecsOn(),i;
  if(!on){on=[];for(i=0;i<SUM_SECS.length;i++)on.push(SUM_SECS[i].k);}
  var at=on.indexOf(k);
  if(at>=0)on.splice(at,1);else on.push(k);
  try{localStorage.setItem(SUM_SECS_KEY,JSON.stringify(on));}catch(e){}
  // the sheet stays open: turning several off in a row is the normal case
  rfSecsOpen();
  if(typeof renderReflect==='function'&&_rfView==='home')renderReflectHome();
}
function sumSecsAll(){
  try{localStorage.removeItem(SUM_SECS_KEY);}catch(e){}
  rfSecsOpen();
  if(typeof renderReflect==='function'&&_rfView==='home')renderReflectHome();
}
// which step ids are switched off right now
function sumHiddenIds(){
  var out={},i,j;
  for(i=0;i<SUM_SECS.length;i++){
    if(sumSecOn(SUM_SECS[i].k))continue;
    var ids=SUM_SECS[i].ids||[];
    for(j=0;j<ids.length;j++)out[ids[j]]=1;
  }
  return out;
}
/* Steps belonging to no section - how you felt, how you rate the day - are
   the spine of the thing and are never filtered away. */
function rfSteps(){
  var all=_rfStage===2?RF_STAGE2:RF_STAGE1;
  var hide=sumHiddenIds(),out=[],i;
  for(i=0;i<all.length;i++)if(!hide[all[i].id])out.push(all[i]);
  return out.length?out:all;
}

function rfFace(i,col,on){
  return '<svg viewBox="0 0 24 24" stroke="'+(on?col:'#c0b8b0')+'">'+
    '<circle cx="12" cy="12" r="9.2"/>'+
    '<circle cx="9.1" cy="9.9" r=".95" fill="'+(on?col:'#c0b8b0')+'" stroke="none"/>'+
    '<circle cx="14.9" cy="9.9" r=".95" fill="'+(on?col:'#c0b8b0')+'" stroke="none"/>'+
    '<path d="'+RF_MOUTHS[i]+'"/></svg>';
}
function rfFaceMini(m){
  var i=Math.max(1,Math.min(5,m))-1;
  return '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke-width:1.7;stroke-linecap:round" stroke="'+RF_MOODS[i].c+'"><circle cx="12" cy="12" r="9.2"/><circle cx="9.1" cy="9.9" r=".95" fill="'+RF_MOODS[i].c+'" stroke="none"/><circle cx="14.9" cy="9.9" r=".95" fill="'+RF_MOODS[i].c+'" stroke="none"/><path d="'+RF_MOUTHS[i]+'"/></svg>';
}

function rfRec(d){return loadSummary(d)||null;}

// Every answer is written the moment it is given - there is no submit step,
// and closing the app mid-way loses nothing.
function rfSave(patch){
  var d=_rfDate||todayStr();
  var r=loadSummary(d)||{date:d,createdAt:new Date().toISOString()};
  for(var k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))r[k]=patch[k];
  r.date=d;
  if(!r.createdAt)r.createdAt=new Date().toISOString();
  r.updatedAt=new Date().toISOString();
  saveSummary(d,r);
  return r;
}
function rfVal(id){var r=rfRec(_rfDate);return r?r[id]:undefined;}
function rfArr(id){var v=rfVal(id);return Array.isArray(v)?v:[];}
function rfDone(r){return !!(r&&r.done);}
function rfProgress(){return Math.round(_rfStep/rfSteps().length*100);}

function enterReflect(){_rfDate=todayStr();_rfView='home';renderReflect();}
function renderReflect(){
  document.getElementById('hdr-title').textContent='סיום יום';
  if(_rfView==='home')renderReflectHome();
  else if(_rfView==='intro')renderReflectIntro();
  else if(_rfView==='step')renderReflectStep();
  else if(_rfView==='bridge')renderReflectBridge();
  else if(_rfView==='board')renderReflectBoard();
  else if(_rfView==='done')renderReflectDone();
  hydratePhotos();
  window.scrollTo(0,0);
}

/* ── module home ── */
function renderReflectHome(){
  var today=todayStr(),r=rfRec(today);
  var h='<div style="padding-bottom:24px">';
  h+='<div class="rf-hero">';
  if(!r){
    h+='<div class="rf-hero-t">עוד לא עצרת לסכם את היום.</div>';
    h+='<div class="rf-hero-s">כמה דקות, וזה שלך.</div>';
    h+='<button onclick="rfStart()" class="rf-next" style="margin-top:20px">התחל סיכום</button>';
  } else if(!rfDone(r)){
    h+='<div class="rf-hero-t">התחלת לסכם את היום.</div>';
    h+='<div class="rf-hero-s">אפשר להמשיך מאיפה שעצרת.</div>';
    h+='<button onclick="rfResume()" class="rf-next" style="margin-top:20px">המשך מאיפה שעצרת</button>';
    h+='<button onclick="rfStart()" class="rf-ghost">התחל מחדש</button>';
  } else {
    h+='<div class="rf-hero-t">סיכמת את היום שלך.</div>';
    h+='<div class="rf-hero-s">'+rfRecap(r)+'</div>';
    if(r.photo)h+=photoImg(r.photo,'style="width:100%;border-radius:18px;margin-top:16px;display:block"');
    h+='<button onclick="rfResume()" class="rf-ghost" style="margin-top:12px">פתח שוב</button>';
  }
  h+='</div>';

  h+='<button class="rf-secs-b" onclick="rfSecsOpen()">'+rfSecsLabel()+'</button>';

  var prev=[],i,d,s;
  for(i=1;i<=60;i++){
    d=new Date();d.setDate(d.getDate()-i);
    s=d.toISOString().slice(0,10);
    var rec=rfRec(s);
    if(rec)prev.push({d:s,r:rec});
    if(prev.length>=20)break;
  }
  if(prev.length){
    h+='<div class="cttl" style="margin:20px 0 10px">ימים קודמים</div>';
    for(i=0;i<prev.length;i++){
      var p=prev[i],pr=p.r;
      var dt=new Date(p.d+'T12:00:00');
      var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][dt.getDay()];
      h+='<button class="rf-day" onclick="openSummary(\''+p.d+'\')">';
      if(pr.photo)h+=photoImg(pr.photo,'class="rf-day-th"');
      else h+='<div class="rf-day-th" style="display:flex;align-items:center;justify-content:center">'+(pr.mood?rfFaceMini(pr.mood):'')+'</div>';
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:13px;font-weight:800;color:#4a4340">'+dn+' &middot; '+dt.getDate()+'.'+(dt.getMonth()+1)+'</div>';
      h+='<div style="font-size:10.5px;color:#a89e97;margin-top:2px">'+rfRecap(pr)+'</div></div>';
      if(pr.dayRating)h+='<div style="font-size:16px;font-weight:800;color:#a690cf;flex-shrink:0">'+pr.dayRating+'</div>';
      h+='</button>';
    }
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}
function rfRecap(r){
  var bits=[];
  if(r.mood)bits.push(RF_MOODS[Math.max(1,Math.min(5,r.mood))-1].l);
  if(r.dayRating)bits.push(r.dayRating+'/10');
  if(r.photo)bits.push('תמונה');
  return bits.length?bits.join(' · '):'נשמר';
}
function rfSecsLabel(){
  var on=sumSecsOn();
  return on?('מה נכנס לסיכום &middot; '+on.length+' מתוך '+SUM_SECS.length)
           :'מה נכנס לסיכום &middot; הכל';
}
function rfSecsOpen(){
  var old=document.getElementById('rf-secs');if(old)old.remove();
  var all=!sumSecsOn(),i;
  var h='<div class="rf-secs-ov" id="rf-secs" onclick="if(event.target===this)rfSecsClose()">'+
        '<div class="rf-secs">'+
        '<div class="rf-secs-hd"><span>מה נכנס לסיכום היום</span>'+
        '<button class="rf-secs-x" onclick="rfSecsClose()">&times;</button></div>'+
        '<div class="rf-secs-n">מה שתכבה לא ייכלל בסיכום ולא יישאל אותך. שום דבר לא נמחק — '+
        'הדלקה חוזרת מחזירה גם את מה שכבר כתבת.</div>';
  h+='<button class="rf-secs-all'+(all?' on':'')+'" onclick="sumSecsAll()">הכל</button>';
  for(i=0;i<SUM_SECS.length;i++){
    var sc=SUM_SECS[i],on=sumSecOn(sc.k);
    h+='<button class="rf-sec'+(on?' on':'')+'" onclick="sumSecToggle(&quot;'+sc.k+'&quot;)">'+
       '<span class="rf-sec-tick">'+(on?'&#10003;':'')+'</span>'+
       '<span class="rf-sec-t">'+sc.t+(sc.d?'<i>'+sc.d+'</i>':'')+'</span></button>';
  }
  h+='</div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  document.body.style.overflow='hidden';
}
function rfSecsClose(){
  var e=document.getElementById('rf-secs');if(e)e.remove();
  document.body.style.overflow='';
}
function rfStart(){_rfDate=todayStr();_rfStage=1;_rfStep=0;_rfView='intro';renderReflect();}
function rfResume(){
  _rfDate=todayStr();
  var r=rfRec(_rfDate);
  _rfStage=(r&&r.lastStage)||1;
  _rfStep=Math.min(rfSteps().length-1,(r&&r.lastStep)||0);
  // Someone who got as far as the deep pass comes back to the board, not to
  // whichever card they happened to open last.
  _rfView=_rfStage===2?'board':'step';
  renderReflect();
}

/* ── the deep-pass board ── */
function renderReflectBoard(){
  var i,done=0;
  for(i=0;i<RF_STAGE2.length;i++)if(rfAnswered(RF_STAGE2[i]))done++;

  var h='<div style="padding:6px 0 24px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">';
  h+='<div class="rf-q" style="font-size:21px">במה בא לך להעמיק?</div>';
  h+='<div style="font-size:11px;color:#a89e97;font-weight:700;flex-shrink:0">'+done+'/'+RF_STAGE2.length+'</div></div>';
  h+='<div class="rf-sub" style="margin-bottom:18px">בחר מה שמדבר אליך. אין חובה לענות על הכל, ואפשר לסיים מתי שבא לך.</div>';

  h+='<div class="rf-board">';
  for(i=0;i<RF_STAGE2.length;i++){
    var q=RF_STAGE2[i],g=RF_GRAD[q.g]||RF_GRAD.lav,ok=rfAnswered(q);
    h+='<button class="rf-card'+(ok?' done':'')+'" style="background:'+g[0]+'" onclick="rfOpenCard('+i+')">';
    if(ok)h+='<div class="rf-card-v">&#10003;</div>';
    h+='<div class="rf-card-ic" style="color:'+g[1]+'"><svg viewBox="0 0 24 24">'+(RF_ICONS[q.ic]||'')+'</svg></div>';
    h+='<div class="rf-card-t">'+q.t+'</div>';
    h+='<div class="rf-card-s">'+q.s+'</div>';
    h+='</button>';
  }
  h+='</div>';

  h+='<button onclick="rfFinish()" class="rf-next" style="margin-top:20px">סיימתי להיום</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}
function rfOpenCard(i){_rfStage=2;_rfStep=i;_rfView='step';rfSave({lastStage:2,lastStep:i});renderReflect();}

/* ── intro ── */
function renderReflectIntro(){
  var h='<div class="rf"><div class="rf-body" style="text-align:center">';
  h+='<div class="rf-q" style="font-size:27px">בוא ניקח רגע להסתכל על היום שלך.</div>';
  h+='<div class="rf-sub" style="font-size:14px">כמה דקות, וזה שלך.</div>';

  h+='<button onclick="_rfView=\'home\';renderReflect()" class="rf-ghost">לא עכשיו</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
}

/* ── one question ── */
function renderReflectStep(){
  var q=rfSteps()[_rfStep];
  if(!q){rfStageEnd();return;}
  var cur=rfVal(q.id),i,c,o;

  var h='<div class="rf"><div class="rf-top">';
  h+='<button class="rf-icon" onclick="rfBack()">&#8250;</button>';
  h+='<div class="rf-bar"><div class="rf-bar-f" style="width:'+rfProgress()+'%"></div></div>';
  h+='<button class="rf-skip" onclick="rfSkip()">דלג</button>';
  h+='</div><div class="rf-body">';
  h+='<div class="rf-q">'+q.q+'</div>';
  if(q.sub)h+='<div class="rf-sub">'+q.sub+'</div>';
  h+='<div class="rf-field">';

  if(q.kind==='mood'){
    h+='<div class="rf-moods">';
    for(i=0;i<RF_MOODS.length;i++){
      var m=RF_MOODS[i],on=cur===m.v;
      h+='<button class="rf-mood'+(on?' on':'')+'" onclick="rfPickMood(\''+q.id+'\','+m.v+')">'+rfFace(i,m.c,on)+'<span class="rf-mood-l">'+m.l+'</span></button>';
    }

    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='chipsNote'){
    h+=rfChipsHTML(q.id,q.opts,rfArr(q.id));
    h+='<textarea class="rf-in" id="rf-note" style="min-height:64px;margin-top:18px" placeholder="'+(q.ph||'')+'">'+(rfVal(q.note)?esc(rfVal(q.note)):'')+'</textarea>';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='scale'){
    h+='<div class="rf-scale">';
    for(i=1;i<=10;i++)h+='<button class="rf-num'+(cur===i?' on':'')+'" onclick="rfPickScale('+i+')">'+i+'</button>';
    h+='</div><div class="rf-echo" id="rf-echo">'+(cur?rfRatingEcho(cur):'')+'</div>';
  }
  else if(q.kind==='ladder'){
    h+='<div class="rf-ladder">';
    for(i=0;i<q.opts.length;i++)h+='<button class="rf-rung'+(cur===i+1?' on':'')+'" onclick="rfPickLadder('+(i+1)+')">'+q.opts[i]+'</button>';
    h+='</div>';
  }
  else if(q.kind==='text'){
    h+='<textarea class="rf-in" id="rf-in" oninput="rfGrow(this)" placeholder="'+(q.ph||'')+'">'+(cur?esc(cur):'')+'</textarea>';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='photo'){
    h+='<div id="rf-photo">'+rfPhotoHTML(cur)+'</div>';
    if(cur){
      h+='<div class="rf-sub" style="margin-top:22px;font-weight:700;color:#4a4340;font-size:14px">רוצה להוסיף משהו לתמונה?</div>';
      h+='<textarea class="rf-in" id="rf-cap" style="min-height:70px" placeholder="מה קרה ברגע הזה? למה בחרת דווקא בתמונה הזאת? או פשוט משהו שתרצה לזכור.">'+(rfVal('photoCaption')?esc(rfVal('photoCaption')):'')+'</textarea>';
    }
    h+='<input type="file" id="rf-file" accept="image/*" style="display:none" onchange="rfPhotoPick(this)">';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';

    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  /* the day as a short vertical timeline */
  else if(q.kind==='timeline'){
    var tl=rfArr('dayTimeline');
    h+='<div style="display:flex;flex-direction:column;gap:0">';

      h+='<div style="flex:1;padding-bottom:16px;min-width:0">';
      h+='<div style="font-size:10.5px;color:#a89e97;font-weight:700">'+esc(tl[i].t||'')+'</div>';

      h+='<button onclick="rfTlDel('+i+')" style="background:none;border:none;color:#e0c4bb;font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0">&times;</button>';

    h+='<input id="rf-tl-t" class="mtin" style="width:96px;margin-bottom:0;font-size:12px" placeholder="שעה" list="rf-parts">';
    h+='<datalist id="rf-parts">';
    for(i=0;i<RF_PARTS.length;i++)h+='<option value="'+RF_PARTS[i]+'">';
    h+='</datalist>';
    h+='<input id="rf-tl-w" class="mtin" style="flex:1;margin-bottom:0;font-size:12px" placeholder="מה קרה?" onkeydown="if(event.key===\'Enter\')rfTlAdd()">';

/* ── answering ── */
function rfCommitText(){
  var q=rfSteps()[_rfStep];if(!q)return;
  var el,p={};
  if(q.kind==='text'){
    el=document.getElementById('rf-in');
    if(el){p[q.id]=el.value.trim();rfSave(p);}
  } else if(q.kind==='photo'){
    el=document.getElementById('rf-cap');
    if(el)rfSave({photoCaption:el.value.trim()});
  } else if(q.kind==='chipsNote'||q.kind==='branch'){
    el=document.getElementById('rf-note');
    if(el&&q.note){p[q.note]=el.value.trim();rfSave(p);}
  } else if(q.kind==='steps'){
    el=document.getElementById('rf-in');
    var n=el?parseInt(el.value,10):NaN;
    if(n>=0){saveSteps(_rfDate,n,'manual');rfSave({steps:n});}
    else rfSave({steps:stepsOf(_rfDate)});
  } else if(q.kind==='song'){
    var s1=document.getElementById('rf-song'),s2=document.getElementById('rf-artist');
    rfSave({song:s1?s1.value.trim():'',songArtist:s2?s2.value.trim():''});
  } else if(q.kind==='clock'){
    var clk=interviewAnswers.timeclock||new Array(25).fill('none');
    rfSave({timeclock:clk.slice(),timeDistribution:rfClockTotals(clk)});
  } else if(q.kind==='flow'){
    // an empty box is scaffolding; one with only a photo is still an answer
    var a=rfFlowRead(),keep=[],j;
    for(j=0;j<a.length;j++)if(a[j].w||a[j].p)keep.push(a[j]);
    rfSave({flow:keep});
  }
}
function rfStageEnd(){
  if(_rfStage===1){_rfView='bridge';renderReflect();}
  else{_rfView='board';renderReflect();}
}
// The quick summary runs as a queue; the deep pass is picked off a board, so
// finishing one of its questions returns there rather than marching on.
function rfAdvance(){
  if(_rfStage===2){_rfView='board';renderReflect();return;}
  var last=rfSteps().length-1;
  rfSave({lastStep:Math.min(last,_rfStep+1),lastStage:1});
  _rfStep++;
  if(_rfStep>rfSteps().length-1)rfStageEnd();
  else renderReflect();
}
function rfNext(){rfCommitText();rfAdvance();}
function rfSkip(){rfCommitText();rfAdvance();}
function rfBack(){
  rfCommitText();
  if(_rfStage===2){_rfView='board';renderReflect();return;}
  if(_rfStep===0){_rfView='home';renderReflect();return;}
  _rfStep--;rfSave({lastStep:_rfStep,lastStage:1});renderReflect();
}

/* While the screen is open every slot is kept, empty ones included, so the
   boxes on screen stay lined up with the photos in storage. parseFlow, which
   drops the empties, is for reading a saved day. */
function rfFlowRaw(){
  var v=rfVal('flow'),out=[],i,s;
  if(!Array.isArray(v))return parseFlow(v);
  for(i=0;i<v.length;i++){
    s=v[i];
    if(typeof s==='string')out.push({w:s,p:''});
    else if(s&&typeof s==='object')out.push({w:s.w||'',p:s.p||''});
    else out.push({w:'',p:''});
  }
  return out;
}
// The boxes are live inputs, so anything typed has to be read out of the DOM
// before a re-render replaces them; photos come from storage by the same index.
function rfFlowRead(){
  var stored=rfFlowRaw(),out=[],i=0,el;
  while((el=document.getElementById('rf-fl-'+i))){
    out.push({w:el.value.trim(),p:(stored[i]&&stored[i].p)||''});
    i++;
  }
  return out;
}

  var a=rfFlowRead();a.push({w:'',p:''});

function rfFlowPhotoPick(input){
  var file=input.files&&input.files[0],idx=_rfFlowIdx;
  input.value='';
  if(!file||idx<0)return;
  var a=rfFlowRead();               // capture what is typed before re-rendering
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      // Deliberately smaller than the day photo: these are thumbnails inside a
      // diagram, and several of them ride along with every day.
      var cv=document.createElement('canvas'),mx=640,w=img.width,h=img.height;
      if(w>mx){h=Math.round(h*mx/w);w=mx;}
      if(h>mx){w=Math.round(w*mx/h);h=mx;}
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      var d=cv.toDataURL('image/jpeg',0.68);
      photoPut(d).then(function(key){
        if(a[idx])a[idx].p=key||d;
        rfSave({flow:a});renderReflectStep();

    img.src=e.target.result;
  };
  reader.readAsDataURL(file);

/* ── "ME" ──
   The other half of the app: what the days add up to. Built around what the
   numbers say rather than around how many charts fit - a screen of graphs
   nobody returns to is worse than three that tell you something.

   Chart colours are their own set, deeper than the interface palette. The
   soft UI pastels fail as data colours: too little chroma to read as
   identity, and the green and terracotta are 4.1 ΔE apart under deuteranopia,
   which is indistinguishable. These four pass lightness, chroma, CVD
   separation, normal-vision separation and contrast. */
var ME_C=['#7c5cc4','#d4553a','#0f7fa5','#b8791a'];
var ME_INK='#4a4340',ME_MUTE='#a89e97',ME_GRID='#f0ebe4';
var _meRange=14;

function meDayList(n){
  var out=[],i,d,s;
  for(i=n-1;i>=0;i--){
    d=new Date();d.setDate(d.getDate()-i);
    s=d.toISOString().slice(0,10);
    out.push({date:s,d:d,sum:loadSummary(s),day:loadDay(s),steps:stepsOf(s)});
  }
  return out;
}
function meDow(d){return ['א','ב','ג','ד','ה','ו','ש'][d.getDay()];}
function meAvg(a){var i,t=0;if(!a.length)return null;for(i=0;i<a.length;i++)t+=a[i];return t/a.length;}

/* A line over time. One series, so no legend - the title names it. Points are
   8px, the line 2px, the grid recessive, and only the last value is labelled;
   a number on every point is noise. Tapping a point reads it out above. */
function meLine(id,rows,pick,col,fmt){
  var pts=[],i,v;
  for(i=0;i<rows.length;i++){v=pick(rows[i]);if(v!==null&&v!==undefined&&!isNaN(v))pts.push({i:i,v:v,date:rows[i].date});}
  if(pts.length<2)return '<div class="me-empty">עוד אין מספיק ימים כדי לצייר קו.</div>';
  var W=320,H=132,PL=26,PR=14,PT=16,PB=22,cW=W-PL-PR,cH=H-PT-PB;
  var vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mn===mx){mn=mn-1;mx=mx+1;}
  var pad=(mx-mn)*0.15;mn-=pad;mx+=pad;
  function xp(i){return PL+(rows.length<2?0:i*(cW/(rows.length-1)));}
  function yp(v){return PT+cH*(1-(v-mn)/(mx-mn));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="me-svg" xmlns="http://www.w3.org/2000/svg">';
  for(i=0;i<=3;i++){var gy=PT+cH*i/3;s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="'+ME_GRID+'" stroke-width="1"/>';}
  var lp='',ap='';
  for(i=0;i<pts.length;i++){lp+=(i?' L':'M')+xp(pts[i].i).toFixed(1)+','+yp(pts[i].v).toFixed(1);}
  ap=lp+' L'+xp(pts[pts.length-1].i).toFixed(1)+','+(PT+cH)+' L'+xp(pts[0].i).toFixed(1)+','+(PT+cH)+' Z';
  s+='<path d="'+ap+'" fill="'+col+'" opacity=".10"/>';
  s+='<path d="'+lp+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  for(i=0;i<pts.length;i++)
    s+='<circle class="me-pt" cx="'+xp(pts[i].i).toFixed(1)+'" cy="'+yp(pts[i].v).toFixed(1)+'" r="4" fill="'+col+'" stroke="#fff" stroke-width="2" '+
       'onclick="meRead(\''+id+'\',\''+pts[i].date+'\',\''+fmt(pts[i].v)+'\')"/>';
  var lastP=pts[pts.length-1];
  s+='<text x="'+(xp(lastP.i)-6).toFixed(1)+'" y="'+(yp(lastP.v)-9).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="'+ME_INK+'">'+fmt(lastP.v)+'</text>';
  for(i=0;i<rows.length;i+=Math.ceil(rows.length/7))
    s+='<text x="'+xp(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="'+ME_MUTE+'">'+meDow(rows[i].d)+'</text>';
  s+='</svg>';
  return s;
}

/* Bars for counts. Ends rounded 4px and anchored to the baseline, 2px of
   surface between neighbours. */
function meBars(id,rows,pick,col,fmt){
  var vals=rows.map(pick),i,any=false;
  for(i=0;i<vals.length;i++)if(vals[i])any=true;
  if(!any)return '<div class="me-empty">עוד אין מה למדוד כאן.</div>';
  var mx=Math.max.apply(null,vals.map(function(v){return v||0;}))||1;
  var W=320,H=118,PL=8,PR=8,PT=14,PB=20,cW=W-PL-PR,cH=H-PT-PB;
  var bw=(cW/rows.length)-2;
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="me-svg" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+PL+'" y1="'+(PT+cH)+'" x2="'+(PL+cW)+'" y2="'+(PT+cH)+'" stroke="'+ME_GRID+'" stroke-width="1"/>';
  for(i=0;i<rows.length;i++){
    var v=vals[i]||0,bh=Math.max(v?3:0,cH*(v/mx)),x=PL+i*(cW/rows.length)+1;
    if(v)s+='<rect class="me-bar" x="'+x.toFixed(1)+'" y="'+(PT+cH-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="'+col+'" '+
      'onclick="meRead(\''+id+'\',\''+rows[i].date+'\',\''+fmt(v)+'\')"/>';
    if(i%Math.ceil(rows.length/7)===0)
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="'+ME_MUTE+'">'+meDow(rows[i].d)+'</text>';
  }
  s+='</svg>';
  return s;
}
function meRead(id,date,val){
  var el=document.getElementById('rd-'+id);
  if(!el)return;
  var d=new Date(date+'T12:00:00');
  el.textContent=val+' · '+meDow(d)+' '+d.getDate()+'.'+(d.getMonth()+1);
}
function meCard(id,title,sub,body){
  var h='<div class="me-card"><div class="me-hd"><div>';
  h+='<div class="me-t">'+title+'</div>';
  if(sub)h+='<div class="me-s">'+sub+'</div>';

function renderMe(){

/* The only place here that needs more than one colour, so the only place the
   categorical set is used - with a legend, since colour alone is never identity. */
function meTimeSplit(rows){
  var keys=['sleep','work','social','other'];
  var lbl={sleep:'שינה',work:'עבודה',social:'חברתי',other:'אחר'};
  var tot={sleep:0,work:0,social:0,other:0},days=0,i,k,td;
  for(i=0;i<rows.length;i++){
    td=rows[i].sum&&rows[i].sum.timeDistribution;
    if(!td)continue;
    days++;
    for(k in tot)if(td[k])tot[k]+=td[k];
  }
  if(!days)return meCard('split','לאן הולך הזמן','','<div class="me-empty">סמן את השעון בסיכום יום, וזה יתמלא.</div>');
  var sum=keys.reduce(function(a,k2){return a+tot[k2];},0)||1;
  var b='<div class="me-stack">';
  keys.forEach(function(k2,idx){
    if(!tot[k2])return;
    b+='<span style="width:'+(tot[k2]/sum*100).toFixed(1)+'%;background:'+ME_C[idx]+'"></span>';
  });
  b+='</div><div class="me-legend">';
  keys.forEach(function(k2,idx){
    if(!tot[k2])return;
    b+='<span class="me-lg"><i style="background:'+ME_C[idx]+'"></i>'+lbl[k2]+' <b>'+(tot[k2]/days).toFixed(1)+'ש׳</b></span>';
  });
  b+='</div>';
  return meCard('split','לאן הולך הזמן','ממוצע ליום, על פני '+days+' ימים',b);
}

/* What the numbers actually say. Each one is a comparison the user could not
   make in their head, and each says how many days it rests on - a difference
   from two days is not a pattern. */
function meInsights(rows){
  var h='',i,r,withW=[],noW=[],byMood={},givers={};
  for(i=0;i<rows.length;i++){
    r=rows[i].sum;
    if(!r||!r.dayRating)continue;
    var trained=!!(r.workout&&String(r.workout).trim());
    (trained?withW:noW).push(r.dayRating);
    if(r.mood){byMood[r.mood]=byMood[r.mood]||[];byMood[r.mood].push(r.dayRating);}
    if(Array.isArray(r.energyGivers))r.energyGivers.forEach(function(g){givers[g]=(givers[g]||0)+1;});
  }
  var cards='';
  if(withW.length>=2&&noW.length>=2){
    var a=meAvg(withW),b=meAvg(noW),diff=a-b;
    cards+=meInsight(
      diff>=0?'ימים שהתאמנת בהם טובים יותר':'ימים שהתאמנת בהם לא יצאו טובים יותר',
      'ציון ממוצע '+a.toFixed(1)+' לעומת '+b.toFixed(1)+' בלי אימון',
      withW.length+' ימים עם אימון, '+noW.length+' בלי',
      diff>=0?ME_C[2]:ME_C[1]);
  }
  var top=Object.keys(givers).sort(function(x,y){return givers[y]-givers[x];})[0];
  if(top&&givers[top]>=2)
    cards+=meInsight('מה מילא אותך הכי הרבה','"'+top+'" חזר '+givers[top]+' פעמים',
      'מתוך התשובות שלך בהעמקה',ME_C[0]);
  if(!cards)cards='<div class="me-empty">עוד אין מספיק ימים מסוכמים כדי למצוא דפוסים. זה יתמלא מעצמו.</div>';
  return meCard('ins','מה עולה מהנתונים','',cards);
}
function meInsight(title,line,foot,col){
  return '<div class="me-ins" style="border-right:3px solid '+col+'">'+
    '<div class="me-ins-t">'+title+'</div>'+
    '<div class="me-ins-l">'+line+'</div>'+
    '<div class="me-ins-f">'+foot+'</div></div>';
}

/* ── THE SKY ──
   The background is not a flat colour any more: it is the hour you opened the
   app in. Six phases from before dawn to night, a light that sits where the
   sun would be, cloud shapes drifting slowly enough that you only notice if
   you look, and stars that come out after dark.

   Kept cheap on purpose. Three drifting shapes by day, plus thirty small
   stars after dark - and the star field is display:none until then, so they
   cost nothing in daylight. Everything animates only transform and
   opacity, so it stays on the compositor and never touches layout - a phone
   held for two minutes should not get warm. Motion is off entirely for anyone
   who has asked their system for less of it.

   It sits behind Better's home and behind Me. Module screens keep the flat
   ground: a drifting sky behind a hundred rows of a food log is noise. */
var SKY_PHASES={
  night:  {a:'#221d38',b:'#171528',glow:'rgba(150,140,220,.20)',gx:'78%',gy:'14%',dark:true},
  dawn:   {a:'#fde3cf',b:'#ecd9ee',glow:'rgba(255,175,125,.55)',gx:'84%',gy:'82%'},
  morning:{a:'#eaf3fa',b:'#e9ecf4',glow:'rgba(255,232,180,.48)',gx:'76%',gy:'18%'},
  day:    {a:'#dfeaf8',b:'#e4e2f4',glow:'rgba(255,247,214,.60)',gx:'50%',gy:'2%'},
  golden: {a:'#fddcbd',b:'#f0d3e2',glow:'rgba(255,160,90,.58)',gx:'16%',gy:'76%'},
  dusk:   {a:'#dccfee',b:'#bfb2da',glow:'rgba(255,150,170,.34)',gx:'12%',gy:'90%'}
};
function skyPhase(h){
  if(h<5)return'night';
  if(h<7)return'dawn';
  if(h<11)return'morning';
  if(h<16)return'day';
  if(h<19)return'golden';
  if(h<21)return'dusk';
  return'night';
}
var _skyNow='';
function buildSky(){
  if(document.getElementById('sky'))return;
  var d=document.createElement('div');
  d.id='sky';d.className='sky';
  var h='<div class="sky-glow"></div>';
  h+='<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>';
  // Positions are fixed rather than random so the sky is the same sky every
  // time you open it, not a different one each load.
  var seeds=[[8,14],[21,32],[34,9],[47,24],[58,41],[66,12],[73,29],[81,17],[88,37],
             [13,44],[27,52],[41,58],[55,49],[69,56],[84,47],[92,26],[4,33],[17,22],
             [30,38],[44,12],[62,25],[76,44],[90,58],[52,17],[24,7],[38,45],[70,8],
             [96,40],[11,58],[63,36]];
  h+='<div class="stars">';
  for(var i=0;i<seeds.length;i++){
    var s=seeds[i],dur=(2.6+(i%5)*0.7).toFixed(1),del=((i*0.37)%3.4).toFixed(2);
    h+='<i style="left:'+s[0]+'%;top:'+s[1]+'%;animation-duration:'+dur+'s;animation-delay:'+del+'s;'+
       'width:'+(i%4===0?2.4:1.7)+'px;height:'+(i%4===0?2.4:1.7)+'px"></i>';
  }
  h+='</div>';
  d.innerHTML=h;
  document.body.insertBefore(d,document.body.firstChild);
}
function paintSky(){
  buildSky();
  var el=document.getElementById('sky');
  if(!el)return;
  var name=skyPhase(new Date().getHours());
  if(name===_skyNow)return;
  _skyNow=name;
  var p=SKY_PHASES[name];
  el.style.background='radial-gradient(120% 70% at '+p.gx+' '+p.gy+', '+p.glow+', transparent 62%),'+
                      'linear-gradient(165deg,'+p.a+' 0%,'+p.b+' 100%)';
  el.className='sky sky-'+name;
  // Set directly rather than through the cascade: one place decides the phase,
  // and it is the same place that decides the colours.
  var st=el.querySelector('.stars');
  if(st)st.className='stars'+(p.dark?' out':'');
  document.body.classList.toggle('night',!!p.dark);
}
// Re-checked every few minutes so a phase can change while the app is open,
// and on the way back from the background where timers were frozen.
setInterval(paintSky,180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)paintSky();});

  {id:'closet',color:'#b07aa1',title:'הארון שלי',sub:'לצלם בגדים ולהרכיב לוקים',fresh:true,
   svg:'<svg viewBox="0 0 24 24"><path d="M9 3.4h6l3.2 3.1-2.3 2.2-.9-.8v12.7H7l0-12.7-.9.8L3.8 6.5Z"/></svg>'},
  {id:'game',color:'#c98b3f',title:'משחק',sub:'החץ &mdash; מי עונה על השאלה',
   svg:'<svg viewBox="0 0 24 24"><path d="M4 20 18.5 5.5"/><path d="M13.5 5.5h5v5"/><path d="m6.5 13.5 4 4"/></svg>'}
];
function areaDef(id){for(var i=0;i<HOME_AREAS.length;i++)if(HOME_AREAS[i].id===id)return HOME_AREAS[i];return null;}
function areasChosen(){
  var raw=null;try{raw=localStorage.getItem(AREAS_KEY);}catch(e){}
  if(raw===null)return null;
  try{var a=JSON.parse(raw);return Array.isArray(a)?a:null;}catch(e){return null;}
}
/* An area added after somebody picked their list would be invisible to them:
   the saved list is what is ON, so a new id reads as one they turned off. It
   is not - they were never offered it. So the ids they HAVE been offered are
   recorded separately, and anything absent from that is new and shows until
   they say otherwise. */
var AREAS_SEEN_KEY='home_areas_seen';
function areasSeen(){
  try{var a=JSON.parse(localStorage.getItem(AREAS_SEEN_KEY)||'null');return Array.isArray(a)?a:null;}
  catch(e){return null;}
}
function areasMarkSeen(){
  var all=[],i;
  for(i=0;i<HOME_AREAS.length;i++)all.push(HOME_AREAS[i].id);
  try{localStorage.setItem(AREAS_SEEN_KEY,JSON.stringify(all));}catch(e){}
}
function areaShown(id){
  var d=areaDef(id);
  if(d&&d.fixed)return true;
  var on=areasChosen();
  if(!on)return true;                       // never chose: everything shows
  if(on.indexOf(id)>=0)return true;
  /* Absent from a saved list normally means turned off, and must keep meaning
     that - the first version of this returned true whenever no 'seen' record
     existed, which is every user who chose their areas before today, and would
     have brought back every area any of them had ever switched off.

     Only an area added AFTER that list was saved is exempt, and only until
     the list is next written. */
  if(!d||!d.fresh)return false;
  var seen=areasSeen();
  return !seen||seen.indexOf(id)<0;
}
function areaToggle(id){
  var d=areaDef(id),i;
  if(!d||d.fixed)return;
  var on=areasChosen();
  if(!on){on=[];for(i=0;i<HOME_AREAS.length;i++)on.push(HOME_AREAS[i].id);}
  /* A new area is on screen because it is new, not because the saved list
     says so. Writing that list for any other reason would drop it - toggle
     something unrelated and the closet would vanish having never been
     refused. So anything new and currently showing is written in first, and
     becomes an ordinary member that stays until it is actually turned off. */
  for(i=0;i<HOME_AREAS.length;i++){
    var a=HOME_AREAS[i];
    if(a.fresh&&a.id!==id&&on.indexOf(a.id)<0&&areaShown(a.id))on.push(a.id);
  }
  var k=on.indexOf(id);
  if(k>=0)on.splice(k,1);else on.push(id);

/* ── TODAY, AT THE TOP ──
   The first thing on the board: what day it is, what time it is, how much of
   the day has gone, and the two things you would otherwise open the planner
   to see - what is scheduled, and what you told yourself not to forget.

   The bar is the day from 06:00 to midnight, which is the range the planner
   draws, so the marker sits where it would sit on that grid. Before six it
   reads empty rather than negative.

   Everything here is read-only on purpose. It is a glance, not a screen: the
   whole card is a way into תכנון זמן, and anything you want to change you
   change there, where there is room to do it. */
function nowTodayHM(){
  var n=new Date();
  return (n.getHours()<10?'0':'')+n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes();
}
function todayNotes(date){
  var dp=loadDPlan(date),out=[],i,t;
  var all=dpAll(date);
  for(i=0;i<all.length;i++){
    t=all[i];
    var n='';
    if(t.src==='day'){
      for(var j=0;j<dp.items.length;j++)if(dp.items[j].id===t.id)n=dp.items[j].n||'';
    } else n=(dp.notes&&dp.notes[t.id])||'';
    if(n&&n.trim())out.push({w:t.w,n:n.trim(),c:t.c,hour:t.hour,min:t.min||0});
  }
  out.sort(function(a,b){
    if(a.hour===null)return 1;
    if(b.hour===null)return -1;
    return (a.hour*60+a.min)-(b.hour*60+b.min);
  });
  return out;
}
/* ── THE GREETING ──
   The first line on the screen, before the day's plan.

   It changes with the hour, and it changes with the day. A greeting that
   said the same four words every morning would stop being read within a
   week - the eye learns it and skips it. Seven per part of the day, chosen
   by the date, means a full week passes before one comes round again, and
   the one you get is the same all day rather than shuffling under you every
   time the screen redraws.

   The name is optional. Without one the greeting still works - it just
   greets the morning instead of the person - and the line invites you to
   add it. Tapping the greeting is how you set or change it, because that is
   where you are looking when you notice it is missing or wrong. */
var GREET_NAME_KEY='greet_name';
function greetName(){
  try{
    var n=localStorage.getItem(GREET_NAME_KEY);
    if(n&&n.trim())return n.trim();
  }catch(e){}
  var p=loadProfile();
  return (p&&p.name&&String(p.name).trim())?String(p.name).trim():'';
}
function greetSetName(v){
  v=(v||'').trim().slice(0,24);
  try{localStorage.setItem(GREET_NAME_KEY,v);}catch(e){}
  var p=loadProfile();p.name=v;saveProfile(p);
}
var GREETS={
  morning:[
    'בוקר טוב','בוקר נפלא','בוקר אור','בוקר מלא באנרגיה',
    'יום חדש מתחיל','בוקר בהיר','שיהיה בוקר מצוין'
  ],
  noon:[
    'צהריים טובים','צהריים נעימים','המשך יום טוב','חצי יום מאחוריך',
    'צהריים מוארים','שיהיה המשך יום מצוין','אמצע היום'
  ],
  evening:[
    'ערב טוב','ערב נעים','ערב שקט','סוף יום טוב',
    'ערב רגוע','שיהיה ערב נעים','ערב מואר'
  ],
  night:[
    'לילה טוב','לילה שקט','לילה רגוע','זמן לנוח',
    'מנוחה נעימה','שינה טובה','לילה שקט ומנוחה'
  ]
};
var GREET_ICON={morning:'☀️',noon:'',evening:'🌙',night:'🌙'};
function greetPart(h){
  // every band stated at both ends. Written as bare upper bounds the small
  // hours fell through to the first one that matched - two in the morning
  // was being wished a good afternoon.
  if(h>=5&&h<12)return 'morning';
  if(h>=12&&h<17)return 'noon';
  if(h>=17&&h<22)return 'evening';
  return 'night';
}
/* Which day it is, counted from a fixed point rather than from the year, so
   the phrase changes on the last day of December like any other day. The
   night hours before dawn belong to the evening that led into them: at two
   in the morning you have not started a new day yet. */
function greetIndex(d){
  var t=new Date(d.getTime());
  if(t.getHours()<5)t.setDate(t.getDate()-1);
  return Math.floor(t.getTime()/86400000+t.getTimezoneOffset()/-1440);
}
function greetText(now){
  var d=now||new Date(),part=greetPart(d.getHours()),list=GREETS[part];
  var w=list[((greetIndex(d)%list.length)+list.length)%list.length];
  var n=greetName(),ic=GREET_ICON[part];
  return {text:w+(n?', '+n:''),icon:ic,named:!!n};
}
/* ── THE STREAK ──
   Days in a row you did something here.

   The whole design turns on what "something" means, and the wrong answer
   ruins it. A streak that counts opening the app rewards nothing and means
   nothing - you would keep it alive by unlocking your phone. A streak that
   demands the full evening reflection is a streak you break on the first busy
   Tuesday, and a broken streak is worse than none: it stops being a record of
   what you did and becomes a thing you failed at.

   So it counts a day where you recorded anything real - a meal, a workout, a
   journal line, water, steps, a vlog, the reflection. That is honest: it says
   you turned up to your own life today, which is the thing worth counting.

   Nothing new is stored. The streak is read back out of the records that
   already exist, which means it is true from the day you started rather than
   from the day this was written - open it and it already knows. */
function dayHadActivity(d){
  try{
    var day=JSON.parse(localStorage.getItem('day_'+d)||'null');
    if(day&&((day.meals&&day.meals.length)||day.water>0))return true;
    if(localStorage.getItem('sum_'+d))return true;
    if(localStorage.getItem('vlog_'+d))return true;
    var j=localStorage.getItem(JRNL_PRE+d);
    if(j&&j.replace(/\s|["{}\[\]:,]|text|body/g,'').length>2)return true;
    var st=JSON.parse(localStorage.getItem('steps_'+d)||'null');
    if(st&&st.v>0)return true;
    // a plan is only activity once something was actually put on the clock
    var dp=JSON.parse(localStorage.getItem('dplan_'+d)||'null');
    if(dp&&dp.items&&dp.items.length)return true;
  }catch(e){}
  return false;
}
// workouts are stored as one list with timestamps rather than per day
var _stkWorkoutDays=null;
function workoutDays(){
  if(_stkWorkoutDays)return _stkWorkoutDays;
  var m={},log=[];
  try{log=loadWorkoutLog()||[];}catch(e){}
  for(var i=0;i<log.length;i++){
    var dt=new Date(log[i].date);
    if(isFinite(dt))m[dtStamp(dt)]=1;
  }
  _stkWorkoutDays=m;
  return m;
}
function dtStamp(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function didSomething(d){return dayHadActivity(d)||workoutDays()[d]===1;}

/* Today not being done yet must not read as a broken streak - at nine in the
   morning you have not missed anything. So the count starts at yesterday
   unless today already has something, and today only ever adds. */
function streakNow(){
  _stkWorkoutDays=null;                       // recount, a workout may have just landed
  var today=todayStr(),n=0,d=new Date(),i;
  var todayDone=didSomething(today);
  if(!todayDone)d.setDate(d.getDate()-1);     // yesterday is the last day that could have been missed
  for(i=0;i<400;i++){
    if(!didSomething(dtStamp(d)))break;
    n++;
    d.setDate(d.getDate()-1);
  }
  return {n:n,today:todayDone};
}
/* The longest one ever, which is the number worth keeping when the current
   run breaks - it says the thing you are capable of, not the thing you are
   in the middle of. */
function streakBest(){
  var d=new Date(),cur=0,best=0,i;
  for(i=0;i<400;i++){
    if(didSomething(dtStamp(d))){cur++;if(cur>best)best=cur;}
    else cur=0;
    d.setDate(d.getDate()-1);
  }
  return best;
}
function streakHTML(){
  var s=streakNow();
  if(!s.n)return '';
  var best=streakBest();
  var word=s.n===1?'יום':'ימים';
  return '<button class="stk'+(s.today?' on':'')+'" onclick="streakOpen()">'+
    '<span class="stk-f">'+(s.today?'&#128293;':'&#9898;')+'</span>'+
    '<span class="stk-n">'+s.n+'</span>'+
    '<span class="stk-w">'+word+' ברצף'+(!s.today?' &middot; היום עוד פתוח':'')+'</span>'+
    (best>s.n?'<span class="stk-b">שיא '+best+'</span>':'')+
    '</button>';
}
/* The last two weeks as dots, and what counts. Tapping the streak should
   explain it rather than just being a number that appeared. */
function streakOpen(){
  var old=document.getElementById('stk-ov');if(old)old.remove();
  var s=streakNow(),best=streakBest();
  var days='',d=new Date(),i,names=['א','ב','ג','ד','ה','ו','ש'];
  var cells=[];
  for(i=0;i<14;i++){
    var st=dtStamp(d),on=didSomething(st);
    cells.unshift('<span class="stk-d'+(on?' on':'')+(i===0?' now':'')+'">'+
      '<b>'+names[d.getDay()]+'</b><i>'+d.getDate()+'</i></span>');
    d.setDate(d.getDate()-1);
  }
  days=cells.join('');
  var h='<div class="stk-ov" id="stk-ov" onclick="if(event.target===this)streakClose()">'+
    '<div class="stk-sheet">'+
    '<div class="stk-hd"><span>'+s.n+' '+(s.n===1?'יום':'ימים')+' ברצף</span>'+
    '<button class="stk-x" onclick="streakClose()">&times;</button></div>'+
    '<div class="stk-row">'+days+'</div>'+
    '<div class="stk-note">יום נספר כשרשמת בו משהו — ארוחה, אימון, שורה ביומן, מים, צעדים, ולוג או סיכום יום. '+
    'לא מספיק לפתוח את האפליקציה.</div>'+
    (best>s.n?'<div class="stk-best">הרצף הארוך ביותר שלך: '+best+' ימים.</div>':'')+
    (!s.today?'<div class="stk-today">היום עוד לא נספר. כל דבר שתרשום היום ימשיך את הרצף.</div>':'')+
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}

  var el=document.getElementById('home-greet');

function renderHomeToday(){
  renderGreeting();

  if(!el)return;
  var date=todayStr(),d=new Date();
  var mins=d.getHours()*60+d.getMinutes();
  var from=DP_FROM*60,to=(DP_TO+1)*60;
  var pct=Math.max(0,Math.min(100,(mins-from)/(to-from)*100));

  var all=dpAll(date),timed=[],i;
  for(i=0;i<all.length;i++)if(all[i].hour!==null)timed.push(all[i]);
  timed.sort(function(a,b){return (a.hour*60+(a.min||0))-(b.hour*60+(b.min||0));});
  var notes=todayNotes(date);

  var h='<button class="td-card" onclick="enterModule(&quot;planning&quot;)">';
  h+='<div class="td-top">';
  h+='<div class="td-word">היום</div>';
  h+='<div class="td-when">'+WK_DAYS[d.getDay()]+', '+d.getDate()+' ב'+MO_NAMES[d.getMonth()]+
     ' <span class="td-clock">'+nowTodayHM()+'</span></div>';
  h+='</div>';
  h+='<div class="td-bar"><div class="td-fill" style="width:'+pct.toFixed(1)+'%"></div>'+
     '<div class="td-dot" style="right:'+pct.toFixed(1)+'%"></div></div>';

  h+='<div class="td-cols">';
  // right: the schedule
  h+='<div class="td-col td-sched"><div class="td-lbl">הלו&quot;ז</div>';
  if(!timed.length)h+='<div class="td-none">אין עדיין שעות ליום הזה</div>';
  for(i=0;i<timed.length;i++){
    var t=timed[i],c=wkColor(t.c);
    var start=t.hour*60+(t.min||0);
    var over=(t.end?t.end:start+1)<=mins;
    var now=!over&&start<=mins;
    h+='<div class="td-row'+(over?' past':'')+(now?' now':'')+'">'+
       '<span class="td-dotc" style="background:'+c.dot+'"></span>'+
       '<span class="td-time">'+dpHM(t.hour,t.min||0)+'</span>'+
       '<span class="td-name">'+esc(t.w)+'</span></div>';
  }
  h+='</div>';
  // left: what you said not to forget
  h+='<div class="td-col td-notes"><div class="td-lbl">לזכור</div>';
  if(!notes.length)h+='<div class="td-none">שום דבר שרשמת לזכור</div>';
  for(i=0;i<notes.length;i++){

       esc(notes[i].n.replace(/\s+/g,' ').slice(0,90))+(notes[i].n.length>90?'…':'')+'</div>';
  }

  h+='</div></button>';
  el.innerHTML=h;
}

     hidden, and showed the app, which was already showing - so the button

     to miss because Better used to light up when pressed; now that the bar

<script>
'use strict';

/* =====================================================================
   1. QUESTIONS
   ===================================================================== */
const QUESTIONS = [
  // עצמי
