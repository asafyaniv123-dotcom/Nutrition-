  // Exercise selector
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:8px">בחר תרגיל</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(var ei=0;ei<exList.length;ei++){
    var isSel=_fitProgressEx===exList[ei];
    h+='<button onclick="_fitProgressEx=\''+exList[ei].replace(/'/g,'')+'\';renderFitProgress()" style="border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;background:'+(isSel?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb')+';color:'+(isSel?'#fff':'#6a6360')+'">'+esc(exList[ei])+'</button>';
  }
  h+='</div></div>';

  // Build data points for selected exercise
  if(_fitProgressEx){
    var pts=[];
    for(var li=0;li<log.length;li++){
      var entry=log[li];
      for(var exi=0;exi<entry.exercises.length;exi++){
        if(entry.exercises[exi].name===_fitProgressEx){
          var best1RM=entry.exercises[exi].sets.reduce(function(mx,s){return Math.max(mx,s.weight||0);},0);
          var totalV=entry.exercises[exi].sets.reduce(function(a,s){return a+(s.weight||0)*(s.reps||0);},0);
          if(best1RM>0||totalV>0)pts.push({date:entry.date,weight:best1RM,vol:totalV});
        }
      }
    }

    if(pts.length<2){
      h+='<div style="background:#fff;border-radius:18px;padding:24px;text-align:center;color:#c0b8b0;font-size:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">צריך לפחות 2 אימונים לגרף</div>';
    } else {
      // SVG chart
      var W=320,H=140,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var wVals=pts.map(function(p){return p.weight;});
      var minW=Math.max(0,Math.min.apply(null,wVals)-5);
      var maxW=Math.max.apply(null,wVals)+5;
      function xp2(i){return PL+i*(cW/(pts.length-1));}
      function yp2(v){return PT+cH*(1-(v-minW)/(maxW-minW));}

      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      // Grid
      for(var gi=0;gi<=3;gi++){
        var gv=minW+(maxW-minW)*gi/3;
        var gy=yp2(gv);
        svg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/>';
        svg+='<text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';
      }
      // Area
      var aPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi2=1;pi2<pts.length;pi2++)aPath+=' L'+xp2(pi2)+','+yp2(pts[pi2].weight);
      aPath+=' L'+xp2(pts.length-1)+','+(PT+cH)+' L'+xp2(0)+','+(PT+cH)+' Z';
      svg+='<path d="'+aPath+'" fill="#a690cf" opacity="0.12"/>';
      // Line
      var lPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi3=1;pi3<pts.length;pi3++)lPath+=' L'+xp2(pi3)+','+yp2(pts[pi3].weight);
      svg+='<path d="'+lPath+'" fill="none" stroke="#a690cf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      // Dots + dates
      for(var pi4=0;pi4<pts.length;pi4++){
        var dd=new Date(pts[pi4].date);
        svg+='<circle cx="'+xp2(pi4)+'" cy="'+yp2(pts[pi4].weight)+'" r="4" fill="#a690cf" stroke="#fff" stroke-width="2"/>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+dd.getDate()+'/'+(dd.getMonth()+1)+'</text>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(yp2(pts[pi4].weight)-7)+'" text-anchor="middle" font-size="8" fill="#a690cf" font-weight="700">'+pts[pi4].weight+'</text>';
      }
      svg+='</svg>';

      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1);margin-bottom:12px">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">'+esc(_fitProgressEx)+' &mdash; עליית משקל (kg)</div>';
      h+=svg;

      // Delta
      var delta=pts[pts.length-1].weight-pts[0].weight;
      var pct2=pts[0].weight>0?Math.round(delta/pts[0].weight*100):0;
      h+='<div style="display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid #f5f0eb">';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#a690cf">'+pts[0].weight+'kg</div><div style="font-size:9px;color:#a89e97">התחלה</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:'+(delta>=0?'#8fc79e':'#e08a72')+'">'+(delta>=0?'+':'')+delta+'kg</div><div style="font-size:9px;color:#a89e97">שיפור ('+pct2+'%)</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#e08a72">'+pts[pts.length-1].weight+'kg</div><div style="font-size:9px;color:#a89e97">עכשיו</div></div>';
      h+='</div></div>';

      // Volume chart
      var vVals=pts.map(function(p){return p.vol;});
      var maxV=Math.max.apply(null,vVals);
      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">נפח לפי אימון</div>';
      h+='<div style="display:flex;align-items:flex-end;gap:5px;height:60px">';
      for(var vi=0;vi<pts.length;vi++){
        var bh=maxV>0?Math.round(pts[vi].vol/maxV*52):4;
        var dd2=new Date(pts[vi].date);
        h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
        h+='<div style="font-size:8px;color:#a89e97">'+pts[vi].vol+'</div>';
        h+='<div style="width:100%;height:'+bh+'px;background:linear-gradient(180deg,#bfe0c7,#8fc79e);border-radius:4px 4px 0 0"></div>';
        h+='<div style="font-size:7px;color:#c0b8b0">'+dd2.getDate()+'/'+(dd2.getMonth()+1)+'</div>';
        h+='</div>';
      }
      h+='</div></div>';
    }
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

/* ── HABIT TRACKER ── */
function loadHabits(){try{var x=localStorage.getItem('habits_list');return x?JSON.parse(x):['שתיית מים','אימון','קריאה'];}catch(e){return[];}}
function saveHabits(arr){try{localStorage.setItem('habits_list',JSON.stringify(arr));}catch(e){}}
function loadHabitLog(){try{var x=localStorage.getItem('habits_log');return x?JSON.parse(x):{};}catch(e){return{};}}
function saveHabitLog(obj){try{localStorage.setItem('habits_log',JSON.stringify(obj));}catch(e){}}

function toggleHabitAnim(habitIdx,day,cellId){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  var nowDone=!log[key];
  log[key]=nowDone;
  saveHabitLog(log);

  // Instant visual update — animate before full re-render
  var cell=document.getElementById(cellId);
  if(cell){
    if(nowDone){
      cell.style.background='rgba(143,199,158,.12)';
      cell.style.borderColor='#6db88a';
      cell.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" style="overflow:visible">'+
        '<line x1="3" y1="3" x2="13" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round" class="hx-draw" style="stroke-dasharray:20;stroke-dashoffset:20;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) forwards"/>'+
        '<line x1="13" y1="3" x2="3" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:20;stroke-dashoffset:20;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) .12s forwards"/>'+
        '</svg>';
    } else {
      cell.style.background='transparent';
      cell.style.borderColor='#ccc7c0';
      cell.innerHTML='';
    }
  }
  // Full re-render after animation completes
  setTimeout(function(){renderHabits();},380);
}

function toggleHabit(habitIdx,day){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  log[key]=!log[key];
  saveHabitLog(log);
  renderHabits();
}

function addHabit(){
  var inp=document.getElementById('new-habit-inp');
  if(!inp)return;
  var name=inp.value.trim();
  if(!name)return;
  var habits=loadHabits();
  if(habits.indexOf(name)!==-1){showToast('כבר קיים');return;}
  habits.push(name);
  saveHabits(habits);
  inp.value='';
  renderHabits();
}

function deleteHabit(idx){
  var habits=loadHabits();
  habits.splice(idx,1);
  saveHabits(habits);
  renderHabits();
}

function renderHabits(){
  var habits=loadHabits();
  var log=loadHabitLog();
  var now=new Date();
  var y=now.getFullYear(),mo=now.getMonth();
  var daysInMonth=new Date(y,mo+1,0).getDate();
  var todayD=now.getDate();
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  var dayNames=['אחד','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var h='';

  // ── HEADER ──
  h+='<div style="background:linear-gradient(135deg,#eaf5ee,#f0eafa);border-radius:22px;padding:16px 14px;margin-bottom:12px">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:2px">HABIT TRACKER</div>';
  h+='<div style="font-size:18px;font-weight:800;color:#4a4340">'+mn[mo]+' '+y+'</div>';
  h+='<div style="font-size:11px;color:#8fc79e;margin-top:2px;font-style:italic">progress, not perfection</div>';
  h+='</div>';

  // ── ADD HABIT ──
  h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
  h+='<input id="new-habit-inp" class="mtin" style="flex:1;margin-bottom:0" placeholder="הוסף הרגל חדש..." onkeydown="if(event.key===\'Enter\')addHabit()">';
  h+='<button onclick="addHabit()" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:0 16px;font-size:18px;cursor:pointer;color:#fff;flex-shrink:0">+</button>';
  h+='</div>';

  // ── OVERALL STAT ──
  var totalDone=0,totalPossible=todayD*habits.length;
  for(var hh=0;hh<habits.length;hh++)for(var dd2=1;dd2<=todayD;dd2++)if(log[habits[hh]+'__'+dd2])totalDone++;
  var overallPct=totalPossible>0?Math.round(totalDone/totalPossible*100):0;
  h+='<div style="background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px">';
  h+='<div style="font-size:28px;font-weight:800;color:#a690cf">'+overallPct+'%</div>';
  h+='<div style="flex:1"><div style="font-size:12px;font-weight:700;color:#4a4340">עקביות כללית</div>';
  h+='<div style="font-size:10px;color:#a89e97;margin-bottom:5px">'+totalDone+' / '+totalPossible+' ימים בוצעו</div>';
  h+='<div style="height:5px;background:rgba(255,255,255,.6);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+overallPct+'%;background:linear-gradient(90deg,#c9bce0,#8fc79e);border-radius:3px;transition:width .6s"></div></div></div>';
  h+='</div>';

  // ── THIS MONTH I WILL + NOTES ──
  var goals=loadHabitGoals();
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
  h+='<div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(200,180,160,.08)">';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px;letter-spacing:.05em">THIS MONTH I WILL</div>';
  for(var gi=0;gi<goals.length;gi++){
    h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
    h+='<div onclick="toggleGoal('+gi+')" style="width:13px;height:13px;border-radius:3px;border:1.5px solid '+(goals[gi].done?'#8fc79e':'#c9bce0')+';background:'+(goals[gi].done?'#8fc79e':'transparent')+';cursor:pointer;flex-shrink:0"></div>';
    h+='<div style="font-size:11px;color:'+(goals[gi].done?'#a89e97':'#4a4340')+';'+(goals[gi].done?'text-decoration:line-through;':'')+';flex:1;line-height:1.3">'+esc(goals[gi].text)+'</div>';
    h+='<button onclick="deleteGoal('+gi+')" style="background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:12px;padding:0;flex-shrink:0">&times;</button>';
    h+='</div>';
  }
  h+='<input id="new-goal-inp" placeholder="הוסף..." style="width:100%;border:none;border-bottom:1px solid #f2ede6;font-size:11px;padding:4px 0;outline:none;margin-top:2px;background:transparent;direction:rtl" onkeydown="if(event.key===\'Enter\')addGoal()">';
  h+='</div>';
  h+='<div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(200,180,160,.08)">';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px;letter-spacing:.05em">NOTES</div>';
  h+='<textarea id="habit-notes" onchange="saveHabitNotes(this.value)" style="width:100%;border:none;font-size:11px;resize:none;outline:none;color:#4a4340;line-height:1.8;background:transparent;height:80px;direction:rtl" placeholder="...">'+esc(loadHabitNotes())+'</textarea>';
  h+='</div></div>';

  if(habits.length===0){
    h+='<div style="text-align:center;padding:32px 20px;color:#a89e97;font-size:13px">הוסף את ההרגל הראשון שלך &#x2B06;</div>';
    document.getElementById('content').innerHTML=h;
    return;
  }

  // ── TABLE: rows=days, cols=habits ──
  h+='<div style="background:#fff;border-radius:20px;padding:12px 8px 8px;box-shadow:0 4px 16px rgba(200,180,160,.1);margin-bottom:14px">';
  h+='<table style="border-collapse:collapse;width:100%">';

  // Habit name headers
  h+='<thead><tr>';
  h+='<th style="font-size:10px;color:#a89e97;font-weight:700;text-align:right;padding:0 8px 12px;width:48px">יום</th>';
  for(var hi=0;hi<habits.length;hi++){
    h+='<th style="text-align:center;padding:0 4px 12px;border-right:'+(hi<habits.length-1?'1.5px solid #f0ebe3':'none')+'">';
    h+='<div style="display:inline-flex;flex-direction:column;align-items:center;gap:4px">';
    h+='<div style="background:linear-gradient(135deg,#f0eafa,#eaf5ee);border:1.5px solid #c9bce0;border-radius:12px;padding:6px 10px;min-width:56px;max-width:72px;position:relative">';
    h+='<div style="font-size:12px;font-weight:700;color:#4a4340;text-align:center;white-space:normal;word-break:break-word;line-height:1.3">'+esc(habits[hi])+'</div>';
    h+='<button onclick="deleteHabit('+hi+')" style="position:absolute;top:-7px;left:-7px;background:#fff;border:1px solid #f3b9a8;border-radius:50%;width:16px;height:16px;cursor:pointer;color:#e08a72;font-size:10px;line-height:14px;padding:0;display:flex;align-items:center;justify-content:center">&#x2715;</button>';
    h+='</div>';
    h+='</div></th>';
  }
  h+='</tr></thead><tbody>';

  // Day rows
  for(var d=1;d<=daysInMonth;d++){
    var date=new Date(y,mo,d);
    var isToday=d===todayD;
    var isFuture=d>todayD;
    var rowBg=isToday?'background:rgba(166,144,207,.08);':'';
    h+='<tr style="'+rowBg+'">';
    var dayLbl=dayNames[date.getDay()].slice(0,1);
    h+='<td style="padding:3px 6px;text-align:right;white-space:nowrap;line-height:1">';
    h+='<span style="font-size:'+(isToday?'12':'10')+'px;font-weight:'+(isToday?'800':'400')+';color:'+(isToday?'#a690cf':(isFuture?'#c0b8b0':'#6a6360'))+'">'+d+' <span style="font-size:8px;color:#c0b8b0">'+dayLbl+'</span></span>';
    h+='</td>';
    for(var hi2=0;hi2<habits.length;hi2++){
      var done=!!log[habits[hi2]+'__'+d];
      var borderCol=done?'#6db88a':(isToday?'#a690cf':(isFuture?'#e8e4de':'#ccc7c0'));
      var bgCol=done?'rgba(143,199,158,.12)':'transparent';
      h+='<td style="text-align:center;padding:3px 4px;border-right:'+(hi2<habits.length-1?'1.5px solid #f0ebe3':'none')+'">';
      if(!isFuture){
        var cellId='hc-'+hi2+'-'+d;
        h+='<div id="'+cellId+'" onclick="toggleHabitAnim(\''+hi2+'\','+d+',\''+cellId+'\')" style="width:28px;height:28px;border-radius:5px;background:'+bgCol+';border:2px solid '+borderCol+';margin:0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s">';
        if(done){
          // Static X — no animation class, animation only happens on toggle
          h+='<svg width="16" height="16" viewBox="0 0 16 16" style="overflow:visible">';
          h+='<line x1="3" y1="3" x2="13" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round"/>';
          h+='<line x1="13" y1="3" x2="3" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round"/>';
          h+='</svg>';
        }
        h+='</div>';
      } else {
        h+='<div style="width:28px;height:28px;border-radius:5px;background:#f5f2ee;border:2px solid #e8e4de;margin:0 auto;opacity:.2"></div>';
      }
      h+='</td>';
    }
    h+='</tr>';
  }

  // % footer row
  h+='<tr style="border-top:1.5px solid #f0ebe3">';
  h+='<td style="padding:8px 6px;font-size:10px;color:#a89e97;font-weight:700;text-align:right">%</td>';
  for(var hi3=0;hi3<habits.length;hi3++){
    var done2=0;
    for(var ddd=1;ddd<=todayD;ddd++)if(log[habits[hi3]+'__'+ddd])done2++;
    var pct=todayD>0?Math.round(done2/todayD*100):0;
    h+='<td style="text-align:center;padding:8px 4px;border-right:'+(hi3<habits.length-1?'1.5px solid #f0ebe3':'none')+'"><div style="font-size:13px;font-weight:800;color:'+(pct>=70?'#8fc79e':pct>=40?'#e8c162':'#e08a72')+'">'+pct+'</div></td>';
  }
  h+='</tr>';
  h+='</tbody></table></div>';

  document.getElementById('content').innerHTML=h;
}

function loadHabitGoals(){try{var x=localStorage.getItem('habit_goals');return x?JSON.parse(x):[{text:'להיות עקבי',done:false},{text:'לבטוח בתהליך',done:false}];}catch(e){return[];}}
function saveHabitGoals(arr){try{localStorage.setItem('habit_goals',JSON.stringify(arr));}catch(e){}}
function loadHabitNotes(){try{return localStorage.getItem('habit_notes')||'';}catch(e){return '';}}
function saveHabitNotes(v){try{localStorage.setItem('habit_notes',v);}catch(e){}}

function addGoal(){
  var inp=document.getElementById('new-goal-inp');if(!inp)return;
  var t=inp.value.trim();if(!t)return;
  var goals=loadHabitGoals();goals.push({text:t,done:false});saveHabitGoals(goals);renderHabits();
}
function toggleGoal(idx){
  var goals=loadHabitGoals();if(goals[idx])goals[idx].done=!goals[idx].done;saveHabitGoals(goals);renderHabits();
}
function deleteGoal(idx){
  var goals=loadHabitGoals();goals.splice(idx,1);saveHabitGoals(goals);renderHabits();
}

function saveSumRem(o){try{localStorage.setItem(SUMREM_KEY,JSON.stringify(o));}catch(e){}}

// granted | denied | default | unsupported
function sumRemPerm(){if(!('Notification' in window))return 'unsupported';return Notification.permission;}

/* ── WEB PUSH ── */
// The only way a reminder arrives with the app fully closed: a server holds the
// subscription and pushes at the chosen time. Everything above still works
// without this - if PUSH_SERVER is empty the app just degrades to open-app only.
// Empty in the dev copy: a second subscription from the same phone would mean
// two notifications every evening, and dev is not the app being lived in.
// The push subscription is deliberately off in dev - one notification a night,
// not two. Steps sync has no such problem, so it addresses the server directly
// and works in both copies. They hold separate tokens, so a dev experiment
// never writes into the real app's steps.
var SYNC_SERVER='https://nutrition-push.nutrition-push.workers.dev';
var PUSH_SERVER=window.__DEV__?'':SYNC_SERVER;
var VAPID_PUBLIC='BGZWOIHQcO_gj3wDvRa78k3g7A60BDJnhckbC9W15vfgsrQeQYMXu7X6FT0RPqGZhOGjzQgtQyJ_jDktq4GuU-o';

var _pushState='idle';  // idle | ok | error

function pushSupported(){
  return !!(PUSH_SERVER && _swReg && _swReg.pushManager && 'PushManager' in window);
}

function urlB64ToUint8(s){
  var pad=new Array((4-s.length%4)%4+1).join('=');
  var raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}

function localTZ(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){return 'UTC';}
}

// The service worker cannot read localStorage, so leave it what a resubscribe needs.
function pushStashConfig(o){
  if(!('caches' in window))return;
  try{
    caches.open('sumrem-config').then(function(c){
      c.put('config',new Response(JSON.stringify({server:PUSH_SERVER,time:o.time,tz:localTZ()}),
        {headers:{'Content-Type':'application/json'}}));
    });
  }catch(e){}
}

function sumRemPushSync(){
  var o=loadSumRem();
  if(!pushSupported())return;
  if(!o.on){sumRemPushDrop();return;}
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  pushStashConfig(o);
  _swReg.pushManager.getSubscription().then(function(sub){
    if(sub)return sub;
    return _swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
  }).then(function(sub){
    return fetch(PUSH_SERVER+'/subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription:sub.toJSON(),time:o.time,tz:localTZ()})
    });
  }).then(function(r){
    _pushState=r&&r.ok?'ok':'error';renderSumRem();
  }).catch(function(){_pushState='error';renderSumRem();});
}

function sumRemPushDrop(){
  if(!pushSupported())return;
  _swReg.pushManager.getSubscription().then(function(sub){
    if(!sub){_pushState='idle';return null;}
    var ep=sub.endpoint;
    return sub.unsubscribe().then(function(){
      return fetch(PUSH_SERVER+'/unsubscribe',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({endpoint:ep})
      });
    });
  }).then(function(){_pushState='idle';renderSumRem();}).catch(function(){});
}

function sumRemAsk(){
  if(!('Notification' in window)){showToast('הדפדפן לא תומך בהתראות מערכת');return;}
  try{
    var r=Notification.requestPermission(function(){renderSumRem();});
    if(r&&r.then)r.then(function(p){renderSumRem();if(p==='granted')sumRemPushSync();showToast(p==='granted'?'✓ התראות מאושרות':'ההרשאה לא ניתנה');});
  }catch(e){}
}

var BJ_TYPES=[
  {id:'task',    sym:'&#9633;', label:'משימה',    sym_plain:'□'},
  {id:'event',   sym:'&#9675;', label:'אירוע',    sym_plain:'○'},
  {id:'appt',    sym:'&#9651;', label:'פגישה',    sym_plain:'△'},
  {id:'note',    sym:'&middot;',label:'הערה',     sym_plain:'·'},
  {id:'due',     sym:'&#8987;', label:'תאריך יעד', sym_plain:'⌛'},

  {id:'idea',    sym:'?',       label:'רעיון',    sym_plain:'?'},
  {id:'buy',     sym:'$',       label:'קנייה/תשלום', sym_plain:'$'},

];

// Status cycle on tap: open → done → migrated → cancelled → started → open
var BJ_STATUSES=['open','done','migrated','cancelled','started'];

function bjSymbol(type,status){
  var t=BJ_TYPES.find(function(x){return x.id===type;})||BJ_TYPES[0];
  if(status==='done'){
    // Filled version
    if(type==='task')return '&#9632;'; // ■
    if(type==='event')return '&#9679;'; // ●
    if(type==='appt')return '&#9650;'; // ▲
    return '<span style="text-decoration:line-through">'+t.sym+'</span>';
  }
  if(status==='migrated') return t.sym+'<span style="font-size:9px">&rarr;</span>';
  if(status==='cancelled') return '<span style="text-decoration:line-through;color:#c0b8b0">'+t.sym+'</span>';
  if(status==='started') return t.sym+'<span style="font-size:9px">/</span>';
  return t.sym; // open
}

function bjTextStyle(status){
  if(status==='done')return 'color:#a89e97;text-decoration:line-through;';
  if(status==='cancelled')return 'color:#c0b8b0;text-decoration:line-through;';
  if(status==='migrated')return 'color:#a89e97;font-style:italic;';
  return 'color:#4a4340;';
}

var _newRemType='task';
var _arcPressTimer=null;
var _arcOpen=false;

function startArcPress(e){
  if(e&&e.preventDefault)e.preventDefault();
  _arcPressTimer=setTimeout(function(){openArc();},500);
}
function cancelArcPress(){
  clearTimeout(_arcPressTimer);
}
function openArc(){
  _arcOpen=true;
  var arc=document.getElementById('rem-arc');
  if(arc){arc.style.display='block';}
  // Close on tap outside
  setTimeout(function(){
    document.addEventListener('touchstart',closeArcOutside,{once:true});
    document.addEventListener('mousedown',closeArcOutside,{once:true});
  },50);
}
function closeArcOutside(e){
  var arc=document.getElementById('rem-arc');
  if(arc&&!arc.contains(e.target)){closeArc();}
}
function closeArc(){
  _arcOpen=false;
  var arc=document.getElementById('rem-arc');
  if(arc)arc.style.display='none';
}
function selectArcType(typeId){
  _newRemType=typeId;
  closeArc();
  renderReminders();
}

var _remLongPressIdx=-1;
function startRemLongPress(idx){
  _remLongPressIdx=idx;
  _longPressTimer=setTimeout(function(){openRemTypePicker(idx);},600);
}
function cancelRemLongPress(){clearTimeout(_longPressTimer);}
function openRemTypePicker(idx){
  _remLongPressIdx=idx;
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='flex';
}
function closeRemTypePicker(){
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='none';
}
function pickRemType(typeId){
  var data=loadReminders();
  if(data[_remTab]&&data[_remTab][_remLongPressIdx]){
    data[_remTab][_remLongPressIdx].type=typeId;
    saveReminders(data);
  }
  closeRemTypePicker();
  renderReminders();
}
function cycleRemStatus(idx){
  var data=loadReminders();
  if(!data[_remTab]||!data[_remTab][idx])return;
  var cur=data[_remTab][idx].status||'open';
  var next=BJ_STATUSES[(BJ_STATUSES.indexOf(cur)+1)%BJ_STATUSES.length];
  data[_remTab][idx].status=next;
  saveReminders(data);renderReminders();
}
function toggleRemLegend(){_legendOpen=!_legendOpen;renderReminders();}

function setRemTab(tab){_remTab=tab;renderReminders();}

function addReminder(){
  var inp=document.getElementById('rem-inp');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  var data=loadReminders();
  if(!data[_remTab])data[_remTab]=[];
  data[_remTab].push({text:txt,type:_newRemType||'task',status:'open'});
  saveReminders(data);inp.value='';renderReminders();
}

function deleteReminder(idx){
  var data=loadReminders();
  if(data[_remTab])data[_remTab].splice(idx,1);
  saveReminders(data);renderReminders();
}

function clearDoneReminders(){
  var data=loadReminders();
  if(data[_remTab])data[_remTab]=data[_remTab].filter(function(i){return i.status!=='done';});
  saveReminders(data);renderReminders();
}

function renderRecipeList(){
  var recipes=loadRecipes();

  if(recipes.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';

    h+='<div style="font-size:15px;font-weight:700;color:#4a4340;margin-bottom:6px">ספר המתכונים ריק</div>';

    document.getElementById('content').innerHTML=h+'</div>';
    return;
  }

  // Build alphabet index
  var byLetter={};
  for(var ri=0;ri<recipes.length;ri++){
    var r=recipes[ri];
    var first=r.name?r.name.charAt(0).toUpperCase():'#';
    if(!byLetter[first])byLetter[first]=[];
    byLetter[first].push({r:r,idx:ri});
  }
  var letters=Object.keys(byLetter).sort(function(a,b){return a.localeCompare(b,'he');});

  // Alphabet tab strip
  h+='<div style="overflow-x:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch">';
  h+='<div style="display:flex;gap:5px;width:max-content;padding:2px">';

  }
  h+='</div></div>';

  // Recipe list by letter
  var showLetters=_recipeLetter?[_recipeLetter]:letters;
  for(var sli=0;sli<showLetters.length;sli++){
    var sl=showLetters[sli];
    if(!byLetter[sl])continue;
    h+='<div style="margin-bottom:6px"><div style="font-size:11px;font-weight:800;color:#e08a72;letter-spacing:.1em;padding:4px 0;border-bottom:2px solid #f3b9a8;margin-bottom:8px">'+sl+'</div>';

var _editRecipePhoto='';
function handleRecipePhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=600,maxH=400;
      var scale=Math.min(maxW/img.width,maxH/img.height,1);
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      _editRecipePhoto=canvas.toDataURL('image/jpeg',0.8);
      var prev=document.getElementById('rec-photo-prev');
      if(prev){prev.outerHTML='<img src="'+_editRecipePhoto+'" id="rec-photo-prev" style="width:100%;max-height:180px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:block">';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function saveRecipe(){
  var name=document.getElementById('rec-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם מתכון');return;}
  var recipes=loadRecipes();
  var rec={
    name:(name.value.trim()),
    time:(document.getElementById('rec-time')||{}).value||'',
    servings:(document.getElementById('rec-servings')||{}).value||'',
    difficulty:(document.getElementById('rec-difficulty')||{}).value||'',
    tags:(document.getElementById('rec-tags')||{}).value||'',
    ingredients:(document.getElementById('rec-ingredients')||{}).value||'',
    instructions:(document.getElementById('rec-instructions')||{}).value||'',
    notes:(document.getElementById('rec-notes')||{}).value||'',
    photo:_editRecipePhoto||''
  };
  if(_recipeIdx>=0)recipes[_recipeIdx]=rec;
  else{recipes.push(rec);_recipeIdx=recipes.length-1;}
  saveRecipes(recipes);
  _recipeView='view';render();
  showToast('✓ '+rec.name+' נשמר!');
}

function deleteRecipe(){
  var recipes=loadRecipes();recipes.splice(_recipeIdx,1);saveRecipes(recipes);
  _recipeIdx=-1;_recipeView='list';render();
}

function loadPlanHistory(){try{var x=localStorage.getItem('plan_history');return x?JSON.parse(x):[];}catch(e){return[];}}
function savePlanHistory(arr){try{localStorage.setItem('plan_history',JSON.stringify(arr));}catch(e){}}

function renderPlanning(){
  document.getElementById('hdr-title').textContent='תכנון זמן';
  if(_planStep===99)return renderPlanSchedule();
  if(_planStep===-1)return renderPlanHistory();
  renderPlanStep();
}

function drawPlanSpiral(){
  var canvas=document.getElementById('plan-spiral');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var d=_planData;
  var W=160,H=166,CX=80,CY=83,R_IN=28,R_OUT=68;

  // Build a 24-slot color array from timeline blocks
  var PLAN_CLR={anchor:'#4f6ef7',focus:'#c9b8f0',quick:'#8fc79e',errand:'#8fc79e',personal:'#f3b9a8',buffer:'#ede8e0',free:'#e8e3db'};
  var toMin=function(t){if(!t)return 0;var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);};

  // Fill slots: for each hour 0-23, decide color from blocks
  var blocks=planBuildTimeline();
  var slotColor=new Array(25).fill('none');

  // Map blocks back to hours
  blocks.forEach(function(bl){
    if(!bl.time)return;
    var startM=toMin(bl.time);
    var dur=bl.duration||60;
    if(bl.type==='anchor'){
      dur=toMin(bl.endTime)-startM;
    } else if(bl.type==='free'){dur=60;}
    else if(bl.type==='buffer'){dur=10;}
    var clr=bl.type==='anchor'?'anchor':bl.taskType||bl.type;
    var endM=startM+dur;
    for(var m=startM;m<endM;m+=60){
      var slot=Math.floor(m/60);
      if(slot>=0&&slot<25)slotColor[slot]=clr;
    }
  });

  // Draw background spiral
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=9;ctx.lineCap='round';ctx.stroke();

  // Colored arcs
  var i=0;
  while(i<25){
    if(slotColor[i]==='none'){i++;continue;}
    var col=slotColor[i],st=i;
    while(i<25&&slotColor[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    var fillColor=PLAN_CLR[col]||'#c0b8b0';
    ctx.strokeStyle=fillColor;ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor=fillColor;ctx.shadowBlur=4;ctx.stroke();ctx.shadowBlur=0;
  }

  // Hour dots 0,6,12,18,24
  [0,6,12,18,24].forEach(function(h){
    var ang=(-90+h*(720/24))*Math.PI/180;
    var r=R_IN+(h/24)*(R_OUT-R_IN)+11;
    ctx.fillStyle='rgba(140,133,125,.45)';ctx.font='600 7px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+r*Math.cos(ang),CY+r*Math.sin(ang));
  });
}

function planFreeHours(){
  var start=_planData.dayStart||'07:00';var end=_planData.dayEnd||'23:00';
  var s=parseInt(start.split(':')[0])*60+parseInt(start.split(':')[1]);
  var e=parseInt(end.split(':')[0])*60+parseInt(end.split(':')[1]);
  var total=(e-s)/60;
  var anchored=(_planData.anchors||[]).reduce(function(a,anc){
    var af=parseInt(anc.from.split(':')[0])*60+parseInt(anc.from.split(':')[1]);
    var at=parseInt(anc.to.split(':')[0])*60+parseInt(anc.to.split(':')[1]);
    return a+Math.max(0,(at-af)/60);
  },0);
  return Math.max(0,(total-anchored)*0.8); // 20% buffer
}

function planAddAnchor(){
  var lbl=document.getElementById('anc-label');
  var from=document.getElementById('anc-from');
  var to=document.getElementById('anc-to');
  if(!lbl||!lbl.value.trim()){showToast('נא הזן שם לעוגן');return;}
  if(!_planData.anchors)_planData.anchors=[];
  _planData.anchors.push({
    label:lbl.value.trim(),
    from:(from&&from.value)||'09:00',
    to:(to&&to.value)||'17:00'
  });
  showToast('עוגן נוסף &#10003;');
  renderPlanning();
}

function planAddTask(){
  var name=document.getElementById('task-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם למשימה');return;}
  var dur=document.getElementById('task-dur');
  var prio=document.getElementById('task-prio');
  var type=document.getElementById('task-type-val');
  if(!_planData.tasks)_planData.tasks=[];
  _planData.tasks.push({
    name:name.value.trim(),
    duration:parseInt((dur&&dur.value)||'30')||30,
    prio:(prio&&prio.value)||'should',
    type:(type&&type.value)||'focus',
    id:Date.now()
  });
  showToast('משימה נוספה &#10003;');
  renderPlanning();
}

function planSetTaskType(id){
  var inp=document.getElementById('task-type-val');if(inp)inp.value=id;
  planHighlightTaskType(id);
}

function planHighlightTaskType(id){
  TASK_TYPES.forEach(function(t){
    var btn=document.getElementById('ttype-'+t.id);
    if(!btn)return;
    btn.style.background=t.id===id?'#e8f0ff':'#fff';
    btn.style.borderColor=t.id===id?'#4f6ef7':'#e0ebe3';
    btn.style.color=t.id===id?'#4f6ef7':'#4a4340';
  });
}

function planToggleFeeling(f){
  var arr=(_planData.feeling||'')?_planData.feeling.split(',').filter(Boolean):[];
  var idx=arr.indexOf(f);idx>=0?arr.splice(idx,1):arr.push(f);
  _planData.feeling=arr.join(',');renderPlanning();
}

function planNext(){
  var s=_planStep;
  if(s===0){var v=document.getElementById('plan-inp');_planData.intent=(v&&v.value.trim())||_planData.intent;}
  else if(s===1){var ps=document.getElementById('plan-start');var pe=document.getElementById('plan-end');if(ps)_planData.dayStart=ps.value;if(pe)_planData.dayEnd=pe.value;}
  else if(s===2){/* tasks added live */}

function planBuildTimeline(){
  var blocks=[];
  var d=_planData;
  var dayStart=d.dayStart||'07:00';
  var toMin=function(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);};
  var toStr=function(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};

  // Sort anchors
  var anchors=(d.anchors||[]).slice().sort(function(a,b){return toMin(a.from)-toMin(b.from);});
  // Sort tasks: must first, then focus, then others by duration desc
  var tasks=(d.tasks||[]).slice().sort(function(a,b){
    var po={must:0,should:1,maybe:2};var to2={focus:0,quick:2,errand:1,personal:3};
    return (po[a.prio]||1)*3+(to2[a.taskType]||1)-(po[b.prio]||1)*3-(to2[b.taskType]||1);
  });

  var cursor=toMin(dayStart);
  var taskIdx=0;

  // Weave anchors and tasks
  var allAnchors=anchors.map(function(a){return {s:toMin(a.from),e:toMin(a.to),label:a.label,type:'anchor'};});
  var ai2=0;

  while(cursor<toMin(d.dayEnd||'23:00')){
    // Check if next anchor starts
    if(ai2<allAnchors.length&&cursor>=allAnchors[ai2].s){
      var anc=allAnchors[ai2];
      blocks.push({type:'anchor',time:toStr(anc.s),endTime:toStr(anc.e),label:anc.label});
      cursor=anc.e;ai2++;continue;
    }
    // Next anchor start
    var nextAnchorStart=ai2<allAnchors.length?allAnchors[ai2].s:toMin(d.dayEnd||'23:00');
    var available=nextAnchorStart-cursor;
    if(available<=0){cursor=nextAnchorStart;continue;}
    // Fit tasks
    if(taskIdx<tasks.length){
      var tk=tasks[taskIdx];
      if(tk.duration<=available){
        blocks.push({type:'task',time:toStr(cursor),label:tk.name,duration:tk.duration,prio:tk.prio,taskType:tk.type});
        cursor+=tk.duration;
        // 10min buffer between tasks
        if(taskIdx<tasks.length-1){blocks.push({type:'buffer',time:toStr(cursor)});cursor+=10;}
        taskIdx++;
      } else {cursor=nextAnchorStart;}
    } else {
      // Free time
      if(available>30)blocks.push({type:'free',time:toStr(cursor)});
      cursor=nextAnchorStart;
    }
  }
  return blocks;
}

  h+='<button onclick="saveGoalBlocking()" style="background:#f5f0eb;border:none;border-radius:10px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;color:#6a6360">שמור</button>';

  h+='<button onclick="deleteGoal()" style="background:rgba(243,185,168,.2);border:none;border-radius:14px;padding:11px 14px;font-size:12px;cursor:pointer;color:#e08a72">מחק</button>';

function renderEditGoal(){
  var goals=loadGoals();

  document.getElementById('hdr-title').textContent=_goalIdx>=0?'עריכת מטרה':'מטרה חדשה';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:5px">למה זה חשוב לי? (הסיבה האמיתית)</div>';
  h+='<textarea id="goal-why" class="q-input" rows="2" placeholder="עמוק לרגע, לא התשובה השטחיתית..." style="min-height:60px;margin-bottom:14px">'+esc(g.why||'')+'</textarea>';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px">אופק זמן</div>';

  for(var hi=0;hi<GOAL_HORIZONS.length;hi++){

    h+='<button onclick="setGoalHorizon(\''+hor.id+'\')" id="ghor-'+hor.id+'" style="border:2px solid '+(isSel?hor.color:'#f0ebe3')+';border-radius:14px;padding:12px 16px;cursor:pointer;background:'+(isSel?hor.bg:'#fff')+';text-align:right;display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:20px">'+hor.emoji+'</span>';
    h+='<div><div style="font-size:13px;font-weight:700;color:#4a4340">'+hor.label+'</div><div style="font-size:10px;color:#a89e97">'+hor.desc+'</div></div>';
    if(isSel)h+='<span style="margin-right:auto;color:'+hor.color+';font-size:16px">&#10003;</span>';
    h+='</button>';
  }
  h+='<input id="goal-horizon" type="hidden" value="'+(g.horizon||'dream')+'">';
  h+='</div>';

  h+='<button onclick="saveGoalEdit()" style="width:100%;background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">שמור</button>';
  h+='</div>';

function setGoalHorizon(id){
  var inp=document.getElementById('goal-horizon');if(inp)inp.value=id;
  GOAL_HORIZONS.forEach(function(hor){
    var btn=document.getElementById('ghor-'+hor.id);if(!btn)return;
    var isSel=hor.id===id;
    btn.style.borderColor=isSel?hor.color:'#f0ebe3';
    btn.style.background=isSel?hor.bg:'#fff';
  });
}

function saveGoalEdit(){
  var title=document.getElementById('goal-title');
  if(!title||!title.value.trim()){showToast('נא הזן מטרה');return;}
  var goals=loadGoals();
  var existing=_goalIdx>=0?goals[_goalIdx]:{subs:[],blocking:''};
  var updated=Object.assign({},existing,{
    title:title.value.trim(),
    why:(document.getElementById('goal-why')||{}).value||'',
    horizon:(document.getElementById('goal-horizon')||{}).value||'dream'
  });
  if(_goalIdx>=0)goals[_goalIdx]=updated;
  else{goals.push(updated);_goalIdx=goals.length-1;}
  saveGoals(goals);showToast('נשמר &#10003;');
  _goalsView='view-goal';renderGoals();
}

function saveGoalSub(){
  var inp=document.getElementById('sub-text');
  if(!inp||!inp.value.trim()){showToast('כתוב משהו...');return;}
  var goals=loadGoals();
  if(!goals[_goalIdx].subs)goals[_goalIdx].subs=[];
  goals[_goalIdx].subs.push({text:inp.value.trim(),level:_subLevel,done:false,id:Date.now()+''});
  saveGoals(goals);showToast('נוסף &#10003;');
  _goalsView='view-goal';renderGoals();
}

function toggleGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs&&goals[_goalIdx].subs[sidx])
    goals[_goalIdx].subs[sidx].done=!goals[_goalIdx].subs[sidx].done;
  saveGoals(goals);renderGoals();
}

function deleteGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs)goals[_goalIdx].subs.splice(sidx,1);
  saveGoals(goals);renderGoals();
}

function saveGoalBlocking(){
  var inp=document.getElementById('goal-block-inp');
  var goals=loadGoals();
  if(goals[_goalIdx])goals[_goalIdx].blocking=(inp||{}).value||'';
  saveGoals(goals);showToast('נשמר &#10003;');
}

function deleteGoal(){
  var goals=loadGoals();goals.splice(_goalIdx,1);saveGoals(goals);
  _goalIdx=-1;_goalsView='home';renderGoals();
}

/* ── PEOPLE MODULE ── */
var _peopleView='home'; // home|person|edit-person|add-memory|edit-memory
var _personIdx=-1;
var _memoryIdx=-1;

var RELATIONSHIP_TYPES=[
  'חבר קרוב','חברה','בן משפחה','בת משפחה','בן זוג','בת זוג',
  'אח','אחות','אבא','אמא','סבא','סבתא','קולגה','אחר'
];
var MEMORY_TYPES=[

  {id:'memory',label:'זיכרון'},
  {id:'insight',label:'תובנה'},
  {id:'conversation',label:'שיחה'},
  {id:'important',label:'חשוב'}
];

function loadPeople(){try{var x=localStorage.getItem('people_v2');return x?JSON.parse(x):[];}catch(e){return[];}}
function savePeople(arr){try{localStorage.setItem('people_v2',JSON.stringify(arr));}catch(e){}}

function daysSince(ts){if(!ts)return null;return Math.floor((Date.now()-ts)/(1000*60*60*24));}

function renderPeople(){
  document.getElementById('hdr-title').textContent='האנשים שלי';
  if(_peopleView==='person')return renderPersonPage();
  if(_peopleView==='edit-person')return renderEditPerson();
  if(_peopleView==='add-memory')return renderAddMemory();
  renderPeopleHome();
}

function renderPeopleHome(){
  var people=loadPeople();
  var h='<div style="padding-bottom:30px">';

  // Subtitle
  h+='<div style="font-size:12px;color:#a89e97;margin-bottom:18px;line-height:1.6">האנשים שאני רוצה להיות נוכח בחיים שלהם.</div>';

  if(people.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F9E1;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">מי האנשים שלך?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">התחל להוסיף את האנשים שאתה רוצה לזכור<br>ולהיות נוכח בחיים שלהם.</div>';
    h+='<button onclick="_peopleView=\'edit-person\';_personIdx=-1;renderPeople()" style="background:linear-gradient(135deg,#f3b9a8,#e08a72);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ הוסף אדם</button>';
    h+='</div>';
  } else {
    // Gentle reminders strip
    var toCheck=people.filter(function(p){
      if(!p.contactFreq||p.contactFreq==='none')return false;
      var days=daysSince(p.lastContact);if(days===null)return true;
      var thresholds={daily:1,weekly:7,biweekly:14,monthly:30,occasionally:60};
      return days>=(thresholds[p.contactFreq]||30);
    });
    if(toCheck.length>0){
      h+='<div style="background:linear-gradient(135deg,#fff9f0,#fff5e8);border-radius:18px;padding:14px;margin-bottom:16px;border:1px solid #f3b9a855">';
      h+='<div style="font-size:11px;font-weight:700;color:#e08a72;margin-bottom:10px">אולי הגיע הזמן לבדוק מה שלום...</div>';
      for(var ri=0;ri<Math.min(toCheck.length,3);ri++){
        var rp=toCheck[ri];var rdays=daysSince(rp.lastContact);
        h+='<div onclick="_personIdx=people.indexOf(rp);_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #f5f0eb">';
        h+=personAvatar(rp,32);
        h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#4a4340">'+esc(rp.name)+'</div>';
        h+='<div style="font-size:10px;color:#a89e97">'+(rdays===null?'עדיין לא דיברתם':'עברו '+rdays+' ימים')+'</div></div>';
        h+='</div>';
      }
      h+='</div>';
    }

    // Upcoming dates
    var now=new Date();var upcoming=[];
    for(var pi2=0;pi2<people.length;pi2++){
      var p2=people[pi2];
      var dates2=p2.importantDates||[];
      for(var di=0;di<dates2.length;di++){
        var d2=dates2[di];var dt=new Date(d2.date);
        // For yearly, find next occurrence
        var next=new Date(now.getFullYear(),dt.getMonth(),dt.getDate());
        if(next<now)next=new Date(now.getFullYear()+1,dt.getMonth(),dt.getDate());
        var inDays=Math.ceil((next-now)/(1000*60*60*24));
        if(inDays<=14)upcoming.push({person:p2,pidx:pi2,date:d2,inDays:inDays});
      }
    }
    upcoming.sort(function(a,b){return a.inDays-b.inDays;});
    if(upcoming.length>0){
      h+='<div style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border-radius:18px;padding:14px;margin-bottom:16px">';
      h+='<div style="font-size:11px;font-weight:700;color:#4f6ef7;margin-bottom:10px">&#x1F4C5; תאריכים קרובים</div>';
      for(var ui=0;ui<upcoming.length;ui++){
        var u=upcoming[ui];
        h+='<div onclick="_personIdx='+u.pidx+';_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(79,110,247,.1)">';
        h+='<div style="font-size:18px;width:28px;text-align:center">'+upcomingEmoji(u.date.type)+'</div>';
        h+='<div style="flex:1"><div style="font-size:12px;font-weight:700;color:#4a4340">'+esc(u.person.name)+' — '+esc(u.date.title)+'</div>';
        h+='<div style="font-size:10px;color:#4f6ef7">'+(u.inDays===0?'היום!':'בעוד '+u.inDays+' ימים')+'</div></div></div>';
      }
      h+='</div>';
    }

    // People list
    for(var pi=0;pi<people.length;pi++){
      var p=people[pi];
      var days=daysSince(p.lastContact);
      var mems=p.memories||[];
      var lastMem=mems.length?mems[mems.length-1]:null;
      h+='<div onclick="_personIdx='+pi+';_peopleView=\'person\';renderPeople()" style="background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(200,180,160,.1);display:flex;gap:14px;align-items:flex-start">';
      h+=personAvatar(p,48);
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      h+='<div><div style="font-size:15px;font-weight:800;color:#4a4340">'+esc(p.name)+'</div>';
      h+='<div style="font-size:11px;color:#a89e97;margin-top:1px">'+esc(p.relationship||'')+'</div></div>';
      if(days!==null)h+='<div style="font-size:10px;color:#c0b8b0;white-space:nowrap">'+days+' ימים</div>';
      h+='</div>';
      if(p.currentUpdate)h+='<div style="font-size:12px;color:#6a6360;margin-top:6px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(p.currentUpdate)+'</div>';
      else if(lastMem)h+='<div style="font-size:11px;color:#a89e97;margin-top:5px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(lastMem.content.substring(0,60))+'...</div>';
      h+='</div></div>';
    }
    h+='<button onclick="_peopleView=\'edit-person\';_personIdx=-1;renderPeople()" style="width:100%;background:linear-gradient(135deg,#f3b9a8,#e08a72);border:none;border-radius:16px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;margin-top:6px">+ הוסף אדם</button>';
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function personAvatar(p,size){
  var bg='#f3b9a8';

  if(p.avatar)return '<img src="'+p.avatar+'" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex-shrink:0">';
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:linear-gradient(135deg,#f3b9a8,#e08a72);display:flex;align-items:center;justify-content:center;font-size:'+(size*0.38)+'px;font-weight:800;color:#fff;flex-shrink:0">'+initials+'</div>';

function setMemType(typeId){
  window._newMemType=typeId;
  MEMORY_TYPES.forEach(function(mt){
    var btn=document.getElementById('mtype-'+mt.id);
    if(btn){btn.style.background=mt.id===typeId?'linear-gradient(135deg,#f3b9a8,#e08a72)':'#f5f0eb';btn.style.color=mt.id===typeId?'#fff':'#6a6360';}
  });
}

function saveMemory(){
  var inp=document.getElementById('mem-text');
  if(!inp||!inp.value.trim()){showToast('כתוב משהו...');return;}
  var people=loadPeople();
  if(!people[_personIdx].memories)people[_personIdx].memories=[];
  people[_personIdx].memories.push({id:Date.now()+'',content:inp.value.trim(),type:window._newMemType||'note',date:Date.now(),pinned:false});
  savePeople(people);
  showToast('נשמר &#10003;');
  _peopleView='person';renderPeople();
}

function deleteMemory(memId){
  var people=loadPeople();
  people[_personIdx].memories=(people[_personIdx].memories||[]).filter(function(m){return m.id!==memId;});
  savePeople(people);renderPeople();
}

function togglePinMemory(memId){
  var people=loadPeople();
  var mems=people[_personIdx].memories||[];
  for(var i=0;i<mems.length;i++){if(mems[i].id===memId)mems[i].pinned=!mems[i].pinned;}
  savePeople(people);renderPeople();
}

function logContact(type){
  var people=loadPeople();
  people[_personIdx].lastContact=Date.now();
  if(!people[_personIdx].memories)people[_personIdx].memories=[];
  people[_personIdx].memories.push({id:Date.now()+'',content:'יצירת קשר: '+type,type:'conversation',date:Date.now(),pinned:false});
  savePeople(people);showToast('נרשם &#10003;');renderPeople();
}

function deletePersonDate(di){
  var people=loadPeople();
  (people[_personIdx].importantDates||[]).splice(di,1);
  savePeople(people);renderPeople();
}

function selectFreq(val){
  var inp=document.getElementById('ep-freq');
  if(inp)inp.value=val;
  var freqs=['none','occasionally','monthly','biweekly','weekly','daily'];
  for(var i=0;i<freqs.length;i++){
    var btn=document.getElementById('freq-btn-'+freqs[i]);
    if(!btn)continue;
    if(freqs[i]===val){btn.style.background='linear-gradient(135deg,#c9bce0,#a690cf)';btn.style.color='#fff';}
    else{btn.style.background='#f5f0eb';btn.style.color='#6a6360';}
  }
}

function addDateToPerson(){
  var title=document.getElementById('ep-date-title');
  var val=document.getElementById('ep-date-val');
  var dtype=document.getElementById('ep-dtype');
  var yearly=document.getElementById('ep-yearly');
  if(!title||!title.value.trim()||!val||!val.value){showToast('מלא שם ותאריך');return;}
  var people=loadPeople();
  var p=_personIdx>=0?people[_personIdx]:null;
  if(!p){// temp — will save with person
    window._pendingDates=window._pendingDates||[];
    window._pendingDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
    showToast('תאריך נוסף');title.value='';val.value='';return;
  }
  if(!p.importantDates)p.importantDates=[];
  p.importantDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
  savePeople(people);showToast('תאריך נוסף &#10003;');title.value='';val.value='';
}

function savePersonEdit(){
  var name=document.getElementById('ep-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם');return;}
  var people=loadPeople();
  var existing=_personIdx>=0?people[_personIdx]:{memories:[],importantDates:[]};
  var updated=Object.assign({},existing,{
    name:name.value.trim(),
    relationship:(document.getElementById('ep-rel')||{}).value||'',
    whatTheyMean:(document.getElementById('ep-mean')||{}).value||'',
    whatILove:(document.getElementById('ep-love')||{}).value||'',
    currentUpdate:(document.getElementById('ep-update')||{}).value||'',
    toAsk:(document.getElementById('ep-ask')||{}).value||'',
    contactFreq:(document.getElementById('ep-freq')||{}).value||'monthly'
  });
  // Merge pending dates
  if(window._pendingDates&&window._pendingDates.length){
    updated.importantDates=(updated.importantDates||[]).concat(window._pendingDates);
    window._pendingDates=[];
  }
  if(_personIdx>=0)people[_personIdx]=updated;
  else{people.push(updated);_personIdx=people.length-1;}
  savePeople(people);
  showToast('נשמר &#10003;');
  _peopleView='person';renderPeople();
}

function deletePerson(){
  var people=loadPeople();people.splice(_personIdx,1);savePeople(people);
  _personIdx=-1;_peopleView='home';renderPeople();
}

function saveInsEntry(){
  var textInp=document.getElementById('ins-text');
  if(!textInp||!textInp.value.trim()){showToast('כתוב משהו...');return;}
  var changedFrom=(document.getElementById('ins-changed-from')||{}).value||'';
  var changedWhy=(document.getElementById('ins-changed-why')||{}).value||'';
  var data=loadInsights();
  var key=insKey(_insCat,_insQ);
  if(!data[key])data[key]=[];
  data[key].push({text:textInp.value.trim(),date:Date.now(),changedFrom:changedFrom.trim()||null,changedWhy:changedWhy.trim()||null});
  saveInsights(data);
  showToast('תובנה נשמרה &#10003;');
  _insView='q';renderInsights();
}

function deleteInsEntry(idx){
  var data=loadInsights();var key=insKey(_insCat,_insQ);
  if(data[key])data[key].splice(idx,1);
  saveInsights(data);renderInsights();
}

function loadBookLibrary(){try{var x=localStorage.getItem('book_library');return x?JSON.parse(x):[]; }catch(e){return[];}}
function saveBookLibrary(arr){try{localStorage.setItem('book_library',JSON.stringify(arr));}catch(e){}}

function finishBook(){
  var book=loadBook();
  if(!book.title)return;
  var lib=loadBookLibrary();
  var quotes=loadBookQuotes();
  // Check if already in library
  var exists=lib.some(function(b){return b.title===book.title;});
  if(!exists){
    lib.unshift({
      title:book.title,cover:book.cover||'',
      totalPages:book.total||book.page,
      finishedDate:new Date().toISOString().slice(0,10),
      quotes:quotes.slice()
    });
    saveBookLibrary(lib);
  }
  // Clear current book + quotes
  saveBook({title:'',page:0,total:0,cover:''});
  saveBookQuotes([]);
  showToast('✓ הספר נוסף לספרייה!');
  renderBookWidget();
}

var _showLibrary=false;
var _libraryOpenIdx=-1;

function toggleBookLibrary(){
  _showLibrary=!_showLibrary;
  _libraryOpenIdx=-1;
  renderBookWidget();
}
function openLibraryBook(idx){
  _libraryOpenIdx=_libraryOpenIdx===idx?-1:idx;
  renderBookWidget();

function handleBookCover(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=400,maxH=600;
      var w=img.width,h=img.height;
      var scale=Math.min(maxW/w,maxH/h,1);
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(h*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      var book=loadBook();book.cover=canvas.toDataURL('image/jpeg',0.85);
      saveBook(book);renderBookWidget();openBookEdit();
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

var _stopPhotoData='';

function previewStopPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=400;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _stopPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('stop-photo-prev');
      if(prev)prev.innerHTML='<img src="'+_stopPhotoData+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px">';
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function createTrip(){
  var name=document.getElementById('trip-name-inp');
  var date=document.getElementById('trip-date-inp');
  if(!name||!name.value.trim())return;
  var trips=loadTrips();
  var idx=trips.length;
  trips.push({name:name.value.trim(),startDate:date&&date.value?new Date(date.value).getTime():Date.now(),stops:[]});
  saveTrips(trips);saveActiveTrip(idx);_tripView='active';renderTrip();
}

function deleteTrip(idx){
  var trips=loadTrips();trips.splice(idx,1);saveTrips(trips);
  var active=loadActiveTrip();
  if(active===idx)saveActiveTrip(-1);
  else if(active>idx)saveActiveTrip(active-1);
  renderTripIntro();
}

function detectLocation(){
  var btn=document.getElementById('detect-loc-btn');
  if(btn){btn.textContent='חופש...⏳';btn.disabled=true;}
  if(!navigator.geolocation){showToast('גיאולוקציה לא זמין');return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=he')
      .then(function(r){return r.json();})
      .then(function(data){
        var place=data.address.city||data.address.town||data.address.village||data.address.county||'';
        var country=data.address.country||'';
        var placeInp=document.getElementById('stop-place');
        var countryInp=document.getElementById('stop-country');
        if(placeInp&&place)placeInp.value=place;
        if(countryInp&&country)countryInp.value=country;
        if(btn){btn.textContent='✓ נמצא!';btn.disabled=false;}
        showToast('✓ '+place+', '+country);
      }).catch(function(){
        if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
        showToast('שגיאה בחיפוש');
      });
  },function(){
    if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
    showToast('לא ניתן לקבל מיקום');
  });
}

function saveStop(){
  var place=document.getElementById('stop-place');
  var country=document.getElementById('stop-country');
  var date=document.getElementById('stop-date');
  var note=document.getElementById('stop-note');
  if(!place||!place.value.trim()){showToast('נא להזין שם מקום');return;}
  var trips=loadTrips();
  var idx=loadActiveTrip();
  if(!trips[idx])return;
  trips[idx].stops.push({
    place:place.value.trim(),
    country:country?country.value.trim():'',
    date:date&&date.value?new Date(date.value).getTime():Date.now(),
    note:note?note.value.trim():'',
    photo:_stopPhotoData||''
  });
  _stopPhotoData='';
  saveTrips(trips);_tripView='active';renderTrip();
  showToast('✓ '+place.value.trim()+' נוספה!');
}

function deleteStop(tripIdx,stopIdx){
  var trips=loadTrips();
  if(trips[tripIdx])trips[tripIdx].stops.splice(stopIdx,1);
  saveTrips(trips);renderTrip();
}


/* ── VISION BOARD ── */
// Photos and words the user arranges by hand inside a framed square on the home
// screen. Geometry is kept in percentages of the frame, so an arrangement
// survives a different screen size; photos are downscaled on the way in,
// because localStorage holds a few megabytes and a camera roll would fill it in
// three pictures.
//
// A note is the same kind of object as a photo and moves through the same
// gestures. The one difference is what scaling means: a photo has a width, a
// note has a font size - both stored as a percentage of the frame, both driven
// by the same corner handle.
var VB_KEY='vision_board';
var VB_MAX=520;   // longest edge kept of an uploaded photo, in px
var VB_COLORS=['#4a4340','#a690cf','#e08a72','#8aa899','#ffffff'];
var _vbSel=null;  // id of the selected item, or null
var _vbG=null;    // the gesture in progress - see vbDown
var _vbPts={};    // pointerId -> last client position, for two-finger gestures
var _vbEditId=null;               // note being edited in the sheet, null = new one
var _vbColor=VB_COLORS[0];
var _vbResizeBound=false;

function loadVision(){
  try{var x=localStorage.getItem(VB_KEY);var a=x?JSON.parse(x):[];return Array.isArray(a)?a:[];}catch(e){return[];}
}
function saveVision(a){
  try{localStorage.setItem(VB_KEY,JSON.stringify(a));return true;}
  catch(e){showToast('אין מספיק מקום לעוד תמונות');return false;}
}
function vbFind(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function vbClamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
function vbTop(a){var t=0;a.forEach(function(o){if((o.z||1)>t)t=o.z||1;});return t;}
// Where a new item lands: scattered around the middle rather than stacked.
function vbSpot(n){return {x:34+(n%3)*16,y:34+(Math.floor(n/3)%3)*16};}

function renderVisionBoard(){
  var el=document.getElementById('home-vision');if(!el)return;
  var items=loadVision();
  var h='<div style="background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';

function vbSizeText(){

function vbPick(){var f=document.getElementById('vb-file');if(f)f.click();}

// Selection is a class swap rather than a re-render: re-rendering here would
// throw away the very element the finger is already holding.
function vbSelect(id){
  _vbSel=id;
  var c=document.getElementById('vb-canvas');if(!c)return;
  var els=c.querySelectorAll('.vb-item');
  for(var i=0;i<els.length;i++){
    var base='vb-item'+(els[i].className.indexOf('vb-text')>=0?' vb-text':'');
    els[i].className=base+(els[i].getAttribute('data-id')===id?' on':'');
  }
  if(!id)return;
  var a=loadVision(),it=vbFind(a,id);if(!it)return;
  var top=vbTop(a);
  if((it.z||1)<top){          // touching an item brings it to the front
    it.z=top+1;saveVision(a);
    var el=c.querySelector('.vb-item[data-id="'+id+'"]');if(el)el.style.zIndex=it.z;
  }
}

// Distance, angle and midpoint between the two fingers currently down.
function vbTwo(){
  var k=Object.keys(_vbPts),a=_vbPts[k[0]],b=_vbPts[k[1]];
  return {d:Math.max(8,Math.hypot(b.x-a.x,b.y-a.y)),
          a:Math.atan2(b.y-a.y,b.x-a.x),
          x:(a.x+b.x)/2,y:(a.y+b.y)/2};
}

function vbDown(e){
  var el=e.target.closest?e.target.closest('.vb-item'):null;
  if(!el){vbSelect(null);return;}
  // The two badges are buttons: let their click handlers run instead of dragging.
  if(e.target.closest('.vb-del')||e.target.closest('.vb-edit'))return;
  var id=el.getAttribute('data-id');
  if(id!==_vbSel)vbSelect(id);
  _vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var r=document.getElementById('vb-canvas').getBoundingClientRect();

  if(Object.keys(_vbPts).length>=2&&_vbG&&_vbG.id===id){
    var p=vbTwo();
    _vbG.mode='pinch';
    _vbG.it={x:_vbG.cur.x,y:_vbG.cur.y,w:_vbG.cur.w,rot:_vbG.cur.rot};
    _vbG.d0=p.d;_vbG.a0=p.a;_vbG.mx=p.x;_vbG.my=p.y;
  }else{
    var it=vbFind(loadVision(),id);if(!it)return;
    var text=it.kind==='text';
    var scale=text?it.fs:it.w;   // what the corner handle grows: font size or width
    var mode=e.target.closest('.vb-size')?'size':(e.target.closest('.vb-rot')?'rot':'move');
    var cx=r.left+it.x/100*r.width,cy=r.top+it.y/100*r.height;
    _vbG={id:id,el:el,mode:mode,r:r,text:text,
          it:{x:it.x,y:it.y,w:scale,rot:it.rot},
          cur:{x:it.x,y:it.y,w:scale,rot:it.rot},
          px:e.clientX,py:e.clientY,
          d0:Math.max(8,Math.hypot(e.clientX-cx,e.clientY-cy)),
          a0:Math.atan2(e.clientY-cy,e.clientX-cx)};
    window.addEventListener('pointermove',vbMove);
    window.addEventListener('pointerup',vbUp);
    window.addEventListener('pointercancel',vbUp);
  }
  e.preventDefault();
}

function vbMove(e){
  if(!_vbG)return;
  if(_vbPts[e.pointerId])_vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var g=_vbG,r=g.r,c=g.cur;
  var lo=g.text?2:8,hi=g.text?40:140;
  if(g.mode==='pinch'&&Object.keys(_vbPts).length>=2){
    var p=vbTwo();
    c.w=vbClamp(g.it.w*(p.d/g.d0),lo,hi);
    c.rot=g.it.rot+(p.a-g.a0)*180/Math.PI;
    c.x=vbClamp(g.it.x+(p.x-g.mx)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(p.y-g.my)/r.height*100,0,100);
  }else if(g.mode==='move'){
    c.x=vbClamp(g.it.x+(e.clientX-g.px)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(e.clientY-g.py)/r.height*100,0,100);
  }else{
    var cx=r.left+c.x/100*r.width,cy=r.top+c.y/100*r.height;
    if(g.mode==='size')c.w=vbClamp(g.it.w*Math.hypot(e.clientX-cx,e.clientY-cy)/g.d0,lo,hi);
    else c.rot=g.it.rot+(Math.atan2(e.clientY-cy,e.clientX-cx)-g.a0)*180/Math.PI;
  }
  g.el.style.left=c.x+'%';g.el.style.top=c.y+'%';
  if(g.text)g.el.style.fontSize=(c.w/100*r.width)+'px';
  else g.el.style.width=c.w+'%';
  g.el.style.transform='translate(-50%,-50%) rotate('+c.rot+'deg)';
  e.preventDefault();
}

function vbUp(e){
  delete _vbPts[e.pointerId];
  var g=_vbG;if(!g)return;
  var left=Object.keys(_vbPts);
  if(left.length===1&&g.mode==='pinch'){
    // one finger lifted out of a pinch - carry on dragging with the other
    var p=_vbPts[left[0]];
    g.mode='move';g.it={x:g.cur.x,y:g.cur.y,w:g.cur.w,rot:g.cur.rot};g.px=p.x;g.py=p.y;
    return;
  }
  if(left.length)return;
  vbCommit();
  window.removeEventListener('pointermove',vbMove);
  window.removeEventListener('pointerup',vbUp);
  window.removeEventListener('pointercancel',vbUp);
  _vbG=null;
}

function vbCommit(){
  var g=_vbG;if(!g)return;
  var a=loadVision(),it=vbFind(a,g.id);if(!it)return;
  it.x=+g.cur.x.toFixed(2);it.y=+g.cur.y.toFixed(2);it.rot=+g.cur.rot.toFixed(1);
  if(g.text){
    it.fs=+g.cur.w.toFixed(2);
    // keep the attribute in step, or the next window resize restores the old size
    if(g.el.setAttribute)g.el.setAttribute('data-fs',it.fs);
  }else{
    it.w=+g.cur.w.toFixed(2);
  }
  saveVision(a);
}

function vbDelete(id){
  var a=loadVision().filter(function(o){return o.id!==id;});
  saveVision(a);
  if(_vbSel===id)_vbSel=null;

}

// Fit the photo inside VB_MAX and re-encode as JPEG - a 4MB camera shot comes
// out around 60KB, which is what lets a boardful of them live in localStorage.
function vbScale(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,VB_MAX/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*s));
      cv.height=Math.max(1,Math.round(img.height*s));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL('image/jpeg',0.8));}catch(err){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=e.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}

function handleVisionPhoto(input){
  var files=Array.prototype.slice.call(input.files||[]);
  input.value='';   // so picking the same photo twice still fires onchange
  if(!files.length)return;
  var a=loadVision(),pending=files.length,added=0;
  files.forEach(function(file,i){
    vbScale(file,function(src){
      if(src){
        var spot=vbSpot(a.length);
        a.push({id:'vb'+Date.now()+'_'+i,src:src,
                x:spot.x,y:spot.y,w:38,
                rot:Math.round((Math.random()*14-7)*10)/10,z:vbTop(a)+1});
        added++;
      }
      if(--pending===0){
        if(added)saveVision(a);
        renderVisionBoard();
      }
    });
  });
}

// משחק - "החץ", a game for the table. It is a complete page of its own, kept
// at the bottom of this file in a #game-src block and handed to an iframe, so
// its dark full-screen styling stays sealed off from the app's.
// ---------------------------------------------------------------------
var _gameFrame=null;
function sizeGameFrame(){
  if(!_gameFrame||!_gameFrame.parentNode)return;
  var top=_gameFrame.getBoundingClientRect().top;
  _gameFrame.style.height=Math.max(360,window.innerHeight-top-12)+'px';
}
function renderGame(){
  document.getElementById('content').innerHTML='<div class="game-wrap"><iframe class="game-frame" id="game-frame" title="החץ"></iframe></div>';
  _gameFrame=document.getElementById('game-frame');
  var src=document.getElementById('game-src');
  // the stored page has its closing script tag escaped so it cannot end the
  // block that carries it; put it back on the way into the iframe.
  _gameFrame.srcdoc=src?src.textContent.trim().split('<\\/script>').join('<'+'/script>'):'';
  _gameFrame.addEventListener('load',sizeGameFrame);
  window.scrollTo(0,0);
  sizeGameFrame();
  requestAnimationFrame(sizeGameFrame);
}
window.addEventListener('resize',sizeGameFrame);

// "היום" on the home screen - the same four macro bars and water row the
// תזונה module shows, read straight off today's record. It always reports
// today, whatever day the module happens to be parked on.

  var el=document.getElementById('home-today');
  if(!el)return;
  var day=loadDay(todayStr());
  var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
  var p=r2(day.meals.reduce(function(a,m){return a+(m.p||0);},0));
  var c=r2(day.meals.reduce(function(a,m){return a+(m.c||0);},0));
  var f=r2(day.meals.reduce(function(a,m){return a+(m.f||0);},0));
  var water=day.water||0;
  var wp=Math.min(100,Math.round(water/TARGETS.water*100));
  var bars=[
    {v:kcal,pct:Math.min(100,Math.round(kcal/TARGETS.kcal*100)),lbl:'קק"ל',g:'linear-gradient(180deg,#c9bce0,#a690cf)',col:'#a690cf'},
    {v:p+'g',pct:Math.min(100,Math.round(p/TARGETS.p*100)),lbl:'חלבון',g:'linear-gradient(180deg,#f3b9a8,#e08a72)',col:'#e08a72'},
    {v:c+'g',pct:Math.min(100,Math.round(c/TARGETS.c*100)),lbl:'פחמימה',g:'linear-gradient(180deg,#bfe0c7,#8fc79e)',col:'#8fc79e'},
    {v:f+'g',pct:Math.min(100,Math.round(f/TARGETS.f*100)),lbl:'שומן',g:'linear-gradient(180deg,#f6dfa0,#e8c162)',col:'#e8c162'}
  ];
  var n=day.meals.length;
  var h='<div class="ht-card"><div class="ht-hd"><div class="ht-lbl">היום</div>'+
    '<button class="ht-open" onclick="enterModule(\'nutrition\')">'+
    (n?n+(n===1?' ארוחה נרשמה':' ארוחות נרשמו'):'עוד לא נרשמה ארוחה')+' &#8249;</button></div><div class="ht-bars">';
  for(var i=0;i<bars.length;i++){
    var b=bars[i];
    h+='<div class="ht-col"><div class="ht-pct">'+b.pct+'%</div>'+
       '<div class="ht-track"><div class="ht-fill" style="height:'+b.pct+'%;background:'+b.g+'"></div></div>'+

/* ── BACKUP ──
   Everything the app knows lives in this browser's localStorage and nowhere
   else. Delete the app, change phone, and a year of tracking is gone - and
   there is no other way to carry data from this web prototype into the
   native build, or between the dev and stable copies.

   localStorage.length/key() are used rather than a list of known keys, so a
   feature added later is backed up without anyone remembering to add it
   here. In dev those go through the namespacing shim and return the app's
   own key names, which is exactly what should end up in the file.

   The steps token is deliberately left out: it is a bearer secret, and a
   backup file travels - through mail, a cloud drive, a chat. A fresh
   install mints its own. */
var BACKUP_SKIP={steps_token:1,last_export:1};

function collectAppData(){
  var out={},i,k;
  for(i=0;i<localStorage.length;i++){
    k=localStorage.key(i);
    if(!k||BACKUP_SKIP[k])continue;
    try{out[k]=localStorage.getItem(k);}catch(e){}
  }
  return out;
}

function buildBackup(){
  var data=collectAppData();
  return JSON.stringify({
    app:'better-me',version:1,
    exportedAt:new Date().toISOString(),
    keyCount:Object.keys(data).length,
    data:data
  });
}

function exportData(){
  var text=buildBackup(),name='better-me-'+todayStr()+'.json';
  var blob=new Blob([text],{type:'application/json'});
  var kb=Math.max(1,Math.round(blob.size/1024));
  var file=null;
  try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  try{localStorage.setItem('last_export',new Date().toISOString());}catch(e){}

  // The share sheet is the only reliable way to save a file out of a web app
  // on iOS; a download link is the fallback everywhere else.
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'גיבוי Better Me'}).then(function(){
      renderBackup();showToast('✓ הגיבוי נשמר · '+kb+'KB');
    },function(){});
    return;
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(function(){try{URL.revokeObjectURL(url);a.remove();}catch(e){}},1000);
  renderBackup();showToast('✓ הגיבוי ירד · '+kb+'KB');
}

var _pendingImport=null;

function importPick(){var i=document.getElementById('backup-file');if(i)i.click();}

function importChosen(input){
  var f=input.files&&input.files[0];
  input.value='';
  if(!f)return;
  var r=new FileReader();
  r.onerror=function(){showToast('לא ניתן לקרוא את הקובץ');};
  r.onload=function(){
    var o=null;
    try{o=JSON.parse(r.result);}catch(e){}
    if(!o||o.app!=='better-me'||!o.data||typeof o.data!=='object'){
      showToast('הקובץ לא נראה כמו גיבוי של האפליקציה');return;
    }
    _pendingImport=o;renderImportSheet();
  };
  r.readAsText(f);
}

function backupSummary(o){
  var keys=Object.keys(o.data),days=[],i,m;
  for(i=0;i<keys.length;i++){
    m=/^day_(\d{4}-\d{2}-\d{2})$/.exec(keys[i]);
    if(m)days.push(m[1]);
  }
  days.sort();
  return{keys:keys.length,days:days.length,from:days[0]||'',to:days[days.length-1]||''};
}

function closeImport(){
  _pendingImport=null;
  var el=document.getElementById('imp-overlay');
  if(el)el.remove();
}

  var h='<div class="summary-overlay" id="imp-overlay" onclick="if(event.target===this)closeImport()">';

}

function applyImport(mode){
  var o=_pendingImport;if(!o)return;
  var data=o.data,keys=Object.keys(data),i,k,n=0;
  if(mode==='replace'){
    var mine=[],j;
    for(j=0;j<localStorage.length;j++){k=localStorage.key(j);if(k&&!BACKUP_SKIP[k])mine.push(k);}
    for(j=0;j<mine.length;j++){try{localStorage.removeItem(mine[j]);}catch(e){}}
  }
  for(i=0;i<keys.length;i++){
    k=keys[i];
    if(BACKUP_SKIP[k])continue;
    if(mode==='merge'&&localStorage.getItem(k)!==null)continue;
    if(typeof data[k]!=='string')continue;
    try{localStorage.setItem(k,data[k]);n++;}catch(e){}
  }
  closeImport();
  showToast('✓ יובאו '+n+' פריטים');
  // Half the app caches its data in module variables; a reload is the honest
  // way to make every screen read the new state.
  setTimeout(function(){location.reload();},800);
}

function renderBackup(){
  var el=document.getElementById('home-backup');if(!el)return;
  var last='';try{last=localStorage.getItem('last_export')||'';}catch(e){}
  var n=Object.keys(collectAppData()).length;

  h+='<div style="font-size:10px;color:#c0b8b0">'+n+' פריטים</div></div>';
  h+='<div style="font-size:10.5px;color:'+(last?'#a89e97':'#e08a72')+';line-height:1.6;margin-bottom:12px">'+(last?'ייצוא אחרון '+stepsAgo(last):'כל הנתונים קיימים רק במכשיר הזה — עוד לא יצא גיבוי.')+'</div>';
  h+='<div style="display:flex;gap:8px">';
  h+='<button onclick="exportData()" style="flex:1;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:12px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;color:#fff;font-family:inherit">ייצוא</button>';

  h+='</div>';

}
