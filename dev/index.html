  // #content survives innerHTML, so the other screen's handler survives with
  // it. Left attached, both drags start at once and fight over the drop.
  var box=document.getElementById('content');
  box.removeEventListener('pointerdown',wkDown);
  box.removeEventListener('pointerdown',moDown);
  box.removeEventListener('pointerdown',dpDown);
  box.addEventListener('pointerdown',dpDown);
  box.removeEventListener('pointerdown',daySwipeDown);
  box.removeEventListener('pointerup',daySwipeUp);
  box.addEventListener('pointerdown',daySwipeDown);
  box.addEventListener('pointerup',daySwipeUp);
}

/* ── THE SIDE RAIL ──
   Writing lives at the bottom of the screen, which means scrolling away from
   the grid to add anything. This pins a "+" and the unplaced tasks to the edge
   of the viewport, so a task can be written and dragged onto an hour without
   ever leaving the hours. It lives outside #content so a re-render cannot take
   it out from under a finger mid-drag. */
var _dpRailOpen=false,_dpRailText='',_dpRailWasOpen=false;
function dpRail(){
  dpRailClear();          // the panel is a sibling, not a child - clear both
  if(_planMode!=='day')return;
  var loose=[],all=dpAll(_dpDate),i;
  for(i=0;i<all.length;i++)if(all[i].hour===null&&all[i].src==='day')loose.push(all[i]);

  var h='<div id="dp-rail" class="dp-rail">';
  h+='<button class="dp-rail-add" onclick="dpRailToggle()">'+(_dpRailOpen?'&times;':'+')+'</button>';
  for(i=0;i<loose.length&&i<5;i++){
    var c=wkColor(loose[i].c);
    h+='<div class="dp-rail-chip" data-task="'+loose[i].id+'" style="background:'+c.bg+';color:'+c.tx+'" title="'+esc(loose[i].w)+'">'+esc(loose[i].w)+'</div>';
  }
  h+='</div>';
  if(_dpRailOpen){
    /* Beside the button rather than down at the foot of the screen: the point
       of the rail is not having to travel, and a panel at the bottom is the
       same journey again. */
    var lib=loadTaskLib();
    h+='<div id="dp-rail-bar" class="dp-rail-bar">';
    h+='<div style="display:flex;gap:7px">';
    h+='<input id="dp-rail-in" class="mtin" style="flex:1;margin-bottom:0;font-size:13px" placeholder="משימה חדשה" value="'+esc(_dpRailText)+'" oninput="_dpRailText=this.value" onkeydown="if(event.key===\'Enter\')dpRailAdd()">';
    h+='<button onclick="dpRailAdd()" style="background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:11px;padding:0 14px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;flex-shrink:0;font-family:inherit">+</button>';
    h+='</div>';
    if(lib.length){
      h+='<div style="font-size:9.5px;letter-spacing:.08em;font-weight:700;color:#a89e97;margin:11px 0 7px">משימות חוזרות</div>';
      h+='<div class="dp-rail-lib">';
      for(i=0;i<lib.length;i++){
        var lc=wkColor(lib[i].c);
        h+='<div class="dp-rail-libchip" data-lib="'+lib[i].id+'" style="background:'+lc.bg+';color:'+lc.tx+'">'+esc(lib[i].w)+'</div>';
      }
      h+='</div>';
      h+='<div style="font-size:9px;color:#c0b8b0;line-height:1.5;margin-top:8px">גרור אחת מהן ישר לשעה</div>';
    }
    h+='</div>';
  }
  document.body.insertAdjacentHTML('beforeend',h);
  var rail=document.getElementById('dp-rail');
  rail.removeEventListener('pointerdown',dpDown);
  rail.addEventListener('pointerdown',dpDown);
  var bar=document.getElementById('dp-rail-bar');
  if(bar){bar.removeEventListener('pointerdown',dpDown);bar.addEventListener('pointerdown',dpDown);}
  document.removeEventListener('pointerdown',dpRailOutside,true);
  if(_dpRailOpen)document.addEventListener('pointerdown',dpRailOutside,true);
  if(_dpRailOpen&&!_dpRailWasOpen)
    setTimeout(function(){var e=document.getElementById('dp-rail-in');if(e)e.focus();},40);
  _dpRailWasOpen=_dpRailOpen;
}
/* Asked for: a tap anywhere else puts the panel away. It listens only
   while the panel is open, and ignores taps on the panel, on the rail, or
   on the button itself - that one already toggles. Capture phase, so it
   still hears the tap when something below stops it propagating. */
function dpRailOutside(e){
  if(!_dpRailOpen)return;
  var t=e.target;
  if(t.closest&&(t.closest('#dp-rail-bar')||t.closest('#dp-rail')))return;
  _dpRailOpen=false;_dpRailText='';dpRail();
}
function dpRailToggle(){
  _dpRailOpen=!_dpRailOpen;
  if(!_dpRailOpen)_dpRailText='';   // closing it deliberately clears the draft
  dpRail();
}
function dpRailAdd(){
  var el=document.getElementById('dp-rail-in');
  if(!el||!el.value.trim())return;
  var dp=loadDPlan(_dpDate);
  dp.items.push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                 w:el.value.trim(),c:_dpNewColor});
  saveDPlan(_dpDate,dp);
  el.value='';_dpRailText='';   // or the rebuild puts the draft straight back
  renderPlanDay();
  setTimeout(function(){var e=document.getElementById('dp-rail-in');if(e)e.focus();},40);
}
function dpRailClear(){
  var r=document.getElementById('dp-rail');if(r)r.remove();
  var b=document.getElementById('dp-rail-bar');if(b)b.remove();
}

function dpTaskHTML(t){
  var c=wkColor(t.c),h='';
  h+='<div class="wk-task" data-task="'+t.id+'" style="border-right:4px solid '+c.dot+'">';
  h+='<div class="wk-grip">&#8942;&#8942;</div>';
  if(t.src==='day')h+='<button class="wk-dot" style="background:'+c.dot+'" onclick="dpPick(\''+t.id+'\')"></button>';
  else h+='<span class="wk-dot" style="background:'+c.dot+';cursor:default"></span>';
  h+='<div style="flex:1;min-width:0;font-size:13.5px;color:#4a4340;line-height:1.45">'+esc(t.w)+'</div>';
  if(t.src!=='day')h+='<span style="font-size:9px;color:#c0b8b0;flex-shrink:0">'+(t.src==='month'?'מהחודש':'מהשבוע')+'</span>';
  else h+='<button onclick="dpDel(\''+t.id+'\')" style="background:none;border:none;color:#e0c4bb;font-size:15px;cursor:pointer;flex-shrink:0;font-family:inherit">&times;</button>';
  h+='</div>';
  if(_dpPick===t.id)h+='<div class="wk-picker">'+wkSwatches("dpSetColor('"+t.id+"','%K%')",t.c||'lav')+'</div>';
  return h;
}
function dpShift(dir){
  var d=new Date(_dpDate+'T12:00:00');d.setDate(d.getDate()+dir);
  _dpDate=wkStamp(d);_dpPick='';renderPlanDay();
}
function planOpenDay(date){_planMode='day';_dpDate=date;_dpRailOpen=false;renderPlanning();window.scrollTo(0,0);}

/* The deeper answers live in plan_history keyed by the day, the same store
   the planning journal reads, and are written as they are given rather than
   at the end of a flow. */
function deepGet(){return planForDate(_dpDate)||{};}
function deepSave(patch){
  var hist=loadPlanHistory(),out=[],rec=null,i,k;
  for(i=0;i<hist.length;i++){
    if(hist[i].forDate===_dpDate)rec=hist[i];else out.push(hist[i]);
  }
  rec=rec||{forDate:_dpDate};
  for(k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))rec[k]=patch[k];
  rec.forDate=_dpDate;rec.date=Date.now();
  out.unshift(rec);
  if(out.length>60)out=out.slice(0,60);
  savePlanHistory(out);
}
// Typed text is read straight off the screen, so nothing is lost when a chip
// or a reminder triggers a re-render.
function deepSaveText(){
  var a=document.getElementById('dp-intent'),b=document.getElementById('dp-blocker');
  if(!a&&!b)return;
  deepSave({intent:a?a.value.trim():(deepGet().intent||''),
            blocker:b?b.value.trim():(deepGet().blocker||'')});
}
function deepToggleFeeling(f){
  deepSaveText();
  var cur=(deepGet().feeling||'').split(',').filter(function(x){return x;});
  var i=cur.indexOf(f);
  if(i>=0)cur.splice(i,1);else cur.push(f);
  deepSave({feeling:cur.join(',')});
  renderPlanDay();
}
function deepAddRemember(){
  var el=document.getElementById('dp-rem');
  if(!el||!el.value.trim())return;
  deepSaveText();
  var list=(Array.isArray(deepGet().reminders)?deepGet().reminders:[]).slice();
  list.push(el.value.trim());
  deepSave({reminders:list});
  renderPlanDay();
  setTimeout(function(){var e=document.getElementById('dp-rem');if(e)e.focus();},40);
}
function deepDelRemember(i){
  deepSaveText();
  var list=(Array.isArray(deepGet().reminders)?deepGet().reminders:[]).slice();
  list.splice(i,1);
  deepSave({reminders:list});
  renderPlanDay();
}

/* ── the drag ── */
function dpDown(e){
  var el=e.target.closest?e.target.closest('[data-task],[data-lib]'):null;
  if(!el)return;
  if(e.target.closest('button'))return;
  var r=el.getBoundingClientRect();
  var g=el.cloneNode(true);
  g.className=el.className+' wk-ghost';
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  el.style.opacity='.3';
  _dpDrag={id:el.getAttribute('data-task'),lib:el.getAttribute('data-lib')||'',g:g,src:el,
           dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,
           // only a chip already sitting on an hour can be given an end time
           sx:e.clientX,sy:e.clientY,
           canEnd:el.classList.contains('dp-chip'),mode:'move'};
  if(!_dpDrag.lib)trashShow();
  window.addEventListener('pointermove',dpMove);
  window.addEventListener('pointerup',dpUp);
  window.addEventListener('pointercancel',dpUp);
  e.preventDefault();
}
function dpHitSlot(x,y){
  var s=document.querySelectorAll('.dp-slot'),i,r;
  for(i=0;i<s.length;i++){
    r=s[i].getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return s[i];
  }
  return null;
}
function dpOverPools(x,y){
  var ids=['dp-pool','dp-week'],i,el,r;
  for(i=0;i<ids.length;i++){
    el=document.getElementById(ids[i]);
    if(!el)continue;
    r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return true;
  }
  return false;
}
function dpMove(e){
  if(!_dpDrag)return;
  _dpDrag.moved=true;
  _dpDrag.g.style.left=(e.clientX-_dpDrag.dx)+'px';
  _dpDrag.g.style.top=(e.clientY-_dpDrag.dy)+'px';
  dragEdgeScroll(e.clientX,e.clientY,dpMove);
  /* Sliding onto the hour column turns the gesture into "how long does this
     run", and it stays that way - the finger is already off the task, so
     switching back mid-pull would be a surprise. */
  if(_dpDrag.mode==='move'&&_dpDrag.canEnd&&dpHitHourLabel(e.clientX,e.clientY)){
    _dpDrag.mode='end';
    _dpDrag.g.classList.add('dp-ghost-end');trashHide();
    dpCloseFine();_dpDrag.lastHit=null;clearTimeout(_dpDrag.holdT);
  }
  if(_dpDrag.mode==='end'){dpMoveEnd(e);return;}
  if(!_dpDrag.lib){
    var f=dpFind(_dpDrag.id);
    swipeMark(_dpDrag,swipeArmed(_dpDrag,e),(f&&f.src!=='day')?'הסר מהיום':'מחק');
  }

  var hit=dpHitSlot(e.clientX,e.clientY),s=document.querySelectorAll('.dp-slot'),i;
  for(i=0;i<s.length;i++)s[i].classList.toggle('hot',s[i]===hit);

  // Leaving an hour cancels the wait and folds it back up; staying opens it.
  if(hit!==_dpDrag.lastHit){
    _dpDrag.lastHit=hit;
    clearTimeout(_dpDrag.holdT);
    dpCloseFine();
    if(hit)_dpDrag.holdT=setTimeout(function(){
      if(_dpDrag&&_dpDrag.lastHit===hit)dpOpenFine(hit);
    },DP_HOLD);
  }
  var fb=dpHitFine(e.clientX,e.clientY),all=document.querySelectorAll('.dp-fine-b');
  for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fb);
}
/* Pulling down the hour column marks out how far the task runs. Waiting on an
   hour opens the same five-minute steps, so the end can be exact too. */
function dpMoveEnd(e){
  var t=dpFind(_dpDrag.id);
  if(!t||t.hour===null)return;
  var lbl=dpHitHourLabel(e.clientX,e.clientY);
  var fineB=dpHitFine(e.clientX,e.clientY),i;
  var all=document.querySelectorAll('.dp-fine-b');
  var rows=document.querySelectorAll('.dp-row'),startM=dpMins(t);
  var upto=fineB?parseInt(fineB.getAttribute('data-hour'),10)
                :(lbl?parseInt(lbl.getAttribute('data-hour'),10):null);
  for(i=0;i<rows.length;i++){
    var rh=parseInt(rows[i].getAttribute('data-hrow'),10);
    rows[i].classList.toggle('reach',upto!==null&&rh>=t.hour&&rh<=upto);
  }
  /* Getting from the hour column to the steps takes the finger across gaps
     that belong to neither, and the row grows when they open, moving
     everything under it. So once they are open only a deliberate move to a
     different hour closes them - never a wobble on the way. */
  var openRow=document.querySelector('.dp-slot.fine');
  var leavingForAnother=lbl&&openRow&&lbl.parentElement!==openRow.parentElement;
  if(openRow&&!leavingForAnother){
    for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fineB);
    return;
  }
  if(!fineB&&lbl!==_dpDrag.lastLbl){
    _dpDrag.lastLbl=lbl;
    clearTimeout(_dpDrag.holdT);
    dpCloseFine();
    // no point offering minutes in an hour that ends before the task starts
    if(lbl&&parseInt(lbl.getAttribute('data-hour'),10)*60+59>startM){
      _dpDrag.holdT=setTimeout(function(){
        if(_dpDrag&&_dpDrag.lastLbl===lbl){
          var row=lbl.parentElement;
          dpOpenFine(row.querySelector('.dp-slot'));
        }
      },DP_HOLD);
    }
  }
  for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fineB);
}
function dpClearReach(){
  var r=document.querySelectorAll('.dp-row'),i;
  for(i=0;i<r.length;i++)r[i].classList.remove('reach');
}

function dpUp(e){
  if(!_dpDrag)return;
  dragScrollStop();
  clearTimeout(_dpDrag.holdT);
  if(_dpDrag.mode==='end'){
    var t=dpFind(_dpDrag.id);
    var fb=dpHitFine(e.clientX,e.clientY),lb=dpHitHourLabel(e.clientX,e.clientY);
    var mins=fb?parseInt(fb.getAttribute('data-hour'),10)*60+parseInt(fb.getAttribute('data-min'),10)
               :(lb?parseInt(lb.getAttribute('data-hour'),10)*60:null);
    try{_dpDrag.g.remove();}catch(err){}
    if(_dpDrag.src)_dpDrag.src.style.opacity='';
    window.removeEventListener('pointermove',dpMove);
    window.removeEventListener('pointerup',dpUp);
    window.removeEventListener('pointercancel',dpUp);
    var eid=_dpDrag.id;_dpDrag=null;
    dpCloseFine();dpClearReach();
    // an end at or before the start is no end at all
    if(mins!==null&&t&&mins>dpMins(t))dpSetEnd(eid,mins);
    else renderPlanDay();
    return;
  }
  // A release on an opened five-minute step wins over the hour behind it.
  var fine=dpHitFine(e.clientX,e.clientY);
  var fineH=fine?parseInt(fine.getAttribute('data-hour'),10):null;
  var fineM=fine?parseInt(fine.getAttribute('data-min'),10):0;
  dpCloseFine();
  var hit=dpHitSlot(e.clientX,e.clientY);
  var onPool=!hit&&!fine&&dpOverPools(e.clientX,e.clientY);
  try{_dpDrag.g.remove();}catch(err){}
  if(_dpDrag.src)_dpDrag.src.style.opacity='';
  window.removeEventListener('pointermove',dpMove);
  window.removeEventListener('pointerup',dpUp);
  window.removeEventListener('pointercancel',dpUp);
  var id=_dpDrag.id,moved=_dpDrag.moved,lib=_dpDrag.lib,swiped=_dpDrag.swiping;
  _dpDrag=null;
  if(swiped&&!lib){
    var ft=dpFind(id);
    if(ft&&ft.src==='day')dpDel(id);else dpAssign(id,null,0);
    return;
  }
  if(lib){
    if(moved&&fine)dpFromLib(lib,fineH,fineM);
    else if(moved&&hit)dpFromLib(lib,parseInt(hit.getAttribute('data-hour'),10),0);
    else if(moved&&onPool)dpFromLib(lib,null,0);
    else renderPlanDay();
    return;
  }
  if(!moved){dpOpenDetail(id);return;}          // a tap opens the task
  if(fine)dpAssign(id,fineH,fineM);
  else if(hit)dpAssign(id,parseInt(hit.getAttribute('data-hour'),10),0);
  else if(onPool)dpAssign(id,null);
  else renderPlanDay();
}

/* ── SWIPE LEFT TO REMOVE ──
   A flick to the left, mostly sideways, is not somebody aiming at a slot.
   Past the threshold the drag turns into a removal and says which kind it is:
   a task that belongs to this screen is deleted, one shown here but owned by
   the week or the month only loses its place - deleting someone else's record
   from a screen that is merely displaying it would be wrong. */
/* The strip the swipe aims at. One element for all three planners, built on
   first use. Hiding is wired to pointerup/pointercancel in the capture phase
   rather than to each planner's own release path, so no exit - a drop, a
   cancel, a gesture the browser takes over - can leave it stranded on screen. */
var _trash=null;
function trashBar(){
  if(_trash)return _trash;
  _trash=document.createElement('div');
  _trash.className='swipe-trash';
  _trash.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 4.2h4"/>'+
    '<path d="M6.2 7l.9 12.1A1.9 1.9 0 0 0 9 21h6a1.9 1.9 0 0 0 1.9-1.9L17.8 7"/>'+
    '<path d="M10 10.8v6.2"/><path d="M14 10.8v6.2"/></svg><b></b>';
  document.body.appendChild(_trash);
  return _trash;
}
function trashShow(){var t=trashBar();t.className='swipe-trash on';t.lastChild.textContent='';}
function trashArm(on,label){
  var t=trashBar();
  if(t.className.indexOf('on')<0)return;
  var keep=!!label&&label!=='מחק';
  t.className='swipe-trash on'+(keep?' keep':'')+(on?' hot':'');
  t.lastChild.textContent=on?(label||'מחק'):'';
}
function trashHide(){if(_trash)_trash.className='swipe-trash';}
window.addEventListener('pointerup',trashHide,true);
window.addEventListener('pointercancel',trashHide,true);
var SWIPE_X=62,SWIPE_Y=34,TRASH_W=56;
function overTrash(e){
  var t=document.querySelector('.swipe-trash');
  if(!t||!t.classList.contains('on')||t.classList.contains('hidden'))return false;
  // anywhere on the dot, plus a ring of slack around it - a thumb is wider
  // than what it is aiming at
  var r=t.getBoundingClientRect();
  var cx=r.left+r.width/2, cy=r.top+r.height/2;
  var dx=e.clientX-cx, dy=e.clientY-cy;
  return Math.sqrt(dx*dx+dy*dy)<=(r.width/2+26);
}
function swipeArmed(d,e){
  if(d.mode==='end')return false;
  // over the strip is a delete no matter how the finger travelled there
  if(overTrash(e))return true;
  // and a flat flick leftwards still is, without having to reach the edge
  return (d.sx-e.clientX)>SWIPE_X&&Math.abs(e.clientY-d.sy)<SWIPE_Y;
}
function swipeMark(d,on,label){
  if(d.swiping===on)return;
  d.swiping=on;
  d.g.classList.toggle('swipe-del',on);
  d.g.setAttribute('data-swipe',on?(label||'מחק'):'');
  trashArm(on,label);
}

/* ── DRAG-EDGE SCROLLING ──
   Everything is written at the bottom of these screens and most of the grid is
   above the fold, so without this the early hours simply cannot be reached: a
   finger that leaves the viewport has nowhere to drop. Holding the drag near
   the top or bottom edge scrolls the page under it, faster the closer to the
   edge, and the hit test re-runs on every tick so the highlight keeps up. */
var _dragScroll=null,DRAG_EDGE=95;
function dragEdgeScroll(x,y,onTick){
  var top=y<DRAG_EDGE,bot=y>window.innerHeight-DRAG_EDGE;
  if(!top&&!bot){dragScrollStop();return;}
  var dir=top?-1:1;
  if(_dragScroll){_dragScroll.x=x;_dragScroll.y=y;_dragScroll.dir=dir;return;}
  _dragScroll={x:x,y:y,dir:dir,fn:onTick};
  _dragScroll.t=setInterval(function(){
    var s=_dragScroll;
    if(!s){return;}
    var d=s.dir<0?(DRAG_EDGE-s.y):(s.y-(window.innerHeight-DRAG_EDGE));
    var v=Math.max(4,Math.min(24,Math.round(d/3)));
    var before=window.scrollY;
    window.scrollBy(0,s.dir*v);
    if(window.scrollY===before)return;          // already at the end
    if(s.fn)s.fn({clientX:s.x,clientY:s.y});
  },16);
}
function dragScrollStop(){
  if(_dragScroll){clearInterval(_dragScroll.t);_dragScroll=null;}
}

/* ── RECURRING TASKS ──
   A shelf of tasks you keep needing, the way the meal library works: written
   once, then dragged straight onto a day, an hour or a date. Dragging one
   makes a copy - the saved task stays on the shelf - so the same shelf serves
   the day, the week and the month. */
var _tlOpen=false;
function loadTaskLib(){
  try{var x=localStorage.getItem('task_lib');var a=x?JSON.parse(x):null;
    return Array.isArray(a)?a:[];}catch(e){return[];}
}
function saveTaskLib(a){try{localStorage.setItem('task_lib',JSON.stringify(a));}catch(e){}}
function taskLibFind(id){
  var l=loadTaskLib(),i;
  for(i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function taskLibAdd(text,color){
  text=(text||'').trim();
  if(!text)return false;
  var l=loadTaskLib(),i;
  for(i=0;i<l.length;i++)if(l[i].w===text)return false;   // already on the shelf
  l.push({id:'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),w:text,c:color||'lav'});
  saveTaskLib(l);
  return true;
}
function taskLibAddFromInput(){
  var el=document.getElementById('tl-in');
  if(!el||!el.value.trim())return;
  taskLibAdd(el.value.trim(),'lav');

  setTimeout(function(){var e=document.getElementById('tl-in');if(e)e.focus();},40);
}
function taskLibSave(text,color){

}
function taskLibDel(id){
  var l=loadTaskLib(),out=[],i;
  for(i=0;i<l.length;i++)if(l[i].id!==id)out.push(l[i]);
  saveTaskLib(out);planRerender();
}
function planRerender(){

/* ── MONTHLY PLANNING ──
   The month as a calendar, and a pool of what you want it to hold. Same
   mechanics as the week: write it with no date, drag it onto one, colour it,
   open it for details.

   It flows downward like everything else here. A month task landing on a date
   shows up in that day's grid, where it can be given an hour - and that hour
   is stored on the day, never written back. Nothing written on a day or in a
   week ever climbs into the month. */
var _moMonth=null,_moNewColor='lav',_moPick='',_moDrag=null;
var MO_NAMES=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

/* ── THE JOURNAL ──
   A page a day with nothing on it. סיום יום asks questions; this asks
   nothing, which is the point - some things do not arrive as answers to
   anything, and having to pick a field to put them in is enough friction to
   lose them.

   One key per day, written as you type, so nothing is ever lost to a forgotten
   save. Days you never opened leave no key behind: an empty entry is deleted
   rather than stored, so the list of past days is the days you actually wrote
   on and not every day since you installed the app.

   The search is the reason it is worth keeping at all. A year of pages you
   cannot look through is a drawer, not a journal. */
var JRNL_PRE='jrnl_';
var _jrnlDate='',_jrnlQ='',_jrnlSaveT=null;
function jrnlKey(d){return JRNL_PRE+d;}
function loadJournal(d){
  try{return localStorage.getItem(jrnlKey(d))||'';}catch(e){return '';}
}
function saveJournal(d,txt){
  try{
    if(txt&&txt.trim())localStorage.setItem(jrnlKey(d),txt);
    else localStorage.removeItem(jrnlKey(d));
  }catch(e){}
}
// every day that has something written on it, newest first
function journalDays(){
  var out=[],i,k;
  try{
    for(i=0;i<localStorage.length;i++){
      k=localStorage.key(i);
      if(k&&k.indexOf(JRNL_PRE)===0){
        var d=k.slice(JRNL_PRE.length);
        if(/^\d{4}-\d{2}-\d{2}$/.test(d))out.push(d);
      }
    }
  }catch(e){}
  out.sort();out.reverse();
  return out;
}
function jrnlType(el){
  var d=_jrnlDate,v=el.value;
  clearTimeout(_jrnlSaveT);
  _jrnlSaveT=setTimeout(function(){
    saveJournal(d,v);
    var m=document.getElementById('jrnl-saved');
    if(m){m.style.opacity='1';setTimeout(function(){m.style.opacity='0';},1400);}
  },450);
}
function jrnlFlush(){
  clearTimeout(_jrnlSaveT);
  var el=document.getElementById('jrnl-text');
  if(el&&_jrnlDate)saveJournal(_jrnlDate,el.value);
}
function jrnlGo(d){jrnlFlush();_jrnlDate=d;_jrnlQ='';renderJournal();window.scrollTo(0,0);}
function jrnlShift(n){
  jrnlFlush();
  // noon, like every other date key here, so a timezone cannot shift the day
  var dt=new Date(_jrnlDate+'T12:00:00');
  dt.setDate(dt.getDate()+n);
  _jrnlDate=dt.toISOString().slice(0,10);
  renderJournal();
}
function jrnlSearch(v){
  _jrnlQ=v;
  var box=document.getElementById('jrnl-results');
  if(box)box.innerHTML=jrnlResultsHTML();
}
// a window of text around the hit, so a result is recognisable without opening
function jrnlSnippet(txt,q){
  var at=txt.toLowerCase().indexOf(q.toLowerCase());
  if(at<0)return esc(txt.slice(0,90));
  var from=Math.max(0,at-34),to=Math.min(txt.length,at+q.length+56);
  return (from>0?'…':'')+esc(txt.slice(from,at))+
         '<mark class="jrnl-hit">'+esc(txt.substr(at,q.length))+'</mark>'+
         esc(txt.slice(at+q.length,to))+(to<txt.length?'…':'');
}
function jrnlResultsHTML(){
  var days=journalDays(),i,txt,h='';
  var q=(_jrnlQ||'').trim();
  if(!q){
    if(!days.length)return '<div class="jrnl-empty">עוד לא כתבת כלום. הדף למעלה מחכה.</div>';
    h+='<div class="jrnl-lbl">'+days.length+' '+(days.length===1?'יום':'ימים')+' שכתבת בהם</div>';
    for(i=0;i<days.length&&i<60;i++){
      txt=loadJournal(days[i]);
      h+=jrnlRow(days[i],esc(txt.slice(0,90))+(txt.length>90?'…':''));
    }
    return h;
  }
  var hits=[];
  for(i=0;i<days.length;i++){
    txt=loadJournal(days[i]);
    if(txt.toLowerCase().indexOf(q.toLowerCase())>=0)hits.push([days[i],txt]);
  }
  if(!hits.length)return '<div class="jrnl-empty">לא מצאתי &quot;'+esc(q)+'&quot; בשום יום.</div>';
  h+='<div class="jrnl-lbl">'+hits.length+' '+(hits.length===1?'יום':'ימים')+' עם &quot;'+esc(q)+'&quot;</div>';
  for(i=0;i<hits.length;i++)h+=jrnlRow(hits[i][0],jrnlSnippet(hits[i][1],q));
  return h;
}
function jrnlRow(d,inner){
  var dt=new Date(d+'T12:00:00');

         '<div class="jrnl-when">'+when+(d===todayStr()?' · היום':'')+'</div>'+
         '<div class="jrnl-prev">'+inner+'</div></button>';
}
function renderJournal(){
  if(!_jrnlDate)_jrnlDate=todayStr();

  h+='<div class="jrnl-saved" id="jrnl-saved">נשמר</div>';

  h+='<div class="jrnl-srch"><input class="jrnl-in" id="jrnl-q" type="search" placeholder="חפש מילה בכל מה שכתבת…" value="'+esc(_jrnlQ)+'" oninput="jrnlSearch(this.value)"></div>';
  h+='<div id="jrnl-results">'+jrnlResultsHTML()+'</div>';
  document.getElementById('content').innerHTML=h;

function moFirst(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(1);return x;}
function moKey(m){return 'mplan_'+m.getFullYear()+'-'+(m.getMonth()<9?'0':'')+(m.getMonth()+1);}
function loadMonth(m){

function saveMonth(m,o){planPush(moKey(m));try{localStorage.setItem(moKey(m),JSON.stringify(o));}catch(e){}}

function moAssign(id,date){
  var mo=loadMonth(_moMonth),i;
  for(i=0;i<mo.tasks.length;i++)if(mo.tasks[i].id===id)mo.tasks[i].d=date||'';
  saveMonth(_moMonth,mo);renderPlanMonth();
}
function moFromLib(libId,date){
  var t=taskLibFind(libId);if(!t)return;
  var mo=loadMonth(_moMonth);
  mo.tasks.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                 w:t.w,d:date||'',c:t.c||'lav'});
  saveMonth(_moMonth,mo);renderPlanMonth();
}
function moDel(id){
  var mo=loadMonth(_moMonth),out=[],i;
  for(i=0;i<mo.tasks.length;i++)if(mo.tasks[i].id!==id)out.push(mo.tasks[i]);
  mo.tasks=out;saveMonth(_moMonth,mo);renderPlanMonth();
}
function moPick(id){_moPick=(_moPick===id?'':id);renderPlanMonth();}
function moSetColor(id,k){
  var mo=loadMonth(_moMonth),i;

/* ── the drag ── */
function moDown(e){
  var el=e.target.closest?e.target.closest('[data-task],[data-lib]'):null;
  if(!el)return;
  if(e.target.closest('button'))return;
  var r=el.getBoundingClientRect();
  var g=el.cloneNode(true);
  g.className='wk-task wk-ghost';
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  el.style.opacity='.3';
  _moDrag={id:el.getAttribute('data-task'),lib:el.getAttribute('data-lib')||'',g:g,src:el,
           dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,sx:e.clientX,sy:e.clientY,mode:'move'};
  if(!_moDrag.lib)trashShow();
  window.addEventListener('pointermove',moMove);
  window.addEventListener('pointerup',moUp);
  window.addEventListener('pointercancel',moUp);
  e.preventDefault();
}
function moHitCell(x,y){
  var c=document.querySelectorAll('.mo-cell[data-date]'),i,r;
  for(i=0;i<c.length;i++){
    r=c[i].getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return c[i];
  }
  return null;
}
function moOverPool(x,y){
  var p=document.getElementById('mo-pool');
  if(!p)return false;
  var r=p.getBoundingClientRect();
  return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}
function moMove(e){
  if(!_moDrag)return;
  _moDrag.moved=true;
  _moDrag.g.style.left=(e.clientX-_moDrag.dx)+'px';
  _moDrag.g.style.top=(e.clientY-_moDrag.dy)+'px';
  dragEdgeScroll(e.clientX,e.clientY,moMove);
  if(!_moDrag.lib)swipeMark(_moDrag,swipeArmed(_moDrag,e),'מחק');
  var hit=moHitCell(e.clientX,e.clientY),c=document.querySelectorAll('.mo-cell'),i;
  for(i=0;i<c.length;i++)c[i].classList.toggle('hot',c[i]===hit);
}
function moUp(e){
  if(!_moDrag)return;
  dragScrollStop();
  var hit=moHitCell(e.clientX,e.clientY);
  var onPool=!hit&&moOverPool(e.clientX,e.clientY);
  try{_moDrag.g.remove();}catch(err){}
  if(_moDrag.src)_moDrag.src.style.opacity='';
  window.removeEventListener('pointermove',moMove);
  window.removeEventListener('pointerup',moUp);
  window.removeEventListener('pointercancel',moUp);
  var id=_moDrag.id,moved=_moDrag.moved,lib=_moDrag.lib,swiped=_moDrag.swiping;
  _moDrag=null;
  if(swiped&&!lib){moDel(id);return;}
  if(!moved)return;
  if(lib){if(hit)moFromLib(lib,hit.getAttribute('data-date'));else renderPlanMonth();return;}
  if(hit)moAssign(id,hit.getAttribute('data-date'));
  else if(onPool)moAssign(id,'');
  else renderPlanMonth();
}

/* ── מפת הכוכבים ──────────────────────────────────────────────────────────
   A goal drawn as a constellation: the goal itself as the north star, its
   milestones as the stars below it, and the steps of each milestone as the
   small stars around it. Threads between them light up as things get done.

   THE DATA. The app already had goals two levels deep - a goal and a flat
   list of subs - and this needs three. So a sub IS a milestone, and gains a
   steps array:

     Goal      {id,title,why,horizon,targetDate, subs:Milestone[]}
     Milestone {id,text,done, steps:Step[]}
     Step      {id,text,done,active}

   A milestone saved before today simply has no steps, which reads as a
   milestone with none - so every goal already written keeps working and
   nothing had to be migrated. Milestones are addressed by index rather than
   id because that is what the existing array supports; ids are written on
   new items so the model is honest going forward.

   THE STACK. No canvas, no React, no animation library. SVG because the
   labels have to be real text (Hebrew, selectable, and it is RTL), because
   hit-testing a circle is free, and because the whole map is one element the
   browser can transform for pan and zoom without anything re-rendering.
   Completion states are CSS classes, so the glow and the pulse are the
   compositor's problem rather than JavaScript's. */

var _cmGoal=-1, _cmFocus=-1, _cmCam={x:0,y:0,s:1}, _cmDrag=null, _cmPinch=null, _cmCelebrate=0;

function cmMilestones(g){
  var subs=(g&&g.subs)||[],i;
  for(i=0;i<subs.length;i++)if(!subs[i].steps)subs[i].steps=[];
  return subs;
}
function cmStepsDone(m){
  var st=m.steps||[],n=0,i;
  for(i=0;i<st.length;i++)if(st[i].done)n++;
  return n;
}
/* A milestone with steps is finished when its steps are; one without is
   finished when it is ticked. Two rules rather than one, because the second
   is every milestone that existed before this screen did. */
function cmMileDone(m){
  return (m.steps&&m.steps.length)?cmStepsDone(m)===m.steps.length:!!m.done;
}
function cmGoalPct(g){
  var ms=cmMilestones(g),i,tot=0,got=0;
  for(i=0;i<ms.length;i++){
    var st=ms[i].steps||[];
    if(st.length){tot+=st.length;got+=cmStepsDone(ms[i]);}
    else{tot+=1;if(ms[i].done)got+=1;}
  }
  return tot?Math.round(got/tot*100):0;
}

/* ── LAYOUT ──
   Milestones spread along a shallow arc under the goal, first on the RIGHT
   because the app is Hebrew and that is where reading starts. Each one's
   steps fan out beneath it. The whole thing is measured afterwards and the
   viewBox fitted to it, so a goal with two milestones and one with nine both
   arrive filling the screen instead of one being a speck. */
function cmLayout(g){
  var ms=cmMilestones(g),n=ms.length,i,j;
  var nodes=[],links=[];
  var cx=0,goalY=0;
  nodes.push({k:'g',i:-1,x:cx,y:goalY,r:30,t:g.title,lit:cmGoalPct(g)===100});

  var spread=Math.max(230,Math.min(300,760/Math.max(1,n-1)))*(n-1);
  var mileY=goalY+330;
  for(i=0;i<n;i++){
    var t=(n===1)?0.5:i/(n-1);
    var mx=cx+(spread/2)-spread*t;                 // t=0 sits on the right
    var my=mileY-Math.sin(t*Math.PI)*54;           // a shallow arc, not a row
    var mDone=cmMileDone(ms[i]);
    nodes.push({k:'m',i:i,x:mx,y:my,r:19,t:ms[i].text,lit:mDone});
    links.push({x1:cx,y1:goalY,x2:mx,y2:my,lit:mDone,w:2.4});

    var st=ms[i].steps||[];
    for(j=0;j<st.length;j++){
      var u=(st.length===1)?0.5:j/(st.length-1);
      var a=Math.PI*(0.18+0.64*u);
      var R=(st.length>4?235:195);   // wide enough that adjacent labels clear
      var sx=mx+Math.cos(a)*R;
      var sy=my+Math.sin(a)*R;
      nodes.push({k:'s',i:i,j:j,x:sx,y:sy,r:11,t:st[j].text,lit:!!st[j].done,act:!!st[j].active});
      links.push({x1:mx,y1:my,x2:sx,y2:sy,lit:!!st[j].done,w:1.3});
    }
  }
  // fit the box to whatever was drawn, with room for the labels
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(i=0;i<nodes.length;i++){
    var p=nodes[i];
    if(p.x-p.r<minx)minx=p.x-p.r;
    if(p.x+p.r>maxx)maxx=p.x+p.r;
    if(p.y-p.r<miny)miny=p.y-p.r;
    if(p.y+p.r>maxy)maxy=p.y+p.r;
  }
  var padX=210,padT=90,padB=120;
  return {nodes:nodes,links:links,
          vb:[minx-padX,miny-padT,(maxx-minx)+padX*2,(maxy-miny)+padT+padB]};
}

/* ── WRITING IT DOWN ──────────────────────────────────────────────────────
   The constellation is for looking at what you are doing. This is for
   deciding it, and they are the same data seen twice.

   Writing came second here and should have come first: the map could only
   be filled through prompt() dialogs, one line at a time, which is no way to
   think a goal through. Breaking something big into middle-sized pieces and
   those into small ones is an outline, and an outline wants to be a page you
   can see all of and rewrite in place.

   So: a text side where the whole shape is visible and editable, a star side
   where it is a sky, and one switch between them. Nothing is duplicated -
   both read and write the same goal.

   Text fields save on blur rather than on every keystroke. Saving per
   keystroke means re-rendering per keystroke, which takes the caret away
   from whoever is typing - the classic way this kind of editor breaks. */
var _cmView='text';

function cmSwitch(v){_cmView=v;cmRender();}

function cmTextHTML(g){
  var ms=cmMilestones(g),i,j,h='';

  h+='<div class="cx-sec"><div class="cx-lab">המטרה הגדולה</div>';
  h+='<input class="cx-big" value="'+esc(g.title||'')+'" placeholder="מה אתה רוצה להשיג?" onchange="cmSetTitle(this.value)">';
  h+='<input class="cx-why" value="'+esc(g.why||'')+'" placeholder="ולמה זה חשוב לך?" onchange="cmSetWhy(this.value)">';
  if(g.targetDate)h+='<div class="cx-date">יעד: '+esc(g.targetDate)+'</div>';
  h+='</div>';

  h+='<div class="cx-lab cx-lab2">מטרות בדרך</div>';
  if(!ms.length)
    h+='<div class="cx-none">פרק את המטרה הגדולה לכמה מטרות בינוניות. כל אחת מהן היא כוכב במפה.</div>';

  for(i=0;i<ms.length;i++){
    var st=ms[i].steps||[],mDone=cmMileDone(ms[i]);
    h+='<div class="cx-m'+(mDone?' done':'')+'">';
    h+='<div class="cx-mrow">';
    h+='<button class="cx-tick'+(mDone?' on':'')+'" onclick="cmToggleMile('+i+')">'+(mDone?'&#10003;':'')+'</button>';
    h+='<input class="cx-mt" value="'+esc(ms[i].text||'')+'" placeholder="מטרה בינונית" onchange="cmSetMile('+i+',this.value)">';
    h+='<button class="cx-del" onclick="cmDelMile('+i+')" aria-label="מחק">&times;</button>';
    h+='</div>';
    if(st.length){
      h+='<div class="cx-steps">';
      for(j=0;j<st.length;j++){
        h+='<div class="cx-srow">';
        h+='<button class="cx-tick sm'+(st[j].done?' on':'')+'" onclick="cmToggleStep('+i+','+j+')">'+(st[j].done?'&#10003;':'')+'</button>';
        h+='<input class="cx-st'+(st[j].done?' done':'')+'" value="'+esc(st[j].text||'')+'" placeholder="צעד קטן" onchange="cmSetStep('+i+','+j+',this.value)">';
        h+='<button class="cx-del" onclick="cmDelStep('+i+','+j+')" aria-label="מחק">&times;</button>';
        h+='</div>';
      }
      h+='</div>';
    }
    h+='<button class="cx-adds" onclick="cmAddStep('+i+')">+ צעד קטן</button>';
    h+='</div>';
  }
  h+='<button class="cx-addm" onclick="cmAddMile()">+ מטרה בדרך</button>';
  // the counting rule is not obvious and people will wonder
  h+='<div class="cx-note">מטרה בינונית שיש לה צעדים מסומנת לבד כשכל הצעדים שלה נעשו. אחת בלי צעדים — מסמנים ידנית.</div>';
  return h;
}

function cmGoal(){var goals=loadGoals();return {goals:goals,g:goals[_cmGoal]};}
function cmSetTitle(v){var o=cmGoal();if(!o.g)return;o.g.title=String(v||'').trim();saveGoals(o.goals);cmHead();}
function cmSetWhy(v){var o=cmGoal();if(!o.g)return;o.g.why=String(v||'').trim();saveGoals(o.goals);}
function cmSetMile(i,v){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[i])return;
  ms[i].text=String(v||'').trim();saveGoals(o.goals);
}
function cmSetStep(i,j,v){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[i]||!ms[i].steps[j])return;
  ms[i].steps[j].text=String(v||'').trim();saveGoals(o.goals);
}
function cmToggleMile(i){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g),m=ms[i];if(!m)return;
  /* Ticking a milestone that has steps has to mean something for the steps,
     or the two would disagree with each other on screen. It marks them all,
     which is what "this is done" means. */
  if(m.steps&&m.steps.length){
    var all=cmMileDone(m),k;
    for(k=0;k<m.steps.length;k++)m.steps[k].done=!all;
  } else m.done=!m.done;
  saveGoals(o.goals);
  if(cmMileDone(m))cmCheer(cmGoalPct(o.g)===100?2:1);
  cmRender();
}
function cmToggleStep(i,j){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[i]||!ms[i].steps[j])return;
  ms[i].steps[j].done=!ms[i].steps[j].done;
  saveGoals(o.goals);
  if(ms[i].steps[j].done&&cmMileDone(ms[i]))cmCheer(cmGoalPct(o.g)===100?2:1);
  cmRender();
}
function cmDelMile(i){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[i])return;
  var st=(ms[i].steps||[]).length;
  if(!confirm('למחוק את "'+(ms[i].text||'המטרה')+'"'+(st?' ואת '+st+' הצעדים שלה':'')+'?'))return;
  ms.splice(i,1);saveGoals(o.goals);
  if(_cmFocus===i)_cmFocus=-1;else if(_cmFocus>i)_cmFocus--;
  cmRender();
}
function cmDelStep(i,j){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[i])return;
  ms[i].steps.splice(j,1);saveGoals(o.goals);cmRender();
}
/* Adding writes an empty row and puts the caret in it, rather than asking in
   a dialog box. You are writing an outline; the place to type is the outline. */
function cmAddMile(){
  var o=cmGoal();if(!o.g)return;
  if(!o.g.subs)o.g.subs=[];
  o.g.subs.push({id:'m'+Date.now().toString(36),text:'',done:false,steps:[]});
  saveGoals(o.goals);
  _cmView='text';cmRender();
  cmFocusLast('.cx-mt');
}
function cmAddStep(mi){
  var o=cmGoal();if(!o.g)return;
  var ms=cmMilestones(o.g);if(!ms[mi])return;
  ms[mi].steps.push({id:'s'+Date.now().toString(36),text:'',done:false,active:false});
  saveGoals(o.goals);
  _cmView='text';cmRender();
  var rows=document.querySelectorAll('.cx-m')[mi];
  if(rows){
    var ins=rows.querySelectorAll('.cx-st');
    if(ins.length)cmCaret(ins[ins.length-1]);
  }
}
function cmFocusLast(sel){
  var els=document.querySelectorAll(sel);
  if(els.length)cmCaret(els[els.length-1]);
}
function cmCaret(el){
  setTimeout(function(){try{el.focus();el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},40);
}
// the percentage in the header moves without redrawing what is being typed in
function cmHead(){
  var o=cmGoal();if(!o.g)return;
  var el=document.querySelector('.cm-pct');
  if(el)el.textContent=cmGoalPct(o.g)+'%';
}
function cmOpen(idx){
  _cmGoal=idx;_cmFocus=-1;_cmCam={x:0,y:0,s:1};
  _goalsView='map';renderGoals();
}
function cmClose(){_goalsView='view-goal';renderGoals();}

function cmRender(){
  var goals=loadGoals(),g=goals[_cmGoal];
  if(!g){_goalsView='home';renderGoals();return;}
  var pct=cmGoalPct(g);

  var h='<div class="cm-wrap'+(_cmView==='text'?' text':'')+'">';
  h+='<div class="cm-top">';
  h+='<button class="cm-back" onclick="cmClose()">&#8249; חזרה</button>';
  h+='<div class="cx-tabs">'+
     '<button class="cx-tab'+(_cmView==='text'?' on':'')+'" onclick="cmSwitch(&quot;text&quot;)">כתיבה</button>'+
     '<button class="cx-tab'+(_cmView==='stars'?' on':'')+'" onclick="cmSwitch(&quot;stars&quot;)">&#10022; כוכבים</button>'+
     '</div>';
  h+='<div class="cm-pct">'+pct+'%</div>';
  h+='</div>';

  if(_cmView==='text'){
    h+='<div class="cx-body">'+cmTextHTML(g)+'</div></div>';
    document.getElementById('content').innerHTML=h;
    return;
  }

  var L=cmLayout(g),i;
  h+='<div class="cm-sky" id="cm-sky">';
  h+='<svg id="cm-svg" viewBox="'+L.vb.join(' ')+'" preserveAspectRatio="xMidYMid meet">';
  h+='<defs>'+
     '<radialGradient id="cmGlow"><stop offset="0%" stop-color="#fff" stop-opacity=".95"/>'+
     '<stop offset="45%" stop-color="#cbb9f5" stop-opacity=".45"/>'+
     '<stop offset="100%" stop-color="#cbb9f5" stop-opacity="0"/></radialGradient>'+
     '<radialGradient id="cmGlowOn"><stop offset="0%" stop-color="#fff" stop-opacity="1"/>'+
     '<stop offset="40%" stop-color="#ffe9a8" stop-opacity=".7"/>'+
     '<stop offset="100%" stop-color="#ffcf5c" stop-opacity="0"/></radialGradient>'+
     '</defs>';
  h+='<g id="cm-cam">';

  // threads first, so the stars sit on top of them
  for(i=0;i<L.links.length;i++){
    var k=L.links[i];
    h+='<line class="cm-th'+(k.lit?' on':'')+'" x1="'+k.x1+'" y1="'+k.y1+'" x2="'+k.x2+'" y2="'+k.y2+'" stroke-width="'+k.w+'"/>';
  }
  for(i=0;i<L.nodes.length;i++){
    var p=L.nodes[i];
    var dim=(_cmFocus>=0&&p.k!=='g'&&p.i!==_cmFocus);
    var cls='cm-n cm-'+p.k+(p.lit?' on':'')+(dim?' dim':'')+(p.act?' act':'');
    // built plainly: the three shapes of this call are worth seeing at a glance
    var call=(p.k==='g')?'cmTap(&quot;g&quot;,-1)'
            :(p.k==='m')?('cmTap(&quot;m&quot;,'+p.i+')')
            :('cmTap(&quot;s&quot;,'+p.i+','+p.j+')');
    h+='<g class="'+cls+'" onclick="'+call+'">';
    h+='<circle class="cm-halo" cx="'+p.x+'" cy="'+p.y+'" r="'+(p.r*2.6)+'" fill="url(#'+(p.lit?'cmGlowOn':'cmGlow')+')"/>';
    h+=cmStarPath(p.x,p.y,p.r);
    // a generous invisible target: the drawn star is small, the finger is not
    h+='<circle class="cm-hit" cx="'+p.x+'" cy="'+p.y+'" r="'+Math.max(30,p.r*1.9)+'"/>';
    /* A milestone's label goes ABOVE it, because directly below it is where
       its own steps fan out - the two were landing on each other. Goals and
       steps have nothing under them, so their labels hang below as usual. */
    var ly=(p.k==='m')?(p.y-p.r-14):(p.y+p.r+26);
    h+='<text class="cm-t" x="'+p.x+'" y="'+ly+'" text-anchor="middle">'+esc(cmClip(p.t,p.k))+'</text>';
    h+='</g>';
  }
  h+='</g></svg>';
  if(_cmCelebrate)h+='<div class="cm-cheer">'+esc(_cmCelebrate===2?'המטרה הושלמה':'אבן דרך הושלמה')+'</div>';
  h+='</div>';

  h+='<div class="cm-bar">';
  if(_cmFocus>=0){
    var mm=cmMilestones(g)[_cmFocus];
    h+='<div class="cm-foc"><span>'+esc(mm?mm.text:'')+'</span>'+
       '<button class="cm-x" onclick="cmFocus(-1)">&times;</button></div>';
    h+='<button class="cm-add" onclick="cmAddStep('+_cmFocus+')">+ הוסף צעד</button>';
  } else {
    h+='<div class="cm-hint">גע בכוכב כדי לסמן שהוא נעשה. גע באבן דרך כדי להתמקד בה.</div>';
    h+='<button class="cm-add" onclick="cmAddMile()">+ הוסף אבן דרך</button>';
  }
  h+='</div></div>';

  document.getElementById('content').innerHTML=h;
  cmBind();
}
// a five-pointed star, drawn rather than a font glyph so it scales cleanly
function cmStarPath(cx,cy,r){
  var pts=[],i,a,rr;
  for(i=0;i<10;i++){
    a=(Math.PI/5)*i-Math.PI/2;
    rr=(i%2===0)?r:r*0.42;
    pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));
  }
  return '<polygon class="cm-star" points="'+pts.join(' ')+'"/>';
}
function cmClip(t,k){
  var max=(k==='g')?26:(k==='m'?20:16);
  t=String(t||'');
  return t.length>max?t.slice(0,max-1)+'…':t;
}

/* ── TAPPING ── */
function cmTap(kind,i,j){
  if(_cmDrag&&_cmDrag.moved)return;      // that was a pan, not a tap
  var goals=loadGoals(),g=goals[_cmGoal];
  if(!g)return;
  if(kind==='g'){cmFocus(-1);return;}
  if(kind==='m'){
    var ms=cmMilestones(g);
    // a milestone with no steps is a thing you tick; one with steps is a place
    if(!(ms[i].steps&&ms[i].steps.length)){
      ms[i].done=!ms[i].done;
      saveGoals(goals);
      if(ms[i].done)cmCheer(cmGoalPct(g)===100?2:1);
      cmRender();return;
    }
    cmFocus(_cmFocus===i?-1:i);return;
  }
  var m=cmMilestones(g)[i],st=m.steps[j];
  st.done=!st.done;
  saveGoals(goals);
  if(st.done&&cmMileDone(m))cmCheer(cmGoalPct(g)===100?2:1);
  cmRender();
}
function cmFocus(i){_cmFocus=i;cmRender();}
function cmCheer(level){
  _cmCelebrate=level;
  setTimeout(function(){_cmCelebrate=0;if(_goalsView==='map')cmRender();},1900);
}

/* ── PAN AND PINCH ──
   The camera is one transform on one group. Nothing re-renders while a
   finger is down - the map can hold a hundred stars and still move at the
   refresh rate, because the browser is moving one element. */
function cmBind(){
  var sky=document.getElementById('cm-sky');
  if(!sky)return;
  var pts={};
  function apply(){
    var cam=document.getElementById('cm-cam');
    if(cam)cam.setAttribute('transform','translate('+_cmCam.x+' '+_cmCam.y+') scale('+_cmCam.s+')');
  }
  function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
  sky.onpointerdown=function(e){
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pts);
    if(ids.length===1){
      _cmDrag={x:e.clientX,y:e.clientY,cx:_cmCam.x,cy:_cmCam.y,moved:false};
    } else if(ids.length===2){
      var a=pts[ids[0]],b=pts[ids[1]];
      _cmPinch={d:dist(a,b),s:_cmCam.s,m:mid(a,b),cx:_cmCam.x,cy:_cmCam.y};
      _cmDrag=null;
    }
    try{sky.setPointerCapture(e.pointerId);}catch(_e){}
  };
  sky.onpointermove=function(e){
    if(!pts[e.pointerId])return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pts);
    if(ids.length>=2&&_cmPinch){
      var a=pts[ids[0]],b=pts[ids[1]];
      var k=dist(a,b)/(_cmPinch.d||1);
      _cmCam.s=Math.max(0.5,Math.min(3.2,_cmPinch.s*k));
      apply();e.preventDefault();return;
    }
    if(_cmDrag){
      var dx=e.clientX-_cmDrag.x,dy=e.clientY-_cmDrag.y;
      if(Math.abs(dx)+Math.abs(dy)>6)_cmDrag.moved=true;
      // in viewBox units, so dragging tracks the finger at any zoom
      var sc=cmScale();
      _cmCam.x=_cmDrag.cx+dx/sc;
      _cmCam.y=_cmDrag.cy+dy/sc;
      apply();e.preventDefault();
    }
  };
  sky.onpointerup=sky.onpointercancel=function(e){
    delete pts[e.pointerId];
    if(Object.keys(pts).length<2)_cmPinch=null;
    if(!Object.keys(pts).length){
      // let the click through first, then forget it was a drag
      setTimeout(function(){_cmDrag=null;},0);
    }
  };
  sky.onwheel=function(e){
    _cmCam.s=Math.max(0.5,Math.min(3.2,_cmCam.s*(e.deltaY<0?1.1:0.9)));
    apply();e.preventDefault();
  };
  apply();
}
// how many screen pixels one viewBox unit is worth right now
function cmScale(){
  var svg=document.getElementById('cm-svg');
  if(!svg)return 1;
  var vb=svg.getAttribute('viewBox').split(' ');
  var r=svg.getBoundingClientRect();
  return Math.min(r.width/Number(vb[2]),r.height/Number(vb[3]))*_cmCam.s;
}
function renderGoalsHome(){
  var goals=loadGoals();
  var h='<div style="padding-bottom:30px">';
  h+='<div style="font-size:12px;color:#a89e97;line-height:1.6;margin-bottom:20px">חלומות הם לא משאלות — הם מטרות שעוד לא הוגדרו בבירור.</div>';

  if(goals.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F3AF;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">איזה חלום אתה רוצה להגשים?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">התחל מהחלום הגדול —ופרוק אותו לצעדים קטנים.</div>';
    h+='<button onclick="_goalsView=\'edit-goal\';_goalIdx=-1;renderGoals()" style="background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ הגדר מטרה</button>';
    h+='</div>';
  } else {
    // Group by horizon
    for(var hi=0;hi<GOAL_HORIZONS.length;hi++){
      var hor=GOAL_HORIZONS[hi];
      var horGoals=goals.filter(function(g){return g.horizon===hor.id;});
      if(horGoals.length===0)continue;
      h+='<div style="font-size:10px;font-weight:800;color:'+hor.color+';letter-spacing:.1em;margin-bottom:8px;margin-top:16px">'+hor.emoji+' '+hor.label.toUpperCase()+'</div>';
      for(var gi=0;gi<horGoals.length;gi++){
        var g=horGoals[gi];var gidx=goals.indexOf(g);

        h+='<div onclick="_goalIdx='+gidx+';_goalsView=\'view-goal\';renderGoals()" style="background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(200,180,160,.1);border-right:4px solid '+hor.color+'">';
        h+='<div style="font-size:15px;font-weight:800;color:#4a4340;margin-bottom:3px">'+esc(g.title)+'</div>';
        if(g.why)h+='<div style="font-size:11px;color:#a89e97;margin-bottom:8px;line-height:1.4;font-style:italic">'+esc(g.why)+'</div>';
        if(subs.length>0){
          h+='<div style="display:flex;align-items:center;gap:8px">';
          h+='<div style="flex:1;height:5px;background:#f0ebe3;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+hor.color+';border-radius:3px;transition:width .5s"></div></div>';
          h+='<div style="font-size:10px;color:'+hor.color+';font-weight:700">'+doneSubs+'/'+subs.length+'</div>';
          h+='</div>';
        }
        // Next action
        var nextSub=subs.find(function(s){return !s.done;});
        if(nextSub)h+='<div style="margin-top:8px;font-size:11px;color:#6a6360;background:#f5f0eb;border-radius:8px;padding:5px 10px">צעד הבא: '+esc(nextSub.text)+'</div>';
        h+='<button class="cm-go" onclick="event.stopPropagation();cmOpen('+gidx+')">&#10022; מפת הכוכבים</button>';

  'חבר קרוב','חברה','בן משפחה','בת משפחה','בן זוג','בת זוג',
  'אח','אחות','אבא','אמא','סבא','סבתא','קולגה','אחר'
];
var MEMORY_TYPES=[
  {id:'note',label:'הערה'},
  {id:'memory',label:'זיכרון'},
  {id:'insight',label:'תובנה'},
  {id:'conversation',label:'שיחה'},
  {id:'important',label:'חשוב'}
];
var CONTACT_TYPES=['הודעה','שיחה','פגישה','וידאו','אחר'];


/* ── FINDING A PERSON ──
   The list was one long column in the order people happened to be added,
   which works for five and stops working somewhere around fifteen.

   Three ways in now. Search, because sometimes you know exactly who. Sorting,
   because sometimes you want the person you have not spoken to in longest.
   And grouping by where you know them from, because that is how people are
   actually filed in your head - you do not think "who was that", you think
   "the one from the gym".

   Where they are from is a field of its own rather than something buried in
   the relationship line, so it can be grouped on. The relationship stays what
   it always was: the small grey line under the name saying what they are to
   you. חדר כושר / אורון / מאמן בחדר כושר - the place, the person, the role. */
var PEOPLE_PLACES=['חדר כושר','עבודה','משפחה','לימודים','שכונה','צבא','חברים','אונליין'];
var _pplSort='recent',_pplQ='',_pplPlace='';
var PPL_SORTS=[
  {v:'recent', t:'הכי מזמן'},
  {v:'name',   t:'לפי שם'},
  {v:'place',  t:'לפי מקום'},
  {v:'added',  t:'לפי הוספה'}
];
function pplKey(s){return String(s||'').replace(/['’׳"״,.\-]/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
function pplMatch(p,q){
  if(!q)return true;
  q=pplKey(q);
  return pplKey(p.name).indexOf(q)>=0||
         pplKey(p.relationship).indexOf(q)>=0||
         pplKey(p.place).indexOf(q)>=0||
         pplKey(p.currentUpdate).indexOf(q)>=0;
}
// the list, filtered and ordered, with its original index kept so every
// existing onclick that addresses people by position still lands right
function pplOrdered(people){
  var out=[],i;
  for(i=0;i<people.length;i++)if(pplMatch(people[i],_pplQ))out.push({p:people[i],i:i});
  if(_pplSort==='name')
    out.sort(function(a,b){return String(a.p.name||'').localeCompare(String(b.p.name||''),'he');});
  else if(_pplSort==='place')
    out.sort(function(a,b){
      var ap=a.p.place||'',bp=b.p.place||'';
      if(ap===bp)return String(a.p.name||'').localeCompare(String(b.p.name||''),'he');
      if(!ap)return 1;            // people with no place sit at the end
      if(!bp)return -1;
      return ap.localeCompare(bp,'he');
    });
  else if(_pplSort==='recent')
    out.sort(function(a,b){
      // longest since you spoke first; never-spoken counts as longest of all
      var av=a.p.lastContact||0,bv=b.p.lastContact||0;
      return av-bv;
    });
  return out;
}
/* Sorted by place, the screen is a set of doors rather than one long run
   of names under headings. A place you know twelve people from is a place
   you want to walk into, not scroll past - and the tiles say how many are
   behind each one before you open it. */
function pplPlaces(people){
  var map={},faces={},order=[],i,pl;
  for(i=0;i<people.length;i++){
    if(!pplMatch(people[i],_pplQ))continue;
    pl=people[i].place||'ללא מקום';
    if(!map[pl]){map[pl]=0;faces[pl]=[];order.push(pl);}
    map[pl]++;
    // the first few of them, to show on the tile
    if(faces[pl].length<3)faces[pl].push(people[i]);
  }
  order.sort(function(a,b){
    if(a==='ללא מקום')return 1;
    if(b==='ללא מקום')return -1;
    return b>a?-1:(b<a?1:0);
  });
  return order.map(function(k){return {name:k,n:map[k],who:faces[k]};});
}
function pplOpenPlace(pl){_pplPlace=pl;renderPeople();}
function pplBackToPlaces(){_pplPlace='';renderPeople();}
function pplSetSort(v){_pplSort=v;_pplPlace='';renderPeople();}
function pplSearch(v){
  _pplQ=v;
  var box=document.getElementById('ppl-list');
  if(box)box.innerHTML=pplListHTML(loadPeople());
}

  h+='<div class="ppl-sorts">';
  for(var i=0;i<PPL_SORTS.length;i++)
    h+='<button class="ppl-sort'+(_pplSort===PPL_SORTS[i].v?' on':'')+'" onclick="pplSetSort(&quot;'+PPL_SORTS[i].v+'&quot;)">'+PPL_SORTS[i].t+'</button>';
  h+='</div></div>';
  return h;
}

function pplPlacesHTML(people){
  var pl=pplPlaces(people),h='',i;
  if(!pl.length)return '<div class="ppl-none">'+(_pplQ?'לא מצאתי אף אחד כזה.':'עוד אין כאן אף אחד.')+'</div>';
  h+='<div class="ppl-tiles">';
  // A place is the people in it, so the tile shows them - up to three faces
  // overlapping, which is enough to recognise a group by.
  for(i=0;i<pl.length;i++){
    var fh='',who=pl[i].who||[];
    for(var fi=0;fi<who.length;fi++)
      fh+='<span class="ppl-tf">'+personAvatar(who[fi],26)+'</span>';
    h+='<button class="ppl-tile" onclick="pplOpenPlace(&quot;'+esc(pl[i].name)+'&quot;)">'+
       '<span class="ppl-tfaces">'+fh+'</span>'+
       '<span class="ppl-tname">'+esc(pl[i].name)+'</span>'+
       '<span class="ppl-tn">'+pl[i].n+'</span></button>';
  }
  h+='</div>';
  return h;
}
function pplListHTML(people){
  if(_pplSort==='place'&&!_pplPlace)return pplPlacesHTML(people);
  var rows=pplOrdered(people),h='',i,lastPlace=null;
  if(_pplSort==='place'&&_pplPlace){
    rows=rows.filter(function(r){return (r.p.place||'ללא מקום')===_pplPlace;});
    h+='<button class="ppl-back" onclick="pplBackToPlaces()">&#8250; כל המקומות</button>';
    h+='<div class="ppl-grp">'+esc(_pplPlace)+'</div>';
  }
  if(!rows.length)
    return '<div class="ppl-none">'+(_pplQ?'לא מצאתי אף אחד כזה.':'עוד אין כאן אף אחד.')+'</div>';
  for(i=0;i<rows.length;i++){
    var p=rows[i].p,pi=rows[i].i;
    // grouped only when that is what you asked for; a heading over a list
    // sorted by something else would be lying about the order

    var days=daysSince(p.lastContact);
    var mems=p.memories||[];
    var lastMem=mems.length?mems[mems.length-1]:null;

/* ── A FACE ON THE NAME ──
   A list of names is a list of names. A list of faces is the people.

   The picture goes to IndexedDB like every other photo in the app, and the
   record keeps only the key - an avatar as a data URI inside people_v2 would
   put a few hundred kilobytes of image into localStorage per person, which is
   how the day photos filled it up before they were moved out.

   Nothing is written until you save. The picked image is held here as a data
   URI and only becomes a stored blob at the moment the person is saved, so
   backing out of the form leaves nothing behind. null means untouched, ''
   means take the picture off, anything else is a new one waiting. */
var _epAvatar=null;
function epReset(){_epAvatar=null;}
function epCurrentRef(){
  if(_epAvatar!==null)return _epAvatar;
  var people=loadPeople();
  return (_personIdx>=0&&people[_personIdx]&&people[_personIdx].avatar)||'';
}
function epPhotoPick(input){
  var f=input&&input.files&&input.files[0];
  if(input)input.value='';
  if(!f)return;
  showToast('מכין&hellip;');
  // 360px is more than a 48px circle can ever show, even on a dense screen
  vbScale(f,function(d){
    if(!d){showToast('לא הצלחתי לקרוא את התמונה');return;}
    _epAvatar=d;
    epPaintAvatar();
  },360);
}
function epPhotoClear(){_epAvatar='';epPaintAvatar();}
function epPaintAvatar(){
  var box=document.getElementById('ep-av');
  if(!box)return;
  box.innerHTML=epAvatarInner();
  hydratePhotos(box);
}
function epAvatarInner(){
  var ref=epCurrentRef(),nm='';
  var people=loadPeople();
  if(_personIdx>=0&&people[_personIdx])nm=people[_personIdx].name||'';
  var face=ref
    ? photoImg(ref,'class="ep-av-img"')
    : '<div class="ep-av-none">'+esc((nm||'?').charAt(0))+'</div>';
  return face+
    '<div class="ep-av-btns">'+
    '<label class="ep-av-b">'+(ref?'החלף תמונה':'הוסף תמונה')+
    '<input type="file" accept="image/*" style="display:none" onchange="epPhotoPick(this)"></label>'+
    (ref?'<button type="button" class="ep-av-x" onclick="epPhotoClear()">הסר</button>':'')+
    '</div>';
}
function epAvatarHTML(){
  return '<div class="ep-av" id="ep-av">'+epAvatarInner()+'</div>';
}
/* Called when the person is saved. The blob is written first, because if that
   fails there is no point recording a key that points at nothing - and the
   picture it replaces is only deleted once the new one is safely in. */
function epCommitAvatar(existing,cb){
  var oldRef=existing.avatar||'';
  if(_epAvatar===null)return cb(oldRef);
  if(_epAvatar===''){
    if(isPhotoKey(oldRef))photoDel(oldRef);
    return cb('');
  }
  photoPut(_epAvatar).then(function(key){
    if(!key){showToast('התמונה לא נשמרה, השאר את הקודמת');return cb(oldRef);}
    if(isPhotoKey(oldRef)&&oldRef!==key)photoDel(oldRef);
    cb(key);
  },function(){cb(oldRef);});
}
function personAvatar(p,size){
  var initials=(p.name||'?').charAt(0);
  // photoImg tells a stored key from a picture written before the store
  // existed, and hands the first one to hydratePhotos to fill in
  if(p.avatar)return photoImg(p.avatar,'style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex-shrink:0"');
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:linear-gradient(135deg,#f3b9a8,#e08a72);display:flex;align-items:center;justify-content:center;font-size:'+(size*0.38)+'px;font-weight:800;color:#fff;flex-shrink:0">'+initials+'</div>';
}

  return m[type]||'&#x1F4C5;';
}

function selectFreq(val){
  var inp=document.getElementById('ep-freq');
  if(inp)inp.value=val;
  var freqs=['none','occasionally','monthly','biweekly','weekly','daily'];
  for(var i=0;i<freqs.length;i++){
    var btn=document.getElementById('freq-btn-'+freqs[i]);
    if(!btn)continue;
    if(freqs[i]===val){btn.style.background='linear-gradient(135deg,#c9bce0,#a690cf)';btn.style.color='#fff';}
    else{btn.style.background='#f5f0eb';btn.style.color='#6a6360';}
  }
}

function addDateToPerson(){
  var title=document.getElementById('ep-date-title');
  var val=document.getElementById('ep-date-val');
  var dtype=document.getElementById('ep-dtype');
  var yearly=document.getElementById('ep-yearly');
  if(!title||!title.value.trim()||!val||!val.value){showToast('מלא שם ותאריך');return;}
  var people=loadPeople();
  var p=_personIdx>=0?people[_personIdx]:null;
  if(!p){// temp — will save with person
    window._pendingDates=window._pendingDates||[];
    window._pendingDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
    showToast('תאריך נוסף');title.value='';val.value='';return;
  }
  if(!p.importantDates)p.importantDates=[];
  p.importantDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
  savePeople(people);showToast('תאריך נוסף &#10003;');title.value='';val.value='';
}

function savePersonEdit(){
  var name=document.getElementById('ep-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם');return;}
  var people=loadPeople();
  var existing=_personIdx>=0?people[_personIdx]:{memories:[],importantDates:[]};
  var updated=Object.assign({},existing,{
    name:name.value.trim(),
    relationship:(document.getElementById('ep-rel')||{}).value||'',
    place:(document.getElementById('ep-place')||{}).value||'',
    whatTheyMean:(document.getElementById('ep-mean')||{}).value||'',
    whatILove:(document.getElementById('ep-love')||{}).value||'',
    currentUpdate:(document.getElementById('ep-update')||{}).value||'',
    toAsk:(document.getElementById('ep-ask')||{}).value||'',
    contactFreq:(document.getElementById('ep-freq')||{}).value||'monthly'
  });
  // Merge pending dates
  if(window._pendingDates&&window._pendingDates.length){
    updated.importantDates=(updated.importantDates||[]).concat(window._pendingDates);
    window._pendingDates=[];
  }
  epCommitAvatar(existing,function(ref){
    updated.avatar=ref;
    if(_personIdx>=0)people[_personIdx]=updated;
    else{people.push(updated);_personIdx=people.length-1;}
    savePeople(people);
    epReset();
    showToast('נשמר &#10003;');
    _peopleView='person';renderPeople();
  });
}

function deletePerson(){
  var people=loadPeople();
  // otherwise the picture outlives the person, in a store nothing lists
  var gone=people[_personIdx];
  if(gone&&isPhotoKey(gone.avatar))photoDel(gone.avatar);
  people.splice(_personIdx,1);savePeople(people);
  _personIdx=-1;_peopleView='home';renderPeople();
}

function saveInsEntry(){

  var changedFrom=(document.getElementById('ins-changed-from')||{}).value||'';
  var changedWhy=(document.getElementById('ins-changed-why')||{}).value||'';
  var data=loadInsights();
  var key=insKey(_insCat,_insQ);

function loadBookLibrary(){try{var x=localStorage.getItem('book_library');return x?JSON.parse(x):[]; }catch(e){return[];}}
function saveBookLibrary(arr){try{localStorage.setItem('book_library',JSON.stringify(arr));}catch(e){}}

function finishBook(){
  var book=loadBook();
  if(!book.title)return;
  var lib=loadBookLibrary();
  var quotes=loadBookQuotes();
  // Check if already in library
  var exists=lib.some(function(b){return b.title===book.title;});
  if(!exists){
    lib.unshift({
      title:book.title,cover:book.cover||'',
      totalPages:book.total||book.page,
      finishedDate:new Date().toISOString().slice(0,10),
      quotes:quotes.slice()
    });
    saveBookLibrary(lib);
  }
  // Clear current book + quotes
  saveBook({title:'',page:0,total:0,cover:''});
  saveBookQuotes([]);
  showToast('✓ הספר נוסף לספרייה!');
  renderBookWidget();
}

var _showLibrary=false;
var _libraryOpenIdx=-1;

function toggleBookLibrary(){
  _showLibrary=!_showLibrary;
  _libraryOpenIdx=-1;
  renderBookWidget();
}
function openLibraryBook(idx){
  _libraryOpenIdx=_libraryOpenIdx===idx?-1:idx;
  renderBookWidget();
}
function deleteLibraryBook(idx){
  var lib=loadBookLibrary();lib.splice(idx,1);saveBookLibrary(lib);
  _libraryOpenIdx=-1;renderBookWidget();
}

function openBookQuote(){
  var ov=document.getElementById('book-quote-overlay');
  if(ov)ov.style.display='flex';
}
function closeBookQuote(){
  var ov=document.getElementById('book-quote-overlay');
  if(ov)ov.style.display='none';
}
function saveBookQuote(){
  var txt=document.getElementById('book-quote-text');
  var pg=document.getElementById('book-quote-page');
  if(!txt||!txt.value.trim())return;
  var quotes=loadBookQuotes();
  quotes.unshift({text:txt.value.trim(),page:parseInt(pg&&pg.value)||0});
  saveBookQuotes(quotes);
  closeBookQuote();
  renderBookWidget();
}
function deleteBookQuote(idx){
  var quotes=loadBookQuotes();
  quotes.splice(idx,1);
  saveBookQuotes(quotes);
  renderBookWidget();
}

function onBookPageSlide(val){
  // Live update the display while dragging
  var book=loadBook();
  book.page=parseInt(val)||0;
  var disp=document.querySelector('#home-book [style*="font-size:15px;font-weight:700;color:#a690cf"]');
  if(disp)disp.textContent=book.page;
  if(book.total>0){
    var pct=Math.round(book.page/book.total*100);
    var bar=document.querySelector('#home-book [style*="transition:width .4s"]');
    if(bar)bar.style.width=pct+'%';
    var pctLbl=document.querySelector('#home-book [style*="font-size:10px;color:#a690cf;font-weight:700"]');
    if(pctLbl)pctLbl.textContent=pct+'% הושלם';
  }
}
function onBookPageChange(val){
  var book=loadBook();
  book.page=parseInt(val)||0;
  saveBook(book);
}
function openBookEdit(){
  var ov=document.getElementById('book-edit-overlay');
  if(ov)ov.style.display='flex';
}
function closeBookEdit(){
  var ov=document.getElementById('book-edit-overlay');
  if(ov)ov.style.display='none';
}
function saveBookEdit(){
  var book=loadBook();
  var ti=document.getElementById('book-title-inp');
  var toi=document.getElementById('book-total-inp');
  if(ti)book.title=ti.value.trim();
  if(toi)book.total=parseInt(toi.value)||0;
  if(book.page>book.total&&book.total>0)book.page=book.total;
  saveBook(book);renderBookWidget();
}
function clearBook(){saveBook({title:'',page:0,total:0,cover:''});renderBookWidget();}
function handleBookCover(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=400,maxH=600;
      var w=img.width,h=img.height;
      var scale=Math.min(maxW/w,maxH/h,1);
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(h*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      var book=loadBook();book.cover=canvas.toDataURL('image/jpeg',0.85);
      saveBook(book);renderBookWidget();openBookEdit();
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

/* ── TRIP MODE ── */
function loadTrips(){try{var x=localStorage.getItem('trips');return x?JSON.parse(x):[];}catch(e){return[];}}
function saveTrips(arr){try{localStorage.setItem('trips',JSON.stringify(arr));}catch(e){}}
function loadActiveTrip(){try{var x=localStorage.getItem('active_trip');return x?parseInt(x):-1;}catch(e){return -1;}}
function saveActiveTrip(idx){try{localStorage.setItem('active_trip',String(idx));}catch(e){}}

  var trips=loadTrips();
  var activeIdx=loadActiveTrip();

  if(_tripView==='new-trip'){
    var h='<div style="padding-bottom:20px">';
    h+='<div style="font-size:16px;font-weight:800;color:#4a4340;margin-bottom:16px">טיול חדש</div>';
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">שם הטיול</div>';

    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">תאריך התחלה</div>';

  }

  if(_tripView==='active'){
    var trip=trips[activeIdx];

    var h='<div style="padding-bottom:20px">';

    // Trip header
    h+='<div style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border-radius:20px;padding:16px;margin-bottom:14px">';

    h+='</div><div style="font-size:36px;animation:plane-fly 2s ease-in-out infinite">&#x2708;</div></div>';
    h+='<div style="display:flex;gap:12px;margin-top:12px">';
    h+='<div style="text-align:center;flex:1"><div style="font-size:20px;font-weight:800;color:#3d4fd6">'+trip.stops.length+'</div><div style="font-size:9px;color:#6274eb">עצירות</div></div>';
    var countries=[...new Set(trip.stops.map(function(s){return s.country;}).filter(Boolean))].length;

    h+='</div></div>';

    // Add stop button
    h+='<button onclick="_tripView=\'add-stop\';renderTrip()" style="width:100%;background:linear-gradient(135deg,#4f6ef7,#3d4fd6);border:none;border-radius:14px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;margin-bottom:14px">+ הוסף עצירה</button>';

    // Timeline
    if(trip.stops.length===0){
      h+='<div style="text-align:center;padding:32px;color:#c0b8b0;font-size:13px">עדיין לא נוספו עצירות</div>';
    } else {

var _stopPhotoData='';

function previewStopPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=400;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _stopPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('stop-photo-prev');
      if(prev)prev.innerHTML='<img src="'+_stopPhotoData+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px">';
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function createTrip(){
  var name=document.getElementById('trip-name-inp');
  var date=document.getElementById('trip-date-inp');
  if(!name||!name.value.trim())return;
  var trips=loadTrips();
  var idx=trips.length;
  trips.push({name:name.value.trim(),startDate:date&&date.value?new Date(date.value).getTime():Date.now(),stops:[]});
  saveTrips(trips);saveActiveTrip(idx);_tripView='active';renderTrip();
}

function deleteTrip(idx){
  var trips=loadTrips();trips.splice(idx,1);saveTrips(trips);
  var active=loadActiveTrip();
  if(active===idx)saveActiveTrip(-1);
  else if(active>idx)saveActiveTrip(active-1);
  renderTripIntro();
}

function detectLocation(){
  var btn=document.getElementById('detect-loc-btn');
  if(btn){btn.textContent='חופש...⏳';btn.disabled=true;}
  if(!navigator.geolocation){showToast('גיאולוקציה לא זמין');return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=he')
      .then(function(r){return r.json();})
      .then(function(data){
        var place=data.address.city||data.address.town||data.address.village||data.address.county||'';
        var country=data.address.country||'';
        var placeInp=document.getElementById('stop-place');
        var countryInp=document.getElementById('stop-country');
        if(placeInp&&place)placeInp.value=place;
        if(countryInp&&country)countryInp.value=country;
        if(btn){btn.textContent='✓ נמצא!';btn.disabled=false;}
        showToast('✓ '+place+', '+country);
      }).catch(function(){
        if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
        showToast('שגיאה בחיפוש');
      });
  },function(){
    if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
    showToast('לא ניתן לקבל מיקום');
  });
}

function saveStop(){
  var place=document.getElementById('stop-place');
  var country=document.getElementById('stop-country');
  var date=document.getElementById('stop-date');
  var note=document.getElementById('stop-note');
  if(!place||!place.value.trim()){showToast('נא להזין שם מקום');return;}
  var trips=loadTrips();
  var idx=loadActiveTrip();
  if(!trips[idx])return;
  trips[idx].stops.push({
    place:place.value.trim(),
    country:country?country.value.trim():'',
    date:date&&date.value?new Date(date.value).getTime():Date.now(),
    note:note?note.value.trim():'',
    photo:_stopPhotoData||''
  });
  _stopPhotoData='';
  saveTrips(trips);_tripView='active';renderTrip();
  showToast('✓ '+place.value.trim()+' נוספה!');
}

function deleteStop(tripIdx,stopIdx){
  var trips=loadTrips();
  if(trips[tripIdx])trips[tripIdx].stops.splice(stopIdx,1);
  saveTrips(trips);renderTrip();
}


/* ── VISION BOARD ── */
// Photos and words the user arranges by hand inside a framed square on the home
// screen. Geometry is kept in percentages of the frame, so an arrangement
// survives a different screen size; photos are downscaled on the way in,
// because localStorage holds a few megabytes and a camera roll would fill it in
// three pictures.
//
// A note is the same kind of object as a photo and moves through the same
// gestures. The one difference is what scaling means: a photo has a width, a
// note has a font size - both stored as a percentage of the frame, both driven
// by the same corner handle.
var VB_KEY='vision_board';
var VB_MAX=520;   // longest edge kept of an uploaded photo, in px
var VB_COLORS=['#4a4340','#a690cf','#e08a72','#8aa899','#ffffff'];
var _vbSel=null;  // id of the selected item, or null
var _vbG=null;    // the gesture in progress - see vbDown
var _vbPts={};    // pointerId -> last client position, for two-finger gestures
var _vbEditId=null;               // note being edited in the sheet, null = new one
var _vbColor=VB_COLORS[0];
var _vbResizeBound=false;

function loadVision(){
  try{var x=localStorage.getItem(VB_KEY);var a=x?JSON.parse(x):[];return Array.isArray(a)?a:[];}catch(e){return[];}
}
function saveVision(a){
  try{localStorage.setItem(VB_KEY,JSON.stringify(a));return true;}
  catch(e){showToast('אין מספיק מקום לעוד תמונות');return false;}
}
function vbFind(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function vbClamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
function vbTop(a){var t=0;a.forEach(function(o){if((o.z||1)>t)t=o.z||1;});return t;}
// Where a new item lands: scattered around the middle rather than stacked.
function vbSpot(n){return {x:34+(n%3)*16,y:34+(Math.floor(n/3)%3)*16};}

function renderVisionBoard(){
  var el=document.getElementById('home-vision');if(!el)return;
  var items=loadVision();
  var h='<div style="background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700">VISION BOARD</div>';
  h+='<div style="display:flex;gap:6px">';
  h+='<button class="vb-add" onclick="vbPick()">+ תמונה</button>';
  h+='<button class="vb-add" onclick="vbOpenText(\'\')">+ טקסט</button>';
  h+='</div></div>';
  h+='<input type="file" id="vb-file" accept="image/*" multiple style="display:none" onchange="handleVisionPhoto(this)">';
  h+='<div class="vb-frame"><div class="vb-canvas" id="vb-canvas">';
  if(!items.length){
    h+='<div class="vb-empty">'+
         '<div style="font-size:34px">&#x1F5BC;&#xFE0F;</div>'+
         '<div style="font-size:12px;margin-bottom:4px">תמונות ומילים של מה שאתה רוצה לראות קורה</div>'+
         '<div style="display:flex;gap:8px">'+
           '<button class="vb-add" onclick="vbPick()">+ תמונה</button>'+
           '<button class="vb-add" onclick="vbOpenText(\'\')">+ טקסט</button>'+
         '</div>'+
       '</div>';
  }else{
    items.forEach(function(it){
      var sel=(it.id===_vbSel?' on':'');
      var pos='left:'+it.x+'%;top:'+it.y+'%;z-index:'+(it.z||1)+';'+
              'transform:translate(-50%,-50%) rotate('+it.rot+'deg)';
      var del='<button class="vb-del" onclick="vbDelete(\''+it.id+'\')">&#10005;</button>';
      var handles='<span class="vb-h vb-size"></span><span class="vb-h vb-rot">&#8635;</span>';
      if(it.kind==='text'){
        // White words sit on top of photos; anything darker sits on the mat.
        var light=String(it.color).toLowerCase().indexOf('#fff')===0;
        var shadow=light?'0 1px 4px rgba(60,50,45,.6)':'0 1px 3px rgba(255,255,255,.6)';
        h+='<div class="vb-item vb-text'+sel+'" data-id="'+it.id+'" data-fs="'+it.fs+'" '+
             'style="'+pos+';color:'+it.color+';text-shadow:'+shadow+'">'+
             '<span class="vb-tx">'+esc(it.text).replace(/\n/g,'<br>')+'</span>'+
             del+
             '<button class="vb-h vb-edit" onclick="vbOpenText(\''+it.id+'\')">&#9998;</button>'+
             handles+
           '</div>';
      }else{
        h+='<div class="vb-item'+sel+'" data-id="'+it.id+'" style="'+pos+';width:'+it.w+'%">'+
             '<img src="'+it.src+'" draggable="false" alt="">'+
             del+handles+
           '</div>';
      }
    });
  }
  h+='</div></div>';
  if(items.length)h+='<div class="vb-hint">גע כדי לבחור &#183; גרור להזזה &#183; הפינות מגדילות ומסובבות &#183; שתי אצבעות עושות את שתיהן יחד</div>';

  // Sheet for writing a note, shared by "+ טקסט" and the pencil on a note.
  h+='<div id="vb-text-overlay" style="display:none;position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:200;align-items:flex-end;justify-content:center">';
  h+='<div style="background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 18px 34px">';

  h+='<div style="font-size:15px;font-weight:800;color:#4a4340;margin-bottom:14px">טקסט על הלוח</div>';
  h+='<textarea id="vb-text-inp" rows="2" placeholder="מה אתה רוצה לראות קורה?" style="width:100%;border:1.5px solid #eae3dc;border-radius:14px;padding:12px;font-size:14px;font-family:inherit;color:#4a4340;background:#fff;resize:none;margin-bottom:14px"></textarea>';

  h+='<div id="vb-swatches" style="display:flex;gap:10px;margin-bottom:20px">';
  VB_COLORS.forEach(function(c){
    h+='<button class="vb-sw" data-c="'+c+'" onclick="vbPickColor(\''+c+'\')" style="background:'+c+'"></button>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:10px">';
  h+='<button onclick="vbCloseText()" style="flex:1;background:#f0ebe3;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit">ביטול</button>';
  h+='<button onclick="vbSaveText()" style="flex:2;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit">שמירה</button>';
  h+='</div></div></div>';

  h+='</div>';
  el.innerHTML=h;
  vbSizeText();
  var c=document.getElementById('vb-canvas');
  if(c)c.addEventListener('pointerdown',vbDown);
  // A note's size is a share of the frame, so it has to be recomputed in px
  // whenever the frame itself changes width.
  if(!_vbResizeBound&&window.addEventListener){
    window.addEventListener('resize',vbSizeText);_vbResizeBound=true;
