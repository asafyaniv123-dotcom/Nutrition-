/* ── "ME" ──
   The other half of the app: what the days add up to. Built around what the
   numbers say rather than around how many charts fit - a screen of graphs
   nobody returns to is worse than three that tell you something.

   Chart colours are their own set, deeper than the interface palette. The
   soft UI pastels fail as data colours: too little chroma to read as
   identity, and the green and terracotta are 4.1 ΔE apart under deuteranopia,
   which is indistinguishable. These four pass lightness, chroma, CVD
   separation, normal-vision separation and contrast. */
var ME_C=['#7c5cc4','#d4553a','#0f7fa5','#b8791a'];
var ME_INK='#4a4340',ME_MUTE='#a89e97',ME_GRID='#f0ebe4';
var _meRange=14;

function meDayList(n){
  var out=[],i,d,s;
  for(i=n-1;i>=0;i--){
    d=new Date();d.setDate(d.getDate()-i);
    s=d.toISOString().slice(0,10);
    out.push({date:s,d:d,sum:loadSummary(s),day:loadDay(s),steps:stepsOf(s)});
  }
  return out;
}
function meDow(d){return ['א','ב','ג','ד','ה','ו','ש'][d.getDay()];}
function meAvg(a){var i,t=0;if(!a.length)return null;for(i=0;i<a.length;i++)t+=a[i];return t/a.length;}

/* A line over time. One series, so no legend - the title names it. Points are
   8px, the line 2px, the grid recessive, and only the last value is labelled;
   a number on every point is noise. Tapping a point reads it out above. */
function meLine(id,rows,pick,col,fmt){
  var pts=[],i,v;
  for(i=0;i<rows.length;i++){v=pick(rows[i]);if(v!==null&&v!==undefined&&!isNaN(v))pts.push({i:i,v:v,date:rows[i].date});}
  if(pts.length<2)return '<div class="me-empty">עוד אין מספיק ימים כדי לצייר קו.</div>';
  var W=320,H=132,PL=26,PR=14,PT=16,PB=22,cW=W-PL-PR,cH=H-PT-PB;
  var vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  if(mn===mx){mn=mn-1;mx=mx+1;}
  var pad=(mx-mn)*0.15;mn-=pad;mx+=pad;
  function xp(i){return PL+(rows.length<2?0:i*(cW/(rows.length-1)));}
  function yp(v){return PT+cH*(1-(v-mn)/(mx-mn));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="me-svg" xmlns="http://www.w3.org/2000/svg">';
  for(i=0;i<=3;i++){var gy=PT+cH*i/3;s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="'+ME_GRID+'" stroke-width="1"/>';}
  var lp='',ap='';
  for(i=0;i<pts.length;i++){lp+=(i?' L':'M')+xp(pts[i].i).toFixed(1)+','+yp(pts[i].v).toFixed(1);}
  ap=lp+' L'+xp(pts[pts.length-1].i).toFixed(1)+','+(PT+cH)+' L'+xp(pts[0].i).toFixed(1)+','+(PT+cH)+' Z';
  s+='<path d="'+ap+'" fill="'+col+'" opacity=".10"/>';
  s+='<path d="'+lp+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  for(i=0;i<pts.length;i++)
    s+='<circle class="me-pt" cx="'+xp(pts[i].i).toFixed(1)+'" cy="'+yp(pts[i].v).toFixed(1)+'" r="4" fill="'+col+'" stroke="#fff" stroke-width="2" '+
       'onclick="meRead(\''+id+'\',\''+pts[i].date+'\',\''+fmt(pts[i].v)+'\')"/>';
  var lastP=pts[pts.length-1];
  s+='<text x="'+(xp(lastP.i)-6).toFixed(1)+'" y="'+(yp(lastP.v)-9).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="'+ME_INK+'">'+fmt(lastP.v)+'</text>';
  for(i=0;i<rows.length;i+=Math.ceil(rows.length/7))
    s+='<text x="'+xp(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="'+ME_MUTE+'">'+meDow(rows[i].d)+'</text>';
  s+='</svg>';
  return s;
}

/* Bars for counts. Ends rounded 4px and anchored to the baseline, 2px of
   surface between neighbours. */
function meBars(id,rows,pick,col,fmt){
  var vals=rows.map(pick),i,any=false;
  for(i=0;i<vals.length;i++)if(vals[i])any=true;
  if(!any)return '<div class="me-empty">עוד אין מה למדוד כאן.</div>';
  var mx=Math.max.apply(null,vals.map(function(v){return v||0;}))||1;
  var W=320,H=118,PL=8,PR=8,PT=14,PB=20,cW=W-PL-PR,cH=H-PT-PB;
  var bw=(cW/rows.length)-2;
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="me-svg" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+PL+'" y1="'+(PT+cH)+'" x2="'+(PL+cW)+'" y2="'+(PT+cH)+'" stroke="'+ME_GRID+'" stroke-width="1"/>';
  for(i=0;i<rows.length;i++){
    var v=vals[i]||0,bh=Math.max(v?3:0,cH*(v/mx)),x=PL+i*(cW/rows.length)+1;
    if(v)s+='<rect class="me-bar" x="'+x.toFixed(1)+'" y="'+(PT+cH-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="'+col+'" '+
      'onclick="meRead(\''+id+'\',\''+rows[i].date+'\',\''+fmt(v)+'\')"/>';
    if(i%Math.ceil(rows.length/7)===0)
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="'+ME_MUTE+'">'+meDow(rows[i].d)+'</text>';
  }
  s+='</svg>';
  return s;
}
function meRead(id,date,val){
  var el=document.getElementById('rd-'+id);
  if(!el)return;
  var d=new Date(date+'T12:00:00');
  el.textContent=val+' · '+meDow(d)+' '+d.getDate()+'.'+(d.getMonth()+1);
}
function meCard(id,title,sub,body){
  var h='<div class="me-card"><div class="me-hd"><div>';
  h+='<div class="me-t">'+title+'</div>';
  if(sub)h+='<div class="me-s">'+sub+'</div>';
  h+='</div><div class="me-read" id="rd-'+id+'"></div></div>';
  return h+body+'</div>';
}

function renderMe(){
  var rows=meDayList(_meRange),i,r;
  var done=rows.filter(function(x){return x.sum&&x.sum.done;}).length;
  var h='<div class="me-wrap">';

  h+='<div class="me-top"><div class="me-logo">Me</div>';
  h+='<div class="me-sub">מה שהימים מצטברים אליו</div></div>';

  // the one number worth leading with
  h+='<div class="me-hero"><div class="me-hero-n">'+done+'</div>';
  h+='<div class="me-hero-l">ימים שסיכמת מתוך '+_meRange+'</div></div>';

  h+='<div id="home-cal" class="me-slot"></div>';
  h+='<div id="home-vision" class="me-slot"></div>';
  h+='<div class="me-range">';
  [[7,'שבוע'],[14,'שבועיים'],[30,'חודש']].forEach(function(o){
    h+='<button class="me-rb'+(_meRange===o[0]?' on':'')+'" onclick="_meRange='+o[0]+';renderMe()">'+o[1]+'</button>';
  });
  h+='</div>';

  var ratings=[];
  for(i=0;i<rows.length;i++)if(rows[i].sum&&rows[i].sum.dayRating)ratings.push(rows[i].sum.dayRating);
  h+=meCard('rating','ציון היום',
    ratings.length?('ממוצע '+meAvg(ratings).toFixed(1)+' מתוך 10'):'',
    meLine('rating',rows,function(x){return x.sum&&x.sum.dayRating?x.sum.dayRating:null;},ME_C[0],function(v){return String(v);}));

  h+=meCard('steps','צעדים','',
    meBars('steps',rows,function(x){return x.steps||0;},ME_C[2],function(v){return Math.round(v).toLocaleString();}));

  h+=meCard('kcal','קלוריות','היעד '+TARGETS.kcal.toLocaleString(),
    meLine('kcal',rows,function(x){
      var k=Math.round(x.day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
      return k>0?k:null;},ME_C[1],function(v){return Math.round(v).toLocaleString();}));

  h+=meTimeSplit(rows);
  h+=meInsights(rows);
  h+='<div id="home-book" class="me-slot"></div>';

  h+='</div>';
  document.getElementById('me-screen').innerHTML=h;
  // the widgets render into the slots by id, exactly as they did on the home screen
  var cal=document.getElementById('home-cal');
  if(cal)cal.innerHTML=buildHomeCalHTML();
  renderVisionBoard();
  renderBookWidget();
}

/* The only place here that needs more than one colour, so the only place the
   categorical set is used - with a legend, since colour alone is never identity. */
function meTimeSplit(rows){
  var keys=['sleep','work','social','other'];
  var lbl={sleep:'שינה',work:'עבודה',social:'חברתי',other:'אחר'};
  var tot={sleep:0,work:0,social:0,other:0},days=0,i,k,td;
  for(i=0;i<rows.length;i++){
    td=rows[i].sum&&rows[i].sum.timeDistribution;
    if(!td)continue;
    days++;
    for(k in tot)if(td[k])tot[k]+=td[k];
  }
  if(!days)return meCard('split','לאן הולך הזמן','','<div class="me-empty">סמן את השעון בסיכום יום, וזה יתמלא.</div>');
  var sum=keys.reduce(function(a,k2){return a+tot[k2];},0)||1;
  var b='<div class="me-stack">';
  keys.forEach(function(k2,idx){
    if(!tot[k2])return;
    b+='<span style="width:'+(tot[k2]/sum*100).toFixed(1)+'%;background:'+ME_C[idx]+'"></span>';
  });
  b+='</div><div class="me-legend">';
  keys.forEach(function(k2,idx){
    if(!tot[k2])return;
    b+='<span class="me-lg"><i style="background:'+ME_C[idx]+'"></i>'+lbl[k2]+' <b>'+(tot[k2]/days).toFixed(1)+'ש׳</b></span>';
  });
  b+='</div>';
  return meCard('split','לאן הולך הזמן','ממוצע ליום, על פני '+days+' ימים',b);
}

/* What the numbers actually say. Each one is a comparison the user could not
   make in their head, and each says how many days it rests on - a difference
   from two days is not a pattern. */
function meInsights(rows){
  var h='',i,r,withW=[],noW=[],byMood={},givers={};
  for(i=0;i<rows.length;i++){
    r=rows[i].sum;
    if(!r||!r.dayRating)continue;
    var trained=!!(r.workout&&String(r.workout).trim());
    (trained?withW:noW).push(r.dayRating);
    if(r.mood){byMood[r.mood]=byMood[r.mood]||[];byMood[r.mood].push(r.dayRating);}
    if(Array.isArray(r.energyGivers))r.energyGivers.forEach(function(g){givers[g]=(givers[g]||0)+1;});
  }
  var cards='';
  if(withW.length>=2&&noW.length>=2){
    var a=meAvg(withW),b=meAvg(noW),diff=a-b;
    cards+=meInsight(
      diff>=0?'ימים שהתאמנת בהם טובים יותר':'ימים שהתאמנת בהם לא יצאו טובים יותר',
      'ציון ממוצע '+a.toFixed(1)+' לעומת '+b.toFixed(1)+' בלי אימון',
      withW.length+' ימים עם אימון, '+noW.length+' בלי',
      diff>=0?ME_C[2]:ME_C[1]);
  }
  var top=Object.keys(givers).sort(function(x,y){return givers[y]-givers[x];})[0];
  if(top&&givers[top]>=2)
    cards+=meInsight('מה מילא אותך הכי הרבה','"'+top+'" חזר '+givers[top]+' פעמים',
      'מתוך התשובות שלך בהעמקה',ME_C[0]);
  if(!cards)cards='<div class="me-empty">עוד אין מספיק ימים מסוכמים כדי למצוא דפוסים. זה יתמלא מעצמו.</div>';
  return meCard('ins','מה עולה מהנתונים','',cards);
}
function meInsight(title,line,foot,col){
  return '<div class="me-ins" style="border-right:3px solid '+col+'">'+
    '<div class="me-ins-t">'+title+'</div>'+
    '<div class="me-ins-l">'+line+'</div>'+
    '<div class="me-ins-f">'+foot+'</div></div>';
}

/* ── THE SKY ──
   The background is not a flat colour any more: it is the hour you opened the
   app in. Six phases from before dawn to night, a light that sits where the
   sun would be, cloud shapes drifting slowly enough that you only notice if
   you look, and stars that come out after dark.

   Kept cheap on purpose. Three drifting shapes by day, plus thirty small
   stars after dark - and the star field is display:none until then, so they
   cost nothing in daylight. Everything animates only transform and
   opacity, so it stays on the compositor and never touches layout - a phone
   held for two minutes should not get warm. Motion is off entirely for anyone
   who has asked their system for less of it.

   It sits behind Better's home and behind Me. Module screens keep the flat
   ground: a drifting sky behind a hundred rows of a food log is noise. */
var SKY_PHASES={
  night:  {a:'#221d38',b:'#171528',glow:'rgba(150,140,220,.20)',gx:'78%',gy:'14%',dark:true},
  dawn:   {a:'#fde3cf',b:'#ecd9ee',glow:'rgba(255,175,125,.55)',gx:'84%',gy:'82%'},
  morning:{a:'#eaf3fa',b:'#e9ecf4',glow:'rgba(255,232,180,.48)',gx:'76%',gy:'18%'},
  day:    {a:'#dfeaf8',b:'#e4e2f4',glow:'rgba(255,247,214,.60)',gx:'50%',gy:'2%'},
  golden: {a:'#fddcbd',b:'#f0d3e2',glow:'rgba(255,160,90,.58)',gx:'16%',gy:'76%'},
  dusk:   {a:'#dccfee',b:'#bfb2da',glow:'rgba(255,150,170,.34)',gx:'12%',gy:'90%'}
};
function skyPhase(h){
  if(h<5)return'night';
  if(h<7)return'dawn';
  if(h<11)return'morning';
  if(h<16)return'day';
  if(h<19)return'golden';
  if(h<21)return'dusk';
  return'night';
}
var _skyNow='';
function buildSky(){
  if(document.getElementById('sky'))return;
  var d=document.createElement('div');
  d.id='sky';d.className='sky';
  var h='<div class="sky-glow"></div>';
  h+='<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>';
  // Positions are fixed rather than random so the sky is the same sky every
  // time you open it, not a different one each load.
  var seeds=[[8,14],[21,32],[34,9],[47,24],[58,41],[66,12],[73,29],[81,17],[88,37],
             [13,44],[27,52],[41,58],[55,49],[69,56],[84,47],[92,26],[4,33],[17,22],
             [30,38],[44,12],[62,25],[76,44],[90,58],[52,17],[24,7],[38,45],[70,8],
             [96,40],[11,58],[63,36]];
  h+='<div class="stars">';
  for(var i=0;i<seeds.length;i++){
    var s=seeds[i],dur=(2.6+(i%5)*0.7).toFixed(1),del=((i*0.37)%3.4).toFixed(2);
    h+='<i style="left:'+s[0]+'%;top:'+s[1]+'%;animation-duration:'+dur+'s;animation-delay:'+del+'s;'+
       'width:'+(i%4===0?2.4:1.7)+'px;height:'+(i%4===0?2.4:1.7)+'px"></i>';
  }
  h+='</div>';
  d.innerHTML=h;
  document.body.insertBefore(d,document.body.firstChild);
}
function paintSky(){
  buildSky();
  var el=document.getElementById('sky');
  if(!el)return;
  var name=skyPhase(new Date().getHours());
  if(name===_skyNow)return;
  _skyNow=name;
  var p=SKY_PHASES[name];
  el.style.background='radial-gradient(120% 70% at '+p.gx+' '+p.gy+', '+p.glow+', transparent 62%),'+
                      'linear-gradient(165deg,'+p.a+' 0%,'+p.b+' 100%)';
  el.className='sky sky-'+name;
  // Set directly rather than through the cascade: one place decides the phase,
  // and it is the same place that decides the colours.
  var st=el.querySelector('.stars');
  if(st)st.className='stars'+(p.dark?' out':'');
  document.body.classList.toggle('night',!!p.dark);
}
// Re-checked every few minutes so a phase can change while the app is open,
// and on the way back from the background where timers were frozen.
setInterval(paintSky,180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)paintSky();});

   area holds stays exactly where it is, and ticking it again brings the

];
function areaDef(id){for(var i=0;i<HOME_AREAS.length;i++)if(HOME_AREAS[i].id===id)return HOME_AREAS[i];return null;}
function areasChosen(){
  var raw=null;try{raw=localStorage.getItem(AREAS_KEY);}catch(e){}
  if(raw===null)return null;
  try{var a=JSON.parse(raw);return Array.isArray(a)?a:null;}catch(e){return null;}
}
function areaShown(id){
  var d=areaDef(id);
  if(d&&d.fixed)return true;
  var on=areasChosen();
  return on?on.indexOf(id)>=0:true;
}
function areaToggle(id){
  var d=areaDef(id),i;
  if(!d||d.fixed)return;
  var on=areasChosen();
  if(!on){on=[];for(i=0;i<HOME_AREAS.length;i++)on.push(HOME_AREAS[i].id);}
  var k=on.indexOf(id);
  if(k>=0)on.splice(k,1);else on.push(id);
  try{localStorage.setItem(AREAS_KEY,JSON.stringify(on));}catch(e){}
  renderHomeGrid();renderAreasList();
}

}
var TICK='<svg viewBox="0 0 24 24"><path d="m5 12.4 4.6 4.6L19 7.6"/></svg>';
function renderAreasList(){

  l.innerHTML=h;
  var c=document.getElementById('areas-count');
  if(c)c.textContent=n+' מתוך '+HOME_AREAS.length+' מופיעים ב-Better';
}
function openAreas(){
  renderAreasList();
  document.getElementById('areas-back').classList.add('on');
  document.getElementById('areas-drawer').classList.add('on');
}
function closeAreas(){
  document.getElementById('areas-back').classList.remove('on');
  document.getElementById('areas-drawer').classList.remove('on');
}

/* ── THE TWO HALVES ──
   Better holds everything you do; Me holds what it added up to. The wordmark
   is the navigation - read left to right the two buttons spell the app. */
var _mainTab='better';
function showMain(t){
  _mainTab=t;
  var me=document.getElementById('me-screen'),home=document.getElementById('home-screen'),app=document.querySelector('.app');
  if(t==='me'){
    dpRailClear();
    home.style.display='none';app.style.display='none';
    me.style.display='block';renderMe();window.scrollTo(0,0);
  } else {
    me.style.display='none';
    if(currentModule)app.style.display='block';else home.style.display='flex';
  }
  var b=document.getElementById('tb-better'),m=document.getElementById('tb-me');
  if(b)b.className='tb'+(t==='better'?' on':'');
  if(m)m.className='tb'+(t==='me'?' on':'');
}
// Build home screen DOM
(function(){
  var home=document.createElement('div');
  home.id='home-screen';

    '<div class="home-logo">Better Me</div>'+
    '<div class="home-sub">Become the best version of yourself</div>'+

    '<div id="home-reminders" style="width:100%;max-width:380px;margin-top:16px"></div>'+
    '<div id="home-sumrem" style="width:100%;max-width:380px;margin-top:16px"></div>'+
'<div id="home-backup" style="width:100%;max-width:380px;margin-bottom:20px"></div>';
  document.body.appendChild(home);

  var me=document.createElement('div');
  me.id='me-screen';me.className='me-screen';
  document.body.appendChild(me);

  var bar=document.createElement('div');
  bar.className='tabbar';
  bar.innerHTML='<button id="tb-better" class="tb on" onclick="showMain(\'better\')">Better</button>'+
                '<button id="tb-me" class="tb" onclick="showMain(\'me\')">Me</button>';
  document.body.appendChild(bar);

  var back=document.createElement('div');
  back.id='areas-back';back.className='areas-back';
  back.addEventListener('click',closeAreas);
  document.body.appendChild(back);

  var dr=document.createElement('div');
  dr.id='areas-drawer';dr.className='areas-drawer';
  dr.innerHTML='<div class="ar-hd"><div class="ar-title">מה במעקב</div><div class="ar-note">סמן את התחומים שיופיעו ב-Better. מה שתוריד רק נעלם מהמסך &mdash; כל מה שכתבת בו נשמר, ואפשר להחזיר אותו מכאן בכל רגע.</div><div class="ar-count" id="areas-count"></div></div>'+
    '<div id="areas-list"></div>'+
    '<button class="ar-done" id="areas-done">סיימתי</button>';
  document.body.appendChild(dr);
  document.getElementById('areas-done').addEventListener('click',closeAreas);
  document.getElementById('home-menu-btn').addEventListener('click',openAreas);

  // one delegated handler each, so re-rendering the grid never strands a listener
  document.getElementById('home-grid').addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-area]');
    if(b)enterModule(b.getAttribute('data-area'));
  });
  document.getElementById('areas-list').addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-area]');
    if(b)areaToggle(b.getAttribute('data-area'));
  });
  renderHomeGrid();

  paintSky();
  // Set date
  var d=new Date();
  var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('home-date').textContent=dn[d.getDay()]+', '+d.getDate()+' ב'+mn[d.getMonth()];
  var _hc=document.getElementById('home-cal');
  if(_hc)_hc.innerHTML=buildHomeCalHTML();
  migratePhotos();
  ingestStepsFromLink();
  syncStepsFromServer();
  renderVisionBoard();
  renderTripToggle();
  renderReminders();
  renderSumRem();
  renderBookWidget();
  renderBackup();
  // Hide app initially
  document.querySelector('.app').style.display='none';
})();

<style>
/* =====================================================================

:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 2px,rgba(255,210,150,.03) 2px 4px,transparent 4px 132px),
    repeating-linear-gradient(90deg,rgba(255,225,180,.014) 0 3px,transparent 3px 11px),
    linear-gradient(180deg,#2a1a0b,#130b05);
}
/* a dusting of grain over the whole table */
body::before{

}

/* ---------- screens ---------- */

/* ---------- type ---------- */
.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--muted);font-weight:700}

  font-family:var(--serif);

.step-sub{font-size:14px;color:var(--muted);margin-bottom:26px;max-width:30ch;line-height:1.5}

/* ---------- buttons: wood with a brass edge ---------- */
.btn{
  border:1px solid rgba(201,139,63,.4);border-radius:12px;padding:16px 32px;

.btn.ghost:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- player count ---------- */
.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:340px;margin-bottom:30px}
.count-btn{
  aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,139,63,.3);
  font-family:var(--serif);font-size:28px;font-weight:700;cursor:pointer;color:#e2caa0;
  background-image:var(--grain),radial-gradient(circle at 38% 30%,#54331a,#2a1809 75%);

}
.count-btn.on{
  border-color:var(--brass);color:#2a1806;

/* ---------- names ---------- */
.names{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-bottom:26px}

.stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}

/* the slice of trunk: growth rings around an off-centre heart */
.board{
  position:absolute;inset:0;border-radius:50%;
  border:calc(var(--s) * .014) solid var(--bark);
  background-image:
    repeating-radial-gradient(circle at 46% 43%,
      rgba(0,0,0,.20) 0 2px,rgba(255,205,150,.045) 2px 5px,transparent 5px 11px),
    repeating-radial-gradient(circle at 46% 43%,
      rgba(0,0,0,.13) 0 7px,transparent 7px 19px),
    repeating-radial-gradient(circle at 46% 43%,

  box-shadow:

/* two knots in the wood */
.board::before,.board::after{
  content:'';position:absolute;border-radius:50%;pointer-events:none;

.board::before{width:13%;height:9%;left:14%;top:63%;transform:rotate(-18deg)}

.grain-layer{

}

/* one stained wedge per player, redrawn whenever a peg is dragged */
.wedges,.wedge-win{
  position:absolute;inset:4%;border-radius:50%;pointer-events:none;

/* the boundaries read as splits in the wood */

.node{

@keyframes lamp{

    inset 0 2px 0 rgba(255,235,200,.22),inset 0 0 0 3px rgba(255,178,96,.55),

    inset 0 2px 0 rgba(255,235,200,.3),inset 0 0 0 3px rgba(255,200,130,.8),

/* ---------- the needle ---------- */
.arrow{position:absolute;inset:0;will-change:transform;transform:rotate(0deg)}
.arrow-trail{
  position:absolute;inset:9%;border-radius:50%;pointer-events:none;
  opacity:var(--trail,0);transition:opacity .25s linear;
  background:conic-gradient(from 292deg,
    rgba(120,70,30,0) 0deg,

          mask:radial-gradient(circle,transparent 0 32%,#000 34% 60%,transparent 63%);
}
.arrow svg{position:absolute;inset:0;width:100%;height:100%;display:block;
  filter:drop-shadow(calc(var(--s) * .006) calc(var(--s) * .01) calc(var(--s) * .008) rgba(0,0,0,.6))}

/* ---------- the brass pivot ---------- */
.hub{
  position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid #3a2409;cursor:pointer;
  background:
    radial-gradient(circle at 36% 28%,#f5dcaa 0%,#c98b3f 38%,#8a5a22 72%,#4d2f0f 100%);
  box-shadow:
    0 4px 10px rgba(0,0,0,.7),
    inset 0 2px 3px rgba(255,245,215,.55),
    inset 0 -3px 6px rgba(0,0,0,.5);
  display:grid;place-items:center;z-index:10;
  animation:shine 4s ease-in-out infinite;
}
.hub::after{
  content:'';width:26%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#5a3a15,#241405);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.8),0 1px 0 rgba(255,230,180,.25);
}
@keyframes shine{
  0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 0 0 rgba(255,180,90,.0),inset 0 2px 3px rgba(255,245,215,.55),inset 0 -3px 6px rgba(0,0,0,.5)}
  50%{box-shadow:0 4px 10px rgba(0,0,0,.7),0 0 20px 4px rgba(255,180,90,.28),inset 0 2px 3px rgba(255,245,215,.55),inset 0 -3px 6px rgba(0,0,0,.5)}
}
.hub:active{transform:translate(-50%,-50%) scale(.93)}
body.spinning .hub{animation:none}

/* ---------- bottom ---------- */
.bottom{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .35s,transform .35s}
body.sheet-open .bottom{opacity:0;transform:translateY(30px);pointer-events:none}
.hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.4;min-height:18px}

/* ---------- parchment sheets ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  color:var(--ink);
  background-color:var(--parch);
  background-image:
    var(--grain),
    radial-gradient(ellipse at 12% 8%,rgba(150,110,60,.22),transparent 45%),
    radial-gradient(ellipse at 88% 22%,rgba(140,100,55,.18),transparent 40%),
    radial-gradient(ellipse at 60% 96%,rgba(120,85,45,.25),transparent 50%),
    linear-gradient(180deg,#efe4c9,#d9c8a2);
  background-blend-mode:multiply,normal,normal,normal,normal;
  border-top:3px solid #8a6a3c;
  border-radius:20px 20px 0 0;
  padding:22px 22px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(115%);transition:transform .55s cubic-bezier(.2,.9,.2,1);
  max-height:66vh;overflow-y:auto;
  box-shadow:0 -18px 50px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,250,235,.6);
}
.sheet.on{transform:none}
.grab{width:52px;height:4px;border-radius:2px;background:rgba(90,65,35,.3);margin:-6px auto 16px}
.winner{font-family:var(--serif);font-size:clamp(22px,5.8vw,29px);font-weight:700;margin-bottom:18px;text-align:center;color:#2f2010}
.q-cat{
  font-size:10.5px;letter-spacing:.34em;color:#8a6535;font-weight:700;text-align:center;
  margin-bottom:14px;position:relative;
}
.q-cat::before,.q-cat::after{
  content:'';position:absolute;top:50%;width:18%;height:1px;background:rgba(120,90,50,.45);
}
.q-cat::before{right:8%}
.q-cat::after{left:8%}
.q-text{
  font-family:var(--serif);
  font-size:clamp(20px,5.3vw,27px);line-height:1.55;font-weight:600;text-align:center;
  color:#33230f;margin-bottom:24px;text-shadow:0 1px 0 rgba(255,250,235,.5);
}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{
  flex:1;padding:15px 8px;font-size:15.5px;color:#f0dcbb;
  border-color:rgba(60,38,15,.5);
}
.sheet-actions .btn.primary{color:#2a1806}

.backdrop{position:fixed;inset:0;background:rgba(10,6,3,.65);z-index:25;opacity:0;pointer-events:none;transition:opacity .35s}
.backdrop.on{opacity:1;pointer-events:auto}
.hist-title{font-family:var(--serif);font-size:15px;letter-spacing:.3em;color:#7a5a30;font-weight:700;text-align:center;margin-bottom:18px}
.hist-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hist-name{font-family:var(--serif);font-size:16px;font-weight:700;width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#33230f}
.hist-bar{flex:1;height:9px;border-radius:2px;background:rgba(90,65,35,.18);overflow:hidden;box-shadow:inset 0 1px 2px rgba(80,55,25,.3)}
.hist-fill{height:100%;transition:width .5s ease}
.hist-num{font-size:13px;color:#7a5a30;font-weight:600;width:66px;text-align:left}
</style>
</head>
<body>

      <button class="icon-btn" id="btn-hist" title="היסטוריה">&#9776;</button>

      <div class="arrow" id="arrow">

        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>

          <!-- wooden shaft -->

          <path d="M50 41 L50 66" stroke="#2e1a09" stroke-width=".45" opacity=".5"/>

          <!-- brass collar -->

          <path d="M50 25.5 L50 46.6 L44.8 43 Z" fill="#fff" opacity=".18"/>
          <path d="M50 25.5 L55.2 43 L50 46.6" fill="none" stroke="#7d2f06" stroke-width=".4" opacity=".6"/>
          <!-- counterweight -->

<!-- ========== overlays ========== -->
<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet-result">
  <div class="grab"></div>

</div>

<div class="sheet" id="sheet-hist">
  <div class="grab"></div>
  <div class="hist-title">מי כבר נשאל</div>
  <div id="hist-list"></div>
  <button class="btn wide" id="btn-hist-close" style="margin-top:18px">סגירה</button>
</div>

<script>
'use strict';

/* =====================================================================
   1. QUESTIONS
   ===================================================================== */
const QUESTIONS = [
  // עצמי
  {c:'עצמי', q:'מה הדבר שאתה הכי אוהב בעצמך אבל כמעט אף פעם לא אומר בקול?'},
  {c:'עצמי', q:'איזה צד באופי שלך אתה מנסה להסתיר מאנשים?'},
  {c:'עצמי', q:'מה הדבר שהכי קשה לך לסלוח לעצמך עליו?'},
  {c:'עצמי', q:'מתי בפעם האחרונה הרגשת שאתה באמת עצמך?'},
  {c:'עצמי', q:'איזה הרגל שלך היית רוצה להשאיר מאחור?'},
  {c:'עצמי', q:'מה הדבר שאתה הכי רוצה לשנות בעצמך?'},
  {c:'עצמי', q:'מה אנשים בדרך כלל לא מבינים לגביך?'},
  {c:'עצמי', q:'איזה חלק בעצמך אתה מרגיש שעדיין לא הכרת מספיק?'},
  // עבר
  {c:'עבר', q:'איזה רגע מהעבר שלך הכי השפיע על מי שאתה היום?'},
  {c:'עבר', q:'אם היית יכול לדבר עם עצמך בגיל 16, מה היית אומר?'},
  {c:'עבר', q:'איזו טעות מהעבר לימדה אותך הכי הרבה?'},
  {c:'עבר', q:'על איזה רגע בחיים שלך היית רוצה לחזור?'},
  {c:'עבר', q:'איזה אדם מהעבר שלך עדיין משפיע עליך?'},
  {c:'עבר', q:'מה היית עושה אחרת אילו היית מקבל הזדמנות נוספת?'},
  // קשרים ואהבה
  {c:'קשרים ואהבה', q:'מה הדבר שהכי חשוב לך להרגיש בתוך קשר?'},
  {c:'קשרים ואהבה', q:'מה גורם לך להרגיש באמת אהוב?'},
  {c:'קשרים ואהבה', q:'מה הדבר שהכי מפחיד אותך במערכות יחסים?'},
  {c:'קשרים ואהבה', q:'האם קל לך לסמוך על אנשים? למה?'},
  {c:'קשרים ואהבה', q:'מה למדת על אהבה מהקשרים שהיו לך?'},
  {c:'קשרים ואהבה', q:'איזה דבר אתה מחפש באדם אחר אבל מתקשה למצוא?'},
  {c:'קשרים ואהבה', q:'האם אתה יותר מפחד להיות לבד או להיות עם האדם הלא נכון?'},
  // אומץ ופחד
  {c:'אומץ ופחד', q:'מה הדבר שאתה הכי מפחד לעשות אבל יודע שאתה רוצה?'},
  {c:'אומץ ופחד', q:'איזה פחד מנהל אותך יותר ממה שהיית רוצה להודות?'},
  {c:'אומץ ופחד', q:'מתי בפעם האחרונה עשית משהו למרות שפחדת?'},
  {c:'אומץ ופחד', q:'אם היית יודע שאף אחד לא ישפוט אותך, מה היית עושה?'},
  {c:'אומץ ופחד', q:'מה הדבר שאתה דוחה שוב ושוב למרות שאתה יודע שהוא חשוב לך?'},
  // עתיד וחלומות
  {c:'עתיד וחלומות', q:'איפה אתה באמת רוצה להיות בעוד חמש שנים?'},
  {c:'עתיד וחלומות', q:'איזה חלום שלך אתה מפחד להגיד בקול?'},
  {c:'עתיד וחלומות', q:'אם כסף לא היה שיקול, איך היית חי?'},
  {c:'עתיד וחלומות', q:'מה היית רוצה שאנשים יזכרו ממך?'},
  {c:'עתיד וחלומות', q:'איזה חיים היית רוצה לבנות לעצמך?'},
  {c:'עתיד וחלומות', q:'מה אתה מרגיש שחסר לך כדי להפוך לגרסה שאתה רוצה להיות?'},
  {c:'עתיד וחלומות', q:'אם היית יודע בוודאות שתצליח, מה היית מתחיל מחר?'},
  // עמוק יותר
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי מתבייש בו אבל למדת לקבל?'},
  {c:'עמוק יותר', q:'מתי לאחרונה הרגשת שאתה לא מספיק?'},
  {c:'עמוק יותר', q:'מה אתה עושה כשקשה לך במקום להתמודד?'},
  {c:'עמוק יותר', q:'איזה שקר אתה מספר לעצמך לפעמים?'},
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי צריך לשמוע ממישהו אחר?'},
  {c:'עמוק יותר', q:'איזה חלק בחיים שלך נראה טוב מבחוץ אבל מרגיש אחרת מבפנים?'},
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי מפחד לאבד?'},
  {c:'עמוק יותר', q:'מה אתה מרגיש שאתה עדיין מנסה להוכיח — ולמי?'},
  {c:'עמוק יותר', q:'איזה שיעור בחיים אתה מרגיש שאתה חוזר עליו שוב ושוב?'},
  {c:'עמוק יותר', q:'מה היית רוצה שמישהו ישאל אותך אבל אף פעם לא שואלים?'},
  {c:'עמוק יותר', q:'מתי בפעם האחרונה הרגשת באמת גאה בעצמך?'},
  {c:'עמוק יותר', q:'איזה דבר בחיים שלך הגיע הזמן לשחרר?'}
];

/* faded paint on old wood - one shade per seat, none of them near the
   copper of the arrowhead */
const HUES = [190, 345, 120, 215, 285, 75, 235, 315];

/* =====================================================================
   2. STATE
   ===================================================================== */
const state = {
  count: 5,
  players: [],      // {name, picks, angle, hue}   angle: degrees clockwise from the top
  lastIndex: -1,    // nobody is picked twice in a row
  rotation: 0,      // accumulated arrow rotation
  spinning: false,
  sound: true,
  deck: []          // shuffled question indices
};

const $ = id => document.getElementById(id);
const escapeHtml = s => s.replace(/[&<>"']/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm = a => ((a % 360) + 360) % 360;
/* signed shortest distance from b to a, in -180..180 */
const diff = (a, b) => { let d = norm(a - b); return d > 180 ? d - 360 : d; };

/* =====================================================================
   3. SOUND - WebAudio only, no files and no network
   ===================================================================== */
let ac = null;
function audio(){
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) ac = new C();
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
/* a dry wooden knock rather than a bell */
function tick(volume, freq){
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * .4, t + .05);
  f.type = 'bandpass';
  f.frequency.setValueAtTime(freq * .9, t);
  f.Q.setValueAtTime(2.2, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(volume, t + .003);
  g.gain.exponentialRampToValueAtTime(.0001, t + .07);
  o.connect(f).connect(g).connect(a.destination);
  o.start(t); o.stop(t + .09);
}
function chime(){
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [[392, 0, .16], [523.25, .1, .14], [659.25, .2, .12]].forEach(function(n){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(n[0], t + n[1]);
    g.gain.setValueAtTime(.0001, t + n[1]);
    g.gain.linearRampToValueAtTime(n[2], t + n[1] + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + n[1] + .9);
    o.connect(g).connect(a.destination);
    o.start(t + n[1]); o.stop(t + n[1] + 1);
  });
}
function buzz(pattern){ if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } }

/* =====================================================================
   4. SCREENS
   ===================================================================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

$('btn-start').onclick = () => { audio(); show('scr-count'); };

const countGrid = $('count-grid');
[3,4,5,6,7,8].forEach(n => {
  const b = document.createElement('button');
  b.className = 'count-btn' + (n === state.count ? ' on' : '');
  b.textContent = n;
  b.onclick = () => {
    state.count = n;
    [...countGrid.children].forEach(c => c.classList.toggle('on', c === b));
    tick(.14, 900);
  };
  countGrid.appendChild(b);
});
$('btn-count-back').onclick = () => show('scr-intro');
$('btn-count-next').onclick = () => { buildNameInputs(); show('scr-names'); };

function buildNameInputs(){
  const box = $('names');
  const previous = [...box.querySelectorAll('input')].map(i => i.value);
  box.innerHTML = '';
  for (let i = 0; i < state.count; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    row.innerHTML =
      '<div class="name-dot" style="--h:' + HUES[i % HUES.length] + '">' + (i + 1) + '</div>' +
      '<input type="text" maxlength="14" autocomplete="off" autocapitalize="words" ' +
      'placeholder="שחקן ' + (i + 1) + '" enterkeyhint="next">';
    box.appendChild(row);
  }
  const inputs = [...box.querySelectorAll('input')];
  inputs.forEach((inp, i) => {
    if (previous[i]) inp.value = previous[i];
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else inp.blur();
    });
  });
}
$('btn-names-back').onclick = () => show('scr-count');
$('btn-names-next').onclick = () => {
  const inputs = [...$('names').querySelectorAll('input')];
  state.players = inputs.map((inp, i) => ({
    name: inp.value.trim() || ('שחקן ' + (i + 1)),
    picks: 0,
    angle: 0,
    hue: HUES[i % HUES.length]
  }));
  spreadEvenly();
  startGame();
};

/* =====================================================================
   5. SEATS - angles are free, so the pegs can be dragged anywhere
   ===================================================================== */
const stage = $('stage'), arrow = $('arrow'), nodesBox = document.createElement('div');
nodesBox.id = 'nodes';
nodesBox.style.cssText = 'position:absolute;inset:0';
stage.insertBefore(nodesBox, $('hub'));

const NODE_R = 37;                                     // seat radius, % of the stage
const minGap = () => Math.min(20, 300 / state.players.length);

function spreadEvenly(){
  const sec = 360 / state.players.length;
  state.players.forEach((p, i) => { p.angle = i * sec; });
}

/* the seat nearest to a given needle angle - works with uneven spacing */
function seatAt(a){
  let best = 0, bestD = 999;
  state.players.forEach((p, i) => {
    const d = Math.abs(diff(a, p.angle));
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

/* how much free room a seat has on each side, in degrees */
function room(i){
  let cw = 360, ccw = 360;
  state.players.forEach((p, k) => {
    if (k === i) return;
    const d = norm(p.angle - state.players[i].angle);
    cw = Math.min(cw, d);
    ccw = Math.min(ccw, 360 - d);
  });
  if (state.players.length === 1) { cw = 180; ccw = 180; }
  return {cw: cw / 2, ccw: ccw / 2};
}

/* a dragged peg stays inside the free arc between its two neighbours,
   so two seats can never end up on the same spot - if they did, the needle
   would have no way to say which of them it stopped on */
function clampAngle(i, a){
  const gap = minGap();
  const others = state.players.filter((p, k) => k !== i).map(p => p.angle);
  if (!others.length) return norm(a);

  let next = 0, nextD = 361, prev = 0, prevD = 361;
  others.forEach(o => {
    const cw = norm(o - a), ccw = norm(a - o);
    if (cw < nextD) { nextD = cw; next = o; }
    if (ccw < prevD) { prevD = ccw; prev = o; }
  });

  const arc = norm(next - prev) || 360;        // the free arc holding this seat
  if (arc < gap * 2) return norm(prev + arc / 2);
  if (nextD < gap) return norm(next - gap);
  if (prevD < gap) return norm(prev + gap);
  return norm(a);
}

/* =====================================================================
   6. BOARD
   ===================================================================== */
function buildBoard(){
  nodesBox.innerHTML = '';
  state.players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'node';
    el.style.setProperty('--h', p.hue);
    el.dataset.i = i;
    el.innerHTML =
      '<div class="node-in"><span class="node-name"></span><span class="node-count"></span></div>';
    el.querySelector('.node-name').textContent = p.name;
    attachDrag(el, i);
    nodesBox.appendChild(el);
  });
  paintCounts();
  layout();
}

function placeNodes(){
  const size = stage.clientWidth || 1;
  const r = size * NODE_R / 100;
  [...nodesBox.children].forEach((el, i) => {
    const a = state.players[i].angle * Math.PI / 180;
    el.style.setProperty('--x', (r * Math.sin(a)).toFixed(1) + 'px');
    el.style.setProperty('--y', (-r * Math.cos(a)).toFixed(1) + 'px');
    // the phone lies flat on the table, so each name faces the person sitting there
    el.querySelector('.node-in').style.transform = 'rotate(' + (state.players[i].angle + 180) + 'deg)';
  });
}

function paintCounts(){
  [...nodesBox.children].forEach((el, i) => {
    const c = state.players[i].picks;
    el.querySelector('.node-count').textContent = c ? '×' + c : '';
  });
}

/* the stained ring behind the seats, plus a split in the wood on every boundary */
function paintWedges(){
  const n = state.players.length;
  if (!n) return;
  const order = state.players.map((p, i) => i).sort((a, b) => state.players[a].angle - state.players[b].angle);
  const mids = order.map((idx, k) => {
    const a = state.players[idx].angle;
    let b = state.players[order[(k + 1) % n]].angle;
    if (b <= a) b += 360;
    return norm((a + b) / 2);
  });

  const segs = [];
  order.forEach((idx, k) => {
    const s = mids[(k - 1 + n) % n], e = mids[k];
    const col = 'hsl(' + state.players[idx].hue + ' 32% 42% / .16)';
    if (e < s) { segs.push([s, 360, col]); segs.push([0, e, col]); }
    else segs.push([s, e, col]);
  });
  segs.sort((a, b) => a[0] - b[0]);
  $('wedges').style.background =
    'conic-gradient(' + segs.map(s => s[2] + ' ' + s[0].toFixed(2) + 'deg ' + s[1].toFixed(2) + 'deg').join(',') + ')';

  $('spokes').innerHTML = mids.map(m =>
    '<div class="spoke" style="transform:translate(-50%,0) rotate(' + (m + 180).toFixed(2) + 'deg)"></div>'
  ).join('');
}

/* lamplight falling on the chosen seat's slice of the board */
function lightWedge(i){
  const r = room(i);
  const from = norm(state.players[i].angle - r.ccw), to = norm(state.players[i].angle + r.cw);
  const col = 'rgba(255,168,84,.20)';
  const parts = from < to
    ? ['transparent 0deg ' + from.toFixed(2) + 'deg', col + ' ' + from.toFixed(2) + 'deg ' + to.toFixed(2) + 'deg',
       'transparent ' + to.toFixed(2) + 'deg 360deg']
    : [col + ' 0deg ' + to.toFixed(2) + 'deg', 'transparent ' + to.toFixed(2) + 'deg ' + from.toFixed(2) + 'deg',
       col + ' ' + from.toFixed(2) + 'deg 360deg'];
  const w = $('wedge-win');
  w.style.background = 'conic-gradient(' + parts.join(',') + ')';
  w.classList.add('on');
}
function darkWedge(){ $('wedge-win').classList.remove('on'); }

/* the stage is a square filling whatever room the layout leaves it */
function layout(){
  const wrap = $('stage-wrap');
  const size = Math.max(180, Math.min(wrap.clientWidth, wrap.clientHeight, 560));
  stage.style.width = size + 'px';
  stage.style.height = size + 'px';
  stage.style.setProperty('--s', size + 'px');
  placeNodes();
  paintWedges();
}
if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage-wrap'));
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* =====================================================================
   7. DRAGGING A SEAT
   ===================================================================== */
function attachDrag(el, i){
  let active = false, startA = 0, moved = false;

  const angleOf = e => {
    const r = stage.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    return norm(Math.atan2(dx, -dy) * 180 / Math.PI);
  };

  el.addEventListener('pointerdown', e => {
    if (state.spinning || document.body.classList.contains('sheet-open')) return;
    active = true; moved = false;
    startA = angleOf(e);
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!active) return;
    const a = angleOf(e);
    if (!moved) {
      if (Math.abs(diff(a, startA)) < 3) return;      // ignore a plain tap
      moved = true;
      el.classList.add('dragging');
      darkWedge();
      buzz(8);
    }
    state.players[i].angle = clampAngle(i, a);
    placeNodes();
    paintWedges();
  });

  const end = e => {
    if (!active) return;
    active = false;
    el.classList.remove('dragging');
    if (moved) {
      $('hint').textContent = 'מוכנים לסבב הבא';
      tick(.2, 620);
    }
    try { el.releasePointerCapture(e.pointerId); } catch(err){}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

$('btn-reset').onclick = () => {
  if (state.spinning) return;
  spreadEvenly();
  placeNodes();
  paintWedges();
  tick(.2, 800);
};

/* =====================================================================
   8. SPIN - wind up, long throw, small overshoot, settle back
   ===================================================================== */
function pickPlayer(){
  const n = state.players.length, pool = [];
  for (let i = 0; i < n; i++) if (i !== state.lastIndex || n === 1) pool.push(i);
  return pool[Math.floor(Math.random() * pool.length)];
}

function currentAngle(){
  const t = getComputedStyle(arrow).transform;
  if (!t || t === 'none') return 0;
  const m = t.match(/matrix\(([^)]+)\)/);
  if (!m) return 0;
  const p = m[1].split(',').map(Number);
  return Math.atan2(p[1], p[0]) * 180 / Math.PI;
}

/* one knock every time the needle passes a peg, and a smear that
   thickens with speed - both read the real angle, frame by frame */
let tickRAF = 0;
function runTicks(){
  let prev = currentAngle(), prevT = performance.now(), lastSeat = -1, lastPlay = 0;

  const step = now => {
    const raw = currentAngle();
    const d = diff(raw, prev);
    const speed = Math.abs(d) / Math.max(1, now - prevT) * 1000;   // deg per second
    prev = raw; prevT = now;

    arrow.style.setProperty('--trail', Math.min(speed / 900, 1).toFixed(2));

    const seat = seatAt(norm(raw));
    if (seat !== lastSeat) {
      lastSeat = seat;
      const f = Math.min(speed / 800, 1);            // 1 = fast, 0 = almost stopped
      if (now - lastPlay > 28) {
        tick(.06 + (1 - f) * .2, 620 + f * 320);     // slower means louder and lower
        lastPlay = now;
      }
    }
    if (state.spinning) tickRAF = requestAnimationFrame(step);
    else arrow.style.setProperty('--trail', 0);
  };
  tickRAF = requestAnimationFrame(step);
}

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function spin(){
  if (state.spinning || !state.players.length) return;
  audio();
  closeSheet();
  darkWedge();
  state.spinning = true;
  document.body.classList.add('spinning');
  $('btn-spin').disabled = true;
  $('btn-spin').textContent = 'מסתובב…';
  $('hint').textContent = 'החץ מסתובב';
  [...nodesBox.children].forEach(el => el.classList.remove('win'));

  const idx = pickPlayer();
  const r = room(idx);
  const j = Math.random() * 2 - 1;
  const rest = state.players[idx].angle + (j > 0 ? j * r.cw : j * r.ccw) * .55;
  const over = Math.min(7, Math.min(r.cw, r.ccw) * .35);
  const turns = 5 + Math.floor(Math.random() * 4);
  const dur = 4200 + Math.random() * 1700;

  // 1. wind up backwards
  const r1 = state.rotation - 14;
  arrow.style.transition = 'transform 380ms cubic-bezier(.35,0,.25,1)';
  void arrow.offsetWidth;
  arrow.style.transform = 'rotate(' + r1 + 'deg)';
  runTicks();

  // 2. the throw, landing just past the seat
  const delta = norm(norm(rest + over) - norm(r1));
  const r2 = r1 + turns * 360 + delta;
  later(() => {
    arrow.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.72,.12,1)';
    arrow.style.transform = 'rotate(' + r2 + 'deg)';
  }, 390);

  // 3. settle back onto it
  const r3 = r2 - over;
  later(() => {
    arrow.style.transition = 'transform 680ms cubic-bezier(.2,.9,.3,1)';
    arrow.style.transform = 'rotate(' + r3 + 'deg)';
  }, 400 + dur + 30);

  later(() => { state.rotation = r3; land(idx); }, 400 + dur + 30 + 700);
}

function land(idx){
  state.spinning = false;
  state.lastIndex = idx;
  state.players[idx].picks++;
  cancelAnimationFrame(tickRAF);
  arrow.style.setProperty('--trail', 0);
  document.body.classList.remove('spinning');
  $('btn-spin').disabled = false;
  $('btn-spin').textContent = 'התחל סבב';
  $('hint').textContent = 'תורו של ' + state.players[idx].name;

  nodesBox.children[idx].classList.add('win');
  lightWedge(idx);
  paintCounts();

  const s = $('shock');
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');

  chime();
  buzz([18, 60, 30]);

  const q = nextQuestion();
  $('winner').innerHTML =
    '<b style="color:hsl(' + state.players[idx].hue + ' 42% 28%)">' +
    escapeHtml(state.players[idx].name) + '</b>, הגיע תורך.';
  $('q-cat').textContent = q.c;
  $('q-text').textContent = q.q;
  later(() => openSheet($('sheet-result')), 620);
}

/* =====================================================================
   9. QUESTION DECK - every question is asked once before any repeat
   ===================================================================== */
function nextQuestion(){
  if (!state.deck.length) {
    state.deck = QUESTIONS.map((_, i) => i);
    for (let i = state.deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = state.deck[i]; state.deck[i] = state.deck[j]; state.deck[j] = tmp;
    }
  }
  return QUESTIONS[state.deck.pop()];
}

/* =====================================================================
   10. SHEETS
   ===================================================================== */
function openSheet(el){
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s === el));
  document.body.classList.add('sheet-open');
  $('backdrop').classList.toggle('on', el === $('sheet-hist'));
}
function closeSheet(){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  document.body.classList.remove('sheet-open');
  $('backdrop').classList.remove('on');
}
$('backdrop').onclick = closeSheet;
$('btn-hist-close').onclick = closeSheet;

$('btn-respin').onclick = () => { closeSheet(); later(spin, 340); };
$('btn-answered').onclick = () => {
  closeSheet();
  [...nodesBox.children].forEach(el => el.classList.remove('win'));
  darkWedge();
  $('hint').textContent = 'מוכנים לסבב הבא';
};

$('btn-hist').onclick = () => {
  const top = Math.max(1, ...state.players.map(p => p.picks));
  $('hist-list').innerHTML = state.players.map(p =>
    '<div class="hist-row">' +
      '<div class="hist-name">' + escapeHtml(p.name) + '</div>' +
      '<div class="hist-bar"><div class="hist-fill" style="width:' + (p.picks / top * 100) + '%;' +
        'background:linear-gradient(90deg,hsl(' + p.hue + ' 30% 30%),hsl(' + p.hue + ' 34% 48%))"></div></div>' +
      '<div class="hist-num">' +
        (p.picks === 0 ? '0 פעמים' : p.picks === 1 ? 'פעם אחת' : p.picks + ' פעמים') +
      '</div>' +
    '</div>'
  ).join('');
  openSheet($('sheet-hist'));
};

/* =====================================================================
   11. GAME CONTROLS
   ===================================================================== */
$('hub').onclick = spin;
$('btn-spin').onclick = spin;

$('btn-sound').onclick = () => {
  state.sound = !state.sound;
  $('btn-sound').classList.toggle('off', !state.sound);
  $('btn-sound').innerHTML = state.sound ? '&#128266;' : '&#128263;';
  if (state.sound) tick(.2, 800);
};

$('btn-new').onclick = () => {
  if (state.spinning) return;
  clearTimers();
  closeSheet();
  releaseWake();
  show('scr-count');
};

function startGame(){
  clearTimers();
  state.lastIndex = -1;
  state.rotation = 0;
  arrow.style.transition = 'none';
  arrow.style.transform = 'rotate(0deg)';
  arrow.style.setProperty('--trail', 0);
  darkWedge();
  buildBoard();
  closeSheet();
  $('btn-spin').disabled = false;
  $('btn-spin').textContent = 'התחל סבב';
  $('hint').textContent = 'גררו את העיגולים לפי מקומות הישיבה סביב השולחן';
  show('scr-game');
  requestAnimationFrame(layout);
  requestWake();
}

/* keep the screen awake while the phone sits in the middle of the table */
let wake = null;
function requestWake(){
  try {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }, () => {});
  } catch(e){}
}
function releaseWake(){ try { if (wake) { wake.release(); wake = null; } } catch(e){} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('scr-game').classList.contains('on')) requestWake();
});
<\/script>
