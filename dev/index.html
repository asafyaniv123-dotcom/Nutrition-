    if(f){
      var inLib=loadLib().some(function(m){return m.name===f.n;});
      el.innerHTML='<div class="fdb-conf">'+
        '<div class="fdb-cname">'+esc(f.n)+'</div>'+
        '<div class="fdb-c100">'+f.k+' קק"ל ל-100 גרם &middot; '+f.p+'ח '+f.c+'פ '+f.f+'ש</div>'+
        unitsRowHTML(f.n,_fdbUnit,'fdbSetUnit(&quot;%K%&quot;)')+
        '<div class="fdb-grow"><span class="fdb-glbl">'+(_fdbUnit.k==='g'?'כמה גרם?':'כמה '+unitDef(_fdbUnit.k).many+'?')+'</span>'+
        '<input class="fdb-gin" id="fdb-grams" type="number" inputmode="decimal" step="'+(_fdbUnit.k==='g'?'1':'0.5')+'" value="'+fdbGrams+'" oninput="fdbSetGrams(this.value)">'+
        '<span class="fdb-gu">'+(_fdbUnit.k==='g'?'g':unitLabel(_fdbUnit.k,fdbGrams))+'</span></div>'+
        (_fdbUnit.k==='g'?'':
          '<div class="fu-w">'+unitDef(_fdbUnit.k).one+' אחת שוקלת '+
          '<input class="fu-win" type="number" inputmode="decimal" value="'+_fdbUnit.g+'" oninput="fdbSetUnitGrams(this.value)"> גרם</div>')+
        '<div class="fdb-preview" id="fdb-preview">'+fdbPreviewHTML()+'</div>'+
        '<div class="fdb-btns">'+
        '<button class="fdb-add" onclick="fdbAdd()">הוסף ליום ✓</button>'+
        '<button class="fdb-back" onclick="fdbBack()">חזרה</button></div>'+
        (inLib?'<div class="fdb-saved">✓ כבר בספרייה שלך</div>'
              :'<button class="fdb-save" onclick="fdbSaveToLib()">שמור בספרייה שלי</button>')+
        (f.off?'<div class="fdb-src">מקור: Open Food Facts</div>'
              :'<div class="fdb-src">מקור: מאגר התזונה הלאומי</div>')+
        '</div>';
      return;
    }
  }
  if(!_fdbQ){el.innerHTML='<div class="fdb-msg">'+_foods.length.toLocaleString()+' מאכלים ממאגר משרד הבריאות. הקלד כדי לחפש.</div>';return;}
  var res=foodSearch(_fdbQ),i,f;
  var h='',shown={};

  /* What the server understood the words to mean, first - it is the answer
     when the two disagree, and when they agree it costs one label. */
  var aiOn=(foodKey(_fdbAIQ)===foodKey(_fdbQ));
  if(aiOn&&_fdbAI&&_fdbAI.length){
    h+='<div class="fdb-ai-h">התאמות לפי המשמעות</div><div class="fdb-list">';
    for(i=0;i<_fdbAI.length;i++){
      f=null;
      for(var j=0;j<_foods.length;j++)if(_foods[j].n===_fdbAI[i]){f=_foods[j];break;}
      if(!f)continue;
      shown[f.id]=1;
      h+='<button class="fdb-row ai" onclick="fdbSelect(\u0027'+f.id+'\u0027)">'+
         '<span class="fdb-rn">'+esc(f.n)+'</span>'+
         '<span class="fdb-rk">'+f.k+'<span class="fdb-ru">/100g</span></span></button>';
    }
    h+='</div>';
  }

  var rest=[];
  for(i=0;i<res.length;i++)if(!shown[res[i].id])rest.push(res[i]);

  if(rest.length){
    if(h)h+='<div class="fdb-ai-h plain">מכילים את מה שכתבת</div>';
    h+='<div class="fdb-list">';
    for(i=0;i<rest.length;i++){
      h+='<button class="fdb-row" onclick="fdbSelect(\u0027'+rest[i].id+'\u0027)">'+
         '<span class="fdb-rn">'+esc(rest[i].n)+'</span>'+
         '<span class="fdb-rk">'+rest[i].k+'<span class="fdb-ru">/100g</span></span></button>';
    }
    h+='</div>';
  }

  if(aiOn&&_fdbAIBusy)h+='<div class="fdb-ai-w">מחפש גם לפי המשמעות…</div>';
  var card=estCardHTML();
  if(!h&&!card)h='<div class="fdb-msg">'+(_fdbAIBusy?'מחפש…':'לא נמצא במאגר.')+'</div>';
  /* The tables do not have most cooked food, so a search that finds nothing
     is the ordinary case rather than a failure, and it used to be a dead end
     - the food simply could not be logged. */
  var anCard=anCardHTML();
  if(!_est&&!_estBusy&&!_an&&!_anBusy&&_fdbQ.length>=2){
    var q=esc(_fdbQ).replace(/"/g,'&quot;');
    h+='<button class="est-go" onclick="estAsk(&quot;'+q+'&quot;)">'+
       (rest.length||(_fdbAI&&_fdbAI.length)?'לא זה? ':'')+'הערכה מהירה של &rlm;"'+esc(_fdbQ)+'"</button>';
    /* The slow one, said plainly, because it costs a few seconds and several
       lookups and is worth it only for something actually composite. */
    h+='<button class="an-go" onclick="anStart(&quot;'+q+'&quot;)">פירוק מעמיק &mdash; מפרק למרכיבים ומתמחר כל אחד מהמאגר</button>';
  }
  el.innerHTML=h+card+anCard;
}

/* ── ASKING ABOUT YOUR OWN EATING ─────────────────────────────────────────
   The loop lives here rather than on the server, and that is the whole
   design. The server holds one turn: it takes the conversation, and the
   model either answers or says which figure it needs. The going and getting
   happens on this device, against localStorage, and only the answer to that
   specific question is sent back.

   So a week of meals is never uploaded. "How much protein have I had today"
   sends the day's four totals and nothing else - not yesterday, not the
   meal names from last month, not the targets unless it asks for those too.

   And the model may not produce a nutrition number of its own: every figure
   it says has to have come out of one of these four functions, which read
   the app's own tables and the user's own log. That is the same rule the
   matching follows, for the same reason - a made-up number is indis-
   tinguishable from a real one once it is on the screen. */
var _askQ='',_askBusy=false,_askAns='',_askErr='',_askTrace=[],_askOpen=false;

function askDateArg(v){
  var t=String(v||'').trim().toLowerCase();
  if(!t||t==='today'||t==='היום')return todayStr();
  if(t==='yesterday'||t==='אתמול'){
    var d=new Date();d.setDate(d.getDate()-1);return dtStamp(d);
  }
  return /^\d{4}-\d{2}-\d{2}$/.test(t)?t:todayStr();
}
function askDayTotals(d){
  var day=loadDay(d),m=day.meals||[],i,t={kcal:0,p:0,c:0,f:0};
  for(i=0;i<m.length;i++){
    t.kcal+=(m[i].kcal||0);t.p+=(m[i].p||0);t.c+=(m[i].c||0);t.f+=(m[i].f||0);
  }
  return {date:d,kcal:Math.round(t.kcal),protein_g:Math.round(t.p*10)/10,
          carbs_g:Math.round(t.c*10)/10,fat_g:Math.round(t.f*10)/10,
          water_ml:day.water||0,meals_logged:m.length};
}
var ASK_TOOLS={
  get_day:function(inp){
    var d=askDateArg(inp&&inp.date),day=loadDay(d),out=askDayTotals(d);
    out.meals=(day.meals||[]).map(function(m){
      return {name:m.name,time:m.time||'',kcal:m.kcal||0,
              protein_g:m.p||0,carbs_g:m.c||0,fat_g:m.f||0};
    });
    return out;
  },
  get_range:function(inp){
    var from=askDateArg(inp&&inp.from),to=askDateArg(inp&&inp.to);
    if(from>to){var t=from;from=to;to=t;}
    var out=[],d=new Date(from+'T12:00:00'),end=new Date(to+'T12:00:00'),n=0;
    while(d<=end&&n<62){out.push(askDayTotals(dtStamp(d)));d.setDate(d.getDate()+1);n++;}
    return {days:out};
  },
  get_targets:function(){
    loadTargets();
    return {kcal:TARGETS.kcal,protein_g:TARGETS.p,carbs_g:TARGETS.c,
            fat_g:TARGETS.f,water_ml:TARGETS.water};
  },
  search_food:function(inp){
    var q=String((inp&&inp.query)||'').trim();
    if(!q||!_foods)return {rows:[],note:'the food tables are not loaded'};
    var cands=sayCandidates(q,8);
    return {basis:'per 100g',rows:cands.map(function(f){
      return {name:f.n,kcal:f.k,protein_g:f.p,carbs_g:f.c,fat_g:f.f,
              serving_g:f.u>0?f.u:null};
    })};
  }
};
// what it looked up, in words, so an answer can be checked rather than believed
function askSay(name,inp){
  if(name==='get_day')return 'קרא את היום '+askDateArg(inp&&inp.date);
  if(name==='get_range')return 'קרא '+askDateArg(inp&&inp.from)+' עד '+askDateArg(inp&&inp.to);
  if(name==='get_targets')return 'קרא את היעדים שלך';
  if(name==='search_food')return 'חיפש במאגר: '+String((inp&&inp.query)||'');
  return name;
}

function askGo(){
  var el=document.getElementById('ask-in');
  var q=el?el.value.trim():'';
  if(q.length<2){_askErr='כתוב שאלה.';askPaint();return;}
  if(!SYNC_SERVER){_askErr='השאלות דורשות חיבור לשרת.';askPaint();return;}
  _askQ=q;_askBusy=true;_askErr='';_askAns='';_askTrace=[];
  askPaint();
  foodsLoad(function(){
    askTurn([{role:'user',content:q}],0);
  });
}
/* One turn, then the next. Six is generous - a real question settles in two
   or three - but it has to stop somewhere, because a model that keeps asking
   for one more day would otherwise walk through the whole year. */
function askTurn(messages,depth){
  if(depth>=6){
    _askBusy=false;
    _askErr='לא הצלחתי לסגור את זה. נסה לשאול יותר ממוקד.';
    askPaint();return;
  }
  fetch(SYNC_SERVER+'/ask',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:messages})
  }).then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.ok){
        _askBusy=false;
        _askErr=(j&&j.error==='too many for today')?'הגעת למכסה היומית של השאלות.'
               :'לא הצלחתי לענות כרגע.';
        askPaint();return;
      }
      var content=j.content||[],uses=[],text='',i;
      for(i=0;i<content.length;i++){
        if(content[i].type==='text')text+=content[i].text;
        else if(content[i].type==='tool_use')uses.push(content[i]);
      }
      if(!uses.length){
        _askBusy=false;
        _askAns=text.trim()||'לא קיבלתי תשובה.';
        askPaint();return;
      }
      // it asked for something: fetch it here, on the phone, and send back
      var results=[];
      for(i=0;i<uses.length;i++){
        var u=uses[i],val;
        try{
          val=ASK_TOOLS[u.name]?ASK_TOOLS[u.name](u.input||{}):{error:'unknown tool'};
        }catch(e){val={error:'could not read that'};}
        _askTrace.push(askSay(u.name,u.input||{}));
        results.push({type:'tool_result',tool_use_id:u.id,content:JSON.stringify(val)});
      }
      askPaint();
      var next=messages.concat([{role:'assistant',content:content},
                                {role:'user',content:results}]);
      askTurn(next,depth+1);
    })
    .catch(function(){_askBusy=false;_askErr='אין חיבור כרגע.';askPaint();});
}
function askToggle(){
  _askOpen=!_askOpen;
  if(!_askOpen){_askAns='';_askErr='';_askTrace=[];_askQ='';}
  render();
  if(_askOpen)setTimeout(function(){var e=document.getElementById('ask-in');if(e)e.focus();},60);
}
function askPaint(){
  var el=document.getElementById('ask-body');
  if(!el)return;
  var h='';
  if(_askTrace.length){
    h+='<div class="ask-tr">';
    for(var i=0;i<_askTrace.length;i++)h+='<div>'+esc(_askTrace[i])+'</div>';
    h+='</div>';
  }
  if(_askBusy)h+='<div class="ask-w">בודק בנתונים שלך…</div>';
  if(_askErr)h+='<div class="ask-err">'+esc(_askErr)+'</div>';
  if(_askAns)h+='<div class="ask-a">'+askFmt(_askAns)+'</div>';
  el.innerHTML=h;
}
/* The model marks emphasis **like this**, and escaping it renders literal
   asterisks. Bold and line breaks are the only two it actually produces;
   everything else stays escaped, so the answer can never carry markup of its
   own into the page. */
function askFmt(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
function askBarHTML(){
  if(!_askOpen)
    return '<button class="ask-bar" onclick="askToggle()">'+
           '<span class="ask-q">?</span><span>שאל שאלה על התזונה שלך</span></button>';
  return '<div class="ask-card">'+
    '<div class="ask-hd"><span>שאל על התזונה שלך</span>'+
    '<button class="ask-x" onclick="askToggle()">&times;</button></div>'+
    '<div class="ask-row">'+
    '<input class="ask-in" id="ask-in" placeholder="כמה חלבון נשאר לי היום?" '+
    'value="'+esc(_askQ)+'" onkeydown="if(event.key===&quot;Enter&quot;)askGo()">'+
    '<button class="ask-go" onclick="askGo()">שאל</button></div>'+
    '<div id="ask-body">'+'</div>'+
    '<div class="ask-note">התשובות מחושבות מהרישומים שלך ומטבלאות האפליקציה בלבד.</div>'+
    '</div>';
}
/* ── AN ESTIMATE, WHEN THE TABLES HAVE NOTHING ────────────────────────────
   Everywhere else here the model is forbidden from producing a nutrition
   number. This is the exception, and it is worth being clear about why it is
   allowed rather than pretending it is consistent.

   Half of what anyone eats is not in a national food table. A plate at a
   friend's house, a dish from the place on the corner, whatever was cooked
   on Friday. Until now those could not be logged at all - and a day that
   silently leaves out lunch is not more accurate than one holding an
   estimate of it, it is simply wrong in a way nothing on the screen admits.

   So the estimate is allowed and the whole of the work is making sure it can
   never afterwards be mistaken for a measurement. It arrives with what was
   assumed, in words, and a range rather than a single figure - the width of
   the range is the honest part, since a pita with shawarma is 600 to 900
   depending on the shop and answering 743 is not more accurate, only more
   convincing. It is stored with a flag, and the flag is shown: in the day's
   log an estimated meal carries a mark, so a week of records never quietly
   becomes half measurement and half guess. */
var _est=null,_estBusy=false,_estErr='';

function estAsk(q){
  var food=String(q||'').trim();
  if(food.length<2)return;
  if(!SYNC_SERVER){_estErr='ההערכה דורשת חיבור לשרת.';fdbPaint();return;}
  _est=null;_estErr='';_estBusy=true;fdbPaint();
  fetch(SYNC_SERVER+'/estimate',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({food:food})
  }).then(function(r){return r.json();})
    .then(function(j){
      _estBusy=false;
      if(!j||j.error){
        _estErr=(j&&j.error==='too many for today')?'הגעת למכסה היומית של ההערכות.'
               :'לא הצלחתי להעריך את זה.';
        fdbPaint();return;
      }
      if(j.ok===false){_estErr=j.why||'זה כללי מדי כדי להעריך.';fdbPaint();return;}
      _est={name:food,per100:j.per100,g:j.serving_g||100,
            low:j.kcal_low,high:j.kcal_high,conf:j.confidence,
            assumed:j.assumed||'',consistent:j.consistent!==false};
      fdbPaint();
    })
    .catch(function(){_estBusy=false;_estErr='אין חיבור כרגע.';fdbPaint();});
}
function estSetGrams(v){
  if(!_est)return;
  var g=parseFloat(v);
  _est.g=(isFinite(g)&&g>0&&g<=5000)?g:0;
  var box=document.getElementById('est-nums');
  if(box)box.innerHTML=estNumsHTML();
}
function estSetName(v){if(_est)_est.name=String(v||'').slice(0,80);}
function estAmount(){
  if(!_est)return {kcal:0,p:0,c:0,f:0};
  var m=(_est.g||0)/100,q=_est.per100;
  return {kcal:Math.round(q.kcal*m),p:Math.round(q.p*m*10)/10,
          c:Math.round(q.c*m*10)/10,f:Math.round(q.f*m*10)/10};
}
function estNumsHTML(){
  var a=estAmount();
  return '<span><b>'+a.kcal+'</b> קק"ל</span>'+
         '<span>'+a.p+' חלבון</span><span>'+a.c+' פחמ\'</span><span>'+a.f+' שומן</span>';
}
function estClose(){_est=null;_estErr='';_estBusy=false;fdbPaint();}
/* Added with the flag on it. Everything downstream - the log, the day total,
   a summary - can then tell the two apart, which is the only thing that makes
   allowing the estimate at all defensible. */
function estAdd(){
  if(!_est||!_est.g)return;
  var a=estAmount();
  var day=loadDay(curDate);
  day.meals.push({name:_est.name+' ('+_est.g+'g)',kcal:a.kcal,p:a.p,c:a.c,f:a.f,
                  est:1,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);
  showToast('✓ נוסף כהערכה');
  _est=null;_fdbQ='';_estErr='';render();
}
function estCardHTML(){
  if(_estBusy)return '<div class="est-w">מעריך…</div>';
  if(_estErr)return '<div class="est-err">'+esc(_estErr)+'</div>';
  if(!_est)return '';
  var CONF={high:'הערכה טובה',medium:'הערכה סבירה',low:'הערכה גסה'};
  var h='<div class="est-card">';
  h+='<div class="est-hd"><span class="est-tag">הערכה</span>'+
     '<span class="est-conf">'+(CONF[_est.conf]||CONF.low)+'</span>'+
     '<button class="est-x" onclick="estClose()">&times;</button></div>';
  h+='<input class="est-name" value="'+esc(_est.name)+'" oninput="estSetName(this.value)">';
  if(_est.assumed)h+='<div class="est-as">'+esc(_est.assumed)+'</div>';
  h+='<div class="est-grow"><span>כמות</span>'+
     '<input class="est-g" type="number" inputmode="decimal" value="'+_est.g+'" oninput="estSetGrams(this.value)"><span>גרם</span></div>';
  h+='<div class="est-nums" id="est-nums">'+estNumsHTML()+'</div>';
  if(_est.high>_est.low&&_est.high>0)
    h+='<div class="est-range">מנה כזאת נעה בין '+_est.low+' ל־'+_est.high+' קק"ל. תקן את הכמות אם היא לא מדויקת.</div>';
  h+='<button class="est-add" onclick="estAdd()">הוסף ליום כהערכה</button>';
  h+='</div>';
  return h;
}
/* ── WORKING OUT A DISH FROM ITS PARTS ────────────────────────────────────
   The deep version of an estimate, and it is more accurate for a reason
   worth stating: it asks the model a different question.

   Guessing a whole dish is the least accurate thing it can be asked. A pita
   with shawarma is 600 to 900 kcal and no amount of thinking narrows that,
   because the answer depends on the shop.

   Its parts are not like that. Chicken, pita, tahini, oil, salad - every one
   of those is in the ministry tables with a real measured value. What is
   actually unknown is how much of each went in, and THAT is the thing a
   model knows and a table does not.

   So the model returns which row and how many grams, and nothing else. The
   sum is computed here, from the tables, so most of the answer stops being a
   guess and the part that remains one is visible: you can read the
   breakdown, see that it thought 90g of meat, and change it.

   The lookups run on this device, like the other loops - the tables are
   already loaded here, and it saves shipping 6,894 rows to a server. */
var _an=null,_anBusy=false,_anErr='',_anTrace=[];

function anFindRow(name){
  if(!_foods||!name)return null;
  var key=foodKey(name),i;
  for(i=0;i<_foods.length;i++)if(_foods[i].s===key)return _foods[i];
  for(i=0;i<_foods.length;i++)if(_foods[i].n===name)return _foods[i];
  return null;
}
function anStart(q){
  var food=String(q||'').trim();
  if(food.length<2)return;
  if(!SYNC_SERVER){_anErr='הניתוח דורש חיבור לשרת.';anPaint();return;}
  _an=null;_anErr='';_anBusy=true;_anTrace=[];
  anPaint();
  foodsLoad(function(){
    anTurn([{role:'user',content:food}],0,food,null);
  });
}
/* The same breakdown, run for one line of a written sentence. It hands the
   finished parts back through a callback instead of into the search panel's
   card, because the sentence has its own row to fill and the other lines of
   it have to keep their own values. */
function sayAnalyze(i){
  var row=_sayItems&&_sayItems[i];
  if(!row)return;
  if(!SYNC_SERVER){showToast('הפירוק דורש חיבור לשרת');return;}
  row.esting=true;_anTrace=[];sayPaint();
  foodsLoad(function(){
    anTurn([{role:'user',content:row.q}],0,row.q,function(res,err){
      row.esting=false;
      if(!res){showToast(err||'לא הצלחתי לפרק את זה');sayPaint();return;}
      var t=res.tot;
      if(!t.g||!t.kcal){showToast('הפירוק חזר ריק');sayPaint();return;}
      /* Stored per 100g like any table row, so the amount box and everything
         downstream keep working unchanged; the row's weight is the dish. */
      row.food={n:res.dish,est:1,
                k:Math.round(t.kcal/t.g*100),
                p:Math.round(t.p/t.g*1000)/10,
                c:Math.round(t.c/t.g*1000)/10,
                f:Math.round(t.f/t.g*1000)/10};
      row.est=1;row.parts=res.parts;row.measured=res.measured;
      row.assumed=res.assumed;row.alts=[];
      if(row.unit==='g'){row.g=1;row.gsrc='exact';}
      else{row.g=t.g;row.gsrc='ai';}
      sayPaint();
    });
  });
}
function anTurn(messages,depth,dish,cb){
  if(depth>=8){
    _anBusy=false;_anErr='הניתוח לא הסתיים. נסה לתאר את המנה בקצרה.';
    if(cb)cb(null,'הפירוק לא הסתיים');else anPaint();
    return;
  }
  fetch(SYNC_SERVER+'/analyze',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:messages})
  }).then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.ok){
        _anBusy=false;
        var m1=(j&&j.error==='too many for today')?'הגעת למכסה היומית של הניתוחים.'
              :'לא הצלחתי לנתח את זה.';
        _anErr=m1;
        if(cb)cb(null,m1);else anPaint();
        return;
      }
      var content=j.content||[],uses=[],i;
      for(i=0;i<content.length;i++)if(content[i].type==='tool_use')uses.push(content[i]);
      /* A turn that answers in prose instead of calling a tool is not a
         failure, it is the model thinking out loud - and treating it as one
         was giving up on the whole dish on the first turn. It gets told to
         get on with it, and only a second refusal in a row ends it. */
      if(!uses.length){
        if(depth<6){
          anTurn(messages.concat([
            {role:'assistant',content:content.length?content:[{type:'text',text:'...'}]},
            {role:'user',content:'Use the tools. Call search_food for the next '+
                                 'ingredient, or submit if every part has been '+
                                 'looked up. Do not reply in prose.'}
          ]),depth+1,dish,cb);
          return;
        }
        _anBusy=false;_anErr='לא קיבלתי פירוק. נסה לנסח אחרת.';
        if(cb)cb(null,_anErr);else anPaint();
        return;
      }
      var results=[],done=false;
      for(i=0;i<uses.length;i++){
        var u=uses[i];
        if(u.name==='submit'){anFinish(u.input||{},dish,cb);done=true;break;}
        var q=String((u.input&&u.input.query)||'');
        var rows=sayCandidates(q,6).map(function(f){
          return {name:f.n,kcal:f.k,protein_g:f.p,carbs_g:f.c,fat_g:f.f};
        });
        _anTrace.push(q);
        /* An empty result with nothing said about it reads as "try again", and
           it did: five searches for the same tomato, spelled five ways, eating
           the turn limit. Saying so once ends it. */
        var payload={basis:'per 100g',rows:rows};
        if(!rows.length)payload.note='Nothing in the tables matches that word. '+
          'Try ONE different word for it, and if that is empty too, give the part '+
          'your own per100 values with row empty. Do not search for it again.';
        results.push({type:'tool_result',tool_use_id:u.id,
                      content:JSON.stringify(payload)});
      }
      if(done)return;
      if(cb)sayPaint();else anPaint();
      anTurn(messages.concat([{role:'assistant',content:content},
                              {role:'user',content:results}]),depth+1,dish,cb);
    })
    .catch(function(){
      _anBusy=false;_anErr='אין חיבור כרגע.';
      if(cb)cb(null,'אין חיבור כרגע');else anPaint();
    });
}
/* The arithmetic. Every part that names a real row is priced from that row's
   measured values; a part the model had to supply itself is kept separate and
   counted, so the split between the two is a fact on the screen rather than
   something to take on trust. */
function anFinish(inp,dish,cb){
  var parts=Array.isArray(inp.parts)?inp.parts:[],out=[],i;
  for(i=0;i<parts.length;i++){
    var p=parts[i],g=Number(p.grams);
    if(!isFinite(g)||g<=0||g>3000)continue;
    var row=anFindRow(p.row);
    if(row){
      out.push({label:String(p.label||row.n).slice(0,40),g:g,src:'db',rowName:row.n,
                k:row.k,p:row.p,c:row.c,f:row.f});
    }else if(p.per100&&isFinite(Number(p.per100.kcal))&&Number(p.per100.kcal)>0){
      out.push({label:String(p.label||'').slice(0,40),g:g,src:'ai',rowName:'',
                k:Number(p.per100.kcal)||0,p:Number(p.per100.p)||0,
                c:Number(p.per100.c)||0,f:Number(p.per100.f)||0});
    }
    // a part naming a row that does not exist and carrying no values of its
    // own is dropped rather than guessed at
  }
  if(!out.length){
    _anBusy=false;_anErr='לא הצלחתי לפרק את המנה לרכיבים.';
    if(cb)cb(null,_anErr);else anPaint();
    return;
  }
  var tot={kcal:0,p:0,c:0,f:0,g:0},fromDb=0;
  for(i=0;i<out.length;i++){
    var m=out[i].g/100;
    out[i].kcal=Math.round(out[i].k*m);
    out[i].pg=Math.round(out[i].p*m*10)/10;
    out[i].cg=Math.round(out[i].c*m*10)/10;
    out[i].fg=Math.round(out[i].f*m*10)/10;
    tot.kcal+=out[i].kcal;tot.p+=out[i].pg;tot.c+=out[i].cg;tot.f+=out[i].fg;tot.g+=out[i].g;
    if(out[i].src==='db')fromDb+=out[i].kcal;
  }
  _anBusy=false;
  var built={dish:String(inp.dish||dish||'').slice(0,60)||dish,
       assumed:String(inp.assumed||'').slice(0,240),
       conf:['high','medium','low'].indexOf(inp.confidence)>=0?inp.confidence:'low',
       parts:out,
       tot:{kcal:Math.round(tot.kcal),p:Math.round(tot.p*10)/10,
            c:Math.round(tot.c*10)/10,f:Math.round(tot.f*10)/10,g:Math.round(tot.g)},
       measured:tot.kcal>0?Math.round(fromDb/tot.kcal*100):0};
  if(cb){cb(built,null);return;}
  _an=built;
  anPaint();
}
function anSetGrams(i,v){
  if(!_an||!_an.parts[i])return;

function anRecalc(){
  if(!_an)return;

    var q=_an.parts[i],m=q.g/100;

    q.cg=Math.round(q.c*m*10)/10;q.fg=Math.round(q.f*m*10)/10;
    t.kcal+=q.kcal;t.p+=q.pg;t.c+=q.cg;t.f+=q.fg;t.g+=q.g;
    if(q.src==='db')db+=q.kcal;
  }
  _an.tot={kcal:Math.round(t.kcal),p:Math.round(t.p*10)/10,
           c:Math.round(t.c*10)/10,f:Math.round(t.f*10)/10,g:Math.round(t.g)};
  _an.measured=t.kcal>0?Math.round(db/t.kcal*100):0;
}

/* ── WHAT THE NUMBERS ARE FOR ──
   Two kinds of record live in the food library and their numbers mean
   different things. One you typed yourself - "סלט של אמא, 320 קק"ל" - and 320
   is the plate. One comes from the ministry table - "טחינה גולמית, 665" - and
   665 is a hundred grams of it, which nobody eats.

   Until now the app did not know which it was holding, and guessed differently
   in two places: adding straight to the day treated every entry as a plate,
   the recipe builder treated every entry as per-100g. The same record
   therefore counted twice over if you gave it a weight.

   So a record now says which it is. Anything already saved says nothing, and
   silence has to keep meaning exactly what it meant before or a year of
   recipes would quietly change totals - so the old grams path is left intact
   and only new records carry the label. */
function mealBasis(m){return (m&&m.basis==='100g')?'100g':'serving';}
// A serving-based ingredient is counted, not weighed. Anything without the
// label falls through to the weight path it has always used.
function calcIng(ing){
  var m=(ing.basis==='serving')?(parseFloat(ing.qty)||1):((parseFloat(ing.grams)||0)/100);
  return{kcal:Math.round(ing.kcal*m),p:Math.round(ing.p*m*100)/100,
         c:Math.round(ing.c*m*100)/100,f:Math.round(ing.f*m*100)/100};
}
function calcComposed(meal){
  return meal.ingredients.reduce(function(a,ing){var v=calcIng(ing);return{kcal:a.kcal+v.kcal,p:Math.round((a.p+v.p)*100)/100,c:Math.round((a.c+v.c)*100)/100,f:Math.round((a.f+v.f)*100)/100};}  ,{kcal:0,p:0,c:0,f:0});
}
function addComposedToDay(id){
  var meals=loadComposed();var meal=meals.find(function(m){return m.id===id;});if(!meal)return;
  var tot=calcComposed(meal);var day=loadDay(curDate);
  day.meals.push({name:meal.name,kcal:tot.kcal,p:tot.p,c:tot.c,f:tot.f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);showToast('✓ '+meal.name+' נוספה');render();
}
function deleteComposed(id){saveComposed(loadComposed().filter(function(m){return m.id!==id;}));render();}

function handleMealPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=300;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _mealPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('meal-photo-prev');
      var imgEl=document.getElementById('meal-photo-img');
      var clr=document.getElementById('meal-photo-clear');
      if(prev){prev.style.display='block';}
      if(imgEl){imgEl.src=_mealPhotoData;}
      if(clr){clr.style.display='inline';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function renderToday(){
  if(interviewStep>=0){renderInterview();return;}
  var day=loadDay(curDate);
  var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
  var p=Math.round(day.meals.reduce(function(a,m){return a+(m.p||0);},0)*100)/100;
  var c=Math.round(day.meals.reduce(function(a,m){return a+(m.c||0);},0)*100)/100;
  var f=Math.round(day.meals.reduce(function(a,m){return a+(m.f||0);},0)*100)/100;
  var water=day.water||0;
  var kp=Math.min(100,Math.round(kcal/TARGETS.kcal*100));
  var pp=Math.min(100,Math.round(p/TARGETS.p*100));
  var cp=Math.min(100,Math.round(c/TARGETS.c*100));
  var fp=Math.min(100,Math.round(f/TARGETS.f*100));
  var wp=Math.min(100,Math.round(water/TARGETS.water*100));

  var macroHTML='<div class="macro-card"><div class="macro-title">התקדמות מול היעד</div><div class="macro-bars">';
  var mb=[{v:kcal,pct:kp,lbl:'קק"ל',g:'linear-gradient(180deg,#c9bce0,#a690cf)',col:'#a690cf'},{v:p+'g',pct:pp,lbl:'חלבון',g:'linear-gradient(180deg,#f3b9a8,#e08a72)',col:'#e08a72'},{v:c+'g',pct:cp,lbl:'פחמימה',g:'linear-gradient(180deg,#bfe0c7,#8fc79e)',col:'#8fc79e'},{v:f+'g',pct:fp,lbl:'שומן',g:'linear-gradient(180deg,#f6dfa0,#e8c162)',col:'#e8c162'}];

function r2f(v){return Math.round(v*100)/100;}
function clockSelCat(cat){window._clockSelCat=cat;renderInterview();}
function clockSetHour(hr){
  if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
  var cat=window._clockSelCat||'sleep';
  interviewAnswers.timeclock[hr]=cat;
}

var _CLK_COLORS={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162',none:''};

function clockPtForHour(h){
  var ang=(-90+h*(720/24))*Math.PI/180;
  var r=52+(h/24)*(128-52);
  return {x:140+r*Math.cos(ang),y:145+r*Math.sin(ang),r:r};
}

function drawSumClock(clkD){
  var canvas=document.getElementById('sum-clock-canvas');if(!canvas||!clkD)return;
  var ctx=canvas.getContext('2d');
  var W=160,H=166,CX=80,CY=83,R_IN=28,R_OUT=68;
  var TC={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162'};
  ctx.clearRect(0,0,W,H);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=9;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(!clkD[i]||clkD[i]==='none'){i++;continue;}
    var col=clkD[i],st=i;
    while(i<25&&clkD[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=TC[col]||'#ccc';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor=TC[col];ctx.shadowBlur=4;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels 0,12,24
  [0,12,24].forEach(function(h){
    var ang=(-90+h*(720/24))*Math.PI/180;
    var r=R_IN+(h/24)*(R_OUT-R_IN)+12;
    ctx.fillStyle='rgba(140,133,125,.5)';ctx.font='600 7px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+r*Math.cos(ang),CY+r*Math.sin(ang));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var ang2=(-90+h*(720/24))*Math.PI/180;
    var r3=R_IN+(h/24)*(R_OUT-R_IN);
    var px=CX+r3*Math.cos(ang2),py=CY+r3*Math.sin(ang2);
    var filled=clkD[h]&&clkD[h]!=='none';
    ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);
    ctx.fillStyle=filled?(TC[clkD[h]]||'#ccc'):'rgba(160,155,150,.2)';ctx.fill();
    if(!filled){ctx.strokeStyle='rgba(160,155,150,.3)';ctx.lineWidth=.8;ctx.stroke();}
  }
}

function clockDraw(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var clk=interviewAnswers.timeclock||new Array(25).fill('none');
  var CX=140,CY=150,R_IN=52,R_OUT=128;
  ctx.clearRect(0,0,280,310);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(clk[i]==='none'){i++;continue;}
    var col=clk[i],st=i;
    while(i<25&&clk[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=_CLK_COLORS[col];ctx.lineWidth=14;ctx.lineCap='round';
    ctx.shadowColor=_CLK_COLORS[col];ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels
  [0,6,12,18,24].forEach(function(h){
    var p=clockPtForHour(h);var lr=p.r+18;
    var a=(-90+h*(720/24))*Math.PI/180;
    ctx.fillStyle='rgba(140,133,125,.55)';ctx.font='600 9px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+lr*Math.cos(a),CY+lr*Math.sin(a));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var p=clockPtForHour(h);var filled=clk[h]!=='none';
    ctx.save();ctx.translate(p.x,p.y);
    if(filled){
      var grd=ctx.createRadialGradient(0,0,3,0,0,20);
      grd.addColorStop(0,_CLK_COLORS[clk[h]]+'66');grd.addColorStop(1,_CLK_COLORS[clk[h]]+'00');
      ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fillStyle=_CLK_COLORS[clk[h]];ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
      ctx.fillStyle='rgba(160,155,150,.08)';ctx.fill();
      ctx.strokeStyle='rgba(160,155,150,.35)';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.fillStyle=filled?'rgba(0,0,0,.45)':'rgba(130,125,120,.6)';
    ctx.font='600 7px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,0,0.5);ctx.restore();
  }
}

function clockNearestHour(canvas,cx,cy){
  var rect=canvas.getBoundingClientRect();
  var sx=(cx-rect.left)*(280/rect.width),sy=(cy-rect.top)*(310/rect.height);
  var best=-1,bestD=999;
  for(var h=0;h<=24;h++){var p=clockPtForHour(h);var d=Math.hypot(sx-p.x,sy-p.y);if(d<bestD){bestD=d;best=h;}}
  return bestD<22?best:-1;
}

function clockInitDrag(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  clockDraw();
  var dragging=false;
  var CLK_LABELS={sleep:'שינה',work:'עבודה',social:'חברתי',other:'אחר'};
  function paint(e){
    var pt=e.touches?e.touches[0]:e;
    var h=clockNearestHour(canvas,pt.clientX,pt.clientY);if(h<0)return;
    var cat=window._clockSelCat||'sleep';
    if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
    if(interviewAnswers.timeclock[h]===cat)return;
    interviewAnswers.timeclock[h]=cat;clockDraw();
    var clk=interviewAnswers.timeclock;
    var cnts={sleep:0,work:0,social:0,other:0};
    for(var i=0;i<25;i++){if(cnts[clk[i]]!==undefined)cnts[clk[i]]++;}
    var statsEl=document.getElementById('clock-stats');
    if(statsEl){var sh='';Object.keys(cnts).forEach(function(k){if(cnts[k]>0)sh+='<div style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+_CLK_COLORS[k]+'">'+cnts[k]+'h</div><div style="font-size:9px;color:#a89e97">'+CLK_LABELS[k]+'</div></div>';});statsEl.innerHTML=sh;}
  }
  canvas.addEventListener('mousedown',function(e){dragging=true;paint(e);});
  canvas.addEventListener('mousemove',function(e){if(dragging)paint(e);});
  canvas.addEventListener('mouseup',function(){dragging=false;});
  canvas.addEventListener('touchstart',function(e){dragging=true;paint(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(dragging){paint(e);e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',function(){dragging=false;});
}


function addFlowStop(){
  var inp=document.getElementById('flow-inp');if(!inp||!inp.value.trim())return;
  if(!Array.isArray(interviewAnswers.flow))interviewAnswers.flow=[];

  inp.value='';renderInterview();
  setTimeout(function(){
    var i=document.getElementById('flow-inp');
    if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'center'});}
  },60);
}
function removeFlowStop(idx){
  if(Array.isArray(interviewAnswers.flow))interviewAnswers.flow.splice(idx,1);
  renderInterview();
}

function hrPos(hr,CX,CY,R_INNER,R_OUTER){
  var ang=(-90+hr*30)*Math.PI/180;
  var r=R_INNER+(hr/23)*(R_OUTER-R_INNER);
  return {x:r2f(CX+r*Math.cos(ang)),y:r2f(CY+r*Math.sin(ang)),r:r};
}

function renderHistory(){
  var histTab=window._histTab||'intake';
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var s=d.toISOString().slice(0,10);
    var day=loadDay(s);var sum=loadSummary(s);
    var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
    var p=Math.round(day.meals.reduce(function(a,m){return a+(m.p||0);},0));
    var steps=stepsOf(s);var tdee=steps>0?Math.round(2200+steps*0.04):0;
    var deficit=kcal>0&&tdee>0?tdee-kcal:0;
    var dt=new Date(s+'T12:00:00');
    days.push({date:s,kcal:kcal,p:p,deficit:deficit,label:dt.getDate()+'/'+(dt.getMonth()+1),isToday:s===todayStr()});
  }
  var active=days.filter(function(d){return d.kcal>0;});
  function makeSVG(series,refs,minV,maxV,h){
    var W=320,H=h||145,PL=40,PR=12,PT=14,PB=26,cW=W-PL-PR,cH=H-PT-PB;
    function xp(i){return PL+i*(cW/6);}function yp(v){return PT+cH*(1-(v-minV)/(maxV-minV));}
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
    for(var gi=0;gi<=4;gi++){var gv=minV+(maxV-minV)*gi/4;var gy=yp(gv);s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';}
    for(var ri=0;ri<refs.length;ri++){var r=refs[ri];if(r.v>=minV&&r.v<=maxV){var ry=yp(r.v);s+='<line x1="'+PL+'" y1="'+ry+'" x2="'+(PL+cW)+'" y2="'+ry+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}}
    for(var si=0;si<series.length;si++){var ser=series[si];if(si===0&&ser.pts.length>1){var ap='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi=1;pi<ser.pts.length;pi++)ap+=' L'+xp(ser.pts[pi].i)+','+yp(ser.pts[pi].v);ap+=' L'+xp(ser.pts[ser.pts.length-1].i)+','+(PT+cH)+' L'+xp(ser.pts[0].i)+','+(PT+cH)+' Z';s+='<path d="'+ap+'" fill="'+ser.col+'" opacity="0.15"/>';}if(ser.pts.length>1){var lp='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi2=1;pi2<ser.pts.length;pi2++)lp+=' L'+xp(ser.pts[pi2].i)+','+yp(ser.pts[pi2].v);s+='<path d="'+lp+'" fill="none" stroke="'+ser.col+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}for(var dp=0;dp<ser.pts.length;dp++)s+='<circle cx="'+xp(ser.pts[dp].i)+'" cy="'+yp(ser.pts[dp].v)+'" r="4" fill="'+ser.col+'" stroke="#fff" stroke-width="2"/>';}
    for(var di=0;di<days.length;di++)s+='<text x="'+xp(di)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="'+(days[di].isToday?'#a690cf':'#a89e97')+'" font-weight="'+(days[di].isToday?'700':'400')+'">'+days[di].label+'</text>';
    s+='</svg>';return s;
  }
  var tabs=[['intake','צריכה יומית'],['deficit','גרעון אמיתי'],['cumulative','מצטבר']];
  var tabHTML='<div style="display:flex;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px;margin-bottom:12px">';
  for(var ti=0;ti<tabs.length;ti++){var on=histTab===tabs[ti][0];tabHTML+='<button onclick="window._histTab=\''+tabs[ti][0]+'\';renderHistory()" style="flex:1;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:'+(on?'linear-gradient(135deg,#c9bce0,#a690cf)':'transparent')+';color:'+(on?'#fff':'#a89e97')+'">'+tabs[ti][1]+'</button>';}
  tabHTML+='</div>';
  var chartCard='';
  if(histTab==='intake'){
    var kp=[];for(var ix=0;ix<days.length;ix++)if(days[ix].kcal>0)kp.push({i:ix,v:days[ix].kcal});
    var ak=days.map(function(d){return d.kcal;}).filter(function(v){return v>0;}).concat([TARGETS.kcal]);
    var minK=ak.length>1?Math.max(0,Math.min.apply(null,ak)-200):0,maxK=Math.max.apply(null,ak)+200;
    chartCard='<div class="card"><div class="cttl">צריכה קלורית מול יעד</div>'+makeSVG([{pts:kp,col:'#e08a72'}],[{v:TARGETS.kcal,col:'#a690cf',lbl:'יעד '+TARGETS.kcal}],minK,maxK,150)+'<div style="display:flex;gap:14px;margin-top:8px;font-size:10px"><span style="color:#e08a72;font-weight:700">&#x25CF; קלוריות</span><span style="color:#a690cf">-- יעד '+TARGETS.kcal+'</span></div></div>';
  } else if(histTab==='deficit'){
    var dp=[];for(var ix2=0;ix2<days.length;ix2++)if(days[ix2].deficit>0)dp.push({i:ix2,v:days[ix2].deficit});
    var maxD=dp.length>0?Math.max.apply(null,dp.map(function(p){return p.v;}))+200:1500;
    chartCard='<div class="card"><div class="cttl">גרעון אמיתי יומי</div>'+(dp.length>0?makeSVG([{pts:dp,col:'#8fc79e'}],[{v:500,col:'#e8c162',lbl:'מינימום'}],0,maxD,150):'<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>')+'</div>';
  } else {
    // Cumulative — use full current month
    var now2=new Date();var y2=now2.getFullYear(),mo2=now2.getMonth();
    var daysInMo=new Date(y2,mo2+1,0).getDate();
    var cum=0;var cp2=[];
    for(var mi=1;mi<=daysInMo;mi++){
      var ms=y2+'-'+(mo2<9?'0':'')+(mo2+1)+'-'+(mi<10?'0':'')+mi;
      var mDay=loadDay(ms);var mSum=loadSummary(ms);
      var mKcal=Math.round(mDay.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
      var mSteps=stepsOf(ms);
      var mTdee=mSteps>0?Math.round(2200+mSteps*0.04):0;
      var mDef=mKcal>0&&mTdee>0?mTdee-mKcal:0;
      if(mDef>0){cum+=mDef;cp2.push({i:cp2.length,v:cum,day:mi});}
    }
    var maxC=cum>0?Math.max(cum+500,7700):7700;
    // Custom SVG for monthly (variable point count)
    function makeSVGMo(pts,refs,maxV,hh){
      var W=320,H=hh||160,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var n=Math.max(pts.length-1,1);
      function xp3(i){return PL+i*(cW/n);}
      function yp3(v){return PT+cH*(1-v/maxV);}
      var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      for(var gi2=0;gi2<=3;gi2++){var gv2=maxV*gi2/3;var gy2=yp3(gv2);s+='<line x1="'+PL+'" y1="'+gy2+'" x2="'+(PL+cW)+'" y2="'+gy2+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy2+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv2)+'</text>';}
      refs.forEach(function(r){if(r.v<=maxV){var ry2=yp3(r.v);s+='<line x1="'+PL+'" y1="'+ry2+'" x2="'+(PL+cW)+'" y2="'+ry2+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry2-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}});
      if(pts.length>1){
        var ap2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi5=1;pi5<pts.length;pi5++)ap2+=' L'+xp3(pi5)+','+yp3(pts[pi5].v);
        ap2+=' L'+xp3(pts.length-1)+','+(PT+cH)+' L'+xp3(0)+','+(PT+cH)+' Z';
        s+='<path d="'+ap2+'" fill="#8fc79e" opacity="0.15"/>';
        var lp2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi6=1;pi6<pts.length;pi6++)lp2+=' L'+xp3(pi6)+','+yp3(pts[pi6].v);
        s+='<path d="'+lp2+'" fill="none" stroke="#8fc79e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      }
      pts.forEach(function(pt,pi7){
        s+='<circle cx="'+xp3(pi7)+'" cy="'+yp3(pt.v)+'" r="3.5" fill="#8fc79e" stroke="#fff" stroke-width="2"/>';
        if(pi7===pts.length-1||pi7===0)s+='<text x="'+xp3(pi7)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+pt.day+'</text>';
      });
      s+='</svg>';return s;
    }
    var mn3=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    chartCard='<div class="card"><div class="cttl">גרעון מצטבר &mdash; '+mn3[mo2]+' '+y2+'</div>';
    if(cp2.length>0){
      chartCard+=makeSVGMo(cp2,[{v:3500,col:'#e08a72',lbl:'~0.5קג'},{v:7000,col:'#e08a72',lbl:'~1קג'}],maxC,160);
      chartCard+='<div style="display:flex;justify-content:space-around;background:linear-gradient(135deg,#eef5ee,#f0eafa);border-radius:14px;padding:12px;margin-top:10px">';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#8fc79e">'+cum.toLocaleString()+'</div><div style="font-size:9px;color:#a89e97">גרעון (קק"ל)</div></div>';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#a690cf">~'+(cum/7700).toFixed(2)+' קג</div><div style="font-size:9px;color:#a89e97">שומן שנשרף</div></div>';
      chartCard+='</div>';
    } else {
      chartCard+='<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>';
    }
    chartCard+='</div>';
  }
  var avgHTML='';
  if(active.length>0){var avgK=Math.round(active.reduce(function(a,d){return a+d.kcal;},0)/active.length);var avgP=Math.round(active.reduce(function(a,d){return a+d.p;},0)/active.length);var inT=active.filter(function(d){return d.kcal<=TARGETS.kcal;}).length;avgHTML='<div class="avgbox"><div style="font-size:10px;color:#a89e97;font-weight:700;margin-bottom:10px;letter-spacing:.1em">ממוצעים ('+active.length+' ימים)</div><div class="avgin"><div style="text-align:center"><div class="avgv" style="color:#a690cf">'+avgK+'</div><div class="avgl">קק"ל</div></div><div style="text-align:center"><div class="avgv" style="color:#e08a72">'+avgP+'g</div><div class="avgl">חלבון</div></div><div style="text-align:center"><div class="avgv" style="color:#8fc79e">'+inT+'/'+active.length+'</div><div class="avgl">ביעד</div></div></div></div>';}
  document.getElementById('content').innerHTML=tabHTML+chartCard+avgHTML;
}

function buildHomeCalHTML(){
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  var dn=['א','ב','ג','ד','ה','ו','ש'];
  var y=calMonth.getFullYear(),mo=calMonth.getMonth();
  var first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  var remData=loadReminders();

  // Build a map of dates that have reminders
  function dateHasReminder(ds){
    var all=[].concat(remData.today||[],remData.week||[],remData.month||[]);
    return all.some(function(r){return r.date===ds;});
  }

  var h='<div style="background:#fff;border-radius:22px;padding:16px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<button class="cal-nav" onclick="homeCalPrev()">&#8250;</button>';
  h+='<div style="font-size:13px;font-weight:700">'+mn[mo]+' '+y+'</div>';
  h+='<button class="cal-nav" onclick="homeCalNext()">&#8249;</button>';
  h+='</div><div class="cal-grid">';
  for(var d=0;d<7;d++)h+='<div class="cal-dh">'+dn[d]+'</div>';
  var sd=first.getDay();for(var pad=0;pad<sd;pad++)h+='<div></div>';
  for(var day=1;day<=last.getDate();day++){
    var ds=y+'-'+(mo<9?'0':'')+(mo+1)+'-'+(day<10?'0':'')+day;
    var sum=loadSummary(ds);
    var hasRem=dateHasReminder(ds);
    var isT=ds===todayStr();
    var dots='';
    if(sum)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#a690cf;margin:0 1px;display:inline-block"></div>';
    if(hasRem)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#e08a72;margin:0 1px;display:inline-block"></div>';
    var dotRow=dots?'<div style="display:flex;justify-content:center;margin-top:1px">'+dots+'</div>':'';

    if(sum&&sum.photo){
      h+='<button class="cal-d has-photo" onclick="openCalDay(\''+ds+'\')">'+photoImg(sum.photo,'alt=""')+'</button>';
    } else {
      var cls='cal-d'+(sum?' has':'')+(isT?' today':'');
      h+='<button class="'+cls+'" onclick="openCalDay(\''+ds+'\')">';
      h+=(isT?'<strong>'+day+'</strong>':day);
      h+=dotRow;
      h+='</button>';
    }
  }
  h+='</div></div>';
  return h;
}

function homeCalPrev(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);refreshHomeCal();}
function homeCalNext(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);refreshHomeCal();}
function refreshHomeCal(){
  var el=document.getElementById('home-cal');
  if(!el)return;
  el.innerHTML=buildHomeCalHTML();
  /* The day photos are IndexedDB keys, and markup carries a placeholder that
     something has to fill. None of the three places that draw this calendar
     ever did, so every photographed day showed as an empty circle - the
     picture was saved, it was just never asked for. */
  hydratePhotos(el);
}

function loadCalReminders(ds){
  var data=loadReminders();
  var all=[];
  ['today','week','month'].forEach(function(tab){
    (data[tab]||[]).forEach(function(r,idx){
      if(r.date===ds)all.push({tab:tab,idx:idx,item:r});
    });
  });
  return all;
}

function openCalDay(ds){
  var old=document.getElementById('calday-overlay');if(old)old.remove();
  var sum=loadSummary(ds);
  var calRems=loadCalReminders(ds);
  var d=new Date(ds+'T12:00:00');
  var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

  var dateLabel=dn[d.getDay()]+', '+d.getDate()+' ב'+mn[d.getMonth()];

  // Auto scope label
  var today=todayStr();
  var diffDays=Math.round((new Date(ds+'T12:00:00')-new Date(today+'T12:00:00'))/(1000*60*60*24));
  var scopeLabel=diffDays===0?'היום':diffDays>0&&diffDays<=7?'השבוע':'החודש';
  var scopeColor=diffDays===0?'#e08a72':diffDays>0&&diffDays<=7?'#a690cf':'#8fc79e';

  var div=document.createElement('div');
  div.id='calday-overlay';
  div.style.cssText='position:fixed;inset:0;background:rgba(74,67,64,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center';
  div.onclick=function(e){if(e.target===div)closeCalDay();};

  var h='<div style="background:#fbf7f2;border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:0 0 36px">';

  // Drag handle + header
  h+='<div style="position:sticky;top:0;background:#fbf7f2;border-radius:28px 28px 0 0;padding:14px 18px 12px;z-index:1;border-bottom:1px solid #f0ebe3">';
  h+='<div style="width:40px;height:4px;background:#c9bce0;border-radius:2px;margin:0 auto 12px"></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
  h+='<div><div style="font-size:17px;font-weight:800;color:#4a4340">'+dateLabel+'</div>';
  h+='<div style="display:inline-block;margin-top:4px;background:'+scopeColor+'22;color:'+scopeColor+';border-radius:8px;padding:2px 10px;font-size:10px;font-weight:700">יוסף ל'+scopeLabel+'</div></div>';
  if(sum)h+='<button onclick="closeCalDay();openSummary(\''+ds+'\')" style="background:linear-gradient(135deg,#f0eafa,#e8dff5);border:none;border-radius:12px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;color:#a690cf">סיכום יום</button>';
  h+='</div></div>';

  h+='<div style="padding:16px 18px 0">';

  // Existing reminders
  if(calRems.length>0){
    h+='<div style="margin-bottom:16px">';
    h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:8px">פריטים שנשמרו</div>';
    calRems.forEach(function(r){
      var t=BJ_TYPES.find(function(x){return x.id===r.item.type;})||BJ_TYPES[0];
      var st=r.item.status||'open';

/* ── SOUND ──
   One thing to know before reading this: a browser will not let a page make
   a noise until the person has touched it. That is not a setting anyone can
   turn off - it is there so a page cannot ambush you - and it applies to a
   PWA on the home screen exactly as it does to a tab.

   So an opening sound cannot simply be played on load. What it can do is
   try, and if the browser refuses, wait for the first touch - but only while
   the splash is still up. A chime that arrives a minute later, out of
   nowhere, is worse than no chime at all.

   In practice a phone that is resuming the app rather than starting it cold
   never reloaded the page, so the permission is still there and the sound
   plays on open. A cold start plays it on the first touch, which is usually
   within the second. */
var SND_KEY='sound_on',SND_OPEN='open.mp3';
function sndOn(){try{return localStorage.getItem(SND_KEY)!=='0';}catch(e){return true;}}
function sndSet(on){try{localStorage.setItem(SND_KEY,on?'1':'0');}catch(e){}}
function sndToggle(){
  sndSet(!sndOn());
  if(sndOn())sndPlay(SND_OPEN,0.5);
  renderMe();
}
var _sndEls={};
function sndEl(name){
  if(_sndEls[name])return _sndEls[name];
  var a=new Audio(appBase()+'assets/'+name);
  a.preload='auto';
  _sndEls[name]=a;
  return a;
}
/* Always returns a promise, and a rejection here is ordinary - a missing file
   or a browser that is not ready to make noise both land in the same place,
   and neither is worth an error on screen. */
function sndPlay(name,vol){
  if(!sndOn())return Promise.reject();
  var a;
  try{a=sndEl(name);}catch(e){return Promise.reject();}
  try{a.currentTime=0;}catch(e){}
  a.volume=(vol===undefined?0.7:vol);
  var p;
  try{p=a.play();}catch(e){return Promise.reject();}
  return (p&&p.then)?p:Promise.resolve();
}
function sndOpening(){
  if(!sndOn())return;
  sndPlay(SND_OPEN).catch(function(){
    // refused for want of a gesture: take the first one, but not for long
    var done=false;
    function go(){
      if(done)return;
      done=true;
      clearTimeout(t);
      document.removeEventListener('pointerdown',go,true);
      document.removeEventListener('touchstart',go,true);
      sndPlay(SND_OPEN).catch(function(){});
    }
    function drop(){
      done=true;
      document.removeEventListener('pointerdown',go,true);
      document.removeEventListener('touchstart',go,true);
    }
    var t=setTimeout(drop,3200);   // the splash is gone by then
    document.addEventListener('pointerdown',go,true);
    document.addEventListener('touchstart',go,true);
  });
}

/* ── WHERE YOU STAND TODAY ──
   One object, one shape, everything a glance needs: what you have eaten
   against what you were aiming for, how much water and how many steps, what
   is next on the day's plan, and whether the day has been closed.

   It exists because a lock screen widget is exactly this and nothing else -
   a picture of where you stand. iOS will not give a web app one, so the
   widget itself waits for the native build; but the awkward half is not the
   Swift, it is deciding what a glance should contain and digging it out of
   six different records. That part is here and does not need Xcode.

   Two rules it keeps, both for the reader's sake rather than ours:

   Every field is always present. A widget refreshing on a lock screen has
   nowhere to show an error, so a missing key is worse than a zero - it wants
   to draw a ring at 0% and move on, not decide what undefined means.

   The shape is versioned. Native code compiled months ago will still be
   reading this after the web app has moved on, so v tells it whether it is
   looking at something it understands. */
var DAY_STATE_V=1;
function todayState(dateStr){
  var d=dateStr||todayStr();
  var day=loadDay(d)||{meals:[],water:0};
  var meals=day.meals||[];
  function sum(k){
    var t=0,i;
    for(i=0;i<meals.length;i++)t+=(meals[i][k]||0);
    return t;
  }
  var kcal=Math.round(sum('kcal'));
  var p=Math.round(sum('p')*10)/10;
  var c=Math.round(sum('c')*10)/10;
  var f=Math.round(sum('f')*10)/10;
  var water=day.water||0;
  // a target of zero would divide by nothing; treat it as "no target set"
  function pct(v,t){return (t>0)?Math.min(999,Math.round(v/t*100)):0;}

  /* The next thing on the clock, and how much of the day is left to do. An
     item without an hour is on the list but not on the clock, so it cannot be
     "next" - it is only counted. */
  var items=[],next=null,later=0,past=0;
  try{items=dpAll(d)||[];}catch(e){}
  var now=new Date(),nowMin=(d===todayStr())?(now.getHours()*60+now.getMinutes()):0;
  var timed=items.filter(function(t){return typeof t.hour==='number';})
                 .sort(function(a,b){return (a.hour*60+(a.min||0))-(b.hour*60+(b.min||0));});
  for(var i=0;i<timed.length;i++){
    var st=timed[i].hour*60+(timed[i].min||0);
    if(st>=nowMin){
      later++;
      if(!next)next={what:timed[i].w||'',hour:timed[i].hour,min:timed[i].min||0,
                     at:dpHM(timed[i].hour,timed[i].min||0),
                     inMin:(d===todayStr())?Math.max(0,st-nowMin):null};
    } else past++;
  }

  var sum1=loadSummary(d);
  var vl=(typeof loadVlog==='function')?loadVlog(d):null;

  return {
    v:DAY_STATE_V,
    date:d,
    isToday:d===todayStr(),
    at:new Date().toISOString(),
    nutrition:{
      kcal:kcal, p:p, c:c, f:f,
      target:{kcal:TARGETS.kcal||0,p:TARGETS.p||0,c:TARGETS.c||0,f:TARGETS.f||0},
      pct:{kcal:pct(kcal,TARGETS.kcal),p:pct(p,TARGETS.p),
           c:pct(c,TARGETS.c),f:pct(f,TARGETS.f)},
      meals:meals.length,
      left:Math.max(0,(TARGETS.kcal||0)-kcal)
    },
    water:{ml:water,target:TARGETS.water||0,pct:pct(water,TARGETS.water)},
    steps:{n:(typeof stepsOf==='function')?stepsOf(d):0},
    plan:{total:timed.length,done:past,left:later,next:next,
          unscheduled:items.length-timed.length},
    reflection:{done:!!(sum1&&sum1.done),started:!!sum1,vlog:!!(vl&&vl.k)},
    greeting:(typeof greetText==='function')?greetText().text:''
  };
}
/* The bridge a native widget would read. Capacitor writes this string into a
   shared App Group container; the Swift side decodes it and draws. Kept here
   so the web app and the widget can never disagree about the shape - there is

function todayStateJSON(dateStr){

/* ── OPENING SOMEWHERE OTHER THAN HOME ──
   The app is one page and has never had an address for anything inside it.
   That is fine while the only way in is the icon, and it is what stops a home
   screen tile from doing anything more useful than the icon already does.

   So: ?go=nutrition opens תזונה, ?go=day opens today's plan, and so on. iOS
   cannot give a web app a real widget - no manifest widgets member, no Live
   Activities, nothing on the lock screen - but it can put a Shortcut on the
   home screen that opens a URL, and with these that Shortcut lands on the
   screen you wanted instead of the front door.

   It is also the piece a native widget would need later: a widget is a
   picture plus a destination to tap through to, and these are the
   destinations. */
var GO_ROUTES={
  nutrition:function(){enterModule('nutrition');},
  food:     function(){enterModule('nutrition');},
  fitness:  function(){enterModule('fitness');},
  steps:    function(){goSteps();},
  plan:     function(){enterModule('planning');},
  day:      function(){enterModule('planning');setTimeout(function(){planGo('day');},420);},
  week:     function(){enterModule('planning');setTimeout(function(){planGo('weekly');},420);},
  endofday: function(){enterModule('endofday');},
  vlog:     function(){vlogOpen();},
  journal:  function(){enterModule('journal');},
  people:   function(){enterModule('people');},
  hobbies:  function(){enterModule('hobbies');},
  insights: function(){enterModule('insights');},
  goals:    function(){enterModule('goals');},
  me:       function(){showMain('me');}
};
function goParam(){
  var m=/[?&]go=([a-z]+)/i.exec(location.search)||/#go=([a-z]+)/i.exec(location.hash);
  return m?m[1].toLowerCase():'';
}
/* The address is spent on arrival. Leaving ?go= in the bar means every later
   reload - and iOS reloads a web app whenever it feels like reclaiming the
   memory - drops you back into תזונה instead of where you were. */
function goRoute(){
  var k=goParam();
  if(!k||!GO_ROUTES[k])return;
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  setTimeout(function(){
    try{GO_ROUTES[k]();window.scrollTo(0,0);}catch(e){}
  },60);
}

/* ── STEPS SCREEN ──
   One screen for the day's step count, whoever wrote it. A Garmin watch, an
   Apple Watch and most fitness apps all write their steps into Apple Health on
   the phone, so a single reader covers all three rather than three separate
   integrations - none of which would be reachable from a web app anyway. */
function stepsAgo(iso){
  if(!iso)return'';
  var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return'עכשיו';
  if(m<60)return'לפני '+m+' דק׳';
  var hr=Math.round(m/60);
  if(hr<24)return'לפני '+hr+' שע׳';
  return'לפני '+Math.round(hr/24)+' ימים';
}

function copyText(t,what){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){showToast('✓ '+(what||'הטקסט')+' הועתק');},function(){showToast('לא ניתן להעתיק');});
  } else showToast('לא ניתן להעתיק');
}

/* A shortcut hands the count over by opening the app with #steps=<n> on the
   URL. The fragment never leaves the device - it is not sent to the server -
   and it is stripped from the address bar as soon as it is read. */
function ingestStepsFromLink(){
  var hash=location.hash||'';
  var m=/[#&]steps=(\d{1,7})\b/.exec(hash);
  if(!m)return;
  var dm=/[#&]d=(\d{4}-\d{2}-\d{2})\b/.exec(hash);
  var d=dm?dm[1]:todayStr(),n=parseInt(m[1],10);
  saveSteps(d,n,'shortcut');
  var s=loadStepsSrc();s.kind='shortcut';s.last=new Date().toISOString();saveStepsSrc(s);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}
  showToast('✓ נקלטו '+n.toLocaleString()+' צעדים');
}

/* ── ההתקדמות שלי ──
   The answer to the question this area exists for: where the weight is now
   against where it was, and what to do about it next time. Both numbers
   already existed - one was buried in a graph screen and the other only
   appeared once, on the summary at the end of a session, and was gone the
   moment it was dismissed. Neither is any use there. They belong on the
   screen you open before training, which is when the question gets asked. */
function fitProgressCardHTML(log){
  var seen={},rows=[],i,j;
  // most recently trained first, which is the order they matter in
  for(i=log.length-1;i>=0&&rows.length<8;i--){
    var exs=log[i].exercises||[];
    for(j=0;j<exs.length&&rows.length<8;j++){
      var nm=exs[j].name;
      if(seen[nm]||!(exs[j].sets||[]).length)continue;
      seen[nm]=1;
      var st=exStand(nm);
      if(!st)continue;
      rows.push({name:nm,st:st,adv:nextAdvice(nm,st.last.sets)});
    }
  }
  var h='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)">';

/* A workout that does not come from a saved routine. Hevy calls it an empty
   workout and it is the common case for anyone who trains without writing it
   down first: you turn up, you do things, you want them recorded. It starts
   with nothing in it and the picker opens straight away. */
function startEmptyWorkout(){

  _fitView='workout';renderFitness();

}
function workoutAddExercise(){
  exPickInto(function(name){
    if(!_fitWorkout)return;
    _fitWorkout.exercises.push({name:name,targetSets:3,targetReps:10,plan:[],sets:[]});
    _fitWorkout.currentEx=_fitWorkout.exercises.length-1;
    renderFitness();
