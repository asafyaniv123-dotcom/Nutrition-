      <button class="nav-arrow" id="btnPrev">&#8249;</button>
      <div class="tabs">
        <button class="tab" id="tab-history" onclick="switchTab('history')">היסטוריה</button>
        <button class="tab on" id="tab-today" onclick="switchTab('today')">יומי</button>
        <button class="tab" id="tab-recipes" onclick="switchTab('recipes')">מתכונים</button>
        <button class="tab" id="tab-profile" onclick="switchTab('profile')">אישי</button>
      </div>
      <button class="nav-arrow" id="btnNext">&#8250;</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
/* The targets every macro bar in תזונה is measured against. They were a fixed
   constant; they are now whatever is stored, falling back to that same
   constant, so an app nobody has configured behaves exactly as before.
   TARGETS is filled in place rather than reassigned - everything that reads it
   holds this one object. */
var TARGETS_DEFAULT={kcal:1975,p:155,c:200,f:60,water:3000};
var TARGETS_KEY='targets_v1';
var TARGETS={};
function targetsAreCustom(){
  try{return !!localStorage.getItem(TARGETS_KEY);}catch(e){return false;}
}
function loadTargets(){
  var o=null,k;
  try{o=JSON.parse(localStorage.getItem(TARGETS_KEY)||'null');}catch(e){}
  for(k in TARGETS_DEFAULT)
    TARGETS[k]=(o&&typeof o[k]==='number'&&isFinite(o[k])&&o[k]>0)?o[k]:TARGETS_DEFAULT[k];
}
loadTargets();

/* ── THE PERSONAL DETAILS ──
   Who the tracking is about, kept in one record inside תזונה: date of birth,
   height, weight, how much you move, and what you are aiming at.

   Age is derived from the birth date rather than stored, so it never goes
   stale - a stored age is wrong within a year of writing it down.

   Every weight that is entered is appended to a dated list as well as
   replacing the current one. Nothing shows that list yet; it is kept because
   a weight typed over is otherwise gone for good, and this is the one number
   here that is supposed to change. */
var PROFILE_KEY='profile_v1';
var ACT_LEVELS=[
  {v:1,t:'כמעט ללא',s:'יום יושבני, בלי אימונים'},
  {v:2,t:'קלה',s:'1&ndash;2 אימונים בשבוע'},
  {v:3,t:'בינונית',s:'3&ndash;4 אימונים בשבוע'},
  {v:4,t:'גבוהה',s:'5&ndash;6 אימונים בשבוע'},
  {v:5,t:'מאוד גבוהה',s:'כל יום, או עבודה פיזית'}
];
/* Each goal is two numbers: how far off maintenance the calories sit, and
   how much protein per kilo is added on top of the activity level's own
   figure. חיטוב is the interesting one - it is not a smaller version of
   losing weight. Recomposition means eating around maintenance and holding
   protein high, so the body has the material to build with while the fat
   comes off; a large deficit is what stops that working. So it carries the
   smallest calorie cut of the three and the largest protein bonus. */
var GOALS=[
  {v:'lose',  t:'ירידה במשקל',   k:0.85, p:0.2, n:'גירעון של 15% &mdash; ירידה יציבה'},
  {v:'recomp',t:'חיטוב',         k:0.95, p:0.4, n:'קרוב לתחזוקה, חלבון גבוה &mdash; לרדת אחוז שומן בלי לאבד מסה'},
  {v:'keep',  t:'שמירה על המשקל',k:1.00, p:0,   n:'בדיוק מה שאתה שורף'},
  {v:'gain',  t:'עלייה במסה',    k:1.10, p:0.1, n:'עודף של 10% לבנייה'}
];
function goalDef(v){for(var i=0;i<GOALS.length;i++)if(GOALS[i].v===v)return GOALS[i];return null;}
// the greeting reads it too, so both places stay in step
function profName(v){greetSetName(v);renderGreeting();}
function loadProfile(){
  try{var o=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}');return o&&typeof o==='object'?o:{};}
  catch(e){return {};}
}
function saveProfile(p){
  try{localStorage.setItem(PROFILE_KEY,JSON.stringify(p));}catch(e){}
}
function profileAge(birth){
  if(!birth)return null;
  var b=new Date(birth+'T00:00:00');
  if(isNaN(b))return null;
  var n=new Date(),a=n.getFullYear()-b.getFullYear();
  var m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate()))a--;
  return (a>=0&&a<130)?a:null;
}
function profileBMI(p){
  var h=parseFloat(p.height),w=parseFloat(p.weight);
  if(!h||!w||h<80||h>250||w<20||w>400)return null;
  return Math.round(w/Math.pow(h/100,2)*10)/10;
}
function profSet(field,val){
  var p=loadProfile();
  p[field]=val;
  p.updatedAt=new Date().toISOString();
  saveProfile(p);
  renderProfile();
}
function profNum(field,el){
  var p=loadProfile(),v=el.value.trim();
  if(v===''){delete p[field];}
  else{
    var n=parseFloat(v);
    if(isNaN(n))return;
    p[field]=n;
    if(field==='weight'){
      // a weight typed over is otherwise gone; keep one entry per day
      var d=todayStr();
      p.weights=Array.isArray(p.weights)?p.weights:[];
      p.weights=p.weights.filter(function(x){return x.d!==d;});
      p.weights.push({d:d,v:n});
      if(p.weights.length>400)p.weights=p.weights.slice(-400);
    }
  }
  p.updatedAt=new Date().toISOString();
  saveProfile(p);
  renderProfile();
}

/* ── FROM THE DETAILS TO A TARGET ──
   Mifflin-St Jeor for the resting burn, scaled by how much you move, then
   moved off maintenance by the goal. The formula carries one constant that
   differs by sex (+5 / -161), which is the only reason the field is asked
   for at all.

   Protein is per kilo of bodyweight rather than a share of the calories,
   which is the usual way to set it - but the amount per kilo climbs with the
   activity level, because 2 g/kg for someone who marked 'hardly any' is a
   figure for an athlete. A deficit adds 0.2 on top, to hold muscle while the
   calories are down. Fat takes a quarter of the calories and carbohydrate
   gets whatever is left, so the three add back up to the figure above them.

   Nothing here writes anything. The numbers are a recommendation on screen
   until the button is pressed, because these targets are what a year of
   tracking is measured against and they should not move on their own. */
var ACT_FACTOR={1:1.2,2:1.375,3:1.55,4:1.725,5:1.9};
var PROT_PER_KG={1:1.2,2:1.5,3:1.7,4:1.9,5:2.0};
function profileTargets(p){
  var age=profileAge(p.birth),h=parseFloat(p.height),w=parseFloat(p.weight);
  if(age===null||!h||!w||!p.sex||!p.activity||!p.goal)return null;
  var bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  var tdee=bmr*(ACT_FACTOR[p.activity]||1.2);
  var g=goalDef(p.goal);
  if(!g)return null;
  var kcal=tdee*g.k;
  var prot=Math.round(w*((PROT_PER_KG[p.activity]||1.5)+g.p));
  var fat=Math.round(kcal*0.25/9);
  var carb=Math.round((kcal-prot*4-fat*9)/4);
  if(carb<0)carb=0;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal/5)*5,
          p:prot,c:carb,f:fat,water:Math.round(w*35/100)*100};
}
function targetsMatch(rec){
  return rec&&rec.kcal===TARGETS.kcal&&rec.p===TARGETS.p&&
         rec.c===TARGETS.c&&rec.f===TARGETS.f&&rec.water===TARGETS.water;
}
function applyTargets(){
  var t=profileTargets(loadProfile());
  if(!t)return;
  try{localStorage.setItem(TARGETS_KEY,JSON.stringify({kcal:t.kcal,p:t.p,c:t.c,f:t.f,water:t.water}));}catch(e){}
  loadTargets();renderProfile();showToast('היעדים עודכנו');
}
function resetTargets(){
  try{localStorage.removeItem(TARGETS_KEY);}catch(e){}
  loadTargets();renderProfile();showToast('חזרה ליעדים המקוריים');
}

function renderProfile(){
  var p=loadProfile(),h='',i;
  var age=profileAge(p.birth),bmi=profileBMI(p);

  h+='<div class="card"><div class="cttl">פרטים אישיים</div>';
  h+='<div class="pf-row"><label class="pf-lbl">שם</label>'+
     '<input class="pf-in" type="text" maxlength="24" placeholder="השם שלך" value="'+esc(p.name||'')+'" onchange="profName(this.value)">'+
     '<span class="pf-note">לברכה בבית</span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">תאריך לידה</label>'+
     '<input class="pf-in" type="date" value="'+(p.birth||'')+'" onchange="profSet(\u0027birth\u0027,this.value)">'+
     '<span class="pf-note">'+(age===null?'':age+' שנים')+'</span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">מין</label><div class="pf-sexes">'+
     '<button class="pf-sex'+(p.sex==='m'?' on':'')+'" onclick="profSet(\u0027sex\u0027,\u0027m\u0027)">זכר</button>'+
     '<button class="pf-sex'+(p.sex==='f'?' on':'')+'" onclick="profSet(\u0027sex\u0027,\u0027f\u0027)">נקבה</button>'+
     '</div><span class="pf-note"></span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">גובה</label>'+
     '<input class="pf-in" type="number" inputmode="decimal" step="0.5" placeholder="0" value="'+(p.height!==undefined?p.height:'')+'" onchange="profNum(\u0027height\u0027,this)">'+
     '<span class="pf-note">ס"מ</span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">משקל</label>'+
     '<input class="pf-in" type="number" inputmode="decimal" step="0.1" placeholder="0" value="'+(p.weight!==undefined?p.weight:'')+'" onchange="profNum(\u0027weight\u0027,this)">'+
     '<span class="pf-note">ק"ג</span></div>';
  if(bmi!==null)
    h+='<div class="pf-derived">BMI '+bmi+'</div>';
  h+='</div>';

  h+='<div class="card"><div class="cttl">פעילות גופנית</div><div class="pf-acts">';
  for(i=0;i<ACT_LEVELS.length;i++){
    var a=ACT_LEVELS[i];
    h+='<button class="pf-act'+(p.activity===a.v?' on':'')+'" onclick="profSet(\u0027activity\u0027,'+a.v+')">'+
       '<span class="pf-actn">'+a.v+'</span>'+
       '<span class="pf-actt">'+a.t+'</span>'+
       '<span class="pf-acts2">'+a.s+'</span></button>';
  }
  h+='</div></div>';

  h+='<div class="card"><div class="cttl">מטרה</div><div class="pf-goals">';
  for(i=0;i<GOALS.length;i++){
    var g=GOALS[i];
    h+='<button class="pf-goal'+(p.goal===g.v?' on':'')+'" onclick="profSet(\u0027goal\u0027,\u0027'+g.v+'\u0027)">'+g.t+'</button>';
  }
  h+='</div>';
  var gd=goalDef(p.goal);
  if(gd)h+='<div class="pf-goaln">'+gd.n+'</div>';
  h+='</div>';

  var rec=profileTargets(p);
  if(rec){
    var same=targetsMatch(rec);
    h+='<div class="card"><div class="cttl">יעד מומלץ</div>';
    h+='<div class="pf-bmr">שריפה במנוחה '+rec.bmr.toLocaleString()+' &middot; עם הפעילות '+rec.tdee.toLocaleString()+' קק"ל ליום</div>';
    var rows=[
      {v:rec.kcal.toLocaleString(),l:'קק"ל',cur:TARGETS.kcal.toLocaleString(),col:'#a690cf'},
      {v:rec.p+'g',l:'חלבון',cur:TARGETS.p+'g',col:'#e08a72'},
      {v:rec.c+'g',l:'פחמימה',cur:TARGETS.c+'g',col:'#8fc79e'},
      {v:rec.f+'g',l:'שומן',cur:TARGETS.f+'g',col:'#e8c162'}
    ];
    h+='<div class="pf-recs">';
    for(i=0;i<rows.length;i++){
      var rw=rows[i],ch=rw.v!==rw.cur;
      h+='<div class="pf-rec"><div class="pf-recv" style="color:'+rw.col+'">'+rw.v+'</div>'+
         '<div class="pf-recl">'+rw.l+'</div>'+
         '<div class="pf-recc'+(ch?' chg':'')+'">'+(ch?'כעת '+rw.cur:'ללא שינוי')+'</div></div>';
    }
    h+='</div>';
    h+='<div class="pf-water">מים '+rec.water.toLocaleString()+' מ"ל'+
       (rec.water!==TARGETS.water?' <span class="chg">(כעת '+TARGETS.water.toLocaleString()+')</span>':'')+'</div>';
    if(same)
      h+='<div class="pf-same">היעדים שלך כבר תואמים את החישוב.</div>';
    else
      h+='<button class="pf-apply" onclick="applyTargets()">עדכן את היעדים לפי זה</button>'+
         '<div class="pf-hint">עד שתלחץ, שום דבר במעקב לא משתנה.</div>';
    if(targetsAreCustom())
      h+='<button class="pf-reset" onclick="resetTargets()">חזרה ליעדים המקוריים</button>';
    h+='</div>';
  } else {
    h+='<div class="card"><div class="cttl">יעד מומלץ</div>'+
       '<div class="pf-need">מלא את כל הפרטים למעלה ואחשב לך יעד קלוריות ומאקרו.</div></div>';
  }

  document.getElementById('content').innerHTML=h;
}

var CATS=[
  ['breakfast','בוקר'],
  ['lunch','צהריים'],
  ['dinner','ערב'],
  ['snack','נישנוש'],
  ['drinks','משקאות']
];
var QUESTIONS=[
  {id:'mood',type:'stars',text:'איך הייתה המזג שלך היום?'},
  {id:'body',type:'stars',text:'איך הגוף שלך הרגיש?'},
  {id:'moment',type:'text',text:'מה היה הרגע הכי טוב שלך היום?',placeholder:'כתוב במילים שלך...'},
  {id:'flow',type:'flow',text:'תרשים זרימת היום'},
  {id:'timeclock',type:'timeclock',text:'איך חולק הזמן שלך היום?'},
  {id:'workout',type:'text',text:'פעילות גופנית היום?',placeholder:'אימון כוח, ריצה, מנוחה...'},
  {id:'steps',type:'number',text:'כמה צעדים צעדת היום?',placeholder:'10000'},
  {id:'photo',type:'photo',text:'תמונת היום שלך'},
  {id:'song',type:'text',text:'השיר של היום?',placeholder:'שם השיר...'},
  {id:'differently',type:'text',text:'האם יש משהו שהיית רוצה לעשות אחרת?',placeholder:'אופציונלי — אם יש משהו...'},
  {id:'quote',type:'text',text:'משפט שתפס אותך היום',placeholder:'משפט, מחשבה, רגע...'}
];


function r2(v){return Math.round(v*100)/100;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var curDate=todayStr(),curTab='today',manOpen=false,libOpen=false,compOpen=false,compCat='breakfast';
var pendingLib=null,toastTimer,saveToLib=false;
var builderCat='breakfast',builderName='',builderIngs=[],builderPickOpen=false;
var interviewStep=-1,interviewAnswers={},calMonth=new Date();

function todayStr(){var d=new Date();return d.toISOString().slice(0,10);}
function fmtDate(s){
  var d=new Date(s+'T12:00:00');
  var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  return dn[d.getDay()]+', '+d.getDate()+' ב'+mn[d.getMonth()];
}
function fmtTime(){var d=new Date();return d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function showToast(msg){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){if(t.parentNode)t.remove();},2000);
}
function starsHTML(n,max){var s='';for(var i=1;i<=max;i++)s+='<span style="color:'+(i<=n?'#e8c162':'#f2ede6')+'">&#9733;</span>';return s;}

function loadDay(d){try{var x=localStorage.getItem('day_'+d);return x?JSON.parse(x):{meals:[],water:0};}catch(e){return{meals:[],water:0};}}
function saveDay(d,data){try{localStorage.setItem('day_'+d,JSON.stringify(data));}catch(e){}}
/* ── PHOTO STORE ──
   Photos used to sit as data URIs inside the day's record. localStorage has
   about 5MB for the whole app, a day photo is ~580KB and a flow anchor ~270KB,
   so three or four days filled it - and setItem failing throws into an empty
   catch, which means a summary would look saved and not be.

   Pictures now live in IndexedDB, whose quota is orders of magnitude larger,
   and a record keeps only a key. Rendering stays synchronous: markup carries
   data-photo="<key>" with no src, and hydratePhotos fills it in when the read
   comes back. Anything that still holds a data: URI - every photo written
   before this - keeps rendering directly, so nothing had to be migrated for
   the app to keep working. */
var _idb=null,_idbDead=false;
function idbOpen(){
  if(_idb)return Promise.resolve(_idb);
  if(_idbDead||!window.indexedDB)return Promise.resolve(null);
  return new Promise(function(res){
    var rq;
    try{rq=indexedDB.open('bm-photos',1);}catch(e){_idbDead=true;return res(null);}
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore('p');}catch(e){}};
    rq.onsuccess=function(){_idb=rq.result;res(_idb);};
    rq.onerror=function(){_idbDead=true;res(null);};
    rq.onblocked=function(){res(null);};
  });
}
function idbStore(mode){
  return idbOpen().then(function(db){
    if(!db)return null;
    try{return db.transaction('p',mode).objectStore('p');}catch(e){return null;}
  });
}
function photoPut(dataURI){
  var key='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  return idbStore('readwrite').then(function(st){
    if(!st)return null;
    return new Promise(function(res){
      var rq;
      try{rq=st.put(dataURI,key);}catch(e){return res(null);}
      rq.onsuccess=function(){res(key);};
      rq.onerror=function(){res(null);};
    });
  });
}
function photoGet(key){
  return idbStore('readonly').then(function(st){
    if(!st)return null;
    return new Promise(function(res){
      var rq;
      try{rq=st.get(key);}catch(e){return res(null);}
      rq.onsuccess=function(){res(rq.result||null);};
      rq.onerror=function(){res(null);};
    });
  });
}
function photoDel(ref){
  if(!isPhotoKey(ref))return Promise.resolve();
  return idbStore('readwrite').then(function(st){if(st){try{st.delete(ref);}catch(e){}}});
}
function photoAll(){
  return idbStore('readonly').then(function(st){
    if(!st)return {};
    return new Promise(function(res){
      var out={},rq;
      try{rq=st.openCursor();}catch(e){return res(out);}
      // only the pictures: a video Blob would stringify to "{}" in a backup
      rq.onsuccess=function(){var c=rq.result;if(!c)return res(out);
        if(typeof c.value==='string')out[c.key]=c.value;c.continue();};
      rq.onerror=function(){res(out);};
    });
  });
}
function photoPutKeyed(key,dataURI){
  return idbStore('readwrite').then(function(st){
    if(!st)return;
    try{st.put(dataURI,key);}catch(e){}
  });
}
// A legacy value is the picture itself; a new one is a key into the store.
function isPhotoKey(v){return !!v&&typeof v==='string'&&v.indexOf('data:')!==0;}
function photoImg(ref,attrs){
  if(!ref)return '';
  if(isPhotoKey(ref))return '<img data-photo="'+esc(ref)+'" '+(attrs||'')+'>';
  return '<img src="'+ref+'" '+(attrs||'')+'>';
}
function hydratePhotos(root){
  var els=(root||document).querySelectorAll('img[data-photo]'),i;
  for(i=0;i<els.length;i++)(function(el){
    var k=el.getAttribute('data-photo');
    el.removeAttribute('data-photo');
    photoGet(k).then(function(d){if(d)el.src=d;});
  })(els[i]);
}

/* ── VLOG ──
   Thirty seconds of you, talking, kept with the day it belongs to.

   Writing about a day and saying it out loud are not the same act. The
   written summary asks you to shape the day into sentences; a clip catches
   the tone of voice, which is often the part you would not have written
   down. So this is not another field in the interview - it is one button on
   the way in, and the clip lands in that day's summary beside everything
   else.

   Thirty seconds is the whole design. It is short enough that recording one
   is never a project, and short enough that a year of them is a few hundred
   megabytes rather than tens of gigabytes. The cap is enforced by the app,
   not by asking you to watch a clock: recording stops itself.

   The video is a Blob in the same IndexedDB store the photos use, under a
   key beginning with 'v'. Blobs go in whole - base64 would cost a third
   again in size and a visible pause on the phone for something the app only
   ever hands straight back to a <video> element. */
var VLOG_MAX=30;
function vlogKey(d){return 'vlog_'+d;}
function loadVlog(d){try{var x=localStorage.getItem(vlogKey(d));return x?JSON.parse(x):null;}catch(e){return null;}}
/* A vlog gets its own record rather than a field on the summary. A summary
   record means "this day has been reflected on" - the evening reminder goes
   quiet when one exists - and a clip recorded at noon must not be taken for
   an evening that has already been closed. */
function saveVlog(d,v){try{localStorage.setItem(vlogKey(d),JSON.stringify(v));}catch(e){}}
function clearVlog(d){
  var v=loadVlog(d);
  if(v&&v.k)photoDel(v.k);
  try{localStorage.removeItem(vlogKey(d));}catch(e){}
}
function vlogPut(blob){
  var key='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  return idbStore('readwrite').then(function(st){
    if(!st)return null;
    return new Promise(function(res){
      var rq;
      try{rq=st.put(blob,key);}catch(e){return res(null);}
      rq.onsuccess=function(){res(key);};
      rq.onerror=function(){res(null);};
    });

/* One-time move of the photos already written into the day records. Each one
   is written to the store before the record is rewritten, so a failure part
   way through leaves the original data URI in place rather than a dangling
   key. Runs quietly in the background; the app works either way. */
function migratePhotos(){
  var FLAG='photos_in_idb';
  try{if(localStorage.getItem(FLAG)==='1')return;}catch(e){return;}
  idbOpen().then(function(db){
    if(!db)return;
    var keys=[],i,k;
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf('sum_')===0)keys.push(k);}
    var chain=Promise.resolve();
    keys.forEach(function(sk){
      chain=chain.then(function(){
        var r;
        try{r=JSON.parse(localStorage.getItem(sk));}catch(e){return;}
        if(!r)return;
        var jobs=[],moved={n:0};
        if(r.photo&&!isPhotoKey(r.photo))
          jobs.push(photoPut(r.photo).then(function(key){if(key){r.photo=key;moved.n++;}}));
        if(Array.isArray(r.flow))r.flow.forEach(function(it){
          if(it&&typeof it==='object'&&it.p&&!isPhotoKey(it.p))
            jobs.push(photoPut(it.p).then(function(key){if(key){it.p=key;moved.n++;}}));
        });
        if(!jobs.length)return;
        return Promise.all(jobs).then(function(){
          if(moved.n){try{localStorage.setItem(sk,JSON.stringify(r));}catch(e){}}
        });
      });
    });
    return chain.then(function(){try{localStorage.setItem(FLAG,'1');}catch(e){}});
  });
}

/* flow has had three shapes: a comma-separated string, an array of strings,
   and now {w,p} so an anchor can carry its own photo. Everything reads it
   through here, so an old summary opens the same as a new one. */
function parseFlow(v){
  var out=[],i,s;
  if(Array.isArray(v)){
    for(i=0;i<v.length;i++){
      s=v[i];if(!s)continue;
      if(typeof s==='string'){if(s.trim())out.push({w:s.trim(),p:''});}
      else if(s.w||s.p)out.push({w:s.w||'',p:s.p||''});
    }
  } else if(typeof v==='string'&&v){
    var parts=v.split(/[,\n]|←|→/);
    for(i=0;i<parts.length;i++){s=parts[i].trim();if(s)out.push({w:s,p:''});}
  }
  return out;
}

   A web page has no access to HealthKit, and never will - that is Apple's
   line, not a gap in this app. The native shell this prototype is headed for
   does have it, and reaches the page through a WKWebView message handler.
   Everything Apple Health goes through this one seam: when the shell is
   present the source screen offers a real connect button, and when it is not
   it says so plainly. Nothing else in the app knows the difference. */
function nativeHealth(){
  try{
    var w=window.webkit&&window.webkit.messageHandlers;
    return(w&&w.health)?w.health:null;
  }catch(e){return null;}
}

// The shell calls this back with {"2026-08-30": 8412, ...} once HealthKit
// has answered. Same merge rule as every other source: it is a write, and
// the newest write for a day wins.
window.onHealthSteps=function(days){
  if(!days||typeof days!=='object')return 0;
  var n=0;
  Object.keys(days).forEach(function(d){
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&typeof days[d]==='number'){saveSteps(d,days[d],'health');n++;}
  });
  if(n){
    var s=loadStepsSrc();s.kind='health';s.last=new Date().toISOString();saveStepsSrc(s);
    showToast('✓ עודכן מ־Apple Health');
  }
  if(typeof _fitView!=='undefined'&&(_fitView==='steps'||_fitView==='steps-setup'))renderFitness();
  return n;
};

/* The token the shortcut posts alongside the step count. It is a bearer
   secret: whoever holds it can write steps for this install and nothing else.
   Generated once, on the setup screen, and never leaves the device except in
   the shortcut the user builds. */
function stepsToken(){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(/^[a-f0-9]{32}$/.test(t))return t;
  var a=new Uint8Array(16),i;
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  t='';for(i=0;i<16;i++)t+=('0'+a[i].toString(16)).slice(-2);
  try{localStorage.setItem('steps_token',t);}catch(e){}
  return t;
}

/* Pull whatever the shortcut has posted since we last looked. The newest write
   wins per day whatever wrote it, so a number typed by hand this morning is
   replaced by the watch's real count tonight - and a correction typed after
   the watch reported is not undone on the next sync. */
function syncStepsFromServer(cb){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(!SYNC_SERVER||!/^[a-f0-9]{32}$/.test(t)){if(cb)cb(false);return;}
  fetch(SYNC_SERVER+'/steps?token='+t,{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(o){
      if(!o||!o.days){if(cb)cb(false);return;}
      var changed=0;
      Object.keys(o.days).forEach(function(d){
        var remote=o.days[d];
        if(!remote||typeof remote.v!=='number')return;
        var local=loadSteps(d);
        if(local&&local.at&&remote.at&&new Date(local.at)>=new Date(remote.at))return;
        if(local&&local.v===remote.v)return;
        saveSteps(d,remote.v,'server');
        changed++;
      });
      if(changed){
        var s=loadStepsSrc();s.kind='server';s.last=new Date().toISOString();saveStepsSrc(s);
      }
      if(cb)cb(changed>0);
    })
    .catch(function(){if(cb)cb(false);});
}

/* ── THE FOOD DATABASE ──
   3,623 foods from the Ministry of Health's national table, every one of them
   per 100 g. It is fetched the first time the card is opened rather than at
   startup: 400KB is not worth spending on someone who only ever taps their
   own saved meals.

   The card paints its own results instead of going through render(), which
   rebuilds the whole screen and would take the keyboard away after every
   letter typed.

   The data file sits beside the app on the server and dev is one directory
   deeper, so the path is worked out from where the page itself is. */
function appBase(){
  return location.pathname.replace(/[^\/]*$/,'').replace(/(^|\/)dev\/$/,'$1');
}
/* ── HOW YOU COUNT A FOOD ──
   Everything here is stored per 100 g, which is the right way to store it and
   the wrong way to be asked about it. Nobody weighs a bread roll. Asking
   "how many grams?" about a thing that comes in ones makes you guess a number
   you do not know, and a guessed 80 is worse than a counted 1.

   So the food keeps its per-100g values and you pick how to count it. A unit
   is just a weight with a name: one roll is 80g, a spoon is 15g, and the
   arithmetic underneath never changes.

   The choice is remembered per food. You tell the app once that your roll is
   80 grams, and from then on that food opens asking how many rolls. That is
   the whole point - it has to stop asking. */
var FOOD_UNITS=[
  {k:'g',    t:'גרם',  one:'גרם',   many:'גרם',   g:1,   fixed:true},
  {k:'unit', t:'יחידה',one:'יחידה', many:'יחידות',g:100},
  {k:'slice',t:'פרוסה',one:'פרוסה', many:'פרוסות',g:30},
  {k:'cup',  t:'כוס',  one:'כוס',   many:'כוסות', g:240},
  {k:'tbsp', t:'כף',   one:'כף',    many:'כפות',  g:15},
  {k:'tsp',  t:'כפית', one:'כפית',  many:'כפיות', g:5}
];
var FOOD_UNITS_KEY='food_units';
function unitDef(k){for(var i=0;i<FOOD_UNITS.length;i++)if(FOOD_UNITS[i].k===k)return FOOD_UNITS[i];return FOOD_UNITS[0];}
function loadFoodUnits(){
  try{var o=JSON.parse(localStorage.getItem(FOOD_UNITS_KEY)||'{}');return (o&&typeof o==='object')?o:{};}
  catch(e){return {};}
}
/* A roll does not stop weighing 80 grams because you looked at grams for a
   moment, and a slice of it is not 80 either. So the record keeps the chosen
   way of counting AND a weight per kind of unit: switch to grams and back and
   the 80 is still there, switch to slices and it asks about slices. */
function foodUnitRec(name){
  var r=loadFoodUnits()[foodKey(name)];
  if(!r||typeof r!=='object')return {k:'g',w:{}};
  return {k:(r.k&&unitDef(r.k))?r.k:'g',w:(r.w&&typeof r.w==='object')?r.w:{}};
}
function unitWeightFor(name,k){
  if(k==='g')return 1;
  var w=foodUnitRec(name).w[k];
  return (typeof w==='number'&&w>0)?w:unitDef(k).g;
}
function foodUnitOf(name){
  var rec=foodUnitRec(name);
  return {k:rec.k,g:unitWeightFor(name,rec.k)};
}
function saveFoodUnit(name,k,g){
  var all=loadFoodUnits(),key=foodKey(name),rec=foodUnitRec(name);
  rec.k=k;
  if(k!=='g'&&g>0)rec.w[k]=g;
  all[key]={k:rec.k,w:rec.w};
  try{localStorage.setItem(FOOD_UNITS_KEY,JSON.stringify(all));}catch(e){}
}
// "2 יחידות" reads better than "2 יחידה"
function unitLabel(k,n){
  var d=unitDef(k);
  if(d.k==='g')return 'גרם';
  return (Math.abs(n)===1)?d.one:d.many;
}
function unitsRowHTML(name,cur,onPick){
  var h='<div class="fu-row">',i,u;
  for(i=0;i<FOOD_UNITS.length;i++){
    u=FOOD_UNITS[i];
    h+='<button class="fu-b'+(cur.k===u.k?' on':'')+'" onclick="'+onPick.replace('%K%',u.k)+'">'+u.t+'</button>';
  }
  return h+'</div>';
}

var _foods=null,_foodsState='idle';
var fdbOpen=false,fdbPick=null,fdbGrams=100,_fdbQ='';
var _fdbUnit={k:'g',g:1};   // what the number in the box is counting
/* Two sources, loaded together and searched as one.
   The ministry table is strong on generic foods and cooked dishes - חזה עוף,
   מרק עדשים - and thin on what is on a supermarket shelf. Open Food Facts is
   the other way round: branded, barcoded, and often with the packet's own
   serving size, which is what lets a thing be counted in ones rather than
   weighed.

   The products file is allowed to be missing. It is a large download that
   can be regenerated at any time, and an app that refuses to search because
   the second file is not there would be worse than one that searches the
   first. */
var FOOD_FILES=['data/foods.json','data/foods.off.json'];
function foodsLoad(then){
  if(_foodsState==='ready'){then();return;}
  if(_foodsState==='loading')return;
  _foodsState='loading';fdbPaint();
  var base=appBase();
  Promise.all(FOOD_FILES.map(function(f,idx){
    return fetch(base+f)
      .then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;})
      .then(function(d){
        // the first file is the one we cannot do without
        if(!d&&idx===0)throw new Error('no base table');
        return (d&&d.foods)||[];
      });
  })).then(function(sets){
    var all=[],seen=Object.create(null),i,j,f,key;
    for(i=0;i<sets.length;i++)for(j=0;j<sets[i].length;j++){
      f=sets[i][j];
      // matching ignores the punctuation Hebrew food names are inconsistent
      // about, so קוטג' and קוטג׳ and קוטג all find each other
      f.s=foodKey(f.n);
      key=f.s+'|'+f.k;
      if(seen[key])continue;      // the same product from both files
      seen[key]=1;all.push(f);
    }
    _foods=all;
    _foodsState='ready';then();
  }).catch(function(){_foodsState='error';fdbPaint();});
}
/* Matching a phrase as one string is why "לחם דגנים מלא" and "ריקוטה 5%"
   both came back as nothing: neither exists as a run of characters in any
   name, while "ריקוטה למריחה 5%, גד" contains both of its words and is
   obviously the right answer. Words, then - and it fails precisely when
   someone describes a food properly, which is the whole point of letting
   them type a sentence. */
/* Grammar and quantity are in the sentence but never in the food. No row of
   a food table is called "של" or "גרם" or "25", so requiring those words
   finds nothing - and counting one as a word found is how a boiled egg beat
   a protein shake: "של" from "שייק חלבון 25 גרם של מולר" scored a point
   inside "מבושל", and the egg's shorter name did the rest. */
var FOOD_STOP=('של עם ללא בלי על את אני זה היה הוא גרם גר מל ליטר קג כף כפית כוס יחידה יחידות מנה מנות')

  for(i=0;i<t.length;i++)if(t[i].length>=2)out.push(t[i]);

/* A short word has to sit at the start of a word in the name to count. Hebrew
   glues its prefixes on - בשוקולד is שוקולד - so a long word is allowed to
   match anywhere, where a chance collision is unlikely. It is the two and
   three letter ones that land inside other words and mean nothing. */

  if(tok.length>3)return name.indexOf(tok)>=0;
  var at=name.indexOf(tok);

   types עגבנייה; both are correct and neither contains the other, so a plain
   substring match finds nothing at all - 193 rows in the tables mention
   tomato and a search for עגבנייה returned none of them.

   Doubled yod and vav are the whole of the difference in nearly every case,
   so both sides collapse to the short spelling before anything is compared.
   It only ever makes matching more permissive: the key is never displayed
   and never stored as a name, it exists to be compared. */
function foodKey(s){
  return String(s).replace(/['’׳"“”״,.\-]/g,'')

   appear somewhere in the name; the phrase as written first, because when it
   does match it is the better answer. */

    if(at>0){phrase.push(f);continue;}
    all=true;
    for(j=0;j<toks.length;j++)if(!foodHas(f.s,toks[j])){all=false;break;}
    if(all)words.push(f);
  }
  // the shortest name is usually the plainest version of the thing
  words.sort(function(a,b){return a.s.length-b.s.length;});
  return starts.concat(phrase).concat(words).slice(0,40);
}

/* ── SCANNING A BARCODE ──

   decoding is done in JavaScript by html5-qrcode, vendored into the repo
   rather than pulled off a CDN: this app is meant to keep working when the
   network is poor, and a scanner that needs a third party to be up is not a
   scanner. It is 375KB and loads only when the scan button is pressed.

   The barcode is looked up in Open Food Facts, which carries Israeli
   supermarket products under their Hebrew names and hands back values per
   100 g - the same basis as the ministry database and the same "how many
   grams?" panel. Their licence asks for attribution, so the result says
   where it came from.

    '<div class="scan-hd"><span>סריקת ברקוד</span>'+
    '<button class="scan-x" onclick="scanClose()">&times;</button></div>'+
    '<div id="scan-cam" class="scan-cam">'+
      '<video id="scan-video" playsinline autoplay muted></video>'+

/* ── HOLD IT STILL, THEN PRESS ──
   Reading a barcode out of a live stream frame by frame failed on the phone:
   the frames a browser hands a scanning loop are small, motion-blurred and
   auto-exposed for the whole scene rather than for a strip of black and white
   lines. Freezing first is what the document scanners do, and it is the right
   shape for this - you get to line the barcode up while the preview is live,
   and the decoder gets one sharp full-resolution still instead of thirty poor
   ones a second.

   scanning loop, so the frame that gets decoded is the sensor's, at whatever
   resolution the phone will give. */

      if(b)b.disabled=false;

      // a stale camera complaint must not paint over the read's own message

function scanCamStop(){

function scanUnfreeze(){

  if(c)c.classList.remove('on');
  if(v)v.style.visibility='';

function scanShoot(){
  var v=document.getElementById('scan-video'),c=document.getElementById('scan-frozen'),b=document.getElementById('scan-shot');
  if(!v||!c||!v.videoWidth){scanMsg('המצלמה עוד לא מוכנה.');return;}

/* One still, tried several ways, cheapest and likeliest first.

   Measured rather than guessed: against blurred, rotated, low-contrast and
   unevenly lit test frames, every read that succeeded succeeded on the WHOLE
   frame at its own resolution. The cropped-and-upscaled attempts that used to
   run first failed on every single case - upscaling a crop with smoothing off
   turns soft bars into staircases and throws away the sub-pixel edges the
   decoder measures. So the crops come last, if at all.

   Rotation was the outright failure: a barcode at 90 degrees was never read.
   ZXing's 1D readers sweep horizontal lines, so a barcode running down the
   frame is invisible to them - and a phone held in portrait over a packet on
   a table produces exactly that. The frame is now offered at each quarter
   turn.

   A grey pass is tried too, stretched to full black-and-white, for the case
   the tests could not fake: a shiny wrapper under a ceiling light, where the
   bars are dark grey on light grey rather than black on white. */
/* ── READING THE DIGITS ──
   When the bars will not read, the number printed under them still will.

   The reason this is safe rather than a guess is the check digit: the last
   figure of a barcode is computed from the ones before it, so a misread is
   almost always arithmetically impossible and gets thrown away instead of
   sending us to look up somebody else's product. Only a number that checks
   out is looked up; digits that do not check out are put in the box below
   for you to correct, which still beats typing thirteen figures from
   scratch.

   several megabytes, and this whole flow already needs the network anyway -

var TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';

function tessLoad(){

    var s=document.createElement('script');
    s.src=TESS_URL;

// the last digit is computed from the rest, which is what makes a read

function gtinValid(s){

  var sum=0,mul=3,i;
  for(i=s.length-2;i>=0;i--){sum+=(+s[i])*mul;mul=(mul===3)?1:3;}
  return ((10-(sum%10))%10)===(+s[s.length-1]);

/* Pull the runs of digits out of the text and keep the ones that check.
   Only whole runs are tested, plus 13-digit windows of a longer one. Short
   substrings are deliberately not fished out of long ones: any random eight
   digits pass the check one time in ten, so hunting for an EAN-8 inside a
   thirteen-digit run manufactures a plausible wrong answer out of a misread,
   which is worse than admitting the read failed. */

      for(k=0;k+13<=r.length;k++){
        sub=r.substr(k,13);

function ocrDigits(cv){
  return tessLoad().then(function(){

        .then(function(){return w.recognize(cv);})
        .then(function(r){

          return w.terminate().then(function(){return t;},function(){return t;});
        })
        .catch(function(e){

function scanReadDigits(){
  var c=document.getElementById('scan-frozen');
  if(!c)return;
  scanMsg('הפסים לא נקראו. קורא את הספרות…');
  var views=[c,scanContrast(c),scanRotate(c,90),scanRotate(c,270)];
  var i=0,best='';
  function next(){
    if(i>=views.length){scanDigitsFailed(best);return;}
    var v=views[i++];
    scanMsg('קורא את הספרות… '+i+'/'+views.length);
    ocrDigits(v).then(function(text){
      var g=gtinFrom(text);
      if(g.valid.length){scanCamStop();barcodeLookup(g.valid[0]);return;}
      if(g.longest.length>best.length)best=g.longest;
      next();
    }).catch(function(){
      scanMsg('לא הצלחתי לטעון את קורא הספרות. אפשר להקליד אותן למטה.');

    });
  }

function scanDigitsFailed(best){

    try{f.focus();}catch(e){}
  } else {
    scanMsg('לא הצלחתי לקרוא. אפשר להקליד את הספרות שמתחת לפסים &mdash; זה תמיד עובד.');

}
function scanRetryButton(){
  var b=document.getElementById('scan-shot');
  if(b){b.disabled=false;b.textContent='נסה שוב';b.onclick=function(){this.onclick=scanShoot;scanUnfreeze();};}
}

function scanRotate(src,deg){
  if(!deg)return src;
  var swap=(deg===90||deg===270);
  var cv=document.createElement('canvas');
  cv.width=swap?src.height:src.width;
  cv.height=swap?src.width:src.height;
  var x=cv.getContext('2d');

function scanContrast(src){
  var cv=document.createElement('canvas');
  cv.width=src.width;cv.height=src.height;
  var x=cv.getContext('2d');

  var d;
  try{d=x.getImageData(0,0,cv.width,cv.height);}catch(e){return src;}
  var a=d.data,i,g,lo=255,hi=0;

  for(i=0;i<a.length;i+=4){
    g=(a[i]-lo)/span*255;
    a[i]=a[i+1]=a[i+2]=g<0?0:(g>255?255:g);

  cv.width=sw;cv.height=sh;

function scanDecodeFrozen(){

      {t:'רבע סיבוב',  f:function(){return scanRotate(c,90);}},
      {t:'רבע סיבוב',  f:function(){return scanRotate(c,270);}},
      {t:'ניגודיות',   f:function(){return scanContrast(c);}},
      {t:'ניגודיות',   f:function(){return scanContrast(scanRotate(c,90));}},
      {t:'הפוך',       f:function(){return scanRotate(c,180);}},
      {t:'הרצועה',     f:function(){return scanCrop(c,{x:0.02,y:0.20,w:0.96,h:0.60});}},
      {t:'הרצועה',     f:function(){return scanContrast(scanCrop(c,{x:0.02,y:0.20,w:0.96,h:0.60}));}}

function scanDecodeCanvas(cv){
  return new Promise(function(res){
    try{

        if(!b){res(null);return;}
        scanDecodeBlob(new File([b],'frame.png',{type:'image/png'})).then(res);
      },'image/png');
    }catch(e){res(null);}
  });
}
function scanDecodeBlob(file){
  return new Promise(function(res){
    var host=document.getElementById('scan-file-host');
    if(!host||!window.Html5Qrcode){res(null);return;}
    var F=window.Html5QrcodeSupportedFormats;
    var q;
    try{q=new Html5Qrcode('scan-file-host',F?{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]}:undefined);}

function scanPhoto(input){

  scanLibLoad().then(function(){
    scanDecodeBlob(f).then(function(txt){
      if(txt){scanCamStop();barcodeLookup(String(txt).trim());}
      else{
        var c=document.getElementById('scan-frozen');

          var im=new Image();
          im.onload=function(){
            c.width=im.naturalWidth;c.height=im.naturalHeight;
            c.getContext('2d').drawImage(im,0,0);

function scanStop(){scanCamStop();}
function scanClose(){

function scanTyped(){
  var el=document.getElementById('scan-code');

function barcodeLookup(code){

    .then(function(r){return r.json();})
    .then(function(j){
      var p=j&&j.product;
      if(!p||j.status===0){scanNotFound(code);return;}
      var n=p.nutriments||{};
      var k=n['energy-kcal_100g'];

        fdbGrams=1;
      } else {_fdbUnit={k:'g',g:1};fdbGrams=100;}
      fdbPaint();
      var box=document.getElementById('fdb-body');
      if(box)box.scrollIntoView({block:'center'});
    })
    .catch(function(){scanMsg('החיפוש נכשל. בדוק חיבור ונסה שוב.');});
}
function scanNotFound(code,partial){
  scanMsg((partial?'המוצר קיים אבל בלי ערכים תזונתיים.':'המוצר '+esc(code)+' לא נמצא במאגר.')+
          '<br>אפשר לחפש אותו בשם, או להוסיף ידנית.');
}


/* ── SAYING WHAT YOU ATE ──
   "אכלתי 2 ביצים ופרוסת לחם עם גבינה" is one sentence and five taps saved.

   The important part is what the model is NOT asked to do. It splits the
   sentence into {food, amount, unit} and nothing else - it is told it does not
   know the calories, and any it sends anyway are discarded at the worker. Each
   item is then looked up in the same 6,180 foods everything else here comes
   from.

   That is the whole design. It buys the speed of typing a sentence without
   giving up the thing a tracking app exists for: the same egg has to be the
   same egg in March and in September, and you have to be able to see which egg
   was chosen and change it. A model that invents 340 kcal gives you a number
   you cannot check and cannot reproduce.

   It also means very little leaves the phone: a few words, no history, no
   profile, no preferences. */
var _sayOpen=false,_sayBusy=false,_sayItems=null,_sayErr='';
/* '' is closed. Only one way is open at a time - they are alternatives, not
   a list, and two open at once was most of what made this sprawl. */
var _addMode='';
var ADD_WAYS=[
  {k:'say', ic:'&#x1F4AC;', t:'משפט'},
  {k:'find',ic:'&#x1F50D;', t:'חיפוש'},
  {k:'scan',ic:'&#x1F4F7;', t:'ברקוד'},
  {k:'lib', ic:'&#x1F4DA;', t:'שלי'},
  {k:'comp',ic:'&#x1F37D;', t:'מתכונים'},
  {k:'man', ic:'&#x270E;',  t:'ידני'}
];
function addSetMode(k){
  _fabOpen=false;
  // the scanner is a screen of its own, not a panel - it opens over
  if(k==='scan'){scanOpen();return;}
  _addMode=(_addMode===k)?'':k;
  _sayOpen=(_addMode==='say');
  fdbOpen=(_addMode==='find');
  libOpen=(_addMode==='lib');
  compOpen=(_addMode==='comp');
  manOpen=(_addMode==='man');
  if(_addMode!=='say'){_sayItems=null;_sayErr='';}
  if(_addMode!=='find')pendingLib=null;
  render();
  if(_addMode==='find'){
    foodsLoad(fdbPaint);
    setTimeout(function(){var e=document.getElementById('fdb-q');if(e)e.focus();},60);
  }
  if(_addMode==='say'){
    foodsLoad(function(){});
    setTimeout(function(){var e=document.getElementById('say-in');if(e)e.focus();},60);
  }
}
/* ── THE WAY IN ──
   Six ways to record a meal used to sit as a row of six across the top of a
   card, permanently, whether you were adding anything or not. Six choices is
   a lot to look at while reading what you already ate.

   They live behind one button now, at the foot of the screen where a thumb
   rests, and fan out in an arc when it is pressed. Closed, the screen is the
   day. Open, it is the six ways in and nothing else - a scrim behind them,
   so a tap anywhere closes it again.

   The first way sits on the right, because that is where reading starts
   here. */
var _fabOpen=false;
/* Six pills side by side need 480px of width; a phone has 375. Six discs of
   54px on an arc of this radius sit 64px apart along it, which clears. So
   the name goes inside the disc with the icon, not on a tag beside it. */
var FAB_R=142, FAB_A0=25, FAB_A1=155;   // radius, and the sweep in degrees
function fabToggle(){_fabOpen=!_fabOpen;fabPaint();}
function fabClose(){if(!_fabOpen)return;_fabOpen=false;fabPaint();}
function fabPick(k){
  _fabOpen=false;
  addSetMode(k);            // renders the screen, panel and all
  // and put the panel where it can be seen, rather than under the thumb
  setTimeout(function(){
    var p=document.querySelector('.aw-card');
    if(p&&p.scrollIntoView)p.scrollIntoView({block:'center',behavior:'smooth'});
  },60);
}
function fabPaint(){
  var w=document.getElementById('add-fab');
  if(w)w.className='fab-wrap'+(_fabOpen?' open':'');
  // the scrim is a sibling, not a child, so it is switched by hand
  var sc=document.querySelector('.fab-scrim');
  if(sc){sc.style.opacity=_fabOpen?'1':'0';sc.style.pointerEvents=_fabOpen?'auto':'none';}
}
function addFabHTML(){
  var n=ADD_WAYS.length,h='',i,w,a,x,y;
  h+='<div class="fab-scrim" onclick="fabClose()"></div>';
  h+='<div class="fab-wrap" id="add-fab">';
  for(i=0;i<n;i++){
    w=ADD_WAYS[i];
    a=(FAB_A0+(FAB_A1-FAB_A0)/(n-1)*i)*Math.PI/180;
    x=Math.round(Math.cos(a)*FAB_R);
    y=Math.round(-Math.sin(a)*FAB_R);
    h+='<button class="fab-i" style="--x:'+x+'px;--y:'+y+'px;--d:'+(i*26)+'ms" '+
       'onclick="fabPick(&quot;'+w.k+'&quot;)">'+
       '<span class="fab-ic">'+w.ic+'</span>'+
       '<span class="fab-t">'+w.t+'</span></button>';
  }
  h+='<button class="fab-b" onclick="fabToggle()" aria-label="הוסף ארוחה">'+
     '<svg viewBox="0 0 24 24"><path d="M12 5.5v13"/><path d="M5.5 12h13"/></svg></button>';
  h+='</div>';
  return h;
}
/* The panel only exists once a way has been chosen. A card with a heading
   and nothing under it is a card that has to be read and then dismissed. */
function addPanelHTML(inner){
  var i,w=null;
  for(i=0;i<ADD_WAYS.length;i++)if(ADD_WAYS[i].k===_addMode)w=ADD_WAYS[i];
  if(!_addMode||!w||!inner)return '';
  return '<div class="aw-card"><div class="aw-hd">'+
    '<span class="aw-hic">'+w.ic+'</span><span class="aw-ht">'+w.t+'</span>'+
    '<button class="aw-x" onclick="addSetMode(&quot;'+_addMode+'&quot;)" aria-label="סגור">&times;</button>'+
    '</div>'+inner+'</div>';
}
function sayToggle(){addSetMode('say');}
function sayGo(){
  var el=document.getElementById('say-in');
  var text=el?el.value.trim():'';
  if(text.length<2){_sayErr='כתוב מה אכלת.';sayPaint();return;}
  if(!SYNC_SERVER){_sayErr='הפירוק דורש חיבור לשרת.';sayPaint();return;}
  _sayBusy=true;_sayErr='';_sayItems=null;sayPaint();
  foodsLoad(function(){});
  fetch(SYNC_SERVER+'/parse',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text})
  }).then(function(r){return r.json();})
    .then(function(j){
      _sayBusy=false;
      if(!j||!j.ok||!j.items||!j.items.length){
        _sayErr=(j&&j.error==='too many for today')?'הגעת למכסה היומית של הפירוק.'
               :'לא הצלחתי לקרוא את זה. נסה לנסח אחרת, או חפש ידנית.';
        sayPaint();return;
      }
      /* The rows have to be resolved against the server before the panel can
         paint, so the message stays up while that happens. The food tables
         also have to be in memory by now - the candidate list is built from
         them - so this waits on the same load the panel already started. */
      _sayBusy=true;sayPaint();
      foodsLoad(function(){
        sayResolveAll(j.items,function(rows){
          _sayBusy=false;_sayItems=rows;_sayRow=-1;
          sayPaint();
        });
      });
    })
    .catch(function(){_sayBusy=false;_sayErr='אין חיבור כרגע.';sayPaint();});
}
/* ── ASKING THE SERVER WHICH ROW THIS IS ──
   The local scorer below is a string comparison, and a string comparison was
   never going to get from "שייק חלבון של מולר" to a row filed as "יוגורט 25
   גרם חלבון נטול לקטוז, מולר". Not one word the user typed is a word the
   table uses, and מולר, Muller and Müller are three different strings. It
   answered with another company's protein powder, and nothing on the screen
   said so.

   So the shortlist is built here - generously, on ANY word rather than the
   first one, which is the gate that used to throw away every Muller row - and
   the server picks from it. The reply is an index into the list we sent plus
   a weight in grams. It cannot contain a calorie or a gram of protein; those
   still come from our own tables, so a wrong answer is a wrong ROW, which is
   visible and one tap from being fixed, rather than a wrong number, which is
   not. */
function sayCandidates(q,n){
  var toks=foodTokens(q),out=[],i,j,hits;
  if(!_foods)return [];
  for(i=0;i<_foods.length;i++){
    hits=0;
    for(j=0;j<toks.length;j++)if(foodHas(_foods[i].s,toks[j]))hits++;
    if(hits)out.push({f:_foods[i],h:hits});
  }
  // most words matched first, then the plainest name
  out.sort(function(a,b){return b.h-a.h||a.f.s.length-b.f.s.length;});
  return out.slice(0,n||60).map(function(x){return x.f;});
}
/* A name that declares "25 גרם חלבון" is telling you what the whole pot
   holds, and the row already says how much protein is in 100 g. The pot's
   weight is then arithmetic rather than anybody's estimate:
       grams = declared / per100 * 100
   It applies to two rows in the whole database, so it is not the answer to
   the portion problem - but where it applies it is exact, and it is how the
   one product this was reported against gets 200 g instead of the 100 g the
   row wrongly claims. */
function deriveGrams(f){
  if(!f||!(f.p>0))return 0;
  var m=String(f.n).match(/(\d+(?:\.\d+)?)\s*(?:גרם|גר'?|g)\s*(?:חלבון|protein)/i);
  if(!m)return 0;
  var g=Math.round(Number(m[1])/f.p*100);
  return (g>=20&&g<=2000)?g:0;
}
/* Repeat foods are most foods, so an answer is kept. It also means the app
   still resolves a food you have logged before with no network at all. */
var MATCH_KEY='food_match';
function matchCache(){
  try{var o=JSON.parse(localStorage.getItem(MATCH_KEY)||'{}');return (o&&typeof o==='object')?o:{};}
  catch(e){return {};}
}
function matchCachePut(q,v){
  try{
    var all=matchCache(),keys=Object.keys(all);
    // keep it from growing without limit; oldest out first
    if(keys.length>400)for(var i=0;i<80;i++)delete all[keys[i]];
    all[foodKey(q)]=v;
    localStorage.setItem(MATCH_KEY,JSON.stringify(all));
  }catch(e){}
}
function matchCacheGet(q){
  var v=matchCache()[foodKey(q)];
  return (v&&typeof v==='object'&&typeof v.n==='string')?v:null;
}
/* One row, resolved against the server, falling back to the local scorer
   whenever there is no answer - no network, no key, over the daily cap. The
   fallback is the old behaviour exactly, so the feature degrades to what the
   app did before rather than to an error. */
function sayResolveAI(it,done){
  var local=sayResolve(it);
  var q=it.food;
  var hit=matchCacheGet(q);
  if(hit){done(sayApplyMatch(local,hit.n,hit.g,hit.s));return;}
  if(!SYNC_SERVER){done(local);return;}
  var cands=sayCandidates(q,60);
  if(!cands.length){done(local);return;}
  var names=cands.map(function(c){return c.n;});
  var t=setTimeout(function(){t=0;done(local);},9000);   // never hang the panel
  fetch(SYNC_SERVER+'/match',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q:q,unit:it.unit||'unit',cands:names})
  }).then(function(r){return r.json();})
    .then(function(j){
      if(!t)return; clearTimeout(t); t=0;
      if(!j||!j.ok||j.pick<0||!cands[j.pick]){done(local);return;}
      var f=cands[j.pick];
      matchCachePut(q,{n:f.n,g:j.grams||0,s:!!j.sure});
      done(sayApplyMatch(local,f.n,j.grams||0,!!j.sure));
    })
    .catch(function(){ if(t){clearTimeout(t);t=0;done(local);} });
}
/* Which weight to believe, best evidence first. The order matters more than
   any single source: a weight you set yourself is a decision, a declared
   claim is arithmetic, a packet size is a fact printed on the product, and
   the model's number is an estimate that says so. The old code had only the
   last two and showed them identically. */
function sayApplyMatch(local,name,aiGrams,sure){
  var f=null,i;
  for(i=0;i<_foods.length;i++)if(_foods[i].n===name){f=_foods[i];break;}
  if(!f)return local;
  local.food=f;
  local.alts=sayCandidates(local.q,4).filter(function(x){return x.n!==name;}).slice(0,3);
  if(local.unit==='g'){local.g=1;local.gsrc='exact';return local;}
  var learned=foodUnitRec(f.n).w[local.unit];
  if(learned>0){local.g=learned;local.gsrc='learned';return local;}
  var der=deriveGrams(f);
  if(der>0&&local.unit==='unit'){local.g=der;local.gsrc='derived';return local;}
  if(f.u>0&&local.unit==='unit'){local.g=f.u;local.gsrc='packet';return local;}
  if(aiGrams>0){local.g=aiGrams;local.gsrc=sure?'ai':'guess';return local;}
  return local;
}
// every row, in parallel, and the panel paints once they are all in
function sayResolveAll(items,done){
  var out=new Array(items.length),left=items.length;
  if(!left){done([]);return;}
  items.forEach(function(it,i){
    sayResolveAI(it,function(row){
      out[i]=row;
      if(--left===0)done(out);
    });
  });
}
/* Matching a word to a row of a food table is a guess, and the honest way to
   handle a guess is to make it visible and easy to overrule - which is why
   every matched row here can be tapped and re-chosen.

   The scoring: an exact name wins, then a name starting with the word, then
   a shorter name over a longer one. Two things had to be added after seeing
   it work. "ביצה" was landing on "ביצה חלבון מיובש" - dried egg white -
   because it happened to tie for shortest, so a name carrying a form nobody
   means by default (dried, powdered, frozen, tinned) is pushed down unless
   the word was actually said. And a name that begins with the word as a
   whole word, rather than as the start of a longer one, is preferred. */
var SAY_DERIVED=['מיובש','מיובשת','אבקה','אבקת','מרוכז','מרוכזת','קפוא','קפואה','משומר','משומרת','תחליף','לא מבושל','לא מבושלת'];
function sayScore(f,q,toks){
  toks=toks||foodTokens(q);
  /* The longest word carries the meaning - ריקוטה, not 5% - so a name that
     misses it is not the food however many of the others it happens to
     contain. Past that, every word found counts, and more of them beats a
     shorter name. */
  var i,gate=arguments.length>3?arguments[3]:null;
  if(!gate){
    gate=toks[0];
    for(i=1;i<toks.length;i++)if(toks[i].length>gate.length)gate=toks[i];
  }
  if(f.s.indexOf(gate)<0)return -1;
  var hits=0;
  for(i=0;i<toks.length;i++)if(foodHas(f.s,toks[i]))hits++;
  var score=hits*4000+(1000-f.s.length);
  var at=f.s.indexOf(toks[0]);
  if(at===0)score+=500;
  if(f.s===foodKey(q))score+=6000;
  for(var d=0;d<SAY_DERIVED.length;d++)
    if(f.s.indexOf(SAY_DERIVED[d])>=0&&q.indexOf(SAY_DERIVED[d])<0)score-=2500;
  return score;
}
/* No amount of scoring is going to know that "ביצה" means a hen's egg and
   not a turkey's - the tables have no plain entry for either, and tuning the
   heuristic against examples would go on forever and still be wrong on the
   next word.

   So it picks the best it has and shows the runners-up beside it. One tap
   switches. That is faster than being right most of the time and hiding it
   when you are not, and it keeps the promise the whole feature rests on: you
   can see what was chosen and you can change it. */
/* Which word has to be there. Hebrew names the thing first and describes it
   afterwards - ביצה מבושלת, חזה עוף, לחם מלא - so the first word is the food
   and the rest is about it. Insisting on the longest word instead made
   ביצה מבושלת gate on מבושלת and come back with boiled leek: a perfect match
   on the cooking and none at all on the food.

   So the first word is tried first, and only if nothing in the tables has it
   does the longest word get a turn - which still rescues a sentence opening
   with a word the tables have never heard of. */
function sayResolve(it){
  var q=foodKey(it.food),toks=foodTokens(it.food),ranked=[],i,score;
  function rank(gate){
    var out=[];
    if(_foods)for(var j=0;j<_foods.length;j++){
      var sc=sayScore(_foods[j],q,toks,gate);
      if(sc>=0)out.push({f:_foods[j],s:sc});
    }
    return out;
  }
  ranked=rank(toks[0]);
  if(!ranked.length)ranked=rank(null);
  ranked.sort(function(a,b){return b.s-a.s;});
  var best=ranked.length?ranked[0].f:null;
  /* Naming three or more things and matching only one of them is not a near
     miss, it is a different food. Better to say nothing was found - the panel
     already offers adding it by hand - than to hand back something confident
     and wrong. */
  if(best&&toks.length>=3){
    var got=0;
    for(i=0;i<toks.length;i++)if(foodHas(best.s,toks[i]))got++;
    if(got<2){best=null;ranked=[];}
  }
  var alts=best?ranked.slice(1,4).map(function(r){return r.f;}):[];
  var unit=it.unit||'unit';
  var g=(unit==='g')?1:unitWeightFor(best?best.n:it.food,unit);
  /* Where the weight came from matters as much as the weight. A packet that
     declares 350ml is a fact; a weight you set once is a memory; anything
     else is a house default that has never seen this food. The third kind
     used to look exactly like the first two, which is how one 350ml shake
     was logged as 100g and reported a third of its protein. */
  var src='guess';
  if(unit==='g')src='exact';
  else if(best&&best.u>0&&unit==='unit'){g=best.u;src='packet';}
  else if(foodUnitRec(best?best.n:it.food).w[unit]>0)src='learned';
  return {q:it.food,amount:it.amount,unit:unit,g:g,food:best,alts:alts,gsrc:src};
}
var GSRC_SAY={
  learned:'המשקל ששמרת בפעם הקודמת.',
  derived:'חושב מהחלבון שהמוצר מצהיר עליו ומהערך ל־100 גרם — לא הערכה.',
  packet:'הגודל שמוצהר על האריזה.',
  ai:'הערכה של גודל המנה. תקן אם צריך, וזה ייזכר.'
};
function sayAmount(row){
  if(!row.food)return null;
  var grams=row.amount*(row.unit==='g'?1:row.g);
  var m=grams/100;
  return {kcal:Math.round(row.food.k*m),p:Math.round(row.food.p*m*10)/10,
          c:Math.round(row.food.c*m*10)/10,f:Math.round(row.food.f*m*10)/10,grams:grams};
}
function saySetAmount(i,v){
  if(!_sayItems||!_sayItems[i])return;
  var n=parseFloat(v);
  _sayItems[i].amount=(isFinite(n)&&n>0)?n:0;
  var el=document.getElementById('say-tot');
  if(el)el.innerHTML=sayTotalHTML();
  var one=document.getElementById('say-k-'+i);
  if(one){var a=sayAmount(_sayItems[i]);one.textContent=a?a.kcal:'';}
}
// swapping in a runner-up puts the one it replaces back among them, so the
// choice can be walked back as easily as it was made
function sayUseAlt(i,a){
  var row=_sayItems&&_sayItems[i];
  if(!row||!row.alts||!row.alts[a])return;
  var picked=row.alts[a];
  row.alts[a]=row.food;
  row.food=picked;
  if(row.unit!=='g'){
    row.g=unitWeightFor(picked.n,row.unit);
    if(picked.u>0&&row.unit==='unit')row.g=picked.u;
  }
  sayPaint();
}
function saySetWeight(i,v){
  if(!_sayItems||!_sayItems[i])return;
  var g=parseFloat(v);
  if(!(g>0))return;
  var row=_sayItems[i];
  row.g=g;
  if(row.food)saveFoodUnit(row.food.n,row.unit,g);   // told once, remembered
  var one=document.getElementById('say-k-'+i);
  var a=sayAmount(row);
  if(one&&a)one.textContent=a.kcal;
  var t=document.getElementById('say-tot');
  if(t)t.innerHTML=sayTotalHTML();
}
function saySetUnit(i,k){
  if(!_sayItems||!_sayItems[i])return;
  var row=_sayItems[i];
  row.unit=k;
  row.g=(k==='g')?1:unitWeightFor(row.food?row.food.n:row.q,k);
  if(row.food&&row.food.u>0&&k==='unit')row.g=row.food.u;
  sayPaint();
}
function sayDrop(i){
  if(!_sayItems)return;
  _sayItems.splice(i,1);
  sayPaint();
}
// an item we could not match is not a failure of the sentence - it is a search
function sayLookup(i){
  var row=_sayItems&&_sayItems[i];
  if(!row)return;
  _sayOpen=false;_sayItems=null;
  fdbOpen=true;_fdbQ=row.q;render();
  setTimeout(function(){var e=document.getElementById('fdb-q');if(e)e.focus();fdbPaint();},60);
}
function sayTotals(){
  var t={kcal:0,p:0,c:0,f:0,n:0},i,a;
  if(_sayItems)for(i=0;i<_sayItems.length;i++){
    a=sayAmount(_sayItems[i]);
    if(!a)continue;
    t.kcal+=a.kcal;t.p+=a.p;t.c+=a.c;t.f+=a.f;t.n++;
  }
  t.p=Math.round(t.p*10)/10;t.c=Math.round(t.c*10)/10;t.f=Math.round(t.f*10)/10;
  return t;
}
/* The total is the line you read before deciding to add, so it says what
   the numbers are. ח, פ and ש are fine on a chip inside a crowded row;
   here there is room, and a total that has to be decoded is not a total. */
function sayTotalHTML(){
  var t=sayTotals();
  if(!t.n)return '<span class="st-none">אין פריטים שזוהו</span>';
  return '<div class="st-k">'+t.kcal.toLocaleString()+' <span>קלוריות</span></div>'+
         '<div class="st-m">'+
         '<span><b>'+t.p+'</b> גרם חלבון</span>'+
         '<span><b>'+t.c+'</b> גרם פחמימות</span>'+
         '<span><b>'+t.f+'</b> גרם שומן</span>'+
         '</div>';
}
/* ── ESTIMATING ONE LINE OF A SENTENCE ──
   The estimate was only reachable from the search panel, which is the wrong
   place for it: writing the sentence is the fast way in, and a sentence
   naming three things where one of them is not in the tables was a dead end
   for the whole sentence. You could search for the missing one, but that
   means leaving the panel and losing the other two.

   So it fills the row where it stands. The other rows keep their matched
   values, the estimated one is marked as estimated, and one press still adds
   all of them to the day. */
function sayEstimate(i){
  var row=_sayItems&&_sayItems[i];
  if(!row)return;
  if(!SYNC_SERVER){showToast('ההערכה דורשת חיבור לשרת');return;}
  row.esting=true;sayPaint();
  fetch(SYNC_SERVER+'/estimate',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({food:row.q})
  }).then(function(r){return r.json();})
    .then(function(j){
      row.esting=false;
      if(!j||j.error||j.ok===false){
        showToast(j&&j.why?j.why:'לא הצלחתי להעריך את זה');
        sayPaint();return;
      }
      /* A synthetic row, shaped exactly like one out of the tables so that
         everything downstream keeps working - but carrying est so it can
         never be mistaken for one. */
      row.food={n:row.q,k:j.per100.kcal,p:j.per100.p,c:j.per100.c,f:j.per100.f,est:1};
      row.est=1;row.assumed=j.assumed||'';
      row.alts=[];
      if(row.unit==='g'){row.g=1;row.gsrc='exact';}
      else{row.g=j.serving_g>0?j.serving_g:100;row.gsrc='ai';}
      sayPaint();
    })
    .catch(function(){row.esting=false;showToast('אין חיבור כרגע');sayPaint();});
}
function sayAdd(){
  if(!_sayItems)return;
  var day=loadDay(curDate),i,row,a,n=0;
  for(i=0;i<_sayItems.length;i++){
    row=_sayItems[i];a=sayAmount(row);
    if(!a||!row.amount)continue;
    var how=(row.unit==='g')?(row.amount+'g'):(row.amount+' '+unitLabel(row.unit,row.amount));
    var rec={name:row.food.n+' ('+how+')',kcal:a.kcal,p:a.p,c:a.c,f:a.f,
             id:Date.now()+i,time:fmtTime()};
    // carried through, or the log would show it as a measured value
    if(row.est)rec.est=1;
    day.meals.push(rec);
    n++;
  }
  if(!n){showToast('אין מה להוסיף');return;}
  saveDay(curDate,day);
  showToast('✓ '+n+' '+(n===1?'פריט נוסף':'פריטים נוספו'));
  _sayOpen=false;_sayItems=null;render();
}
/* ── ONE LINE EACH ──
   Every row was showing five things at once: what it matched, what you said,
   three alternatives, the amount, and what one of them weighs. Four of those
   are corrections, and the ordinary case is reading the line and pressing
   add. So a row is the answer and the amount, and everything you might want
   to overrule opens when you tap it. */
var _sayRow=-1;
function sayExpand(i){_sayRow=(_sayRow===i)?-1:i;sayPaint();}
function sayPaint(){
  var el=document.getElementById('say-body');
  if(!el)return;
  if(_sayBusy){el.innerHTML='<div class="say-msg">קורא מה כתבת…</div>';return;}
  if(_sayErr){el.innerHTML='<div class="say-msg">'+esc(_sayErr)+'</div>';return;}
  if(!_sayItems){el.innerHTML='';return;}
  var h='',i,row,a,open;
  for(i=0;i<_sayItems.length;i++){
    row=_sayItems[i];a=sayAmount(row);open=(_sayRow===i);
    h+='<div class="sr'+(open?' open':'')+(row.food?'':' miss')+'">';

    // the line you read
    h+='<div class="sr-top">';
    h+='<button class="sr-x" onclick="sayDrop('+i+')">&times;</button>';
    if(row.food){
      h+='<button class="sr-name" onclick="sayExpand('+i+')">'+esc(row.food.n)+
         (row.est?'<span class="sr-esttag">הערכה</span>':'')+
         '<span class="sr-chev">'+(open?'&#8963;':'&#8964;')+'</span></button>';
      h+='<span class="sr-k" id="say-k-'+i+'">'+(a?a.kcal:'')+'</span>';
    } else {
      h+='<button class="sr-name" onclick="sayLookup('+i+')">'+esc(row.q)+
         '<span class="sr-find">חפש</span></button>';
      h+=row.esting?'<span class="sr-esting">מעריך…</span>'
                   :'<button class="sr-est" onclick="sayEstimate('+i+')">הערך</button>';
    }
    h+='</div>';

    if(row.food){
      // the amount, always - it is the one thing people do change
      h+='<div class="sr-amt">';
      h+='<input class="sr-in" type="number" inputmode="decimal" step="'+(row.unit==='g'?'1':'0.5')+'" value="'+row.amount+'" oninput="saySetAmount('+i+',this.value)">';
      h+='<select class="sr-u" onchange="saySetUnit('+i+',this.value)">';
      for(var u=0;u<FOOD_UNITS.length;u++)
        h+='<option value="'+FOOD_UNITS[u].k+'"'+(row.unit===FOOD_UNITS[u].k?' selected':'')+'>'+FOOD_UNITS[u].t+'</option>';
      h+='</select><span class="sr-kl">קק"ל</span>';
      /* And what one of them weighs, on the line rather than hidden behind a
         tap - it is the number that decides everything else, and when it is a
         guess it says so and opens for correcting. */
      if(row.unit!=='g'){
        var gw=Math.round(row.amount*row.g);
        h+='<button class="sr-g'+(row.gsrc==='guess'?' guess':'')+'" onclick="sayExpand('+i+')">'+
           (row.gsrc==='guess'?'~':'')+gw+' גרם'+(row.gsrc==='guess'?' ?':'')+'</button>';
      }
      h+='</div>';

      // and the rest only when asked for
      if(open){
        h+='<div class="sr-more">';
        if(foodKey(row.food.n)!==foodKey(row.q))
          h+='<div class="sr-said">אמרת: '+esc(row.q)+'</div>';
        if(row.est&&row.assumed)
          h+='<div class="sr-src">'+esc(row.assumed)+'</div>';
        if(row.parts&&row.parts.length){
          h+='<div class="sr-parts">';
          for(var pi=0;pi<row.parts.length;pi++){
            var pp=row.parts[pi];
            h+='<div><span>'+esc(pp.label)+(pp.src==='ai'?' <i>הערכה</i>':'')+'</span>'+
               '<span>'+pp.g+'g &middot; '+pp.kcal+'</span></div>';
          }
          h+='</div><div class="sr-src">'+row.measured+'% מהקלוריות מערכים מדודים במאגר.</div>';
        }
        if(row.unit!=='g'&&GSRC_SAY[row.gsrc])
          h+='<div class="sr-src">'+GSRC_SAY[row.gsrc]+'</div>';
        if(row.unit!=='g'&&row.gsrc==='guess')
          h+='<div class="sr-warn">לא ידוע כמה שוקלת יחידה אחת מהמוצר הזה. '+
             'המספר למטה הוא ברירת מחדל &mdash; תקן אותו והוא ייזכר.</div>';
        if(row.unit!=='g')
          h+='<div class="sr-w">'+unitDef(row.unit).one+' = '+
             '<input class="sr-win" type="number" inputmode="decimal" value="'+row.g+'" oninput="saySetWeight('+i+',this.value)"> גרם</div>';
        if(row.alts&&row.alts.length){
          h+='<div class="sr-alts">';
          for(var ai=0;ai<row.alts.length;ai++)
            h+='<button class="sr-alt" onclick="sayUseAlt('+i+','+ai+')">'+esc(row.alts[ai].n.slice(0,30))+'</button>';
          h+='</div>';
        }
        /* The matcher nearly always returns something - it offered a frozen
           vegetable mix for a grandmother’s quiche - so a row with no match at
           all is rare, and putting the estimate only there made it almost
           unreachable. The place you actually want it is here: the match came
           back wrong and none of the alternatives are it either. */
        if(!row.est){
          h+='<button class="sr-estall" onclick="sayEstimate('+i+')">'+
             (row.esting?'מעריך…':'הערכה מהירה של מה שכתבתי')+'</button>';
          h+='<button class="sr-anall" onclick="sayAnalyze('+i+')">'+
             (row.esting?'מפרק…':'פירוק מעמיק — לפי מרכיבים מהמאגר')+'</button>';
        }
        h+='<button class="sr-other" onclick="sayLookup('+i+')">משהו אחר לגמרי…</button>';
        h+='</div>';
      }
    }
    h+='</div>';
  }
  h+='<div class="say-tot" id="say-tot">'+sayTotalHTML()+'</div>';
  h+='<button class="say-add" onclick="sayAdd()">הוסף הכל ליום ✓</button>';
  h+='<div class="say-note">המספרים מהמאגר שלנו. הקש על שורה כדי לשנות.</div>';
  el.innerHTML=h;
}

function fdbToggle(){fdbPick=null;addSetMode('find');}
/* ── THE SEARCH LINE ──
   foodSearch below requires every word typed to appear in the stored name.
   That is why this box returned nothing at all for "שייק חלבון מולר": the row
   is filed as "יוגורט 25 גרם חלבון נטול לקטוז, מולר", so "שייק" is absent and
   the record is discarded before anything is scored. It also means the box
   only ever worked in the language a row happens to be written in - the
   tables carry both Hebrew and Latin names, and "protein yogurt muller"
   found nothing whatsoever.

   So the typed words still search instantly and locally, and a moment after
   typing stops the same shortlist goes to the server, which names the rows
   that ARE the food in any language. Those appear above the literal matches
   and say where they came from. Nothing blocks: the local list is on screen
   the whole time, and if the request fails or there is no network the box
   behaves exactly as it did before.

   The language handling is free here rather than a feature to build later -
   a model reading "protein yogurt muller" against a Hebrew row needs no
   dictionary, no translation table and no second index. */
var _fdbAI=null,_fdbAIQ='',_fdbAIBusy=false,_fdbTimer=0;
function fdbType(v){
  _fdbQ=v;fdbPick=null;
  if(_fdbTimer){clearTimeout(_fdbTimer);_fdbTimer=0;}
  var q=String(v||'').trim();
  if(foodKey(q)!==foodKey(_fdbAIQ)){_fdbAI=null;_fdbAIBusy=false;}
  fdbPaint();
  // a request per keystroke would be absurd; this waits for a pause
  if(q.length>=2&&SYNC_SERVER)_fdbTimer=setTimeout(function(){fdbAIGo(q);},650);
}
function fdbAskMatch(q,cands,done){
  fetch(SYNC_SERVER+'/match',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q:q,unit:'unit',n:5,cands:cands.map(function(c){return c.n;})})
  }).then(function(r){return r.json();}).then(done).catch(function(){done(null);});
}
/* The shortlist is built by string matching, so a query in another language
   arrives with a list that never contained the answer - the model can only
   choose badly from it. "protein yogurt muller" reached three wrong yogurts
   for exactly that reason: no Hebrew Muller row shares a character with the
   words typed.

   So the reply also names the words the table itself would use. When those
   words find rows the first search never looked at, the question is asked
   once more with them. Two round trips, only when the model names something
   new - which for a query in the language the rows are already written in is
   almost never. It is also the whole of what another language needs: no
   dictionary, no translation table, no second index. */
function fdbAIGo(q){
  _fdbTimer=0;
  if(!_foods||foodKey(q)!==foodKey(_fdbQ))return;
  var cached=matchCacheGet('s:'+q);
  if(cached&&cached.list){_fdbAIQ=q;_fdbAI=cached.list;_fdbAIBusy=false;fdbPaint();return;}
  var cands=sayCandidates(q,60);
  if(!cands.length&&!SYNC_SERVER){_fdbAI=null;fdbPaint();return;}
  _fdbAIQ=q;_fdbAIBusy=true;fdbPaint();

  function finish(names){
    if(foodKey(q)!==foodKey(_fdbQ))return;
    _fdbAIBusy=false;_fdbAI=names;
    matchCachePut('s:'+q,{n:q,list:names});
    fdbPaint();
  }
  function namesFrom(j,list){
    var picks=(j&&j.ok&&j.picks)?j.picks:[];
    return picks.map(function(i){return list[i]&&list[i].n;}).filter(Boolean);
  }

  fdbAskMatch(q,cands,function(j){
    if(foodKey(q)!==foodKey(_fdbQ))return;
    var terms=(j&&j.terms)||[];
    // does the table's own wording reach anything we never sent?
    var extra=[],have={},i,k;
    for(i=0;i<cands.length;i++)have[cands[i].n]=1;
    for(i=0;i<terms.length;i++){
      var more=sayCandidates(terms[i],25);
      for(k=0;k<more.length;k++)if(!have[more[k].n]){have[more[k].n]=1;extra.push(more[k]);}
    }
    if(!extra.length){finish(namesFrom(j,cands));return;}
    var merged=extra.concat(cands).slice(0,60);
    fdbAskMatch(q,merged,function(j2){
      if(foodKey(q)!==foodKey(_fdbQ))return;
      var n2=namesFrom(j2,merged);
      finish(n2.length?n2:namesFrom(j,cands));
    });
  });
}
function fdbSelect(id){
  fdbPick=id;
  var f=fdbFind(id);
  _fdbUnit=f?foodUnitOf(f.n):{k:'g',g:1};
  // a packet that declares what one of it weighs should be counted in ones,
  // unless you have already told the app otherwise for this food
  if(f&&f.u>0&&_fdbUnit.k==='g'&&!loadFoodUnits()[foodKey(f.n)]){
    _fdbUnit={k:'unit',g:f.u};
  }
  // grams open at 100, anything counted opens at one of it
  fdbGrams=(_fdbUnit.k==='g')?100:1;
  fdbPaint();
}
function fdbSetUnit(k){
  var f=fdbFind(fdbPick);if(!f)return;
  var prev=_fdbUnit;
  // keep the same real weight when swapping units, so the numbers below
  // do not jump about while you are only changing how you say it
  var grams=fdbGrams*prev.g;
  _fdbUnit={k:k,g:unitWeightFor(f.n,k)};
  fdbGrams=(k==='g')?Math.round(grams):Math.round(grams/_fdbUnit.g*10)/10;
  if(!fdbGrams)fdbGrams=(k==='g')?100:1;
  saveFoodUnit(f.n,k,_fdbUnit.g);
  fdbPaint();
}
function fdbSetUnitGrams(v){
  var f=fdbFind(fdbPick);if(!f)return;
  var g=parseFloat(v);
  if(!(g>0))return;
  _fdbUnit={k:_fdbUnit.k,g:g};
  saveFoodUnit(f.n,_fdbUnit.k,g);
  var el=document.getElementById('fdb-preview');
  if(el)el.innerHTML=fdbPreviewHTML();
}
function fdbBack(){fdbPick=null;fdbPaint();}
function fdbSetGrams(v){
  fdbGrams=parseFloat(v)||0;
  var el=document.getElementById('fdb-preview');
  if(el)el.innerHTML=fdbPreviewHTML();
}
function fdbFind(id){
  if(_fdbScanned&&_fdbScanned.id===id)return _fdbScanned;
  if(!_foods)return null;
  for(var i=0;i<_foods.length;i++)if(_foods[i].id===id)return _foods[i];
  return null;
}
function fdbAmount(f,n){
  var g=(n||0)*(_fdbUnit.g||1);
  var m=g/100;
  return {kcal:Math.round(f.k*m),p:Math.round(f.p*m*10)/10,
          c:Math.round(f.c*m*10)/10,f:Math.round(f.f*m*10)/10};
}
function fdbPreviewHTML(){
  var f=fdbFind(fdbPick);if(!f)return '';
  var a=fdbAmount(f,fdbGrams);
  return '<b style="color:#a690cf">'+a.kcal+'</b> קק"ל &middot; '+a.p+'ח &middot; '+a.c+'פ &middot; '+a.f+'ש';
}
function fdbAdd(){
  var f=fdbFind(fdbPick);if(!f||!fdbGrams)return;
  var a=fdbAmount(f,fdbGrams);
  var day=loadDay(curDate);
  var howMuch=(_fdbUnit.k==='g')?(fdbGrams+'g'):(fdbGrams+' '+unitLabel(_fdbUnit.k,fdbGrams));
  day.meals.push({name:f.n+' ('+howMuch+')',kcal:a.kcal,p:a.p,c:a.c,f:a.f,
                  id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);
  showToast('✓ נוסף ליום');
  fdbPick=null;_fdbQ='';render();
}
// saves the food itself, per 100 g, so it can be reached without searching again
function fdbSaveToLib(){
  var f=fdbFind(fdbPick);if(!f)return;
  addMealToLib({name:f.n,kcal:f.k,p:f.p,c:f.c,f:f.f,basis:'100g'});
  fdbPaint();
}
function fdbPaint(){
  var el=document.getElementById('fdb-body');
  if(!el)return;
  if(_foodsState==='loading'){el.innerHTML='<div class="fdb-msg">טוען את המאגר…</div>';return;}
  if(_foodsState==='error'){el.innerHTML='<div class="fdb-msg">לא הצלחתי לטעון את המאגר. בדוק חיבור ונסה שוב.</div>';return;}
  if(_foodsState!=='ready'){el.innerHTML='';return;}
  if(fdbPick){
