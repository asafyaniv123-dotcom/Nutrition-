/* ── הארון שלי ──────────────────────────────────────────────────────────
   Rows stacked the way a person is: hat, shirt, trousers, socks, shoes,
   with jewellery off to one side because it is not part of that column.
   Each row scrolls on its own and whatever is in the middle is what you are
   wearing, so an outfit is built by rolling five strips until the reflection
   looks right.

   The proportions are the part that has to be got right or the whole thing
   reads as nonsense - a shirt photographed close up and a shoe photographed
   from across the room would come out the same size and the stack would look
   like a shirt sitting on a shoe the same width. So every photo is squared
   off to the same 512px canvas, fitted inside rather than cropped to fill
   (a garment cropped to fill loses its sleeves), and then each row is DRAWN
   at a height that belongs to that kind of clothing. The camera frame shown
   while adding has the same shape, so what you line up is what you get. */
var CLOSET_KEY='closet_items', CLOSET_FIT_KEY='closet_outfits', CLOSET_WORN='worn_';
/* The heights are the proportions of a dressed person rather than of the
   photographs: a hat is not the size of a pair of trousers however close you
   stood when you took the picture. They are also deliberately small - five
   rows and the jewellery have to fit on one phone screen, because the point
   of rolling a row is watching what it does to the whole outfit, and you
   cannot watch that if the shoes are two scrolls below the shirt. */
var CLOSET_CATS=[
  {k:'hat',   t:'כובע',     h:44, one:'כובע'},
  {k:'top',   t:'חולצות',   h:76, one:'חולצה'},
  /* A dress is not a sixth kind of clothing, it is a top that also does the
     job of the trousers - which is why it belongs between them and why the
     row cancels them rather than competing with them. Same for a jumpsuit or
     anything else worn in one piece, so the row is named for the idea rather
     than for dresses alone. It starts on ללא and stays out of the way until
     something is put in it. */
  {k:'dress', t:'שמלה',     h:118,one:'שמלה', solo:true},
  {k:'bottom',t:'מכנסיים',  h:86, one:'מכנסיים'},
  {k:'socks', t:'גרביים',   h:38, one:'גרביים'},
  {k:'shoes', t:'נעליים',   h:48, one:'נעליים'}
];
// which rows a one-piece silences
var CLOSET_SOLO_HIDES=['top','bottom'];
function closetSoloOn(){
  var list=closetOf('dress');
  return list.length>0&&(_closetSel.dress||0)>0;
}
function closetSoloItem(){
  var list=closetOf('dress'),sel=(_closetSel.dress||0)-1;
  return (sel>=0&&list[sel])?list[sel]:null;
}
var CLOSET_SIDE={k:'jewel',t:'תכשיטים',h:46,one:'תכשיט'};
function closetCat(k){
  for(var i=0;i<CLOSET_CATS.length;i++)if(CLOSET_CATS[i].k===k)return CLOSET_CATS[i];
  return CLOSET_SIDE.k===k?CLOSET_SIDE:CLOSET_CATS[1];
}
function loadCloset(){
  try{var a=JSON.parse(localStorage.getItem(CLOSET_KEY)||'[]');return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function saveCloset(a){try{localStorage.setItem(CLOSET_KEY,JSON.stringify(a));}catch(e){}}
function closetOf(cat){
  return loadCloset().filter(function(x){return x.cat===cat;});
}
function loadOutfits(){
  try{var a=JSON.parse(localStorage.getItem(CLOSET_FIT_KEY)||'[]');return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function saveOutfits(a){try{localStorage.setItem(CLOSET_FIT_KEY,JSON.stringify(a));}catch(e){}}

var _closetSel={}, _closetView='home', _closetBusy=false;

/* The picker's own "Done" belongs to the phone, not to this app, and cannot
   be removed - but it only has to be pressed once. The whole selection comes
   in together and is cropped one photo after another, so choosing six shirts
   is one trip to the photo library rather than six. */
var _cropQ=[],_cropQi=0,_cropQcat='';
function closetAdd(input,cat){
  var files=input.files?Array.prototype.slice.call(input.files):[];
  input.value='';
  if(!files.length)return;
  _cropQ=files.slice(0,20);_cropQi=0;_cropQcat=cat;
  cropNext();
}
/* Object URLs, made once per batch and released when it ends - a data URI
   per thumbnail would mean reading every file up front, which is the whole
   batch in memory before the first crop. */
var _cropThumbs=[];
function cropThumb(i){
  if(_cropThumbs[i])return _cropThumbs[i];
  try{_cropThumbs[i]=URL.createObjectURL(_cropQ[i]);}catch(e){_cropThumbs[i]='';}
  return _cropThumbs[i];
}
function cropThumbsFree(){
  for(var i=0;i<_cropThumbs.length;i++)
    if(_cropThumbs[i]){try{URL.revokeObjectURL(_cropThumbs[i]);}catch(e){}}
  _cropThumbs=[];
}
function cropNext(){
  if(_cropQi>=_cropQ.length){
    cropThumbsFree();
    _cropQ=[];_cropQi=0;
    _closetBusy=false;
    cropClose();
    renderCloset();
    return;
  }
  var file=_cropQ[_cropQi];
  _closetBusy=true;
  var reader=new FileReader();
  reader.onerror=function(){_cropQi++;showToast('לא הצלחתי לקרוא תמונה אחת');cropNext();};
  reader.onload=function(e){
    var img=new Image();
    img.onerror=function(){_cropQi++;showToast('לא הצלחתי לקרוא תמונה אחת');cropNext();};
    img.onload=function(){cropOpen(img,_cropQcat);};
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
/* ── CUTTING THE PICTURE DOWN ─────────────────────────────────────────────
   Two ways, because a garment needs both.

   פאות is the ordinary rectangle: drag any of the four sides or the corners,
   drag the middle to move it. It is what you want when the photo is simply
   too wide, or the garment is sitting in one half of the frame.

   חופשי draws round the thing with a finger and throws away everything
   outside the line. That one earns its place here specifically: clothes are
   photographed on beds and floors and the background comes with them, and a
   stack of five rectangles of somebody's duvet does not read as an outfit.
   Cut out, each piece keeps only its own shape and the column looks like
   clothes.

   Which is also why the two modes save differently. A rectangle is still a
   rectangle, so it stays a JPEG on white. A free cut has an outside, and the
   outside has to be genuinely absent rather than painted white, or every
   garment sits in a pale box on top of the one below it - so that one is a
   PNG that keeps its transparency. */
var _crop=null;   // {img,cat,mode,box,path,vw,vh,drag}

function cropOpen(img,cat){
  // fit the picture into what is left of the screen once the bar is allowed for
  var maxW=Math.min(window.innerWidth-52,520),
      maxH=window.innerHeight-230;
  var k=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);
  var vw=Math.round(img.naturalWidth*k),vh=Math.round(img.naturalHeight*k);
  _crop={img:img,cat:cat,mode:'rect',vw:vw,vh:vh,drag:null,
         box:{x:Math.round(vw*0.08),y:Math.round(vh*0.08),
              w:Math.round(vw*0.84),h:Math.round(vh*0.84)},
         path:[]};
  document.body.style.overflow='hidden';
  cropPaint();
}
function cropClose(){
  _crop=null;
  var o=document.getElementById('crop-ov');if(o)o.remove();
  document.body.style.overflow='';
}
function cropMode(m){
  if(!_crop)return;
  _crop.mode=m;_crop.path=[];
  cropPaint();
}
function cropReset(){
  if(!_crop)return;
  _crop.path=[];
  _crop.box={x:Math.round(_crop.vw*0.08),y:Math.round(_crop.vh*0.08),
             w:Math.round(_crop.vw*0.84),h:Math.round(_crop.vh*0.84)};
  cropPaint();
}
function cropPaint(){
  if(!_crop)return;
  var c=_crop,old=document.getElementById('crop-ov');
  var h='<div class="crop-ov" id="crop-ov">';
  h+='<div class="crop-top">';
  if(_cropQ.length>1)
    h+='<div class="crop-n">'+(_cropQi+1)+' מתוך '+_cropQ.length+'</div>';
  h+='<div class="crop-modes">';
  h+='<button class="crop-m'+(c.mode==='rect'?' on':'')+'" onclick="cropMode(&quot;rect&quot;)">4 פאות</button>';
  h+='<button class="crop-m'+(c.mode==='free'?' on':'')+'" onclick="cropMode(&quot;free&quot;)">חופשי</button>';
  h+='</div>';
  h+='</div>';

  h+='<div class="crop-stage" id="crop-stage" style="width:'+c.vw+'px;height:'+c.vh+'px">';
  h+='<img class="crop-img" src="'+c.img.src+'" draggable="false">';
  if(c.mode==='rect'){
    var b=c.box;
    h+='<div class="crop-shade" style="top:0;left:0;right:0;height:'+b.y+'px"></div>';
    h+='<div class="crop-shade" style="top:'+(b.y+b.h)+'px;left:0;right:0;bottom:0"></div>';
    h+='<div class="crop-shade" style="top:'+b.y+'px;left:0;width:'+b.x+'px;height:'+b.h+'px"></div>';
    h+='<div class="crop-shade" style="top:'+b.y+'px;left:'+(b.x+b.w)+'px;right:0;height:'+b.h+'px"></div>';
    h+='<div class="crop-box" id="crop-box" style="left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;height:'+b.h+'px">';
    var hs=['n','s','w','e','nw','ne','sw','se'];
    for(var i=0;i<hs.length;i++)h+='<i class="ch ch-'+hs[i]+'" data-h="'+hs[i]+'"></i>';
    h+='</div>';
  } else {
    h+='<canvas class="crop-can" id="crop-can" width="'+c.vw+'" height="'+c.vh+'"></canvas>';
  }
  h+='</div>';
  /* Which photo of the batch you are on, as pictures rather than a number.
     A count tells you there are four; the strip tells you which four, and
     that the shirt you are worried about is still coming. */
  if(_cropQ.length>1){
    h+='<div class="crop-strip">';
    for(var qi=0;qi<_cropQ.length;qi++){
      var st=qi<_cropQi?' done':(qi===_cropQi?' now':'');
      h+='<span class="crop-th'+st+'"><img src="'+cropThumb(qi)+'"></span>';
    }
    h+='</div>';
  }
  h+='<div class="crop-hint">'+(c.mode==='rect'
      ?'גרור צד או פינה. גרירה באמצע מזיזה את המסגרת.'
      :'סמן עם האצבע סביב הבגד. מה שמחוץ לקו יימחק.')+'</div>';
  /* All three within reach of a thumb, instead of two of them in the far
     top corners of a phone held in one hand. */
  h+='<div class="crop-bot">';
  h+='<button class="crop-x" onclick="cropCancel()">'+
     (_cropQ.length>1?'דלג':'ביטול')+'</button>';
  h+='<button class="crop-rs" onclick="cropReset()">אפס</button>';
  h+='<button class="crop-ok" onclick="cropApply()">שמור</button>';
  h+='</div>';
  if(_cropQ.length>1)
    h+='<button class="crop-stop" onclick="cropSkipAll()">עצור הכל</button>';
  h+='</div>';

  if(old)old.outerHTML=h; else document.body.insertAdjacentHTML('beforeend',h);
  cropBind();
  if(c.mode==='free')cropDrawPath();
}
function cropBind(){
  var c=_crop;if(!c)return;
  var stage=document.getElementById('crop-stage');
  if(!stage)return;
  var pt=function(e){
    var r=stage.getBoundingClientRect();
    return {x:Math.max(0,Math.min(c.vw,e.clientX-r.left)),
            y:Math.max(0,Math.min(c.vh,e.clientY-r.top))};
  };
  stage.onpointerdown=function(e){
    if(!_crop)return;
    var p=pt(e);
    if(c.mode==='free'){
      c.path=[p];c.drag={kind:'free'};
    } else {
      /* Which edge you meant is decided by how close you got, not by whether
         you landed on the handle. The handles were 5px thick and the test was
         whether the touch hit that element, so on a phone it was a five pixel
         target for a forty pixel finger - you would miss, get the move
         behaviour instead, and drag the whole frame off the garment.

         The handles are now only drawn. This decides what you grabbed. */
      var b=c.box,T=26;
      var nearL=Math.abs(p.x-b.x)<T, nearR=Math.abs(p.x-(b.x+b.w))<T;
      var nearT=Math.abs(p.y-b.y)<T, nearB=Math.abs(p.y-(b.y+b.h))<T;
      var inY=p.y>b.y-T&&p.y<b.y+b.h+T, inX=p.x>b.x-T&&p.x<b.x+b.w+T;
      var hnd='';
      // a corner beats an edge - it is the smaller target and the one meant
      if(nearT&&nearL)hnd='nw'; else if(nearT&&nearR)hnd='ne';
      else if(nearB&&nearL)hnd='sw'; else if(nearB&&nearR)hnd='se';
      else if(nearL&&inY)hnd='w'; else if(nearR&&inY)hnd='e';
      else if(nearT&&inX)hnd='n'; else if(nearB&&inX)hnd='s';
      if(hnd)c.drag={kind:'h',h:hnd,b:{x:b.x,y:b.y,w:b.w,h:b.h},p:p};
      else if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)
        c.drag={kind:'move',b:{x:b.x,y:b.y,w:b.w,h:b.h},p:p};
      else return;
    }
    try{stage.setPointerCapture(e.pointerId);}catch(_e){}
    e.preventDefault();
  };
  stage.onpointermove=function(e){
    if(!_crop||!c.drag)return;
    var p=pt(e);
    if(c.drag.kind==='free'){
      c.path.push(p);cropDrawPath();e.preventDefault();return;
    }
    var d=c.drag,b=d.b,dx=p.x-d.p.x,dy=p.y-d.p.y,MIN=40;
    if(d.kind==='move'){
      c.box.x=Math.max(0,Math.min(c.vw-b.w,b.x+dx));
      c.box.y=Math.max(0,Math.min(c.vh-b.h,b.y+dy));
    } else {
      var x1=b.x,y1=b.y,x2=b.x+b.w,y2=b.y+b.h,k=d.h;
      if(k.indexOf('w')>=0)x1=Math.max(0,Math.min(x2-MIN,b.x+dx));
      if(k.indexOf('e')>=0)x2=Math.min(c.vw,Math.max(x1+MIN,b.x+b.w+dx));
      if(k.indexOf('n')>=0)y1=Math.max(0,Math.min(y2-MIN,b.y+dy));
      if(k.indexOf('s')>=0)y2=Math.min(c.vh,Math.max(y1+MIN,b.y+b.h+dy));
      c.box={x:x1,y:y1,w:x2-x1,h:y2-y1};
    }
    cropBoxPaint();
    e.preventDefault();
  };
  stage.onpointerup=stage.onpointercancel=function(){
    if(!_crop)return;
    _crop.drag=null;
  };
}
/* Moving a rectangle should not rebuild the screen on every pointer event -
   that drops frames and loses the pointer capture with it. */
function cropBoxPaint(){
  var c=_crop;if(!c)return;
  var b=c.box,box=document.getElementById('crop-box');
  if(box){box.style.left=b.x+'px';box.style.top=b.y+'px';box.style.width=b.w+'px';box.style.height=b.h+'px';}
  var sh=document.querySelectorAll('#crop-stage .crop-shade');
  if(sh.length===4){
    sh[0].style.height=b.y+'px';
    sh[1].style.top=(b.y+b.h)+'px';
    sh[2].style.top=b.y+'px';sh[2].style.width=b.x+'px';sh[2].style.height=b.h+'px';
    sh[3].style.top=b.y+'px';sh[3].style.left=(b.x+b.w)+'px';sh[3].style.height=b.h+'px';
  }
}
function cropDrawPath(){
  var c=_crop;if(!c)return;
  var cv=document.getElementById('crop-can');if(!cv)return;
  var x=cv.getContext('2d');
  x.clearRect(0,0,cv.width,cv.height);
  if(c.path.length<2)return;
  // everything outside the line dimmed, so what you are keeping is obvious
  x.save();
  x.beginPath();
  x.rect(0,0,cv.width,cv.height);
  x.moveTo(c.path[0].x,c.path[0].y);
  for(var i=1;i<c.path.length;i++)x.lineTo(c.path[i].x,c.path[i].y);
  x.closePath();
  x.fillStyle='rgba(40,34,32,.55)';
  try{x.fill('evenodd');}catch(_e){x.fill();}
  x.restore();
  x.beginPath();
  x.moveTo(c.path[0].x,c.path[0].y);
  for(var j=1;j<c.path.length;j++)x.lineTo(c.path[j].x,c.path[j].y);
  x.closePath();
  x.strokeStyle='#fff';x.lineWidth=2;x.setLineDash([6,4]);x.stroke();
}
/* Cancel drops THIS photo and moves on. Abandoning the other five because
   one of them was a bad shot would be its own annoyance. */
function cropCancel(){
  cropClose();
  if(_cropQi<_cropQ.length-1){_cropQi++;cropNext();return;}
  cropThumbsFree();
  _cropQ=[];_cropQi=0;_closetBusy=false;
  renderCloset();
}
function cropSkipAll(){
  cropClose();
  cropThumbsFree();
  _cropQ=[];_cropQi=0;_closetBusy=false;
  renderCloset();
}
/* Squaring happens here, after the cut rather than before it, so that the
   crop is what gets squared. Doing it the other way round would mean
   cropping a picture that had already had white added around it. */
function cropApply(){
  var c=_crop;if(!c)return;
  var img=c.img,cat=c.cat;
  var sx=img.naturalWidth/c.vw, sy=img.naturalHeight/c.vh;
  var S=512,out=document.createElement('canvas');
  out.width=S;out.height=S;
  var g=out.getContext('2d');
  g.imageSmoothingEnabled=true;
  try{g.imageSmoothingQuality='high';}catch(_e){}

  var data;
  if(c.mode==='free'&&c.path.length>2){
    // bounding box of the drawn shape, in the picture's own pixels
    var mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9,i;
    for(i=0;i<c.path.length;i++){
      if(c.path[i].x<mnx)mnx=c.path[i].x;
      if(c.path[i].x>mxx)mxx=c.path[i].x;
      if(c.path[i].y<mny)mny=c.path[i].y;
      if(c.path[i].y>mxy)mxy=c.path[i].y;
    }
    var bw=Math.max(8,(mxx-mnx))*sx, bh=Math.max(8,(mxy-mny))*sy;
    var cut=document.createElement('canvas');
    cut.width=Math.round(bw);cut.height=Math.round(bh);
    var q=cut.getContext('2d');
    q.drawImage(img,Math.round(mnx*sx),Math.round(mny*sy),Math.round(bw),Math.round(bh),
                0,0,Math.round(bw),Math.round(bh));
    // keep only what is inside the line
    q.globalCompositeOperation='destination-in';
    q.beginPath();
    q.moveTo((c.path[0].x-mnx)*sx,(c.path[0].y-mny)*sy);
    for(i=1;i<c.path.length;i++)q.lineTo((c.path[i].x-mnx)*sx,(c.path[i].y-mny)*sy);
    q.closePath();
    q.fill();
    var k=Math.min(S/cut.width,S/cut.height);
    g.drawImage(cut,(S-cut.width*k)/2,(S-cut.height*k)/2,cut.width*k,cut.height*k);
    data=out.toDataURL('image/png');          // the outside must stay absent
  } else {
    var b=c.box;
    var rw=Math.max(1,Math.round(b.w*sx)), rh=Math.max(1,Math.round(b.h*sy));
    g.fillStyle='#ffffff';g.fillRect(0,0,S,S);
    var kk=Math.min(S/rw,S/rh);
    g.drawImage(img,Math.round(b.x*sx),Math.round(b.y*sy),rw,rh,
                (S-rw*kk)/2,(S-rh*kk)/2,rw*kk,rh*kk);
    data=out.toDataURL('image/jpeg',0.82);
  }
  cropClose();
  closetStore(data,cat,function(){
    _cropQi++;
    cropNext();
  });
}
// everything after the picture is decided, shared by both modes
function closetStore(data,cat,then){
  photoPut(data).then(function(ref){
    var items=loadCloset();
    items.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                cat:cat,ref:ref||data,ts:Date.now()});
    saveCloset(items);
    _closetSel[cat]=closetOf(cat).length-1;
    if(then){then();return;}
    _closetBusy=false;
    renderCloset();
  });
}
function closetRemove(cat,idx){
  var list=closetOf(cat),it=list[idx];
  if(!it)return;
  var all=loadCloset().filter(function(x){return x.id!==it.id;});
  saveCloset(all);
  if(isPhotoKey(it.ref))photoDel(it.ref);
  /* The one-piece row has an extra position at the front for ללא, so its
     valid range is 0..n rather than 0..n-1 and removing the last garment
     should land on ללא, not on -1. */
  var n=closetOf(cat).length,def=closetCat(cat),top=def.solo?n:n-1;
  if((_closetSel[cat]||0)>top)_closetSel[cat]=Math.max(0,top);
  renderCloset();
}
function closetStep(cat,d){
  var n=closetOf(cat).length;
  if(!n)return;
  // ללא is a position on the one-piece row, so it has one more stop than it
  // has garments
  var stops=closetCat(cat).solo?n+1:n;
  var cur=_closetSel[cat]||0,next=(cur+d+stops)%stops;
  clCentre(cat,next,true);   // locks the row first, so its own scroll cannot undo this
  clSelect(cat,next);
}
function closetPick(cat,i){
  clCentre(cat,i,true);
  clSelect(cat,i);
}
/* Rolling every row at once. It is the fastest way to see combinations you
   would not have put together, which is most of why a wardrobe screen is
   worth having at all. */
function closetShuffle(){
  var cats=CLOSET_CATS.concat([CLOSET_SIDE]);
  for(var i=0;i<cats.length;i++){
    var n=closetOf(cats[i].k).length;
    if(!n)continue;
    // the one-piece row can also roll to ללא, which is a real outcome
    _closetSel[cats[i].k]=cats[i].solo
      ?Math.floor(Math.random()*(n+1))
      :Math.floor(Math.random()*n);
  }
  renderCloset();
}
function closetCurrent(){
  var out={},cats=CLOSET_CATS.concat([CLOSET_SIDE]),i,solo=closetSoloOn();
  for(i=0;i<cats.length;i++){
    var k=cats[i].k;
    if(solo&&CLOSET_SOLO_HIDES.indexOf(k)>=0)continue;   // the dress covers these
    if(cats[i].solo){
      var d=closetSoloItem();
      if(d)out.dress=d.id;
      continue;
    }
    var list=closetOf(k),sel=_closetSel[k]||0;
    if(list.length&&list[sel])out[k]=list[sel].id;
  }
  return out;
}
function closetSaveOutfit(){
  var cur=closetCurrent();
  if(!Object.keys(cur).length){showToast('אין מה לשמור עדיין');return;}
  var all=loadOutfits();
  all.unshift({id:'o'+Date.now().toString(36),items:cur,ts:Date.now()});
  saveOutfits(all.slice(0,60));
  showToast('✓ הלוק נשמר');
  renderCloset();
}
function closetWearOutfit(id){
  var o=null,all=loadOutfits(),i;
  for(i=0;i<all.length;i++)if(all[i].id===id)o=all[i];
  if(!o)return;
  var cats=CLOSET_CATS.concat([CLOSET_SIDE]);
  for(i=0;i<cats.length;i++){
    var k=cats[i].k,list=closetOf(k),j;
    _closetSel[k]=0;
    for(j=0;j<list.length;j++)
      if(list[j].id===o.items[k])_closetSel[k]=cats[i].solo?j+1:j;
  }
  _closetView='home';renderCloset();
}
function closetDeleteOutfit(id){
  saveOutfits(loadOutfits().filter(function(o){return o.id!==id;}));
  renderCloset();
}
/* What was actually worn, kept by date. Nothing reads it yet - it is the
   thing תכנון זמן and סיום יום will both want, and recording it costs one
   line now against re-deciding the shape later. */
function closetWoreToday(){
  var cur=closetCurrent();
  if(!Object.keys(cur).length){showToast('בחר קודם לוק');return;}
  try{localStorage.setItem(CLOSET_WORN+todayStr(),JSON.stringify({items:cur,ts:Date.now()}));}catch(e){}
  showToast('✓ נרשם מה לבשת היום');
  renderCloset();   // the counts below have just changed
}
function closetWornOn(d){
  try{var o=JSON.parse(localStorage.getItem(CLOSET_WORN+d)||'null');return (o&&o.items)?o:null;}
  catch(e){return null;}
}

/* ── WHAT IS ON THE LINE, LARGER ──────────────────────────────────────────
   The rails are small on purpose - five of them and the jewellery have to
   fit on one screen, or rolling a row tells you nothing about the outfit.
   But small is no way to look at the thing you have just built, so the
   chosen pieces are repeated at the bottom at a size you can actually judge.

   And under each one, how often it has been worn this month. That number is
   the reason a wardrobe app is worth anything: it is the shirt you reach for
   nine times out of ten and the jacket you have not touched since you bought
   it, and neither of those is visible from owning the clothes. It is read
   back out of the worn records, so it is true from whenever you started
   pressing the button rather than from when this was written. */
function closetWearCounts(){
  var out={},d=new Date(),i;
  for(i=0;i<30;i++){
    var rec=closetWornOn(dtStamp(d));
    if(rec&&rec.items)for(var k in rec.items)
      if(rec.items.hasOwnProperty(k))out[rec.items[k]]=(out[rec.items[k]]||0)+1;
    d.setDate(d.getDate()-1);
  }
  return out;
}
function closetPickedHTML(){
  var cats=CLOSET_CATS.concat([CLOSET_SIDE]),i,shown=[];
  var solo=closetSoloOn();
  for(i=0;i<cats.length;i++){
    var k=cats[i].k;
    if(solo&&CLOSET_SOLO_HIDES.indexOf(k)>=0)continue;
    if(cats[i].solo){
      var dr=closetSoloItem();
      if(dr)shown.push({cat:cats[i],it:dr});
      continue;
    }
    var list=closetOf(k),sel=_closetSel[k]||0;

  }
  if(!shown.length)return '';

  var h='<div class="cl-pick"><div class="cl-pick-h">מה שבחרת</div><div class="cl-pick-row">';
  for(i=0;i<shown.length;i++){
    var n=counts[shown[i].it.id]||0;
    h+='<div class="cl-pick-i">';

    h+='<div class="cl-pick-t">'+shown[i].cat.one+'</div>';
    h+='<div class="cl-pick-n'+(n?' on':'')+'">'+
       (n?n+(n===1?' פעם':' פעמים'):'עוד לא')+'</div>';
    h+='</div>';
  }
  h+='</div><div class="cl-pick-f">כמה פעמים לבשת כל פריט ב-30 הימים האחרונים</div></div>';
  return h;
}
// the strip commits its choice without a full repaint, so this follows it
function closetPickedPaint(){

function closetRowHTML(cat){

/* ── WHAT IS UNDER THE LINE IS WHAT YOU ARE WEARING ──
   Choosing used to mean tapping a garment, which works but is not what a
   row of clothes on a rail is. There is a marked place down the middle of
   the screen now and you roll the row until the thing you want is in it -
   so the outfit is read straight down the line, and picking is one gesture
   per row rather than a tap and a look.

   Everything here compares screen rectangles rather than doing arithmetic on
   scrollLeft, because this app is RTL and scrollLeft in a right-to-left box
   is one of the few places browsers still disagree with each other. */
/* Choosing had two owners - the finger, through the scroll handler, and the
   arrows and taps, which set the index and then scrolled to it. They fought:
   an arrow set the index, started a smooth scroll, and a timer 260ms later
   re-read the position, found the scroll still in flight, and wrote the OLD
   index back. On the dress row that meant the dress could never be put on at
   all, because every attempt was undone before it took effect.

   So the position decides only while the finger is driving. A deliberate
   choice sets the index, paints from it, and locks the row until its scroll
   has actually arrived. */
var _clScrollT=0,_clLock={};
function clScroll(el){
  if(_clScrollT)clearTimeout(_clScrollT);
  clMarkNearest(el,false);
  _clScrollT=setTimeout(function(){_clScrollT=0;clMarkNearest(el,true);},110);
}
// paint a row for a given index, without asking where it happens to be
function clPaintRow(el,idx){
  var cells=el.querySelectorAll('.cl-cell'),cat=el.getAttribute('data-cat'),i;
  for(i=0;i<cells.length;i++){
    var b=cells[i].querySelector('.cl-it');
    if(b)b.className='cl-it'+(b.classList.contains('cl-none')?' cl-none':'')+(i===idx?' on':'');
    var x=cells[i].querySelector('.cl-x');
    if(x)x.style.display=(i===idx)?'':'none';
  }
  var def=closetCat(cat),lab=document.getElementById('cl-n-'+cat);
  if(lab)lab.textContent=def.solo
    ?(idx===0?'ללא':idx+'/'+(cells.length-1))
    :(idx+1)+'/'+cells.length;
}
/* The single place a selection changes. Everything that used to set
   _closetSel and then repaint by hand goes through here. */
function clSelect(cat,idx){
  if(_closetSel[cat]===idx)return;
  var wasSolo=closetSoloOn();
  _closetSel[cat]=idx;
  var el=document.getElementById('cl-tr-'+cat);
  if(el)clPaintRow(el,idx);
  /* Putting a one-piece on, or taking it off, changes which OTHER rows apply,
     and that cannot be done by touching this row's classes. */
  if(closetCat(cat).solo&&wasSolo!==closetSoloOn()){renderCloset();return;}
  closetPickedPaint();
}
function clNearest(el){
  var cells=el.querySelectorAll('.cl-cell'),i,best=-1,bd=1e9;
  var mid=el.getBoundingClientRect();
  mid=mid.left+mid.width/2;
  for(i=0;i<cells.length;i++){
    var r=cells[i].getBoundingClientRect();
    var d=Math.abs(r.left+r.width/2-mid);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
function clMarkNearest(el,commit){
  var cat=el.getAttribute('data-cat'),idx=clNearest(el);
  if(idx<0)return;
  /* A scroll this app started is still travelling towards a decision already
     made; where it is halfway there is not a choice. */
  var want=_closetSel[cat]||0;
  if(_clLock[cat]){
    clPaintRow(el,want);
    if(idx===want||Date.now()-_clLock[cat]>1200)delete _clLock[cat];
    return;
  }
  clPaintRow(el,idx);
  if(commit)clSelect(cat,idx);
}
// bring a garment into the marked place, which is what picking one now means
function clCentre(cat,idx,smooth){
  var el=document.getElementById('cl-tr-'+cat);
  if(!el)return;
  _clLock[cat]=Date.now();
  var cells=el.querySelectorAll('.cl-cell');
  if(!cells[idx])return;
  try{cells[idx].scrollIntoView({inline:'center',block:'nearest',
                                behavior:smooth?'smooth':'auto'});}
  catch(e){cells[idx].scrollIntoView();}
}
// after any full repaint, put every row back where its selection says
function clCentreAll(smooth){
  var cats=CLOSET_CATS.concat([CLOSET_SIDE]),i;
  _clLock={};   // the rows are being rebuilt; nothing is in flight
  for(i=0;i<cats.length;i++){
    var k=cats[i].k;
    if(closetOf(k).length)clCentre(k,_closetSel[k]||0,smooth);
  }
}
function renderCloset(){
  document.getElementById('hdr-title').textContent='הארון שלי';
  var h='<div style="padding-bottom:24px">';

  if(_closetView==='outfits'){
    var fits=loadOutfits();
    h+='<button class="cl-back" onclick="_closetView=\'home\';renderCloset()">&#8249; הארון</button>';
    h+='<div class="cl-h2">הלוקים ששמרת</div>';
    if(!fits.length)h+='<div class="cl-none">עוד לא שמרת לוק. תגלגל את השורות עד שזה נראה טוב ותשמור.</div>';
    for(var fi=0;fi<fits.length;fi++){
      var o=fits[fi],d=new Date(o.ts);
      h+='<div class="cl-fit"><div class="cl-fit-row">';
      var cats=CLOSET_CATS.concat([CLOSET_SIDE]);
      for(var ci=0;ci<cats.length;ci++){
        var id=o.items[cats[ci].k];
        if(!id)continue;
        var found=null,ll=closetOf(cats[ci].k);
        for(var li=0;li<ll.length;li++)if(ll[li].id===id)found=ll[li];
        if(found)h+='<span class="cl-fit-i">'+photoImg(found.ref,'class="cl-img"')+'</span>';
      }
      h+='</div><div class="cl-fit-b">';
      h+='<span class="cl-fit-d">'+d.getDate()+'/'+(d.getMonth()+1)+'</span>';
      h+='<button class="cl-fit-w" onclick="closetWearOutfit(\''+o.id+'\')">ללבוש</button>';
      h+='<button class="cl-fit-x" onclick="closetDeleteOutfit(\''+o.id+'\')">&times;</button>';
      h+='</div></div>';
    }
    document.getElementById('content').innerHTML=h+'</div>';
    hydratePhotos();
    return;
  }

  if(_closetBusy)h+='<div class="cl-busy">מכין את התמונה…</div>';

  var total=loadCloset().length;
  if(!total){
    h+='<div class="cl-intro">צלם את הבגדים שלך אחד אחד. כל שורה היא סוג אחד — '+
       'מגלגלים אותה עד שהפריט שרצית באמצע, וכל השורות ביחד הן הלוק.<br>'+
       '<b>צלם כל פריט מאותו מרחק בערך</b> — התמונות מיושרות לאותו ריבוע, וכך המידות '+
       'נשארות הגיוניות אחת מול השנייה.</div>';
  }

  // the body column, in the order it is worn, in one frame so that rolling
  // any row shows you what it did to the rest
  h+='<div class="cl-mirror">';
  for(var i=0;i<CLOSET_CATS.length;i++)h+=closetRowHTML(CLOSET_CATS[i]);
  h+='</div>';

  // jewellery is not part of that column, so it gets its own box
  h+='<div class="cl-mirror side">'+closetRowHTML(CLOSET_SIDE)+'</div>';

  h+='<div id="cl-picked">'+closetPickedHTML()+'</div>';

  h+='<div class="cl-acts">';
  h+='<button class="cl-b1" onclick="closetShuffle()">&#127922; גלגל הכל</button>';
  h+='<button class="cl-b2" onclick="closetSaveOutfit()">שמור לוק</button>';
  h+='</div>';
  h+='<div class="cl-acts">';
  h+='<button class="cl-b3" onclick="closetWoreToday()">'+(closetWornOn(todayStr())?'✓ נרשם — לבשתי היום':'לבשתי את זה היום')+'</button>';
  h+='<button class="cl-b3" onclick="_closetView=\'outfits\';renderCloset()">הלוקים שלי ('+loadOutfits().length+')</button>';
  h+='</div>';

  document.getElementById('content').innerHTML=h+'</div>';
  // the pictures live in IndexedDB; the markup ships placeholders
  hydratePhotos();
  // a fresh strip starts at its beginning, not at whatever is being worn
  clCentreAll(false);
}

  var title=DAY_NAMES[dayIdx]+' (שבוע '+(weekIdx+1)+')';

}

function setWeekDayType(typeId){
  if(!window._editWeekEntry)window._editWeekEntry={type:'rest',label:'',note:''};
  window._editWeekEntry.type=typeId;
  var weekPlan=loadWeekPlan();
  weekPlan[_editWeekDay]=window._editWeekEntry;
  saveWeekPlan(weekPlan);
  renderEditWeekDay();
}

function saveWeekDay(){
  var weekPlan=loadWeekPlan();
  var entry=window._editWeekEntry||{type:'rest',label:'',note:''};
  var labelInp=document.getElementById('wday-label');
  var noteInp=document.getElementById('wday-note');
  if(labelInp)entry.label=labelInp.value.trim();
  if(noteInp)entry.note=noteInp.value.trim();
  weekPlan[_editWeekDay]=entry;
  saveWeekPlan(weekPlan);
  _fitView='weekly-plan';renderFitness();
}

function copyWeekToWeek2(){
  var weekPlan=loadWeekPlan();
  for(var d=0;d<7;d++){
    var src=weekPlan['w0d'+d];
    if(src)weekPlan['w1d'+d]=JSON.parse(JSON.stringify(src));
  }
  saveWeekPlan(weekPlan);
  renderWeeklyPlan();
  showToast('שבוע 1 הועתק לשבוע 2 &#10003;');
}

function finalizeProgramWizard(){
  var progs=loadPrograms();
  var prog={
    id:_wiz.prog.id||Date.now(),
    name:_wiz.prog.name,
    splitType:_wiz.prog.splitType,
    daysPerWeek:_wiz.prog.daysPerWeek,
    goal:_wiz.prog.goal,
    exercises:[] // flat list from all days
  };
  // Store all days' exercises flat for the view-program tracker
  var allEx=[];
  for(var di=0;di<_wiz.days.length;di++){
    var day=_wiz.days[di];
    for(var ei=0;ei<day.exercises.length;ei++){
      var ex=day.exercises[ei];
      ex.day=day.name;
      allEx.push(ex);
    }
  }
  prog.exercises=allEx;
  if(_fitProgIdx>=0)progs[_fitProgIdx]=prog;
  else progs.push(prog);
  savePrograms(progs);
  _fitProgIdx=progs.indexOf(prog);
  showToast('✓ '+prog.name+' נשמרה!');
  _fitView='view-program';renderFitness();
}

function renderViewProgram(){
  var progs=loadPrograms();
  var prog=progs[_fitProgIdx];if(!prog){_fitView='home';renderFitness();return;}

  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div style="font-size:16px;font-weight:800;color:#4a4340">'+esc(prog.name)+'</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

  for(var ei=0;ei<prog.exercises.length;ei++){
    var ex=prog.exercises[ei];
    var exLog=loadProgLog(prog.id,ex.name);
    var lastEntry=exLog.length>0?exLog[exLog.length-1]:null;
    var pr=exLog.length>0?Math.max.apply(null,exLog.map(function(e){return e.weight;})):0;

    h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
    // Exercise header
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
    h+='<div><div style="font-size:14px;font-weight:800;color:#4a4340">'+esc(ex.name)+'</div>';
    h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+ex.sets+' סט &times; '+ex.targetReps+' חזר</div></div>';
    if(pr>0)h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:6px 10px;text-align:center"><div style="font-size:14px;font-weight:800;color:#b45309">'+pr+'kg</div><div style="font-size:8px;color:#b45309;font-weight:700">PR</div></div>';
    h+='</div>';

    // Last entry
    if(lastEntry){
      var dd=new Date(lastEntry.date);
      h+='<div style="background:#f5f0eb;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#6a6360">';
      h+='אחרון: '+lastEntry.weight+'kg &times; '+lastEntry.reps+' חזר &mdash; '+dd.getDate()+'/'+(dd.getMonth()+1);
      h+='</div>';
    }

    // Log new entry
    h+='<div style="display:flex;gap:6px;align-items:center">';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">kg</div>';
    h+='<input id="prog-w-'+ei+'" class="mtnm" type="number" step="0.5" placeholder="'+(lastEntry?lastEntry.weight:ex.baseWeight||0)+'" style="width:100%"></div>';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">חזרות</div>';
    h+='<input id="prog-r-'+ei+'" class="mtnm" type="number" placeholder="'+ex.targetReps+'" style="width:100%"></div>';
    h+='<button onclick="logProgEntry('+_fitProgIdx+','+ei+')" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;align-self:flex-end">רשום</button>';
    h+='</div>';

    // Mini history chart
    if(exLog.length>1){
      var recent=exLog.slice(-8);
      var maxW=Math.max.apply(null,recent.map(function(e){return e.weight;}));
      var minW=Math.max(0,Math.min.apply(null,recent.map(function(e){return e.weight;}))-5);
      var W=280,H=50,PL=0,PT=4,PB=14,cW=W,cH=H-PT-PB;
      var n=Math.max(recent.length-1,1);
      function xp(i){return PL+i*(cW/n);}
      function yp(v){return PT+cH*(1-(v-minW)/(maxW-minW||1));}
      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:10px">';
      if(recent.length>1){
        var lp='M'+xp(0)+','+yp(recent[0].weight);
        for(var ri=1;ri<recent.length;ri++)lp+=' L'+xp(ri)+','+yp(recent[ri].weight);
        svg+='<path d="'+lp+'" fill="none" stroke="#a690cf" stroke-width="2" stroke-linecap="round"/>';
      }
      recent.forEach(function(e,ri){
        var isPR=e.weight>=pr;
        svg+='<circle cx="'+xp(ri)+'" cy="'+yp(e.weight)+'" r="'+(isPR?5:3)+'" fill="'+(isPR?'#e8c162':'#a690cf')+'" stroke="#fff" stroke-width="1.5"/>';
        svg+='<text x="'+xp(ri)+'" y="'+(H-1)+'" text-anchor="middle" font-size="8" fill="#c0b8b0">'+e.weight+'</text>';
      });
      svg+='</svg>';
      h+=svg;
    }

    h+='</div>';
  }
  h+='</div>';
  document.getElementById('hdr-title').textContent=esc(prog.name);
  document.getElementById('content').innerHTML=h;
}

function logProgEntry(progIdx,exIdx){
  var progs=loadPrograms();var prog=progs[progIdx];
  if(!prog||!prog.exercises[exIdx])return;
  var ex=prog.exercises[exIdx];
  var wInp=document.getElementById('prog-w-'+exIdx);
  var rInp=document.getElementById('prog-r-'+exIdx);
  var weight=parseFloat(wInp&&wInp.value)||0;
  var reps=parseInt(rInp&&rInp.value)||ex.targetReps;
  if(!weight){showToast('הזן משקל');return;}
  var log=loadProgLog(prog.id,ex.name);
  log.push({date:Date.now(),weight:weight,reps:reps});
  saveProgLog(prog.id,ex.name,log);
  // Check PR
  var prevPR=log.slice(0,-1).reduce(function(m,e){return Math.max(m,e.weight);},0);
  if(weight>prevPR&&prevPR>0)showToast('&#9733; PR חדש! '+weight+'kg ב'+ex.name);
  else showToast('✓ נרשם!');
  renderViewProgram();
}

/* ── BUILDING A ROUTINE ──
   A template used to be "3 sets of 10" - one number for all of them. Which is
   not how anyone trains: the first set is lighter, the last one is where you
   push, and a plan that cannot say so is a plan you have to remember around.

   So an exercise is a block with a row per set, weight and reps in each. Add a
   set to that exercise, add an exercise to the routine, and both appear where
   you put them.

   Old templates still open. Anything without rows gets them made from the
   sets-and-reps it does have, so nothing that already exists has to be
   rebuilt by hand. */
var _tpl=null;      // the routine being edited, held here rather than re-read
function tplRows(ex){
  if(ex.plan&&ex.plan.length)return ex.plan;
  // the old shape: n sets of the same reps, weight unknown
  var n=Math.max(1,parseInt(ex.sets,10)||3),r=parseInt(ex.reps,10)||10,out=[],i;
  for(i=0;i<n;i++)out.push({w:'',r:r});
  return out;
}
function tplLoad(){
  var templates=loadTemplates();
  var t=(_fitEditIdx>=0&&templates[_fitEditIdx])?templates[_fitEditIdx]:{name:'',exercises:[]};
  _tpl={name:t.name||'',exercises:(t.exercises||[]).map(function(ex){
    return {name:ex.name,plan:tplRows(ex).map(function(s){return {w:s.w,r:s.r};})};
  })};
}
/* Typed values go straight into the object without redrawing - a redraw on
   every keystroke takes the keyboard down and puts the caret back at the
   start, which on a phone makes the thing unusable. Only adding or removing
   a row redraws. */
function tplSet(ei,si,k,v){
  if(!_tpl||!_tpl.exercises[ei])return;
  var row=_tpl.exercises[ei].plan[si];
  if(!row)return;
  row[k]=(v===''?'':(parseFloat(v)||0));
}
function tplName(v){if(_tpl)_tpl.name=v;}
function tplAddSet(ei){
  var ex=_tpl&&_tpl.exercises[ei];
  if(!ex)return;
  // a new set starts where the last one left off, which is what you meant
  var last=ex.plan[ex.plan.length-1];
  ex.plan.push(last?{w:last.w,r:last.r}:{w:'',r:10});
  renderFitness();
}
function tplDropSet(ei,si){
  var ex=_tpl&&_tpl.exercises[ei];
  if(!ex||ex.plan.length<=1)return;   // an exercise with no sets is not an exercise
  ex.plan.splice(si,1);
  renderFitness();
}
function tplDropEx(ei){
  if(!_tpl)return;
  _tpl.exercises.splice(ei,1);
  renderFitness();
}
function tplMoveEx(ei,d){
  if(!_tpl)return;
  var to=ei+d;
  if(to<0||to>=_tpl.exercises.length)return;
  var x=_tpl.exercises.splice(ei,1)[0];
  _tpl.exercises.splice(to,0,x);
  renderFitness();
}
function tplAddExercise(){
  exPickInto(function(name){
    if(!_tpl)return;
    _tpl.exercises.push({name:name,plan:[{w:'',r:10}]});
    renderFitness();
    setTimeout(function(){
      var els=document.querySelectorAll('.tb');
      if(els.length)els[els.length-1].scrollIntoView({block:'center',behavior:'smooth'});
    },60);
  });
}
function tplBlockHTML(ex,ei){
  var h='<div class="tb">';
  h+='<div class="tb-hd"><span class="tb-n">'+esc(ex.name)+'</span>';
  h+='<span class="tb-tools">';
  if(ei>0)h+='<button onclick="tplMoveEx('+ei+',-1)" aria-label="למעלה">&#8963;</button>';
  h+='<button onclick="tplDropEx('+ei+')" aria-label="הסר">&times;</button>';
  h+='</span></div>';
  h+='<div class="tb-cols"><span>סט</span><span>ק"ג</span><span>חזרות</span><span></span></div>';
  for(var si=0;si<ex.plan.length;si++){
    var s=ex.plan[si];
    h+='<div class="tb-row">';
    h+='<span class="tb-i">'+(si+1)+'</span>';
    h+='<input class="tb-in" type="number" inputmode="decimal" step="0.5" placeholder="&ndash;" value="'+(s.w===''||s.w===undefined?'':s.w)+'" oninput="tplSet('+ei+','+si+',&quot;w&quot;,this.value)">';
    h+='<input class="tb-in" type="number" inputmode="numeric" placeholder="&ndash;" value="'+(s.r===''||s.r===undefined?'':s.r)+'" oninput="tplSet('+ei+','+si+',&quot;r&quot;,this.value)">';
    h+='<button class="tb-x" onclick="tplDropSet('+ei+','+si+')"'+(ex.plan.length<=1?' disabled':'')+'>&times;</button>';
    h+='</div>';
  }
  h+='<button class="tb-add" onclick="tplAddSet('+ei+')">+ הוסף סט</button>';
  return h+'</div>';
}
function tplSave(){
  if(!_tpl)return;
  var name=(_tpl.name||'').trim();
  if(!name){showToast('תן שם לתבנית');return;}
  if(!_tpl.exercises.length){showToast('הוסף לפחות תרגיל אחד');return;}
  var templates=loadTemplates();
  /* Kept in both shapes on purpose: plan is what this screen reads, and sets
     and reps are what the older screens still expect. Dropping them would
     have quietly emptied the programme views. */
  var t={name:name,exercises:_tpl.exercises.map(function(ex){
    var plan=ex.plan.map(function(s){return {w:(s.w===''?0:s.w),r:(s.r===''?0:s.r)};});
    var reps=plan.length?plan[plan.length-1].r:10;
    return {name:ex.name,plan:plan,sets:plan.length,reps:reps};
  })};
  if(_fitEditIdx>=0)templates[_fitEditIdx]=t;
  else {templates.push(t);_fitEditIdx=templates.length-1;}
  saveTemplates(templates);
  _tpl=null;
  showToast('נשמר &#10003;');
  _fitView='home';renderFitness();
}
function tplCancel(){_tpl=null;_fitView='home';renderFitness();}
function renderFitEditTemplate(){
  if(!_tpl)tplLoad();
  var h='<div style="padding-bottom:30px">';
  h+='<div class="tpl-t">'+(_fitEditIdx>=0?'עריכת תבנית':'תבנית חדשה')+'</div>';
  h+='<input class="tpl-name" value="'+esc(_tpl.name)+'" placeholder="שם התבנית — למשל דחיפה" oninput="tplName(this.value)">';
  for(var ei=0;ei<_tpl.exercises.length;ei++)h+=tplBlockHTML(_tpl.exercises[ei],ei);
  if(!_tpl.exercises.length)h+='<div class="tpl-empty">עוד אין תרגילים. הוסף את הראשון.</div>';
  h+='<button class="tpl-addex" onclick="tplAddExercise()">+ הוסף תרגיל</button>';
  h+='<div class="tpl-btns">';
  h+='<button class="tpl-save" onclick="tplSave()">שמור</button>';
  h+='<button class="tpl-cancel" onclick="tplCancel()">ביטול</button>';
  if(_fitEditIdx>=0)h+='<button class="tpl-del" onclick="deleteFitTemplate('+_fitEditIdx+')">מחק</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
}

function addFitExercise(){
  var name=document.getElementById('fit-ex-name');
  var sets=document.getElementById('fit-ex-sets');
  var reps=document.getElementById('fit-ex-reps');
  if(!name||!name.value.trim())return;
  var templates=loadTemplates();
  if(_fitEditIdx<0){
    // save name first then add
    if(!templates[_fitEditIdx]){
      var nm=document.getElementById('fit-tpl-name');
      templates.push({name:nm?nm.value.trim()||'חדש':'',exercises:[]});
      _fitEditIdx=templates.length-1;
      saveTemplates(templates);
    }
  }
  if(!templates[_fitEditIdx])return;
  templates[_fitEditIdx].exercises.push({name:name.value.trim(),sets:parseInt(sets.value)||3,reps:parseInt(reps.value)||10});
  saveTemplates(templates);renderFitness();
}

function removeFitExercise(idx){
  var templates=loadTemplates();
  if(templates[_fitEditIdx])templates[_fitEditIdx].exercises.splice(idx,1);
  saveTemplates(templates);renderFitness();
}

function saveFitTemplate(){
  var nm=document.getElementById('fit-tpl-name');
  var templates=loadTemplates();
  var name=nm?nm.value.trim():'אימון';
  if(_fitEditIdx>=0&&templates[_fitEditIdx]){
    templates[_fitEditIdx].name=name;
  } else {
    templates.push({name:name,exercises:[]});
  }
  saveTemplates(templates);_fitView='home';renderFitness();
}

function deleteFitTemplate(idx){
  var templates=loadTemplates();templates.splice(idx,1);
  saveTemplates(templates);_fitView='home';renderFitness();
}

function startWorkout(tplIdx){
  var templates=loadTemplates();var t=templates[tplIdx];if(!t)return;
  _fitWorkout={
    templateIdx:tplIdx,name:t.name,startTime:Date.now(),
    exercises:t.exercises.map(function(ex){
      // the planned rows come with it, so each set's boxes open on what you
      // meant to lift rather than on nothing
      var plan=tplRows(ex);
      return{name:ex.name,targetSets:plan.length,
             targetReps:(plan[0]&&plan[0].r)||ex.reps||10,
             plan:plan,sets:[]};
    }),
    currentEx:0
  };
  _fitView='workout';renderFitness();
}

/* ── WHAT YOU DID LAST TIME ──
   The one thing Hevy has that we did not, and the thing every review of it
   names first: while you are standing there with the bar, it shows you what
   you lifted last time on that exact exercise. Everything else follows from
   it - if the app knows last week's sets it can also fill the boxes in for
   you, and then logging a set is a tap rather than typing two numbers with
   chalk on your hands.

   The log already holds all of it. Nothing new is stored; this is a question
   nobody had asked of it yet. */
function exLastTime(name){
  var log=loadWorkoutLog(),i,j;
  for(i=log.length-1;i>=0;i--){
    var exs=log[i].exercises||[];
    for(j=0;j<exs.length;j++){
      if(exs[j].name===name&&exs[j].sets&&exs[j].sets.length)
        return {date:log[i].date,sets:exs[j].sets,workout:log[i].name};
    }
  }
  return null;
}
// "לפני 3 ימים" reads better than a date you have to work out
function agoText(ms){
  var d=Math.floor((Date.now()-ms)/86400000);
  if(d<=0)return 'היום';
  if(d===1)return 'אתמול';
  if(d<7)return 'לפני '+d+' ימים';
  if(d<14)return 'לפני שבוע';
  if(d<31)return 'לפני '+Math.round(d/7)+' שבועות';
  return 'לפני '+Math.round(d/30)+' חודשים';
}
/* The line above the boxes: what the same set number was last time, and
   whether what you have just done beats it. A number to beat is the whole
   point of writing any of this down. */
function exPrevHTML(ex){
  var prev=exLastTime(ex.name);
  if(!prev)return '<div class="fw-prev none">הפעם הראשונה שאתה עושה את זה &mdash; מה שתרשום היום יהיה מה שתנסה לעבור בפעם הבאה.</div>';
  var h='<div class="fw-prev"><div class="fw-prev-t">בפעם הקודמת &middot; '+agoText(prev.date)+'</div><div class="fw-prev-s">';
  for(var i=0;i<prev.sets.length;i++){
    var s=prev.sets[i],mine=ex.sets[i];
    var better=mine&&((mine.weight>s.weight)||(mine.weight===s.weight&&mine.reps>s.reps));
    var same=mine&&mine.weight===s.weight&&mine.reps===s.reps;
    h+='<span class="fw-ps'+(better?' beat':(same?' same':''))+'">'+
       (s.weight?s.weight+'&times;':'')+s.reps+'</span>';
  }
  return h+'</div></div>';
}
// what to put in the boxes before you touch them: the same set, last time
function exPrefill(ex){
  var n=ex.sets.length;
  /* What the routine says for this set comes first: you wrote it more
     recently than you lifted last week, so it is the better guess at what
     you are about to do. */
  if(ex.plan&&ex.plan[n]&&(ex.plan[n].w!==''||ex.plan[n].r!==''))
    return {w:ex.plan[n].w||'',r:ex.plan[n].r||''};
  var prev=exLastTime(ex.name);
  if(prev&&prev.sets[n])return {w:prev.sets[n].weight,r:prev.sets[n].reps};
  if(prev&&prev.sets.length)return {w:prev.sets[prev.sets.length-1].weight,r:prev.sets[prev.sets.length-1].reps};
  return {w:'',r:''};
}

/* ── THE REST TIMER ──
   Starts itself when a set goes in, because that is the moment rest begins
   and reaching for a phone to start a timer is the moment you forget to. It
   counts down in the corner, it can be skipped, and it makes a noise at zero
   so you can put the phone down and not watch it.

   The sound is built rather than loaded: two short tones from the oscillator
   the game already uses. A file would have to be fetched, and this needs to
   work in a basement gym with no signal. */
var REST_KEY='fit_rest',_restEnd=0,_restIv=null;
function restLen(){
  try{var v=parseInt(localStorage.getItem(REST_KEY),10);if(v>=0&&v<=600)return v;}catch(e){}
  return 90;
}
function restSet(n){
  try{localStorage.setItem(REST_KEY,String(n));}catch(e){}
  // redraw so the chosen length shows as chosen; only the workout screen
  // has these buttons, so only it needs redrawing
  if(typeof _fitView!=='undefined'&&_fitView==='workout')renderFitness();
}
function restBeep(){
  if(typeof sndOn==='function'&&!sndOn())return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    var a=new C();
    [0,0.18].forEach(function(off,i){
      var o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=i?880:660;
      g.gain.setValueAtTime(0.0001,a.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.25,a.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+off+0.15);
      o.connect(g);g.connect(a.destination);
      o.start(a.currentTime+off);o.stop(a.currentTime+off+0.2);
    });
    setTimeout(function(){try{a.close();}catch(e){}},900);
  }catch(e){}
}
function restStart(){
  var n=restLen();
  if(!n)return;                       // set to zero means the user turned it off
  _restEnd=Date.now()+n*1000;
  if(_restIv)clearInterval(_restIv);
  _restIv=setInterval(restTick,250);
  restTick();
}
function restStop(){
  if(_restIv){clearInterval(_restIv);_restIv=null;}
  _restEnd=0;
  var el=document.getElementById('fw-rest');if(el)el.remove();
}
function restTick(){
  var left=Math.ceil((_restEnd-Date.now())/1000);
  if(left<=0){restBeep();restStop();return;}
  var el=document.getElementById('fw-rest');
  if(!el){
    document.body.insertAdjacentHTML('beforeend',
      '<div class="fw-rest" id="fw-rest"><span class="fw-rest-n" id="fw-rest-n"></span>'+
      '<button class="fw-rest-x" onclick="restStop()">דלג</button></div>');
    el=document.getElementById('fw-rest');
  }
  var n=document.getElementById('fw-rest-n');
  if(n)n.textContent=Math.floor(left/60)+':'+(left%60<10?'0':'')+(left%60);
}
/* ── THE EXERCISE LIBRARY ──
   Until now an exercise was whatever you typed, which meant "לחיצת חזה" and
   "לחיצת חזה " and "בנץ" were three different exercises as far as the app was
   concerned - and the previous-time line we just built is worth nothing if
   last week's name does not match this week's.

   So: a list, found the way Hevy lets you find one - by the muscle it works,
   by the equipment in front of you, or by typing. The English name is carried
   alongside because half the gym says it that way, and searching either finds
   the same row. */
var _exDB=null,_exState='idle',_exTab='muscle',_exFilter='',_exQ='',_exPick=null;
function exLoad(cb){
  if(_exState==='ready')return cb&&cb();
  if(_exState==='loading'){setTimeout(function(){exLoad(cb);},120);return;}
  _exState='loading';
  fetch(appBase()+'data/exercises.json').then(function(r){return r.json();}).then(function(j){
    _exDB=j;_exState='ready';cb&&cb();
  },function(){_exState='idle';cb&&cb();});
}
function exAll(){return (_exDB&&_exDB.exercises)||[];}
// what you type finds the Hebrew or the English, whichever you happen to know
function exMatch(e,q){
  if(!q)return true;
  q=q.toLowerCase();
  return e.n.toLowerCase().indexOf(q)>=0||(e.en||'').toLowerCase().indexOf(q)>=0;
}
function exList(){
  var all=exAll(),out=[],i,e;
  for(i=0;i<all.length;i++){
    e=all[i];
    if(!exMatch(e,_exQ))continue;
    if(_exQ){out.push(e);continue;}                 // typing overrides the tabs
    if(_exTab==='muscle'&&_exFilter&&e.m.indexOf(_exFilter)<0)continue;
    if(_exTab==='equip'&&_exFilter&&e.q.indexOf(_exFilter)<0)continue;
    out.push(e);
  }
  return out;
}
function exOpen(){
  _exQ='';_exFilter='';_exTab='muscle';_exDetail=null;
  // the sheet has to exist before anything can be painted into it. Loading
  // first only worked while the file was still being fetched; once it was
  // cached exLoad called back immediately, ex-body did not exist yet, and
  // the list came up empty on every open after the first.
  exSheet();
  exLoad(function(){exPaint();});
}
function exClose(){
  var o=document.getElementById('ex-ov');if(o)o.remove();
  document.body.style.overflow='';
}
function exSetTab(t){_exTab=t;_exFilter='';_exPaintBody();}
function exSetFilter(f){_exFilter=(_exFilter===f)?'':f;_exPaintBody();}
function exSearch(v){_exQ=v;_exPaintBody();}
function exSheet(){
  var old=document.getElementById('ex-ov');if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',
    '<div class="ex-ov" id="ex-ov" onclick="if(event.target===this)exClose()">'+
    '<div class="ex-sheet">'+
    '<div class="ex-hd"><span>בחר תרגיל</span>'+
    '<button class="ex-x" onclick="exClose()">&times;</button></div>'+
    '<input class="ex-q" id="ex-q" placeholder="חפש בעברית או באנגלית" oninput="exSearch(this.value)">'+
    '<div id="ex-body"></div>'+
    '</div></div>');
  document.body.style.overflow='hidden';
}
function exPaint(){_exPaintBody();}
function _exPaintBody(){
  var el=document.getElementById('ex-body');
  if(!el)return;
  if(_exState!=='ready'){el.innerHTML='<div class="ex-none">טוען&hellip;</div>';return;}
  // one exercise open takes the whole sheet: it is a page, not a row
  if(_exDetail){el.innerHTML=exDetailHTML(_exDetail);return;}
  var h='';
  if(!_exQ){
    h+='<div class="ex-tabs">'+
       '<button class="ex-tab'+(_exTab==='muscle'?' on':'')+'" onclick="exSetTab(&quot;muscle&quot;)">לפי שריר</button>'+
       '<button class="ex-tab'+(_exTab==='equip'?' on':'')+'" onclick="exSetTab(&quot;equip&quot;)">לפי ציוד</button>'+
       '</div>';
    /* Cards with a picture, in sections, rather than fifteen word-chips in a
       row - you find יד אחורית by seeing an arm, not by reading labels. */
    function count(k){
      return exAll().filter(function(e){
        return (_exTab==='muscle'?e.m:e.q).indexOf(k)>=0;
      }).length;
    }
    function card(k,art){
      var n=count(k);
      if(!n)return '';
      return '<button class="gp'+(art?'':' bare')+(_exFilter===k?' on':'')+'" onclick="exSetFilter(&quot;'+esc(k)+'&quot;)">'+
        art+'<span class="gp-t">'+esc(k)+'</span><span class="gp-n">'+n+'</span></button>';
    }
    if(_exTab==='muscle'){
      for(var si=0;si<MU_SECTIONS.length;si++){
        var sec=MU_SECTIONS[si],inner='';
        for(var mi=0;mi<sec.m.length;mi++)inner+=card(sec.m[mi],'');
        if(!inner)continue;
        h+='<div class="gp-h">'+sec.t+'</div><div class="gp-grid">'+inner+'</div>';
      }
    } else {
      var eq=_exDB.equipment||[],eh='';
      for(var qi=0;qi<eq.length;qi++)eh+=card(eq[qi],eqArtHTML(eq[qi]));
      h+='<div class="gp-grid">'+eh+'</div>';
    }
  }
  var list=exList();
  if(!list.length){
    h+='<div class="ex-none">לא מצאתי. אפשר גם להקליד שם משלך למטה.</div>';
  } else {
    h+='<div class="ex-list">';
    for(var j=0;j<list.length;j++){
      var e=list[j];
      h+='<button class="ex-row" onclick="exDetailOpen('+j+')">'+
         '<span class="ex-n">'+esc(e.n)+'</span>'+
         '<span class="ex-meta">'+esc(e.m.join(' · '))+' &middot; '+esc(e.q.join(', '))+'</span>'+
         (e.en?'<span class="ex-en">'+esc(e.en)+'</span>':'')+
         '</button>';
    }
    h+='</div>';
  }
  // whatever the library does not have, you can still name yourself
  h+='<div class="ex-own"><input class="ex-q" id="ex-own" placeholder="או תרגיל משלך&hellip;">'+
     '<button class="ex-add" onclick="exChooseOwn()">הוסף</button></div>';
  el.innerHTML=h;
}
function exChoose(i){
  var e=exList()[i];
  if(!e)return;
  exClose();
  if(_exPick)_exPick(e.n,e);
}
function exChooseOwn(){
  var el=document.getElementById('ex-own');
  var v=el&&el.value.trim();
  if(!v)return;
  exClose();
  if(_exPick)_exPick(v,null);
}
/* Open the library and do something with what comes back. Everywhere that
   wants an exercise name goes through here, so they all get the same list. */
/* ── THE GROUPS, AS A GRID WITH PICTURES ──
   A row of word-chips makes you read fifteen labels to find one. Hevy shows a
   card per group with the muscle drawn and highlighted, split into upper body,
   lower body and everything else - and you find יד אחורית by seeing an arm,
   not by reading.

   The diagrams are wger's (CC-BY-SA 3.0): one drawing of the muscular system
   for the front and one for the back, plus a small overlay per muscle. The
   bodies are 300-400KB each and every overlay is about 3KB, which is the right
   way round - the expensive part is fetched once and shared by all of them.

   Equipment gets drawn here instead. A barbell is four rectangles and a line;
   sourcing photographs of gym kit would mean another licence to keep track of
   for something a few paths do better at this size. */
var MU_SECTIONS=[
  {t:'פלג גוף עליון',m:['חזה','גב','גב רחב','טרפז','כתפיים','יד קדמית','יד אחורית','אמה']},
  {t:'פלג גוף תחתון',m:['ארבע ראשי','ירך אחורית','ישבן','תאומים']},
  {t:'מרכז הגוף ואחר',m:['בטן','אלכסונים','גב תחתון','אירובי']}
];
/* Equipment, drawn. Line work in the app's own weight rather than photographs
   of gym kit, which would be a fourth licence to keep track of. */
var EQ_ICONS={
  'מוט':'<path d="M3 12h18"/><rect x="4" y="8.5" width="2.6" height="7" rx="1"/><rect x="17.4" y="8.5" width="2.6" height="7" rx="1"/><rect x="7.2" y="10" width="1.8" height="4" rx=".8"/><rect x="15" y="10" width="1.8" height="4" rx=".8"/>',
  'משקולות יד':'<path d="M7.5 12h9"/><rect x="3.2" y="8" width="3" height="8" rx="1.2"/><rect x="17.8" y="8" width="3" height="8" rx="1.2"/><rect x="6.6" y="9.6" width="1.6" height="4.8" rx=".7"/><rect x="15.8" y="9.6" width="1.6" height="4.8" rx=".7"/>',

/* ── ONE EXERCISE ──
   Two questions, one screen. Where do I stand on this compared with before,
   and how is it meant to be done.

   The first is the reason to write any of it down. A log you never read back
   is a diary; the number that matters is not what you lifted today but
   whether it is more than last time, and whether last time was more than the
   time before. So the screen leads with the best set ever, the last session,
   and the distance between them.

   The second is the part no amount of logging gives you. Every exercise here
   that has it says how it is done in four lines and what goes wrong in three
   - and the mistakes are the half worth reading, because the steps you can
   guess and the mistakes you cannot. */
var _exDetail=null;
function exSessions(name){
  var log=loadWorkoutLog(),out=[],i,j;
  for(i=0;i<log.length;i++){
    var exs=log[i].exercises||[];
    for(j=0;j<exs.length;j++){
      if(exs[j].name!==name||!(exs[j].sets||[]).length)continue;
      var sets=exs[j].sets;
      var top=sets[0],vol=0;
      for(var k=0;k<sets.length;k++){
        vol+=(sets[k].weight||0)*(sets[k].reps||0);
        // the heaviest set, and on a tie the one with more reps
        if((sets[k].weight||0)>(top.weight||0)||
           ((sets[k].weight||0)===(top.weight||0)&&(sets[k].reps||0)>(top.reps||0)))top=sets[k];
      }
      out.push({date:log[i].date,sets:sets,top:top,vol:Math.round(vol)});
    }
  }
  out.sort(function(a,b){return a.date-b.date;});
  return out;
}
/* Comparing two sets by weight alone calls 60x5 an improvement on 55x12,
   which nobody believes. Weight times reps is crude but it moves in the right
   direction for both, and it is what "am I stronger than last month" means
   when the reps were not identical. */
function exWork(s){return (s.weight||0)*(s.reps||0);}
function exStand(name){
  var ss=exSessions(name);
  if(!ss.length)return null;
  var last=ss[ss.length-1],first=ss[0];
  var best=ss[0];
  for(var i=1;i<ss.length;i++)if(exWork(ss[i].top)>exWork(best.top))best=ss[i];
  var prev=ss.length>1?ss[ss.length-2]:null;
  return {n:ss.length,sessions:ss,last:last,first:first,best:best,prev:prev,
          isBest:best===last,
          delta:prev?exWork(last.top)-exWork(prev.top):0};
}
function setLabel(s){return (s.weight?s.weight+'×':'')+(s.reps||0);}
/* A line per session, scaled to the best one. Not a chart with axes - the
   question is "is it going up", and twelve bars answer that faster than
   numbers on a grid. */
function exBarsHTML(st){
  var ss=st.sessions.slice(-12),max=1,i;
  for(i=0;i<ss.length;i++)max=Math.max(max,exWork(ss[i].top));
  var h='<div class="xd-bars">';
  for(i=0;i<ss.length;i++){
    var w=exWork(ss[i].top),pc=Math.round(w/max*100);
    var isLast=i===ss.length-1;
    h+='<span class="xd-bar'+(isLast?' now':'')+'" style="height:'+Math.max(6,pc)+'%" '+
       'title="'+setLabel(ss[i].top)+'"></span>';
  }
  return h+'</div><div class="xd-bars-l">'+ss.length+' אימונים אחרונים</div>';
}

    h+='<div class="xd-cell"><span class="xd-k">בפעם האחרונה</span><span class="xd-v">'+setLabel(st.last.top)+'</span>'+

         ': '+(g>0?'עלייה':(g<0?'ירידה':'ללא שינוי'))+'</div>';
    }
    // the sessions themselves, most recent first
    h+='<div class="xd-h">האימונים</div><div class="xd-log">';
    var ss=st.sessions.slice().reverse().slice(0,8);

         '<span class="xd-sets">'+ss[i].sets.map(setLabel).join(' · ')+'</span></div>';
    }

  // ── how it is done ──
  if(e.s&&e.s.length){

    for(var j=0;j<e.s.length;j++)h+='<li>'+esc(e.s[j])+'</li>';

  }

    for(var m=0;m<e.k.length;m++)h+='<li>'+esc(e.k[m])+'</li>';
    h+='</ul>';
  }
  if(!(e.s&&e.s.length))
    h+='<div class="xd-none small">ההסבר לתרגיל הזה עוד לא נכתב.</div>';

  h+='<button class="xd-pick" onclick="exDetailChoose()">בחר את התרגיל הזה</button>';
  return h+'</div>';
}

   "Should I add weight" has no answer until the app knows what you are
   training for. Five reps at a heavy weight is a good set for strength and a
   wasted one for endurance, and the same session read against two goals gives
   two different instructions.

   the app expects, how much to add when you clear it, and how it talks about

function fitGoal(){
  var v;try{v=localStorage.getItem(FIT_GOAL_KEY);}catch(e){}
  for(var i=0;i<FIT_GOALS.length;i++)if(FIT_GOALS[i].v===v)return FIT_GOALS[i];

}

/* ── WHAT TO DO INSTEAD ──
   The bench is taken. That is not an edge case, it is Tuesday evening, and an
   app that has no answer for it is an app you put down and improvise around.

   The answer is built rather than listed: anything working the same muscle is
   a candidate, and it is ranked by how little you have to change. Same muscle
   and same equipment is the closest thing; same muscle on a machine when you
   wanted free weights is further but usually available; a different muscle is
   never offered, because that is a different session. */
/* freeEquip: the kit is the problem, so sharing it is a fault rather than a
   virtue. Without this the answer to "the bench is taken" was a list of
   other exercises that need a bench - correct as "what is similar", useless
   as "what can I do instead". */
function exAltRank(want,cand,freeEquip){
  if(cand.n===want.n)return -1;
  var same=0,i;
  for(i=0;i<want.m.length;i++)if(cand.m.indexOf(want.m[i])>=0)same++;
  if(!same)return -1;                     // a different muscle is a different exercise
  var s=100;
  var sharedQ=0;
  for(i=0;i<want.q.length;i++)if(cand.q.indexOf(want.q[i])>=0)sharedQ++;
  s+=freeEquip?(-sharedQ*22):(sharedQ*14);
  // a machine is the answer when the free weights are busy, so it is not penalised
  if(cand.q.indexOf('מכונה')>=0||cand.q.indexOf('פולי')>=0)s+=8;
  // bodyweight always works, and always beats waiting
  if(cand.q.indexOf('משקל גוף')>=0)s+=6;
  return s;
}
function exAlternatives(name,n,freeEquip){
  var all=exAll(),want=null,i;
  for(i=0;i<all.length;i++)if(all[i].n===name)want=all[i];
  if(!want)return [];
  var out=[];
  for(i=0;i<all.length;i++){
    var r=exAltRank(want,all[i],freeEquip);
    if(r>0)out.push({e:all[i],r:r});
  }
  out.sort(function(a,b){return b.r-a.r;});
  return out.slice(0,n||4).map(function(x){return x.e;});
}
function exAltWhy(want,cand){
  var shared=0,i;
  for(i=0;i<want.q.length;i++)if(cand.q.indexOf(want.q[i])>=0)shared++;
  if(!shared)return 'ציוד אחר לגמרי — '+cand.q.join(', ');
  if(shared===want.q.length)return 'אותו ציוד, תנועה קרובה';
  if(cand.q.indexOf('מכונה')>=0)return 'מכונה ייעודית — כמעט תמיד פנויה';
  if(cand.q.indexOf('פולי')>=0)return 'בפולי, מתח קבוע לאורך התנועה';
  if(cand.q.indexOf('משקל גוף')>=0)return 'בלי ציוד בכלל';
  return 'אותו שריר, ציוד אחר';
}

/* ── WHAT TO DO NEXT TIME ──
   Read per exercise, against the goal, from what actually happened. Not
   "great workout" - a number and a reason.

   The rule is the same one every programme uses and most people apply by
   feel: clear the top of the rep range on every set and the weight goes up;
   fall short of the bottom on every set and it comes down; anything between
   is a repeat. What the goal changes is where the range sits and how big the
   step is - 2.5kg on a bench is a different proposition from 2.5kg on a
   lateral raise, so the step is smaller for the small movements. */
function nextAdvice(exName,sets){
  var g=fitGoal();
  if(!sets||!sets.length)return null;
  var done=sets.filter(function(s){return (s.reps||0)>0;});
  if(!done.length)return null;
  var top=done[0],i,allOver=true,allUnder=true;
  for(i=0;i<done.length;i++){
    var r=done[i].reps||0;
    if(r<g.hi)allOver=false;
    if(r>=g.lo)allUnder=false;
    if((done[i].weight||0)>(top.weight||0))top=done[i];
  }
  var w=top.weight||0;
  // an isolation movement moves in smaller steps than a compound one
  var small=/הרחק|הרמה קדמית|פרפר|כפיפת מרפק|פשיטת מרפק|בעיטת|כפיפת שורש|כפיפת ריכוז|משיכת כתפיים/.test(exName);
  var step=small?Math.max(1.25,g.step/2):g.step;
  if(allOver&&w>0)
    return {dir:'up',w:w+step,
      t:'העלה ל־'+(w+step)+' ק"ג',
      why:'השלמת '+g.hi+'+ חזרות בכל הסטים במשקל '+w+'.'};
  if(allOver)
    return {dir:'up',w:0,t:'הוסף חזרות או משקל',
      why:'עברת את הטווח בכל הסטים במשקל הגוף.'};
  if(allUnder&&w>0)
    return {dir:'down',w:Math.max(0,w-step),
      t:'רד ל־'+Math.max(0,w-step)+' ק"ג',
      why:'לא הגעת ל־'+g.lo+' חזרות באף סט. המשקל גבוה מדי כרגע.'};
  return {dir:'hold',w:w,
    t:'אותו משקל שוב',
    why:'אתה בתוך הטווח. חזור על '+w+' ק"ג ונסה להוסיף חזרה.'};
}
/* The session as a whole: how much work, and whether it was more than the
   one before it. Volume is a blunt number but it is the one that answers
   "did I do more today". */
function sessionStats(entry){
  var sets=0,vol=0,reps=0,ex=(entry.exercises||[]);
  for(var i=0;i<ex.length;i++)for(var j=0;j<(ex[i].sets||[]).length;j++){
    var s=ex[i].sets[j];
    sets++;reps+=(s.reps||0);vol+=(s.weight||0)*(s.reps||0);
  }
  return {ex:ex.length,sets:sets,reps:reps,vol:Math.round(vol),min:entry.duration||0};
}
// how the work split across the body, which is the thing a week of sessions
// hides from you until it is drawn
function sessionByMuscle(entry){
  var out={},all=exAll(),i,j,k;
  for(i=0;i<(entry.exercises||[]).length;i++){
    var name=entry.exercises[i].name,m=null;
    for(k=0;k<all.length;k++)if(all[k].n===name)m=all[k].m[0];
    if(!m)m='אחר';
    out[m]=(out[m]||0)+(entry.exercises[i].sets||[]).length;
  }
  return out;
}

var _fitCase=null;

function logSet(){
  if(!_fitWorkout)return;
  var w=document.getElementById('fit-w');var r=document.getElementById('fit-r');var rpeInp=document.getElementById('fit-rpe');
  var weight=parseFloat(w?w.value:0)||0;var reps=parseInt(r?r.value:0)||0;
  var rpe=rpeInp&&rpeInp.value?parseFloat(rpeInp.value):null;
  if(!reps)return;
  var ex=_fitWorkout.exercises[_fitWorkout.currentEx];
  ex.sets.push({weight:weight,reps:reps,rpe:rpe});
  restStart();   // rest begins the moment the set ends, not when you remember
  // Update PR
  if(weight>0){
    var prs=loadPRs();var key=ex.name;
    if(weight>(prs[key]||0)){prs[key]=weight;savePRs(prs);showToast('&#9733; PR חדש! '+weight+'kg ב'+key);}
  }
  renderFitness();
}

function removeSet(idx){
  if(!_fitWorkout)return;
  _fitWorkout.exercises[_fitWorkout.currentEx].sets.splice(idx,1);
  renderFitness();
}

function finishWorkout(){
  if(!_fitWorkout)return;
  var w=_fitWorkout;
  var log=loadWorkoutLog();
  var entry={
    date:Date.now(),name:w.name,
    duration:Math.floor((Date.now()-w.startTime)/60000),
    exercises:w.exercises.map(function(ex){
      return{name:ex.name,targetSets:ex.targetSets,targetReps:ex.targetReps,sets:ex.sets.slice()};
    })
  };
  log.push(entry);saveWorkoutLog(log);
  restStop();
  _fitWorkout=null;
  _fitView='summary';
  _fitSummaryEntry=entry;
  renderFitness();
}

var _fitSummaryEntry=null;

function calcRPE(weight,reps,targetReps){
  // Rough RPE: if reps === target → ~7, more → lower, fewer → higher
  var diff=reps-targetReps;
  if(diff>=3)return 5;
  if(diff===2)return 6;
  if(diff===1)return 6.5;
  if(diff===0)return 7.5;
  if(diff===-1)return 8.5;
  if(diff<=-2)return 9.5;
  return 7;
}

  // 4.4 Goals for next

    h+='<span style="font-size:11px;color:#9A9184;text-align:right">'+suggestion+'</span></div>';
  });
  h+='</div>';

  // 4.6 Closing card
  var bestEx=entry.exercises.reduce(function(best,ex){

  h+='<div style="background:#D6ECE8;color:#2E6B62;border-radius:16px;padding:16px;font-size:13px;line-height:1.7;margin-bottom:16px">';

  h+='<div><b style="font-weight:800">סה"כ:</b> '+totalSets+' סטים'+(avgRPE!==null?', RPE ממוצע '+avgRPE+'. '+(avgRPE>=9?'עומס כבד — שים לב להתאוששות.':avgRPE>=7.5?'אימון טוב — באזור העלייה.':'אימון נוח. אפשר להעלות במשקל.'):'.')+' אין דיווח כאב.</div>';
  h+='</div>';

  /* The part a summary is for. Every other line says what happened; these
