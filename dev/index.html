<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#e8dff5">

<meta name="apple-mobile-web-app-title" content="תזונה">

<link rel="icon" href="assets/logo.png">

<title>&#x05EA;&#x05D6;&#x05D5;&#x05E0;&#x05D4;</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f0eb;color:#4a4340;direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 100px}
.hdr{background:linear-gradient(135deg,#f0ebe3,#e8dff5);padding:16px 16px 12px;position:sticky;top:0;z-index:10}
.hdr-date{text-align:center;font-size:11px;color:#a89e97;margin-bottom:3px}
.hdr-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-nav{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nav-arrow{background:#fff;border:none;border-radius:12px;width:34px;height:34px;flex-shrink:0;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.2)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.6);border-radius:14px;padding:4px;flex:1;min-width:0}
.tab{flex:1;padding:7px 4px;border:none;border-radius:11px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#a89e97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.content{padding:14px 14px 0}
/* the floating button needs somewhere to float that is not on top of the
   last thing you ate */
#content.has-fab{padding-bottom:96px}
/* The game is a whole page of its own - dark, full-bleed, with its own CSS
   reset - so it runs inside an iframe instead of fighting the app's styles. */
.app.game-mode{padding-bottom:0}
.game-wrap{border-radius:22px;overflow:hidden;background:#160d06;box-shadow:0 4px 18px rgba(120,80,40,.22)}
.game-frame{display:block;width:100%;height:520px;border:0}
.macro-card{background:#fff;border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.macro-title{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;text-align:center;margin-bottom:14px}
.macro-bars{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.macro-col{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.macro-pct{font-size:11px;color:#a89e97;font-weight:600}
.macro-track{width:34px;height:100px;background:#f2ede6;border-radius:17px;overflow:hidden;position:relative}
.macro-fill{width:100%;height:0%;border-radius:17px;position:absolute;bottom:0;transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.macro-val{font-size:16px;font-weight:700}
.macro-lbl{font-size:11px;color:#a89e97}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pill{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(200,180,160,.1)}
.pill-val{font-size:17px;font-weight:700}
.pill-lbl{font-size:9.5px;color:#a89e97;margin-top:2px}
.wcard{background:linear-gradient(135deg,#e8f4fd,#dbeef9);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.whd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wt{font-size:13px;font-weight:700;color:#3a7ca5}
.wn{font-size:12px;color:#5b8fa8;font-weight:600}
.wb{height:6px;background:rgba(255,255,255,.5);border-radius:3px;margin-bottom:10px;overflow:hidden}
.wf{height:100%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:3px;width:0%;transition:width .6s}
.wbtns{display:flex;gap:7px}
.wadd{flex:1;background:#fff;border:none;border-radius:11px;padding:8px;font-size:12px;font-weight:700;color:#3a7ca5;cursor:pointer}
.wreset{background:rgba(255,255,255,.7);border:none;border-radius:11px;padding:8px 10px;font-size:16px;cursor:pointer}
/* Steps, mirroring the water card that sits right above it. Read-only here -
   the number is written by whatever source was connected under כושר, and
   tapping the card goes there. */
/* what you did last time, and whether today beat it */
/* choosing an exercise */
/* building a routine: a block per exercise, a row per set */
.tpl-t{font-size:16px;font-weight:800;color:#4a4340;margin-bottom:12px}
.tpl-name{width:100%;border:none;border-bottom:2px solid #ece5da;background:none;padding:8px 2px;font-size:17px;font-weight:800;font-family:inherit;color:#4a4340;outline:none;margin-bottom:18px;text-align:right}
.tpl-name:focus{border-bottom-color:#a690cf}
.tb{background:#fff;border-radius:18px;padding:12px 12px 8px;margin-bottom:10px;box-shadow:0 2px 10px rgba(200,180,160,.1)}
.tb-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tb-n{font-size:14px;font-weight:800;color:#4a4340;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb-tools{display:flex;gap:2px;flex-shrink:0}
.tb-tools button{border:none;background:none;color:#c0b6ae;font-size:15px;cursor:pointer;padding:2px 6px;font-family:inherit}
.tb-cols,.tb-row{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:7px;align-items:center}
.tb-cols{margin-bottom:5px}
.tb-cols span{font-size:9px;font-weight:800;color:#c0b6ae;text-align:center;letter-spacing:.04em}
.tb-row{margin-bottom:6px}
.tb-i{font-size:12px;font-weight:800;color:#a89e97;text-align:center;background:#f5f0eb;border-radius:8px;padding:8px 0}
.tb-in{width:100%;border:1.5px solid #ece5da;border-radius:9px;padding:8px 4px;font-size:15px;font-weight:700;font-family:inherit;color:#4a4340;background:#fff;outline:none;text-align:center;direction:ltr}
.tb-in:focus{border-color:#a690cf}
.tb-x{border:none;background:none;color:#e0b0a0;font-size:15px;cursor:pointer;font-family:inherit;padding:0}
.tb-x:disabled{opacity:.25;cursor:default}
.tb-add{width:100%;border:none;border-radius:10px;padding:9px;margin-top:4px;background:#f7f3ee;color:#a89e97;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer}
.tpl-addex{width:100%;border:none;border-radius:15px;padding:14px;margin-bottom:16px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.tpl-empty{font-size:11.5px;color:#a89e97;text-align:center;padding:22px 12px;line-height:1.6}
.tpl-btns{display:flex;gap:8px}
.tpl-save{flex:1;border:none;border-radius:14px;padding:13px;background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.tpl-cancel{border:none;border-radius:14px;padding:13px 16px;background:#f5f0eb;color:#a89e97;font-size:13px;font-family:inherit;cursor:pointer}
.tpl-del{border:none;border-radius:14px;padding:13px 12px;background:rgba(243,185,168,.2);color:#e08a72;font-size:12px;font-family:inherit;cursor:pointer}
.fit-pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid #ece5da;border-radius:12px;padding:12px 13px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:700;color:#4a4340;cursor:pointer;text-align:right}
.fit-pick-c{color:#d8cfc7;font-size:15px}
.ex-ov{position:fixed;inset:0;z-index:440;background:rgba(74,67,64,.62);display:flex;align-items:flex-end;justify-content:center}
.ex-sheet{width:100%;max-width:480px;background:#fbf7f2;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.ex-hd{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;color:#4a4340;margin-bottom:10px}
.ex-x{background:none;border:none;font-size:22px;line-height:1;color:#c0b6ae;cursor:pointer;font-family:inherit;padding:0 4px}
.ex-q{width:100%;border:1.5px solid #ece5da;border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;color:#4a4340;background:#fff;outline:none;text-align:right}
.ex-tabs{display:flex;gap:6px;margin:12px 0 10px}
.ex-tab{flex:1;border:none;border-radius:11px;padding:9px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;background:#f0ebe3;color:#a89e97}
.ex-tab.on{background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff}
/* a group is a card with a picture, in sections */
/* one exercise: where you stand, and how it is done */
.xd-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.xd-name{font-size:16px;font-weight:800;color:#4a4340}
.xd-back{border:none;background:none;font-size:11.5px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;padding:2px 0}
.xd-meta{font-size:10.5px;color:#a89e97;margin-bottom:14px}
.xd-en{color:#c8bfb6;direction:ltr}
.xd-now{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.xd-cell{background:#fff;border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.xd-k{font-size:9.5px;font-weight:800;color:#a89e97;letter-spacing:.05em}
.xd-v{font-size:21px;font-weight:800;color:#4a4340;direction:ltr;text-align:right}
.xd-s{font-size:9.5px;color:#c0b6ae}
.xd-say{font-size:11.5px;line-height:1.6;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-weight:700}
.xd-say.best{background:rgba(143,199,158,.18);color:#3f7a52}
.xd-say.up{background:rgba(143,199,158,.14);color:#4a7a58}
.xd-say.down{background:rgba(232,193,98,.16);color:#8a6a1e}
.xd-bars{display:flex;align-items:flex-end;gap:4px;height:56px;padding:0 2px;direction:ltr}
.xd-bar{flex:1;background:#e6ddf2;border-radius:3px 3px 0 0;min-height:6px}
.xd-bar.now{background:linear-gradient(180deg,#c9bce0,#a690cf)}
.xd-bars-l{font-size:9px;color:#c0b6ae;margin:5px 2px 12px;text-align:center}
.xd-since{font-size:11px;color:#a89e97;line-height:1.6;margin-bottom:4px}
.xd-h{font-size:10px;font-weight:800;color:#a89e97;letter-spacing:.08em;margin:16px 2px 8px}
.xd-h.warn{color:#c08a3a}
.xd-log{display:flex;flex-direction:column;gap:5px}
.xd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:#fff;border-radius:11px;padding:8px 11px}
.xd-when{font-size:10px;color:#a89e97;flex-shrink:0}
.xd-sets{font-size:11.5px;font-weight:700;color:#4a4340;direction:ltr;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xd-steps,.xd-miss{margin:0;padding-right:18px;display:flex;flex-direction:column;gap:6px}
.xd-steps li,.xd-miss li{font-size:12.5px;line-height:1.65;color:#4a4340}
.xd-miss li{color:#8a6a3a}
.xd-none{font-size:11.5px;color:#a89e97;line-height:1.7;background:#faf6f1;border-radius:12px;padding:12px}
.xd-none.small{font-size:11px;margin-top:14px}
.xd-pick{width:100%;margin-top:18px;border:none;border-radius:14px;padding:14px;background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.gp-h{font-size:10px;font-weight:800;color:#a89e97;letter-spacing:.08em;margin:14px 2px 8px}
.gp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp{display:flex;align-items:center;gap:10px;border:1.5px solid transparent;border-radius:15px;padding:8px 10px;background:#fff;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 2px 8px rgba(200,180,160,.1);min-width:0}
.gp.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7)}
.gp-t{flex:1;min-width:0;font-size:12px;font-weight:800;color:#4a4340;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.gp-n{font-size:9.5px;font-weight:800;color:#c0b6ae;flex-shrink:0}
.gp.on .gp-n{color:#a690cf}
/* the body, with the muscle laid over it */
/* a muscle card carries no picture, so its name gets the room */
.gp.bare{padding:12px 13px}
.gp.bare .gp-t{font-size:13px}
.eq-art{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#faf6f1;display:flex;align-items:center;justify-content:center}
.eq-art svg{width:22px;height:22px;fill:none;stroke:#7a716b;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eq-art b{font-size:15px;font-weight:800;color:#a89e97}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ex-chip{border:none;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer;background:#f5f0eb;color:#6a6360;display:flex;align-items:center;gap:5px}
.ex-chip b{font-size:9.5px;color:#c0b6ae;font-weight:800}
.ex-chip.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.ex-chip.on b{color:rgba(255,255,255,.8)}
.ex-list{display:flex;flex-direction:column;gap:6px}
.ex-row{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;border-radius:13px;padding:10px 12px;background:#fff;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.ex-n{font-size:13.5px;font-weight:800;color:#4a4340}
.ex-meta{font-size:10px;color:#a89e97}
.ex-en{font-size:9.5px;color:#c8bfb6;direction:ltr}
.ex-none{font-size:12px;color:#a89e97;padding:18px 4px;text-align:center;line-height:1.6}
.ex-own{display:flex;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid #f0ebe3}
.ex-add{border:none;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
/* the goal, and what it means */
.fg{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.fg-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.fg-k{font-size:10px;font-weight:800;color:#a89e97;letter-spacing:.08em}
.fg-r{font-size:10.5px;font-weight:800;color:#a690cf}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fg-b{border:1.5px solid #f0ebe3;border-radius:12px;padding:9px 6px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;background:#fff;color:#a89e97}
.fg-b.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
.fg-n{font-size:10.5px;color:#a89e97;line-height:1.6;margin-top:9px}
/* the button that opens the mid-session panel */
.fw-case{width:100%;border:1.5px dashed #e0d8ce;border-radius:13px;padding:11px;margin-bottom:10px;background:none;color:#a89e97;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
/* what to do when something happens */
.fc-ov{position:fixed;inset:0;z-index:450;background:rgba(74,67,64,.62);display:flex;align-items:flex-end;justify-content:center}
.fc-sheet{width:100%;max-width:480px;background:#fbf7f2;border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.fc-hd{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;color:#4a4340;margin-bottom:12px}
.fc-x{background:none;border:none;font-size:22px;line-height:1;color:#c0b6ae;cursor:pointer;font-family:inherit;padding:0 4px}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc-b{display:flex;align-items:center;gap:9px;border:none;border-radius:14px;padding:13px 11px;background:#fff;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.fc-ic{font-size:17px;flex-shrink:0}
.fc-t{font-size:12px;font-weight:800;color:#4a4340;line-height:1.3}
.fc-back{border:none;background:none;font-size:11.5px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;padding:0 0 8px}
.fc-h{font-size:16px;font-weight:800;color:#4a4340;margin-bottom:6px}
.fc-lead{font-size:12.5px;line-height:1.7;color:#6a6360;background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:12px}
.fc-list{margin:0;padding-right:18px;display:flex;flex-direction:column;gap:8px}
.fc-list li{font-size:12.5px;line-height:1.7;color:#4a4340}
.fc-sub{font-size:10px;font-weight:800;color:#a89e97;letter-spacing:.06em;margin:4px 2px 8px}
.fc-alt{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;border-radius:13px;padding:11px 12px;margin-bottom:7px;background:#fff;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.fc-alt-n{font-size:13px;font-weight:800;color:#4a4340}
.fc-alt-w{font-size:10px;color:#a89e97}
.fc-note{font-size:10px;color:#c0b6ae;line-height:1.6;margin-top:8px}
.fc-none{font-size:12px;color:#a89e97;padding:14px 2px}
/* what to do next time */
.nx{background:#fff;border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.nx-h{font-size:13px;font-weight:800;color:#4a4340;margin-bottom:2px}
.nx-goal{font-size:10px;color:#a89e97;margin-bottom:12px}
.nx-row{border-right:3px solid #e0dbd5;padding:0 11px 0 0;margin-bottom:12px}
.nx-row.up{border-right-color:#8fc79e}
.nx-row.down{border-right-color:#e8c162}
.nx-row.hold{border-right-color:#c9bce0}
.nx-n{font-size:12px;font-weight:800;color:#4a4340}
.nx-t{font-size:13.5px;font-weight:800;color:#4a4340;margin:2px 0 3px}
.nx-row.up .nx-t{color:#3f7a52}
.nx-row.down .nx-t{color:#8a6a1e}
.nx-w{font-size:10.5px;color:#a89e97;line-height:1.6}
.fw-prev{background:#faf6f1;border-radius:12px;padding:9px 11px;margin-bottom:12px}
.fw-prev.none{font-size:10.5px;color:#a89e97;line-height:1.6}
.fw-prev-t{font-size:9px;font-weight:800;color:#a89e97;letter-spacing:.06em;margin-bottom:6px}
.fw-prev-s{display:flex;flex-wrap:wrap;gap:5px}
.fw-ps{font-size:11.5px;font-weight:800;color:#7a716b;background:#fff;border-radius:8px;padding:3px 8px;direction:ltr}
.fw-ps.same{color:#4a4340}
.fw-ps.beat{background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff}
/* how long to rest */
.fw-restset{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fw-restset>span{font-size:10px;font-weight:800;color:#a89e97}
.fw-rb{border:none;border-radius:9px;padding:5px 10px;font-size:10.5px;font-weight:800;font-family:inherit;cursor:pointer;background:#f5f0eb;color:#a89e97}
.fw-rb.on{background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff}
/* the countdown, over everything, skippable */
.fw-rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:200;display:flex;align-items:center;gap:12px;background:rgba(74,67,64,.94);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 8px 26px rgba(74,67,64,.34)}
.fw-rest-n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;min-width:52px;text-align:center}
.fw-rest-x{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:6px 11px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer}

/* ── ONE WAY IN ──
   Five ways of adding food had grown five cards, all of them saying "add"
   and none of them saying which held what. One card now, the ways in a row
   across it, one body underneath. */
.aw-card{background:rgba(255,255,255,.72);border-radius:20px;padding:10px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
/* the open panel says which way you took, and how to put it away */
.aw-hd{display:flex;align-items:center;gap:8px;padding:2px 4px 9px}
.aw-hic{font-size:15px;line-height:1}
.aw-ht{flex:1;font-size:13px;font-weight:800;color:#4a4340}
.aw-x{border:none;background:none;font-size:20px;line-height:1;color:#c0b6ae;cursor:pointer;font-family:inherit;padding:0 4px}
.aw-body{margin-top:0;padding-top:10px;border-top:1px solid #f0ebe3}
/* the button, and the six that fan out of it */
.fab-wrap{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));width:0;height:0;z-index:150}
.fab-b{position:absolute;left:-29px;top:-29px;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#c9bce0,#a690cf);box-shadow:0 6px 20px rgba(120,96,168,.42);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .24s cubic-bezier(.2,.9,.3,1)}
.fab-b svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.fab-wrap.open .fab-b{transform:rotate(135deg)}
.fab-b:active{transform:scale(.92)}
.fab-wrap.open .fab-b:active{transform:rotate(135deg) scale(.92)}
/* each one travels out to its own place on the arc, a beat after the one
   before it, so the six read as a fan opening rather than six things
   appearing at once */
/* Name inside the disc, under the icon. Hung underneath as a caption it
   landed on the neighbouring disc; set beside the icon as a pill it needed
   more width than the screen has. */
.fab-i{position:absolute;left:-27px;top:-27px;width:54px;height:54px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 14px rgba(150,128,104,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font-family:inherit;opacity:0;pointer-events:none;transform:translate(0,0) scale(.3);transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .16s}
.fab-wrap.open .fab-i{opacity:1;pointer-events:auto;transform:translate(var(--x),var(--y)) scale(1);transition-delay:var(--d)}
.fab-ic{font-size:17px;line-height:1}
.fab-t{font-size:8.5px;font-weight:800;color:#6b5a92;line-height:1;white-space:nowrap}
.fab-scrim{position:fixed;inset:0;z-index:149;background:rgba(74,67,64,.3);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s}
body.night .fab-i{background:#2a2438}
body.night .fab-t{color:#d8cbf0;background:rgba(42,36,56,.92)}
