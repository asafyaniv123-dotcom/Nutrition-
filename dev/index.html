function renderGoals(){
  document.getElementById('hdr-title').textContent='מטרות';
  if(_goalsView==='view-goal')return renderViewGoal();
  if(_goalsView==='edit-goal')return renderEditGoal();
  if(_goalsView==='add-sub')return renderAddSub();
  renderGoalsHome();
}

function renderGoalsHome(){
  var goals=loadGoals();
  var h='<div style="padding-bottom:30px">';
  h+='<div style="font-size:12px;color:#a89e97;line-height:1.6;margin-bottom:20px">חלומות הם לא משאלות — הם מטרות שעוד לא הוגדרו בבירור.</div>';

  if(goals.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F3AF;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">איזה חלום אתה רוצה להגשים?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">התחל מהחלום הגדול —ופרוק אותו לצעדים קטנים.</div>';
    h+='<button onclick="_goalsView=\'edit-goal\';_goalIdx=-1;renderGoals()" style="background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ הגדר מטרה</button>';
    h+='</div>';
  } else {
    // Group by horizon
    for(var hi=0;hi<GOAL_HORIZONS.length;hi++){
      var hor=GOAL_HORIZONS[hi];
      var horGoals=goals.filter(function(g){return g.horizon===hor.id;});
      if(horGoals.length===0)continue;
      h+='<div style="font-size:10px;font-weight:800;color:'+hor.color+';letter-spacing:.1em;margin-bottom:8px;margin-top:16px">'+hor.emoji+' '+hor.label.toUpperCase()+'</div>';
      for(var gi=0;gi<horGoals.length;gi++){
        var g=horGoals[gi];var gidx=goals.indexOf(g);
        var subs=g.subs||[];
        var doneSubs=subs.filter(function(s){return s.done;}).length;
        var pct=subs.length?Math.round(doneSubs/subs.length*100):0;

        h+='<div onclick="_goalIdx='+gidx+';_goalsView=\'view-goal\';renderGoals()" style="background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(200,180,160,.1);border-right:4px solid '+hor.color+'">';
        h+='<div style="font-size:15px;font-weight:800;color:#4a4340;margin-bottom:3px">'+esc(g.title)+'</div>';
        if(g.why)h+='<div style="font-size:11px;color:#a89e97;margin-bottom:8px;line-height:1.4;font-style:italic">'+esc(g.why)+'</div>';
        if(subs.length>0){
          h+='<div style="display:flex;align-items:center;gap:8px">';
          h+='<div style="flex:1;height:5px;background:#f0ebe3;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+hor.color+';border-radius:3px;transition:width .5s"></div></div>';
          h+='<div style="font-size:10px;color:'+hor.color+';font-weight:700">'+doneSubs+'/'+subs.length+'</div>';
          h+='</div>';
        }
        // Next action
        var nextSub=subs.find(function(s){return !s.done;});
        if(nextSub)h+='<div style="margin-top:8px;font-size:11px;color:#6a6360;background:#f5f0eb;border-radius:8px;padding:5px 10px">צעד הבא: '+esc(nextSub.text)+'</div>';
        h+='</div>';
      }
    }
    h+='<button onclick="_goalsView=\'edit-goal\';_goalIdx=-1;renderGoals()" style="width:100%;background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:16px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px">+ הגדר מטרה</button>';
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderViewGoal(){
  var goals=loadGoals();var g=goals[_goalIdx];
  if(!g){_goalsView='home';renderGoals();return;}
  var hor=GOAL_HORIZONS.find(function(h){return h.id===g.horizon;})||GOAL_HORIZONS[0];
  var subs=g.subs||[];
  document.getElementById('hdr-title').textContent=esc(g.title);

  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_goalsView=\'home\';renderGoals()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; מטרות</button>';

  // Header
  h+='<div style="background:'+hor.bg+';border-radius:20px;padding:18px;margin-bottom:14px;border-right:4px solid '+hor.color+'">';
  h+='<div style="font-size:10px;font-weight:700;color:'+hor.color+';margin-bottom:6px">'+hor.emoji+' '+hor.label+'</div>';
  h+='<div style="font-size:19px;font-weight:800;color:#4a4340;margin-bottom:6px">'+esc(g.title)+'</div>';
  if(g.why)h+='<div style="font-size:12px;color:#6a6360;font-style:italic;line-height:1.5">למה זה חשוב לי: '+esc(g.why)+'</div>';
  h+='</div>';

  // Add sub-goals by level
  var levels=[
    {id:'monthly',label:'חודשית',color:'#a690cf'},
    {id:'weekly',label:'שבועית',color:'#8fc79e'},
    {id:'daily',label:'יומית',color:'#e08a72'}
  ];

  for(var li=0;li<levels.length;li++){
    var lv=levels[li];
    var lvSubs=subs.filter(function(s){return s.level===lv.id;});
    h+='<div style="background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(200,180,160,.08)">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
    h+='<div style="font-size:11px;font-weight:700;color:'+lv.color+'">'+lv.label+'</div>';
    h+='<button onclick="_subLevel=\''+lv.id+'\';_goalsView=\'add-sub\';renderGoals()" style="background:'+lv.color+'22;border:none;border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;color:'+lv.color+'">+ הוסף</button>';
    h+='</div>';
    if(lvSubs.length===0){
      h+='<div style="font-size:11px;color:#c0b8b0;padding:4px 0">עדיין לא הוגדרו צעדים '+lv.label.toLowerCase()+'</div>';
    }
    for(var si=0;si<lvSubs.length;si++){
      var sub=lvSubs[si];var sidx=subs.indexOf(sub);
      h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f0eb">';
      h+='<div onclick="toggleGoalSub('+sidx+')" style="width:20px;height:20px;border-radius:6px;border:2px solid '+(sub.done?lv.color:'#c9bce0')+';background:'+(sub.done?lv.color:'transparent')+';cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">';
      if(sub.done)h+='<span style="color:#fff;font-size:11px;font-weight:700">&#10003;</span>';
      h+='</div>';
      h+='<div style="flex:1;font-size:13px;color:'+(sub.done?'#a89e97':'#4a4340')+';'+(sub.done?'text-decoration:line-through;':'')+';line-height:1.4">'+esc(sub.text)+'</div>';
      h+='<button onclick="deleteGoalSub('+sidx+')" style="background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:14px;padding:0 4px">&times;</button>';
      h+='</div>';
    }
    h+='</div>';
  }

  // What's blocking me
  h+='<div style="background:linear-gradient(135deg,#fff9f0,#fff5e8);border-radius:16px;padding:14px;margin-bottom:14px;border-right:3px solid #e8c162">';
  h+='<div style="font-size:11px;font-weight:700;color:#b45309;margin-bottom:6px">מה מונע ממני להתקדם?</div>';
  h+='<textarea id="goal-block-inp" class="q-input" rows="2" style="min-height:50px;margin-bottom:8px" placeholder="היי כנה...">'+esc(g.blocking||'')+'</textarea>';
  h+='<button onclick="saveGoalBlocking()" style="background:#f5f0eb;border:none;border-radius:10px;padding:7px 14px;font-size:11px;font-weight:700;cursor:pointer;color:#6a6360">שמור</button>';
  h+='</div>';

  h+='<div style="display:flex;gap:8px">';
  h+='<button onclick="_goalsView=\'edit-goal\';renderGoals()" style="flex:1;background:#f0eafa;border:none;border-radius:14px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;color:#a690cf">ערוך מטרה</button>';
  h+='<button onclick="deleteGoal()" style="background:rgba(243,185,168,.2);border:none;border-radius:14px;padding:11px 14px;font-size:12px;cursor:pointer;color:#e08a72">מחק</button>';
  h+='</div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderAddSub(){
  var goals=loadGoals();var g=goals[_goalIdx];
  if(!g){_goalsView='view-goal';renderGoals();return;}
  var lv=['monthly','weekly','daily'];var lvLabels=['חודשית','שבועית','יומית'];
  var lvColors=['#a690cf','#8fc79e','#e08a72'];
  var li=lv.indexOf(_subLevel);var color=lvColors[li]||'#a690cf';
  document.getElementById('hdr-title').textContent='מטרה '+lvLabels[li];
  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_goalsView=\'view-goal\';renderGoals()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; '+esc(g.title)+'</button>';
  h+='<div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(200,180,160,.08)">';
  h+='<div style="font-size:11px;font-weight:700;color:'+color+';margin-bottom:12px">'+lvLabels[li]+'</div>';
  h+='<textarea id="sub-text" class="q-input" rows="3" placeholder="מה אני רוצה לעשות '+lvLabels[li].toLowerCase()+'?" style="min-height:80px;margin-bottom:12px"></textarea>';
  h+='<button onclick="saveGoalSub()" style="width:100%;background:'+color+';border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;color:#fff">הוסף</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
  setTimeout(function(){var t=document.getElementById('sub-text');if(t)t.focus();},100);
}

function renderEditGoal(){
  var goals=loadGoals();
  var g=_goalIdx>=0?goals[_goalIdx]:{title:'',why:'',horizon:'dream',subs:[],blocking:''};
  document.getElementById('hdr-title').textContent=_goalIdx>=0?'עריכת מטרה':'מטרה חדשה';
  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_goalsView=\''+(_goalIdx>=0?'view-goal':'home')+'\';renderGoals()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; חזרה</button>';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:5px">מה המטרה?</div>';
  h+='<input id="goal-title" class="mtin" value="'+esc(g.title)+'" placeholder="למשל: לבנות עסק משלי">';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:5px">למה זה חשוב לי? (הסיבה האמיתית)</div>';
  h+='<textarea id="goal-why" class="q-input" rows="2" placeholder="עמוק לרגע, לא התשובה השטחיתית..." style="min-height:60px;margin-bottom:14px">'+esc(g.why||'')+'</textarea>';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px">אופק זמן</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">';
  for(var hi=0;hi<GOAL_HORIZONS.length;hi++){
    var hor=GOAL_HORIZONS[hi];var isSel=(g.horizon||'dream')===hor.id;
    h+='<button onclick="setGoalHorizon(\''+hor.id+'\')" id="ghor-'+hor.id+'" style="border:2px solid '+(isSel?hor.color:'#f0ebe3')+';border-radius:14px;padding:12px 16px;cursor:pointer;background:'+(isSel?hor.bg:'#fff')+';text-align:right;display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:20px">'+hor.emoji+'</span>';
    h+='<div><div style="font-size:13px;font-weight:700;color:#4a4340">'+hor.label+'</div><div style="font-size:10px;color:#a89e97">'+hor.desc+'</div></div>';
    if(isSel)h+='<span style="margin-right:auto;color:'+hor.color+';font-size:16px">&#10003;</span>';
    h+='</button>';
  }
  h+='<input id="goal-horizon" type="hidden" value="'+(g.horizon||'dream')+'">';
  h+='</div>';

  h+='<button onclick="saveGoalEdit()" style="width:100%;background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">שמור</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function setGoalHorizon(id){
  var inp=document.getElementById('goal-horizon');if(inp)inp.value=id;
  GOAL_HORIZONS.forEach(function(hor){
    var btn=document.getElementById('ghor-'+hor.id);if(!btn)return;
    var isSel=hor.id===id;
    btn.style.borderColor=isSel?hor.color:'#f0ebe3';
    btn.style.background=isSel?hor.bg:'#fff';
  });
}

function saveGoalEdit(){
  var title=document.getElementById('goal-title');
  if(!title||!title.value.trim()){showToast('נא הזן מטרה');return;}
  var goals=loadGoals();
  var existing=_goalIdx>=0?goals[_goalIdx]:{subs:[],blocking:''};
  var updated=Object.assign({},existing,{
    title:title.value.trim(),
    why:(document.getElementById('goal-why')||{}).value||'',
    horizon:(document.getElementById('goal-horizon')||{}).value||'dream'
  });
  if(_goalIdx>=0)goals[_goalIdx]=updated;
  else{goals.push(updated);_goalIdx=goals.length-1;}
  saveGoals(goals);showToast('נשמר &#10003;');
  _goalsView='view-goal';renderGoals();
}

function saveGoalSub(){
  var inp=document.getElementById('sub-text');
  if(!inp||!inp.value.trim()){showToast('כתוב משהו...');return;}
  var goals=loadGoals();
  if(!goals[_goalIdx].subs)goals[_goalIdx].subs=[];
  goals[_goalIdx].subs.push({text:inp.value.trim(),level:_subLevel,done:false,id:Date.now()+''});
  saveGoals(goals);showToast('נוסף &#10003;');
  _goalsView='view-goal';renderGoals();
}

function toggleGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs&&goals[_goalIdx].subs[sidx])
    goals[_goalIdx].subs[sidx].done=!goals[_goalIdx].subs[sidx].done;
  saveGoals(goals);renderGoals();
}

function deleteGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs)goals[_goalIdx].subs.splice(sidx,1);
  saveGoals(goals);renderGoals();
}

function saveGoalBlocking(){
  var inp=document.getElementById('goal-block-inp');
  var goals=loadGoals();
  if(goals[_goalIdx])goals[_goalIdx].blocking=(inp||{}).value||'';
  saveGoals(goals);showToast('נשמר &#10003;');
}

function deleteGoal(){
  var goals=loadGoals();goals.splice(_goalIdx,1);saveGoals(goals);
  _goalIdx=-1;_goalsView='home';renderGoals();
}

/* ── PEOPLE MODULE ── */
var _peopleView='home'; // home|person|edit-person|add-memory|edit-memory
var _personIdx=-1;
var _memoryIdx=-1;

var RELATIONSHIP_TYPES=[
  'חבר קרוב','חברה','בן משפחה','בת משפחה','בן זוג','בת זוג',
  'אח','אחות','אבא','אמא','סבא','סבתא','קולגה','אחר'
];
var MEMORY_TYPES=[
  {id:'note',label:'הערה'},
  {id:'memory',label:'זיכרון'},
  {id:'insight',label:'תובנה'},
  {id:'conversation',label:'שיחה'},
  {id:'important',label:'חשוב'}
];
var CONTACT_TYPES=['הודעה','שיחה','פגישה','וידאו','אחר'];

function loadPeople(){try{var x=localStorage.getItem('people_v2');return x?JSON.parse(x):[];}catch(e){return[];}}
function savePeople(arr){try{localStorage.setItem('people_v2',JSON.stringify(arr));}catch(e){}}

function daysSince(ts){if(!ts)return null;return Math.floor((Date.now()-ts)/(1000*60*60*24));}

function renderPeople(){
  document.getElementById('hdr-title').textContent='האנשים שלי';
  if(_peopleView==='person')return renderPersonPage();
  if(_peopleView==='edit-person')return renderEditPerson();
  if(_peopleView==='add-memory')return renderAddMemory();
  renderPeopleHome();
}

function renderPeopleHome(){
  var people=loadPeople();
  var h='<div style="padding-bottom:30px">';

  // Subtitle
  h+='<div style="font-size:12px;color:#a89e97;margin-bottom:18px;line-height:1.6">האנשים שאני רוצה להיות נוכח בחיים שלהם.</div>';

  if(people.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F9E1;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">מי האנשים שלך?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">התחל להוסיף את האנשים שאתה רוצה לזכור<br>ולהיות נוכח בחיים שלהם.</div>';
    h+='<button onclick="_peopleView=\'edit-person\';_personIdx=-1;renderPeople()" style="background:linear-gradient(135deg,#f3b9a8,#e08a72);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ הוסף אדם</button>';
    h+='</div>';
  } else {
    // Gentle reminders strip
    var toCheck=people.filter(function(p){
      if(!p.contactFreq||p.contactFreq==='none')return false;
      var days=daysSince(p.lastContact);if(days===null)return true;
      var thresholds={daily:1,weekly:7,biweekly:14,monthly:30,occasionally:60};
      return days>=(thresholds[p.contactFreq]||30);
    });
    if(toCheck.length>0){
      h+='<div style="background:linear-gradient(135deg,#fff9f0,#fff5e8);border-radius:18px;padding:14px;margin-bottom:16px;border:1px solid #f3b9a855">';
      h+='<div style="font-size:11px;font-weight:700;color:#e08a72;margin-bottom:10px">אולי הגיע הזמן לבדוק מה שלום...</div>';
      for(var ri=0;ri<Math.min(toCheck.length,3);ri++){
        var rp=toCheck[ri];var rdays=daysSince(rp.lastContact);
        h+='<div onclick="_personIdx=people.indexOf(rp);_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #f5f0eb">';
        h+=personAvatar(rp,32);
        h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#4a4340">'+esc(rp.name)+'</div>';
        h+='<div style="font-size:10px;color:#a89e97">'+(rdays===null?'עדיין לא דיברתם':'עברו '+rdays+' ימים')+'</div></div>';
        h+='</div>';
      }
      h+='</div>';
    }

    // Upcoming dates
    var now=new Date();var upcoming=[];
    for(var pi2=0;pi2<people.length;pi2++){
      var p2=people[pi2];
      var dates2=p2.importantDates||[];
      for(var di=0;di<dates2.length;di++){
        var d2=dates2[di];var dt=new Date(d2.date);
        // For yearly, find next occurrence
        var next=new Date(now.getFullYear(),dt.getMonth(),dt.getDate());
        if(next<now)next=new Date(now.getFullYear()+1,dt.getMonth(),dt.getDate());
        var inDays=Math.ceil((next-now)/(1000*60*60*24));
        if(inDays<=14)upcoming.push({person:p2,pidx:pi2,date:d2,inDays:inDays});
      }
    }
    upcoming.sort(function(a,b){return a.inDays-b.inDays;});
    if(upcoming.length>0){
      h+='<div style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border-radius:18px;padding:14px;margin-bottom:16px">';
      h+='<div style="font-size:11px;font-weight:700;color:#4f6ef7;margin-bottom:10px">&#x1F4C5; תאריכים קרובים</div>';
      for(var ui=0;ui<upcoming.length;ui++){
        var u=upcoming[ui];
        h+='<div onclick="_personIdx='+u.pidx+';_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(79,110,247,.1)">';
        h+='<div style="font-size:18px;width:28px;text-align:center">'+upcomingEmoji(u.date.type)+'</div>';
        h+='<div style="flex:1"><div style="font-size:12px;font-weight:700;color:#4a4340">'+esc(u.person.name)+' — '+esc(u.date.title)+'</div>';
        h+='<div style="font-size:10px;color:#4f6ef7">'+(u.inDays===0?'היום!':'בעוד '+u.inDays+' ימים')+'</div></div></div>';
      }
      h+='</div>';
    }

    // People list
    for(var pi=0;pi<people.length;pi++){
      var p=people[pi];
      var days=daysSince(p.lastContact);
      var mems=p.memories||[];
      var lastMem=mems.length?mems[mems.length-1]:null;
      h+='<div onclick="_personIdx='+pi+';_peopleView=\'person\';renderPeople()" style="background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(200,180,160,.1);display:flex;gap:14px;align-items:flex-start">';
      h+=personAvatar(p,48);
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';

function setMemType(typeId){
  window._newMemType=typeId;
  MEMORY_TYPES.forEach(function(mt){
    var btn=document.getElementById('mtype-'+mt.id);
    if(btn){btn.style.background=mt.id===typeId?'linear-gradient(135deg,#f3b9a8,#e08a72)':'#f5f0eb';btn.style.color=mt.id===typeId?'#fff':'#6a6360';}
  });

function saveMemory(){
  var inp=document.getElementById('mem-text');
  if(!inp||!inp.value.trim()){showToast('כתוב משהו...');return;}
  var people=loadPeople();
  if(!people[_personIdx].memories)people[_personIdx].memories=[];
  people[_personIdx].memories.push({id:Date.now()+'',content:inp.value.trim(),type:window._newMemType||'note',date:Date.now(),pinned:false});
  savePeople(people);
  showToast('נשמר &#10003;');
  _peopleView='person';renderPeople();
}

function deleteMemory(memId){
  var people=loadPeople();
  people[_personIdx].memories=(people[_personIdx].memories||[]).filter(function(m){return m.id!==memId;});
  savePeople(people);renderPeople();
}

function togglePinMemory(memId){
  var people=loadPeople();
  var mems=people[_personIdx].memories||[];
  for(var i=0;i<mems.length;i++){if(mems[i].id===memId)mems[i].pinned=!mems[i].pinned;}
  savePeople(people);renderPeople();
}

function selectFreq(val){
  var inp=document.getElementById('ep-freq');
  if(inp)inp.value=val;
  var freqs=['none','occasionally','monthly','biweekly','weekly','daily'];
  for(var i=0;i<freqs.length;i++){
    var btn=document.getElementById('freq-btn-'+freqs[i]);
    if(!btn)continue;
    if(freqs[i]===val){btn.style.background='linear-gradient(135deg,#c9bce0,#a690cf)';btn.style.color='#fff';}
    else{btn.style.background='#f5f0eb';btn.style.color='#6a6360';}
  }
}

function addDateToPerson(){
  var title=document.getElementById('ep-date-title');
  var val=document.getElementById('ep-date-val');
  var dtype=document.getElementById('ep-dtype');
  var yearly=document.getElementById('ep-yearly');
  if(!title||!title.value.trim()||!val||!val.value){showToast('מלא שם ותאריך');return;}
  var people=loadPeople();
  var p=_personIdx>=0?people[_personIdx]:null;
  if(!p){// temp — will save with person
    window._pendingDates=window._pendingDates||[];
    window._pendingDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
    showToast('תאריך נוסף');title.value='';val.value='';return;
  }
  if(!p.importantDates)p.importantDates=[];
  p.importantDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
  savePeople(people);showToast('תאריך נוסף &#10003;');title.value='';val.value='';
}

function savePersonEdit(){
  var name=document.getElementById('ep-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם');return;}
  var people=loadPeople();
  var existing=_personIdx>=0?people[_personIdx]:{memories:[],importantDates:[]};
  var updated=Object.assign({},existing,{
    name:name.value.trim(),
    relationship:(document.getElementById('ep-rel')||{}).value||'',
    whatTheyMean:(document.getElementById('ep-mean')||{}).value||'',
    whatILove:(document.getElementById('ep-love')||{}).value||'',
    currentUpdate:(document.getElementById('ep-update')||{}).value||'',
    toAsk:(document.getElementById('ep-ask')||{}).value||'',
    contactFreq:(document.getElementById('ep-freq')||{}).value||'monthly'
  });
  // Merge pending dates
  if(window._pendingDates&&window._pendingDates.length){
    updated.importantDates=(updated.importantDates||[]).concat(window._pendingDates);
    window._pendingDates=[];
  }
  if(_personIdx>=0)people[_personIdx]=updated;
  else{people.push(updated);_personIdx=people.length-1;}
  savePeople(people);
  showToast('נשמר &#10003;');
  _peopleView='person';renderPeople();
}

function deletePerson(){
  var people=loadPeople();people.splice(_personIdx,1);savePeople(people);

var _insView='home';
var _insCat=null;
var _insQ=null;

function loadInsights(){try{var x=localStorage.getItem('insights_data');return x?JSON.parse(x):{};}catch(e){return{};}}
function saveInsights(obj){try{localStorage.setItem('insights_data',JSON.stringify(obj));}catch(e){}}
function insKey(catId,qIdx){return catId+'__'+qIdx;}

function renderInsights(){
  document.getElementById('hdr-title').textContent='תובנות';
  if(_insView==='cat')return renderInsCat();
  if(_insView==='q')return renderInsQ();
  if(_insView==='entry')return renderInsEntry();
  renderInsHome();
}

function renderInsHome(){
  var data=loadInsights();
  var h='<div style="padding-bottom:30px">';
  h+='<div style="font-size:12px;color:#a89e97;line-height:1.6;margin-bottom:20px">כשיש לך תובנה על החיים — תרשום אותה כאן.</div>';

    for(var qi=0;qi<cat.questions.length;qi++)totalEntries+=(data[insKey(cat.id,qi)]||[]).length;

    // Pick a representative emoji per category
    var catEmojis={self:'&#x1F9D8;',emotions:'&#x1F9E1;',people:'&#x1FAF6;',life:'&#x2728;',success:'&#x1F4AA;',world:'&#x1F30D;',notebook:'&#x1F4D3;'};
    var emoji=catEmojis[cat.id]||'&#x1F4CC;';

    h+='<button onclick="_insCat=\''+cat.id+'\';_insView=\'cat\';renderInsights()" style="background:'+cat.bg+';border:none;border-radius:20px;padding:20px 14px;cursor:pointer;text-align:right;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.06);min-height:110px;display:flex;flex-direction:column;justify-content:space-between">';
    h+='<div style="font-size:32px;margin-bottom:8px">'+emoji+'</div>';
    h+='<div>';
    h+='<div style="font-size:13px;font-weight:800;color:#4a4340;margin-bottom:3px">'+cat.title+'</div>';
    h+='<div style="font-size:10px;color:#a89e97">'+cat.questions.length+' שאלות'+(totalEntries?' &middot; '+totalEntries+' רשומות':'')+'</div>';
    h+='</div>';
    // Color accent line at bottom
    h+='<div style="position:absolute;bottom:0;right:0;left:0;height:4px;background:'+cat.color+';border-radius:0 0 20px 20px;opacity:.6"></div>';
    h+='</button>';
  }
  h+='</div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderInsCat(){
  var cat=INSIGHTS_CATS.find(function(c){return c.id===_insCat;});
  if(!cat){_insView='home';renderInsights();return;}
  var data=loadInsights();
  document.getElementById('hdr-title').textContent=cat.title;
  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_insView=\'home\';renderInsights()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; חזרה</button>';
  for(var qi=0;qi<cat.questions.length;qi++){
    var q=cat.questions[qi];
    var entries=data[insKey(cat.id,qi)]||[];
    var last=entries.length?entries[entries.length-1]:null;
    h+='<div onclick="_insQ='+qi+';_insView=\'q\';renderInsights()" style="background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.08);border-right:3px solid '+(entries.length?cat.color:'#f0ebe3')+';">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">';
    h+='<div style="font-size:13px;font-weight:700;color:#4a4340">'+esc(q)+'</div>';
    h+='<div style="font-size:10px;color:'+cat.color+';font-weight:700;white-space:nowrap">'+(entries.length?entries.length+' &#x270F;':'')+'</div></div>';
    if(last)h+='<div style="font-size:11px;color:#6a6360;margin-top:6px;line-height:1.5;border-top:1px solid #f5f0eb;padding-top:6px">'+esc(last.text.substring(0,80))+(last.text.length>80?'...':'')+'</div>';
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;

function renderInsQ(){
  var cat=INSIGHTS_CATS.find(function(c){return c.id===_insCat;});
  if(!cat){_insView='cat';renderInsights();return;}
  var q=cat.questions[_insQ];
  var data=loadInsights();
  var entries=data[insKey(cat.id,_insQ)]||[];
  document.getElementById('hdr-title').textContent=esc(q);
  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_insView=\'cat\';renderInsights()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; '+esc(cat.title)+'</button>';
  h+='<div style="background:'+cat.bg+';border-radius:18px;padding:16px;margin-bottom:16px;border-right:4px solid '+cat.color+'">';
  h+='<div style="font-size:17px;font-weight:800;color:#4a4340;line-height:1.4">'+esc(q)+'</div></div>';
  for(var ei=entries.length-1;ei>=0;ei--){
    var e=entries[ei];
    var dd=new Date(e.date);
    var ds=dd.getDate()+'/'+(dd.getMonth()+1)+'/'+dd.getFullYear();
    h+='<div style="background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(200,180,160,.08);position:relative">';
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px">'+ds+'</div>';
    h+='<div style="font-size:13px;color:#4a4340;line-height:1.7;white-space:pre-wrap">'+esc(e.text)+'</div>';
    if(e.changedFrom){
      h+='<div style="margin-top:10px;border-top:1px solid #f5f0eb;padding-top:10px">';
      h+='<div style="font-size:10px;font-weight:700;color:#a89e97;margin-bottom:4px">פעם חשבתי:</div>';
      h+='<div style="font-size:12px;color:#6a6360;font-style:italic">'+esc(e.changedFrom)+'</div>';
      if(e.changedWhy){
        h+='<div style="font-size:10px;font-weight:700;color:#a89e97;margin-top:6px;margin-bottom:4px">מה שינה את דעתי:</div>';
        h+='<div style="font-size:12px;color:#6a6360">'+esc(e.changedWhy)+'</div>';
      }
      h+='</div>';
    }
    h+='<button onclick="deleteInsEntry('+ei+')" style="position:absolute;top:10px;left:10px;background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:13px">&times;</button>';

  h+='</div>';
  document.getElementById('content').innerHTML=h;

function renderInsEntry(){
  var cat=INSIGHTS_CATS.find(function(c){return c.id===_insCat;});
  if(!cat){_insView='q';renderInsights();return;}
  var q=cat.questions[_insQ];
  document.getElementById('hdr-title').textContent='תובנה חדשה';
  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_insView=\'q\';renderInsights()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; '+esc(q)+'</button>';
  h+='<div style="background:'+cat.bg+';border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;font-weight:700;color:#4a4340">'+esc(q)+'</div>';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:5px">התובנה שלך</div>';
  h+='<textarea id="ins-text" class="q-input" rows="5" placeholder="כתוב כאן..." style="min-height:120px;margin-bottom:14px"></textarea>';
  h+='<div style="background:#f5f0eb;border-radius:14px;padding:12px;margin-bottom:16px">';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">פעם חשבתי:</div>';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">מה שינה את דעתי:</div>';
  h+='<input id="ins-changed-why" class="mtin" placeholder="מה התקיים, מה קרה...">';
  h+='</div>';
  h+='<button onclick="saveInsEntry()" style="width:100%;background:'+cat.color+';border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">שמור</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function saveInsEntry(){
  var textInp=document.getElementById('ins-text');
  if(!textInp||!textInp.value.trim()){showToast('כתוב משהו...');return;}
  var changedFrom=(document.getElementById('ins-changed-from')||{}).value||'';
  var changedWhy=(document.getElementById('ins-changed-why')||{}).value||'';
  var data=loadInsights();
  var key=insKey(_insCat,_insQ);
  if(!data[key])data[key]=[];
  data[key].push({text:textInp.value.trim(),date:Date.now(),changedFrom:changedFrom.trim()||null,changedWhy:changedWhy.trim()||null});
  saveInsights(data);
  showToast('תובנה נשמרה &#10003;');
  _insView='q';renderInsights();
}

function deleteInsEntry(idx){
  var data=loadInsights();var key=insKey(_insCat,_insQ);
  if(data[key])data[key].splice(idx,1);
  saveInsights(data);renderInsights();
}

function loadBookLibrary(){try{var x=localStorage.getItem('book_library');return x?JSON.parse(x):[]; }catch(e){return[];}}
function saveBookLibrary(arr){try{localStorage.setItem('book_library',JSON.stringify(arr));}catch(e){}}

function finishBook(){
  var book=loadBook();
  if(!book.title)return;
  var lib=loadBookLibrary();
  var quotes=loadBookQuotes();
  // Check if already in library
  var exists=lib.some(function(b){return b.title===book.title;});
  if(!exists){
    lib.unshift({
      title:book.title,cover:book.cover||'',
      totalPages:book.total||book.page,
      finishedDate:new Date().toISOString().slice(0,10),
      quotes:quotes.slice()
    });
    saveBookLibrary(lib);
  }
  // Clear current book + quotes
  saveBook({title:'',page:0,total:0,cover:''});
  saveBookQuotes([]);
  showToast('✓ הספר נוסף לספרייה!');
  renderBookWidget();
}

var _showLibrary=false;
var _libraryOpenIdx=-1;

function toggleBookLibrary(){
  _showLibrary=!_showLibrary;
  _libraryOpenIdx=-1;
  renderBookWidget();
}
function openLibraryBook(idx){
  _libraryOpenIdx=_libraryOpenIdx===idx?-1:idx;
  renderBookWidget();
}
function deleteLibraryBook(idx){
  var lib=loadBookLibrary();lib.splice(idx,1);saveBookLibrary(lib);
  _libraryOpenIdx=-1;renderBookWidget();
}

function openBookQuote(){
  var ov=document.getElementById('book-quote-overlay');
  if(ov)ov.style.display='flex';
}
function closeBookQuote(){
  var ov=document.getElementById('book-quote-overlay');
  if(ov)ov.style.display='none';
}
function saveBookQuote(){
  var txt=document.getElementById('book-quote-text');
  var pg=document.getElementById('book-quote-page');
  if(!txt||!txt.value.trim())return;
  var quotes=loadBookQuotes();
  quotes.unshift({text:txt.value.trim(),page:parseInt(pg&&pg.value)||0});
  saveBookQuotes(quotes);
  closeBookQuote();
  renderBookWidget();
}
function deleteBookQuote(idx){
  var quotes=loadBookQuotes();
  quotes.splice(idx,1);
  saveBookQuotes(quotes);
  renderBookWidget();
}

function onBookPageSlide(val){
  // Live update the display while dragging
  var book=loadBook();
  book.page=parseInt(val)||0;
  var disp=document.querySelector('#home-book [style*="font-size:15px;font-weight:700;color:#a690cf"]');
  if(disp)disp.textContent=book.page;
  if(book.total>0){
    var pct=Math.round(book.page/book.total*100);
    var bar=document.querySelector('#home-book [style*="transition:width .4s"]');
    if(bar)bar.style.width=pct+'%';
    var pctLbl=document.querySelector('#home-book [style*="font-size:10px;color:#a690cf;font-weight:700"]');
    if(pctLbl)pctLbl.textContent=pct+'% הושלם';
  }
}
function onBookPageChange(val){
  var book=loadBook();
  book.page=parseInt(val)||0;
  saveBook(book);
}
function openBookEdit(){
  var ov=document.getElementById('book-edit-overlay');
  if(ov)ov.style.display='flex';
}
function closeBookEdit(){
  var ov=document.getElementById('book-edit-overlay');
  if(ov)ov.style.display='none';
}
function saveBookEdit(){
  var book=loadBook();
  var ti=document.getElementById('book-title-inp');
  var toi=document.getElementById('book-total-inp');
  if(ti)book.title=ti.value.trim();
  if(toi)book.total=parseInt(toi.value)||0;
  if(book.page>book.total&&book.total>0)book.page=book.total;
  saveBook(book);renderBookWidget();
}
function clearBook(){saveBook({title:'',page:0,total:0,cover:''});renderBookWidget();}
function handleBookCover(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=400,maxH=600;
      var w=img.width,h=img.height;
      var scale=Math.min(maxW/w,maxH/h,1);
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(h*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      var book=loadBook();book.cover=canvas.toDataURL('image/jpeg',0.85);
      saveBook(book);renderBookWidget();openBookEdit();
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

      var size=400;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _stopPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('stop-photo-prev');
      if(prev)prev.innerHTML='<img src="'+_stopPhotoData+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px">';
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function createTrip(){
  var name=document.getElementById('trip-name-inp');
  var date=document.getElementById('trip-date-inp');
  if(!name||!name.value.trim())return;
  var trips=loadTrips();
  var idx=trips.length;
  trips.push({name:name.value.trim(),startDate:date&&date.value?new Date(date.value).getTime():Date.now(),stops:[]});
  saveTrips(trips);saveActiveTrip(idx);_tripView='active';renderTrip();
}

function deleteTrip(idx){
  var trips=loadTrips();trips.splice(idx,1);saveTrips(trips);
  var active=loadActiveTrip();
  if(active===idx)saveActiveTrip(-1);
  else if(active>idx)saveActiveTrip(active-1);
  renderTripIntro();
}

function detectLocation(){
  var btn=document.getElementById('detect-loc-btn');
  if(btn){btn.textContent='חופש...⏳';btn.disabled=true;}
  if(!navigator.geolocation){showToast('גיאולוקציה לא זמין');return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=he')
      .then(function(r){return r.json();})
      .then(function(data){
        var place=data.address.city||data.address.town||data.address.village||data.address.county||'';
        var country=data.address.country||'';
        var placeInp=document.getElementById('stop-place');
        var countryInp=document.getElementById('stop-country');
        if(placeInp&&place)placeInp.value=place;
        if(countryInp&&country)countryInp.value=country;
        if(btn){btn.textContent='✓ נמצא!';btn.disabled=false;}
        showToast('✓ '+place+', '+country);
      }).catch(function(){
        if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
        showToast('שגיאה בחיפוש');
      });
  },function(){
    if(btn){btn.textContent='זהה מיקום אוטומטית';btn.disabled=false;}
    showToast('לא ניתן לקבל מיקום');
  });
}

function saveStop(){
  var place=document.getElementById('stop-place');
  var country=document.getElementById('stop-country');
  var date=document.getElementById('stop-date');
  var note=document.getElementById('stop-note');
  if(!place||!place.value.trim()){showToast('נא להזין שם מקום');return;}
  var trips=loadTrips();
  var idx=loadActiveTrip();
  if(!trips[idx])return;
  trips[idx].stops.push({
    place:place.value.trim(),
    country:country?country.value.trim():'',
    date:date&&date.value?new Date(date.value).getTime():Date.now(),
    note:note?note.value.trim():'',
    photo:_stopPhotoData||''
  });
  _stopPhotoData='';
  saveTrips(trips);_tripView='active';renderTrip();
  showToast('✓ '+place.value.trim()+' נוספה!');
}

function deleteStop(tripIdx,stopIdx){
  var trips=loadTrips();
  if(trips[tripIdx])trips[tripIdx].stops.splice(stopIdx,1);
  saveTrips(trips);renderTrip();
}


/* ── VISION BOARD ── */
// Photos and words the user arranges by hand inside a framed square on the home
// screen. Geometry is kept in percentages of the frame, so an arrangement
// survives a different screen size; photos are downscaled on the way in,
// because localStorage holds a few megabytes and a camera roll would fill it in
// three pictures.
//
// A note is the same kind of object as a photo and moves through the same
// gestures. The one difference is what scaling means: a photo has a width, a
// note has a font size - both stored as a percentage of the frame, both driven
// by the same corner handle.
var VB_KEY='vision_board';
var VB_MAX=520;   // longest edge kept of an uploaded photo, in px
var VB_COLORS=['#4a4340','#a690cf','#e08a72','#8aa899','#ffffff'];
var _vbSel=null;  // id of the selected item, or null
var _vbG=null;    // the gesture in progress - see vbDown
var _vbPts={};    // pointerId -> last client position, for two-finger gestures
var _vbEditId=null;               // note being edited in the sheet, null = new one
var _vbColor=VB_COLORS[0];
var _vbResizeBound=false;

function loadVision(){
  try{var x=localStorage.getItem(VB_KEY);var a=x?JSON.parse(x):[];return Array.isArray(a)?a:[];}catch(e){return[];}
}
function saveVision(a){
  try{localStorage.setItem(VB_KEY,JSON.stringify(a));return true;}
  catch(e){showToast('אין מספיק מקום לעוד תמונות');return false;}
}
function vbFind(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function vbClamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
function vbTop(a){var t=0;a.forEach(function(o){if((o.z||1)>t)t=o.z||1;});return t;}
// Where a new item lands: scattered around the middle rather than stacked.
function vbSpot(n){return {x:34+(n%3)*16,y:34+(Math.floor(n/3)%3)*16};}

function renderVisionBoard(){
  var el=document.getElementById('home-vision');if(!el)return;
  var items=loadVision();
  var h='<div style="background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700">VISION BOARD</div>';
  h+='<div style="display:flex;gap:6px">';
  h+='<button class="vb-add" onclick="vbPick()">+ תמונה</button>';
  h+='<button class="vb-add" onclick="vbOpenText(\'\')">+ טקסט</button>';
  h+='</div></div>';
  h+='<input type="file" id="vb-file" accept="image/*" multiple style="display:none" onchange="handleVisionPhoto(this)">';
  h+='<div class="vb-frame"><div class="vb-canvas" id="vb-canvas">';
  if(!items.length){
    h+='<div class="vb-empty">'+
         '<div style="font-size:34px">&#x1F5BC;&#xFE0F;</div>'+
         '<div style="font-size:12px;margin-bottom:4px">תמונות ומילים של מה שאתה רוצה לראות קורה</div>'+
         '<div style="display:flex;gap:8px">'+
           '<button class="vb-add" onclick="vbPick()">+ תמונה</button>'+
           '<button class="vb-add" onclick="vbOpenText(\'\')">+ טקסט</button>'+
         '</div>'+
       '</div>';
  }else{
    items.forEach(function(it){
      var sel=(it.id===_vbSel?' on':'');
      var pos='left:'+it.x+'%;top:'+it.y+'%;z-index:'+(it.z||1)+';'+
              'transform:translate(-50%,-50%) rotate('+it.rot+'deg)';
      var del='<button class="vb-del" onclick="vbDelete(\''+it.id+'\')">&#10005;</button>';
      var handles='<span class="vb-h vb-size"></span><span class="vb-h vb-rot">&#8635;</span>';
      if(it.kind==='text'){
        // White words sit on top of photos; anything darker sits on the mat.
        var light=String(it.color).toLowerCase().indexOf('#fff')===0;
        var shadow=light?'0 1px 4px rgba(60,50,45,.6)':'0 1px 3px rgba(255,255,255,.6)';
        h+='<div class="vb-item vb-text'+sel+'" data-id="'+it.id+'" data-fs="'+it.fs+'" '+
             'style="'+pos+';color:'+it.color+';text-shadow:'+shadow+'">'+
             '<span class="vb-tx">'+esc(it.text).replace(/\n/g,'<br>')+'</span>'+
             del+
             '<button class="vb-h vb-edit" onclick="vbOpenText(\''+it.id+'\')">&#9998;</button>'+
             handles+
           '</div>';
      }else{
        h+='<div class="vb-item'+sel+'" data-id="'+it.id+'" style="'+pos+';width:'+it.w+'%">'+
             '<img src="'+it.src+'" draggable="false" alt="">'+
             del+handles+
           '</div>';
      }
    });
  }
  h+='</div></div>';
  if(items.length)h+='<div class="vb-hint">גע כדי לבחור &#183; גרור להזזה &#183; הפינות מגדילות ומסובבות &#183; שתי אצבעות עושות את שתיהן יחד</div>';

  // Sheet for writing a note, shared by "+ טקסט" and the pencil on a note.
  h+='<div id="vb-text-overlay" style="display:none;position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:200;align-items:flex-end;justify-content:center">';
  h+='<div style="background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:20px 18px 34px">';
  h+='<div style="width:40px;height:4px;background:#c9bce0;border-radius:2px;margin:0 auto 16px"></div>';
  h+='<div style="font-size:15px;font-weight:800;color:#4a4340;margin-bottom:14px">טקסט על הלוח</div>';
  h+='<textarea id="vb-text-inp" rows="2" placeholder="מה אתה רוצה לראות קורה?" style="width:100%;border:1.5px solid #eae3dc;border-radius:14px;padding:12px;font-size:14px;font-family:inherit;color:#4a4340;background:#fff;resize:none;margin-bottom:14px"></textarea>';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px">צבע</div>';
  h+='<div id="vb-swatches" style="display:flex;gap:10px;margin-bottom:20px">';
  VB_COLORS.forEach(function(c){
    h+='<button class="vb-sw" data-c="'+c+'" onclick="vbPickColor(\''+c+'\')" style="background:'+c+'"></button>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:10px">';
  h+='<button onclick="vbCloseText()" style="flex:1;background:#f0ebe3;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit">ביטול</button>';
  h+='<button onclick="vbSaveText()" style="flex:2;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit">שמירה</button>';
  h+='</div></div></div>';

  h+='</div>';
  el.innerHTML=h;
  vbSizeText();
  var c=document.getElementById('vb-canvas');
  if(c)c.addEventListener('pointerdown',vbDown);
  // A note's size is a share of the frame, so it has to be recomputed in px
  // whenever the frame itself changes width.
  if(!_vbResizeBound&&window.addEventListener){
    window.addEventListener('resize',vbSizeText);_vbResizeBound=true;
  }
}

function vbSizeText(){
  var c=document.getElementById('vb-canvas');if(!c)return;
  var w=c.getBoundingClientRect().width;
  var els=c.querySelectorAll('.vb-text');
  for(var i=0;i<els.length;i++){
    els[i].style.fontSize=(parseFloat(els[i].getAttribute('data-fs'))/100*w)+'px';
  }
}

function vbPick(){var f=document.getElementById('vb-file');if(f)f.click();}

// Selection is a class swap rather than a re-render: re-rendering here would
// throw away the very element the finger is already holding.
function vbSelect(id){
  _vbSel=id;
  var c=document.getElementById('vb-canvas');if(!c)return;
  var els=c.querySelectorAll('.vb-item');
  for(var i=0;i<els.length;i++){
    var base='vb-item'+(els[i].className.indexOf('vb-text')>=0?' vb-text':'');
    els[i].className=base+(els[i].getAttribute('data-id')===id?' on':'');
  }
  if(!id)return;
  var a=loadVision(),it=vbFind(a,id);if(!it)return;
  var top=vbTop(a);
  if((it.z||1)<top){          // touching an item brings it to the front
    it.z=top+1;saveVision(a);
    var el=c.querySelector('.vb-item[data-id="'+id+'"]');if(el)el.style.zIndex=it.z;
  }
}

// Distance, angle and midpoint between the two fingers currently down.
function vbTwo(){
  var k=Object.keys(_vbPts),a=_vbPts[k[0]],b=_vbPts[k[1]];
  return {d:Math.max(8,Math.hypot(b.x-a.x,b.y-a.y)),
          a:Math.atan2(b.y-a.y,b.x-a.x),
          x:(a.x+b.x)/2,y:(a.y+b.y)/2};
}

function vbDown(e){
  var el=e.target.closest?e.target.closest('.vb-item'):null;
  if(!el){vbSelect(null);return;}
  // The two badges are buttons: let their click handlers run instead of dragging.
  if(e.target.closest('.vb-del')||e.target.closest('.vb-edit'))return;
  var id=el.getAttribute('data-id');
  if(id!==_vbSel)vbSelect(id);
  _vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var r=document.getElementById('vb-canvas').getBoundingClientRect();

  if(Object.keys(_vbPts).length>=2&&_vbG&&_vbG.id===id){
    var p=vbTwo();
    _vbG.mode='pinch';
    _vbG.it={x:_vbG.cur.x,y:_vbG.cur.y,w:_vbG.cur.w,rot:_vbG.cur.rot};
    _vbG.d0=p.d;_vbG.a0=p.a;_vbG.mx=p.x;_vbG.my=p.y;
  }else{
    var it=vbFind(loadVision(),id);if(!it)return;
    var text=it.kind==='text';
    var scale=text?it.fs:it.w;   // what the corner handle grows: font size or width
    var mode=e.target.closest('.vb-size')?'size':(e.target.closest('.vb-rot')?'rot':'move');
    var cx=r.left+it.x/100*r.width,cy=r.top+it.y/100*r.height;
    _vbG={id:id,el:el,mode:mode,r:r,text:text,
          it:{x:it.x,y:it.y,w:scale,rot:it.rot},
          cur:{x:it.x,y:it.y,w:scale,rot:it.rot},
          px:e.clientX,py:e.clientY,
          d0:Math.max(8,Math.hypot(e.clientX-cx,e.clientY-cy)),
          a0:Math.atan2(e.clientY-cy,e.clientX-cx)};
    window.addEventListener('pointermove',vbMove);
    window.addEventListener('pointerup',vbUp);
    window.addEventListener('pointercancel',vbUp);
  }
  e.preventDefault();
}

function vbMove(e){
  if(!_vbG)return;
  if(_vbPts[e.pointerId])_vbPts[e.pointerId]={x:e.clientX,y:e.clientY};
  var g=_vbG,r=g.r,c=g.cur;
  var lo=g.text?2:8,hi=g.text?40:140;
  if(g.mode==='pinch'&&Object.keys(_vbPts).length>=2){
    var p=vbTwo();
    c.w=vbClamp(g.it.w*(p.d/g.d0),lo,hi);
    c.rot=g.it.rot+(p.a-g.a0)*180/Math.PI;
    c.x=vbClamp(g.it.x+(p.x-g.mx)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(p.y-g.my)/r.height*100,0,100);
  }else if(g.mode==='move'){
    c.x=vbClamp(g.it.x+(e.clientX-g.px)/r.width*100,0,100);
    c.y=vbClamp(g.it.y+(e.clientY-g.py)/r.height*100,0,100);
  }else{
    var cx=r.left+c.x/100*r.width,cy=r.top+c.y/100*r.height;
    if(g.mode==='size')c.w=vbClamp(g.it.w*Math.hypot(e.clientX-cx,e.clientY-cy)/g.d0,lo,hi);
    else c.rot=g.it.rot+(Math.atan2(e.clientY-cy,e.clientX-cx)-g.a0)*180/Math.PI;
  }
  g.el.style.left=c.x+'%';g.el.style.top=c.y+'%';
  if(g.text)g.el.style.fontSize=(c.w/100*r.width)+'px';
  else g.el.style.width=c.w+'%';
  g.el.style.transform='translate(-50%,-50%) rotate('+c.rot+'deg)';
  e.preventDefault();
}

function vbUp(e){
  delete _vbPts[e.pointerId];
  var g=_vbG;if(!g)return;
  var left=Object.keys(_vbPts);
  if(left.length===1&&g.mode==='pinch'){
    // one finger lifted out of a pinch - carry on dragging with the other
    var p=_vbPts[left[0]];
    g.mode='move';g.it={x:g.cur.x,y:g.cur.y,w:g.cur.w,rot:g.cur.rot};g.px=p.x;g.py=p.y;
    return;
  }
  if(left.length)return;
  vbCommit();
  window.removeEventListener('pointermove',vbMove);
  window.removeEventListener('pointerup',vbUp);
  window.removeEventListener('pointercancel',vbUp);
  _vbG=null;
}

function vbCommit(){
  var g=_vbG;if(!g)return;
  var a=loadVision(),it=vbFind(a,g.id);if(!it)return;
  it.x=+g.cur.x.toFixed(2);it.y=+g.cur.y.toFixed(2);it.rot=+g.cur.rot.toFixed(1);
  if(g.text){
    it.fs=+g.cur.w.toFixed(2);
    // keep the attribute in step, or the next window resize restores the old size
    if(g.el.setAttribute)g.el.setAttribute('data-fs',it.fs);
  }else{
    it.w=+g.cur.w.toFixed(2);
  }
  saveVision(a);
}

function vbDelete(id){
  var a=loadVision().filter(function(o){return o.id!==id;});
  saveVision(a);
  if(_vbSel===id)_vbSel=null;
  renderVisionBoard();
}

/* ── notes ── */

function vbOpenText(id){
  _vbEditId=id||null;
  var it=_vbEditId?vbFind(loadVision(),_vbEditId):null;
  _vbColor=it?it.color:VB_COLORS[0];
  var ov=document.getElementById('vb-text-overlay');if(!ov)return;
  var inp=document.getElementById('vb-text-inp');
  if(inp)inp.value=it?it.text:'';
  vbPaintSwatches();
  ov.style.display='flex';
  if(inp&&inp.focus)setTimeout(function(){inp.focus();},60);
}

function vbCloseText(){
  var ov=document.getElementById('vb-text-overlay');if(ov)ov.style.display='none';
  _vbEditId=null;
}

function vbPickColor(c){_vbColor=c;vbPaintSwatches();}

function vbPaintSwatches(){
  var box=document.getElementById('vb-swatches');if(!box)return;
  var sw=box.querySelectorAll('.vb-sw');
  for(var i=0;i<sw.length;i++){
    sw[i].className='vb-sw'+(sw[i].getAttribute('data-c')===_vbColor?' on':'');
  }
}

function vbSaveText(){
  var inp=document.getElementById('vb-text-inp');
  var txt=inp?inp.value.trim():'';
  var a=loadVision();
  if(!txt){
    // an emptied note is a deleted note - there is nothing left to show
    if(_vbEditId)a=a.filter(function(o){return o.id!==_vbEditId;});
    saveVision(a);vbCloseText();renderVisionBoard();return;
  }
  if(_vbEditId){
    var it=vbFind(a,_vbEditId);
    if(it){it.text=txt;it.color=_vbColor;}
  }else{
    var spot=vbSpot(a.length);
    a.push({id:'vt'+Date.now(),kind:'text',text:txt,color:_vbColor,
            x:spot.x,y:spot.y,fs:7,
            rot:Math.round((Math.random()*10-5)*10)/10,z:vbTop(a)+1});
  }
  saveVision(a);vbCloseText();renderVisionBoard();
}

/* ── photos ── */

// Fit the photo inside VB_MAX and re-encode as JPEG - a 4MB camera shot comes
// out around 60KB, which is what lets a boardful of them live in localStorage.
function vbScale(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,VB_MAX/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*s));
      cv.height=Math.max(1,Math.round(img.height*s));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL('image/jpeg',0.8));}catch(err){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=e.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}

function handleVisionPhoto(input){
  var files=Array.prototype.slice.call(input.files||[]);
  input.value='';   // so picking the same photo twice still fires onchange
  if(!files.length)return;
  var a=loadVision(),pending=files.length,added=0;
  files.forEach(function(file,i){
    vbScale(file,function(src){
      if(src){
        var spot=vbSpot(a.length);
        a.push({id:'vb'+Date.now()+'_'+i,src:src,
                x:spot.x,y:spot.y,w:38,
                rot:Math.round((Math.random()*14-7)*10)/10,z:vbTop(a)+1});
        added++;
      }
      if(--pending===0){
        if(added)saveVision(a);
        renderVisionBoard();
      }
    });
  });
}
function renderTripToggle(){
  var el=document.getElementById('trip-toggle-strip');if(!el)return;
  var isOn=loadActiveTrip()>=0&&loadTrips().length>0;
  var h='<div style="background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 4px 16px rgba(200,180,160,.1);display:flex;align-items:center;gap:14px">';
  h+='<div style="flex:1">';
  h+='<div style="font-size:13px;font-weight:700;color:#4a4340">מצב טיול</div>';
  h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+(isOn?'הטיול פעיל &mdash; '+loadTrips()[loadActiveTrip()].name:'כבוי')+'</div>';
  h+='</div>';
  if(isOn){
    h+='<button onclick="enterModule(\'trip\')" style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border:none;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#4f6ef7">פתח</button>';
  }
  h+='<button class="trip-toggle-track'+(isOn?' on':'')+'" onclick="onTripToggle('+(isOn?'false':'true')+')" id="trip-toggle-btn">';
  h+='<div class="trip-toggle-thumb"></div></button>';
  h+='</div>';
  el.innerHTML=h;
}

function onTripToggle(turnOn){
  if(turnOn){
    // Confirm dialog

/* ── BACKUP ──
   Everything the app knows lives in this browser's localStorage and nowhere
   else. Delete the app, change phone, and a year of tracking is gone - and
   there is no other way to carry data from this web prototype into the
   native build, or between the dev and stable copies.

   localStorage.length/key() are used rather than a list of known keys, so a
   feature added later is backed up without anyone remembering to add it
   here. In dev those go through the namespacing shim and return the app's
   own key names, which is exactly what should end up in the file.

   The steps token is deliberately left out: it is a bearer secret, and a
   backup file travels - through mail, a cloud drive, a chat. A fresh
   install mints its own. */
var BACKUP_SKIP={steps_token:1,last_export:1};

function collectAppData(){
  var out={},i,k;
  for(i=0;i<localStorage.length;i++){
    k=localStorage.key(i);
    if(!k||BACKUP_SKIP[k])continue;
    try{out[k]=localStorage.getItem(k);}catch(e){}
  }
  return out;
}

// Photos live in IndexedDB now, so a backup that only walked localStorage
// would quietly leave every picture behind.
function buildBackup(){
  var data=collectAppData();
  return photoAll().then(function(photos){
    return JSON.stringify({
      app:'better-me',version:2,
      exportedAt:new Date().toISOString(),
      keyCount:Object.keys(data).length,
      photoCount:Object.keys(photos).length,
      data:data,photos:photos
    });
  });
}

function exportData(){
  showToast('מכין גיבוי…');
  buildBackup().then(exportDeliver);
}
function exportDeliver(text){
  var name='better-me-'+todayStr()+'.json';
  var blob=new Blob([text],{type:'application/json'});
  var kb=Math.max(1,Math.round(blob.size/1024));
  var file=null;
  try{file=new File([blob],name,{type:'application/json'});}catch(e){}
  try{localStorage.setItem('last_export',new Date().toISOString());}catch(e){}

  // The share sheet is the only reliable way to save a file out of a web app
  // on iOS; a download link is the fallback everywhere else.
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'גיבוי Better Me'}).then(function(){
      renderBackup();showToast('✓ הגיבוי נשמר · '+kb+'KB');
    },function(){});
    return;
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(function(){try{URL.revokeObjectURL(url);a.remove();}catch(e){}},1000);
  renderBackup();showToast('✓ הגיבוי ירד · '+kb+'KB');
}

function importChosen(input){
  var f=input.files&&input.files[0];
  input.value='';
  if(!f)return;
  var r=new FileReader();
  r.onerror=function(){showToast('לא ניתן לקרוא את הקובץ');};
  r.onload=function(){
    var o=null;
    try{o=JSON.parse(r.result);}catch(e){}
    if(!o||o.app!=='better-me'||!o.data||typeof o.data!=='object'){
      showToast('הקובץ לא נראה כמו גיבוי של האפליקציה');return;
    }
    _pendingImport=o;renderImportSheet();
  };
  r.readAsText(f);
}

function backupSummary(o){
  var keys=Object.keys(o.data),days=[],i,m;
  for(i=0;i<keys.length;i++){
    m=/^day_(\d{4}-\d{2}-\d{2})$/.exec(keys[i]);
    if(m)days.push(m[1]);
  }
  days.sort();
  return{keys:keys.length,days:days.length,from:days[0]||'',to:days[days.length-1]||''};
}

function applyImport(mode){
  var o=_pendingImport;if(!o)return;
  var data=o.data,keys=Object.keys(data),i,k,n=0;
  if(mode==='replace'){
    var mine=[],j;
    for(j=0;j<localStorage.length;j++){k=localStorage.key(j);if(k&&!BACKUP_SKIP[k])mine.push(k);}
    for(j=0;j<mine.length;j++){try{localStorage.removeItem(mine[j]);}catch(e){}}
  }
  for(i=0;i<keys.length;i++){
    k=keys[i];
    if(BACKUP_SKIP[k])continue;
    if(mode==='merge'&&localStorage.getItem(k)!==null)continue;
    if(typeof data[k]!=='string')continue;
    try{localStorage.setItem(k,data[k]);n++;}catch(e){}
  }
  closeImport();
  // Pictures ride in the file separately and go back into the photo store.
  var jobs=[];
  if(o.photos&&typeof o.photos==='object'){
    Object.keys(o.photos).forEach(function(pk){
      if(typeof o.photos[pk]==='string')jobs.push(photoPutKeyed(pk,o.photos[pk]));
    });
  }
  showToast('✓ יובאו '+n+' פריטים');
  // Half the app caches its data in module variables; a reload is the honest
  // way to make every screen read the new state.
  Promise.all(jobs).then(function(){setTimeout(function(){location.reload();},600);});
}

// What counts as answered per question - an explicit "no" is an answer too.
function rfAnswered(q){
  var v=rfVal(q.id),i;
  if(q.kind==='branch')return v===true||v===false;
  if(q.kind==='chipsNote')return rfArr(q.id).length>0||!!rfVal(q.note);
  if(q.kind==='person')return !!rfVal('influentialPerson');
  if(q.kind==='timeline')return rfArr('dayTimeline').length>0;
  if(q.kind==='clock'){
    var c=rfVal('timeclock');
    if(!Array.isArray(c))return false;
    for(i=0;i<c.length;i++)if(c[i]&&c[i]!=='none')return true;
    return false;
  }
  if(q.kind==='steps')return (rfVal('steps')||0)>0;
  if(q.kind==='song')return !!rfVal('song');
  if(q.kind==='mood')return !!v;
  return typeof v==='string'?v.length>0:!!v;
}

function rfSteps(){return _rfStage===2?RF_STAGE2:RF_STAGE1;}

function rfFace(i,col,on){
  return '<svg viewBox="0 0 24 24" stroke="'+(on?col:'#c0b8b0')+'">'+
    '<circle cx="12" cy="12" r="9.2"/>'+
    '<circle cx="9.1" cy="9.9" r=".95" fill="'+(on?col:'#c0b8b0')+'" stroke="none"/>'+
    '<circle cx="14.9" cy="9.9" r=".95" fill="'+(on?col:'#c0b8b0')+'" stroke="none"/>'+
    '<path d="'+RF_MOUTHS[i]+'"/></svg>';
}
function rfFaceMini(m){
  var i=Math.max(1,Math.min(5,m))-1;
  return '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke-width:1.7;stroke-linecap:round" stroke="'+RF_MOODS[i].c+'"><circle cx="12" cy="12" r="9.2"/><circle cx="9.1" cy="9.9" r=".95" fill="'+RF_MOODS[i].c+'" stroke="none"/><circle cx="14.9" cy="9.9" r=".95" fill="'+RF_MOODS[i].c+'" stroke="none"/><path d="'+RF_MOUTHS[i]+'"/></svg>';
}

function rfRec(d){return loadSummary(d)||null;}

// Every answer is written the moment it is given - there is no submit step,
// and closing the app mid-way loses nothing.
function rfSave(patch){
  var d=_rfDate||todayStr();
  var r=loadSummary(d)||{date:d,createdAt:new Date().toISOString()};
  for(var k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))r[k]=patch[k];
  r.date=d;
  if(!r.createdAt)r.createdAt=new Date().toISOString();
  r.updatedAt=new Date().toISOString();
  saveSummary(d,r);
  return r;
}
function rfVal(id){var r=rfRec(_rfDate);return r?r[id]:undefined;}
function rfArr(id){var v=rfVal(id);return Array.isArray(v)?v:[];}
function rfDone(r){return !!(r&&r.done);}
function rfProgress(){return Math.round(_rfStep/rfSteps().length*100);}

function enterReflect(){_rfDate=todayStr();_rfView='home';renderReflect();}
function renderReflect(){
  document.getElementById('hdr-title').textContent='סיום יום';
  if(_rfView==='home')renderReflectHome();
  else if(_rfView==='intro')renderReflectIntro();
  else if(_rfView==='step')renderReflectStep();
  else if(_rfView==='bridge')renderReflectBridge();
  else if(_rfView==='board')renderReflectBoard();
  else if(_rfView==='done')renderReflectDone();
  hydratePhotos();
  window.scrollTo(0,0);
}

/* ── module home ── */
function renderReflectHome(){
  var today=todayStr(),r=rfRec(today);
  var h='<div style="padding-bottom:24px">';
  h+='<div class="rf-hero">';
  if(!r){
    h+='<div class="rf-hero-t">עוד לא עצרת לסכם את היום.</div>';
    h+='<div class="rf-hero-s">כמה דקות, וזה שלך.</div>';
    h+='<button onclick="rfStart()" class="rf-next" style="margin-top:20px">התחל סיכום</button>';
  } else if(!rfDone(r)){
    h+='<div class="rf-hero-t">התחלת לסכם את היום.</div>';
    h+='<div class="rf-hero-s">אפשר להמשיך מאיפה שעצרת.</div>';
    h+='<button onclick="rfResume()" class="rf-next" style="margin-top:20px">המשך מאיפה שעצרת</button>';
    h+='<button onclick="rfStart()" class="rf-ghost">התחל מחדש</button>';
  } else {
    h+='<div class="rf-hero-t">סיכמת את היום שלך.</div>';
    h+='<div class="rf-hero-s">'+rfRecap(r)+'</div>';
    if(r.photo)h+=photoImg(r.photo,'style="width:100%;border-radius:18px;margin-top:16px;display:block"');
    h+='<button onclick="rfResume()" class="rf-ghost" style="margin-top:12px">פתח שוב</button>';
  }
  h+='</div>';

  var prev=[],i,d,s;
  for(i=1;i<=60;i++){
    d=new Date();d.setDate(d.getDate()-i);
    s=d.toISOString().slice(0,10);
    var rec=rfRec(s);
    if(rec)prev.push({d:s,r:rec});
    if(prev.length>=20)break;
  }
  if(prev.length){
    h+='<div class="cttl" style="margin:20px 0 10px">ימים קודמים</div>';
    for(i=0;i<prev.length;i++){
      var p=prev[i],pr=p.r;
      var dt=new Date(p.d+'T12:00:00');
      var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][dt.getDay()];
      h+='<button class="rf-day" onclick="openSummary(\''+p.d+'\')">';
      if(pr.photo)h+=photoImg(pr.photo,'class="rf-day-th"');
      else h+='<div class="rf-day-th" style="display:flex;align-items:center;justify-content:center">'+(pr.mood?rfFaceMini(pr.mood):'')+'</div>';
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:13px;font-weight:800;color:#4a4340">'+dn+' &middot; '+dt.getDate()+'.'+(dt.getMonth()+1)+'</div>';
      h+='<div style="font-size:10.5px;color:#a89e97;margin-top:2px">'+rfRecap(pr)+'</div></div>';
      if(pr.dayRating)h+='<div style="font-size:16px;font-weight:800;color:#a690cf;flex-shrink:0">'+pr.dayRating+'</div>';
      h+='</button>';
    }
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}
function rfRecap(r){
  var bits=[];
  if(r.mood)bits.push(RF_MOODS[Math.max(1,Math.min(5,r.mood))-1].l);
  if(r.dayRating)bits.push(r.dayRating+'/10');
  if(r.photo)bits.push('תמונה');
  return bits.length?bits.join(' · '):'נשמר';
}
function rfStart(){_rfDate=todayStr();_rfStage=1;_rfStep=0;_rfView='intro';renderReflect();}
function rfResume(){
  _rfDate=todayStr();
  var r=rfRec(_rfDate);
  _rfStage=(r&&r.lastStage)||1;
  _rfStep=Math.min(rfSteps().length-1,(r&&r.lastStep)||0);
  // Someone who got as far as the deep pass comes back to the board, not to
  // whichever card they happened to open last.
  _rfView=_rfStage===2?'board':'step';
  renderReflect();
}

/* ── the deep-pass board ── */
function renderReflectBoard(){
  var i,done=0;
  for(i=0;i<RF_STAGE2.length;i++)if(rfAnswered(RF_STAGE2[i]))done++;

  var h='<div style="padding:6px 0 24px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">';
  h+='<div class="rf-q" style="font-size:21px">במה בא לך להעמיק?</div>';
  h+='<div style="font-size:11px;color:#a89e97;font-weight:700;flex-shrink:0">'+done+'/'+RF_STAGE2.length+'</div></div>';
  h+='<div class="rf-sub" style="margin-bottom:18px">בחר מה שמדבר אליך. אין חובה לענות על הכל, ואפשר לסיים מתי שבא לך.</div>';

  h+='<div class="rf-board">';
  for(i=0;i<RF_STAGE2.length;i++){
    var q=RF_STAGE2[i],g=RF_GRAD[q.g]||RF_GRAD.lav,ok=rfAnswered(q);
    h+='<button class="rf-card'+(ok?' done':'')+'" style="background:'+g[0]+'" onclick="rfOpenCard('+i+')">';
    if(ok)h+='<div class="rf-card-v">&#10003;</div>';
    h+='<div class="rf-card-ic" style="color:'+g[1]+'"><svg viewBox="0 0 24 24">'+(RF_ICONS[q.ic]||'')+'</svg></div>';
    h+='<div class="rf-card-t">'+q.t+'</div>';
    h+='<div class="rf-card-s">'+q.s+'</div>';
    h+='</button>';
  }
  h+='</div>';

  h+='<button onclick="rfFinish()" class="rf-next" style="margin-top:20px">סיימתי להיום</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}
function rfOpenCard(i){_rfStage=2;_rfStep=i;_rfView='step';rfSave({lastStage:2,lastStep:i});renderReflect();}

/* ── intro ── */
function renderReflectIntro(){
  var h='<div class="rf"><div class="rf-body" style="text-align:center">';
  h+='<div class="rf-q" style="font-size:27px">בוא ניקח רגע להסתכל על היום שלך.</div>';
  h+='<div class="rf-sub" style="font-size:14px">כמה דקות, וזה שלך.</div>';
  h+='<button onclick="_rfView=\'step\';_rfStage=1;_rfStep=0;renderReflect()" class="rf-next" style="margin-top:36px">נתחיל</button>';
  h+='<button onclick="_rfView=\'home\';renderReflect()" class="rf-ghost">לא עכשיו</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
}

/* ── one question ── */
function renderReflectStep(){
  var q=rfSteps()[_rfStep];
  if(!q){rfStageEnd();return;}
  var cur=rfVal(q.id),i,c,o;

  var h='<div class="rf"><div class="rf-top">';
  h+='<button class="rf-icon" onclick="rfBack()">&#8250;</button>';
  h+='<div class="rf-bar"><div class="rf-bar-f" style="width:'+rfProgress()+'%"></div></div>';
  h+='<button class="rf-skip" onclick="rfSkip()">דלג</button>';
  h+='</div><div class="rf-body">';
  h+='<div class="rf-q">'+q.q+'</div>';
  if(q.sub)h+='<div class="rf-sub">'+q.sub+'</div>';
  h+='<div class="rf-field">';

  if(q.kind==='mood'){
    h+='<div class="rf-moods">';
    for(i=0;i<RF_MOODS.length;i++){
      var m=RF_MOODS[i],on=cur===m.v;
      h+='<button class="rf-mood'+(on?' on':'')+'" onclick="rfPickMood(\''+q.id+'\','+m.v+')">'+rfFace(i,m.c,on)+'<span class="rf-mood-l">'+m.l+'</span></button>';
    }
    h+='</div>';
  }
  else if(q.kind==='chips'){
    h+=rfChipsHTML(q.id,q.opts,rfArr(q.id));
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='chipsNote'){
    h+=rfChipsHTML(q.id,q.opts,rfArr(q.id));
    h+='<textarea class="rf-in" id="rf-note" style="min-height:64px;margin-top:18px" placeholder="'+(q.ph||'')+'">'+(rfVal(q.note)?esc(rfVal(q.note)):'')+'</textarea>';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='scale'){
    h+='<div class="rf-scale">';
    for(i=1;i<=10;i++)h+='<button class="rf-num'+(cur===i?' on':'')+'" onclick="rfPickScale('+i+')">'+i+'</button>';
    h+='</div><div class="rf-echo" id="rf-echo">'+(cur?rfRatingEcho(cur):'')+'</div>';
  }
  else if(q.kind==='ladder'){
    h+='<div class="rf-ladder">';
    for(i=0;i<q.opts.length;i++)h+='<button class="rf-rung'+(cur===i+1?' on':'')+'" onclick="rfPickLadder('+(i+1)+')">'+q.opts[i]+'</button>';
    h+='</div>';
  }
  else if(q.kind==='text'){
    h+='<textarea class="rf-in" id="rf-in" placeholder="'+(q.ph||'')+'">'+(cur?esc(cur):'')+'</textarea>';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  else if(q.kind==='photo'){
    h+='<div id="rf-photo">'+rfPhotoHTML(cur)+'</div>';
    if(cur){
      h+='<div class="rf-sub" style="margin-top:22px;font-weight:700;color:#4a4340;font-size:14px">רוצה להוסיף משהו לתמונה?</div>';
      h+='<textarea class="rf-in" id="rf-cap" style="min-height:70px" placeholder="מה קרה ברגע הזה? למה בחרת דווקא בתמונה הזאת? או פשוט משהו שתרצה לזכור.">'+(rfVal('photoCaption')?esc(rfVal('photoCaption')):'')+'</textarea>';
    }
    h+='<input type="file" id="rf-file" accept="image/*" style="display:none" onchange="rfPhotoPick(this)">';
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  /* yes / no, and the follow-up only if yes */
  else if(q.kind==='branch'){
    h+='<div class="rf-ladder">';
    h+='<button class="rf-rung'+(cur===true?' on':'')+'" onclick="rfPickBranch(\''+q.id+'\',true)">כן</button>';
    h+='<button class="rf-rung'+(cur===false?' on':'')+'" onclick="rfPickBranch(\''+q.id+'\',false)">לא</button>';
    h+='</div>';
    if(cur===true){
      h+='<div class="rf-sub" style="margin-top:26px;font-weight:700;color:#4a4340;font-size:15px">'+q.follow+'</div>';
      h+='<div style="margin-top:14px">'+rfChipsHTML(q.listId,q.opts,rfArr(q.listId))+'</div>';
      h+='<textarea class="rf-in" id="rf-note" style="min-height:64px;margin-top:16px" placeholder="'+(q.ph||'')+'">'+(rfVal(q.note)?esc(rfVal(q.note)):'')+'</textarea>';
      h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
    }
  }
  /* pick from the people area, or add someone */
  else if(q.kind==='person'){
    var people=loadPeople(),sel=rfVal('influentialPerson')||'';
    h+='<div class="rf-chips">';
    for(i=0;i<people.length;i++){
      o=people[i].name||'';
      if(!o)continue;
      h+='<button class="rf-chip'+(sel===o?' on':'')+'" onclick="rfPickPerson(\''+esc(o).replace(/'/g,"\\'")+'\')">'+esc(o)+'</button>';
    }
    h+='<button class="rf-chip" style="border-style:dashed" onclick="rfAddPerson()">+ אדם חדש</button>';
    h+='</div>';
    if(sel){
      h+='<div class="rf-sub" style="margin-top:26px;font-weight:700;color:#4a4340;font-size:15px">איך הוא השפיע עליך היום?</div>';
      h+='<div class="rf-ladder" style="margin-top:14px">';
      for(i=0;i<RF_IMPACT.length;i++)h+='<button class="rf-rung'+(rfVal('influentialPersonImpact')===RF_IMPACT[i]?' on':'')+'" onclick="rfSave({influentialPersonImpact:\''+RF_IMPACT[i]+'\'});renderReflectStep()">'+RF_IMPACT[i]+'</button>';
      h+='</div>';
    }
    h+='<button onclick="rfNext()" class="rf-next">המשך</button>';
  }
  /* the day as a short vertical timeline */
  else if(q.kind==='timeline'){
    var tl=rfArr('dayTimeline');
    h+='<div style="display:flex;flex-direction:column;gap:0">';
    for(i=0;i<tl.length;i++){
      h+='<div style="display:flex;gap:12px;align-items:flex-start">';
      h+='<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:14px">';
      h+='<div style="width:9px;height:9px;border-radius:50%;background:#a690cf;margin-top:5px"></div>';
      if(i<tl.length-1)h+='<div style="width:1.5px;flex:1;background:#e4ddd4;min-height:28px"></div>';
      h+='</div>';
      h+='<div style="flex:1;padding-bottom:16px;min-width:0">';
      h+='<div style="font-size:10.5px;color:#a89e97;font-weight:700">'+esc(tl[i].t||'')+'</div>';
      h+='<div style="font-size:14px;color:#4a4340;line-height:1.5;margin-top:2px">'+esc(tl[i].w||'')+'</div></div>';

      h+='</div>';
    }

/* ── answering ── */
function rfCommitText(){
  var q=rfSteps()[_rfStep];if(!q)return;
  var el,p={};
  if(q.kind==='text'){
    el=document.getElementById('rf-in');
    if(el){p[q.id]=el.value.trim();rfSave(p);}
  } else if(q.kind==='photo'){
    el=document.getElementById('rf-cap');
    if(el)rfSave({photoCaption:el.value.trim()});
  } else if(q.kind==='chipsNote'||q.kind==='branch'){
    el=document.getElementById('rf-note');
    if(el&&q.note){p[q.note]=el.value.trim();rfSave(p);}
  } else if(q.kind==='steps'){
    el=document.getElementById('rf-in');
    var n=el?parseInt(el.value,10):NaN;
    if(n>=0){saveSteps(_rfDate,n,'manual');rfSave({steps:n});}
    else rfSave({steps:stepsOf(_rfDate)});
  } else if(q.kind==='song'){
    var s1=document.getElementById('rf-song'),s2=document.getElementById('rf-artist');
    rfSave({song:s1?s1.value.trim():'',songArtist:s2?s2.value.trim():''});
  } else if(q.kind==='clock'){
    var clk=interviewAnswers.timeclock||new Array(25).fill('none');
    rfSave({timeclock:clk.slice(),timeDistribution:rfClockTotals(clk)});
  } else if(q.kind==='flow'){
    // an empty box is scaffolding; one with only a photo is still an answer
    var a=rfFlowRead(),keep=[],j;
    for(j=0;j<a.length;j++)if(a[j].w||a[j].p)keep.push(a[j]);
    rfSave({flow:keep});
  }
}
function rfStageEnd(){
  if(_rfStage===1){_rfView='bridge';renderReflect();}
  else{_rfView='board';renderReflect();}
}
// The quick summary runs as a queue; the deep pass is picked off a board, so
// finishing one of its questions returns there rather than marching on.
function rfAdvance(){
  if(_rfStage===2){_rfView='board';renderReflect();return;}
  var last=rfSteps().length-1;
  rfSave({lastStep:Math.min(last,_rfStep+1),lastStage:1});
  _rfStep++;
  if(_rfStep>rfSteps().length-1)rfStageEnd();
  else renderReflect();
}
function rfNext(){rfCommitText();rfAdvance();}
function rfSkip(){rfCommitText();rfAdvance();}
function rfBack(){
  rfCommitText();
  if(_rfStage===2){_rfView='board';renderReflect();return;}
  if(_rfStep===0){_rfView='home';renderReflect();return;}
  _rfStep--;rfSave({lastStep:_rfStep,lastStage:1});renderReflect();
}

/* While the screen is open every slot is kept, empty ones included, so the
   boxes on screen stay lined up with the photos in storage. parseFlow, which
   drops the empties, is for reading a saved day. */
function rfFlowRaw(){
  var v=rfVal('flow'),out=[],i,s;
  if(!Array.isArray(v))return parseFlow(v);
  for(i=0;i<v.length;i++){
    s=v[i];
    if(typeof s==='string')out.push({w:s,p:''});
    else if(s&&typeof s==='object')out.push({w:s.w||'',p:s.p||''});
    else out.push({w:'',p:''});
  }
  return out;
}
// The boxes are live inputs, so anything typed has to be read out of the DOM
// before a re-render replaces them; photos come from storage by the same index.
function rfFlowRead(){
  var stored=rfFlowRaw(),out=[],i=0,el;
  while((el=document.getElementById('rf-fl-'+i))){
    out.push({w:el.value.trim(),p:(stored[i]&&stored[i].p)||''});
    i++;
  }
  return out;
}
function rfFlowAdd(){
  var a=rfFlowRead();a.push({w:'',p:''});
  rfSave({flow:a});renderReflectStep();
  setTimeout(function(){var e=document.getElementById('rf-fl-'+(a.length-1));if(e)e.focus();},40);
}
function rfFlowDel(i){
  var a=rfFlowRead();a.splice(i,1);

}
var _rfFlowIdx=-1;
function rfFlowPhoto(i){_rfFlowIdx=i;var f=document.getElementById('rf-fl-file');if(f)f.click();}
function rfFlowPhotoClear(i){
  var a=rfFlowRead();

function rfFlowPhotoPick(input){
  var file=input.files&&input.files[0],idx=_rfFlowIdx;
  input.value='';
  if(!file||idx<0)return;
  var a=rfFlowRead();               // capture what is typed before re-rendering
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      // Deliberately smaller than the day photo: these are thumbnails inside a
      // diagram, and several of them ride along with every day.
      var cv=document.createElement('canvas'),mx=640,w=img.width,h=img.height;
      if(w>mx){h=Math.round(h*mx/w);w=mx;}
      if(h>mx){w=Math.round(w*mx/h);h=mx;}
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      var d=cv.toDataURL('image/jpeg',0.68);
      photoPut(d).then(function(key){
        if(a[idx])a[idx].p=key||d;
        rfSave({flow:a});renderReflectStep();
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  var t=document.getElementById('rf-tl-t'),w=document.getElementById('rf-tl-w');

function rfPhotoClear(){photoDel(rfVal('photo'));rfSave({photo:'',photoCaption:''});renderReflectStep();}
function rfPhotoPick(input){
  var file=input.files&&input.files[0];input.value='';
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas'),mx=900,w=img.width,h=img.height;
      if(w>mx){h=Math.round(h*mx/w);w=mx;}
      if(h>mx){w=Math.round(w*mx/h);h=mx;}
