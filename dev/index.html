<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8dff5">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תזונה">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<title>&#x05EA;&#x05D6;&#x05D5;&#x05E0;&#x05D4;</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f0eb;color:#4a4340;direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 100px}
.hdr{background:linear-gradient(135deg,#f0ebe3,#e8dff5);padding:16px 16px 12px;position:sticky;top:0;z-index:10}
.hdr-date{text-align:center;font-size:11px;color:#a89e97;margin-bottom:3px}
.hdr-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-nav{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nav-arrow{background:#fff;border:none;border-radius:12px;width:34px;height:34px;flex-shrink:0;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.2)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.6);border-radius:14px;padding:4px;flex:1;min-width:0}
.tab{flex:1;padding:7px 4px;border:none;border-radius:11px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#a89e97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.content{padding:14px 14px 0}
/* The game is a whole page of its own - dark, full-bleed, with its own CSS
   reset - so it runs inside an iframe instead of fighting the app's styles. */
.app.game-mode{padding-bottom:0}
.game-wrap{border-radius:22px;overflow:hidden;background:#160d06;box-shadow:0 4px 18px rgba(120,80,40,.22)}
.game-frame{display:block;width:100%;height:520px;border:0}
.macro-card{background:#fff;border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.macro-title{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;text-align:center;margin-bottom:14px}
.macro-bars{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.macro-col{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.macro-pct{font-size:11px;color:#a89e97;font-weight:600}
.macro-track{width:34px;height:100px;background:#f2ede6;border-radius:17px;overflow:hidden;position:relative}
.macro-fill{width:100%;height:0%;border-radius:17px;position:absolute;bottom:0;transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.macro-val{font-size:16px;font-weight:700}
.macro-lbl{font-size:11px;color:#a89e97}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pill{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(200,180,160,.1)}
.pill-val{font-size:17px;font-weight:700}
.pill-lbl{font-size:9.5px;color:#a89e97;margin-top:2px}
.wcard{background:linear-gradient(135deg,#e8f4fd,#dbeef9);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.whd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wt{font-size:13px;font-weight:700;color:#3a7ca5}
.wn{font-size:12px;color:#5b8fa8;font-weight:600}
.wb{height:6px;background:rgba(255,255,255,.5);border-radius:3px;margin-bottom:10px;overflow:hidden}
.wf{height:100%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:3px;width:0%;transition:width .6s}
.wbtns{display:flex;gap:7px}
.wadd{flex:1;background:#fff;border:none;border-radius:11px;padding:8px;font-size:12px;font-weight:700;color:#3a7ca5;cursor:pointer}
.wreset{background:rgba(255,255,255,.7);border:none;border-radius:11px;padding:8px 10px;font-size:16px;cursor:pointer}
/* Steps, mirroring the water card that sits right above it. Read-only here -
   the number is written by whatever source was connected under כושר, and
   tapping the card goes there. */
.scard{display:block;width:100%;text-align:right;font-family:inherit;border:none;cursor:pointer;background:linear-gradient(135deg,#eaf5ee,#dcf0e3);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.st{font-size:13px;font-weight:700;color:#4c9a4c}
.sn{font-size:11px;color:#6fb283;font-weight:600}
.sv{font-size:24px;font-weight:800;color:#4c9a4c;line-height:1}
.sk{font-size:11px;color:#6fb283;font-weight:600}
.sempty{font-size:12px;color:#6fb283;line-height:1.5}
.qacard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.qatog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.qalbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.qaarro{font-size:14px;color:#a89e97;transition:transform .2s}
.qalist{padding:0 10px 12px}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{flex:1;min-width:58px;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:#f2ede6;color:#a89e97}
.cat-tab.on{background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff}
.comp-meal{display:flex;align-items:center;gap:10px;background:#fbf7f2;border-radius:12px;padding:9px 10px;margin-bottom:6px}
.comp-meal-info{flex:1}
.comp-meal-name{font-size:12.5px;font-weight:700;color:#4a4340}
.comp-meal-mac{font-size:10px;color:#a89e97;margin-top:1px}
.comp-add-btn{background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.comp-del-btn{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:3px 6px;flex-shrink:0}
.new-comp-btn{width:100%;background:rgba(243,185,168,.12);border:1.5px dashed #e08a72;border-radius:12px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#e08a72;margin-top:4px}
.lbtn{width:100%;display:flex;align-items:center;gap:10px;background:#fbf7f2;border:none;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px}
.lnm{font-size:12.5px;font-weight:700;color:#4a4340}
.lmac{font-size:10px;color:#a89e97;margin-top:1px}
.ldel{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:14px;padding:4px 6px;margin-right:auto;flex-shrink:0}
.qkc{font-size:10px;font-weight:700;color:#a89e97;flex-shrink:0;text-align:left;line-height:1.3}
.confirm-card{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:14px;margin:0 0 10px;border:2px solid #c9bce0}
.confirm-name{font-size:14px;font-weight:700;color:#4a4340;margin-bottom:4px}
.confirm-mac{font-size:11px;color:#a89e97;margin-bottom:12px}
.confirm-btns{display:flex;gap:8px}
.confirm-yes{flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.confirm-no{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97}
.mtbtn{width:100%;border:none;border-radius:16px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px}
.mtbtn.cl{background:#fff;color:#a690cf;box-shadow:0 4px 14px rgba(200,180,160,.1)}
.mtbtn.op{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;border-radius:16px 16px 0 0}
.mtform{background:#fff;border-radius:0 0 16px 16px;padding:14px;box-shadow:0 4px 14px rgba(200,180,160,.1)}
.mtin{width:100%;border:1.5px solid #f2ede6;border-radius:10px;padding:10px 12px;font-size:13px;direction:rtl;outline:none;margin-bottom:10px}
.mtin:focus{border-color:#a690cf}
.mtgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mtfl{font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px;text-align:center}
.mtnm{width:100%;border:1.5px solid #f2ede6;border-radius:8px;padding:7px 4px;font-size:13px;text-align:center;outline:none}
.addbtn{width:100%;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.lib-save-btn{width:100%;background:linear-gradient(135deg,#f0eafa,#eaf5ee);border:none;border-radius:11px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#a690cf;margin-bottom:8px}
.lib-save-btn.saved{background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff}
.log-card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.08)}
.log-title{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f0eb}
.log-item:last-child{border-bottom:none}
.log-name{font-size:12px;font-weight:600;color:#4a4340}
.log-time{font-size:9.5px;color:#a89e97;margin-top:1px}
.log-kcal{font-size:13px;font-weight:700;color:#a690cf}
.log-del{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:2px 6px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.cttl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.avgbox{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.avgin{display:flex;justify-content:space-around}
.avgv{font-size:22px;font-weight:700}
.avgl{font-size:10px;color:#a89e97;margin-top:2px}
.cal-card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-mn{font-size:13px;font-weight:700}
.cal-nav{background:none;border:none;font-size:18px;cursor:pointer;color:#a89e97;padding:4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{font-size:9px;color:#a89e97;text-align:center;padding:2px 0}
.cal-d{width:100%;aspect-ratio:1;border:none;border-radius:50%;background:none;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-d.has{background:linear-gradient(135deg,#f0eafa,#e8dff5)}
.cal-d.today{font-weight:700;color:#a690cf}
.cal-d.has-photo{padding:0;overflow:hidden}
.cal-d.has-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cal-d-dot{width:4px;height:4px;background:#a690cf;border-radius:50%;margin-top:1px}
/* ── DAILY REFLECTION ──
   One question at a time, nothing else on the screen. Deliberately lighter
   than the rest of the app: no cards, no shadows, no chrome - the question
   and the answer are the whole surface. */
.rf{min-height:72vh;display:flex;flex-direction:column;padding:0 4px 30px}
.rf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 0;min-height:34px}
.rf-icon{background:none;border:none;padding:6px 8px;font-size:17px;color:#c0b8b0;cursor:pointer;font-family:inherit;line-height:1}
.rf-skip{background:none;border:none;padding:6px 4px;font-size:12px;color:#c0b8b0;cursor:pointer;font-family:inherit}
.rf-bar{flex:1;height:3px;background:#ece5da;border-radius:2px;overflow:hidden}
.rf-bar-f{height:100%;background:linear-gradient(90deg,#c9bce0,#a690cf);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rf-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px;animation:rf-in .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rf-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rf-q{font-size:25px;font-weight:800;line-height:1.35;color:#4a4340;letter-spacing:-.3px}
.rf-sub{font-size:13px;color:#a89e97;line-height:1.65;margin-top:10px}
.rf-field{margin-top:30px}
.rf-in{width:100%;border:none;border-bottom:1.5px solid #e4ddd4;background:none;padding:12px 2px;font-size:17px;line-height:1.6;color:#4a4340;direction:rtl;outline:none;resize:none;font-family:inherit;min-height:96px}
.rf-in:focus{border-bottom-color:#a690cf}
.rf-in::placeholder{color:#c9c0b8}
.rf-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;font-family:inherit;margin-top:24px}
.rf-ghost{width:100%;background:none;border:none;padding:13px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;margin-top:6px}
/* mood faces */
.rf-moods{display:flex;justify-content:space-between;gap:6px}
.rf-mood{flex:1;background:none;border:none;padding:6px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.45;transition:opacity .2s,transform .2s}
.rf-mood.on,.rf-mood:active{opacity:1;transform:scale(1.06)}
.rf-mood svg{width:46px;height:46px;fill:none;stroke-width:1.7;stroke-linecap:round}
.rf-mood-l{font-size:10.5px;font-weight:700;color:#a89e97}
.rf-mood.on .rf-mood-l{color:#4a4340}
/* chips */
.rf-chips{display:flex;flex-wrap:wrap;gap:9px}
.rf-chip{background:#fff;border:1.5px solid #ece5da;border-radius:22px;padding:11px 17px;font-size:14px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;transition:all .18s}
.rf-chip.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#7d63b8}
/* 1-10 scale */
.rf-scale{display:flex;gap:5px}
.rf-num{flex:1;aspect-ratio:1;background:#fff;border:1.5px solid #ece5da;border-radius:12px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;padding:0;transition:all .18s}
.rf-num.on{background:linear-gradient(135deg,#c9bce0,#a690cf);border-color:#a690cf;color:#fff;transform:translateY(-3px)}
.rf-echo{font-size:14px;font-weight:700;color:#a690cf;text-align:center;margin-top:20px;min-height:20px;animation:rf-in .35s ease-out}
/* ladder */
.rf-ladder{display:flex;flex-direction:column;gap:8px}
.rf-rung{width:100%;background:#fff;border:1.5px solid #ece5da;border-radius:14px;padding:15px 18px;font-size:15px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;text-align:right;transition:all .18s}
.rf-rung.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#4a4340}
/* photo */
.rf-photo-drop{border:1.5px dashed #d8cfc7;border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;background:#fdfbf8}
.rf-photo-drop svg{width:30px;height:30px;fill:none;stroke:#c0b8b0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rf-photo-wrap{position:relative}
.rf-photo-wrap img{width:100%;border-radius:20px;display:block}
.rf-photo-x{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(74,67,64,.62);border:none;color:#fff;font-size:15px;cursor:pointer;line-height:1}
/* module home */
.rf-hero{background:linear-gradient(150deg,#f5eefa,#eaf1f8);border-radius:26px;padding:24px 20px;margin-bottom:16px}
.rf-hero-t{font-size:19px;font-weight:800;color:#4a4340;line-height:1.35}
.rf-hero-s{font-size:12.5px;color:#a89e97;line-height:1.6;margin-top:7px}
.rf-day{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:0 4px 14px rgba(200,180,160,.1);cursor:pointer;text-align:right;font-family:inherit}
.rf-day-th{width:46px;height:46px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#f2ede6}
/* the deep pass, laid out like the areas on the home screen */
.rf-board{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rf-card{position:relative;border:2px solid transparent;border-radius:22px;padding:16px 13px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;font-family:inherit;transition:transform .15s,border-color .25s;overflow:hidden}
.rf-card:active{transform:scale(.97)}
.rf-card.done{border-color:#8fc79e}
.rf-card-ic{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(160,140,120,.16)}
.rf-card-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rf-card-t{font-size:13px;font-weight:800;color:#4a4340;line-height:1.3}
.rf-card-s{font-size:9.5px;color:#a89e97;line-height:1.4}
.rf-card-v{position:absolute;top:9px;left:9px;width:19px;height:19px;border-radius:50%;background:#8fc79e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
/* the day's anchors, stacked with an arrow between them */
.rf-flow{display:flex;flex-direction:column}
.rf-flow-row{display:flex;align-items:center;gap:6px}
.rf-flow-box{flex:1;min-width:0;background:#fff;border:1.5px solid #e4ddd4;border-radius:14px;padding:13px 14px;font-size:14px;color:#4a4340;font-family:inherit;outline:none;direction:rtl}
.rf-flow-box:focus{border-color:#a690cf}
.rf-flow-box::placeholder{color:#c9c0b8}
.rf-flow-x{background:none;border:none;color:#e0c4bb;font-size:16px;cursor:pointer;padding:4px 2px;flex-shrink:0;font-family:inherit}
.rf-flow-ar{text-align:center;color:#c9bce0;font-size:15px;padding:5px 0;line-height:1}
.rf-flow-add{width:100%;background:rgba(166,144,207,.08);border:1.5px dashed #c9bce0;border-radius:14px;padding:11px;font-size:12.5px;font-weight:700;color:#a690cf;cursor:pointer;font-family:inherit;margin-top:12px}
.interview{padding:20px 16px;min-height:60vh;display:flex;flex-direction:column}
.q-num{font-size:10px;color:#a89e97;letter-spacing:.1em;margin-bottom:8px}
.q-text{font-size:20px;font-weight:700;margin-bottom:24px;line-height:1.4}
.stars-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.star-btn{font-size:36px;background:none;border:none;cursor:pointer;opacity:.3;transition:opacity .15s}
.star-btn.sel{opacity:1}
.q-input{width:100%;border:1.5px solid #f2ede6;border-radius:14px;padding:14px;font-size:14px;direction:rtl;outline:none;resize:none;background:#fff;min-height:90px;font-family:inherit}
.q-input:focus{border-color:#a690cf}
.q-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:16px}
.q-skip{width:100%;background:none;border:none;padding:10px;font-size:12px;color:#a89e97;cursor:pointer}
.photo-upload-area{border:2px dashed #c9bce0;border-radius:16px;padding:30px;text-align:center;cursor:pointer;margin-bottom:10px;background:#faf7ff}
.photo-preview{width:100%;max-height:200px;object-fit:contain;border-radius:16px;margin-bottom:10px}
.summary-overlay{position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.summary-sheet{background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px;position:relative}

<script>
/* ── DEV / STABLE SPLIT ──
   Two copies of this same file are published: "/" is the stable app installed on
   the phone, "/dev/" is the live copy we iterate on. They share an origin, so by
   default they would also share localStorage - and an experiment in dev would
   scribble over a real week of data. This gives the dev copy its own namespace,
   seeded once from the real data so it opens looking lived-in.
   Inert in the stable app: everything below is behind the /dev/ path check. */
(function(){
  if(!/(^|\/)dev(\/|$)/.test(location.pathname))return;
  window.__DEV__=true;
  var raw;try{raw=window.localStorage;}catch(e){return;}
  var P='dev:',SEEDED=P+'__seeded';

  // Sandbox keys, minus the bookkeeping one - the app should never see it.
  function devKeys(){
    var a=[];
    for(var i=0;i<raw.length;i++){
      var k=raw.key(i);
      if(k&&k.indexOf(P)===0&&k!==SEEDED)a.push(k.slice(P.length));
    }
    return a;
  }
  function seed(){
    var pairs=[],i,k;
    for(i=0;i<raw.length;i++){k=raw.key(i);if(k&&k.indexOf(P)!==0)pairs.push([k,raw.getItem(k)]);}
    for(i=0;i<pairs.length;i++){try{raw.setItem(P+pairs[i][0],pairs[i][1]);}catch(e){}}
    try{raw.setItem(SEEDED,'1');}catch(e){}
  }
  try{if(raw.getItem(SEEDED)!=='1')seed();}catch(e){}

  var shim={
    getItem:function(k){return raw.getItem(P+k);},
    setItem:function(k,v){raw.setItem(P+k,v);},
    removeItem:function(k){raw.removeItem(P+k);},
    clear:function(){devKeys().forEach(function(k){raw.removeItem(P+k);});},
    key:function(i){var a=devKeys();return i<a.length?a[i]:null;},
    get length(){return devKeys().length;}
  };
  var isolated=true;
  try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return shim;}});}
  catch(e){isolated=false;}

  // Throw the sandbox away and re-copy the stable app's data. Run from the
  // console when dev has drifted too far from reality to be a useful test.
  window.__devReseed=function(){
    devKeys().forEach(function(k){raw.removeItem(P+k);});
    raw.removeItem(SEEDED);seed();location.reload();
  };

  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('div');
    b.textContent=isolated?'DEV':'DEV ⚠ shared data';
    b.style.cssText='position:fixed;top:4px;left:6px;z-index:9999;pointer-events:none;'+
      'background:'+(isolated?'#a690cf':'#c0392b')+';color:#fff;padding:4px 7px;border-radius:8px;'+
      'font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.5px;opacity:.9';
    document.body.appendChild(b);
  });
})();
</script>

/* ── STEPS ──
   Steps used to live only inside the evening summary, which meant the only way
   to record them was to finish the interview. They now get a record of their
   own that also carries WHERE the number came from, so a watch or a phone can
   write it during the day. sum_<date>.steps is still kept in step, so
   everything that already reads it - the TDEE estimate, the deficit chart, the
   summary sheet - keeps working on old days with no steps_ record at all. */
var STEPS_SRC_KEY='steps_src';
function loadSteps(d){
  try{var x=localStorage.getItem('steps_'+d);if(x)return JSON.parse(x);}catch(e){}
  var s=loadSummary(d);
  return s&&s.steps?{v:s.steps,src:'manual',at:''}:null;
}
function saveSteps(d,v,src){
  var rec={v:Math.max(0,Math.round(v))||0,src:src||'manual',at:new Date().toISOString()};
  try{localStorage.setItem('steps_'+d,JSON.stringify(rec));}catch(e){}
  var s=loadSummary(d);
  if(s){s.steps=rec.v;saveSummary(d,s);}
  return rec;
}
function stepsOf(d){var r=loadSteps(d);return r?r.v:0;}

// Which source the user set up. 'manual' until they connect something.
function loadStepsSrc(){
  try{var o=JSON.parse(localStorage.getItem(STEPS_SRC_KEY)||'null');
    if(o)return{kind:o.kind||'manual',label:o.label||'',last:o.last||''};}catch(e){}

/* ── NATIVE BRIDGE ──
   A web page has no access to HealthKit, and never will - that is Apple's
   line, not a gap in this app. The native shell this prototype is headed for
   does have it, and reaches the page through a WKWebView message handler.
   Everything Apple Health goes through this one seam: when the shell is
   present the source screen offers a real connect button, and when it is not
   it says so plainly. Nothing else in the app knows the difference. */
function nativeHealth(){
  try{
    var w=window.webkit&&window.webkit.messageHandlers;
    return(w&&w.health)?w.health:null;
  }catch(e){return null;}
}
function healthConnect(){
  var b=nativeHealth();
  if(!b){showToast('דורש את גרסת האפליקציה');return;}
  try{b.postMessage({action:'connect'});}catch(e){showToast('החיבור נכשל');}
}
// The shell calls this back with {"2026-08-30": 8412, ...} once HealthKit
// has answered. Same merge rule as every other source: it is a write, and
// the newest write for a day wins.
window.onHealthSteps=function(days){
  if(!days||typeof days!=='object')return 0;
  var n=0;
  Object.keys(days).forEach(function(d){
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&typeof days[d]==='number'){saveSteps(d,days[d],'health');n++;}
  });
  if(n){
    var s=loadStepsSrc();s.kind='health';s.last=new Date().toISOString();saveStepsSrc(s);
    showToast('✓ עודכן מ־Apple Health');
  }
  if(typeof _fitView!=='undefined'&&(_fitView==='steps'||_fitView==='steps-setup'))renderFitness();
  return n;
};

/* The token the shortcut posts alongside the step count. It is a bearer
   secret: whoever holds it can write steps for this install and nothing else.
   Generated once, on the setup screen, and never leaves the device except in
   the shortcut the user builds. */
function stepsToken(){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(/^[a-f0-9]{32}$/.test(t))return t;
  var a=new Uint8Array(16),i;
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  t='';for(i=0;i<16;i++)t+=('0'+a[i].toString(16)).slice(-2);
  try{localStorage.setItem('steps_token',t);}catch(e){}
  return t;
}

/* Pull whatever the shortcut has posted since we last looked. The newest write
   wins per day whatever wrote it, so a number typed by hand this morning is
   replaced by the watch's real count tonight - and a correction typed after
   the watch reported is not undone on the next sync. */
function syncStepsFromServer(cb){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(!SYNC_SERVER||!/^[a-f0-9]{32}$/.test(t)){if(cb)cb(false);return;}
  fetch(SYNC_SERVER+'/steps?token='+t,{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(o){
      if(!o||!o.days){if(cb)cb(false);return;}
      var changed=0;
      Object.keys(o.days).forEach(function(d){
        var remote=o.days[d];
        if(!remote||typeof remote.v!=='number')return;
        var local=loadSteps(d);
        if(local&&local.at&&remote.at&&new Date(local.at)>=new Date(remote.at))return;
        if(local&&local.v===remote.v)return;
        saveSteps(d,remote.v,'server');
        changed++;
      });
      if(changed){
        var s=loadStepsSrc();s.kind='server';s.last=new Date().toISOString();saveStepsSrc(s);
      }
      if(cb)cb(changed>0);
    })
    .catch(function(){if(cb)cb(false);});
}

function r2f(v){return Math.round(v*100)/100;}
function clockSelCat(cat){window._clockSelCat=cat;renderInterview();}
function clockSetHour(hr){
  if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
  var cat=window._clockSelCat||'sleep';
  interviewAnswers.timeclock[hr]=cat;
}

var _CLK_COLORS={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162',none:''};

function clockPtForHour(h){
  var ang=(-90+h*(720/24))*Math.PI/180;
  var r=52+(h/24)*(128-52);
  return {x:140+r*Math.cos(ang),y:145+r*Math.sin(ang),r:r};
}

function drawSumClock(clkD){
  var canvas=document.getElementById('sum-clock-canvas');if(!canvas||!clkD)return;
  var ctx=canvas.getContext('2d');
  var W=160,H=166,CX=80,CY=83,R_IN=28,R_OUT=68;
  var TC={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162'};
  ctx.clearRect(0,0,W,H);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=9;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(!clkD[i]||clkD[i]==='none'){i++;continue;}
    var col=clkD[i],st=i;
    while(i<25&&clkD[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=TC[col]||'#ccc';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor=TC[col];ctx.shadowBlur=4;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels 0,12,24
  [0,12,24].forEach(function(h){
    var ang=(-90+h*(720/24))*Math.PI/180;
    var r=R_IN+(h/24)*(R_OUT-R_IN)+12;
    ctx.fillStyle='rgba(140,133,125,.5)';ctx.font='600 7px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+r*Math.cos(ang),CY+r*Math.sin(ang));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var ang2=(-90+h*(720/24))*Math.PI/180;
    var r3=R_IN+(h/24)*(R_OUT-R_IN);
    var px=CX+r3*Math.cos(ang2),py=CY+r3*Math.sin(ang2);
    var filled=clkD[h]&&clkD[h]!=='none';
    ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);
    ctx.fillStyle=filled?(TC[clkD[h]]||'#ccc'):'rgba(160,155,150,.2)';ctx.fill();
    if(!filled){ctx.strokeStyle='rgba(160,155,150,.3)';ctx.lineWidth=.8;ctx.stroke();}
  }
}

function clockDraw(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var clk=interviewAnswers.timeclock||new Array(25).fill('none');
  var CX=140,CY=150,R_IN=52,R_OUT=128;
  ctx.clearRect(0,0,280,310);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(clk[i]==='none'){i++;continue;}
    var col=clk[i],st=i;
    while(i<25&&clk[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=_CLK_COLORS[col];ctx.lineWidth=14;ctx.lineCap='round';
    ctx.shadowColor=_CLK_COLORS[col];ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels
  [0,6,12,18,24].forEach(function(h){
    var p=clockPtForHour(h);var lr=p.r+18;
    var a=(-90+h*(720/24))*Math.PI/180;
    ctx.fillStyle='rgba(140,133,125,.55)';ctx.font='600 9px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+lr*Math.cos(a),CY+lr*Math.sin(a));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var p=clockPtForHour(h);var filled=clk[h]!=='none';
    ctx.save();ctx.translate(p.x,p.y);
    if(filled){
      var grd=ctx.createRadialGradient(0,0,3,0,0,20);
      grd.addColorStop(0,_CLK_COLORS[clk[h]]+'66');grd.addColorStop(1,_CLK_COLORS[clk[h]]+'00');
      ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fillStyle=_CLK_COLORS[clk[h]];ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
      ctx.fillStyle='rgba(160,155,150,.08)';ctx.fill();
      ctx.strokeStyle='rgba(160,155,150,.35)';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.fillStyle=filled?'rgba(0,0,0,.45)':'rgba(130,125,120,.6)';
    ctx.font='600 7px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,0,0.5);ctx.restore();
  }
}

function clockNearestHour(canvas,cx,cy){
  var rect=canvas.getBoundingClientRect();
  var sx=(cx-rect.left)*(280/rect.width),sy=(cy-rect.top)*(310/rect.height);
  var best=-1,bestD=999;
  for(var h=0;h<=24;h++){var p=clockPtForHour(h);var d=Math.hypot(sx-p.x,sy-p.y);if(d<bestD){bestD=d;best=h;}}
  return bestD<22?best:-1;
}

function clockInitDrag(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  clockDraw();
  var dragging=false;
  var CLK_LABELS={sleep:'שינה',work:'עבודה',social:'חברתי',other:'אחר'};
  function paint(e){
    var pt=e.touches?e.touches[0]:e;
    var h=clockNearestHour(canvas,pt.clientX,pt.clientY);if(h<0)return;
    var cat=window._clockSelCat||'sleep';
    if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
    if(interviewAnswers.timeclock[h]===cat)return;
    interviewAnswers.timeclock[h]=cat;clockDraw();
    var clk=interviewAnswers.timeclock;
    var cnts={sleep:0,work:0,social:0,other:0};
    for(var i=0;i<25;i++){if(cnts[clk[i]]!==undefined)cnts[clk[i]]++;}
    var statsEl=document.getElementById('clock-stats');
    if(statsEl){var sh='';Object.keys(cnts).forEach(function(k){if(cnts[k]>0)sh+='<div style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+_CLK_COLORS[k]+'">'+cnts[k]+'h</div><div style="font-size:9px;color:#a89e97">'+CLK_LABELS[k]+'</div></div>';});statsEl.innerHTML=sh;}
  }
  canvas.addEventListener('mousedown',function(e){dragging=true;paint(e);});
  canvas.addEventListener('mousemove',function(e){if(dragging)paint(e);});
  canvas.addEventListener('mouseup',function(){dragging=false;});
  canvas.addEventListener('touchstart',function(e){dragging=true;paint(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(dragging){paint(e);e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',function(){dragging=false;});
}


function addFlowStop(){

  inp.value='';renderInterview();
  setTimeout(function(){
    var i=document.getElementById('flow-inp');
    if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'center'});}
  },60);
}
function removeFlowStop(idx){
  if(Array.isArray(interviewAnswers.flow))interviewAnswers.flow.splice(idx,1);
  renderInterview();
}

function hrPos(hr,CX,CY,R_INNER,R_OUTER){
  var ang=(-90+hr*30)*Math.PI/180;
  var r=R_INNER+(hr/23)*(R_OUTER-R_INNER);
  return {x:r2f(CX+r*Math.cos(ang)),y:r2f(CY+r*Math.sin(ang)),r:r};
}

function renderHistory(){
  var histTab=window._histTab||'intake';
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var s=d.toISOString().slice(0,10);
    var day=loadDay(s);var sum=loadSummary(s);
    var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
    var p=Math.round(day.meals.reduce(function(a,m){return a+(m.p||0);},0));
    var steps=stepsOf(s);var tdee=steps>0?Math.round(2200+steps*0.04):0;
    var deficit=kcal>0&&tdee>0?tdee-kcal:0;
    var dt=new Date(s+'T12:00:00');
    days.push({date:s,kcal:kcal,p:p,deficit:deficit,label:dt.getDate()+'/'+(dt.getMonth()+1),isToday:s===todayStr()});
  }
  var active=days.filter(function(d){return d.kcal>0;});
  function makeSVG(series,refs,minV,maxV,h){
    var W=320,H=h||145,PL=40,PR=12,PT=14,PB=26,cW=W-PL-PR,cH=H-PT-PB;
    function xp(i){return PL+i*(cW/6);}function yp(v){return PT+cH*(1-(v-minV)/(maxV-minV));}
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
    for(var gi=0;gi<=4;gi++){var gv=minV+(maxV-minV)*gi/4;var gy=yp(gv);s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';}
    for(var ri=0;ri<refs.length;ri++){var r=refs[ri];if(r.v>=minV&&r.v<=maxV){var ry=yp(r.v);s+='<line x1="'+PL+'" y1="'+ry+'" x2="'+(PL+cW)+'" y2="'+ry+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}}
    for(var si=0;si<series.length;si++){var ser=series[si];if(si===0&&ser.pts.length>1){var ap='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi=1;pi<ser.pts.length;pi++)ap+=' L'+xp(ser.pts[pi].i)+','+yp(ser.pts[pi].v);ap+=' L'+xp(ser.pts[ser.pts.length-1].i)+','+(PT+cH)+' L'+xp(ser.pts[0].i)+','+(PT+cH)+' Z';s+='<path d="'+ap+'" fill="'+ser.col+'" opacity="0.15"/>';}if(ser.pts.length>1){var lp='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi2=1;pi2<ser.pts.length;pi2++)lp+=' L'+xp(ser.pts[pi2].i)+','+yp(ser.pts[pi2].v);s+='<path d="'+lp+'" fill="none" stroke="'+ser.col+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}for(var dp=0;dp<ser.pts.length;dp++)s+='<circle cx="'+xp(ser.pts[dp].i)+'" cy="'+yp(ser.pts[dp].v)+'" r="4" fill="'+ser.col+'" stroke="#fff" stroke-width="2"/>';}
    for(var di=0;di<days.length;di++)s+='<text x="'+xp(di)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="'+(days[di].isToday?'#a690cf':'#a89e97')+'" font-weight="'+(days[di].isToday?'700':'400')+'">'+days[di].label+'</text>';
    s+='</svg>';return s;
  }
  var tabs=[['intake','צריכה יומית'],['deficit','גרעון אמיתי'],['cumulative','מצטבר']];
  var tabHTML='<div style="display:flex;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px;margin-bottom:12px">';
  for(var ti=0;ti<tabs.length;ti++){var on=histTab===tabs[ti][0];tabHTML+='<button onclick="window._histTab=\''+tabs[ti][0]+'\';renderHistory()" style="flex:1;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:'+(on?'linear-gradient(135deg,#c9bce0,#a690cf)':'transparent')+';color:'+(on?'#fff':'#a89e97')+'">'+tabs[ti][1]+'</button>';}
  tabHTML+='</div>';
  var chartCard='';
  if(histTab==='intake'){
    var kp=[];for(var ix=0;ix<days.length;ix++)if(days[ix].kcal>0)kp.push({i:ix,v:days[ix].kcal});
    var ak=days.map(function(d){return d.kcal;}).filter(function(v){return v>0;}).concat([TARGETS.kcal]);
    var minK=ak.length>1?Math.max(0,Math.min.apply(null,ak)-200):0,maxK=Math.max.apply(null,ak)+200;
    chartCard='<div class="card"><div class="cttl">צריכה קלורית מול יעד</div>'+makeSVG([{pts:kp,col:'#e08a72'}],[{v:TARGETS.kcal,col:'#a690cf',lbl:'יעד '+TARGETS.kcal}],minK,maxK,150)+'<div style="display:flex;gap:14px;margin-top:8px;font-size:10px"><span style="color:#e08a72;font-weight:700">&#x25CF; קלוריות</span><span style="color:#a690cf">-- יעד '+TARGETS.kcal+'</span></div></div>';
  } else if(histTab==='deficit'){
    var dp=[];for(var ix2=0;ix2<days.length;ix2++)if(days[ix2].deficit>0)dp.push({i:ix2,v:days[ix2].deficit});
    var maxD=dp.length>0?Math.max.apply(null,dp.map(function(p){return p.v;}))+200:1500;
    chartCard='<div class="card"><div class="cttl">גרעון אמיתי יומי</div>'+(dp.length>0?makeSVG([{pts:dp,col:'#8fc79e'}],[{v:500,col:'#e8c162',lbl:'מינימום'}],0,maxD,150):'<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>')+'</div>';
  } else {
    // Cumulative — use full current month
    var now2=new Date();var y2=now2.getFullYear(),mo2=now2.getMonth();
    var daysInMo=new Date(y2,mo2+1,0).getDate();
    var cum=0;var cp2=[];
    for(var mi=1;mi<=daysInMo;mi++){
      var ms=y2+'-'+(mo2<9?'0':'')+(mo2+1)+'-'+(mi<10?'0':'')+mi;
      var mDay=loadDay(ms);var mSum=loadSummary(ms);
      var mKcal=Math.round(mDay.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
      var mSteps=stepsOf(ms);
      var mTdee=mSteps>0?Math.round(2200+mSteps*0.04):0;
      var mDef=mKcal>0&&mTdee>0?mTdee-mKcal:0;
      if(mDef>0){cum+=mDef;cp2.push({i:cp2.length,v:cum,day:mi});}
    }
    var maxC=cum>0?Math.max(cum+500,7700):7700;
    // Custom SVG for monthly (variable point count)
    function makeSVGMo(pts,refs,maxV,hh){
      var W=320,H=hh||160,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var n=Math.max(pts.length-1,1);
      function xp3(i){return PL+i*(cW/n);}
      function yp3(v){return PT+cH*(1-v/maxV);}
      var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      for(var gi2=0;gi2<=3;gi2++){var gv2=maxV*gi2/3;var gy2=yp3(gv2);s+='<line x1="'+PL+'" y1="'+gy2+'" x2="'+(PL+cW)+'" y2="'+gy2+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy2+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv2)+'</text>';}
      refs.forEach(function(r){if(r.v<=maxV){var ry2=yp3(r.v);s+='<line x1="'+PL+'" y1="'+ry2+'" x2="'+(PL+cW)+'" y2="'+ry2+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry2-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}});
      if(pts.length>1){
        var ap2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi5=1;pi5<pts.length;pi5++)ap2+=' L'+xp3(pi5)+','+yp3(pts[pi5].v);
        ap2+=' L'+xp3(pts.length-1)+','+(PT+cH)+' L'+xp3(0)+','+(PT+cH)+' Z';
        s+='<path d="'+ap2+'" fill="#8fc79e" opacity="0.15"/>';
        var lp2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi6=1;pi6<pts.length;pi6++)lp2+=' L'+xp3(pi6)+','+yp3(pts[pi6].v);
        s+='<path d="'+lp2+'" fill="none" stroke="#8fc79e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      }
      pts.forEach(function(pt,pi7){
        s+='<circle cx="'+xp3(pi7)+'" cy="'+yp3(pt.v)+'" r="3.5" fill="#8fc79e" stroke="#fff" stroke-width="2"/>';
        if(pi7===pts.length-1||pi7===0)s+='<text x="'+xp3(pi7)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+pt.day+'</text>';
      });
      s+='</svg>';return s;
    }
    var mn3=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    chartCard='<div class="card"><div class="cttl">גרעון מצטבר &mdash; '+mn3[mo2]+' '+y2+'</div>';
    if(cp2.length>0){
      chartCard+=makeSVGMo(cp2,[{v:3500,col:'#e08a72',lbl:'~0.5קג'},{v:7000,col:'#e08a72',lbl:'~1קג'}],maxC,160);
      chartCard+='<div style="display:flex;justify-content:space-around;background:linear-gradient(135deg,#eef5ee,#f0eafa);border-radius:14px;padding:12px;margin-top:10px">';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#8fc79e">'+cum.toLocaleString()+'</div><div style="font-size:9px;color:#a89e97">גרעון (קק"ל)</div></div>';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#a690cf">~'+(cum/7700).toFixed(2)+' קג</div><div style="font-size:9px;color:#a89e97">שומן שנשרף</div></div>';
      chartCard+='</div>';
    } else {
      chartCard+='<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>';
    }
    chartCard+='</div>';
  }
  var avgHTML='';
  if(active.length>0){var avgK=Math.round(active.reduce(function(a,d){return a+d.kcal;},0)/active.length);var avgP=Math.round(active.reduce(function(a,d){return a+d.p;},0)/active.length);var inT=active.filter(function(d){return d.kcal<=TARGETS.kcal;}).length;avgHTML='<div class="avgbox"><div style="font-size:10px;color:#a89e97;font-weight:700;margin-bottom:10px;letter-spacing:.1em">ממוצעים ('+active.length+' ימים)</div><div class="avgin"><div style="text-align:center"><div class="avgv" style="color:#a690cf">'+avgK+'</div><div class="avgl">קק"ל</div></div><div style="text-align:center"><div class="avgv" style="color:#e08a72">'+avgP+'g</div><div class="avgl">חלבון</div></div><div style="text-align:center"><div class="avgv" style="color:#8fc79e">'+inT+'/'+active.length+'</div><div class="avgl">ביעד</div></div></div></div>';}
  document.getElementById('content').innerHTML=tabHTML+chartCard+avgHTML;
}

function buildHomeCalHTML(){
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  var dn=['א','ב','ג','ד','ה','ו','ש'];
  var y=calMonth.getFullYear(),mo=calMonth.getMonth();
  var first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  var remData=loadReminders();

  // Build a map of dates that have reminders
  function dateHasReminder(ds){
    var all=[].concat(remData.today||[],remData.week||[],remData.month||[]);
    return all.some(function(r){return r.date===ds;});
  }

  var h='<div style="background:#fff;border-radius:22px;padding:16px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<button class="cal-nav" onclick="homeCalPrev()">&#8250;</button>';
  h+='<div style="font-size:13px;font-weight:700">'+mn[mo]+' '+y+'</div>';
  h+='<button class="cal-nav" onclick="homeCalNext()">&#8249;</button>';
  h+='</div><div class="cal-grid">';
  for(var d=0;d<7;d++)h+='<div class="cal-dh">'+dn[d]+'</div>';
  var sd=first.getDay();for(var pad=0;pad<sd;pad++)h+='<div></div>';
  for(var day=1;day<=last.getDate();day++){
    var ds=y+'-'+(mo<9?'0':'')+(mo+1)+'-'+(day<10?'0':'')+day;
    var sum=loadSummary(ds);
    var hasRem=dateHasReminder(ds);
    var isT=ds===todayStr();
    var dots='';
    if(sum)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#a690cf;margin:0 1px;display:inline-block"></div>';
    if(hasRem)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#e08a72;margin:0 1px;display:inline-block"></div>';
    var dotRow=dots?'<div style="display:flex;justify-content:center;margin-top:1px">'+dots+'</div>':'';

    if(sum&&sum.photo){
      h+='<button class="cal-d has-photo" onclick="openCalDay(\''+ds+'\')"><img src="'+sum.photo+'" alt=""></button>';
    } else {
      var cls='cal-d'+(sum?' has':'')+(isT?' today':'');
      h+='<button class="'+cls+'" onclick="openCalDay(\''+ds+'\')">';
      h+=(isT?'<strong>'+day+'</strong>':day);
      h+=dotRow;
      h+='</button>';
    }
  }
  h+='</div></div>';
  return h;
}

function homeCalPrev(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);refreshHomeCal();}
function homeCalNext(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);refreshHomeCal();}
function refreshHomeCal(){
  var el=document.getElementById('home-cal');
  if(el)el.innerHTML=buildHomeCalHTML();
}

function loadCalReminders(ds){
  var data=loadReminders();
  var all=[];
  ['today','week','month'].forEach(function(tab){
    (data[tab]||[]).forEach(function(r,idx){
      if(r.date===ds)all.push({tab:tab,idx:idx,item:r});
    });
  });
  return all;
}

function openCalDay(ds){
  var old=document.getElementById('calday-overlay');if(old)old.remove();
  var sum=loadSummary(ds);
  var calRems=loadCalReminders(ds);
  var d=new Date(ds+'T12:00:00');

  var div=document.createElement('div');

  if(sum)h+='<button onclick="closeCalDay();openSummary(\''+ds+'\')" style="background:linear-gradient(135deg,#f0eafa,#e8dff5);border:none;border-radius:12px;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;color:#a690cf">סיכום יום</button>';
  h+='</div></div>';

      h+='<div onclick="toggleCalRem(\''+r.tab+'\','+r.idx+',\''+ds+'\')" style="width:22px;height:22px;border-radius:6px;border:2px solid '+(isDone?'#8fc79e':'#c9bce0')+';background:'+(isDone?'#8fc79e':'transparent')+';cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">';
      if(isDone)h+='<span style="color:#fff;font-size:13px;font-weight:700">&#10003;</span>';
      h+='</div>';

function addCalDayItem(ds){
  var inp=document.getElementById('calday-inp');
  if(!inp||!inp.value.trim())return;
  var timeInp=document.getElementById('calday-time');
  var time=timeInp?timeInp.value:'';

  // Auto-determine scope from the date
  var today=todayStr();
  var todayDate=new Date(today+'T12:00:00');
  var itemDate=new Date(ds+'T12:00:00');
  var diffDays=Math.round((itemDate-todayDate)/(1000*60*60*24));
  var scope;
  if(diffDays===0) scope='today';
  else if(diffDays>0&&diffDays<=7) scope='week';
  else scope='month';

  var data=loadReminders();
  if(!data[scope])data[scope]=[];
  data[scope].push({text:inp.value.trim(),type:_calDayType,status:'open',date:ds,time:time});
  saveReminders(data);
  inp.value='';
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function deleteCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab])data[tab].splice(idx,1);
  saveReminders(data);
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function toggleCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab]&&data[tab][idx]){
    var cur=data[tab][idx].status||'open';
    data[tab][idx].status=cur==='done'?'open':'done';
    saveReminders(data);
  }
  closeCalDay();openCalDay(ds);
  renderReminders();
}

function coachSelectOption(id,oi){
  var q=COACH_QUESTIONS.find(function(x){return x.id===id;});
  if(q)_coachAnswers[id]=q.options[oi];
  renderFitness();
}
function coachNextStep(){
  var q=COACH_QUESTIONS[_coachStep];
  if(q.type==='text'){var inp=document.getElementById('coach-text-inp');if(inp)_coachAnswers[q.id]=inp.value.trim()||'לא';}
  if(!_coachAnswers[q.id]){showToast('בחר תשובה');return;}
  if(_coachStep<COACH_QUESTIONS.length-1){_coachStep++;renderFitness();}
  else{buildCoachPlan();}
}

function buildCoachPlan(){
  document.getElementById('content').innerHTML=
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;text-align:center;padding:40px 20px">'+
    '<div style="font-size:44px;margin-bottom:16px;animation:plane-fly 1.5s ease-in-out infinite">&#x1F9E0;</div>'+
    '<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">בונה תוכנית...</div>'+
    '<div style="font-size:13px;color:#a89e97">מנתח את המידע ובונה עבורך</div>'+
    '</div>';
  var a=_coachAnswers;
  var prompt='אתה מאמן כושר אישי. בנה תוכנית אימון שבועית מלאה בעברית:\n'+
    '- ניסיון: '+a.experience+'\n- ציוד: '+a.equipment+'\n- ימי אימון: '+a.days+'\n- מטרה: '+a.goal+'\n- זמן: '+a.session+'\n- מגבלות: '+a.limit+'\n\n'+
    'החזר JSON בלבד סלל טקסט נוסף:\n'+
    '{"summary":"תיאור קצר","daysPerWeek":"טקסט","equipment":"הציוד","days":[{"name":"שם אימון","focus":"קבוצת שריר","exercises":[{"name":"שם","sets":3,"reps":"8-12","note":"הערה"}]}]}';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var text=data.content.map(function(i){return i.text||'';}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var plan=JSON.parse(clean);
    plan.answers=a;saveCoachPlan(plan);_fitView='coach-plan';renderFitness();
  })
  .catch(function(){showToast('שגיאה בבניית התוכנית');_fitView='home';renderFitness();});
}

function createTemplateFromPlan(dayIdx){
  var plan=loadCoachPlan();if(!plan||!plan.days[dayIdx])return;

/* ── STEPS SCREEN ──
   One screen for the day's step count, whoever wrote it. A Garmin watch, an
   Apple Watch and most fitness apps all write their steps into Apple Health on
   the phone, so a single reader covers all three rather than three separate
   integrations - none of which would be reachable from a web app anyway. */
function stepsAgo(iso){
  if(!iso)return'';
  var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return'עכשיו';
  if(m<60)return'לפני '+m+' דק׳';
  var hr=Math.round(m/60);
  if(hr<24)return'לפני '+hr+' שע׳';
  return'לפני '+Math.round(hr/24)+' ימים';
}
function stepsAppURL(){return location.origin+location.pathname;}

function renderFitSteps(){
  document.getElementById('hdr-title').textContent='צעדים';
  var src=loadStepsSrc(),today=todayStr(),rec=loadSteps(today),v=rec?rec.v:0;
  var linked=src.kind!=='manual';
  var h='<div style="padding-bottom:20px">';

  h+='<div style="background:#fff;border-radius:22px;padding:22px 18px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12);text-align:center">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:12px">היום</div>';
  h+='<div style="font-size:44px;font-weight:800;color:#8fc79e;line-height:1">'+v.toLocaleString()+'</div>';
  h+='<div style="font-size:11px;color:#a89e97;margin-top:5px">צעדים</div>';
  if(v>0)h+='<div style="font-size:11px;color:#a690cf;font-weight:700;margin-top:10px">&#8776; '+Math.round(v*0.04).toLocaleString()+' קק&quot;ל נשרפו</div>';
  if(rec)h+='<div style="font-size:10px;color:#c0b8b0;margin-top:8px">'+(STEPS_SRC_NAMES[rec.src]||rec.src)+(rec.at?' &middot; '+stepsAgo(rec.at):'')+'</div>';
  else h+='<div style="font-size:10px;color:#c0b8b0;margin-top:8px">עוד לא נרשם היום</div>';
  h+='</div>';

  // Last seven days, so a missing day is visible at a glance.
  var days=[],maxV=1,i,d,k;
  for(i=6;i>=0;i--){
    d=new Date();d.setDate(d.getDate()-i);k=d.toISOString().slice(0,10);
    var dv=stepsOf(k);if(dv>maxV)maxV=dv;
    days.push({k:k,v:dv,dow:['א','ב','ג','ד','ה','ו','ש'][d.getDay()]});
  }
  h+='<div class="card"><div class="cttl">שבעת הימים האחרונים</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:5px">';
  for(i=0;i<days.length;i++){

    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">';
    h+='<div style="font-size:9px;color:#a89e97">'+(days[i].v?Math.round(days[i].v/1000)+'k':'')+'</div>';
    h+='<div style="width:100%;height:56px;background:#f2ede6;border-radius:8px;position:relative;overflow:hidden">';
    h+='<div style="position:absolute;bottom:0;width:100%;height:'+pc+'%;border-radius:8px;background:linear-gradient(180deg,'+(last?'#bfe0c7,#8fc79e':'#e4ded6,#cfc7bd')+')"></div></div>';
    h+='<div style="font-size:9.5px;font-weight:'+(last?'800':'400')+';color:'+(last?'#8fc79e':'#a89e97')+'">'+days[i].dow+'</div></div>';
  }
  h+='</div></div>';

  h+='<div class="card"><div class="cttl">עדכון ידני</div>';
  h+='<div style="display:flex;gap:8px;align-items:stretch">';
  h+='<input id="step-in" class="mtin" type="number" inputmode="numeric" placeholder="'+(v||10000)+'" style="margin-bottom:0;flex:1">';
  h+='<button onclick="saveStepsManual()" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:0 20px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;flex-shrink:0">שמור</button>';
  h+='</div></div>';

  h+='<div class="card"><div class="cttl">מקור הנתונים</div>';
  h+='<button onclick="_fitView=\'steps-setup\';renderFitness()" style="width:100%;display:flex;align-items:center;gap:12px;background:'+(linked?'linear-gradient(135deg,#eaf5ee,#d8f0e0)':'#fbf7f2')+';border:none;border-radius:14px;padding:13px 14px;cursor:pointer;text-align:right;font-family:inherit">';
  h+='<div style="width:38px;height:38px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;color:'+(linked?'#6fb283':'#a89e97')+';flex-shrink:0">';
  h+='<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 5.6h3"/></svg></div>';
  h+='<div style="flex:1;min-width:0">';
  h+='<div style="font-size:13px;font-weight:800;color:#4a4340">'+(linked?(STEPS_SRC_NAMES[src.kind]||'מחובר'):'חבר שעון או אפליקציה')+'</div>';
  h+='<div style="font-size:10.5px;color:#a89e97;margin-top:2px">'+(linked?(src.last?'סונכרן '+stepsAgo(src.last):'ממתין לסנכרון ראשון'):'גארמין, אפל וואטש, או אפליקציית כושר')+'</div>';
  h+='</div><div style="font-size:15px;color:#d8cfc7;flex-shrink:0">&#8249;</div></button>';
  h+='<button onclick="syncStepsNow()" style="width:100%;background:#f5f0eb;border:none;border-radius:12px;padding:10px;font-size:11.5px;font-weight:700;cursor:pointer;color:#a89e97;margin-top:8px;font-family:inherit">סנכרן עכשיו</button>';
  h+='</div>';

  h+='<button onclick="_fitView=\'home\';renderFitness()" style="width:100%;background:#f5f0eb;border:none;border-radius:12px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;color:#a89e97;font-family:inherit">&#8250; חזרה לכושר</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;

function copyText(t,what){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){showToast('✓ '+(what||'הטקסט')+' הועתק');},function(){showToast('לא ניתן להעתיק');});
  } else showToast('לא ניתן להעתיק');
}

/* A shortcut hands the count over by opening the app with #steps=<n> on the
   URL. The fragment never leaves the device - it is not sent to the server -
   and it is stripped from the address bar as soon as it is read. */
function ingestStepsFromLink(){
  var hash=location.hash||'';
  var m=/[#&]steps=(\d{1,7})\b/.exec(hash);
  if(!m)return;
  var dm=/[#&]d=(\d{4}-\d{2}-\d{2})\b/.exec(hash);
  var d=dm?dm[1]:todayStr(),n=parseInt(m[1],10);
  saveSteps(d,n,'shortcut');
  var s=loadStepsSrc();s.kind='shortcut';s.last=new Date().toISOString();saveStepsSrc(s);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}
  showToast('✓ נקלטו '+n.toLocaleString()+' צעדים');
}

function loadWeekPlan(){try{var x=localStorage.getItem('fit_week_plan');return x?JSON.parse(x):{} ;}catch(e){return{};}}
function saveWeekPlan(obj){try{localStorage.setItem('fit_week_plan',JSON.stringify(obj));}catch(e){}}

var _editWeekDay='w0d0';

function renderWeeklyPlan(){
  document.getElementById('hdr-title').textContent='יומן אימונים';
  var weekPlan=loadWeekPlan();
  var DAY_NAMES=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div style="font-size:15px;font-weight:800;color:#4a4340">תכנון דו שבועי</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

  for(var w=0;w<2;w++){
    h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
    h+='<div style="font-size:11px;font-weight:700;color:#a89e97;margin-bottom:10px">שבוע '+(w===0?'ראשון':'שני')+'</div>';
    for(var dw=0;dw<7;dw++){
      var dayKey='w'+w+'d'+dw;
      var entry=weekPlan[dayKey]||{type:'rest'};
      var typeInfo=WORKOUT_TYPES.find(function(t){return t.id===entry.type;})||WORKOUT_TYPES[0];
      h+='<div onclick="_editWeekDay=\''+dayKey+'\';_fitView=\'edit-week-day\';renderFitness()" style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:6px;background:'+(entry.type==='rest'?'#fbf7f2':'linear-gradient(135deg,'+typeInfo.color+'15,'+typeInfo.color+'08)')+';">';
      h+='<div style="font-size:22px;width:32px;text-align:center;flex-shrink:0">'+typeInfo.emoji+'</div>';
      h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#4a4340">'+DAY_NAMES[dw]+'</div>';
      h+='<div style="font-size:11px;color:'+typeInfo.color+';font-weight:600;margin-top:1px">'+(entry.type==='rest'?'מנוחה':typeInfo.label+(entry.label?' — '+esc(entry.label):''))+'</div></div>';
      if(entry.note)h+='<div style="font-size:10px;color:#a89e97;text-align:left;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(entry.note)+'</div>';
      h+='<div style="color:#c0b8b0;font-size:16px">&#8250;</div>';
      h+='</div>';
    }
    h+='</div>';
  }

  // Copy week 1 to week 2
  h+='<button onclick="copyWeekToWeek2()" style="width:100%;background:#f5f0eb;border:none;border-radius:14px;padding:11px;font-size:12px;font-weight:700;cursor:pointer;color:#a89e97">שכפל שבוע 1 לשבוע 2</button>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderEditWeekDay(){
  var weekPlan=loadWeekPlan();
  var entry=weekPlan[_editWeekDay]||{type:'rest',label:'',note:''};
  var dayIdx=parseInt(_editWeekDay.charAt(3));
  var weekIdx=parseInt(_editWeekDay.charAt(1));
  var DAY_NAMES=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var title=DAY_NAMES[dayIdx]+' (שבוע '+(weekIdx+1)+')';
  document.getElementById('hdr-title').textContent=title;

  var h='<div style="padding-bottom:20px">';
  h+='<div style="font-size:16px;font-weight:800;color:#4a4340;margin-bottom:16px">'+title+'</div>';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">בחר סוג אימון</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">';
  for(var ti=0;ti<WORKOUT_TYPES.length;ti++){
    var wt=WORKOUT_TYPES[ti];
    var isSel=entry.type===wt.id;
    h+='<button onclick="setWeekDayType(\''+wt.id+'\')" style="border:2px solid '+(isSel?wt.color:'#f0ebe3')+';border-radius:14px;padding:12px 6px;cursor:pointer;background:'+(isSel?wt.color+'22':'#fff')+';display:flex;flex-direction:column;align-items:center;gap:4px">';
    h+='<span style="font-size:22px">'+wt.emoji+'</span>';
    h+='<span style="font-size:11px;font-weight:700;color:'+(isSel?wt.color:'#4a4340')+'">'+wt.label+'</span>';
    h+='</button>';
  }
  h+='</div>';

  if(entry.type!=='rest'){
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">תווית / שם האימון (אופציונלי)</div>';
    h+='<input id="wday-label" class="mtin" value="'+esc(entry.label||'')+'" placeholder="למשל: רגליים, Push...">';
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">הערה (אופציונלי)</div>';
    h+='<input id="wday-note" class="mtin" value="'+esc(entry.note||'')+'" placeholder="זמן, עצימות...">';
  }

  h+='<div style="display:flex;gap:8px;margin-top:16px">';
  h+='<button onclick="saveWeekDay()" style="flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">שמור</button>';
  h+='<button onclick="_fitView=\'weekly-plan\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:14px;padding:13px 16px;font-size:13px;cursor:pointer;color:#a89e97">ביטול</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
  window._editWeekEntry=JSON.parse(JSON.stringify(entry));
}

function setWeekDayType(typeId){
  if(!window._editWeekEntry)window._editWeekEntry={type:'rest',label:'',note:''};
  window._editWeekEntry.type=typeId;
  var weekPlan=loadWeekPlan();
  weekPlan[_editWeekDay]=window._editWeekEntry;
  saveWeekPlan(weekPlan);
  renderEditWeekDay();
}

function saveWeekDay(){
  var weekPlan=loadWeekPlan();
  var entry=window._editWeekEntry||{type:'rest',label:'',note:''};
  var labelInp=document.getElementById('wday-label');
  var noteInp=document.getElementById('wday-note');
  if(labelInp)entry.label=labelInp.value.trim();
  if(noteInp)entry.note=noteInp.value.trim();
  weekPlan[_editWeekDay]=entry;
  saveWeekPlan(weekPlan);
  _fitView='weekly-plan';renderFitness();
}

function copyWeekToWeek2(){
  var weekPlan=loadWeekPlan();
  for(var d=0;d<7;d++){
    var src=weekPlan['w0d'+d];
    if(src)weekPlan['w1d'+d]=JSON.parse(JSON.stringify(src));
  }
  saveWeekPlan(weekPlan);
  renderWeeklyPlan();
  showToast('שבוע 1 הועתק לשבוע 2 &#10003;');
}

function finalizeProgramWizard(){
  var progs=loadPrograms();
  var prog={
    id:_wiz.prog.id||Date.now(),
    name:_wiz.prog.name,
    splitType:_wiz.prog.splitType,
    daysPerWeek:_wiz.prog.daysPerWeek,
    goal:_wiz.prog.goal,
    exercises:[] // flat list from all days
  };
  // Store all days' exercises flat for the view-program tracker
  var allEx=[];
  for(var di=0;di<_wiz.days.length;di++){
    var day=_wiz.days[di];
    for(var ei=0;ei<day.exercises.length;ei++){
      var ex=day.exercises[ei];

  prog.exercises=allEx;

  else progs.push(prog);

  _fitProgIdx=progs.indexOf(prog);
  showToast('✓ '+prog.name+' נשמרה!');
  _fitView='view-program';renderFitness();
}

function renderViewProgram(){
  var progs=loadPrograms();
  var prog=progs[_fitProgIdx];if(!prog){_fitView='home';renderFitness();return;}

  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div style="font-size:16px;font-weight:800;color:#4a4340">'+esc(prog.name)+'</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

  for(var ei=0;ei<prog.exercises.length;ei++){
    var ex=prog.exercises[ei];
    var exLog=loadProgLog(prog.id,ex.name);
    var lastEntry=exLog.length>0?exLog[exLog.length-1]:null;
    var pr=exLog.length>0?Math.max.apply(null,exLog.map(function(e){return e.weight;})):0;

    h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
    // Exercise header
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
    h+='<div><div style="font-size:14px;font-weight:800;color:#4a4340">'+esc(ex.name)+'</div>';
    h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+ex.sets+' סט &times; '+ex.targetReps+' חזר</div></div>';
    if(pr>0)h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:6px 10px;text-align:center"><div style="font-size:14px;font-weight:800;color:#b45309">'+pr+'kg</div><div style="font-size:8px;color:#b45309;font-weight:700">PR</div></div>';
    h+='</div>';

    // Last entry
    if(lastEntry){
      var dd=new Date(lastEntry.date);
      h+='<div style="background:#f5f0eb;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#6a6360">';
      h+='אחרון: '+lastEntry.weight+'kg &times; '+lastEntry.reps+' חזר &mdash; '+dd.getDate()+'/'+(dd.getMonth()+1);
      h+='</div>';
    }

    // Log new entry
    h+='<div style="display:flex;gap:6px;align-items:center">';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">kg</div>';
    h+='<input id="prog-w-'+ei+'" class="mtnm" type="number" step="0.5" placeholder="'+(lastEntry?lastEntry.weight:ex.baseWeight||0)+'" style="width:100%"></div>';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">חזרות</div>';
    h+='<input id="prog-r-'+ei+'" class="mtnm" type="number" placeholder="'+ex.targetReps+'" style="width:100%"></div>';
    h+='<button onclick="logProgEntry('+_fitProgIdx+','+ei+')" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;align-self:flex-end">רשום</button>';
    h+='</div>';

    // Mini history chart
    if(exLog.length>1){
      var recent=exLog.slice(-8);
      var maxW=Math.max.apply(null,recent.map(function(e){return e.weight;}));
      var minW=Math.max(0,Math.min.apply(null,recent.map(function(e){return e.weight;}))-5);
      var W=280,H=50,PL=0,PT=4,PB=14,cW=W,cH=H-PT-PB;
      var n=Math.max(recent.length-1,1);
      function xp(i){return PL+i*(cW/n);}
      function yp(v){return PT+cH*(1-(v-minW)/(maxW-minW||1));}
      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:10px">';
      if(recent.length>1){
        var lp='M'+xp(0)+','+yp(recent[0].weight);
        for(var ri=1;ri<recent.length;ri++)lp+=' L'+xp(ri)+','+yp(recent[ri].weight);
        svg+='<path d="'+lp+'" fill="none" stroke="#a690cf" stroke-width="2" stroke-linecap="round"/>';
      }
      recent.forEach(function(e,ri){
        var isPR=e.weight>=pr;
        svg+='<circle cx="'+xp(ri)+'" cy="'+yp(e.weight)+'" r="'+(isPR?5:3)+'" fill="'+(isPR?'#e8c162':'#a690cf')+'" stroke="#fff" stroke-width="1.5"/>';
        svg+='<text x="'+xp(ri)+'" y="'+(H-1)+'" text-anchor="middle" font-size="8" fill="#c0b8b0">'+e.weight+'</text>';
      });
      svg+='</svg>';
      h+=svg;
    }

    h+='</div>';
  }
  h+='</div>';
  document.getElementById('hdr-title').textContent=esc(prog.name);
  document.getElementById('content').innerHTML=h;
}

function logProgEntry(progIdx,exIdx){
  var progs=loadPrograms();var prog=progs[progIdx];
  if(!prog||!prog.exercises[exIdx])return;
  var ex=prog.exercises[exIdx];
  var wInp=document.getElementById('prog-w-'+exIdx);
  var rInp=document.getElementById('prog-r-'+exIdx);
  var weight=parseFloat(wInp&&wInp.value)||0;
  var reps=parseInt(rInp&&rInp.value)||ex.targetReps;
  if(!weight){showToast('הזן משקל');return;}
  var log=loadProgLog(prog.id,ex.name);
  log.push({date:Date.now(),weight:weight,reps:reps});
  saveProgLog(prog.id,ex.name,log);
  // Check PR
  var prevPR=log.slice(0,-1).reduce(function(m,e){return Math.max(m,e.weight);},0);
  if(weight>prevPR&&prevPR>0)showToast('&#9733; PR חדש! '+weight+'kg ב'+ex.name);
  else showToast('✓ נרשם!');
  renderViewProgram();
}

function addFitExercise(){
  var name=document.getElementById('fit-ex-name');
  var sets=document.getElementById('fit-ex-sets');
  var reps=document.getElementById('fit-ex-reps');
  if(!name||!name.value.trim())return;
  var templates=loadTemplates();
  if(_fitEditIdx<0){
    // save name first then add
    if(!templates[_fitEditIdx]){
      var nm=document.getElementById('fit-tpl-name');
      templates.push({name:nm?nm.value.trim()||'חדש':'',exercises:[]});
      _fitEditIdx=templates.length-1;
      saveTemplates(templates);
    }
  }
  if(!templates[_fitEditIdx])return;
  templates[_fitEditIdx].exercises.push({name:name.value.trim(),sets:parseInt(sets.value)||3,reps:parseInt(reps.value)||10});
  saveTemplates(templates);renderFitness();
}

function renderFitWorkout(){
  if(!_fitWorkout){_fitView='home';renderFitness();return;}
  var w=_fitWorkout;
  var ex=w.exercises[w.currentEx];
  var prs=loadPRs();
  var elapsed=Math.floor((Date.now()-w.startTime)/60000);
  var h='<div style="padding-bottom:20px">';

  // Header bar
  h+='<div style="background:linear-gradient(135deg,#fef0e8,#fae0d0);border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">';
  h+='<div><div style="font-size:14px;font-weight:800;color:#4a4340">'+esc(w.name)+'</div><div style="font-size:10px;color:#a89e97;margin-top:2px">&#9200; '+elapsed+' דקות</div></div>';
  h+='<div style="font-size:11px;color:#e08a72;font-weight:700">'+( w.currentEx+1)+' / '+w.exercises.length+'</div>';
  h+='</div>';

  // Exercise tabs
  h+='<div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px">';
  for(var ei=0;ei<w.exercises.length;ei++){
    var done=w.exercises[ei].sets.length>=w.exercises[ei].targetSets;
    var isCur=ei===w.currentEx;
    h+='<button onclick="_fitWorkout.currentEx='+ei+';renderFitness()" style="flex-shrink:0;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;background:'+(isCur?'linear-gradient(135deg,#f3b9a8,#e08a72)':(done?'#bfe0c7':'#f5f0eb'))+';color:'+(isCur||done?'#fff':'#a89e97')+'">'+esc(w.exercises[ei].name)+'</button>';
  }
  h+='</div>';

  // Current exercise
  var prKey=ex.name;
  var curPR=prs[prKey]||0;
  h+='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  h+='<div style="font-size:17px;font-weight:800;color:#4a4340">'+esc(ex.name)+'</div>';
  if(curPR>0)h+='<div style="font-size:10px;color:#e8c162;font-weight:700">PR: '+curPR+'kg</div>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#a89e97;margin-bottom:14px">'+ex.targetSets+' סטים &#215; '+ex.targetReps+' חזרות</div>';

  // Sets log
  for(var si=0;si<ex.sets.length;si++){
    var s=ex.sets[si];var isNewPR=s.weight>curPR;
    h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f5f0eb">';
    h+='<div style="font-size:11px;color:#a89e97;width:32px">סט '+(si+1)+'</div>';
    h+='<div style="font-size:14px;font-weight:700;color:#4a4340;flex:1">'+s.weight+' ק"ג &times; '+s.reps+'</div>';
    if(isNewPR)h+='<div style="font-size:9px;font-weight:700;color:#e8c162;background:#fef9e7;border-radius:6px;padding:2px 6px">PR &#9733;</div>';
    h+='<button onclick="removeSet('+si+')" style="background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:14px;padding:2px">&times;</button>';
    h+='</div>';
  }

  // Add set

function logSet(){
  if(!_fitWorkout)return;
  var w=document.getElementById('fit-w');var r=document.getElementById('fit-r');var rpeInp=document.getElementById('fit-rpe');
  var weight=parseFloat(w?w.value:0)||0;var reps=parseInt(r?r.value:0)||0;
  var rpe=rpeInp&&rpeInp.value?parseFloat(rpeInp.value):null;
  if(!reps)return;
  var ex=_fitWorkout.exercises[_fitWorkout.currentEx];
  ex.sets.push({weight:weight,reps:reps,rpe:rpe});
  // Update PR
  if(weight>0){
    var prs=loadPRs();var key=ex.name;
    if(weight>(prs[key]||0)){prs[key]=weight;savePRs(prs);showToast('&#9733; PR חדש! '+weight+'kg ב'+key);}
  }
  renderFitness();
}

function removeSet(idx){
  if(!_fitWorkout)return;
  _fitWorkout.exercises[_fitWorkout.currentEx].sets.splice(idx,1);
  renderFitness();
}

function finishWorkout(){
  if(!_fitWorkout)return;
  var w=_fitWorkout;
  var log=loadWorkoutLog();
  var entry={
    date:Date.now(),name:w.name,
    duration:Math.floor((Date.now()-w.startTime)/60000),
    exercises:w.exercises.map(function(ex){
      return{name:ex.name,targetSets:ex.targetSets,targetReps:ex.targetReps,sets:ex.sets.slice()};
    })
  };
  log.push(entry);saveWorkoutLog(log);
  _fitWorkout=null;
  _fitView='summary';
  _fitSummaryEntry=entry;
  renderFitness();
}

var _fitSummaryEntry=null;

function calcRPE(weight,reps,targetReps){
  // Rough RPE: if reps === target → ~7, more → lower, fewer → higher
  var diff=reps-targetReps;
  if(diff>=3)return 5;
  if(diff===2)return 6;
  if(diff===1)return 6.5;
  if(diff===0)return 7.5;
  if(diff===-1)return 8.5;
  if(diff<=-2)return 9.5;
  return 7;
}
