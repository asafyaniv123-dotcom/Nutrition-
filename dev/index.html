var _fitProgressEx='';

function renderFitProgress(){
  var log=loadWorkoutLog();
  var prs=loadPRs();

  // Collect all exercise names from history
  var exNames={};
  for(var i=0;i<log.length;i++){
    for(var j=0;j<log[i].exercises.length;j++){
      exNames[log[i].exercises[j].name]=true;
    }
  }
  var exList=Object.keys(exNames).sort();

  // If no exercise selected yet, pick first
  if(!_fitProgressEx&&exList.length>0)_fitProgressEx=exList[0];

  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div style="font-size:15px;font-weight:800;color:#4a4340">גרף התקדמות</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

  if(exList.length===0){
    h+='<div style="text-align:center;padding:60px 20px;color:#c0b8b0;font-size:13px">עדיין לא בצעת אימון</div>';
    h+='</div>';document.getElementById('content').innerHTML=h;return;
  }

  // PRs strip
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">PR אישיים</div>';
  var prKeys=Object.keys(prs);
  if(prKeys.length===0){h+='<div style="font-size:12px;color:#c0b8b0">עדיין אין</div>';}
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(var pi=0;pi<prKeys.length;pi++){
    h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:5px 10px;font-size:11px;font-weight:700;color:#b45309">';
    h+='&#9733; '+esc(prKeys[pi])+' &mdash; '+prs[prKeys[pi]]+'kg</div>';
  }
  h+='</div></div>';

  // Exercise selector
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:8px">בחר תרגיל</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(var ei=0;ei<exList.length;ei++){
    var isSel=_fitProgressEx===exList[ei];
    h+='<button onclick="_fitProgressEx=\''+exList[ei].replace(/'/g,'')+'\';renderFitProgress()" style="border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;background:'+(isSel?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb')+';color:'+(isSel?'#fff':'#6a6360')+'">'+esc(exList[ei])+'</button>';
  }
  h+='</div></div>';

  // Build data points for selected exercise
  if(_fitProgressEx){
    var pts=[];
    for(var li=0;li<log.length;li++){
      var entry=log[li];
      for(var exi=0;exi<entry.exercises.length;exi++){
        if(entry.exercises[exi].name===_fitProgressEx){
          var best1RM=entry.exercises[exi].sets.reduce(function(mx,s){return Math.max(mx,s.weight||0);},0);
          var totalV=entry.exercises[exi].sets.reduce(function(a,s){return a+(s.weight||0)*(s.reps||0);},0);
          if(best1RM>0||totalV>0)pts.push({date:entry.date,weight:best1RM,vol:totalV});
        }
      }
    }

    if(pts.length<2){
      h+='<div style="background:#fff;border-radius:18px;padding:24px;text-align:center;color:#c0b8b0;font-size:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">צריך לפחות 2 אימונים לגרף</div>';
    } else {
      // SVG chart
      var W=320,H=140,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var wVals=pts.map(function(p){return p.weight;});
      var minW=Math.max(0,Math.min.apply(null,wVals)-5);
      var maxW=Math.max.apply(null,wVals)+5;
      function xp2(i){return PL+i*(cW/(pts.length-1));}
      function yp2(v){return PT+cH*(1-(v-minW)/(maxW-minW));}

      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      // Grid
      for(var gi=0;gi<=3;gi++){
        var gv=minW+(maxW-minW)*gi/3;
        var gy=yp2(gv);
        svg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/>';
        svg+='<text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';
      }
      // Area
      var aPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi2=1;pi2<pts.length;pi2++)aPath+=' L'+xp2(pi2)+','+yp2(pts[pi2].weight);
      aPath+=' L'+xp2(pts.length-1)+','+(PT+cH)+' L'+xp2(0)+','+(PT+cH)+' Z';
      svg+='<path d="'+aPath+'" fill="#a690cf" opacity="0.12"/>';
      // Line
      var lPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi3=1;pi3<pts.length;pi3++)lPath+=' L'+xp2(pi3)+','+yp2(pts[pi3].weight);
      svg+='<path d="'+lPath+'" fill="none" stroke="#a690cf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      // Dots + dates
      for(var pi4=0;pi4<pts.length;pi4++){
        var dd=new Date(pts[pi4].date);
        svg+='<circle cx="'+xp2(pi4)+'" cy="'+yp2(pts[pi4].weight)+'" r="4" fill="#a690cf" stroke="#fff" stroke-width="2"/>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+dd.getDate()+'/'+(dd.getMonth()+1)+'</text>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(yp2(pts[pi4].weight)-7)+'" text-anchor="middle" font-size="8" fill="#a690cf" font-weight="700">'+pts[pi4].weight+'</text>';
      }
      svg+='</svg>';

      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1);margin-bottom:12px">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">'+esc(_fitProgressEx)+' &mdash; עליית משקל (kg)</div>';
      h+=svg;

      // Delta
      var delta=pts[pts.length-1].weight-pts[0].weight;
      var pct2=pts[0].weight>0?Math.round(delta/pts[0].weight*100):0;
      h+='<div style="display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid #f5f0eb">';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#a690cf">'+pts[0].weight+'kg</div><div style="font-size:9px;color:#a89e97">התחלה</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:'+(delta>=0?'#8fc79e':'#e08a72')+'">'+(delta>=0?'+':'')+delta+'kg</div><div style="font-size:9px;color:#a89e97">שיפור ('+pct2+'%)</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#e08a72">'+pts[pts.length-1].weight+'kg</div><div style="font-size:9px;color:#a89e97">עכשיו</div></div>';
      h+='</div></div>';

      // Volume chart
      var vVals=pts.map(function(p){return p.vol;});
      var maxV=Math.max.apply(null,vVals);
      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">נפח לפי אימון</div>';
      h+='<div style="display:flex;align-items:flex-end;gap:5px;height:60px">';
      for(var vi=0;vi<pts.length;vi++){
        var bh=maxV>0?Math.round(pts[vi].vol/maxV*52):4;
        var dd2=new Date(pts[vi].date);
        h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
        h+='<div style="font-size:8px;color:#a89e97">'+pts[vi].vol+'</div>';
        h+='<div style="width:100%;height:'+bh+'px;background:linear-gradient(180deg,#bfe0c7,#8fc79e);border-radius:4px 4px 0 0"></div>';
        h+='<div style="font-size:7px;color:#c0b8b0">'+dd2.getDate()+'/'+(dd2.getMonth()+1)+'</div>';
        h+='</div>';
      }
      h+='</div></div>';
    }
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

/* ── HABIT TRACKER ── */
function loadHabits(){try{var x=localStorage.getItem('habits_list');return x?JSON.parse(x):['שתיית מים','אימון','קריאה'];}catch(e){return[];}}
function saveHabits(arr){try{localStorage.setItem('habits_list',JSON.stringify(arr));}catch(e){}}
function loadHabitLog(){try{var x=localStorage.getItem('habits_log');return x?JSON.parse(x):{};}catch(e){return{};}}
function saveHabitLog(obj){try{localStorage.setItem('habits_log',JSON.stringify(obj));}catch(e){}}

function toggleHabitAnim(habitIdx,day,cellId){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  var nowDone=!log[key];
  log[key]=nowDone;
  saveHabitLog(log);

  // Instant visual update — animate before full re-render
  var cell=document.getElementById(cellId);
  if(cell){
    if(nowDone){
      cell.style.background='rgba(143,199,158,.12)';
      cell.style.borderColor='#6db88a';
      cell.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" style="overflow:visible">'+

        '<line x1="13" y1="3" x2="3" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:20;stroke-dashoffset:20;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) .12s forwards"/>'+

      cell.style.borderColor='#ccc7c0';

  // Full re-render after animation completes

}

function toggleHabit(habitIdx,day){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  log[key]=!log[key];
  saveHabitLog(log);
  renderHabits();
}

function addHabit(){
  var inp=document.getElementById('new-habit-inp');
  if(!inp)return;
  var name=inp.value.trim();
  if(!name)return;
  var habits=loadHabits();
  if(habits.indexOf(name)!==-1){showToast('כבר קיים');return;}
  habits.push(name);
  saveHabits(habits);
  inp.value='';
  renderHabits();
}

function deleteHabit(idx){
  var habits=loadHabits();
  habits.splice(idx,1);
  saveHabits(habits);
  renderHabits();
}

/* ── DAY SUMMARY REMINDER ── */
// Universal reminder engine: OS notification where the browser supports it,
// in-app banner everywhere else. Runs while the app is open or in a live tab.
var SUMREM_KEY='sum_reminder';
// Wording of the daily nudge - shown in the OS notification and the in-app banner alike.
var SUMREM_MSG_TITLE='Daily reflection';
var SUMREM_MSG="It's time for your daily reflection";

function loadSumRem(){try{var x=localStorage.getItem(SUMREM_KEY);var o=x?JSON.parse(x):null;if(!o)return{on:false,time:'21:00',last:''};return{on:!!o.on,time:o.time||'21:00',last:o.last||''};}catch(e){return{on:false,time:'21:00',last:''};}}
function saveSumRem(o){try{localStorage.setItem(SUMREM_KEY,JSON.stringify(o));}catch(e){}}

function nowHHMM(){var n=new Date();return ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);}

// granted | denied | default | unsupported
function sumRemPerm(){if(!('Notification' in window))return 'unsupported';return Notification.permission;}

// Registered service worker, or null. Mobile Chrome forbids the `new Notification()`
// constructor, so on a phone this registration is what makes OS notifications possible.
var _swReg=null;
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(function(r){
    _swReg=r;
    if(typeof renderSumRem==='function')renderSumRem();
    if(typeof sumRemPushSync==='function')sumRemPushSync();
  }).catch(function(){});
}

function sumRemShowOS(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  var opts={body:body,icon:'assets/logo.png',badge:'assets/logo.png',tag:'sumrem',renotify:true};
  if(_swReg&&_swReg.showNotification){
    try{_swReg.showNotification(title,opts);return true;}catch(e){}
  }
  try{
    var n=new Notification(title,opts);
    n.onclick=function(){try{window.focus();}catch(e){}n.close();sumRemGo();};
    return true;
  }catch(e){return false;}   // mobile Chrome without an active SW lands here
}

function sumRemBanner(msg){
  var old=document.getElementById('sumrem-banner');if(old)old.remove();
  var d=document.createElement('div');
  d.id='sumrem-banner';
  d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:900;display:flex;justify-content:center;padding:10px 12px;pointer-events:none';
  d.innerHTML='<div style="pointer-events:auto;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 8px 28px rgba(74,67,64,.28);width:100%;max-width:420px;display:flex;align-items:center;gap:10px">'+
    '<span style="font-size:20px;flex-shrink:0">&#x1F319;</span>'+
    '<div style="flex:1;font-size:13px;font-weight:700;line-height:1.5">'+esc(msg)+'</div>'+
    '<button onclick="sumRemGo()" style="background:#fff;color:#a690cf;border:none;border-radius:11px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0">סיכום</button>'+
    '<button onclick="sumRemDismiss()" style="background:none;border:none;color:rgba(255,255,255,.85);font-size:19px;cursor:pointer;padding:0 2px;flex-shrink:0">&times;</button>'+
  '</div>';
  document.body.appendChild(d);
}
function sumRemDismiss(){var b=document.getElementById('sumrem-banner');if(b)b.remove();}
function sumRemGo(){sumRemDismiss();enterModule('endofday');window.scrollTo(0,0);}

function sumRemFire(){
  var o=loadSumRem();
  o.last=todayStr();saveSumRem(o);
  sumRemShowOS(SUMREM_MSG_TITLE,SUMREM_MSG);
  if(!document.hidden)sumRemBanner(SUMREM_MSG);
  renderSumRem();
}

function sumRemCheck(){
  var o=loadSumRem();
  if(!o.on||!o.time)return;
  var t=todayStr();
  if(o.last===t)return;        // already fired today
  if(loadSummary(t))return;    // day already summarized - no nagging
  if(nowHHMM()>=o.time)sumRemFire();
}

function sumRemToggle(on){
  var o=loadSumRem();
  o.on=!!on;
  // Enabling after the hour already passed shouldn't fire retroactively - start tomorrow.
  o.last=(o.on&&nowHHMM()>=o.time)?todayStr():'';
  saveSumRem(o);
  if(o.on&&('Notification' in window)&&Notification.permission==='default')sumRemAsk();
  renderSumRem();
  showToast(o.on?'✓ תזכורת יומית הופעלה':'התזכורת בוטלה');
  if(o.on)sumRemCheck();
  sumRemPushSync();   // register or drop the server-side subscription
}

function sumRemSetTime(v){
  if(!v)return;
  var o=loadSumRem();
  o.time=v;
  o.last=(nowHHMM()>=v)?todayStr():'';
  saveSumRem(o);
  renderSumRem();
  showToast('✓ נקבע ל-'+v);
  sumRemPushSync();   // push the new time to the server
}

/* ── WEB PUSH ── */
// The only way a reminder arrives with the app fully closed: a server holds the
// subscription and pushes at the chosen time. Everything above still works
// without this - if PUSH_SERVER is empty the app just degrades to open-app only.
// Empty in the dev copy: a second subscription from the same phone would mean
// two notifications every evening, and dev is not the app being lived in.
// The push subscription is deliberately off in dev - one notification a night,
// not two. Steps sync has no such problem, so it addresses the server directly
// and works in both copies. They hold separate tokens, so a dev experiment
// never writes into the real app's steps.
var SYNC_SERVER='https://nutrition-push.nutrition-push.workers.dev';
var PUSH_SERVER=window.__DEV__?'':SYNC_SERVER;
var VAPID_PUBLIC='BGZWOIHQcO_gj3wDvRa78k3g7A60BDJnhckbC9W15vfgsrQeQYMXu7X6FT0RPqGZhOGjzQgtQyJ_jDktq4GuU-o';

var _pushState='idle';  // idle | ok | error

function pushSupported(){
  return !!(PUSH_SERVER && _swReg && _swReg.pushManager && 'PushManager' in window);
}

function urlB64ToUint8(s){
  var pad=new Array((4-s.length%4)%4+1).join('=');
  var raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}

function localTZ(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';}catch(e){return 'UTC';}
}

// The service worker cannot read localStorage, so leave it what a resubscribe needs.
function pushStashConfig(o){
  if(!('caches' in window))return;
  try{
    caches.open('sumrem-config').then(function(c){
      c.put('config',new Response(JSON.stringify({server:PUSH_SERVER,time:o.time,tz:localTZ()}),
        {headers:{'Content-Type':'application/json'}}));
    });
  }catch(e){}
}

function sumRemPushSync(){
  var o=loadSumRem();
  if(!pushSupported())return;
  if(!o.on){sumRemPushDrop();return;}
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  pushStashConfig(o);
  _swReg.pushManager.getSubscription().then(function(sub){
    if(sub)return sub;
    return _swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
  }).then(function(sub){
    return fetch(PUSH_SERVER+'/subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({subscription:sub.toJSON(),time:o.time,tz:localTZ()})
    });
  }).then(function(r){
    _pushState=r&&r.ok?'ok':'error';renderSumRem();
  }).catch(function(){_pushState='error';renderSumRem();});
}

function sumRemPushDrop(){
  if(!pushSupported())return;
  _swReg.pushManager.getSubscription().then(function(sub){
    if(!sub){_pushState='idle';return null;}
    var ep=sub.endpoint;
    return sub.unsubscribe().then(function(){
      return fetch(PUSH_SERVER+'/unsubscribe',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({endpoint:ep})
      });
    });
  }).then(function(){_pushState='idle';renderSumRem();}).catch(function(){});
}

function sumRemAsk(){
  if(!('Notification' in window)){showToast('הדפדפן לא תומך בהתראות מערכת');return;}

// Types: task=□, event=○, appt=△, note=·, due=⊙, important=★, reminder=!, idea=?, buy=$, birthday=⬡, work=W, study=M
// Statuses: open, done=filled, migrated=→, cancelled=×, started=/

var BJ_TYPES=[
  {id:'task',    sym:'&#9633;', label:'משימה',    sym_plain:'□'},
  {id:'event',   sym:'&#9675;', label:'אירוע',    sym_plain:'○'},
  {id:'appt',    sym:'&#9651;', label:'פגישה',    sym_plain:'△'},
  {id:'note',    sym:'&middot;',label:'הערה',     sym_plain:'·'},
  {id:'due',     sym:'&#8987;', label:'תאריך יעד', sym_plain:'⌛'},
  {id:'important',sym:'&#9733;',label:'חשוב',    sym_plain:'★'},
  {id:'reminder',sym:'!',       label:'תזכורת',  sym_plain:'!'},
  {id:'idea',    sym:'?',       label:'רעיון',    sym_plain:'?'},
  {id:'buy',     sym:'$',       label:'קנייה/תשלום', sym_plain:'$'},
  {id:'birthday',sym:'#',       label:'יום הולדת', sym_plain:'#'},
  {id:'work',    sym:'W',       label:'עבודה',    sym_plain:'W'},
  {id:'study',   sym:'M',       label:'לימוד',    sym_plain:'M'}
];

// Status cycle on tap: open → done → migrated → cancelled → started → open
var BJ_STATUSES=['open','done','migrated','cancelled','started'];

function bjSymbol(type,status){
  var t=BJ_TYPES.find(function(x){return x.id===type;})||BJ_TYPES[0];
  if(status==='done'){
    // Filled version
    if(type==='task')return '&#9632;'; // ■
    if(type==='event')return '&#9679;'; // ●
    if(type==='appt')return '&#9650;'; // ▲
    return '<span style="text-decoration:line-through">'+t.sym+'</span>';
  }
  if(status==='migrated') return t.sym+'<span style="font-size:9px">&rarr;</span>';
  if(status==='cancelled') return '<span style="text-decoration:line-through;color:#c0b8b0">'+t.sym+'</span>';
  if(status==='started') return t.sym+'<span style="font-size:9px">/</span>';
  return t.sym; // open
}

function bjTextStyle(status){
  if(status==='done')return 'color:#a89e97;text-decoration:line-through;';
  if(status==='cancelled')return 'color:#c0b8b0;text-decoration:line-through;';
  if(status==='migrated')return 'color:#a89e97;font-style:italic;';
  return 'color:#4a4340;';
}

var _newRemType='task';
var _arcPressTimer=null;
var _arcOpen=false;

function startArcPress(e){
  if(e&&e.preventDefault)e.preventDefault();
  _arcPressTimer=setTimeout(function(){openArc();},500);
}
function cancelArcPress(){
  clearTimeout(_arcPressTimer);
}
function openArc(){
  _arcOpen=true;
  var arc=document.getElementById('rem-arc');
  if(arc){arc.style.display='block';}
  // Close on tap outside
  setTimeout(function(){
    document.addEventListener('touchstart',closeArcOutside,{once:true});
    document.addEventListener('mousedown',closeArcOutside,{once:true});
  },50);
}
function closeArcOutside(e){
  var arc=document.getElementById('rem-arc');
  if(arc&&!arc.contains(e.target)){closeArc();}
}
function closeArc(){
  _arcOpen=false;
  var arc=document.getElementById('rem-arc');
  if(arc)arc.style.display='none';
}
function selectArcType(typeId){
  _newRemType=typeId;
  closeArc();
  renderReminders();
}

var _remLongPressIdx=-1;
function startRemLongPress(idx){
  _remLongPressIdx=idx;
  _longPressTimer=setTimeout(function(){openRemTypePicker(idx);},600);
}
function cancelRemLongPress(){clearTimeout(_longPressTimer);}
function openRemTypePicker(idx){
  _remLongPressIdx=idx;
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='flex';
}
function closeRemTypePicker(){
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='none';
}
function pickRemType(typeId){
  var data=loadReminders();
  if(data[_remTab]&&data[_remTab][_remLongPressIdx]){
    data[_remTab][_remLongPressIdx].type=typeId;
    saveReminders(data);
  }
  closeRemTypePicker();
  renderReminders();
}
function cycleRemStatus(idx){
  var data=loadReminders();
  if(!data[_remTab]||!data[_remTab][idx])return;
  var cur=data[_remTab][idx].status||'open';
  var next=BJ_STATUSES[(BJ_STATUSES.indexOf(cur)+1)%BJ_STATUSES.length];
  data[_remTab][idx].status=next;
  saveReminders(data);renderReminders();
}
function toggleRemLegend(){_legendOpen=!_legendOpen;renderReminders();}

function setRemTab(tab){_remTab=tab;renderReminders();}

function addReminder(){
  var inp=document.getElementById('rem-inp');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  var data=loadReminders();
  if(!data[_remTab])data[_remTab]=[];
  data[_remTab].push({text:txt,type:_newRemType||'task',status:'open'});
  saveReminders(data);inp.value='';renderReminders();
}

function deleteReminder(idx){
  var data=loadReminders();
  if(data[_remTab])data[_remTab].splice(idx,1);
  saveReminders(data);renderReminders();
}

function clearDoneReminders(){
  var data=loadReminders();
  if(data[_remTab])data[_remTab]=data[_remTab].filter(function(i){return i.status!=='done';});
  saveReminders(data);renderReminders();
}

var _editRecipePhoto='';
function handleRecipePhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=600,maxH=400;
      var scale=Math.min(maxW/img.width,maxH/img.height,1);
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      _editRecipePhoto=canvas.toDataURL('image/jpeg',0.8);
      var prev=document.getElementById('rec-photo-prev');
      if(prev){prev.outerHTML='<img src="'+_editRecipePhoto+'" id="rec-photo-prev" style="width:100%;max-height:180px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:block">';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function saveRecipe(){
  var name=document.getElementById('rec-name');
  if(!name||!name.value.trim()){showToast('נא הזן שם מתכון');return;}
  var recipes=loadRecipes();
  var rec={
    name:(name.value.trim()),
    time:(document.getElementById('rec-time')||{}).value||'',
    servings:(document.getElementById('rec-servings')||{}).value||'',
    difficulty:(document.getElementById('rec-difficulty')||{}).value||'',
    tags:(document.getElementById('rec-tags')||{}).value||'',
    ingredients:(document.getElementById('rec-ingredients')||{}).value||'',
    instructions:(document.getElementById('rec-instructions')||{}).value||'',
    notes:(document.getElementById('rec-notes')||{}).value||'',
    photo:_editRecipePhoto||''
  };
  if(_recipeIdx>=0)recipes[_recipeIdx]=rec;
  else{recipes.push(rec);_recipeIdx=recipes.length-1;}

function deleteRecipe(){

/* ── WEEKLY PLANNING ──
   The week as a table: seven day columns about a third of the screen tall,
   cut by two lines into morning, noon and evening. A task is written into the
   pool below with no day, then dragged into one of the twenty-one cells - or
   dragged back out. What was written stays legible inside the cell; tapping a
   day opens its three bands underneath for editing.

   HTML5 drag-and-drop does nothing on iOS Safari, so this is pointer events
   with a ghost that follows the finger, the same way the vision board works. */
var _wkSun=null,_wkOpen=-1,_wkDrag=null;
var WK_DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var WK_SLOTS=[['m','בוקר','06&ndash;12'],['n','צהריים','12&ndash;17'],['e','ערב','17&ndash;23']];
// Which band an exact hour from the day grid belongs to.
function wkSlotForHour(h){return h<12?'m':(h<17?'n':'e');}
// What the day screen put on this date and hour, so the week can show it too.
function wkDayItemsIn(date,slot){
  var dp=loadDPlan(date),out=[],i,it;
  for(i=0;i<dp.items.length;i++){
    it=dp.items[i];
    if(typeof it.h!=='number')continue;
    if(wkSlotForHour(it.h)!==slot)continue;
    out.push(it);
  }
  return out;
}
// Drawn from the palette the rest of the app already uses, so a coloured week
// still looks like the same app.
var WK_COLORS=[
  {k:'lav',bg:'linear-gradient(135deg,#f0eafa,#e8dff5)',dot:'#a690cf',tx:'#5b4f6b'},
  {k:'ter',bg:'linear-gradient(135deg,#fef0e8,#fae0d0)',dot:'#e08a72',tx:'#7a4f40'},
  {k:'grn',bg:'linear-gradient(135deg,#eaf5ee,#d8f0e0)',dot:'#6fb283',tx:'#3f6349'},
  {k:'blu',bg:'linear-gradient(135deg,#e8f4fd,#d6ebf7)',dot:'#3a7ca5',tx:'#2f5a73'},
  {k:'amb',bg:'linear-gradient(135deg,#fdf2e2,#f6e1c3)',dot:'#c98b3f',tx:'#6d5530'},
  {k:'gry',bg:'linear-gradient(135deg,#f0ede8,#e6e2db)',dot:'#8d847d',tx:'#57504a'},
  {k:'ros',bg:'linear-gradient(135deg,#fdeef1,#fadde3)',dot:'#e0728c',tx:'#78394a'},
  {k:'tea',bg:'linear-gradient(135deg,#e6f4f2,#d3ece8)',dot:'#4fa89b',tx:'#2f5f58'},
  {k:'ind',bg:'linear-gradient(135deg,#eceefb,#dde1f7)',dot:'#7b86d6',tx:'#454c85'},
  {k:'olv',bg:'linear-gradient(135deg,#f1f3e6,#e4e8d2)',dot:'#93a352',tx:'#545c33'},
  {k:'cly',bg:'linear-gradient(135deg,#f5ece6,#ecdcd0)',dot:'#b0805f',tx:'#6b4f3c'},
  {k:'plm',bg:'linear-gradient(135deg,#f6eaf3,#eddaea)',dot:'#b06aa8',tx:'#6b3f66'}
];
var _wkNewColor='lav',_wkPick='';
function wkColor(k){
  for(var i=0;i<WK_COLORS.length;i++)if(WK_COLORS[i].k===k)return WK_COLORS[i];
  return WK_COLORS[0];
}
function wkSwatches(onclickTpl,sel){
  var h='<div class="wk-sw">',i,c;
  for(i=0;i<WK_COLORS.length;i++){
    c=WK_COLORS[i];
    h+='<button class="wk-swatch'+(sel===c.k?' on':'')+'" style="background:'+c.dot+'" onclick="'+onclickTpl.replace('%K%',c.k)+'"></button>';
  }
  return h+'</div>';
}

function weekSunday(d){
  var x=new Date(d);
  x.setHours(12,0,0,0);
  x.setDate(x.getDate()-x.getDay());
  return x;
}
function wkKey(sun){return 'wplan_'+sun.toISOString().slice(0,10);}
function loadWeek(sun){
  try{var x=localStorage.getItem(wkKey(sun));var o=x?JSON.parse(x):null;
    return(o&&Array.isArray(o.tasks))?o:{tasks:[]};}catch(e){return{tasks:[]};}
}
function saveWeek(sun,o){try{localStorage.setItem(wkKey(sun),JSON.stringify(o));}catch(e){}}
function wkDateOf(sun,i){var d=new Date(sun);d.setDate(d.getDate()+i);return d;}
function wkStamp(d){return d.toISOString().slice(0,10);}
function wkShort(d){
  var dd=d.getDate(),mm=d.getMonth()+1;
  return (dd<10?'0':'')+dd+'/'+(mm<10?'0':'')+mm;
}
// A task placed on a day before the bands existed sits in the morning.
function wkSlotOf(t){return t.s==='n'||t.s==='e'?t.s:'m';}
function wkIn(tasks,date,slot){
  var out=[],i;
  for(i=0;i<tasks.length;i++)
    if(tasks[i].d===date&&wkSlotOf(tasks[i])===slot)out.push(tasks[i]);
  return out;
}

function renderPlanWeek(){
  if(!_wkSun)_wkSun=weekSunday(new Date());
  var wk=loadWeek(_wkSun),i,j,t;
  var today=wkStamp(new Date()),thisWeek=wkStamp(weekSunday(new Date()))===wkStamp(_wkSun);

  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_planMode=\'\';renderPlanning()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;font-family:inherit;padding:0 0 12px">&#8250; חזרה</button>';

  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h+='<button onclick="wkShift(1)" style="background:#fff;border:none;border-radius:11px;width:30px;height:30px;font-size:15px;color:#a89e97;cursor:pointer;box-shadow:0 2px 7px rgba(200,180,160,.16);font-family:inherit">&#8249;</button>';
  h+='<div style="text-align:center"><div style="font-size:14px;font-weight:800;color:#4a4340">'+(thisWeek?'השבוע':'שבוע של '+wkShort(_wkSun))+'</div>';
  h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+wkShort(_wkSun)+' &ndash; '+wkShort(wkDateOf(_wkSun,6))+'</div></div>';
  h+='<button onclick="wkShift(-1)" style="background:#fff;border:none;border-radius:11px;width:30px;height:30px;font-size:15px;color:#a89e97;cursor:pointer;box-shadow:0 2px 7px rgba(200,180,160,.16);font-family:inherit">&#8250;</button>';
  h+='</div>';

  // day names and dates, above the table
  h+='<div class="wk-head">';
  for(i=0;i<7;i++){
    var d=wkDateOf(_wkSun,i);
    h+='<div class="wk-hcell'+(wkStamp(d)===today?' today':'')+'">';
    h+='<div class="wk-dn">'+WK_DAYS[i]+'</div><div class="wk-dd">'+wkShort(d)+'</div></div>';
  }
  h+='</div>';

  // the table itself: seven columns, three bands
  // The band labels sit beside the table, not over it: overlaid they covered
  // whatever was written in the outermost column.
  h+='<div class="wk-wrap"><div class="wk-slots">';
  for(j=0;j<3;j++)h+='<div class="wk-slot-l"><span>'+WK_SLOTS[j][1]+'</span><span class="wk-slot-hrs">'+WK_SLOTS[j][2]+'</span></div>';
  h+='</div>';

/* ── the drag ── */
function wkDown(e){
  var el=e.target.closest?e.target.closest('[data-task],[data-lib]'):null;
  if(!el)return;
  if(e.target.closest('button'))return;      // × and "return" are taps, not drags
  var r=el.getBoundingClientRect();
  var g=el.cloneNode(true);
  g.className='wk-task wk-ghost';
  g.style.width=r.width+'px';
  g.style.left=r.left+'px';
  g.style.top=r.top+'px';
  document.body.appendChild(g);
  el.style.opacity='.3';
  _wkDrag={id:el.getAttribute('data-task'),lib:el.getAttribute('data-lib')||'',g:g,src:el,
           dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,sx:e.clientX,sy:e.clientY,mode:'move'};
  if(!_wkDrag.lib)trashShow();
  window.addEventListener('pointermove',wkMove);
  window.addEventListener('pointerup',wkUp);
  window.addEventListener('pointercancel',wkUp);
  e.preventDefault();
}
function wkHitCell(x,y){
  var cells=document.querySelectorAll('.wk-cell'),i,r;
  for(i=0;i<cells.length;i++){
    r=cells[i].getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return cells[i];
  }
  return null;
}
function wkOverPool(x,y){
  var p=document.getElementById('wk-pool');
  if(!p)return false;
  var r=p.getBoundingClientRect();
  return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}
function wkMove(e){
  if(!_wkDrag)return;
  _wkDrag.moved=true;
  _wkDrag.g.style.left=(e.clientX-_wkDrag.dx)+'px';
  _wkDrag.g.style.top=(e.clientY-_wkDrag.dy)+'px';
  dragEdgeScroll(e.clientX,e.clientY,wkMove);
  if(!_wkDrag.lib)swipeMark(_wkDrag,swipeArmed(_wkDrag,e),'מחק');
  var hit=wkHitCell(e.clientX,e.clientY),cells=document.querySelectorAll('.wk-cell'),i;
  for(i=0;i<cells.length;i++)cells[i].classList.toggle('hot',cells[i]===hit);
  var p=document.getElementById('wk-pool');
  if(p)p.classList.toggle('hot',!hit&&wkOverPool(e.clientX,e.clientY));
}
function wkUp(e){
  if(!_wkDrag)return;
  dragScrollStop();
  var hit=wkHitCell(e.clientX,e.clientY);
  var onPool=!hit&&wkOverPool(e.clientX,e.clientY);
  try{_wkDrag.g.remove();}catch(err){}
  if(_wkDrag.src)_wkDrag.src.style.opacity='';
  window.removeEventListener('pointermove',wkMove);
  window.removeEventListener('pointerup',wkUp);
  window.removeEventListener('pointercancel',wkUp);
  var id=_wkDrag.id,moved=_wkDrag.moved,lib=_wkDrag.lib,swiped=_wkDrag.swiping;
  _wkDrag=null;
  if(swiped&&!lib){wkDel(id);return;}
  if(!moved)return;                          // a tap, not a drop
  if(lib){if(hit)wkFromLib(lib,hit.getAttribute('data-date'),hit.getAttribute('data-slot'));else renderPlanWeek();return;}
  if(hit)wkAssign(id,hit.getAttribute('data-date'),hit.getAttribute('data-slot'));
  else if(onPool)wkAssign(id,'','');
  else renderPlanWeek();                     // dropped nowhere: put it back
}

/* ── THE DAY GRID ──
   One day, hour by hour, reached from a day in the week. Two things land in
   it: whatever the week put on this date, and items written here for this day
   only.

   The flow is one way on purpose. A week task keeps living in the week record
   and is never rewritten from here - the hour it is given is stored on the
   day, as an override keyed by task id - and an item written here never
   appears in the week table. So the week stays a week and does not fill up
   with the detail of seven days. */
var _dpDate='',_dpNewColor='lav',_dpPick='',_dpDrag=null,_dpDetail='';
var DP_ROW_H=44;   // one hour of the grid, in pixels - see .dp-row min-height
var DP_FROM=6,DP_TO=23;

function dpKey(date){return 'dplan_'+date;}
function loadDPlan(date){
  try{var x=localStorage.getItem(dpKey(date));var o=x?JSON.parse(x):null;
    if(o&&Array.isArray(o.items))return{items:o.items,hours:o.hours||{},mins:o.mins||{},ends:o.ends||{},notes:o.notes||{},rem:o.rem||{}};}catch(e){}
  return{items:[],hours:{},mins:{},ends:{},notes:{},rem:{}};
}
function saveDPlan(date,o){try{localStorage.setItem(dpKey(date),JSON.stringify(o));}catch(e){}}

// Everything on this day, from both sources, in one shape.
function dpAll(date){
  var dp=loadDPlan(date),out=[],i;
  var wk=loadWeek(weekSunday(new Date(date+'T12:00:00')));
  for(i=0;i<wk.tasks.length;i++){
    if(wk.tasks[i].d!==date)continue;
    var hv=dp.hours[wk.tasks[i].id];
    out.push({id:wk.tasks[i].id,w:wk.tasks[i].w,c:wk.tasks[i].c,
              hour:(typeof hv==='number'?hv:null),min:dp.mins[wk.tasks[i].id]||0,end:dp.ends[wk.tasks[i].id]||0,src:'week',slot:wkSlotOf(wk.tasks[i])});
  }
  // whatever the month put on this date arrives the same way the week's does
  var mt=moTasksOn(date);
  for(i=0;i<mt.length;i++){
    var mh=dp.hours[mt[i].id];
    out.push({id:mt[i].id,w:mt[i].w,c:mt[i].c,
              hour:(typeof mh==='number'?mh:null),min:dp.mins[mt[i].id]||0,end:dp.ends[mt[i].id]||0,src:'month'});
  }
  for(i=0;i<dp.items.length;i++)
    out.push({id:dp.items[i].id,w:dp.items[i].w,c:dp.items[i].c,n:dp.items[i].n||'',
              hour:(typeof dp.items[i].h==='number'?dp.items[i].h:null),min:dp.items[i].mn||0,end:dp.items[i].e||0,src:'day'});
  return out;
}
// A note on a week task lives on the day, like its hour, so the week record
// is never written from here.
function dpNoteOf(id){
  var dp=loadDPlan(_dpDate),i;
  for(i=0;i<dp.items.length;i++)if(dp.items[i].id===id)return dp.items[i].n||'';
  return (dp.notes&&dp.notes[id])||'';
}
function dpFind(id){
  var all=dpAll(_dpDate),i;
  for(i=0;i<all.length;i++)if(all[i].id===id)return all[i];
  return null;
}
/* ── A REMINDER ON A TASK ──
   Stored as minutes before the task rather than a clock time, so moving the
   task to a different hour carries its reminder with it instead of leaving a
   stale alarm behind. The absolute moment is worked out at check time from
   the same dpAll() the grid is drawn from, which means the reminder can never
   disagree with what is on screen.

   Like the hour and the note, a reminder on a week or month task lives on the
   day record. The week is still never written from here.

   A fired reminder is recorded per date and id, so a phone left open all
   evening does not get the same nudge every twenty seconds, and a task whose
   time is moved forward can legitimately fire again. */
var DP_REM_CHOICES=[
  {m:0,  t:'בזמן'},
  {m:5,  t:'5 דק׳ לפני'},
  {m:10, t:'10 דק׳ לפני'},
  {m:15, t:'רבע שעה'},
  {m:30, t:'חצי שעה'},
  {m:60, t:'שעה לפני'}
];
function dpRemOf(id,date){
  var dp=loadDPlan(date||_dpDate);
  if(!dp.rem)return null;
  var v=dp.rem[id];
  return (typeof v==='number')?v:null;
}
function dpSetRem(id,m){
  var dp=loadDPlan(_dpDate);
  if(!dp.rem)dp.rem={};
  if(m===null||dpRemOf(id)===m)delete dp.rem[id];
  else dp.rem[id]=m;
  saveDPlan(_dpDate,dp);
  renderDpSheet();
}
function dpRemFiredKey(date,id){return 'dprem_'+date+'_'+id;}
function dpRemCheck(){
  var date=todayStr(),dp=loadDPlan(date);
  if(!dp.rem)return;
  var all=dpAll(date),i,t,off,due,now=nowHHMM();
  for(i=0;i<all.length;i++){
    t=all[i];
    if(t.hour===null)continue;
    off=dp.rem[t.id];
    if(typeof off!=='number')continue;
    due=t.hour*60+(t.min||0)-off;
    if(due<0)continue;
    var hh=Math.floor(due/60),mm=due%60;
    var at=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
    if(now<at)continue;
    // more than two hours late is a phone that was off, not a reminder
    var lateBy=(parseInt(now.slice(0,2),10)*60+parseInt(now.slice(3),10))-due;
    if(lateBy>120)continue;
    var k=dpRemFiredKey(date,t.id);
    var was=null;try{was=localStorage.getItem(k);}catch(e){}
    if(was===String(due))continue;
    try{localStorage.setItem(k,String(due));}catch(e){}
    dpRemFire(t,off);
  }
}
function dpRemFire(t,off){
  var when=dpHM(t.hour,t.min||0);
  var body=off?(t.w+' &mdash; בעוד '+off+' דק׳ ('+when+')'):(t.w+' &mdash; עכשיו ('+when+')');
  var plain=body.replace(/&mdash;/g,'—');
  sumRemShowOS('תכנון זמן',plain);
  if(!document.hidden)showToast('⏰ '+t.w);
}
setInterval(dpRemCheck,20000);
function dpOpenDetail(id){_dpDetail=id;renderDpSheet();}
function dpCloseDetail(save){
  if(save&&_dpDetail){
    var t=document.getElementById('dp-d-title'),n=document.getElementById('dp-d-note');
    var dp=loadDPlan(_dpDate),i,found=false;
    for(i=0;i<dp.items.length;i++)if(dp.items[i].id===_dpDetail){
      if(t&&t.value.trim())dp.items[i].w=t.value.trim();
      if(n)dp.items[i].n=n.value.trim();
      found=true;
    }
    if(!found){                       // a week task: only the note is ours
      if(!dp.notes)dp.notes={};
      if(n)dp.notes[_dpDetail]=n.value.trim();
    }
    saveDPlan(_dpDate,dp);
  }
  _dpDetail='';
  document.body.classList.remove('sheet-open');
  var ov=document.getElementById('dp-sheet');
  if(ov)ov.remove();
  renderPlanDay();
}
function dpRemHTML(t){
  var h='<div style="font-size:10px;letter-spacing:.1em;font-weight:700;color:#a89e97;margin:18px 0 8px">תזכורת</div>';
  if(t.hour===null)
    return h+'<div style="font-size:11.5px;color:#c0b6ae;line-height:1.6">גרור את המשימה לשעה כדי שאפשר יהיה להזכיר לך עליה.</div>';
  var cur=dpRemOf(t.id),i,o;

  for(i=0;i<DP_REM_CHOICES.length;i++){
    o=DP_REM_CHOICES[i];
    h+='<button class="dp-rem-b'+(cur===o.m?' on':'')+'" onclick="dpSetRem(&quot;'+t.id+'&quot;,'+o.m+')">'+o.t+'</button>';

    if(('Notification' in window)&&Notification.permission!=='granted')

  }
  return h;
}
function renderDpSheet(){
  var t=dpFind(_dpDetail);
  if(!t)return;
  var note=dpNoteOf(t.id),c=wkColor(t.c);
  var old=document.getElementById('dp-sheet');if(old)old.remove();
  var h='<div class="summary-overlay" id="dp-sheet" onclick="if(event.target===this)dpCloseDetail(true)">';
  // the Better/Me bar is hidden while this is open, so the sheet only has
  // to clear the home indicator - 104px of padding pushed the save button
  // back off the bottom of the screen it had just been rescued from
  h+='<div class="summary-sheet" style="padding-bottom:calc(30px + env(safe-area-inset-bottom))"><div class="summary-pull"></div>';
  h+='<button class="summary-close" onclick="dpCloseDetail(true)">&times;</button>';
  h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">';
  h+='<span style="width:13px;height:13px;border-radius:50%;background:'+c.dot+';flex-shrink:0"></span>';
  h+='<div style="font-size:10px;letter-spacing:.1em;font-weight:700;color:#a89e97">'+(t.hour!==null?dpHH(t.hour):'ללא שעה')+(t.src!=='day'?' &middot; '+(t.src==='month'?'מהחודש':'מהשבוע'):'')+'</div></div>';
  if(t.src==='day')
    h+='<input id="dp-d-title" class="mtin" style="font-size:16px;font-weight:800" value="'+esc(t.w)+'">';
  else
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:12px">'+esc(t.w)+'</div>';
  h+='<div style="font-size:10px;letter-spacing:.1em;font-weight:700;color:#a89e97;margin:6px 0 8px">פרטים שחשוב לזכור</div>';
  h+='<textarea id="dp-d-note" class="q-input" style="min-height:120px" placeholder="מה צריך להביא, עם מי, מה להגיד, מה לא לשכוח...">'+esc(note)+'</textarea>';
  if(t.src==='day')h+='<div style="margin-top:14px">'+wkSwatches("dpSetColor('"+t.id+"','%K%');renderDpSheet()",t.c||'lav')+'</div>';

function dpAssign(id,hour,min){
  min=min||0;
  var dp=loadDPlan(_dpDate),i,found=false;
  for(i=0;i<dp.items.length;i++)if(dp.items[i].id===id){
    if(hour===null){delete dp.items[i].h;delete dp.items[i].mn;}
    else{dp.items[i].h=hour;if(min)dp.items[i].mn=min;else delete dp.items[i].mn;}
    found=true;
  }
  if(!found){                      // a week or month task: the time lives here
    if(hour===null){delete dp.hours[id];delete dp.mins[id];}
    else{dp.hours[id]=hour;if(min)dp.mins[id]=min;else delete dp.mins[id];}
  }
  saveDPlan(_dpDate,dp);renderPlanDay();

/* ── THE SIDE RAIL ──
   Writing lives at the bottom of the screen, which means scrolling away from
   the grid to add anything. This pins a "+" and the unplaced tasks to the edge
   of the viewport, so a task can be written and dragged onto an hour without
   ever leaving the hours. It lives outside #content so a re-render cannot take
   it out from under a finger mid-drag. */
var _dpRailOpen=false,_dpRailText='',_dpRailWasOpen=false;
function dpRail(){
  dpRailClear();          // the panel is a sibling, not a child - clear both
  if(_planMode!=='day')return;
  var loose=[],all=dpAll(_dpDate),i;
  for(i=0;i<all.length;i++)if(all[i].hour===null&&all[i].src==='day')loose.push(all[i]);

  var h='<div id="dp-rail" class="dp-rail">';
  h+='<button class="dp-rail-add" onclick="dpRailToggle()">'+(_dpRailOpen?'&times;':'+')+'</button>';
  for(i=0;i<loose.length&&i<5;i++){
    var c=wkColor(loose[i].c);
    h+='<div class="dp-rail-chip" data-task="'+loose[i].id+'" style="background:'+c.bg+';color:'+c.tx+'" title="'+esc(loose[i].w)+'">'+esc(loose[i].w)+'</div>';
  }
  h+='</div>';
  if(_dpRailOpen){
    /* Beside the button rather than down at the foot of the screen: the point
       of the rail is not having to travel, and a panel at the bottom is the
       same journey again. */
    var lib=loadTaskLib();
    h+='<div id="dp-rail-bar" class="dp-rail-bar">';
    h+='<div style="display:flex;gap:7px">';
    h+='<input id="dp-rail-in" class="mtin" style="flex:1;margin-bottom:0;font-size:13px" placeholder="משימה חדשה" value="'+esc(_dpRailText)+'" oninput="_dpRailText=this.value" onkeydown="if(event.key===\'Enter\')dpRailAdd()">';
    h+='<button onclick="dpRailAdd()" style="background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:11px;padding:0 14px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;flex-shrink:0;font-family:inherit">+</button>';
    h+='</div>';
    if(lib.length){
      h+='<div style="font-size:9.5px;letter-spacing:.08em;font-weight:700;color:#a89e97;margin:11px 0 7px">משימות חוזרות</div>';
      h+='<div class="dp-rail-lib">';
      for(i=0;i<lib.length;i++){
        var lc=wkColor(lib[i].c);
        h+='<div class="dp-rail-libchip" data-lib="'+lib[i].id+'" style="background:'+lc.bg+';color:'+lc.tx+'">'+esc(lib[i].w)+'</div>';
      }
      h+='</div>';
      h+='<div style="font-size:9px;color:#c0b8b0;line-height:1.5;margin-top:8px">גרור אחת מהן ישר לשעה</div>';
    }

  }
  document.body.insertAdjacentHTML('beforeend',h);
  var rail=document.getElementById('dp-rail');
  rail.removeEventListener('pointerdown',dpDown);
  rail.addEventListener('pointerdown',dpDown);
  var bar=document.getElementById('dp-rail-bar');
  if(bar){bar.removeEventListener('pointerdown',dpDown);bar.addEventListener('pointerdown',dpDown);}
  document.removeEventListener('pointerdown',dpRailOutside,true);
  if(_dpRailOpen)document.addEventListener('pointerdown',dpRailOutside,true);
  if(_dpRailOpen&&!_dpRailWasOpen)
    setTimeout(function(){var e=document.getElementById('dp-rail-in');if(e)e.focus();},40);
  _dpRailWasOpen=_dpRailOpen;
}
/* Asked for: a tap anywhere else puts the panel away. It listens only
   while the panel is open, and ignores taps on the panel, on the rail, or
   on the button itself - that one already toggles. Capture phase, so it
   still hears the tap when something below stops it propagating. */
function dpRailOutside(e){
  if(!_dpRailOpen)return;

  _dpRailOpen=false;_dpRailText='';dpRail();
}
function dpRailToggle(){

function dpRailAdd(){

                 w:el.value.trim(),c:_dpNewColor});

  el.value='';_dpRailText='';   // or the rebuild puts the draft straight back
  renderPlanDay();

}
function dpRailClear(){

/* The deeper answers live in plan_history keyed by the day, the same store
   the planning journal reads, and are written as they are given rather than
   at the end of a flow. */
function deepGet(){return planForDate(_dpDate)||{};}
function deepSave(patch){
  var hist=loadPlanHistory(),out=[],rec=null,i,k;
  for(i=0;i<hist.length;i++){
    if(hist[i].forDate===_dpDate)rec=hist[i];else out.push(hist[i]);
  }
  rec=rec||{forDate:_dpDate};
  for(k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))rec[k]=patch[k];

}
// Typed text is read straight off the screen, so nothing is lost when a chip
// or a reminder triggers a re-render.
function deepSaveText(){
  var a=document.getElementById('dp-intent'),b=document.getElementById('dp-blocker');
  if(!a&&!b)return;
  deepSave({intent:a?a.value.trim():(deepGet().intent||''),
            blocker:b?b.value.trim():(deepGet().blocker||'')});
}
function deepToggleFeeling(f){
  deepSaveText();
  var cur=(deepGet().feeling||'').split(',').filter(function(x){return x;});
  var i=cur.indexOf(f);
  if(i>=0)cur.splice(i,1);else cur.push(f);
  deepSave({feeling:cur.join(',')});
  renderPlanDay();
}
function deepAddRemember(){
  var el=document.getElementById('dp-rem');
  if(!el||!el.value.trim())return;
  deepSaveText();
  var list=(Array.isArray(deepGet().reminders)?deepGet().reminders:[]).slice();
  list.push(el.value.trim());
  deepSave({reminders:list});
  renderPlanDay();
  setTimeout(function(){var e=document.getElementById('dp-rem');if(e)e.focus();},40);
}
function deepDelRemember(i){
  deepSaveText();
  var list=(Array.isArray(deepGet().reminders)?deepGet().reminders:[]).slice();
  list.splice(i,1);
  deepSave({reminders:list});
  renderPlanDay();
}

/* ── the drag ── */
function dpDown(e){
  var el=e.target.closest?e.target.closest('[data-task],[data-lib]'):null;
  if(!el)return;
  if(e.target.closest('button'))return;
  var r=el.getBoundingClientRect();
  var g=el.cloneNode(true);
  g.className=el.className+' wk-ghost';
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  el.style.opacity='.3';
  _dpDrag={id:el.getAttribute('data-task'),lib:el.getAttribute('data-lib')||'',g:g,src:el,
           dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,
           // only a chip already sitting on an hour can be given an end time
           sx:e.clientX,sy:e.clientY,
           canEnd:el.classList.contains('dp-chip'),mode:'move'};
  if(!_dpDrag.lib)trashShow();
  window.addEventListener('pointermove',dpMove);
  window.addEventListener('pointerup',dpUp);
  window.addEventListener('pointercancel',dpUp);
  e.preventDefault();
}
function dpHitSlot(x,y){
  var s=document.querySelectorAll('.dp-slot'),i,r;
  for(i=0;i<s.length;i++){
    r=s[i].getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return s[i];
  }
  return null;
}
function dpOverPools(x,y){
  var ids=['dp-pool','dp-week'],i,el,r;
  for(i=0;i<ids.length;i++){
    el=document.getElementById(ids[i]);
    if(!el)continue;
    r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return true;
  }
  return false;
}
function dpMove(e){
  if(!_dpDrag)return;
  _dpDrag.moved=true;
  _dpDrag.g.style.left=(e.clientX-_dpDrag.dx)+'px';
  _dpDrag.g.style.top=(e.clientY-_dpDrag.dy)+'px';
  dragEdgeScroll(e.clientX,e.clientY,dpMove);
  /* Sliding onto the hour column turns the gesture into "how long does this
     run", and it stays that way - the finger is already off the task, so
     switching back mid-pull would be a surprise. */
  if(_dpDrag.mode==='move'&&_dpDrag.canEnd&&dpHitHourLabel(e.clientX,e.clientY)){
    _dpDrag.mode='end';
    _dpDrag.g.classList.add('dp-ghost-end');trashHide();
    dpCloseFine();_dpDrag.lastHit=null;clearTimeout(_dpDrag.holdT);
  }
  if(_dpDrag.mode==='end'){dpMoveEnd(e);return;}
  if(!_dpDrag.lib){
    var f=dpFind(_dpDrag.id);
    swipeMark(_dpDrag,swipeArmed(_dpDrag,e),(f&&f.src!=='day')?'הסר מהיום':'מחק');
  }

  var hit=dpHitSlot(e.clientX,e.clientY),s=document.querySelectorAll('.dp-slot'),i;
  for(i=0;i<s.length;i++)s[i].classList.toggle('hot',s[i]===hit);

  // Leaving an hour cancels the wait and folds it back up; staying opens it.
  if(hit!==_dpDrag.lastHit){
    _dpDrag.lastHit=hit;
    clearTimeout(_dpDrag.holdT);
    dpCloseFine();
    if(hit)_dpDrag.holdT=setTimeout(function(){
      if(_dpDrag&&_dpDrag.lastHit===hit)dpOpenFine(hit);
    },DP_HOLD);
  }
  var fb=dpHitFine(e.clientX,e.clientY),all=document.querySelectorAll('.dp-fine-b');
  for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fb);
}
/* Pulling down the hour column marks out how far the task runs. Waiting on an
   hour opens the same five-minute steps, so the end can be exact too. */
function dpMoveEnd(e){
  var t=dpFind(_dpDrag.id);
  if(!t||t.hour===null)return;
  var lbl=dpHitHourLabel(e.clientX,e.clientY);
  var fineB=dpHitFine(e.clientX,e.clientY),i;
  var all=document.querySelectorAll('.dp-fine-b');
  var rows=document.querySelectorAll('.dp-row'),startM=dpMins(t);
  var upto=fineB?parseInt(fineB.getAttribute('data-hour'),10)
                :(lbl?parseInt(lbl.getAttribute('data-hour'),10):null);
  for(i=0;i<rows.length;i++){
    var rh=parseInt(rows[i].getAttribute('data-hrow'),10);
    rows[i].classList.toggle('reach',upto!==null&&rh>=t.hour&&rh<=upto);
  }
  /* Getting from the hour column to the steps takes the finger across gaps
     that belong to neither, and the row grows when they open, moving
     everything under it. So once they are open only a deliberate move to a
     different hour closes them - never a wobble on the way. */
  var openRow=document.querySelector('.dp-slot.fine');
  var leavingForAnother=lbl&&openRow&&lbl.parentElement!==openRow.parentElement;
  if(openRow&&!leavingForAnother){
    for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fineB);
    return;
  }
  if(!fineB&&lbl!==_dpDrag.lastLbl){
    _dpDrag.lastLbl=lbl;
    clearTimeout(_dpDrag.holdT);
    dpCloseFine();
    // no point offering minutes in an hour that ends before the task starts
    if(lbl&&parseInt(lbl.getAttribute('data-hour'),10)*60+59>startM){
      _dpDrag.holdT=setTimeout(function(){
        if(_dpDrag&&_dpDrag.lastLbl===lbl){
          var row=lbl.parentElement;
          dpOpenFine(row.querySelector('.dp-slot'));
        }
      },DP_HOLD);
    }
  }
  for(i=0;i<all.length;i++)all[i].classList.toggle('on',all[i]===fineB);
}
function dpClearReach(){
  var r=document.querySelectorAll('.dp-row'),i;
  for(i=0;i<r.length;i++)r[i].classList.remove('reach');
}

function dpUp(e){
  if(!_dpDrag)return;
  dragScrollStop();
  clearTimeout(_dpDrag.holdT);
  if(_dpDrag.mode==='end'){
    var t=dpFind(_dpDrag.id);
    var fb=dpHitFine(e.clientX,e.clientY),lb=dpHitHourLabel(e.clientX,e.clientY);
    var mins=fb?parseInt(fb.getAttribute('data-hour'),10)*60+parseInt(fb.getAttribute('data-min'),10)
               :(lb?parseInt(lb.getAttribute('data-hour'),10)*60:null);
    try{_dpDrag.g.remove();}catch(err){}
    if(_dpDrag.src)_dpDrag.src.style.opacity='';
    window.removeEventListener('pointermove',dpMove);
    window.removeEventListener('pointerup',dpUp);
    window.removeEventListener('pointercancel',dpUp);
    var eid=_dpDrag.id;_dpDrag=null;
    dpCloseFine();dpClearReach();
    // an end at or before the start is no end at all
    if(mins!==null&&t&&mins>dpMins(t))dpSetEnd(eid,mins);
    else renderPlanDay();
    return;
  }
  // A release on an opened five-minute step wins over the hour behind it.
  var fine=dpHitFine(e.clientX,e.clientY);
  var fineH=fine?parseInt(fine.getAttribute('data-hour'),10):null;
  var fineM=fine?parseInt(fine.getAttribute('data-min'),10):0;
  dpCloseFine();
  var hit=dpHitSlot(e.clientX,e.clientY);
  var onPool=!hit&&!fine&&dpOverPools(e.clientX,e.clientY);
  try{_dpDrag.g.remove();}catch(err){}
  if(_dpDrag.src)_dpDrag.src.style.opacity='';
  window.removeEventListener('pointermove',dpMove);
  window.removeEventListener('pointerup',dpUp);
  window.removeEventListener('pointercancel',dpUp);
  var id=_dpDrag.id,moved=_dpDrag.moved,lib=_dpDrag.lib,swiped=_dpDrag.swiping;
  _dpDrag=null;
  if(swiped&&!lib){
    var ft=dpFind(id);
    if(ft&&ft.src==='day')dpDel(id);else dpAssign(id,null,0);
    return;
  }
  if(lib){
    if(moved&&fine)dpFromLib(lib,fineH,fineM);
    else if(moved&&hit)dpFromLib(lib,parseInt(hit.getAttribute('data-hour'),10),0);
    else if(moved&&onPool)dpFromLib(lib,null,0);
    else renderPlanDay();
    return;
  }
  if(!moved){dpOpenDetail(id);return;}          // a tap opens the task
  if(fine)dpAssign(id,fineH,fineM);
  else if(hit)dpAssign(id,parseInt(hit.getAttribute('data-hour'),10),0);
  else if(onPool)dpAssign(id,null);
  else renderPlanDay();
}

/* ── SWIPE LEFT TO REMOVE ──
   A flick to the left, mostly sideways, is not somebody aiming at a slot.
   Past the threshold the drag turns into a removal and says which kind it is:
   a task that belongs to this screen is deleted, one shown here but owned by
   the week or the month only loses its place - deleting someone else's record
   from a screen that is merely displaying it would be wrong. */
/* The strip the swipe aims at. One element for all three planners, built on
   first use. Hiding is wired to pointerup/pointercancel in the capture phase
   rather than to each planner's own release path, so no exit - a drop, a
   cancel, a gesture the browser takes over - can leave it stranded on screen. */
var _trash=null;
function trashBar(){
  if(_trash)return _trash;
  _trash=document.createElement('div');
  _trash.className='swipe-trash';
  _trash.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 4.2h4"/>'+
    '<path d="M6.2 7l.9 12.1A1.9 1.9 0 0 0 9 21h6a1.9 1.9 0 0 0 1.9-1.9L17.8 7"/>'+
    '<path d="M10 10.8v6.2"/><path d="M14 10.8v6.2"/></svg><b></b>';
  document.body.appendChild(_trash);
  return _trash;
}
function trashShow(){var t=trashBar();t.className='swipe-trash on';t.lastChild.textContent='';}
function trashArm(on,label){
  var t=trashBar();
  if(t.className.indexOf('on')<0)return;
  var keep=!!label&&label!=='מחק';
  t.className='swipe-trash on'+(keep?' keep':'')+(on?' hot':'');
  t.lastChild.textContent=on?(label||'מחק'):'';
}
function trashHide(){if(_trash)_trash.className='swipe-trash';}
window.addEventListener('pointerup',trashHide,true);
window.addEventListener('pointercancel',trashHide,true);
var SWIPE_X=62,SWIPE_Y=34,TRASH_W=56;
function overTrash(e){
  var t=document.querySelector('.swipe-trash');
  if(!t||!t.classList.contains('on')||t.classList.contains('hidden'))return false;
  return e.clientX<=TRASH_W;
}
function swipeArmed(d,e){
  if(d.mode==='end')return false;
  // over the strip is a delete no matter how the finger travelled there
  if(overTrash(e))return true;
  // and a flat flick leftwards still is, without having to reach the edge
  return (d.sx-e.clientX)>SWIPE_X&&Math.abs(e.clientY-d.sy)<SWIPE_Y;
}
function swipeMark(d,on,label){
  if(d.swiping===on)return;
  d.swiping=on;
  d.g.classList.toggle('swipe-del',on);
  d.g.setAttribute('data-swipe',on?(label||'מחק'):'');
  trashArm(on,label);
}

/* ── DRAG-EDGE SCROLLING ──
   Everything is written at the bottom of these screens and most of the grid is
   above the fold, so without this the early hours simply cannot be reached: a
   finger that leaves the viewport has nowhere to drop. Holding the drag near
   the top or bottom edge scrolls the page under it, faster the closer to the
   edge, and the hit test re-runs on every tick so the highlight keeps up. */
var _dragScroll=null,DRAG_EDGE=95;
function dragEdgeScroll(x,y,onTick){
  var top=y<DRAG_EDGE,bot=y>window.innerHeight-DRAG_EDGE;
  if(!top&&!bot){dragScrollStop();return;}
  var dir=top?-1:1;
  if(_dragScroll){_dragScroll.x=x;_dragScroll.y=y;_dragScroll.dir=dir;return;}
  _dragScroll={x:x,y:y,dir:dir,fn:onTick};
  _dragScroll.t=setInterval(function(){
    var s=_dragScroll;
    if(!s){return;}
    var d=s.dir<0?(DRAG_EDGE-s.y):(s.y-(window.innerHeight-DRAG_EDGE));
    var v=Math.max(4,Math.min(24,Math.round(d/3)));
    var before=window.scrollY;
    window.scrollBy(0,s.dir*v);
    if(window.scrollY===before)return;          // already at the end
    if(s.fn)s.fn({clientX:s.x,clientY:s.y});
  },16);
}
function dragScrollStop(){
  if(_dragScroll){clearInterval(_dragScroll.t);_dragScroll=null;}
}

/* ── RECURRING TASKS ──
   A shelf of tasks you keep needing, the way the meal library works: written
   once, then dragged straight onto a day, an hour or a date. Dragging one
   makes a copy - the saved task stays on the shelf - so the same shelf serves
   the day, the week and the month. */
var _tlOpen=false;
function loadTaskLib(){
  try{var x=localStorage.getItem('task_lib');var a=x?JSON.parse(x):null;
    return Array.isArray(a)?a:[];}catch(e){return[];}
}
function saveTaskLib(a){try{localStorage.setItem('task_lib',JSON.stringify(a));}catch(e){}}
function taskLibFind(id){
  var l=loadTaskLib(),i;
  for(i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function taskLibAdd(text,color){
  text=(text||'').trim();
  if(!text)return false;
  var l=loadTaskLib(),i;
  for(i=0;i<l.length;i++)if(l[i].w===text)return false;   // already on the shelf
  l.push({id:'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),w:text,c:color||'lav'});
  saveTaskLib(l);
  return true;
}
function taskLibAddFromInput(){
  var el=document.getElementById('tl-in');
  if(!el||!el.value.trim())return;
  taskLibAdd(el.value.trim(),'lav');
  el.value='';
  planRerender();
  setTimeout(function(){var e=document.getElementById('tl-in');if(e)e.focus();},40);
}
function taskLibSave(text,color){
  showToast(taskLibAdd(text,color)?'✓ נשמר כמשימה חוזרת':'כבר שמור');
  planRerender();
}
function taskLibDel(id){
  var l=loadTaskLib(),out=[],i;
  for(i=0;i<l.length;i++)if(l[i].id!==id)out.push(l[i]);
  saveTaskLib(out);planRerender();
}
function planRerender(){
  if(_planMode==='weekly')renderPlanWeek();
  else if(_planMode==='monthly')renderPlanMonth();
  else if(_planMode==='day')renderPlanDay();
}
// The star that puts a task on the shelf, for rows that have room for it.
function taskLibStar(text,color){
  return '<button onclick="taskLibSave(\''+esc(text).replace(/'/g,"\\'")+'\',\''+(color||'lav')+'\')" '+
    'style="background:none;border:none;color:#d8cfc7;font-size:13px;cursor:pointer;flex-shrink:0;font-family:inherit;padding:2px 3px">&#9734;</button>';
}
function taskLibHTML(){
  var l=loadTaskLib(),h='',i,c;
  h+='<div class="qacard" style="margin-top:16px"><button class="qatog" onclick="_tlOpen=!_tlOpen;planRerender()">';
  h+='<span class="qalbl">משימות חוזרות'+(l.length?' &middot; '+l.length:'')+'</span>';
  h+='<span class="qaarro" style="transform:'+(_tlOpen?'rotate(180deg)':'rotate(0deg)')+'">&#8963;</span></button>';
  if(_tlOpen){
    h+='<div class="qalist">';
    if(!l.length)h+='<div style="font-size:11.5px;color:#c0b8b0;line-height:1.6;padding:2px 2px 10px">שמור כאן משימה שחוזרת אצלך, וגרור אותה מכאן במקום לכתוב אותה שוב.</div>';
    for(i=0;i<l.length;i++){
      c=wkColor(l[i].c);
      h+='<div class="tl-row" data-lib="'+l[i].id+'" style="border-right:4px solid '+c.dot+'">';
      h+='<div class="wk-grip">&#8942;&#8942;</div>';
      h+='<button class="wk-dot" style="background:'+c.dot+'" onclick="tlPick(\''+l[i].id+'\')"></button>';
      h+='<div style="flex:1;min-width:0;font-size:13px;color:#4a4340;line-height:1.4">'+esc(l[i].w)+'</div>';
      h+='<button onclick="taskLibDel(\''+l[i].id+'\')" style="background:none;border:none;color:#e0c4bb;font-size:14px;cursor:pointer;flex-shrink:0;font-family:inherit">&times;</button></div>';
      if(_tlPick===l[i].id)h+='<div class="wk-picker">'+wkSwatches("tlSetColor('"+l[i].id+"','%K%')",l[i].c||'lav')+'</div>';
    }
    h+='<div style="display:flex;gap:8px;margin-top:8px">';
    h+='<input id="tl-in" class="mtin" style="flex:1;margin-bottom:0" placeholder="משימה שחוזרת אצלך" onkeydown="if(event.key===\'Enter\')taskLibAddFromInput()">';
    h+='<button onclick="taskLibAddFromInput()" style="background:#f0eafa;border:none;border-radius:11px;padding:0 16px;font-size:18px;font-weight:700;cursor:pointer;color:#a690cf;flex-shrink:0;font-family:inherit">+</button>';
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}
var _tlPick='';
function tlPick(id){_tlPick=(_tlPick===id?'':id);planRerender();}
function tlSetColor(id,k){
  var l=loadTaskLib(),i;
  for(i=0;i<l.length;i++)if(l[i].id===id)l[i].c=k;
  saveTaskLib(l);_tlPick='';planRerender();
}

/* ── MONTHLY PLANNING ──
   The month as a calendar, and a pool of what you want it to hold. Same
   mechanics as the week: write it with no date, drag it onto one, colour it,
   open it for details.

   It flows downward like everything else here. A month task landing on a date
   shows up in that day's grid, where it can be given an hour - and that hour
   is stored on the day, never written back. Nothing written on a day or in a
   week ever climbs into the month. */
var _moMonth=null,_moNewColor='lav',_moPick='',_moDrag=null;
var MO_NAMES=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

/* ── THE JOURNAL ──
   A page a day with nothing on it. סיום יום asks questions; this asks
   nothing, which is the point - some things do not arrive as answers to
   anything, and having to pick a field to put them in is enough friction to
   lose them.

   One key per day, written as you type, so nothing is ever lost to a forgotten
   save. Days you never opened leave no key behind: an empty entry is deleted
   rather than stored, so the list of past days is the days you actually wrote
   on and not every day since you installed the app.

   The search is the reason it is worth keeping at all. A year of pages you
   cannot look through is a drawer, not a journal. */
var JRNL_PRE='jrnl_';
var _jrnlDate='',_jrnlQ='',_jrnlSaveT=null;
function jrnlKey(d){return JRNL_PRE+d;}
function loadJournal(d){
  try{return localStorage.getItem(jrnlKey(d))||'';}catch(e){return '';}
}
function saveJournal(d,txt){
  try{
    if(txt&&txt.trim())localStorage.setItem(jrnlKey(d),txt);
    else localStorage.removeItem(jrnlKey(d));
  }catch(e){}
}
// every day that has something written on it, newest first
function journalDays(){
  var out=[],i,k;
  try{
    for(i=0;i<localStorage.length;i++){
      k=localStorage.key(i);
      if(k&&k.indexOf(JRNL_PRE)===0){
        var d=k.slice(JRNL_PRE.length);
        if(/^\d{4}-\d{2}-\d{2}$/.test(d))out.push(d);
      }
    }
  }catch(e){}
  out.sort();out.reverse();
  return out;
}
function jrnlType(el){
  var d=_jrnlDate,v=el.value;
  clearTimeout(_jrnlSaveT);
  _jrnlSaveT=setTimeout(function(){
    saveJournal(d,v);
    var m=document.getElementById('jrnl-saved');
    if(m){m.style.opacity='1';setTimeout(function(){m.style.opacity='0';},1400);}
  },450);
}
function jrnlFlush(){
  clearTimeout(_jrnlSaveT);
  var el=document.getElementById('jrnl-text');
  if(el&&_jrnlDate)saveJournal(_jrnlDate,el.value);
}
function jrnlGo(d){jrnlFlush();_jrnlDate=d;_jrnlQ='';renderJournal();window.scrollTo(0,0);}
function jrnlShift(n){
  jrnlFlush();
  // noon, like every other date key here, so a timezone cannot shift the day
  var dt=new Date(_jrnlDate+'T12:00:00');
  dt.setDate(dt.getDate()+n);
  _jrnlDate=dt.toISOString().slice(0,10);
  renderJournal();
}
function jrnlSearch(v){
  _jrnlQ=v;
  var box=document.getElementById('jrnl-results');
  if(box)box.innerHTML=jrnlResultsHTML();
}
// a window of text around the hit, so a result is recognisable without opening
function jrnlSnippet(txt,q){
  var at=txt.toLowerCase().indexOf(q.toLowerCase());
  if(at<0)return esc(txt.slice(0,90));
  var from=Math.max(0,at-34),to=Math.min(txt.length,at+q.length+56);
  return (from>0?'…':'')+esc(txt.slice(from,at))+
         '<mark class="jrnl-hit">'+esc(txt.substr(at,q.length))+'</mark>'+
         esc(txt.slice(at+q.length,to))+(to<txt.length?'…':'');
}
function jrnlResultsHTML(){
  var days=journalDays(),i,txt,h='';
  var q=(_jrnlQ||'').trim();
  if(!q){
    if(!days.length)return '<div class="jrnl-empty">עוד לא כתבת כלום. הדף למעלה מחכה.</div>';
    h+='<div class="jrnl-lbl">'+days.length+' '+(days.length===1?'יום':'ימים')+' שכתבת בהם</div>';
    for(i=0;i<days.length&&i<60;i++){
      txt=loadJournal(days[i]);
      h+=jrnlRow(days[i],esc(txt.slice(0,90))+(txt.length>90?'…':''));
    }
    return h;
  }
  var hits=[];
  for(i=0;i<days.length;i++){
    txt=loadJournal(days[i]);
    if(txt.toLowerCase().indexOf(q.toLowerCase())>=0)hits.push([days[i],txt]);
  }
  if(!hits.length)return '<div class="jrnl-empty">לא מצאתי &quot;'+esc(q)+'&quot; בשום יום.</div>';

function moFirst(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(1);return x;}
function moKey(m){return 'mplan_'+m.getFullYear()+'-'+(m.getMonth()<9?'0':'')+(m.getMonth()+1);}
function loadMonth(m){
  try{var x=localStorage.getItem(moKey(m));var o=x?JSON.parse(x):null;
    return(o&&Array.isArray(o.tasks))?o:{tasks:[]};}catch(e){return{tasks:[]};}
}
function saveMonth(m,o){try{localStorage.setItem(moKey(m),JSON.stringify(o));}catch(e){}}
// Every month task sitting on this date, whichever month record holds it.
function moTasksOn(date){
  var m=new Date(date+'T12:00:00'),wk=loadMonth(moFirst(m)),out=[],i;
  for(i=0;i<wk.tasks.length;i++)if(wk.tasks[i].d===date)out.push(wk.tasks[i]);
  return out;
}

function moTaskHTML(t){

function moShift(dir){

function moAdd(){
  var el=document.getElementById('mo-in');
  if(!el||!el.value.trim())return;
  var mo=loadMonth(_moMonth);
  mo.tasks.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),w:el.value.trim(),d:'',c:_moNewColor});
  saveMonth(_moMonth,mo);renderPlanMonth();
  setTimeout(function(){var e=document.getElementById('mo-in');if(e)e.focus();},40);

function moAssign(id,date){
  var mo=loadMonth(_moMonth),i;
  for(i=0;i<mo.tasks.length;i++)if(mo.tasks[i].id===id)mo.tasks[i].d=date||'';
  saveMonth(_moMonth,mo);renderPlanMonth();
}
function moFromLib(libId,date){
  var t=taskLibFind(libId);if(!t)return;
  var mo=loadMonth(_moMonth);
  mo.tasks.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                 w:t.w,d:date||'',c:t.c||'lav'});
  saveMonth(_moMonth,mo);renderPlanMonth();
}
function moDel(id){
  var mo=loadMonth(_moMonth),out=[],i;
  for(i=0;i<mo.tasks.length;i++)if(mo.tasks[i].id!==id)out.push(mo.tasks[i]);
  mo.tasks=out;saveMonth(_moMonth,mo);renderPlanMonth();
}
function moPick(id){_moPick=(_moPick===id?'':id);renderPlanMonth();}
function moSetColor(id,k){
  var mo=loadMonth(_moMonth),i;
  for(i=0;i<mo.tasks.length;i++)if(mo.tasks[i].id===id)mo.tasks[i].c=k;
  saveMonth(_moMonth,mo);_moPick='';renderPlanMonth();
}

/* ── the drag ── */
function moDown(e){
  var el=e.target.closest?e.target.closest('[data-task],[data-lib]'):null;
  if(!el)return;
  if(e.target.closest('button'))return;
  var r=el.getBoundingClientRect();
  var g=el.cloneNode(true);
  g.className='wk-task wk-ghost';
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  el.style.opacity='.3';
  _moDrag={id:el.getAttribute('data-task'),lib:el.getAttribute('data-lib')||'',g:g,src:el,
           dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,sx:e.clientX,sy:e.clientY,mode:'move'};
  if(!_moDrag.lib)trashShow();
  window.addEventListener('pointermove',moMove);
  window.addEventListener('pointerup',moUp);
  window.addEventListener('pointercancel',moUp);
  e.preventDefault();
}
function moHitCell(x,y){
  var c=document.querySelectorAll('.mo-cell[data-date]'),i,r;
  for(i=0;i<c.length;i++){
    r=c[i].getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return c[i];
  }
  return null;
}
function moOverPool(x,y){
  var p=document.getElementById('mo-pool');
  if(!p)return false;
  var r=p.getBoundingClientRect();
  return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}
function moMove(e){
  if(!_moDrag)return;
  _moDrag.moved=true;
  _moDrag.g.style.left=(e.clientX-_moDrag.dx)+'px';
  _moDrag.g.style.top=(e.clientY-_moDrag.dy)+'px';
  dragEdgeScroll(e.clientX,e.clientY,moMove);
  if(!_moDrag.lib)swipeMark(_moDrag,swipeArmed(_moDrag,e),'מחק');
  var hit=moHitCell(e.clientX,e.clientY),c=document.querySelectorAll('.mo-cell'),i;
  for(i=0;i<c.length;i++)c[i].classList.toggle('hot',c[i]===hit);
}
function moUp(e){
  if(!_moDrag)return;
  dragScrollStop();
  var hit=moHitCell(e.clientX,e.clientY);
  var onPool=!hit&&moOverPool(e.clientX,e.clientY);
  try{_moDrag.g.remove();}catch(err){}
  if(_moDrag.src)_moDrag.src.style.opacity='';
  window.removeEventListener('pointermove',moMove);
  window.removeEventListener('pointerup',moUp);
  window.removeEventListener('pointercancel',moUp);
  var id=_moDrag.id,moved=_moDrag.moved,lib=_moDrag.lib,swiped=_moDrag.swiping;
  _moDrag=null;
  if(swiped&&!lib){moDel(id);return;}
  if(!moved)return;
  if(lib){if(hit)moFromLib(lib,hit.getAttribute('data-date'));else renderPlanMonth();return;}
  if(hit)moAssign(id,hit.getAttribute('data-date'));
  else if(onPool)moAssign(id,'');
  else renderPlanMonth();
}
