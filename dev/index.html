  {c:'עבר', q:'אם היית יכול לדבר עם עצמך בגיל 16, מה היית אומר?'},
  {c:'עבר', q:'איזו טעות מהעבר לימדה אותך הכי הרבה?'},
  {c:'עבר', q:'על איזה רגע בחיים שלך היית רוצה לחזור?'},
  {c:'עבר', q:'איזה אדם מהעבר שלך עדיין משפיע עליך?'},
  {c:'עבר', q:'מה היית עושה אחרת אילו היית מקבל הזדמנות נוספת?'},
  // קשרים ואהבה
  {c:'קשרים ואהבה', q:'מה הדבר שהכי חשוב לך להרגיש בתוך קשר?'},
  {c:'קשרים ואהבה', q:'מה גורם לך להרגיש באמת אהוב?'},
  {c:'קשרים ואהבה', q:'מה הדבר שהכי מפחיד אותך במערכות יחסים?'},
  {c:'קשרים ואהבה', q:'האם קל לך לסמוך על אנשים? למה?'},
  {c:'קשרים ואהבה', q:'מה למדת על אהבה מהקשרים שהיו לך?'},
  {c:'קשרים ואהבה', q:'איזה דבר אתה מחפש באדם אחר אבל מתקשה למצוא?'},
  {c:'קשרים ואהבה', q:'האם אתה יותר מפחד להיות לבד או להיות עם האדם הלא נכון?'},
  // אומץ ופחד
  {c:'אומץ ופחד', q:'מה הדבר שאתה הכי מפחד לעשות אבל יודע שאתה רוצה?'},
  {c:'אומץ ופחד', q:'איזה פחד מנהל אותך יותר ממה שהיית רוצה להודות?'},
  {c:'אומץ ופחד', q:'מתי בפעם האחרונה עשית משהו למרות שפחדת?'},
  {c:'אומץ ופחד', q:'אם היית יודע שאף אחד לא ישפוט אותך, מה היית עושה?'},
  {c:'אומץ ופחד', q:'מה הדבר שאתה דוחה שוב ושוב למרות שאתה יודע שהוא חשוב לך?'},
  // עתיד וחלומות
  {c:'עתיד וחלומות', q:'איפה אתה באמת רוצה להיות בעוד חמש שנים?'},
  {c:'עתיד וחלומות', q:'איזה חלום שלך אתה מפחד להגיד בקול?'},
  {c:'עתיד וחלומות', q:'אם כסף לא היה שיקול, איך היית חי?'},
  {c:'עתיד וחלומות', q:'מה היית רוצה שאנשים יזכרו ממך?'},
  {c:'עתיד וחלומות', q:'איזה חיים היית רוצה לבנות לעצמך?'},
  {c:'עתיד וחלומות', q:'מה אתה מרגיש שחסר לך כדי להפוך לגרסה שאתה רוצה להיות?'},
  {c:'עתיד וחלומות', q:'אם היית יודע בוודאות שתצליח, מה היית מתחיל מחר?'},
  // עמוק יותר
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי מתבייש בו אבל למדת לקבל?'},
  {c:'עמוק יותר', q:'מתי לאחרונה הרגשת שאתה לא מספיק?'},
  {c:'עמוק יותר', q:'מה אתה עושה כשקשה לך במקום להתמודד?'},
  {c:'עמוק יותר', q:'איזה שקר אתה מספר לעצמך לפעמים?'},
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי צריך לשמוע ממישהו אחר?'},
  {c:'עמוק יותר', q:'איזה חלק בחיים שלך נראה טוב מבחוץ אבל מרגיש אחרת מבפנים?'},
  {c:'עמוק יותר', q:'מה הדבר שאתה הכי מפחד לאבד?'},
  {c:'עמוק יותר', q:'מה אתה מרגיש שאתה עדיין מנסה להוכיח — ולמי?'},
  {c:'עמוק יותר', q:'איזה שיעור בחיים אתה מרגיש שאתה חוזר עליו שוב ושוב?'},
  {c:'עמוק יותר', q:'מה היית רוצה שמישהו ישאל אותך אבל אף פעם לא שואלים?'},
  {c:'עמוק יותר', q:'מתי בפעם האחרונה הרגשת באמת גאה בעצמך?'},
  {c:'עמוק יותר', q:'איזה דבר בחיים שלך הגיע הזמן לשחרר?'}
];

/* faded paint on old wood - one shade per seat, none of them near the
   copper of the arrowhead */
const HUES = [190, 345, 120, 215, 285, 75, 235, 315];

/* =====================================================================
   2. STATE
   ===================================================================== */
const state = {
  count: 5,
  players: [],      // {name, picks, angle, hue}   angle: degrees clockwise from the top
  lastIndex: -1,    // nobody is picked twice in a row
  rotation: 0,      // accumulated arrow rotation
  spinning: false,
  sound: true,
  deck: []          // shuffled question indices
};

const $ = id => document.getElementById(id);
const escapeHtml = s => s.replace(/[&<>"']/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm = a => ((a % 360) + 360) % 360;
/* signed shortest distance from b to a, in -180..180 */
const diff = (a, b) => { let d = norm(a - b); return d > 180 ? d - 360 : d; };

/* =====================================================================
   3. SOUND - WebAudio only, no files and no network
   ===================================================================== */
let ac = null;
function audio(){
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) ac = new C();
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
/* a dry wooden knock rather than a bell */
function tick(volume, freq){
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = 'square';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * .4, t + .05);
  f.type = 'bandpass';
  f.frequency.setValueAtTime(freq * .9, t);
  f.Q.setValueAtTime(2.2, t);
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(volume, t + .003);
  g.gain.exponentialRampToValueAtTime(.0001, t + .07);
  o.connect(f).connect(g).connect(a.destination);
  o.start(t); o.stop(t + .09);
}
function chime(){
  if (!state.sound) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [[392, 0, .16], [523.25, .1, .14], [659.25, .2, .12]].forEach(function(n){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(n[0], t + n[1]);
    g.gain.setValueAtTime(.0001, t + n[1]);
    g.gain.linearRampToValueAtTime(n[2], t + n[1] + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + n[1] + .9);
    o.connect(g).connect(a.destination);
    o.start(t + n[1]); o.stop(t + n[1] + 1);
  });
}
function buzz(pattern){ if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} } }

/* =====================================================================
   4. SCREENS
   ===================================================================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

$('btn-start').onclick = () => { audio(); show('scr-count'); };

const countGrid = $('count-grid');
[3,4,5,6,7,8].forEach(n => {
  const b = document.createElement('button');
  b.className = 'count-btn' + (n === state.count ? ' on' : '');
  b.textContent = n;
  b.onclick = () => {
    state.count = n;
    [...countGrid.children].forEach(c => c.classList.toggle('on', c === b));
    tick(.14, 900);
  };
  countGrid.appendChild(b);
});
$('btn-count-back').onclick = () => show('scr-intro');
$('btn-count-next').onclick = () => { buildNameInputs(); show('scr-names'); };

function buildNameInputs(){
  const box = $('names');
  const previous = [...box.querySelectorAll('input')].map(i => i.value);
  box.innerHTML = '';
  for (let i = 0; i < state.count; i++) {
    const row = document.createElement('div');
    row.className = 'name-row';
    row.innerHTML =
      '<div class="name-dot" style="--h:' + HUES[i % HUES.length] + '">' + (i + 1) + '</div>' +
      '<input type="text" maxlength="14" autocomplete="off" autocapitalize="words" ' +
      'placeholder="שחקן ' + (i + 1) + '" enterkeyhint="next">';
    box.appendChild(row);
  }
  const inputs = [...box.querySelectorAll('input')];
  inputs.forEach((inp, i) => {
    if (previous[i]) inp.value = previous[i];
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus(); else inp.blur();
    });
  });
}
$('btn-names-back').onclick = () => show('scr-count');
$('btn-names-next').onclick = () => {
  const inputs = [...$('names').querySelectorAll('input')];
  state.players = inputs.map((inp, i) => ({
    name: inp.value.trim() || ('שחקן ' + (i + 1)),
    picks: 0,
    angle: 0,
    hue: HUES[i % HUES.length]
  }));
  spreadEvenly();
  startGame();
};

/* =====================================================================
   5. SEATS - angles are free, so the pegs can be dragged anywhere
   ===================================================================== */
const stage = $('stage'), arrow = $('arrow'), nodesBox = document.createElement('div');
nodesBox.id = 'nodes';
nodesBox.style.cssText = 'position:absolute;inset:0';
stage.insertBefore(nodesBox, $('hub'));

const NODE_R = 37;                                     // seat radius, % of the stage
const minGap = () => Math.min(20, 300 / state.players.length);

function spreadEvenly(){
  const sec = 360 / state.players.length;
  state.players.forEach((p, i) => { p.angle = i * sec; });
}

/* the seat nearest to a given needle angle - works with uneven spacing */
function seatAt(a){
  let best = 0, bestD = 999;
  state.players.forEach((p, i) => {
    const d = Math.abs(diff(a, p.angle));
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

/* how much free room a seat has on each side, in degrees */
function room(i){
  let cw = 360, ccw = 360;
  state.players.forEach((p, k) => {
    if (k === i) return;
    const d = norm(p.angle - state.players[i].angle);
    cw = Math.min(cw, d);
    ccw = Math.min(ccw, 360 - d);
  });
  if (state.players.length === 1) { cw = 180; ccw = 180; }
  return {cw: cw / 2, ccw: ccw / 2};
}

/* a dragged peg stays inside the free arc between its two neighbours,
   so two seats can never end up on the same spot - if they did, the needle
   would have no way to say which of them it stopped on */
function clampAngle(i, a){
  const gap = minGap();
  const others = state.players.filter((p, k) => k !== i).map(p => p.angle);
  if (!others.length) return norm(a);

  let next = 0, nextD = 361, prev = 0, prevD = 361;
  others.forEach(o => {
    const cw = norm(o - a), ccw = norm(a - o);
    if (cw < nextD) { nextD = cw; next = o; }
    if (ccw < prevD) { prevD = ccw; prev = o; }
  });

  const arc = norm(next - prev) || 360;        // the free arc holding this seat
  if (arc < gap * 2) return norm(prev + arc / 2);
  if (nextD < gap) return norm(next - gap);
  if (prevD < gap) return norm(prev + gap);
  return norm(a);
}

/* =====================================================================
   6. BOARD
   ===================================================================== */
function buildBoard(){
  nodesBox.innerHTML = '';
  state.players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'node';
    el.style.setProperty('--h', p.hue);
    el.dataset.i = i;
    el.innerHTML =
      '<div class="node-in"><span class="node-name"></span><span class="node-count"></span></div>';
    el.querySelector('.node-name').textContent = p.name;
    attachDrag(el, i);
    nodesBox.appendChild(el);
  });
  paintCounts();
  layout();
}

function placeNodes(){
  const size = stage.clientWidth || 1;
  const r = size * NODE_R / 100;
  [...nodesBox.children].forEach((el, i) => {
    const a = state.players[i].angle * Math.PI / 180;
    el.style.setProperty('--x', (r * Math.sin(a)).toFixed(1) + 'px');
    el.style.setProperty('--y', (-r * Math.cos(a)).toFixed(1) + 'px');
    // the phone lies flat on the table, so each name faces the person sitting there
    el.querySelector('.node-in').style.transform = 'rotate(' + (state.players[i].angle + 180) + 'deg)';
  });
}

function paintCounts(){
  [...nodesBox.children].forEach((el, i) => {
    const c = state.players[i].picks;
    el.querySelector('.node-count').textContent = c ? '×' + c : '';
  });
}

/* the stained ring behind the seats, plus a split in the wood on every boundary */
function paintWedges(){
  const n = state.players.length;
  if (!n) return;
  const order = state.players.map((p, i) => i).sort((a, b) => state.players[a].angle - state.players[b].angle);
  const mids = order.map((idx, k) => {
    const a = state.players[idx].angle;
    let b = state.players[order[(k + 1) % n]].angle;
    if (b <= a) b += 360;
    return norm((a + b) / 2);
  });

  const segs = [];
  order.forEach((idx, k) => {
    const s = mids[(k - 1 + n) % n], e = mids[k];
    const col = 'hsl(' + state.players[idx].hue + ' 32% 42% / .16)';
    if (e < s) { segs.push([s, 360, col]); segs.push([0, e, col]); }
    else segs.push([s, e, col]);
  });
  segs.sort((a, b) => a[0] - b[0]);
  $('wedges').style.background =
    'conic-gradient(' + segs.map(s => s[2] + ' ' + s[0].toFixed(2) + 'deg ' + s[1].toFixed(2) + 'deg').join(',') + ')';

  $('spokes').innerHTML = mids.map(m =>
    '<div class="spoke" style="transform:translate(-50%,0) rotate(' + (m + 180).toFixed(2) + 'deg)"></div>'
  ).join('');
}

/* lamplight falling on the chosen seat's slice of the board */
function lightWedge(i){
  const r = room(i);
  const from = norm(state.players[i].angle - r.ccw), to = norm(state.players[i].angle + r.cw);
  const col = 'rgba(255,168,84,.20)';
  const parts = from < to
    ? ['transparent 0deg ' + from.toFixed(2) + 'deg', col + ' ' + from.toFixed(2) + 'deg ' + to.toFixed(2) + 'deg',
       'transparent ' + to.toFixed(2) + 'deg 360deg']
    : [col + ' 0deg ' + to.toFixed(2) + 'deg', 'transparent ' + to.toFixed(2) + 'deg ' + from.toFixed(2) + 'deg',
       col + ' ' + from.toFixed(2) + 'deg 360deg'];
  const w = $('wedge-win');
  w.style.background = 'conic-gradient(' + parts.join(',') + ')';
  w.classList.add('on');
}
function darkWedge(){ $('wedge-win').classList.remove('on'); }

/* the stage is a square filling whatever room the layout leaves it */
function layout(){
  const wrap = $('stage-wrap');
  const size = Math.max(180, Math.min(wrap.clientWidth, wrap.clientHeight, 560));
  stage.style.width = size + 'px';
  stage.style.height = size + 'px';
  stage.style.setProperty('--s', size + 'px');
  placeNodes();
  paintWedges();
}
if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage-wrap'));
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* =====================================================================
   7. DRAGGING A SEAT
   ===================================================================== */
function attachDrag(el, i){
  let active = false, startA = 0, moved = false;

  const angleOf = e => {
    const r = stage.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    return norm(Math.atan2(dx, -dy) * 180 / Math.PI);
  };

  el.addEventListener('pointerdown', e => {
    if (state.spinning || document.body.classList.contains('sheet-open')) return;
    active = true; moved = false;
    startA = angleOf(e);
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!active) return;
    const a = angleOf(e);
    if (!moved) {
      if (Math.abs(diff(a, startA)) < 3) return;      // ignore a plain tap
      moved = true;
      el.classList.add('dragging');
      darkWedge();
      buzz(8);
    }
    state.players[i].angle = clampAngle(i, a);
    placeNodes();
    paintWedges();
  });

  const end = e => {
    if (!active) return;
    active = false;
    el.classList.remove('dragging');
    if (moved) {
      $('hint').textContent = 'מוכנים לסבב הבא';
      tick(.2, 620);
    }
    try { el.releasePointerCapture(e.pointerId); } catch(err){}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

$('btn-reset').onclick = () => {
  if (state.spinning) return;
  spreadEvenly();
  placeNodes();
  paintWedges();
  tick(.2, 800);
};

/* =====================================================================
   8. SPIN - wind up, long throw, small overshoot, settle back
   ===================================================================== */
function pickPlayer(){
  const n = state.players.length, pool = [];
  for (let i = 0; i < n; i++) if (i !== state.lastIndex || n === 1) pool.push(i);
  return pool[Math.floor(Math.random() * pool.length)];
}

function currentAngle(){
  const t = getComputedStyle(arrow).transform;
  if (!t || t === 'none') return 0;
  const m = t.match(/matrix\(([^)]+)\)/);
  if (!m) return 0;
  const p = m[1].split(',').map(Number);
  return Math.atan2(p[1], p[0]) * 180 / Math.PI;
}

/* one knock every time the needle passes a peg, and a smear that
   thickens with speed - both read the real angle, frame by frame */
let tickRAF = 0;
function runTicks(){
  let prev = currentAngle(), prevT = performance.now(), lastSeat = -1, lastPlay = 0;

  const step = now => {
    const raw = currentAngle();
    const d = diff(raw, prev);
    const speed = Math.abs(d) / Math.max(1, now - prevT) * 1000;   // deg per second
    prev = raw; prevT = now;

    arrow.style.setProperty('--trail', Math.min(speed / 900, 1).toFixed(2));

    const seat = seatAt(norm(raw));
    if (seat !== lastSeat) {
      lastSeat = seat;
      const f = Math.min(speed / 800, 1);            // 1 = fast, 0 = almost stopped
      if (now - lastPlay > 28) {
        tick(.06 + (1 - f) * .2, 620 + f * 320);     // slower means louder and lower
        lastPlay = now;
      }
    }
    if (state.spinning) tickRAF = requestAnimationFrame(step);
    else arrow.style.setProperty('--trail', 0);
  };
  tickRAF = requestAnimationFrame(step);
}

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function spin(){
  if (state.spinning || !state.players.length) return;
  audio();
  closeSheet();
  darkWedge();
  state.spinning = true;
  document.body.classList.add('spinning');
  $('btn-spin').disabled = true;
  $('btn-spin').textContent = 'מסתובב…';
  $('hint').textContent = 'החץ מסתובב';
  [...nodesBox.children].forEach(el => el.classList.remove('win'));

  const idx = pickPlayer();
  const r = room(idx);
  const j = Math.random() * 2 - 1;
  const rest = state.players[idx].angle + (j > 0 ? j * r.cw : j * r.ccw) * .55;
  const over = Math.min(7, Math.min(r.cw, r.ccw) * .35);
  const turns = 5 + Math.floor(Math.random() * 4);
  const dur = 4200 + Math.random() * 1700;

  // 1. wind up backwards
  const r1 = state.rotation - 14;
  arrow.style.transition = 'transform 380ms cubic-bezier(.35,0,.25,1)';
  void arrow.offsetWidth;
  arrow.style.transform = 'rotate(' + r1 + 'deg)';
  runTicks();

  // 2. the throw, landing just past the seat
  const delta = norm(norm(rest + over) - norm(r1));
  const r2 = r1 + turns * 360 + delta;
  later(() => {
    arrow.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.72,.12,1)';
    arrow.style.transform = 'rotate(' + r2 + 'deg)';
  }, 390);

  // 3. settle back onto it
  const r3 = r2 - over;
  later(() => {
    arrow.style.transition = 'transform 680ms cubic-bezier(.2,.9,.3,1)';
    arrow.style.transform = 'rotate(' + r3 + 'deg)';
  }, 400 + dur + 30);

  later(() => { state.rotation = r3; land(idx); }, 400 + dur + 30 + 700);
}

function land(idx){
  state.spinning = false;
  state.lastIndex = idx;
  state.players[idx].picks++;
  cancelAnimationFrame(tickRAF);
  arrow.style.setProperty('--trail', 0);
  document.body.classList.remove('spinning');
  $('btn-spin').disabled = false;
  $('btn-spin').textContent = 'התחל סבב';
  $('hint').textContent = 'תורו של ' + state.players[idx].name;

  nodesBox.children[idx].classList.add('win');
  lightWedge(idx);
  paintCounts();

  const s = $('shock');
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');

  chime();
  buzz([18, 60, 30]);

  const q = nextQuestion();
  $('winner').innerHTML =
    '<b style="color:hsl(' + state.players[idx].hue + ' 42% 28%)">' +
    escapeHtml(state.players[idx].name) + '</b>, הגיע תורך.';
  $('q-cat').textContent = q.c;
  $('q-text').textContent = q.q;
  later(() => openSheet($('sheet-result')), 620);
}

/* =====================================================================
   9. QUESTION DECK - every question is asked once before any repeat
   ===================================================================== */
function nextQuestion(){
  if (!state.deck.length) {
    state.deck = QUESTIONS.map((_, i) => i);
    for (let i = state.deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = state.deck[i]; state.deck[i] = state.deck[j]; state.deck[j] = tmp;
    }
  }
  return QUESTIONS[state.deck.pop()];
}

/* =====================================================================
   10. SHEETS
   ===================================================================== */
function openSheet(el){
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('on', s === el));
  document.body.classList.add('sheet-open');
  $('backdrop').classList.toggle('on', el === $('sheet-hist'));
}
function closeSheet(){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  document.body.classList.remove('sheet-open');
  $('backdrop').classList.remove('on');
}
$('backdrop').onclick = closeSheet;
$('btn-hist-close').onclick = closeSheet;

$('btn-respin').onclick = () => { closeSheet(); later(spin, 340); };
$('btn-answered').onclick = () => {
  closeSheet();
  [...nodesBox.children].forEach(el => el.classList.remove('win'));
  darkWedge();
  $('hint').textContent = 'מוכנים לסבב הבא';
};

$('btn-hist').onclick = () => {
  const top = Math.max(1, ...state.players.map(p => p.picks));
  $('hist-list').innerHTML = state.players.map(p =>
    '<div class="hist-row">' +
      '<div class="hist-name">' + escapeHtml(p.name) + '</div>' +
      '<div class="hist-bar"><div class="hist-fill" style="width:' + (p.picks / top * 100) + '%;' +
        'background:linear-gradient(90deg,hsl(' + p.hue + ' 30% 30%),hsl(' + p.hue + ' 34% 48%))"></div></div>' +
      '<div class="hist-num">' +
        (p.picks === 0 ? '0 פעמים' : p.picks === 1 ? 'פעם אחת' : p.picks + ' פעמים') +
      '</div>' +
    '</div>'
  ).join('');
  openSheet($('sheet-hist'));
};

/* =====================================================================
   11. GAME CONTROLS
   ===================================================================== */
$('hub').onclick = spin;
$('btn-spin').onclick = spin;

$('btn-sound').onclick = () => {
  state.sound = !state.sound;
  $('btn-sound').classList.toggle('off', !state.sound);
  $('btn-sound').innerHTML = state.sound ? '&#128266;' : '&#128263;';
  if (state.sound) tick(.2, 800);
};

$('btn-new').onclick = () => {
  if (state.spinning) return;
  clearTimers();
  closeSheet();
  releaseWake();
  show('scr-count');
};

function startGame(){
  clearTimers();
  state.lastIndex = -1;
  state.rotation = 0;
  arrow.style.transition = 'none';
  arrow.style.transform = 'rotate(0deg)';
  arrow.style.setProperty('--trail', 0);
  darkWedge();
  buildBoard();
  closeSheet();
  $('btn-spin').disabled = false;
  $('btn-spin').textContent = 'התחל סבב';
  $('hint').textContent = 'גררו את העיגולים לפי מקומות הישיבה סביב השולחן';
  show('scr-game');
  requestAnimationFrame(layout);
  requestWake();
}

/* keep the screen awake while the phone sits in the middle of the table */
let wake = null;
function requestWake(){
  try {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }, () => {});
  } catch(e){}
}
function releaseWake(){ try { if (wake) { wake.release(); wake = null; } } catch(e){} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('scr-game').classList.contains('on')) requestWake();
});
<\/script>
