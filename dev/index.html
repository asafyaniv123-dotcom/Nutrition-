/* ── HOLD IT STILL, THEN PRESS ──
   Reading a barcode out of a live stream frame by frame failed on the phone:
   the frames a browser hands a scanning loop are small, motion-blurred and
   auto-exposed for the whole scene rather than for a strip of black and white
   lines. Freezing first is what the document scanners do, and it is the right
   shape for this - you get to line the barcode up while the preview is live,
   and the decoder gets one sharp full-resolution still instead of thirty poor
   ones a second.

   The camera is driven directly rather than through the library's own
   scanning loop, so the frame that gets decoded is the sensor's, at whatever
   resolution the phone will give. */
var _scanStream=null,_scanBusy=false;
function scanCamStart(){
  _scanBusy=false;

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    scanMsg('הדפדפן הזה לא נותן גישה למצלמה. אפשר לבחור תמונה או להקליד את הספרות.');
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{
      facingMode:{ideal:'environment'},
      width:{ideal:1920},height:{ideal:1080},
      advanced:[{focusMode:'continuous'}]
    },audio:false})
    .then(function(st){
      _scanStream=st;
      v.srcObject=st;
      return v.play().catch(function(){});
    })
    .then(function(){
      var b=document.getElementById('scan-shot');
      if(b)b.disabled=false;
      scanMsg('החזק את הברקוד בתוך המסגרת, קרוב ומלא רוחב &mdash; ואז לחץ סרוק');
    })
    .catch(function(err){
      // getUserMedia can settle long after the shutter has been pressed, and
      // a stale camera complaint must not paint over the read's own message
      if(_scanBusy)return;
      var m=String((err&&(err.name+' '+err.message))||err||'');
      if(/NotAllowed|Permission|Denied/i.test(m))
        scanMsg('אין הרשאה למצלמה. אפשר לאשר בהגדרות האתר, לבחור תמונה, או להקליד את הספרות.');
      else if(/NotFound|Requested device|Overconstrained/i.test(m))
        scanMsg('לא נמצאה מצלמה. אפשר לבחור תמונה או להקליד את הספרות.');
      else
        scanMsg('המצלמה לא נפתחה. אפשר לבחור תמונה או להקליד את הספרות.');
    });

/* One still, tried several ways, cheapest and likeliest first.

   Measured rather than guessed: against blurred, rotated, low-contrast and
   unevenly lit test frames, every read that succeeded succeeded on the WHOLE
   frame at its own resolution. The cropped-and-upscaled attempts that used to
   run first failed on every single case - upscaling a crop with smoothing off
   turns soft bars into staircases and throws away the sub-pixel edges the
   decoder measures. So the crops come last, if at all.

   Rotation was the outright failure: a barcode at 90 degrees was never read.
   ZXing's 1D readers sweep horizontal lines, so a barcode running down the
   frame is invisible to them - and a phone held in portrait over a packet on
   a table produces exactly that. The frame is now offered at each quarter
   turn.

   A grey pass is tried too, stretched to full black-and-white, for the case
   the tests could not fake: a shiny wrapper under a ceiling light, where the
   bars are dark grey on light grey rather than black on white. */
/* ── READING THE DIGITS ──
   When the bars will not read, the number printed under them still will.

   The reason this is safe rather than a guess is the check digit: the last
   figure of a barcode is computed from the ones before it, so a misread is
   almost always arithmetically impossible and gets thrown away instead of
   sending us to look up somebody else's product. Only a number that checks
   out is looked up; digits that do not check out are put in the box below
   for you to correct, which still beats typing thirteen figures from
   scratch.

   Tesseract is fetched when it is first needed rather than shipped: it is
   several megabytes, and this whole flow already needs the network anyway -
   a barcode is nothing without the lookup that turns it into a product. */
var TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
var _tessLib=null;
function tessLoad(){
  if(_tessLib)return _tessLib;
  _tessLib=new Promise(function(res,rej){
    if(window.Tesseract){res();return;}
    var s=document.createElement('script');
    s.src=TESS_URL;
    s.onload=function(){window.Tesseract?res():rej(new Error('empty'));};
    s.onerror=function(){rej(new Error('failed'));};
    document.head.appendChild(s);
  });
  return _tessLib;
}
// the last digit is computed from the rest, which is what makes a read
// trustworthy enough to act on
function gtinValid(s){
  if(!/^\d+$/.test(s))return false;
  if([8,12,13,14].indexOf(s.length)<0)return false;
  var sum=0,mul=3,i;
  for(i=s.length-2;i>=0;i--){sum+=(+s[i])*mul;mul=(mul===3)?1:3;}
  return ((10-(sum%10))%10)===(+s[s.length-1]);
}
/* Pull the runs of digits out of the text and keep the ones that check.
   Only whole runs are tested, plus 13-digit windows of a longer one. Short
   substrings are deliberately not fished out of long ones: any random eight
   digits pass the check one time in ten, so hunting for an EAN-8 inside a
   thirteen-digit run manufactures a plausible wrong answer out of a misread,
   which is worse than admitting the read failed. */
function gtinFrom(text){
  var runs=String(text||'').match(/\d{6,}/g)||[],out=[],i,r,k,sub;
  for(i=0;i<runs.length;i++){
    r=runs[i];
    if(gtinValid(r)&&out.indexOf(r)<0)out.push(r);
    if(r.length>13)
      for(k=0;k+13<=r.length;k++){
        sub=r.substr(k,13);
        if(gtinValid(sub)&&out.indexOf(sub)<0)out.push(sub);
      }
  }
  out.sort(function(a,b){return b.length-a.length;});
  return {valid:out,longest:runs.slice().sort(function(a,b){return b.length-a.length;})[0]||''};
}
function ocrDigits(cv){
  return tessLoad().then(function(){
    return Tesseract.createWorker('eng').then(function(w){
      return w.setParameters({tessedit_char_whitelist:'0123456789'})
        .then(function(){return w.recognize(cv);})
        .then(function(r){
          var t=(r&&r.data&&r.data.text)||'';
          return w.terminate().then(function(){return t;},function(){return t;});
        })
        .catch(function(e){
          try{w.terminate();}catch(x){}
          throw e;
        });
    });
  });
}
function scanReadDigits(){
  var c=document.getElementById('scan-frozen');
  if(!c)return;
  scanMsg('הפסים לא נקראו. קורא את הספרות…');
  var views=[c,scanContrast(c),scanRotate(c,90),scanRotate(c,270)];
  var i=0,best='';
  function next(){
    if(i>=views.length){scanDigitsFailed(best);return;}
    var v=views[i++];
    scanMsg('קורא את הספרות… '+i+'/'+views.length);
    ocrDigits(v).then(function(text){
      var g=gtinFrom(text);
      if(g.valid.length){scanCamStop();barcodeLookup(g.valid[0]);return;}
      if(g.longest.length>best.length)best=g.longest;
      next();
    }).catch(function(){
      scanMsg('לא הצלחתי לטעון את קורא הספרות. אפשר להקליד אותן למטה.');
      scanRetryButton();
    });
  }
  next();
}
function scanDigitsFailed(best){
  var f=document.getElementById('scan-code');
  if(best&&f){
    f.value=best;
    scanMsg('קראתי <b>'+esc(best)+'</b> אבל זה לא מסתדר עם ספרת הביקורת. תקן מה שצריך ולחץ חפש.');
    try{f.focus();}catch(e){}
  } else {
    scanMsg('לא הצלחתי לקרוא. אפשר להקליד את הספרות שמתחת לפסים &mdash; זה תמיד עובד.');
    if(f)try{f.focus();}catch(e){}
  }
  scanRetryButton();
}
function scanRetryButton(){
  var b=document.getElementById('scan-shot');
  if(b){b.disabled=false;b.textContent='נסה שוב';b.onclick=function(){this.onclick=scanShoot;scanUnfreeze();};}
}

function scanRotate(src,deg){
  if(!deg)return src;
  var swap=(deg===90||deg===270);
  var cv=document.createElement('canvas');
  cv.width=swap?src.height:src.width;
  cv.height=swap?src.width:src.height;
  var x=cv.getContext('2d');
  x.translate(cv.width/2,cv.height/2);
  x.rotate(deg*Math.PI/180);
  x.drawImage(src,-src.width/2,-src.height/2);
  return cv;
}
function scanContrast(src){
  var cv=document.createElement('canvas');
  cv.width=src.width;cv.height=src.height;
  var x=cv.getContext('2d');
  x.drawImage(src,0,0);
  var d;
  try{d=x.getImageData(0,0,cv.width,cv.height);}catch(e){return src;}
  var a=d.data,i,g,lo=255,hi=0;
  for(i=0;i<a.length;i+=4){
    g=(a[i]*299+a[i+1]*587+a[i+2]*114)/1000;
    a[i]=a[i+1]=a[i+2]=g;
    if(g<lo)lo=g; if(g>hi)hi=g;
  }
  var span=Math.max(1,hi-lo);
  for(i=0;i<a.length;i+=4){
    g=(a[i]-lo)/span*255;
    a[i]=a[i+1]=a[i+2]=g<0?0:(g>255?255:g);
  }
  x.putImageData(d,0,0);
  return cv;
}
function scanCrop(src,t){
  var sw=Math.max(1,Math.floor(src.width*t.w)),sh=Math.max(1,Math.floor(src.height*t.h));
  var cv=document.createElement('canvas');
  cv.width=sw;cv.height=sh;
  cv.getContext('2d').drawImage(src,Math.floor(src.width*t.x),Math.floor(src.height*t.y),sw,sh,0,0,sw,sh);
  return cv;
}
function scanDecodeFrozen(){
  var c=document.getElementById('scan-frozen');
  if(!c)return;
  scanLibLoad().then(function(){
    var plan=[
      {t:'שלם',        f:function(){return c;}},
      {t:'רבע סיבוב',  f:function(){return scanRotate(c,90);}},
      {t:'רבע סיבוב',  f:function(){return scanRotate(c,270);}},
      {t:'ניגודיות',   f:function(){return scanContrast(c);}},
      {t:'ניגודיות',   f:function(){return scanContrast(scanRotate(c,90));}},
      {t:'הפוך',       f:function(){return scanRotate(c,180);}},
      {t:'הרצועה',     f:function(){return scanCrop(c,{x:0.02,y:0.20,w:0.96,h:0.60});}},
      {t:'הרצועה',     f:function(){return scanContrast(scanCrop(c,{x:0.02,y:0.20,w:0.96,h:0.60}));}}
    ];
    var i=0;
    function next(){
      if(i>=plan.length){scanReadDigits();return;}
      var step=plan[i++];
      scanMsg('מפענח… '+i+'/'+plan.length);
      var img;
      try{img=step.f();}catch(e){next();return;}
      scanDecodeCanvas(img).then(function(txt){
        if(txt){scanCamStop();barcodeLookup(String(txt).trim());}
        else next();
      });
    }
    next();
  }).catch(function(){
    scanMsg('הסורק לא נטען. אפשר להקליד את הספרות למטה.');
  });
}
function scanDecodeCanvas(cv){
  return new Promise(function(res){
    try{
      cv.toBlob(function(b){
        if(!b){res(null);return;}
        scanDecodeBlob(new File([b],'frame.png',{type:'image/png'})).then(res);
      },'image/png');
    }catch(e){res(null);}
  });
}
function scanDecodeBlob(file){
  return new Promise(function(res){
    var host=document.getElementById('scan-file-host');
    if(!host||!window.Html5Qrcode){res(null);return;}
    var F=window.Html5QrcodeSupportedFormats;
    var q;
    try{q=new Html5Qrcode('scan-file-host',F?{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]}:undefined);}
    catch(e){res(null);return;}
    q.scanFile(file,false).then(function(t){res(t);}).catch(function(){res(null);});
  });
}
function scanPhoto(input){
  var f=input&&input.files&&input.files[0];
  input.value='';
  if(!f)return;
  scanMsg('קורא את התמונה…');
  scanLibLoad().then(function(){
    scanDecodeBlob(f).then(function(txt){
      if(txt){scanCamStop();barcodeLookup(String(txt).trim());}
      else{
        var c=document.getElementById('scan-frozen');
        if(c){
          var im=new Image();
          im.onload=function(){
            c.width=im.naturalWidth;c.height=im.naturalHeight;
            c.getContext('2d').drawImage(im,0,0);
            URL.revokeObjectURL(im.src);
            scanReadDigits();
          };
          im.onerror=function(){scanMsg('לא זיהיתי ברקוד בתמונה. אפשר להקליד את הספרות.');};
          im.src=URL.createObjectURL(f);
        } else scanMsg('לא זיהיתי ברקוד בתמונה. אפשר להקליד את הספרות.');
      }
    });
  }).catch(function(){scanMsg('הסורק לא נטען. אפשר להקליד את הספרות למטה.');});
}
function scanStop(){scanCamStop();}
function scanClose(){
  scanCamStop();
  var d=document.getElementById('scan-overlay');
  if(d)d.remove();
  document.body.style.overflow='';
}
function scanTyped(){
  var el=document.getElementById('scan-code');
  var code=el?el.value.replace(/\D/g,''):'';
  if(code.length<6){scanMsg('ברקוד קצר מדי. הקלד את כל הספרות.');return;}
  scanCamStop();barcodeLookup(code);
}
function barcodeLookup(code){
  scanMsg('מחפש '+esc(code)+'…');
  fetch(OFF_API+encodeURIComponent(code)+'?fields=code,product_name,product_name_he,brands,serving_size,nutriments')
    .then(function(r){return r.json();})
    .then(function(j){
      var p=j&&j.product;
      if(!p||j.status===0){scanNotFound(code);return;}
      var n=p.nutriments||{};
      var k=n['energy-kcal_100g'];
      if(k===undefined||k===null){scanNotFound(code,true);return;}
      var name=p.product_name_he||p.product_name||('מוצר '+code);
      if(p.brands)name+=', '+String(p.brands).split(',')[0].trim();
      _fdbScanned={
        id:'off:'+code,n:name,
        k:Math.round(k),
        p:Math.round((n.proteins_100g||0)*10)/10,
        c:Math.round((n.carbohydrates_100g||0)*10)/10,
        f:Math.round((n.fat_100g||0)*10)/10,
        off:true
      };
      // the label's own serving is the best first answer to "how many grams?"
      var g=String(p.serving_size||'').match(/([\d.]+)\s*(g|גרם|ג)/i);
      scanClose();
      if(!fdbOpen){fdbOpen=true;render();}
      fdbPick=_fdbScanned.id;
      fdbGrams=g?Math.round(parseFloat(g[1])):100;
      fdbPaint();
      var box=document.getElementById('fdb-body');
      if(box)box.scrollIntoView({block:'center'});
    })
    .catch(function(){scanMsg('החיפוש נכשל. בדוק חיבור ונסה שוב.');});
}
function scanNotFound(code,partial){
  scanMsg((partial?'המוצר קיים אבל בלי ערכים תזונתיים.':'המוצר '+esc(code)+' לא נמצא במאגר.')+
          '<br>אפשר לחפש אותו בשם, או להוסיף ידנית.');
}

function fdbToggle(){
  fdbOpen=!fdbOpen;fdbPick=null;
  render();
  if(fdbOpen)foodsLoad(fdbPaint);
}
function fdbType(v){_fdbQ=v;fdbPick=null;fdbPaint();}
function fdbSelect(id){fdbPick=id;fdbGrams=100;fdbPaint();}
function fdbBack(){fdbPick=null;fdbPaint();}
function fdbSetGrams(v){
  fdbGrams=parseFloat(v)||0;
  var el=document.getElementById('fdb-preview');
  if(el)el.innerHTML=fdbPreviewHTML();
}
function fdbFind(id){
  if(_fdbScanned&&_fdbScanned.id===id)return _fdbScanned;
  if(!_foods)return null;
  for(var i=0;i<_foods.length;i++)if(_foods[i].id===id)return _foods[i];
  return null;
}
function fdbAmount(f,g){
  var m=(g||0)/100;
  return {kcal:Math.round(f.k*m),p:Math.round(f.p*m*10)/10,
          c:Math.round(f.c*m*10)/10,f:Math.round(f.f*m*10)/10};
}
function fdbPreviewHTML(){
  var f=fdbFind(fdbPick);if(!f)return '';
  var a=fdbAmount(f,fdbGrams);
  return '<b style="color:#a690cf">'+a.kcal+'</b> קק"ל &middot; '+a.p+'ח &middot; '+a.c+'פ &middot; '+a.f+'ש';
}
function fdbAdd(){
  var f=fdbFind(fdbPick);if(!f||!fdbGrams)return;
  var a=fdbAmount(f,fdbGrams);
  var day=loadDay(curDate);
  day.meals.push({name:f.n+' ('+fdbGrams+'g)',kcal:a.kcal,p:a.p,c:a.c,f:a.f,
                  id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);
  showToast('✓ נוסף ליום');
  fdbPick=null;_fdbQ='';render();
}
// saves the food itself, per 100 g, so it can be reached without searching again
function fdbSaveToLib(){
  var f=fdbFind(fdbPick);if(!f)return;
  addMealToLib({name:f.n,kcal:f.k,p:f.p,c:f.c,f:f.f,basis:'100g'});
  fdbPaint();
}
function fdbPaint(){
  var el=document.getElementById('fdb-body');
  if(!el)return;
  if(_foodsState==='loading'){el.innerHTML='<div class="fdb-msg">טוען את המאגר…</div>';return;}
  if(_foodsState==='error'){el.innerHTML='<div class="fdb-msg">לא הצלחתי לטעון את המאגר. בדוק חיבור ונסה שוב.</div>';return;}
  if(_foodsState!=='ready'){el.innerHTML='';return;}
  if(fdbPick){
    var f=fdbFind(fdbPick);
    if(f){
      var inLib=loadLib().some(function(m){return m.name===f.n;});
      el.innerHTML='<div class="fdb-conf">'+
        '<div class="fdb-cname">'+esc(f.n)+'</div>'+
        '<div class="fdb-c100">'+f.k+' קק"ל ל-100 גרם &middot; '+f.p+'ח '+f.c+'פ '+f.f+'ש</div>'+
        '<div class="fdb-grow"><span class="fdb-glbl">כמה גרם?</span>'+
        '<input class="fdb-gin" id="fdb-grams" type="number" inputmode="decimal" value="'+fdbGrams+'" oninput="fdbSetGrams(this.value)">'+
        '<span class="fdb-gu">g</span></div>'+
        '<div class="fdb-preview" id="fdb-preview">'+fdbPreviewHTML()+'</div>'+
        '<div class="fdb-btns">'+
        '<button class="fdb-add" onclick="fdbAdd()">הוסף ליום ✓</button>'+
        '<button class="fdb-back" onclick="fdbBack()">חזרה</button></div>'+
        (inLib?'<div class="fdb-saved">✓ כבר בספרייה שלך</div>'
              :'<button class="fdb-save" onclick="fdbSaveToLib()">שמור בספרייה שלי</button>')+
        (f.off?'<div class="fdb-src">מקור: Open Food Facts</div>':'')+
        '</div>';
      return;
    }
  }
  if(!_fdbQ){el.innerHTML='<div class="fdb-msg">'+_foods.length.toLocaleString()+' מאכלים ממאגר משרד הבריאות. הקלד כדי לחפש.</div>';return;}
  var res=foodSearch(_fdbQ);
  if(!res.length){el.innerHTML='<div class="fdb-msg">לא נמצא. נסה מילה אחרת.</div>';return;}
  var h='<div class="fdb-list">',i;
  for(i=0;i<res.length;i++){
    h+='<button class="fdb-row" onclick="fdbSelect(\u0027'+res[i].id+'\u0027)">'+
       '<span class="fdb-rn">'+esc(res[i].n)+'</span>'+
       '<span class="fdb-rk">'+res[i].k+'<span class="fdb-ru">/100g</span></span></button>';
  }
  el.innerHTML=h+'</div>';
}

function toggleLib(){libOpen=!libOpen;pendingLib=null;render();}
function toggleComp(){compOpen=!compOpen;render();}
function setCompCat(c){compCat=c;render();}

/* ── WHAT THE NUMBERS ARE FOR ──
   Two kinds of record live in the food library and their numbers mean
   different things. One you typed yourself - "סלט של אמא, 320 קק"ל" - and 320
   is the plate. One comes from the ministry table - "טחינה גולמית, 665" - and
   665 is a hundred grams of it, which nobody eats.

   Until now the app did not know which it was holding, and guessed differently
   in two places: adding straight to the day treated every entry as a plate,
   the recipe builder treated every entry as per-100g. The same record
   therefore counted twice over if you gave it a weight.

   So a record now says which it is. Anything already saved says nothing, and
   silence has to keep meaning exactly what it meant before or a year of
   recipes would quietly change totals - so the old grams path is left intact
   and only new records carry the label. */
function mealBasis(m){return (m&&m.basis==='100g')?'100g':'serving';}
// A serving-based ingredient is counted, not weighed. Anything without the
// label falls through to the weight path it has always used.
function calcIng(ing){
  var m=(ing.basis==='serving')?(parseFloat(ing.qty)||1):((parseFloat(ing.grams)||0)/100);
  return{kcal:Math.round(ing.kcal*m),p:Math.round(ing.p*m*100)/100,
         c:Math.round(ing.c*m*100)/100,f:Math.round(ing.f*m*100)/100};
}
function calcComposed(meal){
  return meal.ingredients.reduce(function(a,ing){var v=calcIng(ing);return{kcal:a.kcal+v.kcal,p:Math.round((a.p+v.p)*100)/100,c:Math.round((a.c+v.c)*100)/100,f:Math.round((a.f+v.f)*100)/100};}  ,{kcal:0,p:0,c:0,f:0});
}
function addComposedToDay(id){
  var meals=loadComposed();var meal=meals.find(function(m){return m.id===id;});if(!meal)return;
  var tot=calcComposed(meal);var day=loadDay(curDate);
  day.meals.push({name:meal.name,kcal:tot.kcal,p:tot.p,c:tot.c,f:tot.f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day);showToast('✓ '+meal.name+' נוספה');render();
}
function deleteComposed(id){saveComposed(loadComposed().filter(function(m){return m.id!==id;}));render();}

function openBuilder(cat){
  builderCat=cat||'breakfast';builderName='';builderIngs=[];builderPickOpen=false;
  document.body.style.overflow='hidden';renderBuilderOverlay();
}
function closeBuilder(){document.body.style.overflow='';var ov=document.getElementById('builder-overlay');if(ov)ov.remove();}
function setBuildCat(c){builderCat=c;renderBuilderOverlay();}
function toggleBuilderPick(){builderPickOpen=!builderPickOpen;renderBuilderOverlay();}
function builderAddIng(idx){
  var lib=loadLib();var item=lib[idx];if(!item)return;
  var b=mealBasis(item);
  builderIngs.push(b==='serving'
    ?{name:item.name,kcal:item.kcal,p:item.p,c:item.c,f:item.f,basis:'serving',qty:1}
    :{name:item.name,kcal:item.kcal,p:item.p,c:item.c,f:item.f,basis:'100g',grams:100});
  builderPickOpen=false;renderBuilderOverlay();
}
function builderUpdateGrams(i,v){
  var ing=builderIngs[i];
  if(ing){if(ing.basis==='serving')ing.qty=parseFloat(v)||0;else ing.grams=parseFloat(v)||0;}
  var tot=calcBTotal();var el=document.getElementById('builder-total');
  if(el)el.textContent=tot.kcal+' קק"ל · '+tot.p+'ח '+tot.c+'פ '+tot.f+'ש';
}
function calcBTotal(){
  return builderIngs.reduce(function(a,ing){var v=calcIng(ing);return{kcal:a.kcal+v.kcal,p:Math.round((a.p+v.p)*100)/100,c:Math.round((a.c+v.c)*100)/100,f:Math.round((a.f+v.f)*100)/100};}  ,{kcal:0,p:0,c:0,f:0});
}
function builderRemoveIng(i){builderIngs.splice(i,1);renderBuilderOverlay();}
function saveBuilderMeal(){
  var ne=document.getElementById('builder-name');if(ne)builderName=ne.value.trim();
  if(!builderName){alert('נא לתת שם');return;}
  if(builderIngs.length===0){alert('נא להוסיף מרכיבים');return;}
  var meals=loadComposed();
  meals.push({id:Date.now(),name:builderName,category:builderCat,ingredients:builderIngs.slice()});
  saveComposed(meals);closeBuilder();showToast('✓ '+builderName+' נשמרה!');render();
}

function renderBuilderOverlay(){
  var old=document.getElementById('builder-overlay');if(old)old.remove();
  var lib=loadLib();var tot=calcBTotal();
  var div=document.createElement('div');div.id='builder-overlay';div.className='builder-overlay';
  div.onclick=function(e){if(e.target===div)closeBuilder();};
  var h='<div class="builder-sheet"><div class="builder-pull"></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div style="font-size:17px;font-weight:700">בנאי ארוחה</div>';
  h+='<button onclick="closeBuilder()" style="background:none;border:none;font-size:22px;color:#a89e97;cursor:pointer">&times;</button></div>';
  h+='<div class="builder-section">שם</div>';
  h+='<input id="builder-name" class="mtin" placeholder="שם הארוחה" value="" oninput="builderName=this.value">';

var _mealPhotoData='';

function handleMealPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=300;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _mealPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('meal-photo-prev');
      var imgEl=document.getElementById('meal-photo-img');
      var clr=document.getElementById('meal-photo-clear');
      if(prev){prev.style.display='block';}
      if(imgEl){imgEl.src=_mealPhotoData;}
      if(clr){clr.style.display='inline';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function clearMealPhoto(){
  _mealPhotoData='';
  var prev=document.getElementById('meal-photo-prev');var clr=document.getElementById('meal-photo-clear');
  if(prev)prev.style.display='none';if(clr)clr.style.display='none';
}

function addManual(){

  if(!name||!kcal){alert('נא למלא שם וקלוריות');return;}
  var p=parseFloat(document.getElementById('mp').value)||0;

function handlePhotoUpload(input){

    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');var mw=600,mh=600;var w=img.width,h=img.height;
      if(w>mw){h=Math.round(h*mw/w);w=mw;}if(h>mh){w=Math.round(w*mh/h);h=mh;}

function clockPtForHour(h){
  var ang=(-90+h*(720/24))*Math.PI/180;
  var r=52+(h/24)*(128-52);
  return {x:140+r*Math.cos(ang),y:145+r*Math.sin(ang),r:r};
}

function drawSumClock(clkD){
  var canvas=document.getElementById('sum-clock-canvas');if(!canvas||!clkD)return;
  var ctx=canvas.getContext('2d');
  var W=160,H=166,CX=80,CY=83,R_IN=28,R_OUT=68;
  var TC={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162'};
  ctx.clearRect(0,0,W,H);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=9;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(!clkD[i]||clkD[i]==='none'){i++;continue;}
    var col=clkD[i],st=i;
    while(i<25&&clkD[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=TC[col]||'#ccc';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor=TC[col];ctx.shadowBlur=4;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels 0,12,24
  [0,12,24].forEach(function(h){
    var ang=(-90+h*(720/24))*Math.PI/180;
    var r=R_IN+(h/24)*(R_OUT-R_IN)+12;
    ctx.fillStyle='rgba(140,133,125,.5)';ctx.font='600 7px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+r*Math.cos(ang),CY+r*Math.sin(ang));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var ang2=(-90+h*(720/24))*Math.PI/180;
    var r3=R_IN+(h/24)*(R_OUT-R_IN);
    var px=CX+r3*Math.cos(ang2),py=CY+r3*Math.sin(ang2);
    var filled=clkD[h]&&clkD[h]!=='none';
    ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);
    ctx.fillStyle=filled?(TC[clkD[h]]||'#ccc'):'rgba(160,155,150,.2)';ctx.fill();
    if(!filled){ctx.strokeStyle='rgba(160,155,150,.3)';ctx.lineWidth=.8;ctx.stroke();}
  }
}

function clockDraw(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var clk=interviewAnswers.timeclock||new Array(25).fill('none');
  var CX=140,CY=150,R_IN=52,R_OUT=128;
  ctx.clearRect(0,0,280,310);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(clk[i]==='none'){i++;continue;}
    var col=clk[i],st=i;
    while(i<25&&clk[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=_CLK_COLORS[col];ctx.lineWidth=14;ctx.lineCap='round';
    ctx.shadowColor=_CLK_COLORS[col];ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels
  [0,6,12,18,24].forEach(function(h){
    var p=clockPtForHour(h);var lr=p.r+18;
    var a=(-90+h*(720/24))*Math.PI/180;
    ctx.fillStyle='rgba(140,133,125,.55)';ctx.font='600 9px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+lr*Math.cos(a),CY+lr*Math.sin(a));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var p=clockPtForHour(h);var filled=clk[h]!=='none';
    ctx.save();ctx.translate(p.x,p.y);
    if(filled){
      var grd=ctx.createRadialGradient(0,0,3,0,0,20);
      grd.addColorStop(0,_CLK_COLORS[clk[h]]+'66');grd.addColorStop(1,_CLK_COLORS[clk[h]]+'00');
      ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fillStyle=_CLK_COLORS[clk[h]];ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
      ctx.fillStyle='rgba(160,155,150,.08)';ctx.fill();
      ctx.strokeStyle='rgba(160,155,150,.35)';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.fillStyle=filled?'rgba(0,0,0,.45)':'rgba(130,125,120,.6)';
    ctx.font='600 7px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,0,0.5);ctx.restore();
  }
}

function clockNearestHour(canvas,cx,cy){
  var rect=canvas.getBoundingClientRect();
  var sx=(cx-rect.left)*(280/rect.width),sy=(cy-rect.top)*(310/rect.height);
  var best=-1,bestD=999;
  for(var h=0;h<=24;h++){var p=clockPtForHour(h);var d=Math.hypot(sx-p.x,sy-p.y);if(d<bestD){bestD=d;best=h;}}
  return bestD<22?best:-1;
}

function clockInitDrag(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  clockDraw();
  var dragging=false;
  var CLK_LABELS={sleep:'שינה',work:'עבודה',social:'חברתי',other:'אחר'};
  function paint(e){
    var pt=e.touches?e.touches[0]:e;
    var h=clockNearestHour(canvas,pt.clientX,pt.clientY);if(h<0)return;
    var cat=window._clockSelCat||'sleep';
    if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
    if(interviewAnswers.timeclock[h]===cat)return;
    interviewAnswers.timeclock[h]=cat;clockDraw();
    var clk=interviewAnswers.timeclock;
    var cnts={sleep:0,work:0,social:0,other:0};
    for(var i=0;i<25;i++){if(cnts[clk[i]]!==undefined)cnts[clk[i]]++;}
    var statsEl=document.getElementById('clock-stats');
    if(statsEl){var sh='';Object.keys(cnts).forEach(function(k){if(cnts[k]>0)sh+='<div style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+_CLK_COLORS[k]+'">'+cnts[k]+'h</div><div style="font-size:9px;color:#a89e97">'+CLK_LABELS[k]+'</div></div>';});statsEl.innerHTML=sh;}
  }
  canvas.addEventListener('mousedown',function(e){dragging=true;paint(e);});
  canvas.addEventListener('mousemove',function(e){if(dragging)paint(e);});
  canvas.addEventListener('mouseup',function(){dragging=false;});
  canvas.addEventListener('touchstart',function(e){dragging=true;paint(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(dragging){paint(e);e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',function(){dragging=false;});
}


function addFlowStop(){
  var inp=document.getElementById('flow-inp');if(!inp||!inp.value.trim())return;
  if(!Array.isArray(interviewAnswers.flow))interviewAnswers.flow=[];
  interviewAnswers.flow.push(inp.value.trim());
  inp.value='';renderInterview();
  setTimeout(function(){
    var i=document.getElementById('flow-inp');
    if(i){i.focus();i.scrollIntoView({behavior:'smooth',block:'center'});}
  },60);
}
function removeFlowStop(idx){
  if(Array.isArray(interviewAnswers.flow))interviewAnswers.flow.splice(idx,1);
  renderInterview();
}

function hrPos(hr,CX,CY,R_INNER,R_OUTER){
  var ang=(-90+hr*30)*Math.PI/180;
  var r=R_INNER+(hr/23)*(R_OUTER-R_INNER);
  return {x:r2f(CX+r*Math.cos(ang)),y:r2f(CY+r*Math.sin(ang)),r:r};
}

function renderHistory(){
  var histTab=window._histTab||'intake';
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var s=d.toISOString().slice(0,10);
    var day=loadDay(s);var sum=loadSummary(s);
    var kcal=Math.round(day.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
    var p=Math.round(day.meals.reduce(function(a,m){return a+(m.p||0);},0));
    var steps=stepsOf(s);var tdee=steps>0?Math.round(2200+steps*0.04):0;
    var deficit=kcal>0&&tdee>0?tdee-kcal:0;
    var dt=new Date(s+'T12:00:00');
    days.push({date:s,kcal:kcal,p:p,deficit:deficit,label:dt.getDate()+'/'+(dt.getMonth()+1),isToday:s===todayStr()});
  }
  var active=days.filter(function(d){return d.kcal>0;});
  function makeSVG(series,refs,minV,maxV,h){
    var W=320,H=h||145,PL=40,PR=12,PT=14,PB=26,cW=W-PL-PR,cH=H-PT-PB;
    function xp(i){return PL+i*(cW/6);}function yp(v){return PT+cH*(1-(v-minV)/(maxV-minV));}
    var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
    for(var gi=0;gi<=4;gi++){var gv=minV+(maxV-minV)*gi/4;var gy=yp(gv);s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';}
    for(var ri=0;ri<refs.length;ri++){var r=refs[ri];if(r.v>=minV&&r.v<=maxV){var ry=yp(r.v);s+='<line x1="'+PL+'" y1="'+ry+'" x2="'+(PL+cW)+'" y2="'+ry+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}}
    for(var si=0;si<series.length;si++){var ser=series[si];if(si===0&&ser.pts.length>1){var ap='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi=1;pi<ser.pts.length;pi++)ap+=' L'+xp(ser.pts[pi].i)+','+yp(ser.pts[pi].v);ap+=' L'+xp(ser.pts[ser.pts.length-1].i)+','+(PT+cH)+' L'+xp(ser.pts[0].i)+','+(PT+cH)+' Z';s+='<path d="'+ap+'" fill="'+ser.col+'" opacity="0.15"/>';}if(ser.pts.length>1){var lp='M'+xp(ser.pts[0].i)+','+yp(ser.pts[0].v);for(var pi2=1;pi2<ser.pts.length;pi2++)lp+=' L'+xp(ser.pts[pi2].i)+','+yp(ser.pts[pi2].v);s+='<path d="'+lp+'" fill="none" stroke="'+ser.col+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';}for(var dp=0;dp<ser.pts.length;dp++)s+='<circle cx="'+xp(ser.pts[dp].i)+'" cy="'+yp(ser.pts[dp].v)+'" r="4" fill="'+ser.col+'" stroke="#fff" stroke-width="2"/>';}
    for(var di=0;di<days.length;di++)s+='<text x="'+xp(di)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" fill="'+(days[di].isToday?'#a690cf':'#a89e97')+'" font-weight="'+(days[di].isToday?'700':'400')+'">'+days[di].label+'</text>';
    s+='</svg>';return s;
  }
  var tabs=[['intake','צריכה יומית'],['deficit','גרעון אמיתי'],['cumulative','מצטבר']];
  var tabHTML='<div style="display:flex;gap:5px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px;margin-bottom:12px">';
  for(var ti=0;ti<tabs.length;ti++){var on=histTab===tabs[ti][0];tabHTML+='<button onclick="window._histTab=\''+tabs[ti][0]+'\';renderHistory()" style="flex:1;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:'+(on?'linear-gradient(135deg,#c9bce0,#a690cf)':'transparent')+';color:'+(on?'#fff':'#a89e97')+'">'+tabs[ti][1]+'</button>';}
  tabHTML+='</div>';
  var chartCard='';
  if(histTab==='intake'){
    var kp=[];for(var ix=0;ix<days.length;ix++)if(days[ix].kcal>0)kp.push({i:ix,v:days[ix].kcal});
    var ak=days.map(function(d){return d.kcal;}).filter(function(v){return v>0;}).concat([TARGETS.kcal]);
    var minK=ak.length>1?Math.max(0,Math.min.apply(null,ak)-200):0,maxK=Math.max.apply(null,ak)+200;
    chartCard='<div class="card"><div class="cttl">צריכה קלורית מול יעד</div>'+makeSVG([{pts:kp,col:'#e08a72'}],[{v:TARGETS.kcal,col:'#a690cf',lbl:'יעד '+TARGETS.kcal}],minK,maxK,150)+'<div style="display:flex;gap:14px;margin-top:8px;font-size:10px"><span style="color:#e08a72;font-weight:700">&#x25CF; קלוריות</span><span style="color:#a690cf">-- יעד '+TARGETS.kcal+'</span></div></div>';
  } else if(histTab==='deficit'){
    var dp=[];for(var ix2=0;ix2<days.length;ix2++)if(days[ix2].deficit>0)dp.push({i:ix2,v:days[ix2].deficit});
    var maxD=dp.length>0?Math.max.apply(null,dp.map(function(p){return p.v;}))+200:1500;
    chartCard='<div class="card"><div class="cttl">גרעון אמיתי יומי</div>'+(dp.length>0?makeSVG([{pts:dp,col:'#8fc79e'}],[{v:500,col:'#e8c162',lbl:'מינימום'}],0,maxD,150):'<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>')+'</div>';
  } else {
    // Cumulative — use full current month
    var now2=new Date();var y2=now2.getFullYear(),mo2=now2.getMonth();
    var daysInMo=new Date(y2,mo2+1,0).getDate();
    var cum=0;var cp2=[];
    for(var mi=1;mi<=daysInMo;mi++){
      var ms=y2+'-'+(mo2<9?'0':'')+(mo2+1)+'-'+(mi<10?'0':'')+mi;
      var mDay=loadDay(ms);var mSum=loadSummary(ms);
      var mKcal=Math.round(mDay.meals.reduce(function(a,m){return a+(m.kcal||0);},0));
      var mSteps=stepsOf(ms);
      var mTdee=mSteps>0?Math.round(2200+mSteps*0.04):0;
      var mDef=mKcal>0&&mTdee>0?mTdee-mKcal:0;
      if(mDef>0){cum+=mDef;cp2.push({i:cp2.length,v:cum,day:mi});}
    }
    var maxC=cum>0?Math.max(cum+500,7700):7700;
    // Custom SVG for monthly (variable point count)
    function makeSVGMo(pts,refs,maxV,hh){
      var W=320,H=hh||160,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var n=Math.max(pts.length-1,1);
      function xp3(i){return PL+i*(cW/n);}
      function yp3(v){return PT+cH*(1-v/maxV);}
      var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      for(var gi2=0;gi2<=3;gi2++){var gv2=maxV*gi2/3;var gy2=yp3(gv2);s+='<line x1="'+PL+'" y1="'+gy2+'" x2="'+(PL+cW)+'" y2="'+gy2+'" stroke="#f2ede6" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy2+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv2)+'</text>';}
      refs.forEach(function(r){if(r.v<=maxV){var ry2=yp3(r.v);s+='<line x1="'+PL+'" y1="'+ry2+'" x2="'+(PL+cW)+'" y2="'+ry2+'" stroke="'+r.col+'" stroke-width="1.5" stroke-dasharray="5,3"/>';if(r.lbl)s+='<text x="'+(PL+cW-2)+'" y="'+(ry2-3)+'" text-anchor="end" font-size="8" fill="'+r.col+'">'+r.lbl+'</text>';}});
      if(pts.length>1){
        var ap2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi5=1;pi5<pts.length;pi5++)ap2+=' L'+xp3(pi5)+','+yp3(pts[pi5].v);
        ap2+=' L'+xp3(pts.length-1)+','+(PT+cH)+' L'+xp3(0)+','+(PT+cH)+' Z';
        s+='<path d="'+ap2+'" fill="#8fc79e" opacity="0.15"/>';
        var lp2='M'+xp3(0)+','+yp3(pts[0].v);for(var pi6=1;pi6<pts.length;pi6++)lp2+=' L'+xp3(pi6)+','+yp3(pts[pi6].v);
        s+='<path d="'+lp2+'" fill="none" stroke="#8fc79e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      }
      pts.forEach(function(pt,pi7){
        s+='<circle cx="'+xp3(pi7)+'" cy="'+yp3(pt.v)+'" r="3.5" fill="#8fc79e" stroke="#fff" stroke-width="2"/>';
        if(pi7===pts.length-1||pi7===0)s+='<text x="'+xp3(pi7)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+pt.day+'</text>';
      });
      s+='</svg>';return s;
    }
    var mn3=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    chartCard='<div class="card"><div class="cttl">גרעון מצטבר &mdash; '+mn3[mo2]+' '+y2+'</div>';
    if(cp2.length>0){
      chartCard+=makeSVGMo(cp2,[{v:3500,col:'#e08a72',lbl:'~0.5קג'},{v:7000,col:'#e08a72',lbl:'~1קג'}],maxC,160);
      chartCard+='<div style="display:flex;justify-content:space-around;background:linear-gradient(135deg,#eef5ee,#f0eafa);border-radius:14px;padding:12px;margin-top:10px">';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#8fc79e">'+cum.toLocaleString()+'</div><div style="font-size:9px;color:#a89e97">גרעון (קק"ל)</div></div>';
      chartCard+='<div style="text-align:center"><div style="font-size:19px;font-weight:700;color:#a690cf">~'+(cum/7700).toFixed(2)+' קג</div><div style="font-size:9px;color:#a89e97">שומן שנשרף</div></div>';
      chartCard+='</div>';
    } else {
      chartCard+='<div style="font-size:12px;color:#a89e97;padding:24px;text-align:center">הזן צעדים בסיכום יום</div>';

  }
  var avgHTML='';
  if(active.length>0){var avgK=Math.round(active.reduce(function(a,d){return a+d.kcal;},0)/active.length);var avgP=Math.round(active.reduce(function(a,d){return a+d.p;},0)/active.length);var inT=active.filter(function(d){return d.kcal<=TARGETS.kcal;}).length;avgHTML='<div class="avgbox"><div style="font-size:10px;color:#a89e97;font-weight:700;margin-bottom:10px;letter-spacing:.1em">ממוצעים ('+active.length+' ימים)</div><div class="avgin"><div style="text-align:center"><div class="avgv" style="color:#a690cf">'+avgK+'</div><div class="avgl">קק"ל</div></div><div style="text-align:center"><div class="avgv" style="color:#e08a72">'+avgP+'g</div><div class="avgl">חלבון</div></div><div style="text-align:center"><div class="avgv" style="color:#8fc79e">'+inT+'/'+active.length+'</div><div class="avgl">ביעד</div></div></div></div>';}

function buildHomeCalHTML(){
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function loadCalReminders(ds){

function calDaySelectScope(scope){
  _calDayScope=scope;
  ['today','week','month'].forEach(function(s){
    var btn=document.getElementById('calscope-'+s);
    if(!btn)return;
    btn.style.background=s===scope?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb';

function addCalDayItem(ds){
  var inp=document.getElementById('calday-inp');
  if(!inp||!inp.value.trim())return;
  var timeInp=document.getElementById('calday-time');
  var time=timeInp?timeInp.value:'';

  // Auto-determine scope from the date
  var today=todayStr();
  var todayDate=new Date(today+'T12:00:00');
  var itemDate=new Date(ds+'T12:00:00');
  var diffDays=Math.round((itemDate-todayDate)/(1000*60*60*24));
  var scope;
  if(diffDays===0) scope='today';
  else if(diffDays>0&&diffDays<=7) scope='week';
  else scope='month';

  var data=loadReminders();
  if(!data[scope])data[scope]=[];
  data[scope].push({text:inp.value.trim(),type:_calDayType,status:'open',date:ds,time:time});
  saveReminders(data);
  inp.value='';
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function deleteCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab])data[tab].splice(idx,1);
  saveReminders(data);
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function toggleCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab]&&data[tab][idx]){
    var cur=data[tab][idx].status||'open';
    data[tab][idx].status=cur==='done'?'open':'done';
    saveReminders(data);
  }
  closeCalDay();openCalDay(ds);
  renderReminders();
}

var _coachAnswers={};
var _coachStep=0;

var COACH_QUESTIONS=[
  {id:'experience',q:'האם אי פעם אימנת בחדר כושר?',type:'choice',
   options:['כן, אני מנוסה','כן, אני מתאמן באופן סדיר','לא, אני חדש']},
  {id:'equipment',q:'איזה ציוד יש לך גישה?',type:'choice',
   options:['חדר כושר מלא','משקולות יד ביתי','עניבות/TRX בלבד','בלי ציוד כלל']},
  {id:'days',q:'כמה פעמים בשבוע תוכל להתאמן?',type:'choice',
   options:['2-3','3-4','4-5','5+']},
  {id:'goal',q:'מה המטרה עיקרית שלך?',type:'choice',
   options:['בניית שריר','ירידת שומן','שיפור כוח כללי','כושר ובריאות']},
  {id:'session',q:'כמה זמן יש לך לכל אימון?',type:'choice',
   options:['30-45 דקות','45-60 דקות','60-75 דקות','75+ דקות']},
  {id:'limit',q:'יש איזשהו מגבלה פיזית?',type:'text',placeholder:'למשל: כאב גב, ברך... (או לא אם אין)'}
];

function renderCoachQuestionnaire(){
  var q=COACH_QUESTIONS[_coachStep];
  var h='<div style="padding:20px 0">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;margin-bottom:8px">שאלה '+(_coachStep+1)+' מתוך '+COACH_QUESTIONS.length+'</div>';
  h+='<div style="font-size:20px;font-weight:800;color:#4a4340;margin-bottom:24px;line-height:1.4">'+q.q+'</div>';
  if(q.type==='choice'){
    h+='<div style="display:flex;flex-direction:column;gap:10px">';
    for(var oi=0;oi<q.options.length;oi++){
      var opt=q.options[oi];var isSel=_coachAnswers[q.id]===opt;
      h+='<button onclick="coachSelectOption(\''+q.id+'\','+oi+')" style="background:'+(isSel?'linear-gradient(135deg,#c9bce0,#a690cf)':'#fff')+';border:2px solid '+(isSel?'#a690cf':'#f0ebe3')+';border-radius:16px;padding:14px 18px;font-size:13px;font-weight:700;cursor:pointer;color:'+(isSel?'#fff':'#4a4340')+';text-align:right">'+esc(opt)+'</button>';
    }
    h+='</div>';
  } else {
    h+='<textarea id="coach-text-inp" class="q-input" rows="3" placeholder="'+(q.placeholder||'')+'" style="min-height:80px">'+(  _coachAnswers[q.id]||'')+'</textarea>';
  }
  h+='<div style="display:flex;gap:10px;margin-top:24px">';
  if(_coachStep>0)h+='<button onclick="_coachStep--;renderFitness()" style="background:#f5f0eb;border:none;border-radius:14px;padding:14px 20px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='<button onclick="coachNextStep()" style="flex:1;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">'+(_coachStep===COACH_QUESTIONS.length-1?'בנה תוכנית &#10003;':'המשך &#8594;')+'</button>';
  h+='</div></div>';
  document.getElementById('hdr-title').textContent='מאמן אישי';
  document.getElementById('content').innerHTML=h;
}

function coachSelectOption(id,oi){
  var q=COACH_QUESTIONS.find(function(x){return x.id===id;});
  if(q)_coachAnswers[id]=q.options[oi];
  renderFitness();
}
function coachNextStep(){
  var q=COACH_QUESTIONS[_coachStep];
  if(q.type==='text'){var inp=document.getElementById('coach-text-inp');if(inp)_coachAnswers[q.id]=inp.value.trim()||'לא';}
  if(!_coachAnswers[q.id]){showToast('בחר תשובה');return;}
  if(_coachStep<COACH_QUESTIONS.length-1){_coachStep++;renderFitness();}
  else{buildCoachPlan();}
}

function buildCoachPlan(){
  document.getElementById('content').innerHTML=
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;text-align:center;padding:40px 20px">'+
    '<div style="font-size:44px;margin-bottom:16px;animation:plane-fly 1.5s ease-in-out infinite">&#x1F9E0;</div>'+
    '<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">בונה תוכנית...</div>'+
    '<div style="font-size:13px;color:#a89e97">מנתח את המידע ובונה עבורך</div>'+
    '</div>';
  var a=_coachAnswers;
  var prompt='אתה מאמן כושר אישי. בנה תוכנית אימון שבועית מלאה בעברית:\n'+
    '- ניסיון: '+a.experience+'\n- ציוד: '+a.equipment+'\n- ימי אימון: '+a.days+'\n- מטרה: '+a.goal+'\n- זמן: '+a.session+'\n- מגבלות: '+a.limit+'\n\n'+
    'החזר JSON בלבד סלל טקסט נוסף:\n'+
    '{"summary":"תיאור קצר","daysPerWeek":"טקסט","equipment":"הציוד","days":[{"name":"שם אימון","focus":"קבוצת שריר","exercises":[{"name":"שם","sets":3,"reps":"8-12","note":"הערה"}]}]}';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var text=data.content.map(function(i){return i.text||'';}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var plan=JSON.parse(clean);
    plan.answers=a;saveCoachPlan(plan);_fitView='coach-plan';renderFitness();
  })
  .catch(function(){showToast('שגיאה בבניית התוכנית');_fitView='home';renderFitness();});
}

  h+='<div style="background:rgba(255,255,255,.6);border-radius:10px;padding:7px 12px;font-size:11px;font-weight:700;color:#a690cf">'+esc(plan.equipment||'')+'</div>';

  var days=plan.days||[];
  days.forEach(function(day,di){

/* ── STEPS SCREEN ──
   One screen for the day's step count, whoever wrote it. A Garmin watch, an
   Apple Watch and most fitness apps all write their steps into Apple Health on
   the phone, so a single reader covers all three rather than three separate
   integrations - none of which would be reachable from a web app anyway. */
function stepsAgo(iso){
  if(!iso)return'';
  var m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return'עכשיו';
  if(m<60)return'לפני '+m+' דק׳';
  var hr=Math.round(m/60);
  if(hr<24)return'לפני '+hr+' שע׳';
  return'לפני '+Math.round(hr/24)+' ימים';
}

function copyText(t,what){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){showToast('✓ '+(what||'הטקסט')+' הועתק');},function(){showToast('לא ניתן להעתיק');});
  } else showToast('לא ניתן להעתיק');
}

/* A shortcut hands the count over by opening the app with #steps=<n> on the
   URL. The fragment never leaves the device - it is not sent to the server -
   and it is stripped from the address bar as soon as it is read. */
function ingestStepsFromLink(){
  var hash=location.hash||'';
  var m=/[#&]steps=(\d{1,7})\b/.exec(hash);
  if(!m)return;
  var dm=/[#&]d=(\d{4}-\d{2}-\d{2})\b/.exec(hash);
  var d=dm?dm[1]:todayStr(),n=parseInt(m[1],10);
  saveSteps(d,n,'shortcut');
  var s=loadStepsSrc();s.kind='shortcut';s.last=new Date().toISOString();saveStepsSrc(s);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}
  showToast('✓ נקלטו '+n.toLocaleString()+' צעדים');
}

  var title=DAY_NAMES[dayIdx]+' (שבוע '+(weekIdx+1)+')';
  document.getElementById('hdr-title').textContent=title;

  var h='<div style="padding-bottom:20px">';
  h+='<div style="font-size:16px;font-weight:800;color:#4a4340;margin-bottom:16px">'+title+'</div>';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">בחר סוג אימון</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">';
  for(var ti=0;ti<WORKOUT_TYPES.length;ti++){
    var wt=WORKOUT_TYPES[ti];
    var isSel=entry.type===wt.id;
    h+='<button onclick="setWeekDayType(\''+wt.id+'\')" style="border:2px solid '+(isSel?wt.color:'#f0ebe3')+';border-radius:14px;padding:12px 6px;cursor:pointer;background:'+(isSel?wt.color+'22':'#fff')+';display:flex;flex-direction:column;align-items:center;gap:4px">';
    h+='<span style="font-size:22px">'+wt.emoji+'</span>';
    h+='<span style="font-size:11px;font-weight:700;color:'+(isSel?wt.color:'#4a4340')+'">'+wt.label+'</span>';
    h+='</button>';
  }
  h+='</div>';

  if(entry.type!=='rest'){
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">תווית / שם האימון (אופציונלי)</div>';
    h+='<input id="wday-label" class="mtin" value="'+esc(entry.label||'')+'" placeholder="למשל: רגליים, Push...">';
    h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:4px">הערה (אופציונלי)</div>';
    h+='<input id="wday-note" class="mtin" value="'+esc(entry.note||'')+'" placeholder="זמן, עצימות...">';
  }

  h+='<div style="display:flex;gap:8px;margin-top:16px">';
  h+='<button onclick="saveWeekDay()" style="flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">שמור</button>';
  h+='<button onclick="_fitView=\'weekly-plan\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:14px;padding:13px 16px;font-size:13px;cursor:pointer;color:#a89e97">ביטול</button>';
  h+='</div></div>';
  document.getElementById('content').innerHTML=h;
  window._editWeekEntry=JSON.parse(JSON.stringify(entry));
}

function setWeekDayType(typeId){
  if(!window._editWeekEntry)window._editWeekEntry={type:'rest',label:'',note:''};
  window._editWeekEntry.type=typeId;
  var weekPlan=loadWeekPlan();
  weekPlan[_editWeekDay]=window._editWeekEntry;
  saveWeekPlan(weekPlan);
  renderEditWeekDay();
}

function saveWeekDay(){
  var weekPlan=loadWeekPlan();
  var entry=window._editWeekEntry||{type:'rest',label:'',note:''};
  var labelInp=document.getElementById('wday-label');
  var noteInp=document.getElementById('wday-note');
  if(labelInp)entry.label=labelInp.value.trim();
  if(noteInp)entry.note=noteInp.value.trim();
  weekPlan[_editWeekDay]=entry;
  saveWeekPlan(weekPlan);
  _fitView='weekly-plan';renderFitness();
}

function copyWeekToWeek2(){
  var weekPlan=loadWeekPlan();
  for(var d=0;d<7;d++){
    var src=weekPlan['w0d'+d];
    if(src)weekPlan['w1d'+d]=JSON.parse(JSON.stringify(src));
  }
  saveWeekPlan(weekPlan);
  renderWeeklyPlan();
  showToast('שבוע 1 הועתק לשבוע 2 &#10003;');
}

function wizQ(text){
  return '<div style="font-size:18px;font-weight:800;color:#4a4340;margin-bottom:18px;line-height:1.4">'+text+'</div>';
}
function wizChip(label,onclick,active){
  return '<button onclick="'+onclick+'" style="border:none;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;background:'+(active?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb')+';color:'+(active?'#fff':'#4a4340')+'">'+esc(label)+'</button>';
}

function finalizeProgramWizard(){
  var progs=loadPrograms();
  var prog={
    id:_wiz.prog.id||Date.now(),
    name:_wiz.prog.name,
    splitType:_wiz.prog.splitType,
    daysPerWeek:_wiz.prog.daysPerWeek,
    goal:_wiz.prog.goal,
    exercises:[] // flat list from all days
  };
  // Store all days' exercises flat for the view-program tracker
  var allEx=[];
  for(var di=0;di<_wiz.days.length;di++){
    var day=_wiz.days[di];
    for(var ei=0;ei<day.exercises.length;ei++){
      var ex=day.exercises[ei];
      ex.day=day.name;
      allEx.push(ex);
    }
  }
  prog.exercises=allEx;
  if(_fitProgIdx>=0)progs[_fitProgIdx]=prog;
  else progs.push(prog);
  savePrograms(progs);
  _fitProgIdx=progs.indexOf(prog);
  showToast('✓ '+prog.name+' נשמרה!');
  _fitView='view-program';renderFitness();
}

function removeProgEx(ei){if(window._editProg)window._editProg.exercises.splice(ei,1);renderEditProgram();}
function saveProgram(){finalizeProgramWizard();}
function deleteProgram(){
  var progs=loadPrograms();progs.splice(_fitProgIdx,1);savePrograms(progs);
  _fitView='home';renderFitness();
}

function renderViewProgram(){
  var progs=loadPrograms();

  var h='<div style="padding-bottom:20px">';

  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

  for(var ei=0;ei<prog.exercises.length;ei++){
    var ex=prog.exercises[ei];
    var exLog=loadProgLog(prog.id,ex.name);
    var lastEntry=exLog.length>0?exLog[exLog.length-1]:null;
    var pr=exLog.length>0?Math.max.apply(null,exLog.map(function(e){return e.weight;})):0;

    h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
    // Exercise header
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
    h+='<div><div style="font-size:14px;font-weight:800;color:#4a4340">'+esc(ex.name)+'</div>';
    h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+ex.sets+' סט &times; '+ex.targetReps+' חזר</div></div>';
    if(pr>0)h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:6px 10px;text-align:center"><div style="font-size:14px;font-weight:800;color:#b45309">'+pr+'kg</div><div style="font-size:8px;color:#b45309;font-weight:700">PR</div></div>';
    h+='</div>';

    // Last entry
    if(lastEntry){
      var dd=new Date(lastEntry.date);
      h+='<div style="background:#f5f0eb;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#6a6360">';
      h+='אחרון: '+lastEntry.weight+'kg &times; '+lastEntry.reps+' חזר &mdash; '+dd.getDate()+'/'+(dd.getMonth()+1);
      h+='</div>';
    }

    // Log new entry
    h+='<div style="display:flex;gap:6px;align-items:center">';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">kg</div>';
    h+='<input id="prog-w-'+ei+'" class="mtnm" type="number" step="0.5" placeholder="'+(lastEntry?lastEntry.weight:ex.baseWeight||0)+'" style="width:100%"></div>';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">חזרות</div>';
    h+='<input id="prog-r-'+ei+'" class="mtnm" type="number" placeholder="'+ex.targetReps+'" style="width:100%"></div>';
    h+='<button onclick="logProgEntry('+_fitProgIdx+','+ei+')" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;align-self:flex-end">רשום</button>';
    h+='</div>';

    // Mini history chart
    if(exLog.length>1){
      var recent=exLog.slice(-8);
      var maxW=Math.max.apply(null,recent.map(function(e){return e.weight;}));
      var minW=Math.max(0,Math.min.apply(null,recent.map(function(e){return e.weight;}))-5);
      var W=280,H=50,PL=0,PT=4,PB=14,cW=W,cH=H-PT-PB;
      var n=Math.max(recent.length-1,1);
      function xp(i){return PL+i*(cW/n);}
      function yp(v){return PT+cH*(1-(v-minW)/(maxW-minW||1));}
      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:10px">';
      if(recent.length>1){
        var lp='M'+xp(0)+','+yp(recent[0].weight);
        for(var ri=1;ri<recent.length;ri++)lp+=' L'+xp(ri)+','+yp(recent[ri].weight);
        svg+='<path d="'+lp+'" fill="none" stroke="#a690cf" stroke-width="2" stroke-linecap="round"/>';
      }
      recent.forEach(function(e,ri){
        var isPR=e.weight>=pr;
        svg+='<circle cx="'+xp(ri)+'" cy="'+yp(e.weight)+'" r="'+(isPR?5:3)+'" fill="'+(isPR?'#e8c162':'#a690cf')+'" stroke="#fff" stroke-width="1.5"/>';
        svg+='<text x="'+xp(ri)+'" y="'+(H-1)+'" text-anchor="middle" font-size="8" fill="#c0b8b0">'+e.weight+'</text>';
      });
      svg+='</svg>';
      h+=svg;
    }

    h+='</div>';
  }
  h+='</div>';
  document.getElementById('hdr-title').textContent=esc(prog.name);
  document.getElementById('content').innerHTML=h;
}

function logProgEntry(progIdx,exIdx){
  var progs=loadPrograms();var prog=progs[progIdx];
  if(!prog||!prog.exercises[exIdx])return;
  var ex=prog.exercises[exIdx];
  var wInp=document.getElementById('prog-w-'+exIdx);
  var rInp=document.getElementById('prog-r-'+exIdx);
  var weight=parseFloat(wInp&&wInp.value)||0;
  var reps=parseInt(rInp&&rInp.value)||ex.targetReps;
  if(!weight){showToast('הזן משקל');return;}
  var log=loadProgLog(prog.id,ex.name);
  log.push({date:Date.now(),weight:weight,reps:reps});
  saveProgLog(prog.id,ex.name,log);
  // Check PR
  var prevPR=log.slice(0,-1).reduce(function(m,e){return Math.max(m,e.weight);},0);
  if(weight>prevPR&&prevPR>0)showToast('&#9733; PR חדש! '+weight+'kg ב'+ex.name);
  else showToast('✓ נרשם!');
  renderViewProgram();
}

function logSet(){
  if(!_fitWorkout)return;
  var w=document.getElementById('fit-w');var r=document.getElementById('fit-r');var rpeInp=document.getElementById('fit-rpe');
  var weight=parseFloat(w?w.value:0)||0;var reps=parseInt(r?r.value:0)||0;
  var rpe=rpeInp&&rpeInp.value?parseFloat(rpeInp.value):null;
  if(!reps)return;
  var ex=_fitWorkout.exercises[_fitWorkout.currentEx];
  ex.sets.push({weight:weight,reps:reps,rpe:rpe});
  // Update PR
  if(weight>0){
    var prs=loadPRs();var key=ex.name;
    if(weight>(prs[key]||0)){prs[key]=weight;savePRs(prs);showToast('&#9733; PR חדש! '+weight+'kg ב'+key);}
  }
  renderFitness();
}

function removeSet(idx){
  if(!_fitWorkout)return;
  _fitWorkout.exercises[_fitWorkout.currentEx].sets.splice(idx,1);
  renderFitness();
}

function finishWorkout(){
  if(!_fitWorkout)return;
  var w=_fitWorkout;
  var log=loadWorkoutLog();
  var entry={
    date:Date.now(),name:w.name,
    duration:Math.floor((Date.now()-w.startTime)/60000),
    exercises:w.exercises.map(function(ex){
      return{name:ex.name,targetSets:ex.targetSets,targetReps:ex.targetReps,sets:ex.sets.slice()};
    })
  };
  log.push(entry);saveWorkoutLog(log);
  _fitWorkout=null;
  _fitView='summary';
  _fitSummaryEntry=entry;
  renderFitness();
}

var _fitSummaryEntry=null;

function calcRPE(weight,reps,targetReps){
  // Rough RPE: if reps === target → ~7, more → lower, fewer → higher
  var diff=reps-targetReps;
  if(diff>=3)return 5;
  if(diff===2)return 6;
  if(diff===1)return 6.5;
  if(diff===0)return 7.5;
  if(diff===-1)return 8.5;
  if(diff<=-2)return 9.5;
  return 7;
}

function renderFitSummary(){
  var entry=_fitSummaryEntry;
  if(!entry){_fitView='home';renderFitness();return;}
  var log=loadWorkoutLog();
  var prev=null;
  for(var i=log.length-2;i>=0;i--){if(log[i].name===entry.name){prev=log[i];break;}}
  var prs=loadPRs();

  // RPE color by spec: <6 green, 6-7.4 amber, 7.5-8.9 orange, ≥9 coral, null gray
  function rpeColor(rpe){
    if(rpe===null||rpe===undefined)return '#ADA79A';
    if(rpe<6)return '#4C9A4C';
    if(rpe<7.5)return '#E0A020';
    if(rpe<9)return '#E0691E';
    return '#D33A2C';
  }

  // Totals — volume only on weighted exercises (spec 4.1)
  var totalSets=0,rpeSum=0,rpeCount=0,totalVol=0;
  entry.exercises.forEach(function(ex){
    ex.sets.forEach(function(s){
      totalSets++;
      if(s.weight>0)totalVol+=(s.weight||0)*(s.reps||0);
      if(s.rpe!=null){rpeSum+=s.rpe;rpeCount++;}
    });
  });
  var avgRPE=rpeCount>0?Math.round(rpeSum/rpeCount*10)/10:null;
  var maxVol=0;
  entry.exercises.forEach(function(ex){
    var v=ex.sets.reduce(function(a,s){return a+(s.weight>0?(s.weight||0)*(s.reps||0):0);},0);
    if(v>maxVol)maxVol=v;
  });

  var d2=new Date(entry.date);
  var dateStr=d2.getDate()+'/'+(d2.getMonth()+1)+'/'+d2.getFullYear();
  var h='<div style="background:#FAF6EF;min-height:100vh;padding-bottom:40px">';

  // Header
  h+='<div style="font-size:11px;color:#9A9184;margin-bottom:4px;font-weight:500">'+esc(entry.name)+' &middot; '+dateStr+'</div>';
  h+='<div style="font-size:20px;font-weight:800;color:#3A3530;margin-bottom:16px">איך הלך האימון?</div>';

  // 4.1 Hero stats
  h+='<div style="display:flex;gap:10px;margin-bottom:16px">';
  [{num:totalSets,lbl:'סטים'},{num:avgRPE!==null?avgRPE:'לא דורג',lbl:'RPE ממוצע'},{num:totalVol>0?Math.round(totalVol):0,lbl:'ק"ג נפח'}].forEach(function(s){
    h+='<div style="flex:1;background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px rgba(58,53,48,.06)">';
    h+='<div style="font-size:20px;font-weight:800;color:#3A3530">'+s.num+'</div>';
    h+='<div style="font-size:10px;color:#9A9184;margin-top:3px">'+s.lbl+'</div></div>';
  });
  h+='</div>';

  // 4.2 vs previous (only from 2nd session onward)
  if(prev){
    h+='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(58,53,48,.06)">';
    h+='<div style="font-size:13px;font-weight:700;color:#3A3530;margin-bottom:10px">לעומת הפעם הקודמת</div>';
    h+='<table style="width:100%;border-collapse:collapse;table-layout:fixed">';
    h+='<colgroup><col style="width:38%"><col style="width:22%"><col style="width:22%"><col style="width:18%"></colgroup>';
    h+='<thead><tr>';
    h+='<th style="font-size:10px;color:#9A9184;font-weight:600;text-align:right;padding:0 4px 8px;border-bottom:2px solid #3A3530">תרגיל</th>';
    h+='<th style="font-size:10px;color:#9A9184;font-weight:600;text-align:center;padding:0 4px 8px;border-bottom:2px solid #3A3530">קודם</th>';
    h+='<th style="font-size:10px;color:#9A9184;font-weight:600;text-align:center;padding:0 4px 8px;border-bottom:2px solid #3A3530">עכשיו</th>';
    h+='<th style="font-size:10px;color:#9A9184;font-weight:600;text-align:center;padding:0 4px 8px;border-bottom:2px solid #3A3530"></th>';
    h+='</tr></thead><tbody>';
    entry.exercises.forEach(function(ex){
      var curMax=ex.sets.length?Math.max.apply(null,ex.sets.map(function(s){return s.weight||0;})):0;
      var prevEx=prev.exercises.find(function(e){return e.name===ex.name;});
      var prevMax=prevEx&&prevEx.sets.length?Math.max.apply(null,prevEx.sets.map(function(s){return s.weight||0;})):null;
      var arrow=prevMax===null?'&#8212;':curMax>prevMax?'<span style="color:#4C9A4C">&#11014;</span>':curMax<prevMax?'<span style="color:#D33A2C">&#11015;</span>':'<span style="color:#ADA79A">&#10132;</span>';
      h+='<tr><td style="font-size:11px;font-weight:700;text-align:right;padding:8px 4px;border-bottom:1px solid #E6E1D6;overflow:hidden;text-overflow:ellipsis">'+esc(ex.name)+'</td>';
      h+='<td style="font-size:11px;text-align:center;padding:8px 4px;border-bottom:1px solid #E6E1D6;color:#9A9184">'+(prevMax!==null?prevMax+'ק"':'לא')+'</td>';
      h+='<td style="font-size:11px;text-align:center;padding:8px 4px;border-bottom:1px solid #E6E1D6;font-weight:700">'+curMax+'ק"</td>';
      h+='<td style="text-align:center;padding:8px 4px;border-bottom:1px solid #E6E1D6;font-size:14px">'+arrow+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  // 4.3 Exercise table — rowspan per exercise
  h+='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(58,53,48,.06)">';
  h+='<div style="font-size:13px;font-weight:700;color:#3A3530;margin-bottom:10px">Exercises</div>';
  h+='<table style="width:100%;border-collapse:collapse;table-layout:fixed">';
  h+='<colgroup><col style="width:36%"><col style="width:14%"><col style="width:20%"><col style="width:18%"><col style="width:12%"></colgroup>';
  h+='<thead><tr>';
  ['תרגיל','סט','משקל','חזרות',''].forEach(function(lbl,i){
    var align=i===0?'right':'center';
    h+='<th style="font-size:10px;font-weight:600;color:#3A3530;text-align:'+align+';padding:0 3px 8px;border-bottom:2px solid #3A3530">'+lbl+'</th>';
  });
  h+='</tr></thead><tbody>';

  entry.exercises.forEach(function(ex,ei){
    var ns=ex.sets.length||1;
    ex.sets.forEach(function(s,si){
      var isFirst=si===0;
      // RPE dot — use actual s.rpe if present, else gray
      var dc=rpeColor(s.rpe!=null?s.rpe:null);
      var isPR=prs[ex.name]&&s.weight>=prs[ex.name]&&s.weight>0;
      h+='<tr style="border-top:'+(isFirst?'1.5px solid #3A3530':'none')+'">';
      if(isFirst){
        h+='<td style="font-size:11px;font-weight:700;text-align:right;padding:8px 3px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #E6E1D6" rowspan="'+ns+'">'+esc(ex.name)+'</td>';
      }
      h+='<td style="font-size:11px;text-align:center;padding:8px 3px;border-bottom:1px solid #E6E1D6;color:#9A9184">'+(si+1)+'</td>';
      h+='<td style="font-size:11px;text-align:center;padding:8px 3px;border-bottom:1px solid #E6E1D6">'+(s.weight>0?s.weight+'ק"':'BW')+'</td>';
      var fail=s.reps<(ex.targetReps||10)&&s.weight>0?' <span style="font-size:9px;color:#D33A2C">(כשל)</span>':'';
      h+='<td style="font-size:11px;text-align:center;padding:8px 3px;border-bottom:1px solid #E6E1D6">'+s.reps+fail+'</td>';
      h+='<td style="text-align:center;padding:8px 3px;border-bottom:1px solid #E6E1D6">';
      h+='<span style="width:9px;height:9px;border-radius:50%;background:'+dc+';display:inline-block"></span>';
      if(isPR)h+=' <span style="font-size:9px;color:#E0A020;font-weight:700">PR</span>';
      h+='</td></tr>';
    });
  });
  h+='</tbody></table>';

  // RPE legend
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:10px;color:#9A9184;justify-content:center">';
  [['#4C9A4C','<6 קל'],['#E0A020','6-7.4'],['#E0691E','7.5-8.9'],['#D33A2C','9+ כבד'],['#ADA79A','לא דורג']].forEach(function(c){
    h+='<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:'+c[0]+';display:inline-block;flex-shrink:0"></span>'+c[1]+'</span>';
  });
  h+='</div></div>';

  // 4.5 Volume bars — horizontal
  h+='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(58,53,48,.06)">';
  h+='<div style="font-size:13px;font-weight:700;color:#3A3530;margin-bottom:12px">נפח עבודה</div>';
  entry.exercises.forEach(function(ex){
    var vol=ex.sets.reduce(function(a,s){return a+(s.weight>0?(s.weight||0)*(s.reps||0):0);},0);
    var pct=maxVol>0?Math.round(vol/maxVol*100):0;
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
    h+='<div style="width:90px;font-size:10px;flex-shrink:0;color:#3A3530;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(ex.name)+'</div>';
    h+='<div style="flex:1;background:#EFE9DD;border-radius:6px;height:10px;overflow:hidden">';
    h+='<div style="height:100%;width:'+pct+'%;background:#2E6B62;border-radius:6px;transition:width .8s"></div></div>';
    h+='<div style="width:44px;text-align:right;font-size:10px;color:#9A9184;flex-shrink:0">'+vol+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // 4.4 Goals for next
  h+='<div style="background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(58,53,48,.06)">';
  h+='<div style="font-size:13px;font-weight:700;color:#3A3530;margin-bottom:10px">מטרות לאימון הבא</div>';
  entry.exercises.forEach(function(ex){
    var curMax=ex.sets.length?Math.max.apply(null,ex.sets.map(function(s){return s.weight||0;})):0;
    var allGood=ex.sets.length&&ex.sets.every(function(s){return s.reps>=(ex.targetReps||10);});
    var nextW=Math.round((curMax+2.5)*2)/2;
    var suggestion=curMax===0?'התמקד על טכניקה':allGood?'נסה '+nextW+' ק"ג':'הישאר על '+curMax+' ק"ג, ישימות על טכניקה';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #E6E1D6;gap:10px">';
    h+='<span style="font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis">'+esc(ex.name)+'</span>';
    h+='<span style="font-size:11px;color:#9A9184;text-align:right">'+suggestion+'</span></div>';
  });
  h+='</div>';

  // 4.6 Closing card
  var bestEx=entry.exercises.reduce(function(best,ex){
    var v=ex.sets.reduce(function(a,s){return a+(s.weight>0?(s.weight||0)*(s.reps||0):0);},0);
    return v>best.vol?{name:ex.name,vol:v}:best;
  },{name:'',vol:0});
  h+='<div style="background:#D6ECE8;color:#2E6B62;border-radius:16px;padding:16px;font-size:13px;line-height:1.7;margin-bottom:16px">';
  if(bestEx.name)h+='<div style="margin-bottom:6px"><b style="font-weight:800">הבולט ביותר:</b> '+esc(bestEx.name)+' עם '+Math.round(bestEx.vol).toLocaleString()+' ק"ג נפח.</div>';
  h+='<div><b style="font-weight:800">סה"כ:</b> '+totalSets+' סטים'+(avgRPE!==null?', RPE ממוצע '+avgRPE+'. '+(avgRPE>=9?'עומס כבד — שים לב להתאוששות.':avgRPE>=7.5?'אימון טוב — באזור העלייה.':'אימון נוח. אפשר להעלות במשקל.'):'.')+' אין דיווח כאב.</div>';
  h+='</div>';

  // Action buttons
  h+='<div style="display:flex;gap:10px">';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="flex:1;background:#f5f0eb;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97">חזרה &#8249;</button>';
  h+='<button onclick="_fitView=\'history\';renderFitness()" style="flex:1;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#fff">כל האימונים</button>';
  h+='</div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div style="font-size:15px;font-weight:800;color:#4a4340">היסטוריית אימונים</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; חזרה</button>';
  h+='</div>';

    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    h+='<div style="font-size:14px;font-weight:700;color:#4a4340">'+esc(entry.name)+'</div>';
    h+='<div style="font-size:10px;color:#a89e97">'+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+'</div>';
    h+='</div>';
    h+='<div style="display:flex;gap:14px;font-size:11px;color:#a89e97">';

    h+='<span>'+entry.duration+' דק</span>';
