<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f0eb;color:#4a4340;direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 100px}
.hdr{background:linear-gradient(135deg,#f0ebe3,#e8dff5);padding:16px 16px 12px;position:sticky;top:0;z-index:10}
.hdr-date{text-align:center;font-size:11px;color:#a89e97;margin-bottom:3px}
.hdr-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-nav{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nav-arrow{background:#fff;border:none;border-radius:12px;width:34px;height:34px;flex-shrink:0;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.2)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.6);border-radius:14px;padding:4px;flex:1;min-width:0}
.tab{flex:1;padding:7px 4px;border:none;border-radius:11px;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#a89e97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.content{padding:14px 14px 0}
/* The game is a whole page of its own - dark, full-bleed, with its own CSS
   reset - so it runs inside an iframe instead of fighting the app's styles. */
.app.game-mode{padding-bottom:0}
.game-wrap{border-radius:22px;overflow:hidden;background:#160d06;box-shadow:0 4px 18px rgba(120,80,40,.22)}
.game-frame{display:block;width:100%;height:520px;border:0}
.macro-card{background:#fff;border-radius:22px;padding:18px 16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.macro-title{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;text-align:center;margin-bottom:14px}
.macro-bars{display:flex;gap:10px;justify-content:center;align-items:flex-end}
.macro-col{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.macro-pct{font-size:11px;color:#a89e97;font-weight:600}
.macro-track{width:34px;height:100px;background:#f2ede6;border-radius:17px;overflow:hidden;position:relative}
.macro-fill{width:100%;height:0%;border-radius:17px;position:absolute;bottom:0;transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.macro-val{font-size:16px;font-weight:700}
.macro-lbl{font-size:11px;color:#a89e97}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pill{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(200,180,160,.1)}
.pill-val{font-size:17px;font-weight:700}
.pill-lbl{font-size:9.5px;color:#a89e97;margin-top:2px}
.wcard{background:linear-gradient(135deg,#e8f4fd,#dbeef9);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.whd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wt{font-size:13px;font-weight:700;color:#3a7ca5}
.wn{font-size:12px;color:#5b8fa8;font-weight:600}
.wb{height:6px;background:rgba(255,255,255,.5);border-radius:3px;margin-bottom:10px;overflow:hidden}
.wf{height:100%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:3px;width:0%;transition:width .6s}
.wbtns{display:flex;gap:7px}
.wadd{flex:1;background:#fff;border:none;border-radius:11px;padding:8px;font-size:12px;font-weight:700;color:#3a7ca5;cursor:pointer}
.wreset{background:rgba(255,255,255,.7);border:none;border-radius:11px;padding:8px 10px;font-size:16px;cursor:pointer}
/* Steps, mirroring the water card that sits right above it. Read-only here -
   the number is written by whatever source was connected under כושר, and
   tapping the card goes there. */
.scard{display:block;width:100%;text-align:right;font-family:inherit;border:none;cursor:pointer;background:linear-gradient(135deg,#eaf5ee,#dcf0e3);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.st{font-size:13px;font-weight:700;color:#4c9a4c}
.sn{font-size:11px;color:#6fb283;font-weight:600}
.sv{font-size:24px;font-weight:800;color:#4c9a4c;line-height:1}
.sk{font-size:11px;color:#6fb283;font-weight:600}
.sempty{font-size:12px;color:#6fb283;line-height:1.5}
.qacard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.qatog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.qalbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.qaarro{font-size:14px;color:#a89e97;transition:transform .2s}
.qalist{padding:0 10px 12px}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{flex:1;min-width:58px;padding:7px 4px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:#f2ede6;color:#a89e97}
.cat-tab.on{background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff}
.comp-meal{display:flex;align-items:center;gap:10px;background:#fbf7f2;border-radius:12px;padding:9px 10px;margin-bottom:6px}
.comp-meal-info{flex:1}
.comp-meal-name{font-size:12.5px;font-weight:700;color:#4a4340}
.comp-meal-mac{font-size:10px;color:#a89e97;margin-top:1px}
.comp-add-btn{background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.comp-del-btn{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:3px 6px;flex-shrink:0}
.new-comp-btn{width:100%;background:rgba(243,185,168,.12);border:1.5px dashed #e08a72;border-radius:12px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#e08a72;margin-top:4px}
.lbtn{width:100%;display:flex;align-items:center;gap:10px;background:#fbf7f2;border:none;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px}
.lnm{font-size:12.5px;font-weight:700;color:#4a4340}
.lmac{font-size:10px;color:#a89e97;margin-top:1px}
.ldel{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:14px;padding:4px 6px;margin-right:auto;flex-shrink:0}
.qkc{font-size:10px;font-weight:700;color:#a89e97;flex-shrink:0;text-align:left;line-height:1.3}
.confirm-card{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:14px;margin:0 0 10px;border:2px solid #c9bce0}
.confirm-name{font-size:14px;font-weight:700;color:#4a4340;margin-bottom:4px}
.confirm-mac{font-size:11px;color:#a89e97;margin-bottom:12px}
.confirm-btns{display:flex;gap:8px}
.confirm-yes{flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.confirm-no{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97}
.mtbtn{width:100%;border:none;border-radius:16px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px}
.mtbtn.cl{background:#fff;color:#a690cf;box-shadow:0 4px 14px rgba(200,180,160,.1)}
.mtbtn.op{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;border-radius:16px 16px 0 0}

.mtin{width:100%;border:1.5px solid #f2ede6;border-radius:10px;padding:10px 12px;font-size:13px;direction:rtl;outline:none;margin-bottom:10px}
.mtin:focus{border-color:#a690cf}
.mtgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mtfl{font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px;text-align:center}
.mtnm{width:100%;border:1.5px solid #f2ede6;border-radius:8px;padding:7px 4px;font-size:13px;text-align:center;outline:none}
.addbtn{width:100%;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.lib-save-btn{width:100%;background:linear-gradient(135deg,#f0eafa,#eaf5ee);border:none;border-radius:11px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#a690cf;margin-bottom:8px}
.lib-save-btn.saved{background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff}
.log-card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(200,180,160,.08)}
.log-title{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f5f0eb}
.log-item:last-child{border-bottom:none}
.log-name{font-size:12px;font-weight:600;color:#4a4340}
.log-time{font-size:9.5px;color:#a89e97;margin-top:1px}
.log-kcal{font-size:13px;font-weight:700;color:#a690cf}
.log-del{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:2px 6px}
/* the personal details inside תזונה - one label, one field, one unit per row */
.pf-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f7f3ee}
.pf-row:last-of-type{border-bottom:none}
.pf-lbl{flex:0 0 78px;font-size:12.5px;font-weight:700;color:#4a4340}
.pf-in{flex:1;min-width:0;border:1.5px solid #f2ede6;border-radius:10px;padding:9px 10px;font-size:16px;font-weight:700;color:#4a4340;outline:none;font-family:inherit;background:#fff;text-align:center}
.pf-in:focus{border-color:#c9bce0}
.pf-note{flex:0 0 52px;font-size:10.5px;color:#a89e97;font-weight:700}
.pf-derived{margin-top:12px;padding-top:11px;border-top:1px solid #f7f3ee;font-size:11px;color:#a89e97;font-weight:700;letter-spacing:.04em}
.pf-acts{display:flex;flex-direction:column;gap:6px}
.pf-act{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid #f2ede6;border-radius:14px;padding:10px 11px;background:#fff;cursor:pointer;font-family:inherit;text-align:right}
.pf-act.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7)}
.pf-actn{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#f2ede6;color:#a89e97;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pf-act.on .pf-actn{background:#a690cf;color:#fff}
.pf-actt{font-size:12.5px;font-weight:800;color:#4a4340}
.pf-acts2{font-size:10.5px;color:#a89e97;margin-right:auto;text-align:left}
.pf-goals{display:flex;flex-wrap:wrap;gap:6px}
.pf-goal{flex:1 1 calc(50% - 3px);min-width:0;border:1.5px solid #f2ede6;border-radius:14px;padding:11px 6px;background:#fff;font-size:11.5px;font-weight:800;color:#a89e97;cursor:pointer;font-family:inherit;line-height:1.3}
.pf-goaln{font-size:10.5px;color:#a89e97;line-height:1.6;margin-top:9px}
.pf-goal.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
/* the ministry database - a search card sitting above your own library */
/* the scanner - a sheet over everything, because a camera needs the screen */
.scan-btn{width:100%;margin-bottom:8px;border:none;border-radius:12px;padding:11px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
.scan-overlay{position:fixed;inset:0;background:rgba(74,67,64,.72);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-sheet{width:100%;max-width:400px;background:#fbf7f2;border-radius:20px;padding:14px;box-shadow:0 18px 46px rgba(74,67,64,.32)}
.scan-hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:#4a4340;margin-bottom:11px}
.scan-x{border:none;background:none;font-size:24px;line-height:1;color:#a89e97;cursor:pointer;padding:0 4px;font-family:inherit}
.scan-cam{width:100%;aspect-ratio:4/3;background:#2a2522;border-radius:14px;overflow:hidden;position:relative}
.scan-cam video,.scan-frozen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1c1917}
.scan-frozen{display:none}
.scan-frozen.on{display:block}
/* the band the crop is taken from, so you can see where to hold it */
.scan-guide{position:absolute;left:6%;right:6%;top:32%;height:36%;border:2px dashed rgba(255,255,255,.75);border-radius:10px;pointer-events:none}
.scan-shot{width:100%;margin-top:10px;border:none;border-radius:13px;padding:14px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.scan-shot:disabled{opacity:.5}
.scan-cam video{width:100%;height:100%;object-fit:cover}
.scan-msg{font-size:11.5px;color:#7a716b;text-align:center;line-height:1.6;margin-top:10px;min-height:32px}
.scan-photo{display:block;margin-top:9px;border:1.5px solid #c9bce0;border-radius:12px;padding:10px;background:#fff;color:#7a6a9c;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;text-align:center}
.scan-manual{display:flex;gap:7px;margin-top:10px}
.scan-in{flex:1;min-width:0;border:1.5px solid #f2ede6;border-radius:11px;padding:10px;font-size:16px;font-family:inherit;outline:none;text-align:center;background:#fff}
.scan-in:focus{border-color:#c9bce0}
.scan-go{border:none;border-radius:11px;padding:10px 16px;background:#4a4340;color:#fff;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer}
.fdb-src{margin-top:8px;font-size:9.5px;color:#c0b6ae;text-align:center;font-weight:700}
.fdb-in{width:100%;border:1.5px solid #f2ede6;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;outline:none;margin-bottom:8px;background:#fff}
.fdb-in:focus{border-color:#c9bce0}
.fdb-msg{font-size:11.5px;color:#a89e97;padding:10px 4px;text-align:center;line-height:1.6}

.fdb-add{flex:1;border:none;border-radius:12px;padding:11px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}

.cal-d.has-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cal-d-dot{width:4px;height:4px;background:#a690cf;border-radius:50%;margin-top:1px}
/* ── DAILY REFLECTION ──
   One question at a time, nothing else on the screen. Deliberately lighter
   than the rest of the app: no cards, no shadows, no chrome - the question
   and the answer are the whole surface. */
.rf{min-height:72vh;display:flex;flex-direction:column;padding:0 4px 30px}
.rf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 0;min-height:34px}
.rf-icon{background:none;border:none;padding:6px 8px;font-size:17px;color:#c0b8b0;cursor:pointer;font-family:inherit;line-height:1}
.rf-skip{background:none;border:none;padding:6px 4px;font-size:12px;color:#c0b8b0;cursor:pointer;font-family:inherit}
.rf-bar{flex:1;height:3px;background:#ece5da;border-radius:2px;overflow:hidden}
.rf-bar-f{height:100%;background:linear-gradient(90deg,#c9bce0,#a690cf);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rf-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px;animation:rf-in .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rf-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rf-q{font-size:25px;font-weight:800;line-height:1.35;color:#4a4340;letter-spacing:-.3px}
.rf-sub{font-size:13px;color:#a89e97;line-height:1.65;margin-top:10px}
.rf-field{margin-top:30px}
.rf-in{width:100%;border:none;border-bottom:1.5px solid #e4ddd4;background:none;padding:12px 2px;font-size:17px;line-height:1.6;color:#4a4340;direction:rtl;outline:none;resize:none;font-family:inherit;min-height:96px}
.rf-in:focus{border-bottom-color:#a690cf}
.rf-in::placeholder{color:#c9c0b8}
.rf-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;font-family:inherit;margin-top:24px}
.rf-ghost{width:100%;background:none;border:none;padding:13px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;margin-top:6px}
/* mood faces */
.rf-moods{display:flex;justify-content:space-between;gap:6px}
.rf-mood{flex:1;background:none;border:none;padding:6px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.45;transition:opacity .2s,transform .2s}
.rf-mood.on,.rf-mood:active{opacity:1;transform:scale(1.06)}
.rf-mood svg{width:46px;height:46px;fill:none;stroke-width:1.7;stroke-linecap:round}
.rf-mood-l{font-size:10.5px;font-weight:700;color:#a89e97}
.rf-mood.on .rf-mood-l{color:#4a4340}
/* chips */
.rf-chips{display:flex;flex-wrap:wrap;gap:9px}
.rf-chip{background:#fff;border:1.5px solid #ece5da;border-radius:22px;padding:11px 17px;font-size:14px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;transition:all .18s}
.rf-chip.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#7d63b8}
/* 1-10 scale */
.rf-scale{display:flex;gap:5px}
.rf-num{flex:1;aspect-ratio:1;background:#fff;border:1.5px solid #ece5da;border-radius:12px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;padding:0;transition:all .18s}
.rf-num.on{background:linear-gradient(135deg,#c9bce0,#a690cf);border-color:#a690cf;color:#fff;transform:translateY(-3px)}
.rf-echo{font-size:14px;font-weight:700;color:#a690cf;text-align:center;margin-top:20px;min-height:20px;animation:rf-in .35s ease-out}
/* ladder */
.rf-ladder{display:flex;flex-direction:column;gap:8px}
.rf-rung{width:100%;background:#fff;border:1.5px solid #ece5da;border-radius:14px;padding:15px 18px;font-size:15px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;text-align:right;transition:all .18s}
.rf-rung.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#4a4340}
/* photo */
.rf-photo-drop{border:1.5px dashed #d8cfc7;border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;background:#fdfbf8}
.rf-photo-drop svg{width:30px;height:30px;fill:none;stroke:#c0b8b0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rf-photo-wrap{position:relative}
.rf-photo-wrap img{width:100%;border-radius:20px;display:block}
.rf-photo-x{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(74,67,64,.62);border:none;color:#fff;font-size:15px;cursor:pointer;line-height:1}
/* module home */
.rf-hero{background:linear-gradient(150deg,#f5eefa,#eaf1f8);border-radius:26px;padding:24px 20px;margin-bottom:16px}
.rf-hero-t{font-size:19px;font-weight:800;color:#4a4340;line-height:1.35}
.rf-hero-s{font-size:12.5px;color:#a89e97;line-height:1.6;margin-top:7px}
.rf-day{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:0 4px 14px rgba(200,180,160,.1);cursor:pointer;text-align:right;font-family:inherit}
.rf-day-th{width:46px;height:46px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#f2ede6}
/* the deep pass, laid out like the areas on the home screen */
.rf-board{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rf-card{position:relative;border:2px solid transparent;border-radius:22px;padding:16px 13px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;font-family:inherit;transition:transform .15s,border-color .25s;overflow:hidden}
.rf-card:active{transform:scale(.97)}
.rf-card.done{border-color:#8fc79e}
.rf-card-ic{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(160,140,120,.16)}
.rf-card-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rf-card-t{font-size:13px;font-weight:800;color:#4a4340;line-height:1.3}
.rf-card-s{font-size:9.5px;color:#a89e97;line-height:1.4}
.rf-card-v{position:absolute;top:9px;left:9px;width:19px;height:19px;border-radius:50%;background:#8fc79e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
/* the day's anchors, stacked with an arrow between them */
.rf-flow{display:flex;flex-direction:column}
.rf-flow-row{display:flex;align-items:center;gap:6px}
.rf-flow-box{flex:1;min-width:0;background:#fff;border:1.5px solid #e4ddd4;border-radius:14px;padding:7px 8px 7px 10px}
.rf-flow-box:focus-within{border-color:#a690cf}
.rf-flow-line{display:flex;align-items:center;gap:4px}
.rf-flow-in{flex:1;min-width:0;border:none;background:none;outline:none;padding:6px 4px;font-size:14px;color:#4a4340;font-family:inherit;direction:rtl}
.rf-flow-in::placeholder{color:#c9c0b8}
.rf-flow-cam{background:none;border:none;padding:5px;cursor:pointer;color:#c0b8b0;flex-shrink:0;line-height:0;font-family:inherit}
.rf-flow-cam svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rf-flow-imgwrap{position:relative;margin-bottom:6px}
.rf-flow-img{width:100%;height:92px;object-fit:cover;border-radius:9px;display:block}
.rf-flow-imgx{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(74,67,64,.6);border:none;color:#fff;font-size:12px;cursor:pointer;line-height:1;font-family:inherit}
.rf-flow-x{background:none;border:none;color:#e0c4bb;font-size:16px;cursor:pointer;padding:4px 2px;flex-shrink:0;font-family:inherit}
.rf-flow-ar{text-align:center;color:#c9bce0;font-size:15px;padding:5px 0;line-height:1}
.rf-flow-add{width:100%;background:rgba(166,144,207,.08);border:1.5px dashed #c9bce0;border-radius:14px;padding:11px;font-size:12.5px;font-weight:700;color:#a690cf;cursor:pointer;font-family:inherit;margin-top:12px}
/* the week: seven day columns, a third of the screen tall, cut into three
   bands. The cells are the drop targets and keep the text visible. */
.wk-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:5px;margin-right:36px}
.wk-wrap{display:flex;gap:2px;align-items:stretch}
.wk-slots{width:34px;flex-shrink:0;display:flex;flex-direction:column}
.wk-slot-l{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:700;color:#b8afa7;letter-spacing:.03em;line-height:1.15;gap:2px}
.wk-slot-hrs{font-size:7.5px;font-weight:700;color:#cfc6be;direction:ltr;letter-spacing:0}
/* what the day screen placed, shown here too but marked as belonging there */
.wk-chip.fromday{border:1px dashed rgba(0,0,0,.14);opacity:.82}
.wk-hcell{text-align:center;min-width:0;padding:2px 0;border-radius:8px}
.wk-hcell.today{background:linear-gradient(135deg,#f0eafa,#e8dff5)}
.wk-dn{font-size:9.5px;font-weight:800;color:#4a4340;line-height:1.15;white-space:nowrap;letter-spacing:-.2px}
.wk-dd{font-size:8.5px;color:#a89e97;line-height:1.2;white-space:nowrap}
.wk-table{flex:1;min-width:0;position:relative;height:34vh;min-height:250px;background:#fff;border:1.5px solid #ece5da;border-radius:14px;overflow:hidden}
.wk-bands{position:absolute;inset:0;pointer-events:none;z-index:2}
.wk-band-l{position:absolute;right:0;left:0;height:1px;background:#ece5da}
.wk-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));z-index:1}
.wk-col{display:flex;flex-direction:column;min-width:0;border-left:1px solid #f4efe9}
.wk-col:last-child{border-left:none}
.wk-col.today{background:rgba(166,144,207,.06)}
.wk-cell{flex:1;min-height:0;padding:3px 2px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;transition:background .15s}
.wk-cell.hot{background:rgba(143,199,158,.22)}
.wk-chip{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-radius:5px;padding:2px 3px;font-size:8px;line-height:1.25;color:#5f5148;font-weight:700;overflow:hidden;word-break:break-word}
.wk-task{display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:7px;box-shadow:0 3px 10px rgba(200,180,160,.12);touch-action:none;cursor:grab}
.wk-grip{color:#d8cfc7;font-size:11px;line-height:1;flex-shrink:0;letter-spacing:-3px}
.wk-ghost{position:fixed;z-index:200;margin:0;pointer-events:none;opacity:.94;transform:rotate(-2deg);box-shadow:0 12px 28px rgba(120,100,85,.32);transition:background .15s}
.wk-pool{min-height:56px;border-radius:14px;transition:background .15s}
.wk-pool.hot{background:rgba(166,144,207,.09)}
.wk-dot{width:15px;height:15px;border-radius:50%;border:none;padding:0;cursor:pointer;flex-shrink:0;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.06)}
/* capped so twelve swatches fall as two rows of six rather than eleven and a
   lonely one; the 22px target is worth keeping */
.wk-sw{display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:0;max-width:181px;justify-content:flex-start}
.wk-swatch{width:22px;height:22px;border-radius:50%;border:none;padding:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.wk-swatch.on{transform:scale(1.16);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #4a4340}
.wk-picker{background:#fff;border-radius:12px;padding:10px 12px;margin:-3px 0 9px;box-shadow:0 3px 10px rgba(200,180,160,.14);display:flex;justify-content:center}
/* one day, hour by hour */
.dp-grid{background:#fff;border:1.5px solid #ece5da;border-radius:14px;overflow:hidden}
.dp-row{display:flex;align-items:stretch;border-top:1px solid #f4efe9;min-height:44px}
.dp-row:first-child{border-top:none}
.dp-h{width:46px;flex-shrink:0;font-size:9.5px;color:#a89e97;font-weight:700;padding:6px 4px 0;text-align:center;border-left:1px solid #f4efe9}
.dp-slot{flex:1;min-width:0;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;transition:background .15s}
.dp-slot.hot{background:rgba(143,199,158,.22)}
.dp-chip{border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;line-height:1.3;max-width:100%;word-break:break-word;touch-action:none;cursor:grab}
.tl-row{display:flex;align-items:center;gap:8px;background:#fbf7f2;border-radius:12px;padding:9px 11px;margin-bottom:6px;touch-action:none;cursor:grab}
/* the month as a calendar */
.mo-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:4px}
.mo-hd{text-align:center;font-size:9px;font-weight:800;color:#a89e97}
.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mo-cell{min-height:54px;background:#fff;border:1.5px solid #ece5da;border-radius:9px;padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;transition:background .15s,border-color .15s}
.mo-cell.mo-blank{background:none;border-color:transparent;cursor:default}
.mo-cell.today{border-color:#a690cf}
.mo-cell.hot{border-color:#8fc79e;background:#eaf5ee}
.mo-n{font-size:9px;font-weight:700;color:#b8afa7;line-height:1}
.mo-chip{border-radius:4px;padding:2px 3px;font-size:7.5px;line-height:1.2;font-weight:700;overflow:hidden;word-break:break-word}
.dp-q{font-size:13.5px;font-weight:800;color:#4a4340;line-height:1.4;margin-bottom:9px}
.dp-ta{width:100%;background:#fff;border:none;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#4a4340;line-height:1.6;font-family:inherit;direction:rtl;outline:none;resize:none;min-height:74px}
.dp-ta::placeholder{color:#c9c0b8}
.dp-note-m{font-size:7px;vertical-align:middle;margin-right:5px;opacity:.55}
/* the rail: add and drag without leaving the hours */
.dp-rail{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center;max-height:70vh}
.dp-rail-add{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(166,144,207,.42);font-family:inherit;line-height:1;flex-shrink:0}
.dp-rail-chip{width:56px;padding:6px 5px;border-radius:9px;font-size:8.5px;font-weight:700;line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;touch-action:none;cursor:grab;box-shadow:0 3px 10px rgba(120,100,85,.2)}
.dp-rail-bar{position:fixed;left:54px;top:50%;transform:translateY(-50%);z-index:121;width:210px;max-width:calc(100vw - 74px);max-height:64vh;overflow-y:auto;padding:12px;border-radius:16px;background:rgba(253,251,248,.98);box-shadow:0 10px 30px rgba(120,100,85,.26)}
.dp-rail-lib{display:flex;flex-wrap:wrap;gap:6px}
.dp-rail-libchip{border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;line-height:1.25;touch-action:none;cursor:grab;max-width:100%;word-break:break-word}
/* ── WHERE TO LET GO ──
   A flick to the left removes, but until now the gesture had nothing to aim
   at: you swiped and hoped. This strip slides in from the left edge for the
   whole drag so the swipe has a destination, and goes solid with the word on
   it once the finger has gone far enough - let go here and it is gone.

   Amber rather than red when the swipe only takes a week or month task off
   this day: the original stays where it is, and a red bin would say otherwise.
   It stays under the drag ghost and never takes a pointer event, so the drop
   targets underneath it still work exactly as before. */
.swipe-trash{position:fixed;left:0;top:0;bottom:0;width:56px;z-index:190;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transform:translateX(-100%);transition:transform .18s ease,background .15s,opacity .15s;background:linear-gradient(90deg,rgba(176,96,78,.62),rgba(176,96,78,.14))}
.swipe-trash.on{transform:none}
.swipe-trash.hot{background:linear-gradient(90deg,rgba(176,80,58,.92),rgba(198,110,86,.55))}
/* the minute steps open across the same strip of screen; a bin floating
   over the times you are trying to press is worse than no bin at all */
.swipe-trash.hidden{opacity:0}
.swipe-trash.keep{background:linear-gradient(90deg,rgba(170,124,48,.62),rgba(170,124,48,.14))}
.swipe-trash.keep.hot{background:linear-gradient(90deg,rgba(172,118,30,.92),rgba(198,152,62,.55))}
.swipe-trash svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9;transition:transform .18s,opacity .18s}
.swipe-trash.hot svg{transform:scale(1.2);opacity:1}
.swipe-trash b{font-size:10px;font-weight:800;color:#fff;opacity:0;transition:opacity .15s;text-align:center;line-height:1.3;padding:0 4px}
.swipe-trash.hot b{opacity:1}
@media (prefers-reduced-motion:reduce){.swipe-trash,.swipe-trash svg{transition:none}}
/* a flick to the left says remove, and the ghost says which kind */
.wk-ghost.swipe-del{background:linear-gradient(135deg,#fbe4dd,#f4cabc)!important;color:#8c4a36!important;border-right-color:#e08a72!important}
.wk-ghost.swipe-del::after{content:attr(data-swipe);position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;color:#a9563c}
/* the journal - a page, then everything you have already written */
.jrnl-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.jrnl-nav{background:#fff;border:none;border-radius:11px;width:32px;height:32px;font-size:15px;color:#a89e97;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.16);font-family:inherit;flex-shrink:0}
.jrnl-nav:disabled{opacity:.3;cursor:default}
.jrnl-day{font-size:16px;font-weight:800;color:#4a4340}
.jrnl-date{font-size:11px;color:#a89e97;margin-top:2px}
.jrnl-paper{position:relative;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.jrnl-text{width:100%;border:none;outline:none;resize:none;background:transparent;font-family:inherit;font-size:14px;line-height:2;color:#4a4340;min-height:230px;direction:rtl}
.jrnl-saved{position:absolute;left:14px;bottom:10px;font-size:9.5px;font-weight:700;color:#8fc79e;opacity:0;transition:opacity .3s;pointer-events:none}
.jrnl-today{width:100%;margin-top:9px;border:1.5px solid #ece5da;border-radius:13px;padding:10px;background:none;color:#a89e97;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.jrnl-srch{margin:20px 0 10px}
.jrnl-in{width:100%;border:1.5px solid #ece5da;border-radius:13px;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;background:#fff;direction:rtl}
.jrnl-in:focus{border-color:#c9bce0}
.jrnl-lbl{font-size:10px;letter-spacing:.1em;font-weight:700;color:#a89e97;margin-bottom:9px}
.jrnl-row{display:block;width:100%;text-align:right;background:#fff;border:none;border-radius:14px;padding:11px 13px;margin-bottom:6px;cursor:pointer;font-family:inherit;box-shadow:0 2px 9px rgba(200,180,160,.1)}
.jrnl-when{font-size:10.5px;font-weight:800;color:#a690cf;margin-bottom:4px}
.jrnl-prev{font-size:11.5px;color:#7a716b;line-height:1.7;word-break:break-word}
.jrnl-hit{background:#f6e6b8;color:#6a5a2a;border-radius:3px;padding:0 2px;font-weight:800}
.jrnl-empty{font-size:11.5px;color:#c0b6ae;text-align:center;padding:22px 12px;line-height:1.7}
/* the reminder picker inside a task */
.dp-rem-row{display:flex;flex-wrap:wrap;gap:6px}
.dp-rem-b{border:1.5px solid #ece5da;border-radius:11px;padding:8px 11px;background:#fff;font-size:11.5px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit}
.dp-rem-b.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
.dp-rem-at{margin-top:9px;font-size:11px;font-weight:700;color:#6fb283}
.dp-rem-ask{width:100%;margin-top:9px;border:1.5px dashed #ddd3ca;border-radius:12px;padding:9px;background:none;color:#a89e97;font-size:10.5px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.5}
.dp-min{font-size:9.5px;font-weight:800;opacity:.6;margin-left:5px;direction:ltr;display:inline-block}
/* the five-minute steps an hour opens into while a task is held over it */
.dp-slot.fine{background:rgba(166,144,207,.07)}
.dp-fine{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:3px;animation:dp-fine-in .16s ease-out}
@keyframes dp-fine-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dp-fine-b{background:#fff;border:1.5px solid #e4ddd4;border-radius:7px;padding:7px 2px;font-size:10px;font-weight:700;color:#a89e97;text-align:center;direction:ltr;transition:all .12s}
.dp-fine-b.on{background:linear-gradient(135deg,#bfe0c7,#8fc79e);border-color:#8fc79e;color:#fff;transform:scale(1.06)}
/* pulling down the hour column to say how long something runs */
.dp-row.reach .dp-h{background:linear-gradient(135deg,#f0eafa,#e8dff5);color:#7d63b8}
.dp-ghost-end{opacity:.35!important}
/* A task that runs past its hour is one band down the grid, named once where
   it starts. It takes a third of the width so whatever else happens at the
   same time still has somewhere to sit. */
.dp-chip.head{flex:0 0 33%;max-width:33%;border-bottom-right-radius:0;border-bottom-left-radius:0;margin-bottom:-5px;min-height:39px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:0 5px;box-sizing:border-box;padding:4px 8px}
/* min-height in per cent does not resolve inside a wrapping flex row, so the
   band is sized to the row instead: 44px less the slot's 5px padding. */
.dp-cont{flex:0 0 33%;max-width:33%;border-radius:0;opacity:.72;margin:-5px 0;min-height:44px;box-sizing:border-box}
.dp-cont.tail{border-bottom-right-radius:8px;border-bottom-left-radius:8px;margin-bottom:-5px;min-height:39px}
.interview{padding:20px 16px;min-height:60vh;display:flex;flex-direction:column}
.q-num{font-size:10px;color:#a89e97;letter-spacing:.1em;margin-bottom:8px}
.q-text{font-size:20px;font-weight:700;margin-bottom:24px;line-height:1.4}
.stars-row{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.star-btn{font-size:36px;background:none;border:none;cursor:pointer;opacity:.3;transition:opacity .15s}
.star-btn.sel{opacity:1}
.q-input{width:100%;border:1.5px solid #f2ede6;border-radius:14px;padding:14px;font-size:14px;direction:rtl;outline:none;resize:none;background:#fff;min-height:90px;font-family:inherit}
.q-input:focus{border-color:#a690cf}
.q-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:16px}
.q-skip{width:100%;background:none;border:none;padding:10px;font-size:12px;color:#a89e97;cursor:pointer}
.photo-upload-area{border:2px dashed #c9bce0;border-radius:16px;padding:30px;text-align:center;cursor:pointer;margin-bottom:10px;background:#faf7ff}
.photo-preview{width:100%;max-height:200px;object-fit:contain;border-radius:16px;margin-bottom:10px}
.summary-overlay{position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.summary-sheet{background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px;position:relative}
.summary-pull{width:40px;height:4px;background:#c9bce0;border-radius:2px;margin:0 auto 14px}
.summary-close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.8);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:#a89e97}
.builder-overlay{position:fixed;inset:0;background:rgba(74,67,64,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.builder-sheet{background:#fbf7f2;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px}
.builder-pull{width:40px;height:4px;background:#c9bce0;border-radius:2px;margin:0 auto 14px}
.builder-section{font-size:9.5px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin:12px 0 6px}
.bcat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.bcat-tab{flex:1;min-width:55px;padding:7px 3px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;background:#f2ede6;color:#a89e97}
.bcat-tab.on{background:linear-gradient(135deg,#f3b9a8,#e08a72);color:#fff}
.ing-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ing-name{font-size:12px;font-weight:700;color:#4a4340}
.ing-mac{font-size:9.5px;color:#a89e97}
.ing-g{width:60px;border:1.5px solid #f2ede6;border-radius:7px;padding:5px;font-size:12px;text-align:center;outline:none}
.ing-del{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:15px;padding:2px 5px}
.ing-total{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:12px;font-weight:700;text-align:center;color:#4a4340}
.lib-pick-list{max-height:180px;overflow-y:auto;background:#fff;border-radius:12px;padding:6px;margin-bottom:8px}
.lib-pick-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.lib-pick-item:active{background:#f0eafa}
@keyframes hx-stroke1{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
@keyframes hx-stroke2{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.hx-draw{stroke-dasharray:20;stroke-dashoffset:0;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) forwards}
.hx-draw2{stroke-dasharray:20;stroke-dashoffset:0;animation:hx-stroke2 .22s cubic-bezier(.4,0,.2,1) .12s forwards}
@keyframes reveal-ltr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0% 0 0)}}
@keyframes dot-in{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
@keyframes splash-fade-out{0%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(74,67,64,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:100;pointer-events:none}

/* HOME SCREEN */
.home{position:relative;min-height:100vh;background:linear-gradient(160deg,#f0ebe3 0%,#e8dff5 100%);display:flex;flex-direction:column;align-items:center;padding:60px 20px 40px}
.home-logo{font-size:36px;font-weight:800;background:linear-gradient(135deg,#a690cf,#e08a72);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;margin-bottom:6px}
.home-sub{font-size:13px;color:#a89e97;margin-bottom:48px;letter-spacing:.05em}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:380px}
.home-card{border-radius:28px;padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;border:none;text-align:center;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.home-card:active{transform:scale(.97)}
.home-card.nutrition{background:linear-gradient(145deg,#f5eefa,#ede4f7);box-shadow:0 8px 32px rgba(166,144,207,.2)}
.home-card.fitness{background:linear-gradient(145deg,#fef0e8,#fae0d0);box-shadow:0 8px 32px rgba(224,138,114,.2)}
.home-card.hobbies{background:linear-gradient(145deg,#eaf5ee,#d8f0e0);box-shadow:0 8px 32px rgba(143,199,158,.2)}
.home-card.endofday{background:linear-gradient(145deg,#e8f4fd,#d6ebf7);box-shadow:0 8px 32px rgba(58,124,165,.2)}
.home-card.journal{background:linear-gradient(145deg,#fbf1e0,#f5e6cd);box-shadow:0 8px 32px rgba(184,121,26,.18)}
.home-card.insights{background:linear-gradient(145deg,#f0ede8,#e8e4de);box-shadow:0 8px 32px rgba(74,67,64,.15)}
.home-card.people{background:linear-gradient(145deg,#fef0e8,#fde0d0);box-shadow:0 8px 32px rgba(224,138,114,.2)}
.home-card.goals{background:linear-gradient(145deg,#e8fef0,#d0fde0);box-shadow:0 8px 32px rgba(76,154,76,.2)}
.home-card.planning{background:linear-gradient(145deg,#e8f4ff,#d0e8ff);box-shadow:0 8px 32px rgba(79,110,247,.18)}
.home-card.planning{background:linear-gradient(145deg,#e8f4fd,#d0e8f8);box-shadow:0 8px 32px rgba(58,124,165,.2)}
.home-card.game{background:linear-gradient(145deg,#fdf2e2,#f6e1c3);box-shadow:0 8px 32px rgba(201,139,63,.22)}
.home-card.trip{background:linear-gradient(145deg,#e8f0ff,#dde8ff);box-shadow:0 8px 32px rgba(66,99,235,.15);justify-content:flex-start;padding:20px 22px}
@keyframes plane-fly{0%{transform:translateX(0) rotate(0deg)}30%{transform:translateX(-6px) rotate(-8deg)}60%{transform:translateX(4px) rotate(5deg)}100%{transform:translateX(0) rotate(0deg)}}
.plane-anim{animation:plane-fly 2s ease-in-out infinite}
@keyframes globe-orbit{0%{transform:rotate(0deg) translateX(90px) rotate(0deg)}100%{transform:rotate(360deg) translateX(90px) rotate(-360deg)}}
@keyframes fly-across{0%{transform:translateX(120vw) rotate(-10deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(-120vw) rotate(-10deg);opacity:0}}
.trip-toggle-track{width:56px;height:30px;border-radius:15px;background:#e0dbd5;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0;border:none;padding:0}
.trip-toggle-track.on{background:linear-gradient(135deg,#4f6ef7,#3d4fd6)}
.trip-toggle-thumb{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .3s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.trip-toggle-track.on .trip-toggle-thumb{right:calc(100% - 27px)}
/* The icon sits in a white disc rather than being a bare glyph - it gives every
   card the same optical weight whatever the icon, which emoji never did. */
.home-card-icon{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(160,140,120,.16)}
.home-card-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-card-title{font-size:15px;font-weight:800;color:#4a4340}
.home-card-sub{font-size:11px;color:#a89e97;line-height:1.4}
/* The corner menu. Better shows what you chose to track, so the board needs a
   door to that choice - three lines top-right, where a menu is expected. */
.home-menu{position:absolute;top:18px;right:18px;width:40px;height:40px;border:none;border-radius:14px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 3px 12px rgba(160,140,120,.14);z-index:3;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.home-menu i{display:block;width:17px;height:2px;border-radius:1px;background:#7a716b}
.home-menu:active{transform:scale(.94)}
.areas-back{position:fixed;inset:0;background:rgba(74,67,64,.5);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.areas-back.on{opacity:1;pointer-events:auto}
.areas-drawer{position:fixed;top:0;right:0;bottom:0;width:88%;max-width:340px;background:#fbf7f2;z-index:151;transform:translateX(103%);transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(74,67,64,.18)}
.areas-drawer.on{transform:none}
.ar-hd{padding:calc(24px + env(safe-area-inset-top)) 20px 10px}
.ar-title{font-size:19px;font-weight:800;color:#4a4340}
.ar-note{font-size:11.5px;color:#a89e97;line-height:1.65;margin-top:7px}
.ar-count{font-size:10.5px;color:#c0b6ae;margin-top:8px;font-weight:700;letter-spacing:.02em}
#areas-list{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch}
.ar-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-radius:16px;padding:11px 10px;cursor:pointer;font-family:inherit;text-align:right}
.ar-row.on{background:#fff;box-shadow:0 2px 10px rgba(200,180,160,.14)}
.ar-row.fixed{cursor:default}
.ar-box{flex:0 0 22px;width:22px;height:22px;border-radius:8px;border:1.8px solid #ddd3ca;display:flex;align-items:center;justify-content:center;background:#fff}
.ar-row.on .ar-box{background:#8fc79e;border-color:#8fc79e}
.ar-row.fixed .ar-box{background:#c9c1ba;border-color:#c9c1ba}
.ar-box svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ar-ic{flex:0 0 22px;display:flex;align-items:center}
.ar-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ar-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ar-t{font-size:13.5px;font-weight:700;color:#4a4340}
.ar-s{font-size:10.5px;color:#a89e97}
.ar-done{margin:0 12px calc(16px + env(safe-area-inset-bottom));padding:14px;border:none;border-radius:16px;background:#4a4340;color:#fff;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.home-card-badge{position:absolute;top:12px;left:12px;background:rgba(166,144,207,.2);border-radius:20px;padding:3px 8px;font-size:9px;font-weight:700;color:#a690cf}
/* ── THE SKY ──
   One fixed layer behind everything, animating transform and opacity only so
   it stays on the compositor. The home and Me sit on it; module screens get
   their own ground back, because a moving sky behind a food log is noise. */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1.6s ease}
.cloud{position:absolute;border-radius:50%;filter:blur(20px);will-change:transform}
.c1{width:58vw;height:22vh;top:8%;background:rgba(255,255,255,.95);opacity:.85;animation:drift1 96s linear infinite,bob1 19s ease-in-out infinite}
.c2{width:46vw;height:17vh;top:26%;background:rgba(255,255,255,.85);opacity:.7;animation:drift2 138s linear infinite,bob2 26s ease-in-out infinite}
.c3{width:70vw;height:26vh;top:52%;background:rgba(255,255,255,.72);opacity:.55;animation:drift3 172s linear infinite,bob3 31s ease-in-out infinite}
@keyframes drift1{0%{transform:translateX(-70vw)}100%{transform:translateX(120vw)}}
@keyframes drift2{0%{transform:translateX(120vw)}100%{transform:translateX(-70vw)}}
@keyframes drift3{0%{transform:translateX(-80vw)}100%{transform:translateX(120vw)}}
.stars{position:absolute;inset:0;display:none}
.stars.out{display:block;animation:starsIn 1.8s ease forwards}
@keyframes starsIn{from{opacity:0}to{opacity:1}}
.stars i{position:absolute;background:#fff;border-radius:50%;opacity:.2;animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes bob1{0%,100%{margin-top:0}50%{margin-top:2.4vh}}
@keyframes bob2{0%,100%{margin-top:0}50%{margin-top:-2vh}}
@keyframes bob3{0%,100%{margin-top:0}50%{margin-top:1.8vh}}
@keyframes twinkle{0%,100%{opacity:.18;transform:scale(.85)}50%{opacity:.95;transform:scale(1.15)}}
/* clouds read as haze by day and would read as fog at night */
.sky-night .cloud{opacity:.10}
.sky-dusk .cloud{opacity:.34}
body.night .home-sub,body.night .home-date,body.night .me-sub{color:#a79ec4}
/* a cream slab under a night sky reads as a hole in it */
body.night .tabbar{background:rgba(28,24,44,.86);border-top-color:rgba(255,255,255,.09)}
body.night .tb{color:#8f86ae}
body.night .me-hero,body.night .me-card{background:rgba(255,255,255,.94)}
#home-screen,#me-screen{position:relative;z-index:1;background:none}
.app{position:relative;z-index:1;background:#f5f0eb}
@media (prefers-reduced-motion:reduce){.cloud,.stars i{animation:none}}

/* ── THE TWO HALVES ── */
/* ltr on purpose: read left to right the two buttons spell the app's name, so
   Better must sit left of Me even though everything around them is rtl */
body.sheet-open .tabbar{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:140;direction:ltr;display:flex;gap:8px;padding:8px 16px max(24px,calc(env(safe-area-inset-bottom) + 10px));background:rgba(250,246,241,.94);backdrop-filter:blur(12px);border-top:1px solid rgba(190,175,160,.22)}
.tb{flex:1;background:none;border:none;border-radius:14px;padding:11px 6px;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:-.2px;color:#b9b0a8;cursor:pointer;transition:color .2s,background .2s;direction:ltr}
.tb.on{color:#fff;background:linear-gradient(135deg,#c9bce0,#a690cf);box-shadow:0 4px 14px rgba(166,144,207,.32)}
.app,.home{padding-bottom:118px}
.me-screen{display:none;min-height:100vh;background:linear-gradient(165deg,#f4efe8 0%,#eee7f2 100%);padding:34px 16px 122px}
.me-wrap{max-width:480px;margin:0 auto}
.me-top{text-align:center;margin-bottom:18px}
.me-logo{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;direction:ltr;background:linear-gradient(135deg,#a690cf,#e08a72);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.me-sub{font-size:11.5px;color:#a89e97;margin-top:7px}
.me-range{display:flex;gap:5px;background:rgba(255,255,255,.6);border-radius:13px;padding:4px;margin-bottom:14px}
.me-rb{flex:1;border:none;border-radius:10px;padding:8px 4px;font-family:inherit;font-size:11.5px;font-weight:700;color:#a89e97;background:none;cursor:pointer}
.me-rb.on{background:#fff;color:#4a4340;box-shadow:0 2px 7px rgba(200,180,160,.2)}
.me-slot{margin-bottom:12px}
.me-hero{background:#fff;border-radius:22px;padding:20px;text-align:center;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.me-hero-n{font-size:40px;font-weight:800;color:#7c5cc4;line-height:1}
.me-hero-l{font-size:11.5px;color:#a89e97;margin-top:6px}
.me-card{background:#fff;border-radius:22px;padding:15px 14px 10px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.me-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.me-t{font-size:13px;font-weight:800;color:#4a4340}
.me-s{font-size:10.5px;color:#a89e97;margin-top:2px}
.me-read{font-size:10.5px;font-weight:700;color:#7c5cc4;text-align:left;min-height:14px;flex-shrink:0}
.me-svg{width:100%;display:block;overflow:visible}
.me-pt,.me-bar{cursor:pointer}
.me-empty{font-size:11.5px;color:#c0b8b0;line-height:1.6;padding:10px 2px 14px}
.me-stack{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 10px}
.me-stack span{display:block;height:100%}
.me-legend{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:6px}
.me-lg{font-size:10.5px;color:#8d847d;display:flex;align-items:center;gap:5px}
.me-lg i{width:9px;height:9px;border-radius:3px;display:block;flex-shrink:0}
.me-lg b{color:#4a4340;font-weight:800}
.me-ins{background:#fbf8f4;border-radius:13px;padding:11px 13px;margin-bottom:8px}
.me-ins-t{font-size:12.5px;font-weight:800;color:#4a4340;line-height:1.35}
.me-ins-l{font-size:11.5px;color:#6b625c;margin-top:4px;line-height:1.5}
.me-ins-f{font-size:9.5px;color:#b8afa7;margin-top:5px}
.home-date{margin-top:auto;padding-top:32px;font-size:12px;color:#c0b8b0;text-align:center}
/* Vision board: a framed square on the home screen holding photos the user
   arranges by hand. The mat and the white photo borders are doing the work of
   making it read as a physical pinboard rather than a gallery grid. */
.vb-frame{padding:10px;background:linear-gradient(160deg,#f4ece1,#e7dbc9);border-radius:18px;box-shadow:0 6px 18px rgba(190,170,145,.22)}
.vb-canvas{position:relative;width:100%;padding-bottom:100%;background:#fdfbf8;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 10px rgba(160,140,120,.18)}
.vb-item{position:absolute;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vb-item img{display:block;width:100%;border-radius:3px;border:4px solid #fff;box-shadow:0 3px 10px rgba(120,100,85,.3);pointer-events:none}
.vb-item.on img{border-color:#f3eefb;box-shadow:0 0 0 2px #a690cf,0 3px 10px rgba(120,100,85,.3)}
.vb-h,.vb-del{display:none;position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(120,100,85,.32);border:none;padding:0;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#a690cf;cursor:pointer}
.vb-item.on .vb-h,.vb-item.on .vb-del{display:flex}
.vb-del{top:-13px;right:-13px;color:#e08a72;font-size:12px;font-weight:700}
.vb-size{bottom:-13px;right:-13px;cursor:nwse-resize}
.vb-size:after{content:'';width:9px;height:9px;border-left:2px solid #a690cf;border-bottom:2px solid #a690cf;margin:0 2px 2px 0}
.vb-rot{bottom:-13px;left:-13px}
.vb-text{max-width:80%;text-align:center;font-weight:800;line-height:1.3;white-space:pre-wrap}
.vb-text .vb-tx{display:block;padding:2px 4px}

<script>
/* ── DEV / STABLE SPLIT ──
   Two copies of this same file are published: "/" is the stable app installed on
   the phone, "/dev/" is the live copy we iterate on. They share an origin, so by
   default they would also share localStorage - and an experiment in dev would
   scribble over a real week of data. This gives the dev copy its own namespace,
   seeded once from the real data so it opens looking lived-in.
   Inert in the stable app: everything below is behind the /dev/ path check. */
(function(){
  if(!/(^|\/)dev(\/|$)/.test(location.pathname))return;
  window.__DEV__=true;
  var raw;try{raw=window.localStorage;}catch(e){return;}
  var P='dev:',SEEDED=P+'__seeded';

  // Sandbox keys, minus the bookkeeping one - the app should never see it.
  function devKeys(){
    var a=[];
    for(var i=0;i<raw.length;i++){
      var k=raw.key(i);
      if(k&&k.indexOf(P)===0&&k!==SEEDED)a.push(k.slice(P.length));
    }
    return a;
  }
  function seed(){
    var pairs=[],i,k;
    for(i=0;i<raw.length;i++){k=raw.key(i);if(k&&k.indexOf(P)!==0)pairs.push([k,raw.getItem(k)]);}
    for(i=0;i<pairs.length;i++){try{raw.setItem(P+pairs[i][0],pairs[i][1]);}catch(e){}}
    try{raw.setItem(SEEDED,'1');}catch(e){}
  }
  try{if(raw.getItem(SEEDED)!=='1')seed();}catch(e){}

  var shim={
    getItem:function(k){return raw.getItem(P+k);},
    setItem:function(k,v){raw.setItem(P+k,v);},
    removeItem:function(k){raw.removeItem(P+k);},
    clear:function(){devKeys().forEach(function(k){raw.removeItem(P+k);});},
    key:function(i){var a=devKeys();return i<a.length?a[i]:null;},
    get length(){return devKeys().length;}
  };
  var isolated=true;
  try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return shim;}});}
  catch(e){isolated=false;}

  // Throw the sandbox away and re-copy the stable app's data. Run from the
  // console when dev has drifted too far from reality to be a useful test.
  window.__devReseed=function(){
    devKeys().forEach(function(k){raw.removeItem(P+k);});
    raw.removeItem(SEEDED);seed();location.reload();
  };

  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('div');
    b.textContent=isolated?'DEV':'DEV ⚠ shared data';
    b.style.cssText='position:fixed;top:4px;left:6px;z-index:9999;pointer-events:none;'+
      'background:'+(isolated?'#a690cf':'#c0392b')+';color:#fff;padding:4px 7px;border-radius:8px;'+
      'font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.5px;opacity:.9';
    document.body.appendChild(b);
  });
})();
</script>

<script>
/* The targets every macro bar in תזונה is measured against. They were a fixed
   constant; they are now whatever is stored, falling back to that same
   constant, so an app nobody has configured behaves exactly as before.
   TARGETS is filled in place rather than reassigned - everything that reads it
   holds this one object. */
var TARGETS_DEFAULT={kcal:1975,p:155,c:200,f:60,water:3000};
var TARGETS_KEY='targets_v1';
var TARGETS={};
function targetsAreCustom(){
  try{return !!localStorage.getItem(TARGETS_KEY);}catch(e){return false;}
}
function loadTargets(){
  var o=null,k;
  try{o=JSON.parse(localStorage.getItem(TARGETS_KEY)||'null');}catch(e){}
  for(k in TARGETS_DEFAULT)
    TARGETS[k]=(o&&typeof o[k]==='number'&&isFinite(o[k])&&o[k]>0)?o[k]:TARGETS_DEFAULT[k];
}
loadTargets();

/* ── THE PERSONAL DETAILS ──
   Who the tracking is about, kept in one record inside תזונה: date of birth,
   height, weight, how much you move, and what you are aiming at.

   Age is derived from the birth date rather than stored, so it never goes
   stale - a stored age is wrong within a year of writing it down.

   Every weight that is entered is appended to a dated list as well as
   replacing the current one. Nothing shows that list yet; it is kept because
   a weight typed over is otherwise gone for good, and this is the one number
   here that is supposed to change. */
var PROFILE_KEY='profile_v1';
var ACT_LEVELS=[
  {v:1,t:'כמעט ללא',s:'יום יושבני, בלי אימונים'},
  {v:2,t:'קלה',s:'1&ndash;2 אימונים בשבוע'},
  {v:3,t:'בינונית',s:'3&ndash;4 אימונים בשבוע'},
  {v:4,t:'גבוהה',s:'5&ndash;6 אימונים בשבוע'},
  {v:5,t:'מאוד גבוהה',s:'כל יום, או עבודה פיזית'}
];
/* Each goal is two numbers: how far off maintenance the calories sit, and
   how much protein per kilo is added on top of the activity level's own
   figure. חיטוב is the interesting one - it is not a smaller version of
   losing weight. Recomposition means eating around maintenance and holding
   protein high, so the body has the material to build with while the fat
   comes off; a large deficit is what stops that working. So it carries the
   smallest calorie cut of the three and the largest protein bonus. */
var GOALS=[
  {v:'lose',  t:'ירידה במשקל',   k:0.85, p:0.2, n:'גירעון של 15% &mdash; ירידה יציבה'},
  {v:'recomp',t:'חיטוב',         k:0.95, p:0.4, n:'קרוב לתחזוקה, חלבון גבוה &mdash; לרדת אחוז שומן בלי לאבד מסה'},
  {v:'keep',  t:'שמירה על המשקל',k:1.00, p:0,   n:'בדיוק מה שאתה שורף'},
  {v:'gain',  t:'עלייה במסה',    k:1.10, p:0.1, n:'עודף של 10% לבנייה'}
];
function goalDef(v){for(var i=0;i<GOALS.length;i++)if(GOALS[i].v===v)return GOALS[i];return null;}
function loadProfile(){
  try{var o=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}');return o&&typeof o==='object'?o:{};}
  catch(e){return {};}
}
function saveProfile(p){
  try{localStorage.setItem(PROFILE_KEY,JSON.stringify(p));}catch(e){}
}
function profileAge(birth){
  if(!birth)return null;
  var b=new Date(birth+'T00:00:00');
  if(isNaN(b))return null;
  var n=new Date(),a=n.getFullYear()-b.getFullYear();
  var m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate()))a--;
  return (a>=0&&a<130)?a:null;
}
function profileBMI(p){
  var h=parseFloat(p.height),w=parseFloat(p.weight);
  if(!h||!w||h<80||h>250||w<20||w>400)return null;
  return Math.round(w/Math.pow(h/100,2)*10)/10;
}
function profSet(field,val){
  var p=loadProfile();
  p[field]=val;
  p.updatedAt=new Date().toISOString();
  saveProfile(p);
  renderProfile();
}
function profNum(field,el){
  var p=loadProfile(),v=el.value.trim();
  if(v===''){delete p[field];}
  else{
    var n=parseFloat(v);
    if(isNaN(n))return;
    p[field]=n;
    if(field==='weight'){
      // a weight typed over is otherwise gone; keep one entry per day
      var d=todayStr();
      p.weights=Array.isArray(p.weights)?p.weights:[];
      p.weights=p.weights.filter(function(x){return x.d!==d;});
      p.weights.push({d:d,v:n});
      if(p.weights.length>400)p.weights=p.weights.slice(-400);
    }
  }
  p.updatedAt=new Date().toISOString();
  saveProfile(p);
  renderProfile();
}

/* ── FROM THE DETAILS TO A TARGET ──
   Mifflin-St Jeor for the resting burn, scaled by how much you move, then
   moved off maintenance by the goal. The formula carries one constant that
   differs by sex (+5 / -161), which is the only reason the field is asked
   for at all.

   Protein is per kilo of bodyweight rather than a share of the calories,
   which is the usual way to set it - but the amount per kilo climbs with the
   activity level, because 2 g/kg for someone who marked 'hardly any' is a
   figure for an athlete. A deficit adds 0.2 on top, to hold muscle while the
   calories are down. Fat takes a quarter of the calories and carbohydrate
   gets whatever is left, so the three add back up to the figure above them.

   Nothing here writes anything. The numbers are a recommendation on screen
   until the button is pressed, because these targets are what a year of
   tracking is measured against and they should not move on their own. */
var ACT_FACTOR={1:1.2,2:1.375,3:1.55,4:1.725,5:1.9};
var PROT_PER_KG={1:1.2,2:1.5,3:1.7,4:1.9,5:2.0};
function profileTargets(p){
  var age=profileAge(p.birth),h=parseFloat(p.height),w=parseFloat(p.weight);
  if(age===null||!h||!w||!p.sex||!p.activity||!p.goal)return null;
  var bmr=10*w+6.25*h-5*age+(p.sex==='m'?5:-161);
  var tdee=bmr*(ACT_FACTOR[p.activity]||1.2);
  var g=goalDef(p.goal);
  if(!g)return null;
  var kcal=tdee*g.k;
  var prot=Math.round(w*((PROT_PER_KG[p.activity]||1.5)+g.p));
  var fat=Math.round(kcal*0.25/9);
  var carb=Math.round((kcal-prot*4-fat*9)/4);
  if(carb<0)carb=0;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:Math.round(kcal/5)*5,
          p:prot,c:carb,f:fat,water:Math.round(w*35/100)*100};
}
function targetsMatch(rec){
  return rec&&rec.kcal===TARGETS.kcal&&rec.p===TARGETS.p&&
         rec.c===TARGETS.c&&rec.f===TARGETS.f&&rec.water===TARGETS.water;
}
function applyTargets(){
  var t=profileTargets(loadProfile());
  if(!t)return;
  try{localStorage.setItem(TARGETS_KEY,JSON.stringify({kcal:t.kcal,p:t.p,c:t.c,f:t.f,water:t.water}));}catch(e){}
  loadTargets();renderProfile();showToast('היעדים עודכנו');
}
function resetTargets(){
  try{localStorage.removeItem(TARGETS_KEY);}catch(e){}
  loadTargets();renderProfile();showToast('חזרה ליעדים המקוריים');
}

function renderProfile(){
  var p=loadProfile(),h='',i;
  var age=profileAge(p.birth),bmi=profileBMI(p);

  h+='<div class="card"><div class="cttl">פרטים אישיים</div>';
  h+='<div class="pf-row"><label class="pf-lbl">תאריך לידה</label>'+
     '<input class="pf-in" type="date" value="'+(p.birth||'')+'" onchange="profSet(\u0027birth\u0027,this.value)">'+
     '<span class="pf-note">'+(age===null?'':age+' שנים')+'</span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">מין</label><div class="pf-sexes">'+
     '<button class="pf-sex'+(p.sex==='m'?' on':'')+'" onclick="profSet(\u0027sex\u0027,\u0027m\u0027)">זכר</button>'+
     '<button class="pf-sex'+(p.sex==='f'?' on':'')+'" onclick="profSet(\u0027sex\u0027,\u0027f\u0027)">נקבה</button>'+
     '</div><span class="pf-note"></span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">גובה</label>'+
     '<input class="pf-in" type="number" inputmode="decimal" step="0.5" placeholder="0" value="'+(p.height!==undefined?p.height:'')+'" onchange="profNum(\u0027height\u0027,this)">'+
     '<span class="pf-note">ס"מ</span></div>';
  h+='<div class="pf-row"><label class="pf-lbl">משקל</label>'+
     '<input class="pf-in" type="number" inputmode="decimal" step="0.1" placeholder="0" value="'+(p.weight!==undefined?p.weight:'')+'" onchange="profNum(\u0027weight\u0027,this)">'+
     '<span class="pf-note">ק"ג</span></div>';
  if(bmi!==null)
    h+='<div class="pf-derived">BMI '+bmi+'</div>';
  h+='</div>';

  h+='<div class="card"><div class="cttl">פעילות גופנית</div><div class="pf-acts">';
  for(i=0;i<ACT_LEVELS.length;i++){
    var a=ACT_LEVELS[i];
    h+='<button class="pf-act'+(p.activity===a.v?' on':'')+'" onclick="profSet(\u0027activity\u0027,'+a.v+')">'+
       '<span class="pf-actn">'+a.v+'</span>'+
       '<span class="pf-actt">'+a.t+'</span>'+
       '<span class="pf-acts2">'+a.s+'</span></button>';
  }
  h+='</div></div>';

  h+='<div class="card"><div class="cttl">מטרה</div><div class="pf-goals">';
  for(i=0;i<GOALS.length;i++){
    var g=GOALS[i];
    h+='<button class="pf-goal'+(p.goal===g.v?' on':'')+'" onclick="profSet(\u0027goal\u0027,\u0027'+g.v+'\u0027)">'+g.t+'</button>';
  }
  h+='</div>';
  var gd=goalDef(p.goal);
  if(gd)h+='<div class="pf-goaln">'+gd.n+'</div>';
  h+='</div>';

  var rec=profileTargets(p);
  if(rec){
    var same=targetsMatch(rec);
    h+='<div class="card"><div class="cttl">יעד מומלץ</div>';
    h+='<div class="pf-bmr">שריפה במנוחה '+rec.bmr.toLocaleString()+' &middot; עם הפעילות '+rec.tdee.toLocaleString()+' קק"ל ליום</div>';
    var rows=[
      {v:rec.kcal.toLocaleString(),l:'קק"ל',cur:TARGETS.kcal.toLocaleString(),col:'#a690cf'},
      {v:rec.p+'g',l:'חלבון',cur:TARGETS.p+'g',col:'#e08a72'},
      {v:rec.c+'g',l:'פחמימה',cur:TARGETS.c+'g',col:'#8fc79e'},
      {v:rec.f+'g',l:'שומן',cur:TARGETS.f+'g',col:'#e8c162'}
    ];
    h+='<div class="pf-recs">';
    for(i=0;i<rows.length;i++){
      var rw=rows[i],ch=rw.v!==rw.cur;
      h+='<div class="pf-rec"><div class="pf-recv" style="color:'+rw.col+'">'+rw.v+'</div>'+
         '<div class="pf-recl">'+rw.l+'</div>'+
         '<div class="pf-recc'+(ch?' chg':'')+'">'+(ch?'כעת '+rw.cur:'ללא שינוי')+'</div></div>';
    }
    h+='</div>';
    h+='<div class="pf-water">מים '+rec.water.toLocaleString()+' מ"ל'+
       (rec.water!==TARGETS.water?' <span class="chg">(כעת '+TARGETS.water.toLocaleString()+')</span>':'')+'</div>';
    if(same)
      h+='<div class="pf-same">היעדים שלך כבר תואמים את החישוב.</div>';
    else
      h+='<button class="pf-apply" onclick="applyTargets()">עדכן את היעדים לפי זה</button>'+
         '<div class="pf-hint">עד שתלחץ, שום דבר במעקב לא משתנה.</div>';
    if(targetsAreCustom())
      h+='<button class="pf-reset" onclick="resetTargets()">חזרה ליעדים המקוריים</button>';
    h+='</div>';
  } else {
    h+='<div class="card"><div class="cttl">יעד מומלץ</div>'+
       '<div class="pf-need">מלא את כל הפרטים למעלה ואחשב לך יעד קלוריות ומאקרו.</div></div>';
  }

  document.getElementById('content').innerHTML=h;
}

var CATS=[
  ['breakfast','בוקר'],
  ['lunch','צהריים'],
  ['dinner','ערב'],
  ['snack','נישנוש'],
  ['drinks','משקאות']
];
var QUESTIONS=[
  {id:'mood',type:'stars',text:'איך הייתה המזג שלך היום?'},
  {id:'body',type:'stars',text:'איך הגוף שלך הרגיש?'},
  {id:'moment',type:'text',text:'מה היה הרגע הכי טוב שלך היום?',placeholder:'כתוב במילים שלך...'},

  {id:'quote',type:'text',text:'משפט שתפס אותך היום',placeholder:'משפט, מחשבה, רגע...'}
];


function r2(v){return Math.round(v*100)/100;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var curDate=todayStr(),curTab='today',manOpen=false,libOpen=false,compOpen=false,compCat='breakfast';
var pendingLib=null,toastTimer,saveToLib=false;
var builderCat='breakfast',builderName='',builderIngs=[],builderPickOpen=false;
var interviewStep=-1,interviewAnswers={},calMonth=new Date();

function todayStr(){var d=new Date();return d.toISOString().slice(0,10);}
function fmtDate(s){
  var d=new Date(s+'T12:00:00');
  var dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  var mn=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  return dn[d.getDay()]+', '+d.getDate()+' ב'+mn[d.getMonth()];
}
function fmtTime(){var d=new Date();return d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function showToast(msg){
  var old=document.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){if(t.parentNode)t.remove();},2000);
}
function starsHTML(n,max){var s='';for(var i=1;i<=max;i++)s+='<span style="color:'+(i<=n?'#e8c162':'#f2ede6')+'">&#9733;</span>';return s;}

function loadDay(d){try{var x=localStorage.getItem('day_'+d);return x?JSON.parse(x):{meals:[],water:0};}catch(e){return{meals:[],water:0};}}
function saveDay(d,data){try{localStorage.setItem('day_'+d,JSON.stringify(data));}catch(e){}}
/* ── PHOTO STORE ──
   Photos used to sit as data URIs inside the day's record. localStorage has
   about 5MB for the whole app, a day photo is ~580KB and a flow anchor ~270KB,
   so three or four days filled it - and setItem failing throws into an empty
   catch, which means a summary would look saved and not be.

   Pictures now live in IndexedDB, whose quota is orders of magnitude larger,
   and a record keeps only a key. Rendering stays synchronous: markup carries
   data-photo="<key>" with no src, and hydratePhotos fills it in when the read
   comes back. Anything that still holds a data: URI - every photo written
   before this - keeps rendering directly, so nothing had to be migrated for
   the app to keep working. */
var _idb=null,_idbDead=false;
function idbOpen(){
  if(_idb)return Promise.resolve(_idb);
  if(_idbDead||!window.indexedDB)return Promise.resolve(null);
  return new Promise(function(res){
    var rq;
    try{rq=indexedDB.open('bm-photos',1);}catch(e){_idbDead=true;return res(null);}
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore('p');}catch(e){}};
    rq.onsuccess=function(){_idb=rq.result;res(_idb);};
    rq.onerror=function(){_idbDead=true;res(null);};
    rq.onblocked=function(){res(null);};
  });
}
function idbStore(mode){
  return idbOpen().then(function(db){
    if(!db)return null;
    try{return db.transaction('p',mode).objectStore('p');}catch(e){return null;}
  });
}
function photoPut(dataURI){
  var key='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  return idbStore('readwrite').then(function(st){
    if(!st)return null;
    return new Promise(function(res){
      var rq;
      try{rq=st.put(dataURI,key);}catch(e){return res(null);}
      rq.onsuccess=function(){res(key);};
      rq.onerror=function(){res(null);};
    });
  });
}
function photoGet(key){
  return idbStore('readonly').then(function(st){
    if(!st)return null;
    return new Promise(function(res){
      var rq;

      rq.onsuccess=function(){res(rq.result||null);};
      rq.onerror=function(){res(null);};
    });

}
function photoDel(ref){
  if(!isPhotoKey(ref))return Promise.resolve();
  return idbStore('readwrite').then(function(st){if(st){try{st.delete(ref);}catch(e){}}});
}
function photoAll(){
  return idbStore('readonly').then(function(st){
    if(!st)return {};
    return new Promise(function(res){
      var out={},rq;
      try{rq=st.openCursor();}catch(e){return res(out);}
      rq.onsuccess=function(){var c=rq.result;if(!c)return res(out);out[c.key]=c.value;c.continue();};
      rq.onerror=function(){res(out);};

function photoPutKeyed(key,dataURI){
  return idbStore('readwrite').then(function(st){
    if(!st)return;

}
// A legacy value is the picture itself; a new one is a key into the store.
function isPhotoKey(v){return !!v&&typeof v==='string'&&v.indexOf('data:')!==0;}
function photoImg(ref,attrs){
  if(!ref)return '';
  if(isPhotoKey(ref))return '<img data-photo="'+esc(ref)+'" '+(attrs||'')+'>';
  return '<img src="'+ref+'" '+(attrs||'')+'>';
}
function hydratePhotos(root){
  var els=(root||document).querySelectorAll('img[data-photo]'),i;
  for(i=0;i<els.length;i++)(function(el){

/* One-time move of the photos already written into the day records. Each one
   is written to the store before the record is rewritten, so a failure part
   way through leaves the original data URI in place rather than a dangling
   key. Runs quietly in the background; the app works either way. */
function migratePhotos(){
  var FLAG='photos_in_idb';
  try{if(localStorage.getItem(FLAG)==='1')return;}catch(e){return;}
  idbOpen().then(function(db){
    if(!db)return;
    var keys=[],i,k;
    for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&k.indexOf('sum_')===0)keys.push(k);}
    var chain=Promise.resolve();
    keys.forEach(function(sk){
      chain=chain.then(function(){
        var r;
        try{r=JSON.parse(localStorage.getItem(sk));}catch(e){return;}
        if(!r)return;
        var jobs=[],moved={n:0};
        if(r.photo&&!isPhotoKey(r.photo))
          jobs.push(photoPut(r.photo).then(function(key){if(key){r.photo=key;moved.n++;}}));
        if(Array.isArray(r.flow))r.flow.forEach(function(it){
          if(it&&typeof it==='object'&&it.p&&!isPhotoKey(it.p))
            jobs.push(photoPut(it.p).then(function(key){if(key){it.p=key;moved.n++;}}));
        });
        if(!jobs.length)return;
        return Promise.all(jobs).then(function(){
          if(moved.n){try{localStorage.setItem(sk,JSON.stringify(r));}catch(e){}}
        });
      });
    });
    return chain.then(function(){try{localStorage.setItem(FLAG,'1');}catch(e){}});
  });
}

/* flow has had three shapes: a comma-separated string, an array of strings,
   and now {w,p} so an anchor can carry its own photo. Everything reads it
   through here, so an old summary opens the same as a new one. */
function parseFlow(v){
  var out=[],i,s;
  if(Array.isArray(v)){
    for(i=0;i<v.length;i++){
      s=v[i];if(!s)continue;
      if(typeof s==='string'){if(s.trim())out.push({w:s.trim(),p:''});}
      else if(s.w||s.p)out.push({w:s.w||'',p:s.p||''});
    }
  } else if(typeof v==='string'&&v){
    var parts=v.split(/[,\n]|←|→/);
    for(i=0;i<parts.length;i++){s=parts[i].trim();if(s)out.push({w:s,p:''});}
  }
  return out;
}

   A web page has no access to HealthKit, and never will - that is Apple's
   line, not a gap in this app. The native shell this prototype is headed for

function nativeHealth(){

// The shell calls this back with {"2026-08-30": 8412, ...} once HealthKit
// has answered. Same merge rule as every other source: it is a write, and
// the newest write for a day wins.
window.onHealthSteps=function(days){
  if(!days||typeof days!=='object')return 0;
  var n=0;
  Object.keys(days).forEach(function(d){
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&typeof days[d]==='number'){saveSteps(d,days[d],'health');n++;}
  });

    var s=loadStepsSrc();s.kind='health';s.last=new Date().toISOString();saveStepsSrc(s);
    showToast('✓ עודכן מ־Apple Health');
  }
  if(typeof _fitView!=='undefined'&&(_fitView==='steps'||_fitView==='steps-setup'))renderFitness();
  return n;
};

/* The token the shortcut posts alongside the step count. It is a bearer
   secret: whoever holds it can write steps for this install and nothing else.
   Generated once, on the setup screen, and never leaves the device except in
   the shortcut the user builds. */
function stepsToken(){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(/^[a-f0-9]{32}$/.test(t))return t;
  var a=new Uint8Array(16),i;
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);
  t='';for(i=0;i<16;i++)t+=('0'+a[i].toString(16)).slice(-2);
  try{localStorage.setItem('steps_token',t);}catch(e){}
  return t;
}

/* Pull whatever the shortcut has posted since we last looked. The newest write
   wins per day whatever wrote it, so a number typed by hand this morning is
   replaced by the watch's real count tonight - and a correction typed after
   the watch reported is not undone on the next sync. */
function syncStepsFromServer(cb){
  var t='';
  try{t=localStorage.getItem('steps_token')||'';}catch(e){}
  if(!SYNC_SERVER||!/^[a-f0-9]{32}$/.test(t)){if(cb)cb(false);return;}
  fetch(SYNC_SERVER+'/steps?token='+t,{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(o){
      if(!o||!o.days){if(cb)cb(false);return;}
      var changed=0;
      Object.keys(o.days).forEach(function(d){
        var remote=o.days[d];
        if(!remote||typeof remote.v!=='number')return;
        var local=loadSteps(d);
        if(local&&local.at&&remote.at&&new Date(local.at)>=new Date(remote.at))return;
        if(local&&local.v===remote.v)return;
        saveSteps(d,remote.v,'server');
        changed++;
      });
      if(changed){
        var s=loadStepsSrc();s.kind='server';s.last=new Date().toISOString();saveStepsSrc(s);
      }
      if(cb)cb(changed>0);
    })
    .catch(function(){if(cb)cb(false);});
}

/* ── THE FOOD DATABASE ──
   3,623 foods from the Ministry of Health's national table, every one of them
   per 100 g. It is fetched the first time the card is opened rather than at
   startup: 400KB is not worth spending on someone who only ever taps their
   own saved meals.

   The card paints its own results instead of going through render(), which
   rebuilds the whole screen and would take the keyboard away after every
   letter typed.

   The data file sits beside the app on the server and dev is one directory
   deeper, so the path is worked out from where the page itself is. */
function appBase(){
  return location.pathname.replace(/[^\/]*$/,'').replace(/(^|\/)dev\/$/,'$1');
}
var _foods=null,_foodsState='idle';
var fdbOpen=false,fdbPick=null,fdbGrams=100,_fdbQ='';
function foodsLoad(then){
  if(_foodsState==='ready'){then();return;}
  if(_foodsState==='loading')return;
  _foodsState='loading';fdbPaint();
  fetch(appBase()+'data/foods.json')
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){
      _foods=(d&&d.foods)||[];
      // matching ignores the punctuation Hebrew food names are inconsistent
      // about, so קוטג' and קוטג׳ and קוטג all find each other
      for(var i=0;i<_foods.length;i++)_foods[i].s=foodKey(_foods[i].n);
      _foodsState='ready';then();
    })
    .catch(function(){_foodsState='error';fdbPaint();});
}
function foodKey(s){
  return String(s).replace(/['’׳"“”״,.\-]/g,'').replace(/\s+/g,' ').trim();
}
function foodSearch(q){
  q=foodKey(q);
  if(!q||!_foods)return [];
  var starts=[],has=[],i,f,at;
  for(i=0;i<_foods.length;i++){
    f=_foods[i];
    at=f.s.indexOf(q);
    if(at===0)starts.push(f);
    else if(at>0)has.push(f);
    if(starts.length>=40)break;
  }
  return starts.concat(has).slice(0,40);
}

/* ── SCANNING A BARCODE ──
   Safari has no BarcodeDetector and shows no sign of getting one, so the
   decoding is done in JavaScript by html5-qrcode, vendored into the repo
   rather than pulled off a CDN: this app is meant to keep working when the
   network is poor, and a scanner that needs a third party to be up is not a
   scanner. It is 375KB and loads only when the scan button is pressed.

   The barcode is looked up in Open Food Facts, which carries Israeli
   supermarket products under their Hebrew names and hands back values per
   100 g - the same basis as the ministry database and the same "how many
   grams?" panel. Their licence asks for attribution, so the result says
   where it came from.

   Typing the digits by hand does the same lookup. That is not a fallback
   nobody uses: a bad light, a creased wrapper or a refused camera all end
   there, and the digits are printed under the bars for exactly this reason. */
var OFF_API='https://world.openfoodfacts.org/api/v2/product/';
var _scanLib=null,_scanner=null,_fdbScanned=null;
