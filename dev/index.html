/* שאלה על התזונה */
.ask-bar{width:100%;display:flex;align-items:center;gap:9px;background:#fff;border:none;border-radius:18px;padding:13px 15px;margin-bottom:12px;box-shadow:0 3px 12px rgba(200,180,160,.11);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#a89e97;text-align:right}
.ask-q{flex-shrink:0;width:23px;height:23px;border-radius:50%;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ask-card{background:#fff;border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.13)}
.ask-hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:#4a4340;margin-bottom:11px}
.ask-x{background:none;border:none;font-size:20px;line-height:1;color:#c0b6ae;cursor:pointer;font-family:inherit;padding:0 2px}
.ask-row{display:flex;gap:7px}
.ask-in{flex:1;min-width:0;border:1.5px solid #f0ebe3;border-radius:12px;padding:11px 12px;font-family:inherit;font-size:13px;color:#4a4340;background:#fbf7f2}
.ask-in:focus{outline:none;border-color:#c9bce0;background:#fff}
.ask-go{flex-shrink:0;border:none;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.ask-tr{margin-top:11px;display:flex;flex-direction:column;gap:3px}
.ask-tr div{font-size:9.5px;color:#c0b8b0}
.ask-tr div:before{content:'\2713 ';color:#bfe0c7}
.ask-w{font-size:11.5px;color:#a690cf;margin-top:9px}
.ask-err{font-size:12px;color:#c98b8b;margin-top:9px;line-height:1.6}
.ask-a{font-size:13px;color:#4a4340;line-height:1.75;margin-top:10px;background:#fbf7f2;border-radius:13px;padding:12px}
.ask-note{font-size:9.5px;color:#c0b8b0;margin-top:10px;line-height:1.5}
/* חיתוך */
.crop-ov{position:fixed;inset:0;z-index:600;background:#2a2422;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;direction:rtl}
.crop-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center}
.crop-modes{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.crop-m{border:none;background:none;border-radius:10px;padding:9px 20px;font-family:inherit;font-size:12.5px;font-weight:800;color:#a49a92;cursor:pointer}
.crop-m.on{background:#fff;color:#4a4340}
/* no overflow clipping: the handles sit outside the frame by design, and
   hiding them made the ones at the picture's edge impossible to see or grab */
.crop-stage{position:relative;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px}
.crop-img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;border-radius:4px}
.crop-can{position:absolute;inset:0;pointer-events:none}
.crop-shade{position:absolute;background:rgba(40,34,32,.6);pointer-events:none}
.crop-box{position:absolute;border:2px solid #fff;pointer-events:none}
/* drawn only - what you grabbed is worked out from how close you got */
.ch{position:absolute;background:#fff;border-radius:3px;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ch-n,.ch-s{left:50%;width:34px;height:6px;margin-left:-17px}
.ch-n{top:-4px}.ch-s{bottom:-4px}
.ch-w,.ch-e{top:50%;width:6px;height:34px;margin-top:-17px}
.ch-w{right:auto;left:-4px}.ch-e{left:auto;right:-4px}
.ch-nw,.ch-ne,.ch-sw,.ch-se{width:18px;height:18px;border-radius:4px}
.ch-nw{top:-7px;left:-7px}.ch-ne{top:-7px;right:-7px}
.ch-sw{bottom:-7px;left:-7px}.ch-se{bottom:-7px;right:-7px}
.crop-hint{font-size:11px;color:#a49a92;text-align:center;line-height:1.6;max-width:300px}
/* the batch, as pictures */
.crop-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:320px}
.crop-th{width:34px;height:34px;border-radius:7px;overflow:hidden;border:2px solid transparent;opacity:.4;transition:opacity .15s,border-color .15s}
.crop-th img{width:100%;height:100%;object-fit:cover;display:block}
.crop-th.done{opacity:.75;border-color:rgba(143,199,158,.7)}
.crop-th.now{opacity:1;border-color:#c9bce0;transform:scale(1.08)}
.crop-n{position:absolute;top:-2px;right:16px;font-size:11.5px;font-weight:800;color:#a49a92}
.crop-stop{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom));left:0;right:0;margin:0 auto;display:block;width:88px;border:none;background:none;font-family:inherit;font-size:10.5px;font-weight:700;color:#7d746e;cursor:pointer}
.crop-bot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px}
.crop-x,.crop-ok{border:none;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;border-radius:13px;padding:12px 22px}
.crop-x{background:none;color:#b9b0a8}
.crop-ok{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.crop-rs{border:1px solid rgba(255,255,255,.18);background:none;border-radius:11px;padding:10px 18px;font-family:inherit;font-size:11.5px;font-weight:800;color:#a49a92;cursor:pointer}
/* מפת הכוכבים — צד הכתיבה */
.cm-wrap.text{height:auto;min-height:0;padding-bottom:24px}
.cx-tabs{display:flex;gap:3px;background:#f0ebe3;border-radius:11px;padding:3px}
.cx-tab{border:none;background:none;border-radius:9px;padding:7px 14px;font-family:inherit;font-size:11.5px;font-weight:800;color:#a89e97;cursor:pointer}
.cx-tab.on{background:#fff;color:#4a4340;box-shadow:0 1px 4px rgba(200,180,160,.2)}
.cx-body{padding-top:4px}
.cx-sec{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(200,180,160,.12)}
.cx-lab{font-size:9.5px;font-weight:800;color:#a89e97;letter-spacing:.09em;margin-bottom:9px}
.cx-lab2{margin:0 2px 9px}
.cx-big{width:100%;border:none;border-bottom:1.5px solid #f0ebe3;background:none;padding:8px 2px;font-family:inherit;font-size:17px;font-weight:800;color:#4a4340;outline:none}
.cx-big:focus{border-bottom-color:#a690cf}
.cx-why{width:100%;border:none;background:none;padding:9px 2px 2px;font-family:inherit;font-size:12px;color:#a89e97;outline:none;font-style:italic}
.cx-date{font-size:10px;color:#c0b8b0;margin-top:6px}
.cx-none{font-size:11.5px;color:#c0b8b0;line-height:1.65;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.cx-m{background:#fff;border-radius:18px;padding:12px;margin-bottom:9px;box-shadow:0 3px 12px rgba(200,180,160,.11)}
.cx-m.done{background:linear-gradient(135deg,#f6fbf7,#eef7f1)}
.cx-mrow,.cx-srow{display:flex;align-items:center;gap:8px}
.cx-srow{padding:4px 0}
.cx-tick{flex-shrink:0;width:23px;height:23px;border-radius:8px;border:1.5px solid #e0d8ce;background:none;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.cx-tick.sm{width:19px;height:19px;border-radius:6px;font-size:11px}
.cx-tick.on{background:linear-gradient(135deg,#bfe0c7,#8fc79e);border-color:transparent}
.cx-mt{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:14px;font-weight:800;color:#4a4340;outline:none;padding:6px 0}
.cx-st{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:12.5px;color:#4a4340;outline:none;padding:5px 0}
.cx-st.done{color:#a89e97;text-decoration:line-through}
.cx-mt:focus,.cx-st:focus{border-bottom:1.5px solid #c9bce0}
.cx-del{flex-shrink:0;background:none;border:none;font-size:17px;line-height:1;color:#e0d8ce;cursor:pointer;font-family:inherit;padding:0 3px}
.cx-steps{margin:6px 0 2px;padding-right:10px;border-right:2px solid #f2ede6}
.cx-adds{background:none;border:none;font-family:inherit;font-size:11px;font-weight:800;color:#a690cf;cursor:pointer;padding:6px 2px 2px}
.cx-addm{width:100%;border:1.5px dashed #ddd3e8;background:none;border-radius:14px;padding:12px;margin-top:4px;font-family:inherit;font-size:12.5px;font-weight:800;color:#a690cf;cursor:pointer}
.cx-note{font-size:10px;color:#c0b8b0;line-height:1.6;margin-top:12px;padding:0 2px}
/* מפת הכוכבים */
.cm-go{width:100%;margin-top:9px;border:none;border-radius:11px;padding:9px;background:linear-gradient(135deg,#2f2b46,#413a63);color:#e9e2ff;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer}
.cm-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:420px}
.cm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cm-back{background:none;border:none;font-family:inherit;font-size:12px;font-weight:700;color:#a89e97;cursor:pointer;padding:0}
.cm-pct{font-size:13px;font-weight:800;color:#a690cf}
.cm-sky{flex:1;position:relative;border-radius:22px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 90% at 50% 0%,#3b3560 0%,#241f3d 45%,#181430 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.cm-sky svg{width:100%;height:100%;display:block}
.cm-th{stroke:rgba(190,178,232,.22);transition:stroke .45s,filter .45s}
.cm-th.on{stroke:rgba(255,214,120,.85);filter:drop-shadow(0 0 4px rgba(255,201,84,.65))}
.cm-star{fill:#6f6699;stroke:rgba(203,185,245,.55);stroke-width:1;transition:fill .4s,stroke .4s,filter .4s}
.cm-n.on .cm-star{fill:#ffe07a;stroke:#fff5cf;filter:drop-shadow(0 0 7px rgba(255,206,90,.9))}
.cm-g .cm-star{fill:#8f83c4;stroke:#d8ccff;stroke-width:1.4}
.cm-g.on .cm-star{fill:#ffe9a3;stroke:#fff}
.cm-halo{opacity:.5;transition:opacity .4s}
.cm-n.on .cm-halo{opacity:1}
.cm-hit{fill:transparent;cursor:pointer}
.cm-n{cursor:pointer;transition:opacity .3s}
.cm-n.dim{opacity:.2}
.cm-t{fill:#cfc6ea;font-size:19px;font-weight:700;font-family:inherit;pointer-events:none}
.cm-n.on .cm-t{fill:#ffeec2}
.cm-g .cm-t{font-size:25px;fill:#fff;font-weight:800}
/* the step you said you are on next */
.cm-n.act .cm-star{stroke:#8fe0c7;stroke-width:1.8}
/* finishing something */
@keyframes cmPulse{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}
.cm-n.on .cm-halo{animation:cmPulse 1s ease-out}
@keyframes cmCheer{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}
  78%{opacity:1}100%{opacity:0}}
.cm-cheer{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:13px;font-weight:800;
  color:#ffe6a6;text-shadow:0 2px 12px rgba(0,0,0,.7);animation:cmCheer 1.9s ease-out forwards;pointer-events:none}
.cm-bar{padding-top:10px}
.cm-hint{font-size:10.5px;color:#a89e97;line-height:1.55;margin-bottom:8px;text-align:center}
.cm-foc{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;font-weight:800;color:#4a4340;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.cm-x{background:none;border:none;font-size:19px;line-height:1;color:#c0b6ae;cursor:pointer;font-family:inherit;padding:0 2px}
.cm-add{width:100%;border:none;border-radius:14px;padding:12px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
/* הארון שלי */
.cl-mirror{position:relative;background:#fff;border-radius:20px;padding:10px 8px;margin-bottom:10px;box-shadow:0 3px 14px rgba(200,180,160,.12)}
/* The place a garment is brought to, drawn as the two edges it sits between
   rather than as a line through the middle of it. One per row, and each is
   as wide as that row's clothes, so the brackets actually hug what is in
   them - a dress and a pair of socks do not want the same slot.

   Not centred on the card: on the TRACK. Every row spends 75px on its right
   for the label and an arrow, and 20px on its left for the other, so the
   strip sits 27.5px left of the card's middle. Fixed widths, so the offset
   is exact at any screen size. */
.cl-zone{position:absolute;top:1px;bottom:1px;left:calc(50% - 27.5px);
  transform:translateX(-50%);pointer-events:none;z-index:2;
  border-left:2px solid rgba(166,144,207,.75);border-right:2px solid rgba(166,144,207,.75);
  border-radius:3px}
.cl-zone:before,.cl-zone:after{content:'';position:absolute;left:-2px;right:-2px;height:2px;
  background:rgba(166,144,207,.75)}
.cl-zone:before{top:-1px;clip-path:polygon(0 0,22% 0,22% 100%,0 100%,0 0,100% 0,100% 100%,78% 100%,78% 0,100% 0)}
.cl-zone:after{bottom:-1px;clip-path:polygon(0 0,22% 0,22% 100%,0 100%,0 0,100% 0,100% 100%,78% 100%,78% 0,100% 0)}
/* a row a one-piece has made irrelevant */
.cl-row.off{opacity:.32;pointer-events:none;filter:grayscale(.6)}
.cl-none{display:flex;align-items:center;justify-content:center;font-family:inherit;
  font-size:11px;font-weight:800;color:#c0b8b0;border-style:dashed!important}
/* half the track either side, so the first and last garment can reach it */
.cl-pad{flex-shrink:0;width:calc(50% - 26px);pointer-events:none}
.cl-mirror.side{padding:8px}
.cl-row{position:relative;z-index:1;display:flex;align-items:center;gap:3px}
.cl-row+.cl-row{margin-top:5px;border-top:1px solid #f7f2ec;padding-top:5px}
.cl-lab{flex-shrink:0;width:52px;text-align:right;padding-left:2px}
.cl-rt{display:block;font-size:10px;font-weight:800;color:#4a4340;line-height:1.2}
.cl-rn{display:block;font-size:8.5px;color:#c0b8b0;font-weight:700}
.cl-arw{flex-shrink:0;width:17px;border:none;background:none;font-size:17px;line-height:1;color:#d8cfc7;cursor:pointer;font-family:inherit;padding:0}
.cl-track{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cl-track::-webkit-scrollbar{display:none}
.cl-cell{position:relative;flex-shrink:0;display:block;line-height:0}
.cl-it{scroll-snap-align:center;border:2px solid #f2ede6;border-radius:11px;background:#fff;padding:0;overflow:hidden;cursor:pointer;opacity:.45;transition:opacity .15s,border-color .15s}
.cl-it.on{opacity:1;border-color:#a690cf}
.cl-img{width:100%;height:100%;object-fit:contain;display:block}
.cl-x{position:absolute;top:-5px;left:-5px;width:17px;height:17px;border:none;border-radius:50%;background:#e0d8ce;color:#fff;font-size:12px;line-height:17px;padding:0;cursor:pointer;font-family:inherit}
.cl-add,.cl-empty{flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px dashed #e0d8ce;border-radius:11px;color:#c0b8b0;font-size:14px;font-weight:800;cursor:pointer;background:none}
.cl-empty{flex:1;font-size:11px}
/* what is on the line, big enough to judge */
.cl-pick{background:#fff;border-radius:20px;padding:14px 12px 12px;margin-top:10px;box-shadow:0 3px 14px rgba(200,180,160,.12)}
.cl-pick-h{font-size:11px;font-weight:800;color:#4a4340;margin-bottom:11px;padding:0 2px}
.cl-pick-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cl-pick-row::-webkit-scrollbar{display:none}
.cl-pick-i{flex-shrink:0;width:74px;text-align:center}
.cl-pick-ph{width:74px;height:74px;border-radius:14px;overflow:hidden;border:2px solid #f2ede6;background:#fff}
.cl-pick-t{font-size:9.5px;color:#a89e97;font-weight:700;margin-top:5px}
.cl-pick-n{font-size:10px;font-weight:800;color:#c0b8b0;margin-top:2px}
.cl-pick-n.on{color:#a690cf}
.cl-pick-f{font-size:9.5px;color:#c0b8b0;margin-top:10px;padding:0 2px;line-height:1.5}
.cl-acts{display:flex;gap:8px;margin-top:11px}
.cl-b1,.cl-b2,.cl-b3{flex:1;border:none;border-radius:14px;padding:12px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
.cl-b1{background:#f5f0eb;color:#a89e97}
.cl-b2{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.cl-b3{background:#fff;color:#a89e97;box-shadow:0 2px 9px rgba(200,180,160,.12);font-size:11.5px}
.cl-intro{font-size:11.5px;color:#a89e97;line-height:1.75;background:#fff;border-radius:16px;padding:14px;margin-bottom:11px}
.cl-busy{font-size:11px;color:#a690cf;padding:0 2px 8px}
.cl-back{background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;font-family:inherit;padding:0 0 12px}
.cl-h2{font-size:14px;font-weight:800;color:#4a4340;margin-bottom:11px}
.cl-none{font-size:11.5px;color:#c0b8b0;line-height:1.7}
.cl-fit{background:#fff;border-radius:16px;padding:11px;margin-bottom:9px;box-shadow:0 3px 12px rgba(200,180,160,.11)}
.cl-fit-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.cl-fit-row::-webkit-scrollbar{display:none}
.cl-fit-i{flex-shrink:0;width:52px;height:52px;border-radius:11px;overflow:hidden;border:1.5px solid #f0ebe3}
.cl-fit-b{display:flex;align-items:center;gap:7px;margin-top:9px}
.cl-fit-d{flex:1;font-size:10px;color:#c0b8b0}
.cl-fit-w{background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:9px;padding:6px 14px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.cl-fit-x{background:none;border:none;font-size:17px;color:#e0d8ce;cursor:pointer;font-family:inherit;padding:0 4px}
.sr-src{font-size:10px;color:#a89e97;line-height:1.6;margin-bottom:7px}
.sr-said{font-size:10px;color:#c0b6ae;margin-bottom:6px}
.sr-w{display:flex;align-items:center;gap:5px;margin-bottom:7px;font-size:10.5px;color:#a89e97;font-weight:700}
.sr-win{width:52px;border:1.5px solid #f2ede6;border-radius:8px;padding:4px;font-size:12px;font-weight:800;text-align:center;outline:none;font-family:inherit;color:#4a4340}
.sr-alts{display:flex;flex-wrap:wrap;gap:4px}
.sr-alt{border:1.5px solid #f2ede6;border-radius:9px;padding:5px 8px;background:#fdfbf9;font-size:10px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-other{width:100%;margin-top:7px;border:none;background:none;padding:4px;font-size:10px;font-weight:700;color:#a690cf;cursor:pointer;font-family:inherit}
.say-tot{margin-top:12px;padding:10px;border-radius:11px;background:#faf7f3;font-size:12.5px;font-weight:700;color:#7a716b;text-align:center}
.st-k{font-size:21px;font-weight:800;color:#a690cf;line-height:1.15}
.st-k span{font-size:12px;font-weight:700;color:#a89e97}
.st-m{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:7px;font-size:11.5px;color:#7a716b;font-weight:600}
.st-m b{font-weight:800;color:#4a4340}
.st-none{font-size:12px;color:#c0b6ae}
.say-add{width:100%;margin-top:9px;border:none;border-radius:13px;padding:13px;background:linear-gradient(135deg,#bfe0c7,#8fc79e);color:#fff;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.say-note{margin-top:9px;font-size:9.5px;color:#c0b6ae;text-align:center;line-height:1.6}
/* the ministry database - a search card sitting above your own library */
/* the scanner - a sheet over everything, because a camera needs the screen */
.scan-btn{width:100%;margin-bottom:8px;border:none;border-radius:12px;padding:11px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
.scan-overlay{position:fixed;inset:0;background:rgba(74,67,64,.72);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-sheet{width:100%;max-width:400px;background:#fbf7f2;border-radius:20px;padding:14px;box-shadow:0 18px 46px rgba(74,67,64,.32)}
.scan-hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:#4a4340;margin-bottom:11px}
.scan-x{border:none;background:none;font-size:24px;line-height:1;color:#a89e97;cursor:pointer;padding:0 4px;font-family:inherit}
.scan-cam{width:100%;aspect-ratio:4/3;background:#2a2522;border-radius:14px;overflow:hidden;position:relative}
.scan-cam video,.scan-frozen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1c1917}
.scan-frozen{display:none}
.scan-frozen.on{display:block}
/* the band the crop is taken from, so you can see where to hold it */
.scan-guide{position:absolute;left:6%;right:6%;top:32%;height:36%;border:2px dashed rgba(255,255,255,.75);border-radius:10px;pointer-events:none}
.scan-shot{width:100%;margin-top:10px;border:none;border-radius:13px;padding:14px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.scan-shot:disabled{opacity:.5}
.scan-cam video{width:100%;height:100%;object-fit:cover}
.scan-msg{font-size:11.5px;color:#7a716b;text-align:center;line-height:1.6;margin-top:10px;min-height:32px}
.scan-photo{display:block;margin-top:9px;border:1.5px solid #c9bce0;border-radius:12px;padding:10px;background:#fff;color:#7a6a9c;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;text-align:center}
.scan-manual{display:flex;gap:7px;margin-top:10px}
.scan-in{flex:1;min-width:0;border:1.5px solid #f2ede6;border-radius:11px;padding:10px;font-size:16px;font-family:inherit;outline:none;text-align:center;background:#fff}
.scan-in:focus{border-color:#c9bce0}
.scan-go{border:none;border-radius:11px;padding:10px 16px;background:#4a4340;color:#fff;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer}
.fdb-src{margin-top:8px;font-size:9.5px;color:#c0b6ae;text-align:center;font-weight:700}
.fdb-in{width:100%;border:1.5px solid #f2ede6;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;outline:none;margin-bottom:8px;background:#fff}
.fdb-in:focus{border-color:#c9bce0}
.fdb-ai-h{font-size:9.5px;font-weight:800;color:#a690cf;letter-spacing:.07em;margin:2px 2px 6px}
.fdb-ai-h.plain{color:#c0b8b0;margin-top:12px}
.fdb-row.ai{border-right:3px solid #c9bce0}
.fdb-ai-w{font-size:10px;color:#c0b8b0;padding:8px 2px 0}
.fdb-msg{font-size:11.5px;color:#a89e97;padding:10px 4px;text-align:center;line-height:1.6}
.fdb-list{max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:3px}
.fdb-row{display:flex;align-items:center;gap:8px;width:100%;border:none;background:#fff;border-radius:11px;padding:9px 10px;cursor:pointer;font-family:inherit;text-align:right;box-shadow:0 1px 5px rgba(200,180,160,.1)}
.fdb-rn{flex:1;min-width:0;font-size:12px;font-weight:700;color:#4a4340;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdb-rk{font-size:12.5px;font-weight:800;color:#a690cf;flex-shrink:0}
.fdb-ru{font-size:8.5px;color:#c0b6ae;font-weight:700;margin-right:2px}
/* choosing how a food is counted */
.fu-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.fu-b{border:1.5px solid #f2ede6;border-radius:10px;padding:6px 10px;background:#fff;font-size:11px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit}
.fu-b.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
.fu-w{margin-top:8px;font-size:10.5px;color:#a89e97;font-weight:700;display:flex;align-items:center;gap:5px}
.fu-win{width:56px;border:1.5px solid #f2ede6;border-radius:8px;padding:5px;font-size:13px;font-weight:800;text-align:center;outline:none;font-family:inherit;color:#4a4340}
.fu-win:focus{border-color:#c9bce0}
.fdb-conf{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.14)}
.fdb-cname{font-size:13.5px;font-weight:800;color:#4a4340;line-height:1.4}
.fdb-c100{font-size:10.5px;color:#a89e97;margin-top:4px}
.fdb-grow{display:flex;align-items:center;gap:8px;margin-top:12px}
.fdb-glbl{font-size:12px;font-weight:700;color:#4a4340}
.fdb-gin{flex:1;min-width:0;border:1.5px solid #f2ede6;border-radius:10px;padding:9px;font-size:16px;font-weight:800;text-align:center;outline:none;font-family:inherit}
.fdb-gin:focus{border-color:#c9bce0}
.fdb-gu{font-size:11px;color:#a89e97;font-weight:700}
.fdb-preview{margin-top:11px;padding:9px;border-radius:10px;background:#faf7f3;font-size:12px;font-weight:700;color:#7a716b;text-align:center}
.fdb-btns{display:flex;gap:7px;margin-top:11px}
.fdb-add{flex:1;border:none;border-radius:12px;padding:11px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer}
.fdb-back{border:1.5px solid #f2ede6;border-radius:12px;padding:11px 14px;background:none;color:#a89e97;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.fdb-save{width:100%;margin-top:7px;border:1.5px dashed #ddd3ca;border-radius:12px;padding:9px;background:none;color:#a89e97;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.fdb-saved{margin-top:9px;font-size:10.5px;color:#6fb283;font-weight:700;text-align:center}
.pf-sexes{display:flex;gap:6px;flex:1;min-width:0}
.pf-sex{flex:1;border:1.5px solid #f2ede6;border-radius:10px;padding:8px 4px;background:#fff;font-size:12px;font-weight:800;color:#a89e97;cursor:pointer;font-family:inherit}
.pf-sex.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
.pf-bmr{font-size:10.5px;color:#a89e97;font-weight:700;margin-bottom:14px;line-height:1.5}
.pf-recs{display:flex;gap:7px}
.pf-rec{flex:1;text-align:center;min-width:0}
.pf-recv{font-size:17px;font-weight:800;line-height:1.2}
.pf-recl{font-size:10px;color:#a89e97;margin-top:2px}
.pf-recc{font-size:9px;color:#c9c1ba;margin-top:5px;font-weight:700}
.pf-recc.chg{color:#c98b3f}
.pf-water{margin-top:13px;padding-top:11px;border-top:1px solid #f7f3ee;font-size:11.5px;font-weight:700;color:#3a7ca5}
.pf-water .chg{color:#c98b3f;font-size:10px;font-weight:700}
.pf-apply{width:100%;margin-top:14px;border:none;border-radius:14px;padding:13px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.pf-hint{font-size:10px;color:#a89e97;text-align:center;margin-top:8px}
.pf-same{margin-top:14px;font-size:11.5px;color:#6fb283;font-weight:700;text-align:center}
.pf-reset{width:100%;margin-top:9px;border:1.5px solid #f2ede6;border-radius:14px;padding:10px;background:none;color:#a89e97;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer}
.pf-need{font-size:11.5px;color:#a89e97;line-height:1.6}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.cttl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.avgbox{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.avgin{display:flex;justify-content:space-around}
.avgv{font-size:22px;font-weight:700}
.avgl{font-size:10px;color:#a89e97;margin-top:2px}
.cal-card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(200,180,160,.1)}
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-mn{font-size:13px;font-weight:700}
.cal-nav{background:none;border:none;font-size:18px;cursor:pointer;color:#a89e97;padding:4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dh{font-size:9px;color:#a89e97;text-align:center;padding:2px 0}
.cal-d{width:100%;aspect-ratio:1;border:none;border-radius:50%;background:none;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cal-d.has{background:linear-gradient(135deg,#f0eafa,#e8dff5)}
.cal-d.today{font-weight:700;color:#a690cf}
.cal-d.has-photo{padding:0;overflow:hidden}
.cal-d.has-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cal-d-dot{width:4px;height:4px;background:#a690cf;border-radius:50%;margin-top:1px}
/* ── DAILY REFLECTION ──
   One question at a time, nothing else on the screen. Deliberately lighter
   than the rest of the app: no cards, no shadows, no chrome - the question
   and the answer are the whole surface. */
.rf{min-height:72vh;display:flex;flex-direction:column;padding:0 4px 30px}
.rf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 0;min-height:34px}
.rf-icon{background:none;border:none;padding:6px 8px;font-size:17px;color:#c0b8b0;cursor:pointer;font-family:inherit;line-height:1}
.rf-skip{background:none;border:none;padding:6px 4px;font-size:12px;color:#c0b8b0;cursor:pointer;font-family:inherit}
.rf-bar{flex:1;height:3px;background:#ece5da;border-radius:2px;overflow:hidden}
.rf-bar-f{height:100%;background:linear-gradient(90deg,#c9bce0,#a690cf);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.rf-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px;animation:rf-in .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rf-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rf-q{font-size:25px;font-weight:800;line-height:1.35;color:#4a4340;letter-spacing:-.3px}
.rf-sub{font-size:13px;color:#a89e97;line-height:1.65;margin-top:10px}
.rf-field{margin-top:30px}
/* Tall enough that the answer to 'what was the best moment of your day' does
   not scroll inside a four line box while you are writing it - which is the
   one moment in the app where somebody is actually composing something. It
   also grows as it fills, so the whole answer stays on screen. */
.rf-in{width:100%;border:none;border-bottom:1.5px solid #e4ddd4;background:none;padding:14px 2px;font-size:17px;line-height:1.65;color:#4a4340;direction:rtl;outline:none;resize:none;font-family:inherit;min-height:200px;overflow:hidden}
.rf-in:focus{border-bottom-color:#a690cf}
.rf-in::placeholder{color:#c9c0b8}
.rf-next{width:100%;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;font-family:inherit;margin-top:24px}
.rf-ghost{width:100%;background:none;border:none;padding:13px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;margin-top:6px}
/* mood faces */
.rf-moods{display:flex;justify-content:space-between;gap:6px}
.rf-mood{flex:1;background:none;border:none;padding:6px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.45;transition:opacity .2s,transform .2s}
.rf-mood.on,.rf-mood:active{opacity:1;transform:scale(1.06)}
.rf-mood svg{width:46px;height:46px;fill:none;stroke-width:1.7;stroke-linecap:round}
.rf-mood-l{font-size:10.5px;font-weight:700;color:#a89e97}
.rf-mood.on .rf-mood-l{color:#4a4340}
/* chips */
.rf-chips{display:flex;flex-wrap:wrap;gap:9px}
.rf-chip{background:#fff;border:1.5px solid #ece5da;border-radius:22px;padding:11px 17px;font-size:14px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;transition:all .18s}
.rf-chip.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#7d63b8}
/* 1-10 scale */
.rf-scale{display:flex;gap:5px}
.rf-num{flex:1;aspect-ratio:1;background:#fff;border:1.5px solid #ece5da;border-radius:12px;font-size:13px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;padding:0;transition:all .18s}
.rf-num.on{background:linear-gradient(135deg,#c9bce0,#a690cf);border-color:#a690cf;color:#fff;transform:translateY(-3px)}
.rf-echo{font-size:14px;font-weight:700;color:#a690cf;text-align:center;margin-top:20px;min-height:20px;animation:rf-in .35s ease-out}
/* ladder */
.rf-ladder{display:flex;flex-direction:column;gap:8px}
.rf-rung{width:100%;background:#fff;border:1.5px solid #ece5da;border-radius:14px;padding:15px 18px;font-size:15px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit;text-align:right;transition:all .18s}
.rf-rung.on{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-color:#a690cf;color:#4a4340}
/* photo */
.rf-photo-drop{border:1.5px dashed #d8cfc7;border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;background:#fdfbf8}
.rf-photo-drop svg{width:30px;height:30px;fill:none;stroke:#c0b8b0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rf-photo-wrap{position:relative}
.rf-photo-wrap img{width:100%;border-radius:20px;display:block}
.rf-photo-x{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(74,67,64,.62);border:none;color:#fff;font-size:15px;cursor:pointer;line-height:1}
/* module home */
.rf-hero{background:linear-gradient(150deg,#f5eefa,#eaf1f8);border-radius:26px;padding:24px 20px;margin-bottom:16px}
.rf-hero-t{font-size:19px;font-weight:800;color:#4a4340;line-height:1.35}
.rf-hero-s{font-size:12.5px;color:#a89e97;line-height:1.6;margin-top:7px}
.rf-day{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:none;border-radius:18px;padding:12px 14px;margin-bottom:9px;box-shadow:0 4px 14px rgba(200,180,160,.1);cursor:pointer;text-align:right;font-family:inherit}
.rf-day-th{width:46px;height:46px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#f2ede6}
/* the deep pass, laid out like the areas on the home screen */
.rf-board{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rf-card{position:relative;border:2px solid transparent;border-radius:22px;padding:16px 13px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;font-family:inherit;transition:transform .15s,border-color .25s;overflow:hidden}
.rf-card:active{transform:scale(.97)}
.rf-card.done{border-color:#8fc79e}
.rf-card-ic{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(160,140,120,.16)}
.rf-card-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rf-card-t{font-size:13px;font-weight:800;color:#4a4340;line-height:1.3}
.rf-card-s{font-size:9.5px;color:#a89e97;line-height:1.4}
.rf-card-v{position:absolute;top:9px;left:9px;width:19px;height:19px;border-radius:50%;background:#8fc79e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
/* the day's anchors, stacked with an arrow between them */
.rf-flow{display:flex;flex-direction:column}
.rf-flow-row{display:flex;align-items:center;gap:6px}
.rf-flow-box{flex:1;min-width:0;background:#fff;border:1.5px solid #e4ddd4;border-radius:14px;padding:7px 8px 7px 10px}
.rf-flow-box:focus-within{border-color:#a690cf}
.rf-flow-line{display:flex;align-items:center;gap:4px}
.rf-flow-in{flex:1;min-width:0;border:none;background:none;outline:none;padding:6px 4px;font-size:14px;color:#4a4340;font-family:inherit;direction:rtl}
.rf-flow-in::placeholder{color:#c9c0b8}
.rf-flow-cam{background:none;border:none;padding:5px;cursor:pointer;color:#c0b8b0;flex-shrink:0;line-height:0;font-family:inherit}
.rf-flow-cam svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rf-flow-imgwrap{position:relative;margin-bottom:6px}
.rf-flow-img{width:100%;height:92px;object-fit:cover;border-radius:9px;display:block}
.rf-flow-imgx{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:rgba(74,67,64,.6);border:none;color:#fff;font-size:12px;cursor:pointer;line-height:1;font-family:inherit}
.rf-flow-x{background:none;border:none;color:#e0c4bb;font-size:16px;cursor:pointer;padding:4px 2px;flex-shrink:0;font-family:inherit}
.rf-flow-ar{text-align:center;color:#c9bce0;font-size:15px;padding:5px 0;line-height:1}
.rf-flow-add{width:100%;background:rgba(166,144,207,.08);border:1.5px dashed #c9bce0;border-radius:14px;padding:11px;font-size:12.5px;font-weight:700;color:#a690cf;cursor:pointer;font-family:inherit;margin-top:12px}
/* the week: seven day columns, a third of the screen tall, cut into three
   bands. The cells are the drop targets and keep the text visible. */
.wk-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:5px;margin-right:36px}
.wk-wrap{display:flex;gap:2px;align-items:stretch}
.wk-slots{width:34px;flex-shrink:0;display:flex;flex-direction:column}
.wk-slot-l{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:700;color:#b8afa7;letter-spacing:.03em;line-height:1.15;gap:2px}
.wk-slot-hrs{font-size:7.5px;font-weight:700;color:#cfc6be;direction:ltr;letter-spacing:0}
/* what the day screen placed, shown here too but marked as belonging there */
.wk-t{display:block;font-size:7px;font-weight:800;opacity:.72;direction:ltr;text-align:right}
/* the hour lane: blocks placed by the clock inside the band, with anything
   hourless floating above them */
.wk-timed{position:absolute;top:0;bottom:0;left:2px;right:2px;z-index:1;pointer-events:none}
.wk-blk{position:absolute;left:0;right:0;min-height:16px;border-radius:5px;padding:1px 3px;font-size:8px;line-height:1.2;font-weight:700;overflow:hidden;word-break:break-word;border:1px dashed rgba(0,0,0,.14);opacity:.86}
.wk-blk.ct{border-top-left-radius:0;border-top-right-radius:0;border-top:none}
.wk-blk.cb{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none}
.wk-free{position:absolute;top:3px;left:2px;right:2px;z-index:3;display:flex;flex-direction:column;gap:2px}
/* the panel for the day you tapped, with a notch pointing at its column */
.wk-open{position:relative;margin-top:20px;background:rgba(255,255,255,.72);border-radius:16px;padding:14px 12px;box-shadow:0 4px 16px rgba(200,180,160,.14)}
.wk-point{position:absolute;top:-9px;width:18px;height:18px;background:rgba(255,255,255,.72);transform:rotate(45deg);border-radius:3px}
.wk-chip.fromday{border:1px dashed rgba(0,0,0,.14);opacity:.82}
.wk-hcell{text-align:center;min-width:0;padding:2px 0;border-radius:8px}
.wk-hcell.today{background:linear-gradient(135deg,#f0eafa,#e8dff5)}
.wk-dn{font-size:9.5px;font-weight:800;color:#4a4340;line-height:1.15;white-space:nowrap;letter-spacing:-.2px}
.wk-dd{font-size:8.5px;color:#a89e97;line-height:1.2;white-space:nowrap}
.wk-table{flex:1;min-width:0;position:relative;height:34vh;min-height:250px;background:#fff;border:1.5px solid #ece5da;border-radius:14px;overflow:hidden}
.wk-bands{position:absolute;inset:0;pointer-events:none;z-index:0}
.wk-band-l{position:absolute;right:0;left:0;height:1px;background:#ece5da}
.wk-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));z-index:1}
.wk-col{display:flex;flex-direction:column;min-width:0;border-left:1px solid #f4efe9}
.wk-col:last-child{border-left:none}
.wk-col.today{background:rgba(166,144,207,.06)}
.wk-cell{flex:1;min-height:0;position:relative;overflow:visible;cursor:pointer;transition:background .15s}
.wk-cell.hot{background:rgba(143,199,158,.22)}
.wk-chip{background:linear-gradient(135deg,#f0eafa,#e8dff5);border-radius:5px;padding:2px 3px;font-size:8px;line-height:1.25;color:#5f5148;font-weight:700;overflow:hidden;word-break:break-word}
.wk-task{display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:7px;box-shadow:0 3px 10px rgba(200,180,160,.12);touch-action:none;cursor:grab}
.wk-grip{color:#d8cfc7;font-size:11px;line-height:1;flex-shrink:0;letter-spacing:-3px}
.wk-ghost{position:fixed;z-index:200;margin:0;pointer-events:none;opacity:.94;transform:rotate(-2deg);box-shadow:0 12px 28px rgba(120,100,85,.32);transition:background .15s}
.wk-pool{min-height:56px;border-radius:14px;transition:background .15s}
.wk-pool.hot{background:rgba(166,144,207,.09)}
.wk-dot{width:15px;height:15px;border-radius:50%;border:none;padding:0;cursor:pointer;flex-shrink:0;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.06)}
/* capped so twelve swatches fall as two rows of six rather than eleven and a
   lonely one; the 22px target is worth keeping */
.wk-sw{display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:0;max-width:181px;justify-content:flex-start}
.wk-swatch{width:22px;height:22px;border-radius:50%;border:none;padding:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.wk-swatch.on{transform:scale(1.16);box-shadow:0 0 0 2px #fff,0 0 0 3.5px #4a4340}
.wk-picker{background:#fff;border-radius:12px;padding:10px 12px;margin:-3px 0 9px;box-shadow:0 3px 10px rgba(200,180,160,.14);display:flex;justify-content:center}
/* one day, hour by hour */
.dp-grid{background:#fff;border:1.5px solid #ece5da;border-radius:14px;overflow:hidden}
.dp-row{display:flex;align-items:stretch;border-top:1px solid #f4efe9;min-height:44px}
.dp-row:first-child{border-top:none}
.dp-h{width:46px;flex-shrink:0;font-size:9.5px;color:#a89e97;font-weight:700;padding:6px 4px 0;text-align:center;border-left:1px solid #f4efe9}
.dp-slot{flex:1;min-width:0;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;transition:background .15s}
/* the hour is now two lanes: what happens, and what to remember about it */
.dp-main{flex:1 1 62%;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.dp-nlane{flex:0 0 34%;max-width:34%;min-width:0;padding-right:6px;border-right:1px solid #f4efe9}
.dp-nline{font-size:9px;color:#a89e97;line-height:1.45;padding-bottom:3px;margin-bottom:3px;border-bottom:1px solid #f0ebe3;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
/* the undo, only while a plan is on screen */
/* ── THE BEAT BEFORE THE PLANNER ──
   The app's own opening colour, so entering a module feels like part of the
   same thing rather than a different app. It leaves by closing to a point:
   the orange contracts through the middle of the screen and the planner is
   simply there behind it, which reads as an opening rather than a curtain
   being pulled off something. */
.plan-splash{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(120% 62% at 50% 4%,rgba(255,226,181,.42),transparent 60%),linear-gradient(160deg,#E2924C 0%,#D97D3D 32%,#C96A2E 65%,#B85A28 100%);clip-path:circle(150% at 50% 50%);animation:ps-fade .3s ease-out}
@keyframes ps-fade{from{opacity:0}to{opacity:1}}
/* closing to a point, while what is on it pushes toward you and goes */
.plan-splash.out{animation:ps-iris .72s cubic-bezier(.65,0,.35,1) forwards;pointer-events:none}
@keyframes ps-iris{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.plan-splash.out .ps-in{animation:ps-leave .5s cubic-bezier(.4,0,1,1) forwards}
@keyframes ps-leave{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
/* a slow breath of light behind the words */
.ps-glow{position:absolute;width:min(78vw,420px);height:min(78vw,420px);border-radius:50%;background:radial-gradient(circle,rgba(255,232,196,.5),transparent 66%);animation:ps-breathe 3.4s ease-in-out infinite}
@keyframes ps-breathe{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.ps-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.ps-ic{width:60px;height:60px;fill:none;stroke:rgba(255,244,230,.95);stroke-width:1.3;stroke-linecap:round;animation:ps-icon .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes ps-icon{from{opacity:0;transform:scale(.6) rotate(-28deg)}to{opacity:1;transform:none}}
.ps-line{font-size:clamp(30px,9.2vw,44px);font-weight:800;color:#fff9f2;letter-spacing:-.012em;text-align:center;line-height:1.18;direction:ltr;text-shadow:0 2px 18px rgba(120,52,14,.34);max-width:9ch}
/* one word at a time, so the sentence lands rather than appears */
.ps-w{display:inline-block;opacity:0;animation:ps-word .62s cubic-bezier(.2,.9,.3,1) both}
@keyframes ps-word{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.plan-splash,.ps-in,.ps-ic,.ps-w,.ps-glow{animation:none}.ps-w{opacity:1}.plan-splash.out{animation:ps-fade .3s reverse forwards}}
/* the backup, handed over without asking the browser to navigate anywhere */
.bk-ov{position:fixed;inset:0;z-index:420;background:rgba(74,67,64,.62);display:flex;align-items:flex-end;justify-content:center;padding:0}
.bk-sheet{width:100%;max-width:480px;background:#fbf7f2;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.bk-hd{display:flex;align-items:baseline;justify-content:space-between;font-size:17px;font-weight:800;color:#4a4340}
.bk-kb{font-size:11px;font-weight:700;color:#a89e97}
.bk-sub{font-size:11.5px;color:#a89e97;line-height:1.65;margin:7px 0 14px}
.bk-share{width:100%;border:none;border-radius:14px;padding:14px;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer}
.bk-copy{width:100%;margin-top:8px;border:1.5px solid #ece5da;border-radius:14px;padding:13px;background:#fff;color:#7a716b;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.bk-or{font-size:10px;color:#c0b6ae;margin:14px 0 6px;font-weight:700}
.bk-txt{width:100%;height:110px;border:1.5px solid #ece5da;border-radius:12px;padding:9px;font-size:10px;font-family:ui-monospace,Menlo,monospace;color:#a89e97;background:#fff;resize:none;direction:ltr;outline:none}
.bk-lock{margin-top:14px;padding-top:12px;border-top:1px solid #ece5da}
.bk-lockttl{font-size:12.5px;font-weight:800;color:#4a4340}
.bk-locksub{font-size:10.5px;color:#a89e97;line-height:1.65;margin:5px 0 9px}
.bk-lockrow{display:flex;gap:7px}
.bk-pass{flex:1;min-width:0;border:1.5px solid #ece5da;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;outline:none;background:#fff;direction:ltr;text-align:right}
.bk-pass:focus{border-color:#c9bce0}
.bk-lockbtn{border:none;border-radius:12px;padding:11px 18px;background:#4a4340;color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;flex-shrink:0}
.bk-lockmsg{font-size:11.5px;color:#6fb283;font-weight:700;line-height:1.6}
.bk-unlock{width:100%;margin-top:8px;border:none;background:none;padding:8px;color:#a89e97;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.bk-err{font-size:11.5px;color:#c2664a;font-weight:700;min-height:18px;margin:7px 0}
.bk-full{width:100%;margin-top:7px;border:1.5px dashed #ddd3ca;border-radius:13px;padding:11px;background:none;color:#a89e97;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.bk-close{width:100%;margin-top:10px;border:none;background:none;padding:11px;color:#a89e97;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.plan-undo{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:130;border:none;border-radius:14px;padding:10px 15px;background:rgba(74,67,64,.92);color:#fff;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(74,67,64,.3)}
.plan-undo:active{transform:scale(.96)}
.dp-slot.hot{background:rgba(143,199,158,.22)}
.dp-chip{border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;line-height:1.3;max-width:100%;word-break:break-word;touch-action:none;cursor:grab}
.tl-row{display:flex;align-items:center;gap:8px;background:#fbf7f2;border-radius:12px;padding:9px 11px;margin-bottom:6px;touch-action:none;cursor:grab}
/* the month as a calendar */
.mo-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:4px}
.mo-hd{text-align:center;font-size:9px;font-weight:800;color:#a89e97}
.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mo-cell{min-height:54px;background:#fff;border:1.5px solid #ece5da;border-radius:9px;padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;transition:background .15s,border-color .15s}
.mo-cell.mo-blank{background:none;border-color:transparent;cursor:default}
.mo-cell.today{border-color:#a690cf}
.mo-cell.hot{border-color:#8fc79e;background:#eaf5ee}
.mo-n{font-size:9px;font-weight:700;color:#b8afa7;line-height:1}
.mo-chip{border-radius:4px;padding:2px 3px;font-size:7.5px;line-height:1.2;font-weight:700;overflow:hidden;word-break:break-word}
.dp-q{font-size:13.5px;font-weight:800;color:#4a4340;line-height:1.4;margin-bottom:9px}
.dp-ta{width:100%;background:#fff;border:none;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#4a4340;line-height:1.6;font-family:inherit;direction:rtl;outline:none;resize:none;min-height:74px}
.dp-ta::placeholder{color:#c9c0b8}
.dp-note-m{font-size:7px;vertical-align:middle;margin-right:5px;opacity:.55}
/* the rail: add and drag without leaving the hours */
.dp-rail{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center;max-height:70vh}
.dp-rail-add{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(166,144,207,.42);font-family:inherit;line-height:1;flex-shrink:0}
.dp-rail-chip{width:56px;padding:6px 5px;border-radius:9px;font-size:8.5px;font-weight:700;line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;touch-action:none;cursor:grab;box-shadow:0 3px 10px rgba(120,100,85,.2)}
.dp-rail-bar{position:fixed;left:54px;top:50%;transform:translateY(-50%);z-index:121;width:210px;max-width:calc(100vw - 74px);max-height:64vh;overflow-y:auto;padding:12px;border-radius:16px;background:rgba(253,251,248,.98);box-shadow:0 10px 30px rgba(120,100,85,.26)}
.dp-rail-lib{display:flex;flex-wrap:wrap;gap:6px}
.dp-rail-libchip{border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;line-height:1.25;touch-action:none;cursor:grab;max-width:100%;word-break:break-word}
/* ── WHERE TO LET GO ──
   A flick to the left removes, but until now the gesture had nothing to aim
   at: you swiped and hoped. This strip slides in from the left edge for the
   whole drag so the swipe has a destination, and goes solid with the word on
   it once the finger has gone far enough - let go here and it is gone.

   Amber rather than red when the swipe only takes a week or month task off
   this day: the original stays where it is, and a red bin would say otherwise.
   It stays under the drag ghost and never takes a pointer event, so the drop
   targets underneath it still work exactly as before. */
/* A full-height bar down the edge of a planning screen is a lot of red for
   something you mostly are not doing. A dot is a target: big enough to hit
   with a thumb, small enough to ignore. */
.swipe-trash{position:fixed;left:14px;top:50%;width:72px;height:72px;border-radius:50%;z-index:190;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:translate(-140%,-50%) scale(.8);transition:transform .2s cubic-bezier(.2,.9,.3,1),background .15s,opacity .15s,box-shadow .15s;background:rgba(176,96,78,.72);box-shadow:0 6px 18px rgba(140,70,52,.28)}
.swipe-trash.on{transform:translate(0,-50%) scale(1)}
.swipe-trash.hot{background:#b0503a;box-shadow:0 8px 26px rgba(140,70,52,.45)}
.swipe-trash.on.hot{transform:translate(0,-50%) scale(1.12)}
/* the minute steps open across the same strip of screen; a bin floating
   over the times you are trying to press is worse than no bin at all */
.swipe-trash.hidden{opacity:0}
.swipe-trash.keep{background:rgba(170,124,48,.72)}
.swipe-trash.keep.hot{background:#aa7c30}
.swipe-trash svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9;transition:transform .18s,opacity .18s}
.swipe-trash.hot svg{transform:scale(1.2);opacity:1}
.swipe-trash b{font-size:9px;font-weight:800;color:#fff;opacity:0;transition:opacity .15s;text-align:center;line-height:1.2;padding:0 3px}
.swipe-trash.hot b{opacity:1}
@media (prefers-reduced-motion:reduce){.swipe-trash,.swipe-trash svg{transition:none}}
/* a flick to the left says remove, and the ghost says which kind */
.wk-ghost.swipe-del{background:linear-gradient(135deg,#fbe4dd,#f4cabc)!important;color:#8c4a36!important;border-right-color:#e08a72!important}
.wk-ghost.swipe-del::after{content:attr(data-swipe);position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;color:#a9563c}
/* finding a person: search, sort, and grouping by where you know them */
.ppl-find{margin-bottom:14px}
.ppl-in{width:100%;border:1.5px solid #ece5da;border-radius:13px;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;background:#fff;direction:rtl;margin-bottom:8px}
.ppl-in:focus{border-color:#f3b9a8}
.ppl-sorts{display:flex;flex-wrap:wrap;gap:6px}
.ppl-sort{border:1.5px solid #f2ede6;border-radius:11px;padding:7px 11px;background:#fff;font-size:11px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit}
.ppl-sort.on{border-color:#e08a72;background:linear-gradient(135deg,#fdf0eb,#fae2d8);color:#c2664a}
.ppl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ppl-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;border:none;border-radius:20px;background:linear-gradient(145deg,#fdf0eb,#fae2d8);box-shadow:0 4px 16px rgba(224,138,114,.16);cursor:pointer;font-family:inherit;padding:14px 10px}
.ppl-tile:active{transform:scale(.97)}
.ppl-tname{font-size:13.5px;font-weight:800;color:#4a4340;text-align:center;line-height:1.3}
.ppl-tn{font-size:10px;font-weight:700;color:#c2664a}
/* faces overlapping slightly, the way a group of people stands */
.ppl-tfaces{display:flex;direction:ltr}
.ppl-tf{margin-left:-8px;display:block}
.ppl-tf:first-child{margin-left:0}
.ppl-tf img,.ppl-tf>div{border:2px solid #fdf0eb}
.ppl-back{background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;font-family:inherit;padding:0 0 6px;display:block}
.ppl-grp{font-size:10px;letter-spacing:.1em;font-weight:800;color:#c2664a;margin:14px 2px 7px}
.ppl-grp:first-child{margin-top:0}
.ep-av{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ep-av-img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 3px 12px rgba(200,180,160,.22)}
.ep-av-none{width:76px;height:76px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#f3b9a8,#e08a72);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}
.ep-av-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ep-av-b{border:1.5px solid #ece5da;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:800;color:#6a6360;background:#fff;cursor:pointer;font-family:inherit}
.ep-av-x{border:none;background:none;padding:2px 4px;font-size:11px;font-weight:700;color:#c08a7a;cursor:pointer;font-family:inherit}
.ppl-place{color:#c2a08f}
.ppl-none{font-size:12px;color:#c0b6ae;text-align:center;padding:26px 12px;line-height:1.7}
/* the journal - a page, then everything you have already written */
.jrnl-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.jrnl-nav{background:#fff;border:none;border-radius:11px;width:32px;height:32px;font-size:15px;color:#a89e97;cursor:pointer;box-shadow:0 2px 8px rgba(200,180,160,.16);font-family:inherit;flex-shrink:0}
.jrnl-nav:disabled{opacity:.3;cursor:default}
.jrnl-day{font-size:16px;font-weight:800;color:#4a4340}
.jrnl-date{font-size:11px;color:#a89e97;margin-top:2px}
.jrnl-paper{position:relative;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.jrnl-text{width:100%;border:none;outline:none;resize:none;background:transparent;font-family:inherit;font-size:14px;line-height:2;color:#4a4340;min-height:230px;direction:rtl}
.jrnl-saved{position:absolute;left:14px;bottom:10px;font-size:9.5px;font-weight:700;color:#8fc79e;opacity:0;transition:opacity .3s;pointer-events:none}
.jrnl-today{width:100%;margin-top:9px;border:1.5px solid #ece5da;border-radius:13px;padding:10px;background:none;color:#a89e97;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.jrnl-srch{margin:20px 0 10px}
.jrnl-in{width:100%;border:1.5px solid #ece5da;border-radius:13px;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;background:#fff;direction:rtl}
.jrnl-in:focus{border-color:#c9bce0}
.jrnl-lbl{font-size:10px;letter-spacing:.1em;font-weight:700;color:#a89e97;margin-bottom:9px}
.jrnl-row{display:block;width:100%;text-align:right;background:#fff;border:none;border-radius:14px;padding:11px 13px;margin-bottom:6px;cursor:pointer;font-family:inherit;box-shadow:0 2px 9px rgba(200,180,160,.1)}
.jrnl-when{font-size:10.5px;font-weight:800;color:#a690cf;margin-bottom:4px}
.jrnl-prev{font-size:11.5px;color:#7a716b;line-height:1.7;word-break:break-word}
.jrnl-hit{background:#f6e6b8;color:#6a5a2a;border-radius:3px;padding:0 2px;font-weight:800}
.jrnl-empty{font-size:11.5px;color:#c0b6ae;text-align:center;padding:22px 12px;line-height:1.7}
/* the reminder picker inside a task */
.dp-rem-row{display:flex;flex-wrap:wrap;gap:6px}
.dp-rem-b{border:1.5px solid #ece5da;border-radius:11px;padding:8px 11px;background:#fff;font-size:11.5px;font-weight:700;color:#a89e97;cursor:pointer;font-family:inherit}
.dp-rem-b.on{border-color:#a690cf;background:linear-gradient(135deg,#f7f2fb,#efe7f7);color:#6b5a92}
.dp-rem-at{margin-top:9px;font-size:11px;font-weight:700;color:#6fb283}
.dp-rem-ask{width:100%;margin-top:9px;border:1.5px dashed #ddd3ca;border-radius:12px;padding:9px;background:none;color:#a89e97;font-size:10.5px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.5}
.dp-min{font-size:9.5px;font-weight:800;opacity:.6;margin-left:5px;direction:ltr;display:inline-block}
/* the five-minute steps an hour opens into while a task is held over it */
.dp-slot.fine{background:rgba(166,144,207,.07)}
.dp-fine{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-top:3px;animation:dp-fine-in .16s ease-out}
@keyframes dp-fine-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dp-fine-b{background:#fff;border:1.5px solid #e4ddd4;border-radius:7px;padding:7px 2px;font-size:10px;font-weight:700;color:#a89e97;text-align:center;direction:ltr;transition:all .12s}
.dp-fine-b.on{background:linear-gradient(135deg,#bfe0c7,#8fc79e);border-color:#8fc79e;color:#fff;transform:scale(1.06)}
/* pulling down the hour column to say how long something runs */
.dp-row.reach .dp-h{background:linear-gradient(135deg,#f0eafa,#e8dff5);color:#7d63b8}
.dp-ghost-end{opacity:.35!important}
/* A task that runs past its hour is one band down the grid, named once where
   it starts. It takes a third of the width so whatever else happens at the
   same time still has somewhere to sit. */
.dp-chip.head{flex:0 0 52%;max-width:52%;border-bottom-right-radius:0;border-bottom-left-radius:0;margin-bottom:-5px;min-height:39px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:0 5px;box-sizing:border-box;padding:4px 8px}
/* min-height in per cent does not resolve inside a wrapping flex row, so the
   band is sized to the row instead: 44px less the slot's 5px padding. */

@keyframes plane-fly{0%{transform:translateX(0) rotate(0deg)}30%{transform:translateX(-6px) rotate(-8deg)}60%{transform:translateX(4px) rotate(5deg)}100%{transform:translateX(0) rotate(0deg)}}

.trip-toggle-track{width:56px;height:30px;border-radius:15px;background:#e0dbd5;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0;border:none;padding:0}
.trip-toggle-track.on{background:linear-gradient(135deg,#4f6ef7,#3d4fd6)}
.trip-toggle-thumb{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .3s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.trip-toggle-track.on .trip-toggle-thumb{right:calc(100% - 27px)}
/* The icon sits in a white disc rather than being a bare glyph - it gives every
   card the same optical weight whatever the icon, which emoji never did. */
/* the vlog button, on the corner of the day's icon */
.vlog-dot{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;background:#3a7ca5;box-shadow:0 4px 12px rgba(29,74,102,.34);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2.5px solid #fff;transition:transform .15s}
.vlog-dot:active{transform:scale(.88)}
.vlog-dot svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* a filled ring says the day already has one */
.vlog-dot.has{background:#2b5f83;box-shadow:0 0 0 3px rgba(58,124,165,.28),0 3px 9px rgba(29,74,102,.4)}
/* the recorder */
.vl-ov{position:fixed;inset:0;z-index:460;background:rgba(28,26,32,.88);display:flex;align-items:flex-end;justify-content:center}
.vl-sheet{width:100%;max-width:480px;background:#15131a;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:96vh;overflow-y:auto}
.vl-hd{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;color:#f0ece6;margin-bottom:10px}
.vl-x{background:none;border:none;color:#8d8792;font-size:22px;line-height:1;cursor:pointer;font-family:inherit;padding:0 4px}
/* the shape comes from the chosen frame, set in vlogSetOrient. touch-action
   none so a pinch reaches the page instead of zooming the whole app. */
/* Driven by height, not width. With width:100% and a height cap, a portrait
   aspect-ratio cannot win - the box keeps the full width and simply loses
   the height it asked for, which is how a 9:16 frame came out landscape.
   Given a height and told to take its width from the ratio, it is portrait.
   touch-action:none so a pinch reaches the canvas instead of zooming the app. */
.vl-stage{position:relative;height:58vh;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;margin:0 auto}
/* contain, not cover. The recording is the whole frame; a preview cropped to
   fill a 3:4 box would have you framing yourself against something the file
   does not contain - and on a wide camera it looks zoomed in besides. */
/* the canvas is the picture being recorded; the video element only ever
   plays a finished clip back */
.vl-canvas{width:100%;height:100%;display:block;background:#000}
.vl-canvas.mirror{transform:scaleX(-1)}
.vl-video{width:100%;height:100%;object-fit:contain;background:#000}
/* the correction control, at the foot of the frame so it does not crowd the
   two at the top */
/* the zoom readout: quiet at 1x, lit past it, and a tap puts it back */
.vl-zoom{position:absolute;bottom:10px;left:10px;min-width:44px;height:32px;padding:0 10px;border-radius:16px;background:rgba(0,0,0,.42);border:none;display:none;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-family:inherit;font-size:11.5px;font-weight:800}
.vl-zoom.live{display:flex}

<script>
/* ── DEV / STABLE SPLIT ──
   Two copies of this same file are published: "/" is the stable app installed on
   the phone, "/dev/" is the live copy we iterate on. They share an origin, so by
   default they would also share localStorage - and an experiment in dev would
   scribble over a real week of data. This gives the dev copy its own namespace,
   seeded once from the real data so it opens looking lived-in.
   Inert in the stable app: everything below is behind the /dev/ path check. */
(function(){
  if(!/(^|\/)dev(\/|$)/.test(location.pathname))return;
  window.__DEV__=true;
  var raw;try{raw=window.localStorage;}catch(e){return;}
  var P='dev:',SEEDED=P+'__seeded';

  // Sandbox keys, minus the bookkeeping one - the app should never see it.
  function devKeys(){
    var a=[];
    for(var i=0;i<raw.length;i++){
      var k=raw.key(i);
      if(k&&k.indexOf(P)===0&&k!==SEEDED)a.push(k.slice(P.length));
    }
    return a;
  }
  function seed(){
    var pairs=[],i,k;
    for(i=0;i<raw.length;i++){k=raw.key(i);if(k&&k.indexOf(P)!==0)pairs.push([k,raw.getItem(k)]);}
    for(i=0;i<pairs.length;i++){try{raw.setItem(P+pairs[i][0],pairs[i][1]);}catch(e){}}
    try{raw.setItem(SEEDED,'1');}catch(e){}
  }
  try{if(raw.getItem(SEEDED)!=='1')seed();}catch(e){}

  var shim={
    getItem:function(k){return raw.getItem(P+k);},
    setItem:function(k,v){raw.setItem(P+k,v);},
    removeItem:function(k){raw.removeItem(P+k);},
    clear:function(){devKeys().forEach(function(k){raw.removeItem(P+k);});},
    key:function(i){var a=devKeys();return i<a.length?a[i]:null;},
    get length(){return devKeys().length;}
  };
  var isolated=true;
  try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return shim;}});}
  catch(e){isolated=false;}

  // Throw the sandbox away and re-copy the stable app's data. Run from the
  // console when dev has drifted too far from reality to be a useful test.
  window.__devReseed=function(){
    devKeys().forEach(function(k){raw.removeItem(P+k);});
    raw.removeItem(SEEDED);seed();location.reload();
  };

  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('div');
    b.textContent=isolated?'DEV':'DEV ⚠ shared data';
    b.style.cssText='position:fixed;top:4px;left:6px;z-index:9999;pointer-events:none;'+
      'background:'+(isolated?'#a690cf':'#c0392b')+';color:#fff;padding:4px 7px;border-radius:8px;'+
      'font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.5px;opacity:.9';
    document.body.appendChild(b);
  });
})();
</script>
