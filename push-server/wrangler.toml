name = "nutrition-push"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Every minute: the reminder should land at the chosen time, not up to an hour after it.
[triggers]
crons = ["* * * * *"]

# Create with:  npx wrangler kv namespace create SUBS
# then paste the returned id here.
[[kv_namespaces]]
binding = "SUBS"
id = "PASTE_KV_NAMESPACE_ID_HERE"
