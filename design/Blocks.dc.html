<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E0552F; } a:hover { color: #b83f1e; }
    .ic { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; min-height: 1000px; background: #FFFDF7; color: #14110F; font-family: Heebo, system-ui, sans-serif; padding: 26px 20px 30px; display: flex; flex-direction: column; gap: 14px;">

  <div style="background: #14110F; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #E0552F; padding: 20px 18px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
      <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 34px; color: #FFFDF7; line-height: 1; direction: ltr; text-align: right;">Better Me</div>
      <div style="font-size: 10px; color: #9c948d; margin-top: 7px; letter-spacing: .04em;">ראשון &middot; 30 באוגוסט</div>
    </div>
    <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 30px; color: #E8A020; line-height: 1;">6</div>
  </div>

  <div style="background: #FFFDF7; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 17px;">היום</div>
      <div style="font-size: 10px; font-weight: 700; background: #14110F; color: #FFFDF7; padding: 3px 9px; border-radius: 20px;">3 ארוחות</div>
    </div>

    <div style="display: flex; align-items: baseline; gap: 7px;">
      <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 52px; line-height: .9; color: #6F4FD8;">1420</div>
      <div style="font-size: 12px; font-weight: 700; color: #6b635c;">/ 1975 קק&quot;ל</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="font-size: 10.5px; font-weight: 700; width: 54px;">חלבון</div>
        <div style="flex: 1; height: 16px; border: 2.5px solid #14110F; border-radius: 3px; background: #FFFDF7; overflow: hidden;"><div style="height: 100%; width: 76%; background: #E0552F;"></div></div>
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 13px; width: 42px; text-align: left;">118</div>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="font-size: 10.5px; font-weight: 700; width: 54px;">פחמימה</div>
        <div style="flex: 1; height: 16px; border: 2.5px solid #14110F; border-radius: 3px; background: #FFFDF7; overflow: hidden;"><div style="height: 100%; width: 66%; background: #1F9A5A;"></div></div>
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 13px; width: 42px; text-align: left;">132</div>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="font-size: 10.5px; font-weight: 700; width: 54px;">שומן</div>
        <div style="flex: 1; height: 16px; border: 2.5px solid #14110F; border-radius: 3px; background: #FFFDF7; overflow: hidden;"><div style="height: 100%; width: 68%; background: #E8A020;"></div></div>
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 13px; width: 42px; text-align: left;">41</div>
      </div>
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="font-size: 10.5px; font-weight: 700; width: 54px;">מים</div>
        <div style="flex: 1; height: 16px; border: 2.5px solid #14110F; border-radius: 3px; background: #FFFDF7; overflow: hidden;"><div style="height: 100%; width: 58%; background: #1F6FD0;"></div></div>
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 13px; width: 42px; text-align: left;">1.7L</div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px;">

    <div style="background: #6F4FD8; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #FFFDF7; min-height: 132px;">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">תזונה</div>
        <div style="font-size: 10px; opacity: .82; line-height: 1.4; margin-top: 4px;">ארוחות, מאקרו ומים</div>
      </div>
    </div>

    <div style="background: #E0552F; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #FFFDF7; min-height: 132px;">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">כושר</div>
        <div style="font-size: 10px; opacity: .82; line-height: 1.4; margin-top: 4px;">אימונים והתקדמות</div>
      </div>
    </div>

    <div style="background: #1F9A5A; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #FFFDF7; min-height: 132px;">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">תחביבים</div>
        <div style="font-size: 10px; opacity: .82; line-height: 1.4; margin-top: 4px;">דברים שאתה אוהב</div>
      </div>
    </div>

    <div style="background: #1F6FD0; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #FFFDF7; min-height: 132px; position: relative;">
      <div style="position: absolute; top: -2.5px; left: 12px; background: #E8A020; border: 2.5px solid #14110F; border-radius: 0 0 5px 5px; padding: 3px 7px; font-size: 8.5px; font-weight: 900; color: #14110F;">ממתין</div>
      <svg class="ic" viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">סיום יום</div>
        <div style="font-size: 10px; opacity: .82; line-height: 1.4; margin-top: 4px;">ראיון יומי ושיקוף</div>
      </div>
    </div>

    <div style="background: #E8A020; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #14110F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #14110F; min-height: 132px;">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">מטרות</div>
        <div style="font-size: 10px; opacity: .72; line-height: 1.4; margin-top: 4px;">חלומות והדרך אליהם</div>
      </div>
    </div>

    <div style="background: #14110F; border: 2.5px solid #14110F; border-radius: 6px; box-shadow: 5px 5px 0 #E0552F; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 10px; color: #FFFDF7; min-height: 132px;">
      <svg class="ic" viewBox="0 0 24 24" style="color: #E8A020;"><path d="M4 20 18.5 5.5"/><path d="M13.5 5.5h5v5"/><path d="m6.5 13.5 4 4"/></svg>
      <div style="margin-top: auto;">
        <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 20px; line-height: 1.1;">משחק</div>
        <div style="font-size: 10px; opacity: .72; line-height: 1.4; margin-top: 4px;">החץ &mdash; מי עונה</div>
      </div>
    </div>

  </div>

  <div style="margin-top: auto; padding-top: 6px; display: flex; align-items: center; gap: 10px; border: 2.5px solid #14110F; border-radius: 6px; padding: 13px 15px; background: #FFFDF7;">
    <div style="width: 9px; height: 9px; border-radius: 50%; background: #E0552F; flex-shrink: 0;"></div>
    <div style="flex: 1; font-size: 11.5px; font-weight: 700;">הראיון של הערב ממתין לך</div>
    <div style="font-family: 'Secular One', system-ui, sans-serif; font-size: 13px;">&#8592;</div>
  </div>

</div>
</x-dc>
</body>
</html>
