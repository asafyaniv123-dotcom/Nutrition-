<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a690cf; } a:hover { color: #8a72bb; }
    .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; width: 22px; height: 22px; }
    .tile { position: relative; overflow: hidden; background: #fff; border-radius: 26px; height: 124px; box-shadow: 0 6px 20px rgba(200,180,160,.16); }
    .tile-wash { position: absolute; right: 0; left: 0; bottom: 0; }
    .tile-body { position: relative; height: 100%; padding: 14px 14px 12px; display: flex; flex-direction: column; }
    .tile-pct { font-size: 10px; font-weight: 800; }
    .tile-name { font-size: 15px; font-weight: 800; }
    .tile-sub { font-size: 9.5px; color: #8d847d; margin-top: 2px; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: linear-gradient(160deg, #f0ebe3 0%, #e8dff5 100%); font-family: Assistant, -apple-system, 'Segoe UI', sans-serif; color: #4a4340; display: flex; flex-direction: column; padding: 34px 18px 0; position: relative; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div>
      <div style="font-size: 20px; font-weight: 800; line-height: 1.2;">איך היום מתמלא</div>
      <div style="font-size: 11px; color: #a89e97; margin-top: 4px;">ראשון &middot; 30 באוגוסט</div>
    </div>
    <div style="text-align: left;">
      <div style="font-size: 22px; font-weight: 800; color: #a690cf; line-height: 1;">64%</div>
      <div style="font-size: 9.5px; color: #a89e97; margin-top: 3px;">מהיום</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px;">

    <div class="tile">
      <div class="tile-wash" style="height: 72%; background: linear-gradient(180deg, rgba(166,144,207,.16), rgba(166,144,207,.34));"></div>
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #a690cf;"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg></div>
          <div class="tile-pct" style="color: #8a72bb;">72%</div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name">תזונה</div>
          <div class="tile-sub">1420 / 1975 קק&quot;ל</div>
        </div>
      </div>
    </div>

    <div class="tile" style="box-shadow: none; background: rgba(255,255,255,.5); border: 1.5px dashed #ddd0c6;">
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #c9b8ae;"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg></div>
          <div class="tile-pct" style="color: #c0b8b0;">0%</div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name" style="color: #8d847d;">כושר</div>
          <div class="tile-sub">עוד ריק היום</div>
        </div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-wash" style="height: 40%; background: linear-gradient(180deg, rgba(143,199,158,.16), rgba(143,199,158,.36));"></div>
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #6fb283;"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg></div>
          <div class="tile-pct" style="color: #5f9c72;">40%</div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name">תחביבים</div>
          <div class="tile-sub">2 מתוך 5 השבוע</div>
        </div>
      </div>
    </div>

    <div class="tile" style="box-shadow: 0 8px 26px rgba(58,124,165,.2);">
      <div class="tile-wash" style="height: 100%; background: linear-gradient(180deg, rgba(116,185,232,.1), rgba(58,124,165,.22));"></div>
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #3a7ca5;"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></div>
          <div style="background: #fff; border-radius: 12px; padding: 3px 8px; font-size: 9px; font-weight: 800; color: #3a7ca5;">ממתין</div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name" style="color: #2f6a8e;">סיום יום</div>
          <div class="tile-sub" style="color: #5b8fa8;">הראיון של הערב</div>
        </div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-wash" style="height: 55%; background: linear-gradient(180deg, rgba(232,193,98,.16), rgba(232,193,98,.4));"></div>
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #c9a24f;"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/></svg></div>
          <div class="tile-pct" style="color: #b08b3c;">55%</div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name">מטרות</div>
          <div class="tile-sub">2 מתוך 5 בדרך</div>
        </div>
      </div>
    </div>

    <div class="tile" style="background: linear-gradient(150deg,#fdf2e2,#f6e1c3); box-shadow: 0 6px 20px rgba(201,139,63,.2);">
      <div class="tile-body">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="color: #c98b3f;"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20 18.5 5.5"/><path d="M13.5 5.5h5v5"/><path d="m6.5 13.5 4 4"/></svg></div>
        </div>
        <div style="margin-top: auto;">
          <div class="tile-name">משחק</div>
          <div class="tile-sub" style="color: #a37a44;">החץ &mdash; מתי שבא לך</div>
        </div>
      </div>
    </div>

  </div>

  <div style="background: #fff; border-radius: 22px; padding: 14px 16px; margin-top: 14px; box-shadow: 0 4px 16px rgba(200,180,160,.12); display: flex; align-items: center; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 11px; font-weight: 700; color: #3a7ca5;">מים</div>
        <div style="font-size: 10.5px; color: #5b8fa8;">1,750 / 3,000 מ&quot;ל</div>
      </div>
      <div style="height: 7px; background: #f2ede6; border-radius: 4px; overflow: hidden;"><div style="height: 100%; width: 58%; background: linear-gradient(90deg,#74b9e8,#3a7ca5); border-radius: 4px;"></div></div>
    </div>
  </div>

  <div style="position: absolute; bottom: 0; right: 0; left: 0; padding: 22px 18px 24px; background: linear-gradient(to top, #e6dcf0 55%, rgba(230,220,240,0)); display: flex; gap: 9px;">
    <div style="flex: 1; background: linear-gradient(135deg,#c9bce0,#a690cf); border-radius: 20px; padding: 14px 8px; text-align: center; color: #fff; font-size: 12.5px; font-weight: 800; box-shadow: 0 8px 22px rgba(166,144,207,.34);">+ ארוחה</div>
    <div style="flex: 1; background: linear-gradient(135deg,#74b9e8,#3a7ca5); border-radius: 20px; padding: 14px 8px; text-align: center; color: #fff; font-size: 12.5px; font-weight: 800; box-shadow: 0 8px 22px rgba(58,124,165,.3);">+ מים</div>
    <div style="flex: 1; background: #fff; border-radius: 20px; padding: 14px 8px; text-align: center; color: #a690cf; font-size: 12.5px; font-weight: 800; box-shadow: 0 6px 18px rgba(200,180,160,.2);">סיום יום</div>
  </div>

</div>
</x-dc>
</body>
</html>
