<x-dc>

    a { color: #a690cf; } a:hover { color: #8a72bb; }

    .chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .chip-lbl { font-size: 9.5px; font-weight: 700; color: #7d746e; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: linear-gradient(160deg, #f0ebe3 0%, #e8dff5 100%); font-family: Assistant, -apple-system, 'Segoe UI', sans-serif; color: #4a4340; display: flex; flex-direction: column; align-items: center; padding: 34px 18px 0; overflow: hidden;">

  <div style="width: 100%; display: flex; justify-content: space-between; align-items: baseline;">

    </div>
  </div>

  <div style="display: flex; gap: 16px; margin-top: 10px;">

    </div>
    <div class="chip">
      <div class="chip-disc" style="background: linear-gradient(145deg,#e8f4fd,#d6ebf7); color: #3a7ca5; position: relative;">
        <span style="position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: #e08a72; border: 2px solid #f1e9ee;"></span>
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg>

    </div>
    <div class="chip">
      <div class="chip-disc" style="background: linear-gradient(145deg,#fdf2e2,#f6e1c3); color: #c98b3f;"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20 18.5 5.5"/><path d="M13.5 5.5h5v5"/><path d="m6.5 13.5 4 4"/></svg></div>

  <div style="width: 100%; margin-top: 26px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-size: 9.5px; letter-spacing: .1em; font-weight: 700; color: #a89e97;">השבוע</div>
    <div style="background: #fff; border-radius: 22px; padding: 16px 14px; box-shadow: 0 4px 16px rgba(200,180,160,.12); display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 22px; height: 42px; background: #f2ede6; border-radius: 11px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 88%; background: linear-gradient(180deg,#c9bce0,#a690cf); border-radius: 11px;"></div></div><div style="font-size: 9px; color: #a89e97;">א</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 22px; height: 42px; background: #f2ede6; border-radius: 11px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 64%; background: linear-gradient(180deg,#c9bce0,#a690cf); border-radius: 11px;"></div></div><div style="font-size: 9px; color: #a89e97;">ב</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 22px; height: 42px; background: #f2ede6; border-radius: 11px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 96%; background: linear-gradient(180deg,#c9bce0,#a690cf); border-radius: 11px;"></div></div><div style="font-size: 9px; color: #a89e97;">ג</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 22px; height: 42px; background: #f2ede6; border-radius: 11px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 52%; background: linear-gradient(180deg,#c9bce0,#a690cf); border-radius: 11px;"></div></div><div style="font-size: 9px; color: #a89e97;">ד</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 22px; height: 42px; background: #f2ede6; border-radius: 11px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 78%; background: linear-gradient(180deg,#c9bce0,#a690cf); border-radius: 11px;"></div></div><div style="font-size: 9px; color: #a89e97;">ה</div></div>
