<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gveret+Levin+AlefAlefAlef&family=Alef:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a9552f; } a:hover { color: #85401f; }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .hand { font-family: 'Gveret Levin AlefAlefAlef', 'Bradley Hand', cursive; }
    .tape { position: absolute; width: 54px; height: 17px; background: rgba(233,214,176,.72); border-left: 1px solid rgba(200,178,140,.5); border-right: 1px solid rgba(200,178,140,.5); box-shadow: 0 1px 3px rgba(120,100,85,.16); }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; min-height: 1000px; background: linear-gradient(160deg,#f4ece1,#e7dbc9); color: #4a4038; font-family: Alef, system-ui, sans-serif; padding: 34px 18px 30px; display: flex; flex-direction: column; gap: 16px;">

  <div style="text-align: center;">
    <div class="hand" style="font-size: 40px; line-height: 1; color: #3d342d; direction: ltr;">Better Me</div>
    <div style="font-size: 11px; color: #948573; margin-top: 8px; letter-spacing: .05em;">ראשון &middot; 30 באוגוסט</div>
  </div>

  <div style="background: #fdfbf8; border-radius: 4px; padding: 16px 16px 18px; box-shadow: 0 4px 14px rgba(120,100,85,.22); border: 1px solid #ece2d4; position: relative; transform: rotate(-.7deg);">
    <div class="tape" style="top: -9px; right: 50%; margin-right: -27px; transform: rotate(-2deg);"></div>
    <div class="hand" style="font-size: 22px; color: #3d342d; margin-bottom: 12px;">היום</div>

    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px;">
      <div class="hand" style="font-size: 46px; line-height: .95; color: #a9552f;">1420</div>
      <div style="font-size: 11px; color: #948573;">מתוך 1975 קק&quot;ל</div>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-end; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 30px; height: 72px; background: #f1e9dc; border: 1px solid #e0d4c2; border-radius: 2px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 76%; background: repeating-linear-gradient(45deg,#c9704f,#c9704f 3px,#d07f5f 3px,#d07f5f 6px);"></div></div>
        <div class="hand" style="font-size: 16px; color: #3d342d;">118</div>
        <div style="font-size: 9.5px; color: #948573;">חלבון</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 30px; height: 72px; background: #f1e9dc; border: 1px solid #e0d4c2; border-radius: 2px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 66%; background: repeating-linear-gradient(45deg,#6f9e78,#6f9e78 3px,#7fae88 3px,#7fae88 6px);"></div></div>
        <div class="hand" style="font-size: 16px; color: #3d342d;">132</div>
        <div style="font-size: 9.5px; color: #948573;">פחמימה</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 30px; height: 72px; background: #f1e9dc; border: 1px solid #e0d4c2; border-radius: 2px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 68%; background: repeating-linear-gradient(45deg,#c9a24f,#c9a24f 3px,#d6b165 3px,#d6b165 6px);"></div></div>
        <div class="hand" style="font-size: 16px; color: #3d342d;">41</div>
        <div style="font-size: 9.5px; color: #948573;">שומן</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="width: 30px; height: 72px; background: #f1e9dc; border: 1px solid #e0d4c2; border-radius: 2px; position: relative; overflow: hidden;"><div style="position: absolute; bottom: 0; width: 100%; height: 58%; background: repeating-linear-gradient(45deg,#4f83a9,#4f83a9 3px,#5f93b9 3px,#5f93b9 6px);"></div></div>
        <div class="hand" style="font-size: 16px; color: #3d342d;">1.7</div>
        <div style="font-size: 9.5px; color: #948573;">ליטר מים</div>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 4px;">

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(-1.4deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(-3deg);"></div>
      <div style="color: #a9552f;"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">תזונה</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">ארוחות, מאקרו ומים</div>
    </div>

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(1.1deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(2.5deg);"></div>
      <div style="color: #6f9e78;"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">כושר</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">אימונים והתקדמות</div>
    </div>

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(1.6deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(-1.5deg);"></div>
      <div style="color: #c9a24f;"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">תחביבים</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">דברים שאתה אוהב</div>
    </div>

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(-1deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(3deg);"></div>
      <div style="color: #4f83a9;"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">סיום יום</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">ראיון יומי ושיקוף</div>
    </div>

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(1.3deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(-2.5deg);"></div>
      <div style="color: #7a8f52;"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">מטרות</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">חלומות והדרך אליהם</div>
    </div>

    <div style="background: #fdfbf8; border: 5px solid #fff; border-radius: 3px; box-shadow: 0 3px 11px rgba(120,100,85,.3); padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; position: relative; transform: rotate(-1.7deg);">
      <div class="tape" style="top: -12px; right: 50%; margin-right: -27px; transform: rotate(1.8deg);"></div>
      <div style="color: #a9552f;"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20 18.5 5.5"/><path d="M13.5 5.5h5v5"/><path d="m6.5 13.5 4 4"/></svg></div>
      <div class="hand" style="font-size: 21px; color: #3d342d; line-height: 1;">משחק</div>
      <div style="font-size: 9.5px; color: #948573; line-height: 1.4;">החץ &mdash; מי עונה</div>
    </div>

  </div>

  <div style="margin-top: auto; padding-top: 14px; background: #fdfbf8; border-radius: 3px; padding: 14px 16px; box-shadow: 0 3px 11px rgba(120,100,85,.22); border: 1px solid #ece2d4; position: relative; transform: rotate(.5deg); display: flex; align-items: center; gap: 11px;">
    <div class="tape" style="top: -9px; right: 24px; transform: rotate(-4deg); width: 40px;"></div>
    <div style="color: #4f83a9; flex-shrink: 0;"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px;"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></div>
    <div style="flex: 1;">
      <div class="hand" style="font-size: 17px; color: #3d342d; line-height: 1.2;">איך היה היום?</div>
      <div style="font-size: 9.5px; color: #948573; margin-top: 3px;">שאלה אחת לפני השינה</div>
    </div>
    <div class="hand" style="font-size: 15px; color: #a9552f;">&#8592;</div>
  </div>

</div>
</x-dc>
</body>
</html>
