# GitHub Pages builds this repo with Jekyll. The published site had grown to ~770 MB and every deploy from 9 Nov
# 20:33 failed at "Deploy to GitHub Pages" (the build itself passed) - the phone stopped getting updates. These folders
# are old review material the app never loads (only comments mention them); they stay in the repo, unpublished.
# Never add dev/look here: vendor/beem-app.js loads Mip's props from dev/look/beem-props.
exclude:
  - review/
  - drafts/
  - Taste/
  - native/
  - push-server/
