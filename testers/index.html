<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f0eb">
<title>Better Me — בודקים ראשונים</title>
<!-- The first testers' agreement: commitment, confidentiality, and an honest
     account of what the app sends. Not part of the app and not part of a
     release. Nothing is uploaded from this page: the signed copy is drawn
     into an image on the phone and shared by the tester (WhatsApp, mail) or
     downloaded. Change TERMS_VERSION whenever the wording changes, so a
     signed copy says which text it agreed to. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
  :root{--surface:#f5f0eb;--card:#fff;--ink:#4a4340;--muted:#6d675e;--line:#ece5da;
    --terra-200:#f3b9a8;--terra-500:#e08a72;--terra-700:#98492c;--amber-700:#806423}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--surface);color:var(--ink);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
  main{max-width:620px;margin:0 auto;padding:22px 18px calc(48px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.01em}
  .brand i{font-style:normal;color:var(--terra-500)}
  .langs{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:3px;box-shadow:0 2px 8px rgba(200,180,160,.2)}
  .langs button{border:none;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);
    padding:5px 10px;border-radius:9px;cursor:pointer}
  .langs button.on{background:var(--surface);color:var(--ink)}
  h1{font-size:30px;line-height:1.2;margin:0 0 10px;font-weight:800}
  .lead{color:var(--muted);font-size:17px;margin:0 0 26px}
  section{background:var(--card);border-radius:20px;padding:20px 20px 16px;margin-bottom:14px;
    box-shadow:0 2px 12px rgba(200,180,160,.18)}
  h2{font-size:18px;margin:0 0 8px;font-weight:800;display:flex;gap:10px;align-items:baseline}
  h2 b{color:var(--terra-700);font-variant-numeric:tabular-nums}
  section p{margin:0 0 10px}
  ul{margin:0 0 6px;padding-inline-start:20px}li{margin-bottom:7px}
  .key{background:#fbf3ea;border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-weight:700}
  .wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fff;
    background:#1e7a44;border-radius:15px;padding:14px;font-weight:800;margin-top:6px}
  .wa.off{background:var(--line);color:var(--muted)}
  label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;
    color:var(--ink);background:var(--surface);outline:none}
  input[type=text]:focus{border-color:var(--terra-200)}
  .check{display:flex;gap:12px;align-items:flex-start;margin:10px 0;cursor:pointer;font-size:15px}
  .check input{width:22px;height:22px;margin:2px 0 0;flex-shrink:0;accent-color:var(--terra-500)}
  .pad{position:relative;border:1.5px dashed #d8cbbb;border-radius:16px;background:var(--surface);height:170px;touch-action:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px}
  .pad span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
    font-size:14px;pointer-events:none}
  .padbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
  .padbar button{border:none;background:none;font:inherit;color:var(--terra-700);font-weight:700;cursor:pointer;padding:4px}
  .go{width:100%;border:none;border-radius:16px;padding:16px;margin-top:18px;font:inherit;font-size:17px;font-weight:800;
    color:#fff;background:linear-gradient(135deg,var(--terra-200),var(--terra-500));cursor:pointer}
  .go:disabled{opacity:.45;cursor:default}
  .note{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
  .done{display:none;text-align:center;padding:10px 0}
  .done img{width:100%;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin:10px 0}
  .ver{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Better Me<i>.</i></div>
    <div class="langs" id="langs"></div>
  </div>
  <div id="doc"></div>
  <section id="signbox">
    <h2 data-t="signTitle"></h2>
    <label class="f" for="name" data-t="nameLabel"></label>
    <input type="text" id="name" autocomplete="name">
    <label class="check"><input type="checkbox" id="c1"><span data-t="agree1"></span></label>
    <label class="check"><input type="checkbox" id="c2"><span data-t="agree2"></span></label>
    <label class="check"><input type="checkbox" id="c3"><span data-t="agree3"></span></label>
    <label class="f" data-t="sigLabel"></label>
    <div class="pad" id="pad"><canvas id="sig"></canvas><span id="sighint" data-t="sigHint"></span></div>
    <div class="padbar"><span id="today"></span><button type="button" id="clear" data-t="clear"></button></div>
    <button class="go" id="go" disabled data-t="send"></button>
    <div class="note" data-t="sendNote"></div>
  </section>
  <section class="done" id="done">
    <h2 style="justify-content:center" data-t="doneTitle"></h2>
    <p data-t="doneText"></p>
    <div id="copy"></div>
    <button class="go" id="again" data-t="sendAgain"></button>
  </section>
  <div class="ver" id="ver"></div>
</main>
<script>
/* ── settings: the only things to edit ─────────────────────────────────── */
var TERMS_VERSION = '2';
var WEEKS = 3;                 /* how long a tester commits to */
var EVENINGS = 4;              /* evenings a week the summary is asked for */
var WA_LINK = 'https://chat.whatsapp.com/LOmyGdNEVSZJizV0Gat5Ct';              /* the Better Me WhatsApp group invite, https://chat.whatsapp.com/… */

/* ── the text, in three languages ──────────────────────────────────────────
   {w} weeks, {e} evenings. English was written first; Hebrew and German
   from it. The Hebrew addresses one person, like the app does. */
var T = {
he: {

  title:'ברוכים הבאים לקבוצת הבודקים הראשונים',
  lead:'Better Me עוד לא פורסמה. אתם מהאנשים הראשונים בעולם שמשתמשים בה, ומה שתעשו בשבועות הקרובים יקבע איך היא תיראה כשתצא. לפני שמתחילים, הנה מה שאנחנו מבקשים, מה שאנחנו מבטיחים, ומה בדיוק אנחנו רואים.',

  s1p:'אני מתחייב/ת להשתמש ב־Better Me במשך {w} שבועות רצופים, מהיום שבו אני מתקין/ה אותה.',
  s1key:'בראש סדר העדיפויות: סיום יום. לפחות {e} ערבים בכל שבוע, ועדיף כל ערב, אני מסיים/ת את היום באפליקציה.',

  s2:'סודיות',

  s2l:['לא אפרסם ולא אעביר לאף אחד צילומי מסך, הקלטות מסך, טקסטים, עיצוב או פרטים על התכונות של האפליקציה.',

  s3:'מה אנחנו רואים, ומה לא',

  s3end:'את המסמך הזה, החתום, אנחנו שומרים בנפרד. אין שום קשר בינו לבין המספר האקראי, ולכן גם אנחנו לא יודעים איזה מספר הוא שלך.',
  s4:'הקבוצה שלנו',
  s4p:'כל הדיווחים, הבאגים, השאלות והעדכונים עוברים בקבוצת הוואטסאפ Better Me. שם גם נודיע כשיש גרסה חדשה.',

  signTitle:'חתימה', nameLabel:'שם מלא',

  agree2:'אשמור על סודיות כמתואר למעלה.',
  agree3:'הבנתי מה האפליקציה שולחת ומה לא.',
  sigLabel:'חתימה', sigHint:'חתום/חתמי כאן באצבע', clear:'ניקוי', today:'תאריך: {d}',
  send:'חתימה ושליחה לאסף', sendNote:'הדף לא שומר ולא שולח כלום בעצמו. נוצרת תמונה של המסמך החתום, ואת/ה שולח/ת אותה.',
  doneTitle:'תודה, נתראה בקבוצה', doneText:'זה העותק החתום שלך. אם השליחה לא נפתחה, שמור/שמרי את התמונה ושלח/י אותה לאסף בוואטסאפ.',
  sendAgain:'שליחה שוב', copyTitle:'Better Me — הסכם בודק/ת', copyName:'שם', copyDate:'תאריך', copyVer:'גרסת נוסח', copyLang:'שפה'
},

  dir:'ltr', name:'English',

  lead:'Better Me has not been released yet. You are among the first people anywhere to use it, and what you do over the next few weeks will shape what it becomes. Before you begin, here is what we ask of you, what we promise, and exactly what we can see.',

  s3:'What we see, and what we don\'t',

}};
var LOCALE = {he:'he-IL', en:'en-GB', de:'de-DE'};

var lang = (function(){
  var q = (location.search.match(/[?&]lang=(he|en|de)/) || [])[1];
  if (q) return q;
  var n = (navigator.language || '').slice(0,2);
  return T[n] ? n : 'he';
})();
function fill(s){ return String(s).replace(/\{w\}/g, WEEKS).replace(/\{e\}/g, EVENINGS); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dateText(){ return new Intl.DateTimeFormat(LOCALE[lang], {day:'numeric', month:'long', year:'numeric'}).format(new Date()); }

function render(){
  var L = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = 'Better Me — ' + L.signTitle;
  document.getElementById('langs').innerHTML = ['he','en','de'].map(function(k){
    return '<button class="'+(k===lang?'on':'')+'" data-l="'+k+'">'+T[k].name+'</button>'; }).join('');
  var li = function(a){ return '<ul>' + a.map(function(x){ return '<li>'+fill(x)+'</li>'; }).join('') + '</ul>'; };
  document.getElementById('doc').innerHTML =
    '<h1>'+L.title+'</h1><p class="lead">'+L.lead+'</p>' +
    '<section><h2><b>1</b>'+L.s1+'</h2><p>'+fill(L.s1p)+'</p><div class="key">'+fill(L.s1key)+'</div>'+li(L.s1l)+'</section>' +
    '<section><h2><b>2</b>'+L.s2+'</h2><p>'+L.s2p+'</p>'+li(L.s2l)+'</section>' +
    '<section><h2><b>3</b>'+L.s3+'</h2><p>'+L.s3p+'</p>'+li(L.s3l)+'<p>'+L.s3end+'</p></section>' +
    '<section><h2><b>4</b>'+L.s4+'</h2><p>'+L.s4p+'</p>' +
      (WA_LINK ? '<a class="wa" href="'+esc(WA_LINK)+'" target="_blank" rel="noopener">'+L.wa+'</a>'
               : '<div class="wa off">'+L.waOff+'</div>') + '</section>';
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = fill(L[el.getAttribute('data-t')]); });
  document.getElementById('today').textContent = L.today.replace('{d}', dateText());
  document.getElementById('ver').textContent = L.copyVer + ' ' + TERMS_VERSION;
  check();
}
document.getElementById('langs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  lang = b.getAttribute('data-l'); history.replaceState(null, '', '?lang=' + lang); render();
});

/* ── the signature pad ─────────────────────────────────────────────────── */
var cv = document.getElementById('sig'), cx = cv.getContext('2d'), strokes = [], cur = null;
function sizePad(){
  var r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
  cx.setTransform(k, 0, 0, k, 0, 0); redraw();
}
function redraw(){
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#2f2a27'; cx.lineWidth = 2.6;
  strokes.forEach(function(s){ cx.beginPath(); s.forEach(function(p, i){ i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]); });
    if (s.length === 1) cx.lineTo(s[0][0] + .1, s[0][1]); cx.stroke(); });
  document.getElementById('sighint').style.display = strokes.length ? 'none' : '';
}
function pt(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', function(e){ cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); redraw(); e.preventDefault(); });
cv.addEventListener('pointermove', function(e){ if (!cur) return; cur.push(pt(e)); redraw(); e.preventDefault(); });
['pointerup','pointercancel'].forEach(function(t){ cv.addEventListener(t, function(){ cur = null; check(); }); });
document.getElementById('clear').onclick = function(){ strokes = []; redraw(); check(); };
window.addEventListener('resize', sizePad);

/* a signature is a mark that actually travels, not a tap */
function signed(){
  var n = 0; strokes.forEach(function(s){ for (var i = 1; i < s.length; i++) n += Math.hypot(s[i][0]-s[i-1][0], s[i][1]-s[i-1][1]); });
  return n > 60;
}
function check(){
  var ok = document.getElementById('name').value.trim().length > 1 &&
    ['c1','c2','c3'].every(function(id){ return document.getElementById(id).checked; }) && signed();
  document.getElementById('go').disabled = !ok;
}
['name','c1','c2','c3'].forEach(function(id){ document.getElementById(id).addEventListener('input', check); document.getElementById(id).addEventListener('change', check); });

/* ── the signed copy: an image drawn here, on the phone ────────────────── */
function wrap(ctx, text, max){
  var words = text.split(' '), lines = [], line = '';
  words.forEach(function(w){ var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line); return lines;
}
function makeCopy(){
  var L = T[lang], W = 1080, pad = 72, rtl = L.dir === 'rtl', x = rtl ? W - pad : pad;
  var c = document.createElement('canvas'), g = c.getContext('2d');
  var font = function(px, w){ return (w||400) + ' ' + px + 'px Assistant, -apple-system, "Segoe UI", sans-serif'; };
  var plain = function(h){ return h.replace(/<[^>]+>/g, ''); };
  var blocks = [
    [font(52,800), L.copyTitle, 64],
    [font(30,700), L.copyName + ': ' + document.getElementById('name').value.trim(), 46],
    [font(30,400), L.copyDate + ': ' + dateText() + '   ·   ' + L.copyLang + ': ' + L.name + '   ·   ' + L.copyVer + ' ' + TERMS_VERSION, 46],
    [font(30,700), L.s1, 50], [font(28,400), fill(L.s1p) + ' ' + fill(L.s1key), 40],
    [font(30,700), L.s2, 50], [font(28,400), L.s2p + ' ' + L.s2l.map(plain).join(' '), 40],
    [font(30,700), L.s3, 50], [font(28,400), L.s3l.map(plain).join(' '), 40],
    [font(28,700), '✓ ' + fill(L.agree1), 40], [font(28,700), '✓ ' + L.agree2, 40], [font(28,700), '✓ ' + L.agree3, 40]
  ];
  g.font = font(28);
  var laid = blocks.map(function(b){ g.font = b[0]; return { f:b[0], lh:b[2], lines: wrap(g, b[1], W - pad*2) }; });
  var sigH = 260, H = pad + laid.reduce(function(s, b){ return s + b.lines.length * b.lh + 18; }, 0) + 40 + sigH + pad;
  c.width = W; c.height = H;
  g.fillStyle = '#f5f0eb'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#4a4340'; g.direction = L.dir; g.textAlign = rtl ? 'right' : 'left'; g.textBaseline = 'top';
  var y = pad;
  laid.forEach(function(b){ g.font = b.f; b.lines.forEach(function(l){ g.fillText(l, x, y); y += b.lh; }); y += 18; });
  y += 20;
  g.fillStyle = '#fff'; g.fillRect(pad, y, W - pad*2, sigH);
  g.strokeStyle = '#d8cbbb'; g.lineWidth = 2; g.strokeRect(pad, y, W - pad*2, sigH);
  /* the strokes, scaled into the box with their proportions kept */
  var r = cv.getBoundingClientRect(), k = Math.min((W - pad*2 - 40) / r.width, (sigH - 40) / r.height);
  var ox = pad + (W - pad*2 - r.width*k) / 2, oy = y + (sigH - r.height*k) / 2;
  g.strokeStyle = '#2f2a27'; g.lineWidth = 2.6 * k; g.lineCap = 'round'; g.lineJoin = 'round';
  strokes.forEach(function(s){ g.beginPath(); s.forEach(function(p, i){ var px = ox + p[0]*k, py = oy + p[1]*k; i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); });
  return c;
}
function share(blob){
  var nm = 'BetterMe-' + document.getElementById('name').value.trim().replace(/[^\p{L}\p{N}]+/gu, '-') + '.png';
  var file = new File([blob], nm, {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    return navigator.share({files:[file], title:T[lang].copyTitle}).catch(function(){});
  }
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nm; a.click();
  return Promise.resolve();
}
var lastBlob = null;
document.getElementById('go').onclick = function(){
  document.fonts.ready.then(function(){
    var c = makeCopy();
    c.toBlob(function(blob){
      lastBlob = blob;
      var im = new Image(); im.alt = T[lang].copyTitle; im.src = URL.createObjectURL(blob); document.getElementById('copy').replaceChildren(im);
      document.getElementById('signbox').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      share(blob);
    }, 'image/png');
  });
};
document.getElementById('again').onclick = function(){ if (lastBlob) share(lastBlob); };

render(); sizePad();
</script>
</body>
