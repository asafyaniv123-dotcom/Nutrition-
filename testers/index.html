<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf6ee">
<title>Olimei</title>
<link rel="icon" href="../brand/favicon.svg">
<!-- The first testers' agreement: commitment, confidentiality, and an honest
     account of what the app sends - one step at a time, like a questionnaire.
     Not part of the app and not part of a release. Nothing is uploaded from
     this page: the signed copy is drawn into an image on the phone and shared
     by the tester (WhatsApp, mail) or downloaded. Change TERMS_VERSION
     whenever the wording changes, so a signed copy says which text it agreed
     to. The brand (sun, wordmark, colours) comes from brand/. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
  :root{--cream:#fbf6ee;--card:#fff;--ink:#2e2925;--muted:#665d55;--line:#ece3d6;--orange:#ff7a1a;--orange-ink:#a8460a;--soft:#fff1e4}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--cream);color:var(--ink);font-size:16.5px;line-height:1.65;-webkit-text-size-adjust:100%;
    font-variant-ligatures:no-common-ligatures}
  .shell{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 20px 0}
  .top{display:flex;justify-content:space-between;align-items:center;height:40px}
  .top img{height:26px;display:block}
  .langs{display:flex;gap:2px;background:var(--card);border-radius:12px;padding:3px;box-shadow:0 1px 6px rgba(46,41,37,.08)}
  .langs button{border:none;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:9px;cursor:pointer}
  .langs button.on{background:var(--cream);color:var(--ink)}
  .prog{display:flex;gap:6px;margin:16px 0 4px}
  .prog i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
  .prog i.on{background:var(--orange)}
  .stage{flex:1;padding:18px 0 24px}
  .step{animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.step{animation:none}}
  .hero{text-align:center;padding:28px 0 6px}
  .hero img{width:min(230px,62vw);display:block;margin:0 auto 34px}
  h1{font-family:'Assistant',sans-serif;font-size:30px;line-height:1.2;margin:0 0 14px;font-weight:800;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:17.5px;margin:0}
  .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    background:var(--soft);color:var(--orange-ink);font-weight:800;margin-bottom:12px}
  .step p{margin:0 0 12px}
  .key{background:var(--soft);border-radius:16px;padding:14px 16px;margin:4px 0 16px;font-weight:700}
  ul{margin:0 0 8px;padding:0;list-style:none}
  li{position:relative;padding-inline-start:20px;margin-bottom:10px}
  li::before{content:'';position:absolute;inset-inline-start:2px;top:.68em;width:7px;height:7px;border-radius:50%;background:var(--orange)}
  .check{display:flex;gap:12px;align-items:flex-start;margin:18px 0 0;padding:14px 16px;background:var(--card);
    border-radius:16px;cursor:pointer;font-weight:700;box-shadow:0 1px 6px rgba(46,41,37,.07);border:2px solid transparent;transition:border-color .2s}
  .check.on{border-color:var(--orange)}
  .check input{width:22px;height:22px;margin:2px 0 0;flex-shrink:0;accent-color:var(--orange)}
  .wa{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fff;
    background:#1e7a44;border-radius:16px;padding:15px;font-weight:800;margin-top:14px}
  label.f{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
  input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font:inherit;color:var(--ink);background:var(--card);outline:none}
  input[type=text]:focus{border-color:var(--orange)}
  .pad{position:relative;border:1.5px dashed #d6c6b2;border-radius:16px;background:var(--card);height:190px;touch-action:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px}
  .pad span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
  .padbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
  .padbar button{border:none;background:none;font:inherit;color:var(--orange-ink);font-weight:700;cursor:pointer;padding:4px}
  .note{font-size:13px;color:var(--muted);margin-top:12px}
  .done{text-align:center}.done .note{margin-top:20px}
  .done img{width:100%;border-radius:14px;box-shadow:0 2px 14px rgba(46,41,37,.1);margin:14px 0}
  .foot{position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(251,246,238,0),var(--cream) 22%);
    padding:22px 0 calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .go{flex:1;border:none;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:800;color:var(--cream);background:var(--ink);cursor:pointer}
  .go:disabled{opacity:.35;cursor:default}
  .back{border:none;border-radius:16px;padding:16px 18px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--line);cursor:pointer}
  .ver{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><span id="mark"></span><div class="langs" id="langs"></div></div>
  <div class="prog" id="prog"></div>
  <div class="stage" id="stage"></div>
  <div class="ver" id="ver"></div>
  <div class="foot" id="foot"></div>
</div>

  agree2:'Ich wahre die oben beschriebene Vertraulichkeit.',
  agree3:'Ich habe verstanden, was die App sendet und was nicht.',
  sigLabel:'Unterschrift', sigHint:'Hier mit dem Finger unterschreiben', clear:'Löschen', today:'Datum: {d}',
  send:'Unterschreiben und an Asaf senden', sendNote:'Diese Seite speichert und sendet nichts von selbst. Sie erstellt ein Bild des unterschriebenen Dokuments, und du schickst es.',
  doneTitle:'Danke — wir sehen uns in der Gruppe', doneText:'Das ist deine unterschriebene Kopie. Falls sich das Teilen nicht geöffnet hat, speichere das Bild und schick es Asaf per WhatsApp.',
  sendAgain:'Erneut senden', copyTitle:'Olimei — Testervereinbarung', copyName:'Name', copyDate:'Datum', copyVer:'Textversion', copyLang:'Sprache'
}};
/* the words of the steps themselves */
Object.assign(T.he, {start:'מתחילים', next:'המשך', back:'חזרה'});
Object.assign(T.en, {start:'Let’s begin', next:'Continue', back:'Back'});
Object.assign(T.de, {start:'Los geht’s', next:'Weiter', back:'Zurück'});
var LOCALE = {he:'he-IL', en:'en-GB', de:'de-DE'};

var lang = (function(){
  var q = (location.search.match(/[?&]lang=(he|en|de)/) || [])[1];
  if (q) return q;
  var n = (navigator.language || '').slice(0,2);
  return T[n] ? n : 'he';
})();
var step = 0, agreed = {c1:false, c2:false, c3:false}, name = '', strokes = [], lastBlob = null;
var STEPS = ['hello', 'commit', 'secret', 'see', 'sign', 'done'];
function fill(s){ return String(s).replace(/\{w\}/g, WEEKS).replace(/\{e\}/g, EVENINGS); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dateText(){ return new Intl.DateTimeFormat(LOCALE[lang], {day:'numeric', month:'long', year:'numeric'}).format(new Date()); }
function $(id){ return document.getElementById(id); }
function li(a){ return '<ul>' + a.map(function(x){ return '<li>'+fill(x)+'</li>'; }).join('') + '</ul>'; }
function box(id, text){ return '<label class="check'+(agreed[id]?' on':'')+'"><input type="checkbox" id="'+id+'"'+(agreed[id]?' checked':'')+'><span>'+fill(text)+'</span></label>'; }

function body(){
  var L = T[lang], s = STEPS[step];
  if (s === 'hello') return '<div class="hero"><img src="../brand/sun.svg" alt="" style="width:96px;height:96px;display:block;margin:0 auto 10px"><img src="../brand/wordmark-olimei.png" alt="Olimei" style="height:52px;width:auto;display:block;margin:0 auto"><h1>'+L.title+'</h1><p class="lead">'+L.lead+'</p></div>';
  if (s === 'commit') return '<div class="num">1</div><h1>'+L.s1+'</h1><p>'+fill(L.s1p)+'</p><div class="key">'+fill(L.s1key)+'</div>'+li(L.s1l)+box('c1', L.agree1);
  if (s === 'secret') return '<div class="num">2</div><h1>'+L.s2+'</h1><p>'+L.s2p+'</p>'+li(L.s2l)+box('c2', L.agree2);
  if (s === 'see') return '<div class="num">3</div><h1>'+L.s3+'</h1><p>'+L.s3p+'</p>'+li(L.s3l)+'<p>'+L.s3end+'</p>'+box('c3', L.agree3);
  if (s === 'sign') return '<div class="num">4</div><h1>'+L.signTitle+'</h1>'+
    '<label class="f" for="name">'+L.nameLabel+'</label><input type="text" id="name" autocomplete="name" value="'+esc(name)+'">'+
    '<label class="f">'+L.sigLabel+'</label><div class="pad" id="pad"><canvas id="sig"></canvas><span id="sighint">'+L.sigHint+'</span></div>'+
    '<div class="padbar"><span>'+L.today.replace('{d}', dateText())+'</span><button type="button" id="clear">'+L.clear+'</button></div>'+
    '<p class="note">'+L.sendNote+'</p>';
  return '<div class="done"><h1>'+L.doneTitle+'</h1><p>'+L.s4p+'</p>'+
    '<a class="wa" href="'+esc(WA_LINK)+'" target="_blank" rel="noopener">'+L.wa+'</a>'+
    '<p class="note">'+L.doneText+'</p><div id="copy"></div></div>';
}
function ready(){
  var s = STEPS[step];
  if (s === 'commit') return agreed.c1;
  if (s === 'secret') return agreed.c2;
  if (s === 'see') return agreed.c3;
  if (s === 'sign') return name.trim().length > 1 && signed();
  return true;
}
function foot(){
  var L = T[lang], s = STEPS[step];
  var label = s === 'hello' ? L.start : s === 'sign' ? L.send : s === 'done' ? L.sendAgain : L.next;
  return (step > 0 && s !== 'done' ? '<button class="back" id="back">'+L.back+'</button>' : '') +
    '<button class="go" id="go"'+(ready()?'':' disabled')+'>'+label+'</button>';
}
function render(){
  var L = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = L.dir;
  document.title = L.copyTitle;
  $('langs').innerHTML = ['he','en','de'].map(function(k){ return '<button class="'+(k===lang?'on':'')+'" data-l="'+k+'">'+T[k].name+'</button>'; }).join('');
  $('mark').innerHTML = step ? '<img src="../brand/wordmark-olimei.png" alt="Olimei" style="height:28px;width:auto">' : '';
  $('prog').innerHTML = STEPS.slice(1, -1).map(function(_, i){ return '<i class="'+(i < step ? 'on' : '')+'"></i>'; }).join('');
  $('prog').style.visibility = step && STEPS[step] !== 'done' ? '' : 'hidden';
  $('stage').innerHTML = '<div class="step">' + body() + '</div>';
  $('foot').innerHTML = foot();
  $('ver').textContent = L.copyVer + ' ' + TERMS_VERSION;
  wire();
}
function refreshGo(){ var g = $('go'); if (g && STEPS[step] !== 'done') g.disabled = !ready(); }
function wire(){
  ['c1','c2','c3'].forEach(function(id){ var e = $(id); if (e) e.onchange = function(){ agreed[id] = e.checked; e.parentNode.classList.toggle('on', e.checked); refreshGo(); }; });
  if ($('name')) $('name').oninput = function(){ name = this.value; refreshGo(); };
  if ($('sig')) padInit();
  if ($('back')) $('back').onclick = function(){ step--; render(); scrollTo(0, 0); };
  $('go').onclick = function(){
    var s = STEPS[step];
    if (s === 'done') { if (lastBlob) share(lastBlob); return; }
    if (s === 'sign') return finish();
    step++; render(); scrollTo(0, 0);
  };
  if (STEPS[step] === 'done' && lastBlob) showCopy();
}
$('langs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  lang = b.getAttribute('data-l'); history.replaceState(null, '', '?lang=' + lang); render();
});

/* ── the signature pad ─────────────────────────────────────────────────── */
var cv, cx, cur = null, padW = 0, padH = 0;
function padInit(){
  cv = $('sig'); cx = cv.getContext('2d');
  var r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
  /* strokes are kept in the pad's own pixels; a language switch redraws them */
  padW = r.width; padH = r.height;
  cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k); cx.setTransform(k, 0, 0, k, 0, 0); redraw();
  function pt(e){ var q = cv.getBoundingClientRect(); return [e.clientX - q.left, e.clientY - q.top]; }
  cv.onpointerdown = function(e){ cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); redraw(); e.preventDefault(); };
  cv.onpointermove = function(e){ if (!cur) return; cur.push(pt(e)); redraw(); e.preventDefault(); };
  cv.onpointerup = cv.onpointercancel = function(){ cur = null; refreshGo(); };
  $('clear').onclick = function(){ strokes = []; redraw(); refreshGo(); };
}
function redraw(){
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#2e2925'; cx.lineWidth = 2.6;
  strokes.forEach(function(s){ cx.beginPath(); s.forEach(function(p, i){ i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]); });
    if (s.length === 1) cx.lineTo(s[0][0] + .1, s[0][1]); cx.stroke(); });
  $('sighint').style.display = strokes.length ? 'none' : '';
}
/* a signature is a mark that actually travels, not a tap */
function signed(){
  var n = 0; strokes.forEach(function(s){ for (var i = 1; i < s.length; i++) n += Math.hypot(s[i][0]-s[i-1][0], s[i][1]-s[i-1][1]); });
  return n > 60;
}

/* ── the signed copy: an image drawn here, on the phone ────────────────── */
function wrap(ctx, text, max){
  var words = text.split(' '), lines = [], line = '';
  words.forEach(function(w){ var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line); return lines;
}
/* the brand's nine-dot sun - the geometry of brand/build-svgs.mjs */
function sun(g, x0, y0, s){
  g.fillStyle = '#ff7a1a'; g.beginPath(); g.arc(x0, y0, 19.5*s, 0, 7); g.fill();
  for (var i = 0; i < 9; i++){ var a = (i + .5)/9*Math.PI*2 - Math.PI/2;
    g.beginPath(); g.arc(x0 + Math.cos(a)*33*s, y0 + Math.sin(a)*33*s, 5.6*s, 0, 7); g.fill(); }
}
function makeCopy(){
  var L = T[lang], W = 1080, pad = 72, rtl = L.dir === 'rtl', x = rtl ? W - pad : pad;
  var c = document.createElement('canvas'), g = c.getContext('2d');
  var font = function(px, w, fam){ return (w||400) + ' ' + px + 'px ' + (fam || 'Assistant, -apple-system, "Segoe UI", sans-serif'); };
  var plain = function(h){ return h.replace(/<[^>]+>/g, ''); };
  var blocks = [
    [font(30,700), L.copyName + ': ' + name.trim(), 46],
    [font(28,400), L.copyDate + ': ' + dateText() + '   ·   ' + L.copyLang + ': ' + L.name + '   ·   ' + L.copyVer + ' ' + TERMS_VERSION, 44],
    [font(30,700), L.s1, 50], [font(27,400), fill(L.s1p) + ' ' + fill(L.s1key), 40],
    [font(30,700), L.s2, 50], [font(27,400), L.s2p + ' ' + L.s2l.map(plain).join(' '), 40],
    [font(30,700), L.s3, 50], [font(27,400), L.s3l.map(plain).join(' '), 40],
    [font(27,700), '✓ ' + fill(L.agree1), 40], [font(27,700), '✓ ' + L.agree2, 40], [font(27,700), '✓ ' + L.agree3, 40]
  ];
  var laid = blocks.map(function(b){ g.font = b[0]; return { f:b[0], lh:b[2], lines: wrap(g, b[1], W - pad*2) }; });
  var headH = 150, sigH = 260, H = pad + headH + laid.reduce(function(s, b){ return s + b.lines.length * b.lh + 18; }, 0) + 40 + sigH + pad;
  c.width = W; c.height = H;
  g.fillStyle = '#fbf6ee'; g.fillRect(0, 0, W, H);
  /* the header: the sun and the wordmark, as in brand/lockup-light.png, then what this is */
  sun(g, pad + 40, pad + 40, 1.0);
  g.fillStyle = '#2e2925'; g.textBaseline = 'middle'; g.direction = 'ltr'; g.textAlign = 'left';
  g.font = font(54, 700, 'Fraunces, Georgia, serif'); g.fillText('Olimei', pad + 100, pad + 40);
  g.font = font(28, 600); g.fillStyle = '#665d55'; g.direction = L.dir; g.textAlign = rtl ? 'right' : 'left';
  g.fillText(L.copyTitle.replace(/^Olimei — /, ''), x, pad + 112);
  g.fillStyle = '#ece3d6'; g.fillRect(pad, pad + headH - 6, W - pad*2, 2);
  g.fillStyle = '#2e2925'; g.textBaseline = 'top';
  var y = pad + headH + 14;
  laid.forEach(function(b){ g.font = b.f; b.lines.forEach(function(l){ g.fillText(l, x, y); y += b.lh; }); y += 18; });
  y += 20;
  g.fillStyle = '#fff'; g.fillRect(pad, y, W - pad*2, sigH);
  g.strokeStyle = '#d6c6b2'; g.lineWidth = 2; g.strokeRect(pad, y, W - pad*2, sigH);
  var k = Math.min((W - pad*2 - 40) / padW, (sigH - 40) / padH);
  var ox = pad + (W - pad*2 - padW*k) / 2, oy = y + (sigH - padH*k) / 2;
  g.strokeStyle = '#2e2925'; g.lineWidth = 2.6 * k; g.lineCap = 'round'; g.lineJoin = 'round';
  strokes.forEach(function(s){ g.beginPath(); s.forEach(function(p, i){ var px = ox + p[0]*k, py = oy + p[1]*k; i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); });
  return c;
}
function fileName(){ return 'Olimei-' + name.trim().replace(/[^\p{L}\p{N}]+/gu, '-') + '.png'; }
function share(blob){
  var file = new File([blob], fileName(), {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]})) return navigator.share({files:[file], title:T[lang].copyTitle}).catch(function(){});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(); a.click();
  return Promise.resolve();
}
function showCopy(){ var im = new Image(); im.alt = T[lang].copyTitle; im.src = URL.createObjectURL(lastBlob); $('copy').replaceChildren(im); }
function finish(){
  document.fonts.ready.then(function(){
    makeCopy().toBlob(function(blob){ lastBlob = blob; step = STEPS.length - 1; render(); scrollTo(0, 0); share(blob); }, 'image/png');
  });
}
render();
</script>
</body>
</html>
