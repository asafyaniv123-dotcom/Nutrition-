<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>שימוש — ניהול</title>
<!-- Asaf's page, not the app's: anonymous usage from /admin/usage, read with
     the ADMIN_KEY secret (kept in this browser only, shared with the
     corrections page). Not part of a release and not linked from the app.
     A person here is a random install id; nothing they wrote is ever sent.

     THE NUMBER: of the installs whose second week is over, how many closed
     the day on at least 4 of its evenings. Day 1 is the install's first
     day; week 2 is days 8-14. Days are APP days (they end at 04:00), the
     same string the app sends, so nothing here re-derives a day from a
     clock. Add ?demo to the address to see the page on invented data. -->
<style>
  body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#efebe6;color:#3f3a35}
  main{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:30px 0 4px}
  .sub{color:#5f564e;font-size:13px;margin-bottom:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input,select,button{font:inherit;border-radius:10px;border:1px solid #d8d0c6;padding:8px 10px;background:#fff;color:inherit}
  button{cursor:pointer;font-weight:700}
  .hero{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .hero .big{font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .hero .big small{font-size:24px;color:#5f564e;font-weight:700}
  .hero .what{flex:1;min-width:220px}
  .hero .what b{display:block;font-size:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  .card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .card b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
  .card span{color:#5f564e;font-size:12.5px}
  .panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-top:8px}
  table{border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:5px 6px;text-align:center;font-size:12.5px;border-bottom:1px solid #f0ebe5}
  th{background:#f6f3ef;font-weight:700;position:sticky;top:0}
  th.wk{border-inline-start:2px solid #e3d9cc}td.wk{border-inline-start:2px solid #f0e8de}
  td.id{font-family:ui-monospace,monospace;text-align:start;color:#5f564e}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%}
  .on{background:#c9b49a}.sum{background:#8a5a1c}.none{background:#f3efe9}
  .scroll{overflow-x:auto}
  .meta{color:#5f564e;font-size:12.5px}.err{color:#a2412a;font-weight:700}
  .pass{color:#2f6b3a;font-weight:800}.fail{color:#a2412a;font-weight:800}.wait{color:#5f564e}
  .hb div{display:flex;align-items:center;gap:8px;margin:5px 0}
  .hb span{width:96px;flex-shrink:0}.hb i{display:block;height:14px;border-radius:7px;background:#8a5a1c}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#5f564e;margin:4px 0 6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
  svg text{font:11px system-ui,sans-serif;fill:#5f564e}
  .demo{background:#fbe9c9;border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<main>
  <h1>מי משתמש, ומי חוזר</h1>
  <div class="sub">אנונימי לגמרי: מזהה אקראי של כל התקנה, באילו ימים פתחו, אם סיכמו את הערב, ואילו אזורים פתחו. שום תוכן ממה שכתבו.</div>
  <div class="bar">
    <input id="key" type="password" placeholder="ADMIN_KEY" size="22">
    <select id="days"><option value="30">30 יום</option><option value="14">שבועיים</option><option value="60">60 יום</option><option value="120">120 יום</option></select>
    <label><input id="nodev" type="checkbox" checked> בלי dev</label>
    <button onclick="load()">טען</button>
    <span id="st" class="meta"></span>
  </div>
  <div id="out"></div>
</main>
<script>
var HOST='https://nutrition-push.nutrition-push.workers.dev';
var NEED=4;                       /* evenings in week 2 that make a pass */
var keyEl=document.getElementById('key');keyEl.value=localStorage.getItem('admin_key')||'';
var AREA={nutrition:'תזונה',fitness:'כושר',hobbies:'תחביבים',people:'האנשים שלי',planning:'תכנון זמן',closet:'הארון שלי',insights:'תובנות',endofday:'סיום יום'};
var LANG={he:'עברית',en:'English',de:'Deutsch',es:'Español',fr:'Français',it:'Italiano',pt:'Português',ja:'日本語',zh:'简体中文','zh-TW':'繁體中文',ar:'العربية'};
var lastDays=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* day strings are calendar labels; arithmetic on them is done at UTC noon so no zone can move one */
function dnum(d){return Math.floor(Date.parse(d+'T12:00:00Z')/86400000);}
function dstr(n){return new Date(n*86400000+43200000).toISOString().slice(0,10);}
function short(d){return d.slice(8)+'/'+d.slice(5,7);}
/* the app's own today: the day ends at 04:00 local */
function appToday(){var t=new Date(Date.now()-4*3600000);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}

function load(){
  if(/[?&]demo/.test(location.search)){document.getElementById('st').textContent='';lastDays=demo();draw();return;}
  var k=keyEl.value.trim();localStorage.setItem('admin_key',k);
  var st=document.getElementById('st');st.textContent='טוען…';
  fetch(HOST+'/admin/usage?days='+document.getElementById('days').value,{headers:{Authorization:'Bearer '+k}})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s!==200||!x.j.ok){st.innerHTML='<span class="err">'+(x.s===401?'המפתח לא נכון':'שגיאה '+x.s)+'</span>';return;}
      st.textContent='';lastDays=x.j.days;draw();
    }).catch(function(){st.innerHTML='<span class="err">אין חיבור</span>';});
}
document.getElementById('nodev').addEventListener('change',function(){if(lastDays)draw();});

function draw(){
  var days=lastDays.slice(),nodev=document.getElementById('nodev').checked;
  days.sort(function(a,b){return a.day<b.day?-1:1;});
  var today=appToday(),tn=dnum(today);
  var people={},areas={},langs={},id,r;
  days.forEach(function(D){for(id in D.ids){r=D.ids[id];if(nodev&&r.d)continue;
    var p=people[id]||(people[id]={first:r.f||D.day,lang:'',days:{}});
    p.days[D.day]=r;if(r.l)p.lang=r.l;
    /* the first day is the earlier of what the app remembers and what we saw */
    if(r.f&&r.f<p.first)p.first=r.f;if(D.day<p.first)p.first=D.day;
    (r.a||[]).forEach(function(a){areas[a]=(areas[a]||0)+1;});}});
  var ids=Object.keys(people).sort(function(a,b){return people[a].first<people[b].first?-1:1;});
  var since=days.length?days[0].day:today;
  ids.forEach(function(id){var p=people[id];langs[p.lang||'?']=(langs[p.lang||'?']||0)+1;
    var f=dnum(p.first);p.dayN=tn-f+1;
    /* evenings closed in days [a,b] of this install's life */
    p.sums=function(a,b){var n=0;for(var i=a;i<=b;i++){var x=p.days[dstr(f+i-1)];if(x&&x.s)n++;}return n;};
    p.w1=p.sums(1,7);p.w2=p.sums(8,14);
    /* week 2 is over once day 14 has ended, i.e. today is day 15 or later */
    p.state=p.dayN<15?'wait':(p.w2>=NEED?'pass':'fail');
    /* an install first seen on the first day we have data may be older than the data */
    p.cut=p.first<=since&&days.length>=14;});

  var done=ids.filter(function(i){return people[i].state!=='wait';});
  var passed=done.filter(function(i){return people[i].state==='pass';});
  var going=ids.filter(function(i){return people[i].state==='wait';});
  var onTrack=going.filter(function(i){var p=people[i];return p.dayN>=8&&p.sums(8,p.dayN)+(14-p.dayN+1)>=NEED;});

  var h='';
  if(/[?&]demo/.test(location.search))h+='<div class="demo">נתוני הדגמה — לא אמיתיים</div>';
  h+='<div class="hero"><div class="big">'+passed.length+'<small> / '+done.length+'</small></div>'+
     '<div class="what"><b>סיכמו לפחות '+NEED+' ערבים בשבוע השני שלהם</b>'+
     '<span class="meta">מתוך ההתקנות שהשבוע השני שלהן (ימים 8–14) כבר נגמר'+(done.length?' — '+Math.round(passed.length/done.length*100)+'%':'')+'. '+
     going.length+' עוד באמצע'+(onTrack.length?', מהן '+onTrack.length+' בשבוע השני ועדיין יכולות לעבור':'')+'.</span></div></div>';

  var last7=[];for(var i=6;i>=0;i--)last7.push(dstr(tn-i));
  var active7=ids.filter(function(id){return last7.some(function(d){return people[id].days[d];});}).length;
  var sums7=0;ids.forEach(function(id){last7.forEach(function(d){var x=people[id].days[d];if(x&&x.s)sums7++;});});
  var back=ids.filter(function(id){var p=people[id],f=dnum(p.first);return Object.keys(p.days).some(function(d){return dnum(d)-f>=2;});}).length;
  h+='<div class="cards">'+
    '<div class="card"><b>'+ids.length+'</b><span>התקנות בתקופה</span></div>'+
    '<div class="card"><b>'+active7+'</b><span>פעילות ב־7 הימים האחרונים</span></div>'+
    '<div class="card"><b>'+back+'</b><span>חזרו יומיים או יותר אחרי היום הראשון</span></div>'+
    '<div class="card"><b>'+sums7+'</b><span>ערבים שסוכמו ב־7 הימים האחרונים</span></div></div>';

  /* ── retention: of the installs old enough to have a day N, how many opened / closed on it ── */
  var MAXN=21,ret=[];
  for(var n=1;n<=MAXN;n++){var el=0,op=0,sm=0;
    ids.forEach(function(id){var p=people[id];if(p.dayN<n)return;el++;var x=p.days[dstr(dnum(p.first)+n-1)];if(x){op++;if(x.s)sm++;}});
    ret.push({n:n,el:el,op:op,sm:sm});}
  h+='<h2>מי עוד כאן ביום ה־N</h2><div class="meta">מכל ההתקנות שכבר הגיעו ליום הזה בחייהן: כמה פתחו בו, וכמה סיכמו בו את הערב. הקו המקווקו מסמן את השבוע השני.</div>'+
    '<div class="legend"><span><i style="background:#c9b49a"></i>פתחו</span><span><i style="background:#8a5a1c"></i>סיכמו</span></div>'+
    '<div class="panel">'+chart(ret.map(function(x){return {lab:String(x.n),a:x.el?x.op/x.el:0,b:x.el?x.sm/x.el:0,tip:'יום '+x.n+': '+x.op+' פתחו, '+x.sm+' סיכמו, מתוך '+x.el,dim:!x.el};}),true,[8,14])+'</div>';

  /* ── calendar: active and closed per day ── */
  var cal=[];for(var c=dnum(since);c<=tn;c++){var d=dstr(c),op2=0,sm2=0;
    ids.forEach(function(id){var x=people[id].days[d];if(x){op2++;if(x.s)sm2++;}});cal.push({lab:short(d),a:op2,b:sm2,tip:short(d)+': '+op2+' פתחו, '+sm2+' סיכמו'});}
  h+='<h2>יום אחרי יום</h2><div class="meta">כמה התקנות פתחו את האפליקציה בכל יום, וכמה מהן סיכמו את הערב.</div>'+
    '<div class="legend"><span><i style="background:#c9b49a"></i>פתחו</span><span><i style="background:#8a5a1c"></i>סיכמו</span></div>'+
    '<div class="panel">'+chart(cal,false)+'</div>';

  /* ── every install, by its own day 1..21 ── */
  h+='<h2>כל התקנה, לפי הימים שלה</h2><div class="meta">עמודה 1 היא היום הראשון של אותה התקנה. עיגול בהיר: פתחו. עיגול כהה: סיכמו. ריבוע אפור: היום הזה עוד לא הגיע.'+
    ' ✱ ליד המזהה: נראתה כבר ביום הראשון של הנתונים, אז ייתכן שהיא ותיקה יותר והשבוע השני שלה מחושב מאוחר מדי.</div><div class="panel scroll"><table><tr><th>מזהה</th><th>שפה</th><th>התחילה</th>';
  for(var k=1;k<=MAXN;k++)h+='<th'+(k===8||k===15?' class="wk"':'')+'>'+k+'</th>';
  h+='<th class="wk">שבוע 1</th><th>שבוע 2</th><th></th></tr>';
  ids.forEach(function(id){var p=people[id],f=dnum(p.first);
    h+='<tr><td class="id">'+id.slice(0,6)+(p.cut?' ✱':'')+'</td><td>'+esc(p.lang)+'</td><td>'+short(p.first)+'</td>';
    for(var k=1;k<=MAXN;k++){var x=p.days[dstr(f+k-1)],cls=k===8||k===15?' class="wk"':'';
      h+='<td'+cls+'>'+(k>p.dayN?'<span class="dot none" style="border-radius:3px"></span>':x?'<span class="dot '+(x.s?'sum':'on')+'" title="'+x.o+' פתיחות"></span>':'')+'</td>';}
    h+='<td class="wk">'+p.w1+'</td><td>'+(p.dayN>=8?p.w2:'–')+'</td><td class="'+p.state+'">'+(p.state==='pass'?'עברה':p.state==='fail'?'לא עברה':'יום '+p.dayN)+'</td></tr>';});
  h+='</table></div>';

  h+='<h2>אילו אזורים פותחים</h2><div class="meta">כמה ימי־משתמש נכנסו לכל אזור.</div><div class="panel">'+hbars(areas,AREA)+'</div>';
  h+='<h2>שפות</h2><div class="meta">כמה התקנות בכל שפה.</div><div class="panel">'+hbars(langs,LANG)+'</div>';
  if(!ids.length)h='<div class="meta">עוד אין נתונים בתקופה הזאת.</div>';
  document.getElementById('out').innerHTML=h;
}

/* two overlaid columns per label: a (light) behind, b (dark) in front.
   pct: values are shares 0..1; marks: [from,to] labels to bracket. */
function chart(rows,pct,marks){
  var W=Math.max(560,rows.length*26),H=180,L=34,B=22,T=8,iw=W-L-6,ih=H-B-T,bw=iw/rows.length;
  var mx=pct?1:Math.max(1,Math.max.apply(null,rows.map(function(r){return r.a;})));
  var y=function(v){return T+ih-v/mx*ih;},s='<svg viewBox="0 0 '+W+' '+H+'" style="direction:ltr;display:block;width:100%;min-width:'+W*.8+'px;height:auto">';
  [0,.5,1].forEach(function(t){var v=t*mx;s+='<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#eee6dc"/><text x="'+(L-5)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(pct?Math.round(v*100)+'%':Math.round(v))+'</text>';});
  if(marks){var x0=L+(marks[0]-1)*bw,x1=L+marks[1]*bw;s+='<rect x="'+x0+'" y="'+T+'" width="'+(x1-x0)+'" height="'+ih+'" fill="none" stroke="#8a5a1c" stroke-dasharray="4 3" rx="4"/>';}
  rows.forEach(function(r,i){var x=L+i*bw+bw*.15,w=bw*.7;
    s+='<g><title>'+esc(r.tip)+'</title>';
    s+='<rect x="'+x+'" y="'+y(r.a)+'" width="'+w+'" height="'+(T+ih-y(r.a))+'" rx="3" fill="#c9b49a"'+(r.dim?' opacity=".3"':'')+'/>';
    s+='<rect x="'+(x+w*.2)+'" y="'+y(r.b)+'" width="'+(w*.6)+'" height="'+(T+ih-y(r.b))+'" rx="2" fill="#8a5a1c"/>';
    if(rows.length<=22||i%Math.ceil(rows.length/22)===0)s+='<text x="'+(x+w/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(r.lab)+'</text>';
    s+='</g>';});
  return s+'</svg>';
}
function hbars(obj,names){
  var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}),mx=ks.length?obj[ks[0]]:1,h='<div class="hb">';
  ks.forEach(function(k){h+='<div><span>'+esc(names[k]||k)+'</span><i style="width:'+Math.max(4,Math.round(obj[k]/mx*320))+'px"></i><b>'+obj[k]+'</b></div>';});
  return h+(ks.length?'':'<span class="meta">אין</span>')+'</div>';
}

/* invented data, to see the page before there is a real week of it */
function demo(){
  var tn=dnum(appToday()),out={},rnd=(function(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};})(7);
  var AR=['nutrition','fitness','endofday','people','planning','closet','hobbies','insights'],LS=['he','he','he','en','de','he','en','he','he','de'];
  for(var u=0;u<10;u++){var id='',start=tn-25+u*2,keen=.35+rnd()*.6;for(var c=0;c<24;c++)id+='0123456789abcdef'[Math.floor(rnd()*16)];
    for(var d=start;d<=tn;d++){var age=d-start,p=keen*Math.pow(.97,age);if(age&&rnd()>p+.15)continue;
      var day=dstr(d);(out[day]=out[day]||{})[id]={o:1+Math.floor(rnd()*5),s:rnd()<p,a:AR.filter(function(){return rnd()<.35;}),l:LS[u],f:dstr(start),d:false};}}
  return Object.keys(out).map(function(d){return {day:d,ids:out[d]};});
}
if(/[?&]demo/.test(location.search))load();
</script>
</body>
</html>
