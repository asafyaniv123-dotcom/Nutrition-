<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תזונה">
<title>מעקב תזונה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#fbf7f2;font-family:-apple-system,sans-serif;color:#4a4340;direction:rtl;min-height:100vh}
button,input{font-family:inherit}
#header{background:linear-gradient(135deg,#f0eafa,#eaf5ee);padding:16px 14px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(200,180,160,.1)}
.drow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dbtn{background:rgba(255,255,255,.8);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:20px;color:#4a4340;display:flex;align-items:center;justify-content:center}
.dlbl{text-align:center}
.dlbl-today{font-size:9px;color:#a690cf;letter-spacing:.12em;margin-bottom:2px}
.dlbl-date{font-size:15px;font-weight:700}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.5);border-radius:12px;padding:4px}
.tab{flex:1;padding:7px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s}
.tab.on{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff}
.tab:not(.on){background:transparent;color:#a89e97}
#content{padding:12px 12px 80px;max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:20px;padding:16px 14px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12)}
.cttl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700;margin-bottom:12px;text-align:center}
/* MACRO BARS - bigger */
.mcols{display:flex;justify-content:space-around;gap:6px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.mpct{font-size:9px;font-weight:700}
.mtr{width:34px;height:110px;background:#f2ede6;border-radius:17px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.mfi{width:100%;border-radius:17px;transition:height 0.6s cubic-bezier(.4,0,.2,1)}
.f0{background:linear-gradient(180deg,#c9bce0,#a690cf)}
.f1{background:linear-gradient(180deg,#f3b9a8,#e08a72)}
.f2{background:linear-gradient(180deg,#bfe0c7,#8fc79e)}
.f3{background:linear-gradient(180deg,#f6dfa0,#e8c162)}
.mval{font-size:11px;font-weight:700;color:#4a4340}
.mlbl{font-size:9px;color:#a89e97;margin-top:-2px}
/* PILLS */
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
.pill{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 4px 12px rgba(200,180,160,.1)}
.pv{font-size:17px;font-weight:700}
.pl{font-size:9px;color:#a89e97;margin-top:2px}
/* WATER */
.wcard{background:linear-gradient(135deg,#e8f4fd,#d6eaf8);border-radius:20px;padding:13px 14px;margin-bottom:11px}
.whd{display:flex;justify-content:space-between;margin-bottom:7px}
.wt{font-size:12px;font-weight:700;color:#5b8fa8}
.wn{font-size:12px;font-weight:700;color:#3a7ca5}
.wb{background:rgba(255,255,255,.5);border-radius:4px;height:8px;overflow:hidden;margin-bottom:9px}
.wf{height:100%;background:linear-gradient(90deg,#74b9e8,#3a7ca5);border-radius:4px;transition:width 0.7s cubic-bezier(.4,0,.2,1)}
.wbtns{display:flex;gap:5px}
.wadd{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:9px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;color:#3a7ca5}
.wreset{background:rgba(255,255,255,.5);border:none;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;color:#a89e97}
/* QUICK ADD */
.qacard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.qatog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.qalbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.qaarro{font-size:14px;color:#a89e97;transition:transform .2s}
.qalist{padding:0 10px 12px}
.qbtn{width:100%;display:flex;align-items:center;gap:10px;background:#fbf7f2;border:none;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;margin-bottom:6px;transition:background .15s}
.qbtn:active{background:#f0eafa}
.qemj{font-size:20px;flex-shrink:0}
.qnm{font-size:12.5px;font-weight:700;color:#4a4340}
.qds{font-size:10px;color:#a89e97;margin-top:1px}
.qkc{font-size:10px;font-weight:700;color:#a89e97;flex-shrink:0;text-align:left;line-height:1.3}
/* CONFIRM CARD */
.confirm-card{background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:14px;margin:0 10px 10px;border:2px solid #c9bce0}
.confirm-name{font-size:14px;font-weight:700;color:#4a4340;margin-bottom:4px}
.confirm-mac{font-size:11px;color:#a89e97;margin-bottom:12px}
.confirm-btns{display:flex;gap:8px}
.confirm-yes{flex:1;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.confirm-no{flex:1;background:rgba(255,255,255,.8);border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97}
/* SEARCH */
.srcard{background:#fff;border-radius:20px;margin-bottom:11px;box-shadow:0 4px 16px rgba(200,180,160,.12);overflow:hidden}
.srtog{width:100%;background:none;border:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.srlbl{font-size:10px;color:#a89e97;letter-spacing:.1em;font-weight:700}
.srarro{font-size:14px;color:#a89e97;transition:transform .2s}
.srbody{padding:0 10px 12px}
.srow{display:flex;gap:7px;margin-bottom:10px}
.srinp{flex:1;border:1.5px solid #f2ede6;border-radius:9px;padding:9px 11px;font-size:13px;direction:rtl;outline:none}
.srinp:focus{border-color:#a690cf}
.srbtn{background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
#srlist{margin-bottom:8px}
.sres{background:#fbf7f2;border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
.sres:active{border-color:#a690cf;background:#f0eafa}
.srname{font-size:13px;font-weight:700;color:#4a4340;margin-bottom:2px}
.srmac{font-size:10px;color:#a89e97}
.spick{font-size:13px;font-weight:700;color:#4a4340;margin-bottom:8px;padding:8px 12px;background:#f0eafa;border-radius:10px}
.sgrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sgnm{width:80px;border:1.5px solid #f2ede6;border-radius:8px;padding:7px;font-size:13px;text-align:center;outline:none}
/* MANUAL */
.mtbtn{width:100%;border:none;border-radius:16px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:4px}
.mtbtn.cl{background:#fff;color:#a690cf;box-shadow:0 4px 14px rgba(200,180,160,.1)}
.mtbtn.op{background:linear-gradient(135deg,#c9bce0,#a690cf);color:#fff;border-radius:16px 16px 0 0}
.mtform{background:#fff;border-radius:0 0 16px 16px;padding:13px;box-shadow:0 6px 14px rgba(200,180,160,.1);margin-bottom:7px}
.mtin{width:100%;border:1.5px solid #f2ede6;border-radius:9px;padding:9px 11px;font-size:13px;direction:rtl;outline:none;margin-bottom:9px}
.mtgr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.mtfl{font-size:9px;font-weight:700;margin-bottom:3px}
.mtnm{width:100%;border:1.5px solid #f2ede6;border-radius:7px;padding:6px 5px;font-size:13px;text-align:center;outline:none}
.addbtn{width:100%;background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
/* LOG */
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f2ede6}
.mn{font-size:13px;font-weight:700;color:#4a4340}
.ms{font-size:10.5px;color:#a89e97;margin-top:2px}
.mdl{background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:16px;padding:3px 7px;flex-shrink:0}
.ltot{display:flex;justify-content:space-between;margin-top:9px;padding-top:7px;border-top:2px solid #f2ede6}
/* HISTORY - bigger bars */
.hbrs{display:flex;gap:4px;align-items:flex-end;position:relative}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hbar{width:100%;border-radius:5px 5px 0 0;min-height:3px;transition:height .5s ease}
.hdt{font-size:8px;color:#a89e97;margin-top:5px;font-weight:700}
.hvl{font-size:8.5px;color:#a89e97;margin-bottom:3px;font-weight:700}
.tln{position:absolute;left:0;right:0;border-top:2px dashed #a690cf;pointer-events:none}
.tlb{font-size:8px;color:#a690cf;position:absolute;right:0;top:-12px;font-weight:700}
.avgbox{background:linear-gradient(135deg,#eef5ee,#f0eafa);border-radius:18px;padding:14px 16px}
.avgin{display:flex;justify-content:space-around}
.avgv{font-size:22px;font-weight:700}
.avgl{font-size:9.5px;color:#a89e97;margin-top:2px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#4a4340;color:#fff;font-size:13px;font-weight:700;padding:9px 18px;border-radius:18px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="toast"></div>
<div id="header">
  <div class="drow">
    <button class="dbtn" id="btnPrev">&#8249;</button>
    <div class="dlbl">
      <div class="dlbl-today" id="todayLbl"></div>
      <div class="dlbl-date" id="dateLbl"></div>
    </div>
    <button class="dbtn" id="btnNext">&#8250;</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabToday">יומי</button>
    <button class="tab" id="tabHist">היסטוריה</button>
  </div>
</div>
<div id="content"></div>

<script>
var TARGETS={kcal:1975,p:155,c:200,f:60,water:3000};
var PRESETS=[
  {idx:0,emoji:'\u{1F373}',name:'\u05D0\u05E8\u05D5\u05D7\u05EA \u05D1\u05D5\u05E7\u05E8 \u05E8\u05D2\u05D9\u05DC\u05D4',desc:'2 \u05D1\u05D9\u05E6\u05D9\u05DD + \u05DC\u05D7\u05DD + \u05E8\u05D9\u05E7\u05D5\u05D8\u05D4 + \u05D9\u05E8\u05E7\u05D5\u05EA',kcal:304,p:18.5,c:29,f:12},
  {idx:1,emoji:'\u{1F357}',name:'\u05DE\u05E0\u05EA \u05E2\u05D5\u05E3-\u05D0\u05D5\u05E8\u05D6',desc:'150\u05D2 \u05E2\u05D5\u05E3 + 150\u05D2 \u05D0\u05D5\u05E8\u05D6/\u05D0\u05E4\u05D5\u05E0\u05D4/\u05D2\u05D6\u05E8',kcal:321,p:39,c:33,f:3.5},
  {idx:2,emoji:'\u{1F41F}',name:'\u05E4\u05D7\u05D9\u05EA \u05D8\u05D5\u05E0\u05D4',desc:'\u05D8\u05D5\u05E0\u05D4 \u05D1\u05DE\u05D9\u05DD',kcal:90,p:24,c:0,f:1},
  {idx:3,emoji:'\u{1F964}',name:'\u05E9\u05D9\u05D9\u05E7 \u05E4\u05E8\u05D5\u05DE\u05E7\u05E1',desc:'Herbalife Promax',kcal:190,p:25,c:18,f:1.5},
  {idx:4,emoji:'\u2615',name:'PRO \u05D9\u05D8\u05D1\u05EA\u05D4',desc:'350\u05DE\u05DC \u05E7\u05E4\u05D4/\u05E9\u05D5\u05E7\u05D5\u05DC\u05D3',kcal:135,p:25,c:8.5,f:0.75}
];

var curDate=todayStr(),curTab='today',qaOpen=true,manOpen=false,srOpen=false;
var pendingPreset=null,pendingFood=null,toastTimer;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function pct(v,m){ return Math.min(100,Math.round(v/m*100)); }
function fmtTime(){ return new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(s){
  var d=new Date(s+'T12:00:00');
  var days=['\u05E8\u05D0\u05E9\u05D5\u05DF','\u05E9\u05E0\u05D9','\u05E9\u05DC\u05D9\u05E9\u05D9','\u05E8\u05D1\u05D9\u05E2\u05D9','\u05D7\u05DE\u05D9\u05E9\u05D9','\u05E9\u05D9\u05E9\u05D9','\u05E9\u05D1\u05EA'];
  var mos=['\u05D9\u05E0\u05D5\u05D0\u05E8','\u05E4\u05D1\u05E8\u05D5\u05D0\u05E8','\u05DE\u05E8\u05E5','\u05D0\u05E4\u05E8\u05D9\u05DC','\u05DE\u05D0\u05D9','\u05D9\u05D5\u05E0\u05D9','\u05D9\u05D5\u05DC\u05D9','\u05D0\u05D5\u05D2\u05D5\u05E1\u05D8','\u05E1\u05E4\u05D8\u05DE\u05D1\u05E8','\u05D0\u05D5\u05E7\u05D8\u05D5\u05D1\u05E8','\u05E0\u05D5\u05D1\u05DE\u05D1\u05E8','\u05D3\u05E6\u05DE\u05D1\u05E8'];
  return days[d.getDay()]+', '+d.getDate()+' \u05D1'+mos[d.getMonth()];
}
function sk(d){ return 'nutri_'+d; }
function loadDay(d){ try{ var x=localStorage.getItem(sk(d)); return x?JSON.parse(x):{meals:[],water:0}; }catch(e){ return {meals:[],water:0}; } }
function saveDay(d,data){ try{ localStorage.setItem(sk(d),JSON.stringify(data)); }catch(e){} }
function showToast(msg){ var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('on'); },1700); }

function goDay(delta){
  var d=new Date(curDate+'T12:00:00'); d.setDate(d.getDate()+delta);
  var next=d.toISOString().slice(0,10);
  if(next<=todayStr()){ curDate=next; render(); }
}
function setTab(t){
  curTab=t;
  document.getElementById('tabToday').className='tab'+(t==='today'?' on':'');
  document.getElementById('tabHist').className='tab'+(t==='history'?' on':'');
  render();
}

// Preset with confirmation
function selectPreset(idx){
  pendingPreset=idx; render();
  setTimeout(function(){
    var el=document.getElementById('confirm-card');
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}
function confirmPreset(){
  if(pendingPreset===null) return;
  var m=PRESETS[pendingPreset]; var day=loadDay(curDate);
  day.meals.push({name:m.name,kcal:m.kcal,p:m.p,c:m.c,f:m.f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day); showToast('\u2713 '+m.name+' \u05E0\u05D5\u05E1\u05E3');
  pendingPreset=null; render();
}
function cancelPreset(){ pendingPreset=null; render(); }

function removeMeal(id){ var day=loadDay(curDate); day.meals=day.meals.filter(function(m){ return m.id!==id; }); saveDay(curDate,day); render(); }
function addWater(ml){ var day=loadDay(curDate); day.water=Math.min((day.water||0)+ml,6000); saveDay(curDate,day); animateWater(); }
function resetWater(){ var day=loadDay(curDate); day.water=0; saveDay(curDate,day); animateWater(); }

function animateWater(){
  var day=loadDay(curDate); var water=day.water||0;
  var wp=pct(water,TARGETS.water);
  var wf=document.querySelector('.wf');
  var wn=document.getElementById('wn');
  if(wf) wf.style.width=wp+'%';
  if(wn) wn.textContent=water+' / '+TARGETS.water+' \u05DE"\u05DC';
}

function toggleQA(){ qaOpen=!qaOpen; pendingPreset=null; render(); }
function toggleMan(){ manOpen=!manOpen; render(); }
function toggleSR(){ srOpen=!srOpen; pendingFood=null; render(); }

function doSearch(){
  var inp=document.getElementById('srinp'); if(!inp) return;
  var q=inp.value.trim(); if(!q) return;
  var list=document.getElementById('srlist');
  if(list) list.innerHTML='<div style="font-size:12px;color:#a89e97;padding:8px">\u05DE\u05D7\u05E4\u05E9...</div>';
  fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&action=process&json=1&page_size=10&fields=product_name,product_name_he,nutriments')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var prods=(data.products||[]).filter(function(p){ return p.nutriments&&p.nutriments['energy-kcal_100g']>0; }).slice(0,7);
      var list2=document.getElementById('srlist'); if(!list2) return;
      if(!prods.length){ list2.innerHTML='<div style="font-size:12px;color:#a89e97;padding:8px">\u05DC\u05D0 \u05E0\u05DE\u05E6\u05D0\u05D5. \u05E0\u05E1\u05D4 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA.</div>'; return; }
      var html=''; window._srfoods=prods;
      prods.forEach(function(p,i){
        var nm=p.product_name_he||p.product_name||'\u05DE\u05D5\u05E6\u05E8';
        nm=nm.length>40?nm.slice(0,40)+'...':nm;
        var kc=Math.round(p.nutriments['energy-kcal_100g']||0);
        var pr=Math.round(p.nutriments.proteins_100g||0);
        var cb=Math.round(p.nutriments.carbohydrates_100g||0);
        var ft=Math.round(p.nutriments.fat_100g||0);
        html+='<div class="sres" onclick="selectFood('+i+','+kc+','+pr+','+cb+','+ft+')"><div class="srname">'+nm+'</div><div class="srmac">'+kc+' \u05E7\u05E7&quot;\u05DC/100\u05D2 &middot; '+pr+'\u05D7 '+cb+'\u05E4 '+ft+'\u05E9</div></div>';
      });
      list2.innerHTML=html;
    })
    .catch(function(){ var l=document.getElementById('srlist'); if(l) l.innerHTML='<div style="font-size:12px;color:#e08a72;padding:8px">\u05E9\u05D2\u05D9\u05D0\u05D4. \u05D1\u05D3\u05D5\u05E7 \u05D7\u05D9\u05D1\u05D5\u05E8 \u05DC\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8.</div>'; });
}
function selectFood(i,kc,pr,cb,ft){
  var prods=window._srfoods||[];
  var nm=prods[i]?(prods[i].product_name_he||prods[i].product_name||'\u05DE\u05D6\u05D5\u05DF'):'\u05DE\u05D6\u05D5\u05DF';
  nm=nm.length>40?nm.slice(0,40)+'...':nm;
  pendingFood={name:nm,kc:kc,pr:pr,cb:cb,ft:ft};
  var sel=document.getElementById('sselected'); if(!sel) return;
  sel.innerHTML='<div class="spick">'+nm+'</div><div class="sgrow"><input id="sg" class="sgnm" type="number" value="100" min="1"><span style="font-size:12px;color:#a89e97">\u05D2\u05E8\u05DD</span></div><button class="addbtn" onclick="addSearchFood()">\u05D4\u05D5\u05E1\u05E3</button>';
  sel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function addSearchFood(){
  if(!pendingFood) return;
  var g=parseFloat(document.getElementById('sg').value)||100; var m=g/100;
  var day=loadDay(curDate);
  day.meals.push({name:pendingFood.name+' ('+g+'\u05D2)',kcal:Math.round(pendingFood.kc*m),p:Math.round(pendingFood.pr*m*10)/10,c:Math.round(pendingFood.cb*m*10)/10,f:Math.round(pendingFood.ft*m*10)/10,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day); pendingFood=null; showToast('\u2713 \u05E0\u05D5\u05E1\u05E3!'); render();
}
function addManual(){
  var name=document.getElementById('mn')?document.getElementById('mn').value.trim():'';
  var kcal=document.getElementById('mk')?parseFloat(document.getElementById('mk').value)||0:0;
  if(!name||!kcal){ alert('\u05E0\u05D0 \u05DC\u05DE\u05DC\u05D0 \u05E9\u05DD \u05D5\u05E7\u05DC\u05D5\u05E8\u05D9\u05D5\u05EA'); return; }
  var p=parseFloat(document.getElementById('mp').value)||0;
  var c=parseFloat(document.getElementById('mc').value)||0;
  var f=parseFloat(document.getElementById('mf').value)||0;
  var day=loadDay(curDate);
  day.meals.push({name:name,kcal:kcal,p:p,c:c,f:f,id:Date.now(),time:fmtTime()});
  saveDay(curDate,day); manOpen=false; render();
}

function animateBars(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.querySelectorAll('.mfi[data-h]').forEach(function(el){
        el.style.height=el.getAttribute('data-h')+'%';
      });
    });
  });
}

function renderToday(){
  var day=loadDay(curDate); var meals=day.meals||[]; var water=day.water||0;
  var tot={kcal:0,p:0,c:0,f:0};
  meals.forEach(function(m){ tot.kcal+=m.kcal||0; tot.p+=m.p||0; tot.c+=m.c||0; tot.f+=m.f||0; });

  var bars=[
    {v:Math.round(tot.kcal),t:TARGETS.kcal,l:'\u05E7\u05E7"\u05DC',cls:'f0',col:'#a690cf'},
    {v:Math.round(tot.p),t:TARGETS.p,l:'\u05D7\u05DC\u05D1\u05D5\u05DF',cls:'f1',col:'#e08a72'},
    {v:Math.round(tot.c),t:TARGETS.c,l:'\u05E4\u05D7\u05DE\u05D9\u05DE\u05D4',cls:'f2',col:'#8fc79e'},
    {v:Math.round(tot.f),t:TARGETS.f,l:'\u05E9\u05D5\u05DE\u05DF',cls:'f3',col:'#e8c162'}
  ];
  var macroHTML='<div class="card"><div class="cttl">\u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA \u05DE\u05D5\u05DC \u05D4\u05D9\u05E2\u05D3</div><div class="mcols">';
  bars.forEach(function(b){
    var p2=pct(b.v,b.t);
    macroHTML+='<div class="mcol"><div class="mpct" style="color:'+(p2>=100?b.col:'#a89e97')+'">'+p2+'%</div>';
    macroHTML+='<div class="mtr"><div class="mfi '+b.cls+'" style="height:0" data-h="'+p2+'"></div></div>';
    macroHTML+='<div class="mval">'+b.v+'</div><div class="mlbl">'+b.l+'</div></div>';
  });
  macroHTML+='</div></div>';

  var pillsHTML='<div class="pills">'+
    '<div class="pill"><div class="pv" style="color:#a690cf">'+Math.max(0,Math.round(TARGETS.kcal-tot.kcal))+'</div><div class="pl">\u05E7\u05E7&quot;\u05DC \u05E0\u05D5\u05EA\u05E8\u05D5</div></div>'+
    '<div class="pill"><div class="pv" style="color:#e08a72">'+Math.max(0,Math.round(TARGETS.p-tot.p))+'g</div><div class="pl">\u05D7\u05DC\u05D1\u05D5\u05DF \u05E0\u05D5\u05EA\u05E8</div></div>'+
    '<div class="pill"><div class="pv" style="color:#e8c162">'+Math.max(0,Math.round(TARGETS.f-tot.f))+'g</div><div class="pl">\u05E9\u05D5\u05DE\u05DF \u05E0\u05D5\u05EA\u05E8</div></div></div>';

  var wp=pct(water,TARGETS.water);
  var waterHTML='<div class="wcard"><div class="whd"><span class="wt">\u{1F4A7} \u05DE\u05D9\u05DD</span><span class="wn" id="wn">'+water+' / '+TARGETS.water+' \u05DE&quot;\u05DC</span></div>'+
    '<div class="wb"><div class="wf" style="width:0" data-w="'+wp+'"></div></div>'+
    '<div class="wbtns"><button class="wadd" onclick="addWater(250)">+250\u05DE&quot;\u05DC</button><button class="wadd" onclick="addWater(500)">+500\u05DE&quot;\u05DC</button><button class="wadd" onclick="addWater(1000)">+1L</button><button class="wreset" onclick="resetWater()">\u21BA</button></div></div>';

  // Quick add with confirmation
  var qaHTML='<div class="qacard"><button class="qatog" onclick="toggleQA()"><span class="qalbl">\u05D4\u05D5\u05E1\u05E4\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4</span><span class="qaarro" style="transform:'+(qaOpen?'rotate(180deg)':'rotate(0)')+'">&#8963;</span></button>';
  if(qaOpen){
    qaHTML+='<div class="qalist">';
    PRESETS.forEach(function(m){
      var isSelected=pendingPreset===m.idx;
      qaHTML+='<button class="qbtn" style="'+(isSelected?'border:2px solid #a690cf;':'')+'\" onclick="selectPreset('+m.idx+')"><span class="qemj">'+m.emoji+'</span><div><div class="qnm">'+m.name+'</div><div class="qds">'+m.desc+'</div></div><div class="qkc">'+m.kcal+'<br><span style="font-size:9px">\u05E7\u05E7&quot;\u05DC</span></div></button>';
    });
    if(pendingPreset!==null){
      var pm=PRESETS[pendingPreset];
      qaHTML+='<div class="confirm-card" id="confirm-card"><div class="confirm-name">'+pm.emoji+' '+pm.name+'</div><div class="confirm-mac">'+pm.kcal+' \u05E7\u05E7&quot;\u05DC &middot; '+pm.p+'\u05D2 \u05D7\u05DC\u05D1\u05D5\u05DF &middot; '+pm.c+'\u05D2 \u05E4\u05D7\u05DE\u05D9\u05DE\u05D4 &middot; '+pm.f+'\u05D2 \u05E9\u05D5\u05DE\u05DF</div>';
      qaHTML+='<div class="confirm-btns"><button class="confirm-yes" onclick="confirmPreset()">\u05D4\u05D5\u05E1\u05E3 \u2713</button><button class="confirm-no" onclick="cancelPreset()">\u05D1\u05D9\u05D8\u05D5\u05DC</button></div></div>';
    }
    qaHTML+='</div>';
  }
  qaHTML+='</div>';

  var srHTML='<div class="srcard"><button class="srtog" onclick="toggleSR()"><span class="srlbl">\u{1F50D} \u05D7\u05D9\u05E4\u05D5\u05E9 \u05DE\u05D6\u05D5\u05DF</span><span class="srarro" style="transform:'+(srOpen?'rotate(180deg)':'rotate(0)')+'">&#8963;</span></button>';
  if(srOpen){
    srHTML+='<div class="srbody"><div class="srow"><input id="srinp" class="srinp" placeholder="\u05E9\u05DD \u05DE\u05D0\u05DB\u05DC (English)" onkeypress="if(event.key===\'Enter\')doSearch()"><button class="srbtn" onclick="doSearch()">\u05D7\u05E4\u05E9</button></div><div id="srlist"></div><div id="sselected"></div></div>';
  }
  srHTML+='</div>';

  var manHTML='<button class="mtbtn '+(manOpen?'op':'cl')+'" onclick="toggleMan()">'+(manOpen?'\u2715  \u05E1\u05D2\u05D5\u05E8':'+ \u05D4\u05D5\u05E1\u05E4\u05D4 \u05D9\u05D3\u05E0\u05D9\u05EA')+'</button>';
  if(manOpen){
    manHTML+='<div class="mtform"><input id="mn" class="mtin" placeholder="\u05E9\u05DD \u05D4\u05D0\u05E8\u05D5\u05D7\u05D4"><div class="mtgr">'+
      '<div><div class="mtfl" style="color:#a690cf">\u05E7\u05E7&quot;\u05DC</div><input id="mk" class="mtnm" type="number" placeholder="0"></div>'+
      '<div><div class="mtfl" style="color:#e08a72">\u05D7\u05DC\u05D1\u05D5\u05DF</div><input id="mp" class="mtnm" type="number" placeholder="0"></div>'+
      '<div><div class="mtfl" style="color:#8fc79e">\u05E4\u05D7\u05DE\u05D9\u05DE\u05D4</div><input id="mc" class="mtnm" type="number" placeholder="0"></div>'+
      '<div><div class="mtfl" style="color:#e8c162">\u05E9\u05D5\u05DE\u05DF</div><input id="mf" class="mtnm" type="number" placeholder="0"></div>'+
      '</div><button class="addbtn" onclick="addManual()">\u05D4\u05D5\u05E1\u05E3 \u2713</button></div>';
  }

  var logHTML='';
  if(meals.length>0){
    var tot2={kcal:0,p:0,c:0,f:0};
    meals.forEach(function(m){ tot2.kcal+=m.kcal; tot2.p+=m.p; tot2.c+=m.c; tot2.f+=m.f; });
    logHTML='<div class="card"><div class="cttl">\u05D0\u05E8\u05D5\u05D7\u05D5\u05EA \u05D4\u05D9\u05D5\u05DD</div>';
    meals.forEach(function(m){
      logHTML+='<div class="mrow"><div style="flex:1"><div class="mn">'+m.name+'</div><div class="ms">'+Math.round(m.kcal)+' \u05E7\u05E7&quot;\u05DC &middot; '+Math.round(m.p)+'\u05D7/'+Math.round(m.c)+'\u05E4/'+Math.round(m.f)+'\u05E9'+(m.time?' &middot; '+m.time:'')+'</div></div>'+
        '<button class="mdl" onclick="removeMeal('+m.id+')">&times;</button></div>';
    });
    logHTML+='<div class="ltot"><span style="font-size:13px;font-weight:700">\u05E1\u05D4&quot;\u05DB</span><span style="font-size:11px;color:#a89e97">'+Math.round(tot2.kcal)+' \u05E7\u05E7&quot;\u05DC &middot; '+Math.round(tot2.p)+'\u05D7/'+Math.round(tot2.c)+'\u05E4/'+Math.round(tot2.f)+'\u05E9</span></div></div>';
  }

  document.getElementById('content').innerHTML=macroHTML+pillsHTML+waterHTML+qaHTML+srHTML+manHTML+logHTML;
  animateBars();
  // Animate water bar
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var wf=document.querySelector('.wf[data-w]');
      if(wf) wf.style.width=wf.getAttribute('data-w')+'%';
    });
  });
}

function renderHistory(){
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var s=d.toISOString().slice(0,10);
    var day=loadDay(s);
    var kcal=Math.round(day.meals.reduce(function(a,m){ return a+(m.kcal||0); },0));
    var p=Math.round(day.meals.reduce(function(a,m){ return a+(m.p||0); },0));
    days.push({date:s,kcal:kcal,p:p});
  }
  var active=days.filter(function(d){ return d.kcal>0; });
  var maxK=Math.max.apply(null,days.map(function(d){ return d.kcal; }).concat([TARGETS.kcal+300]));

  // Bigger kcal chart (160px)
  var k1='<div class="card"><div class="cttl">\u05E7\u05DC\u05D5\u05E8\u05D9\u05D5\u05EA \u2014 7 \u05D9\u05DE\u05D9\u05DD \u05D0\u05D7\u05E8\u05D5\u05E0\u05D9\u05DD</div><div class="hbrs" style="height:160px">';
  k1+='<div class="tln" style="bottom:'+(TARGETS.kcal/maxK*100)+'%"><span class="tlb">\u05D9\u05E2\u05D3</span></div>';
  days.forEach(function(d){
    var h=d.kcal>0?(d.kcal/maxK*100)+'%':'3px';
    var isT=d.date===todayStr();
    var bg=d.kcal===0?'#f2ede6':d.kcal>TARGETS.kcal?'linear-gradient(180deg,#f3b9a8,#e08a72)':'linear-gradient(180deg,#c9bce0,#a690cf)';
    var dt=new Date(d.date+'T12:00:00');
    k1+='<div class="hcol"><div class="hvl">'+(d.kcal>0?d.kcal:'')+'</div><div class="hbar" style="height:'+h+';background:'+bg+';'+(isT?'outline:2px solid #a690cf':'')+'"></div><div class="hdt" style="color:'+(isT?'#a690cf':'#a89e97')+'">'+dt.getDate()+'/'+(dt.getMonth()+1)+'</div></div>';
  });
  k1+='</div></div>';

  // Bigger protein chart (110px)
  var p1='<div class="card"><div class="cttl">\u05D7\u05DC\u05D1\u05D5\u05DF \u2014 7 \u05D9\u05DE\u05D9\u05DD</div><div class="hbrs" style="height:110px">';
  days.forEach(function(d){
    var h=d.p>0?(d.p/180*100)+'%':'3px';
    var bg=d.p===0?'#f2ede6':d.p>=TARGETS.p?'linear-gradient(180deg,#bfe0c7,#8fc79e)':'linear-gradient(180deg,#f3b9a8,#e08a72)';
    p1+='<div class="hcol"><div class="hbar" style="height:'+h+';background:'+bg+'"></div><div class="hdt">'+(d.p>0?d.p+'g':'&mdash;')+'</div></div>';
  });
  p1+='</div></div>';

  var avg='';
  if(active.length>0){
    var avgK=Math.round(active.reduce(function(a,d){ return a+d.kcal; },0)/active.length);
    var avgP=Math.round(active.reduce(function(a,d){ return a+d.p; },0)/active.length);
    var inT=active.filter(function(d){ return d.kcal<=TARGETS.kcal; }).length;
    avg='<div class="avgbox"><div style="font-size:10px;color:#a89e97;font-weight:700;margin-bottom:10px;letter-spacing:.1em">\u05DE\u05DE\u05D5\u05E6\u05E2\u05D9\u05DD ('+active.length+' \u05D9\u05DE\u05D9\u05DD)</div><div class="avgin">'+
      '<div style="text-align:center"><div class="avgv" style="color:#a690cf">'+avgK+'</div><div class="avgl">\u05E7\u05E7&quot;\u05DC \u05DE\u05DE\u05D5\u05E6\u05E2</div></div>'+
      '<div style="text-align:center"><div class="avgv" style="color:#e08a72">'+avgP+'g</div><div class="avgl">\u05D7\u05DC\u05D1\u05D5\u05DF \u05DE\u05DE\u05D5\u05E6\u05E2</div></div>'+
      '<div style="text-align:center"><div class="avgv" style="color:#8fc79e">'+inT+'/'+active.length+'</div><div class="avgl">\u05D9\u05DE\u05D9\u05DD \u05D1\u05D9\u05E2\u05D3</div></div>'+
      '</div></div>';
  }
  document.getElementById('content').innerHTML=k1+p1+avg;
}

function render(){
  var isToday=curDate===todayStr();
  document.getElementById('todayLbl').textContent=isToday?'\u05D4\u05D9\u05D5\u05DD':'';
  document.getElementById('dateLbl').textContent=fmtDate(curDate);
  document.getElementById('btnNext').style.opacity=isToday?'0.2':'1';
  if(curTab==='today') renderToday();
  else renderHistory();
}

document.getElementById('btnPrev').onclick=function(){ goDay(-1); };
document.getElementById('btnNext').onclick=function(){ goDay(1); };
document.getElementById('tabToday').onclick=function(){ setTab('today'); };
document.getElementById('tabHist').onclick=function(){ setTab('history'); };
render();
</script>
</body>
</html>
