<!doctype html><meta charset="utf-8">
<!-- Renders the Android icon set from the brand's App Store icon
     (brand/app-store-1024.png, Mip on cream, C1): an adaptive foreground
     (432 px, the icon in the middle 72 of 108 dp so the launcher's mask keeps
     all of it), the legacy square and round icons, and the cream it sits on.
     Run through tools/shoot-page.mjs --print; tools/native-android-icons.mjs
     writes the files. -->
<script>
window.__out=new Promise(function(ok){
  var im=new Image();im.onload=function(){
    var c=document.createElement('canvas'),x=c.getContext('2d'),o={};
    c.width=c.height=1;x.drawImage(im,4,4,1,1,0,0,1,1);var p=x.getImageData(0,0,1,1).data;
    o.cream='#'+[p[0],p[1],p[2]].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
    c.width=c.height=432;x.clearRect(0,0,432,432);x.drawImage(im,72,72,288,288);o.fg=c.toDataURL('image/png');
    c.width=c.height=192;x.drawImage(im,0,0,192,192);o.sq=c.toDataURL('image/png');
    x.clearRect(0,0,192,192);x.save();x.beginPath();x.arc(96,96,96,0,Math.PI*2);x.clip();x.drawImage(im,0,0,192,192);x.restore();o.round=c.toDataURL('image/png');
    ok(JSON.stringify(o));
  };im.src='../brand/app-store-1024.png';
});
</script>
