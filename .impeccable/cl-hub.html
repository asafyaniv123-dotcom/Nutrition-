<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הארון — three ways in the soft white</title>
<!--
  The closet in the material already approved for nutrition, home and כושר.
  Rows, categories and buttons are the ones renderCloset draws today; nothing
  here invents a control the screen does not have.

  The one idea all three share: a closet row IS a channel. You roll it until
  the garment you want sits in the middle - which is a trough with a chosen
  thing in it, the same sentence the macro tubes are written in.
  ?v=mirror|shelves|lit
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#e9e7e3;
  --lit:rgba(255,255,255,.95);
  --sh:rgba(176,168,156,.44);
  --shs:rgba(176,168,156,.28);
  --ink:#4a453f; --muted:#7d766d; --amber:#f0a92e;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#fff}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  background:var(--g);font-family:Assistant,system-ui,sans-serif;color:var(--ink)}
.pad{padding:0 14px}
.raise{background:var(--g);box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh)}
.raise-sm{background:var(--g);box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.press{background:var(--g);box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}

.hd{padding:24px 16px 12px}
.hd-t{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1}
.hd-s{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}

/* ── THE COLUMN ── the body, in the order it is worn */
.col{border-radius:24px;padding:12px 10px;margin-bottom:11px}
.row{margin-bottom:9px}
.row:last-child{margin-bottom:0}
.lab{font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--muted);
  margin:0 4px 5px}
/* the strip the garments roll inside */
.strip{display:flex;align-items:center;gap:7px;border-radius:16px;padding:7px;
  overflow:hidden;justify-content:center}
.cell{flex-shrink:0;border-radius:12px;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center}
.cell svg{width:74%;height:74%;fill:none;stroke:#b9b1a7;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
/* the one in the middle is the one you are wearing */
.cell.on svg{stroke:#8d8478}
.cell.off{opacity:.42}

/* the pair: tops over bottoms, with the one-piece beside them */
.pair{display:flex;gap:9px;align-items:stretch}
.pair-main{flex:1;min-width:0}
.dress{display:block;margin:7px auto 0;border:none;border-radius:11px;padding:7px 16px;
  font-family:inherit;font-size:10.5px;font-weight:800;color:var(--muted);cursor:pointer}

/* the jewellery box, which is not part of the body column */
.side{border-radius:20px;padding:10px;margin-bottom:11px}

/* what you have picked, said in words */
.picked{border-radius:18px;padding:11px 14px;margin-bottom:11px;
  font-size:11px;font-weight:700;color:var(--muted);line-height:1.6}
.picked b{color:var(--ink);font-weight:800}

.acts{display:flex;gap:8px;margin-bottom:8px}
.b{flex:1;border:none;border-radius:14px;padding:13px;font-size:12.5px;font-weight:800;
  font-family:inherit;cursor:pointer;color:var(--muted);background:var(--g)}
.b.up{box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.b.go{color:var(--ink)}
.b.go .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);
  margin-inline-end:6px;box-shadow:0 0 9px 2px rgba(240,169,46,.7);vertical-align:middle}
.small{font-size:11px}
.tag{position:absolute;top:9px;left:9px;z-index:4;font-size:9px;font-weight:800;
  letter-spacing:.1em;color:var(--muted);background:var(--g);border-radius:999px;padding:5px 10px;
  box-shadow:-2px -2px 5px var(--lit),2px 3px 6px var(--shs)}

/* ══ A. MIRROR — the whole column pressed in, garments raised out of it ══ */
.v-mirror .col{background:var(--g);box-shadow:inset 3px 4px 9px var(--sh),inset -3px -3px 7px var(--lit)}
.v-mirror .strip{background:none}
.v-mirror .cell{background:var(--g)}
.v-mirror .cell.on{box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}

/* ══ B. SHELVES — every row its own raised shelf ══════════════════════════ */
.v-shelves .col{background:none;box-shadow:none;padding:0}
.v-shelves .row{border-radius:18px;padding:9px 10px 10px;
  background:var(--g);box-shadow:-5px -5px 12px var(--lit),6px 8px 18px var(--shs);
  margin-bottom:10px}
.v-shelves .strip{background:none}
.v-shelves .cell.on{box-shadow:inset 2px 3px 7px var(--sh),inset -2px -2px 5px var(--lit)}

/* ══ C. LIT — every row a pressed channel, the chosen garment lit ═════════ */
.v-lit .col{background:var(--g);box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh)}
.v-lit .strip{box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.v-lit .cell{background:var(--g)}
.v-lit .cell.on{box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shs)}
.v-lit .cell.on::after{content:"";position:absolute;inset-inline:22%;bottom:0;height:2px;
  border-radius:2px;background:var(--amber);
  box-shadow:0 0 12px 2px rgba(240,169,46,.65),0 0 26px 5px rgba(240,169,46,.28)}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
/* one silhouette per category, so a layout comp does not pretend to be
   somebody's photographs */
var G={
 hat:'<path d="M4 17h16"/><path d="M7 17c0-5 2.2-8 5-8s5 3 5 8"/>',
 top:'<path d="M8.5 4 5 6.5l1.6 3.2L8 9v10.5h8V9l1.4.7L19 6.5 15.5 4a3.5 3.5 0 0 1-7 0Z"/>',
 dress:'<path d="M9 4 6.5 6l1.3 2.6L9 8v2.4L5.5 20h13L15 10.4V8l1.2.6L17.5 6 15 4a3 3 0 0 1-6 0Z"/>',
 bottom:'<path d="M7 4h10l1 16h-4l-2-9-2 9H6Z"/>',
 socks:'<path d="M8 4h4v8.5c0 2 1 2.8 2.6 3.6l1.6.8a2.4 2.4 0 0 1-2.2 4.3l-2.6-1.3C9.2 18.6 8 16.6 8 14Z"/>',
 shoes:'<path d="M3.5 17.5h7.2c1.8 0 3.2-1.4 4.6-1.4H20a1.5 1.5 0 0 1 0 3H3.5Z"/><path d="M3.5 17.5V8.8h3l1.8 3.4 2.4 1.4"/>',
 ring:'<circle cx="12" cy="14.5" r="5"/><path d="m9.5 9.5 1.2-3h2.6l1.2 3"/>'
};
var ROWS=[
 {k:'hat',   t:'כובע',     w:46, h:40},
 {k:'top',   t:'חולצות',   w:66, h:70},
 {k:'bottom',t:'מכנסיים',  w:64, h:78},
 {k:'socks', t:'גרביים',   w:42, h:36},
 {k:'shoes', t:'נעליים',   w:56, h:44}
];
function strip(r,n,mid){
  var h='<div class="strip">',i;
  for(i=0;i<n;i++){
    var on=(i===mid);
    h+='<div class="cell'+(on?' on':' off')+'" style="width:'+r.w+'px;height:'+r.h+'px">'+
       '<svg viewBox="0 0 24 24">'+G[r.k]+'</svg></div>';
  }
  return h+'</div>';
}
function row(r,n,mid){
  return '<div class="row"><div class="lab">'+r.t+'</div>'+strip(r,n,mid)+'</div>';
}
var v=(location.search.match(/v=(\w+)/)||[])[1]||'mirror';
var NAMES={mirror:'A · המראה',shelves:'B · מדפים',lit:'C · אור'};

var h='<div class="tag">'+NAMES[v]+'</div>';
h+='<div class="hd"><div class="hd-t">הארון שלי</div>'+
   '<div class="hd-s">יום שלישי, 22 בספטמבר</div></div>';
h+='<div class="pad"><div class="col v-in">';
h+=row(ROWS[0],3,1);
h+=row(ROWS[1],3,1);
h+=row(ROWS[2],3,1);
h+='<button class="dress raise-sm">שמלה (4)</button>';
h+=row(ROWS[3],3,1);
h+=row(ROWS[4],3,1);
h+='</div>';
h+='<div class="side press"><div class="lab">תכשיטים</div>'+
   strip({k:'ring',w:40,h:38},4,1)+'</div>';
h+='<div class="picked press">היום: <b>חולצה לבנה</b> · <b>ג’ינס כהה</b> · <b>סניקרס</b></div>';
h+='<div class="acts"><button class="b up">&#127922; גלגל הכל</button>'+
   '<button class="b up go">שמור לוק</button></div>';
h+='<div class="acts"><button class="b up small go"><span class="dot"></span>לבשתי את זה היום</button>'+
   '<button class="b up small">הלוקים שלי (7)</button></div>';
h+='</div>';
document.getElementById('frame').innerHTML=h;
document.querySelector('.frame').className='frame v-'+v;
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
