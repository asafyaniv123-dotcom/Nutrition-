<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תחביבים — soft white</title>
<!--
  Rebuilt after MEASURING the shipped כושר and תזונה screens instead of
  remembering them. The material was never the problem - these shadow values
  are byte-for-byte what dev/index.html computes:

    raised     -6px -6px 15px rgba(255,255,255,.95), 8px 10px 22px rgba(176,168,156,.44)   r26
    raised sm  -4px -4px 9px  rgba(255,255,255,.95), 5px 6px 13px rgba(176,168,156,.28)    r16
    pressed    inset 3px 4px 8px rgba(176,168,156,.44), inset -3px -3px 7px rgba(255,255,255,.95)  r20-22
    ground     #e9e7e3

  What was wrong was the COMPOSITION. Four rules read off the כושר screen:

    1 AMBER IS A DOT. On the week strip it is one small glowing dot under
      today's letter. It is never a bar, never a stripe, never a fill. The
      previous draft put an amber stripe on the slab and then an amber heat
      map - that alone made it a different app.
    2 ICONS ARE SMALL LINE DRAWINGS IN A SOFT COLOUR, each in its own raised
      rounded square. Never emoji. Colour lives here and nowhere else, which
      is also what tells two hobbies apart.
    3 A SECTION LABEL SITS UNDER ITS STRIP, small, grey, right-aligned.
      "השבוע" is under the week, not over it.
    4 A CARD IS caption / HUGE BOLD TITLE / small grey line, right-aligned,
      with the icon on the far side.

  ?v=hub|deep
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#e9e7e3;
  --lit:rgba(255,255,255,.95);
  --sh:rgba(176,168,156,.44);
  --shs:rgba(176,168,156,.28);
  --ink:#4a453f; --muted:#7d766d; --amber:#f0a92e;
  --vio-100:#ece9fa; --vio-500:#8b84d8;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#fff}
.frame{position:absolute;left:0;top:0;width:480px;height:940px;overflow:hidden;
  font-family:Assistant,system-ui,sans-serif;color:var(--ink);background:var(--g);
  padding:0 0 24px}
.raise{background:var(--g);box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh)}
.raise-sm{background:var(--g);box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.press{background:var(--g);box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}

/* ── HEADER ── the בית pill above, the title under it, both right-aligned ── */
.hdr{padding:16px 18px 18px}
.home{display:inline-flex;align-items:center;gap:5px;float:left;
  background:var(--vio-100);color:var(--vio-500);font-size:12px;font-weight:700;
  border-radius:999px;padding:6px 13px}
.t{clear:both;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1;
  padding-top:22px}
.pad{padding:0 14px}
/* a label belongs UNDER the thing it names */
.lab{font-size:11.5px;font-weight:600;color:var(--muted);margin:9px 6px 20px}
.gap{height:20px}

/* ── THE HOBBIES ── the week strip's shape, one square per hobby ── */
.strip{display:flex;gap:9px}
.d{flex:1;min-width:0;border:none;cursor:pointer;font-family:inherit;background:var(--g);
  border-radius:18px;padding:13px 4px 11px;text-align:center;
  box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.d-ic{display:flex;align-items:center;justify-content:center;height:22px;margin-bottom:7px}
.d-ic svg{width:21px;height:21px;display:block}
.d-n{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
/* the dot. Grey when the hobby is idle; amber and lit when it is today's. */
.d-dot{display:block;width:7px;height:7px;border-radius:50%;margin:8px auto 0;
  background:#cdc7bf}
.d.on{box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--sh)}
.d.on .d-n{color:var(--ink);font-weight:800}
.d.on .d-dot{background:var(--amber);
  box-shadow:0 0 8px 2px rgba(240,169,46,.65),0 0 16px 5px rgba(240,169,46,.22)}

/* ── THE CARD ── caption / huge title / grey line, icon on the far side ── */
/* every child is display:block - they are spans, and inline laid the caption,
   the clock and the sub-line on one row, straight through the icon. */
/* LOGICAL properties, both of them. The first version mixed inset-inline-start
   with padding-left, so in RTL the icon went right and the reserved space went
   left - the clock and the icon landed on top of each other. */
.card{position:relative;display:block;width:100%;border:none;cursor:pointer;
  font-family:inherit;text-align:start;border-radius:26px;
  padding:22px 20px 20px;padding-inline-end:96px;margin-bottom:0}
.c-cap{display:flex;align-items:center;gap:7px;justify-content:flex-start;
  font-size:12px;font-weight:700;color:var(--muted)}
.c-cap .live{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 8px 2px rgba(240,169,46,.65)}
/* text-align:right, spelled out. unicode-bidi:plaintext takes its direction
   from the first strong character, and "12:41" has none - so the element
   flips to ltr and `start` silently becomes the left edge. */
.c-t{display:block;font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:9px;
  line-height:1.05;unicode-bidi:plaintext;text-align:right;
  font-variant-numeric:tabular-nums}
.c-s{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:7px;
  unicode-bidi:plaintext}
.c-ic{position:absolute;inset-inline-end:20px;top:50%;transform:translateY(-50%);
  width:54px;height:54px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--g);box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.c-ic svg{width:23px;height:23px}

/* ── THE YEAR ── a pressed tray with the days inside it ── */
.tray{border-radius:20px;padding:16px 15px}
.grid{display:flex;gap:4px;direction:ltr;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px;flex:1}
.cell{width:100%;aspect-ratio:1;border-radius:4px;background:#e1ded9}
.cell.l1{background:var(--c1)}
.cell.l2{background:var(--c2)}
.cell.l3{background:var(--c3)}
/* today, and only today, is amber - the same dot the week strip uses */
.cell.now{background:var(--amber);
  box-shadow:0 0 0 2px var(--g),0 0 9px 2px rgba(240,169,46,.6)}
.key{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;
  font-size:11px;font-weight:600;color:var(--muted);direction:ltr}
.key i{width:9px;height:9px;border-radius:3px;display:block}

/* ── WHERE THE TIME WENT ── */
.bd{border-radius:20px;padding:17px 17px 15px}
.r{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.r:last-child{margin-bottom:0}
.r-n{width:76px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:start;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-b{flex:1;height:8px;border-radius:4px;background:var(--g);
  box-shadow:inset 2px 2px 4px var(--sh),inset -2px -2px 3px var(--lit)}
.r-b i{display:block;height:100%;border-radius:4px;background:var(--c3)}
.r-v{width:38px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:end;direction:ltr}

.back{font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;
  padding:0;cursor:pointer;font-family:inherit;display:block}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
/* A line icon, never an emoji, and the colour is what tells hobbies apart. */
var IC={
 guitar:'<path d="M14.5 3.5l2.2-2.2a1 1 0 011.4 0l1.6 1.6a1 1 0 010 1.4L17.5 6.5l1 1-4.3 4.3a4.6 4.6 0 11-1.9-1.9L16.6 5.6zM9 15a2 2 0 100 .01"/>',
 palette:'<path d="M12 3a9 9 0 000 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.7 1.7-1.7h1.4A4.6 4.6 0 0021 10.7C21 6.4 16.9 3 12 3z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="10" cy="7.2" r="1.1"/><circle cx="15" cy="7.6" r="1.1"/>',
 book:'<path d="M12 6.5S9.8 4.8 6.6 4.8c-1.3 0-2.1.2-2.1.2v13s.8-.3 2.1-.3c3.2 0 5.4 1.8 5.4 1.8s2.2-1.8 5.4-1.8c1.3 0 2.1.3 2.1.3V5s-.8-.2-2.1-.2C14.2 4.8 12 6.5 12 6.5zM12 6.5v13"/>'
};
function svg(k,c){return '<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.7" '+
  'stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>';}

var HOB=[
 {n:'קריאה', k:'book',    c:'#4c9c7a', h:38, parts:[['עיון',61],['פרוזה',39]]},
 {n:'ציור',  k:'palette', c:'#d98a5e', h:16, parts:[['אנטומיה',52],['נוף',26],['דיוקנאות',22]]},
 {n:'גיטרה', k:'guitar',  c:'#8b84d8', h:31, run:1, parts:[['טכניקה',44],['שירים',38],['תיאוריה',18]]}
];
/* three steps of the hobby's own hue, laid over the ground */
function ramp(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  function mix(a){var G=[233,231,227];
    return 'rgb('+[0,1,2].map(function(i){return Math.round(G[i]+([r,g,b][i]-G[i])*a);}).join(',')+')';}
  /* .16/.38/.68, not .22/.52/.88 - measured against the app, which keeps
     almost no colour on a surface. The first draft's ramp was louder than
     anything on the כושר screen. */
  return [mix(.16),mix(.38),mix(.68)];
}
function heat(seed,weeks){
  var h='<div class="grid">',w,d,s=seed;
  function rnd(){s=(s*9301+49297)%233280;return s/233280;}
  for(w=0;w<weeks;w++){
    h+='<span class="col">';
    for(d=0;d<7;d++){
      /* sparser than the first draft: at .42 the map was two-thirds full and
         read as noise. A real year of a hobby has gaps in it. */
      var v=rnd(),lv=v>.90?3:v>.78?2:v>.58?1:0,now=(w===weeks-1&&d===2);
      h+='<i class="cell'+(lv?' l'+lv:'')+(now?' now':'')+'"></i>';
    }
    h+='</span>';
  }
  return h+'</div>';
}
function key(){
  return '<div class="key">פחות<i style="background:#e1ded9"></i>'+
    '<i style="background:var(--c1)"></i><i style="background:var(--c2)"></i>'+
    '<i style="background:var(--c3)"></i>יותר</div>';
}
function strip(sel){
  var h='<div class="strip">',i;
  for(i=0;i<HOB.length;i++)
    h+='<button class="d'+(i===sel?' on':'')+'">'+
       '<span class="d-ic">'+svg(HOB[i].k,i===sel?HOB[i].c:'#b3aca3')+'</span>'+
       '<span class="d-n">'+HOB[i].n+'</span><span class="d-dot"></span></button>';
  return h+'</div>';
}
function card(o){
  return '<button class="raise card">'+
    '<span class="c-cap">'+(o.run?'<i class="live"></i>':'')+(o.run?'רץ עכשיו':'להתחיל')+'</span>'+
    '<span class="c-t">'+(o.run?'12:41':o.n)+'</span>'+
    '<span class="c-s">'+(o.run?o.n+' · '+o.h+' שעות בסך הכול':'עוד לא תרגלת היום')+'</span>'+
    '<span class="c-ic">'+svg(o.k,o.c)+'</span></button>';
}
function bd(o){
  var h='',i;
  for(i=0;i<o.parts.length;i++)
    h+='<div class="r"><span class="r-n">'+o.parts[i][0]+'</span>'+
       '<span class="r-b"><i style="width:'+o.parts[i][1]+'%"></i></span>'+
       '<span class="r-v">'+o.parts[i][1]+'%</span></div>';
  return '<div class="press bd">'+h+'</div>';
}
var V={};
V.hub=function(){
  var o=HOB[2];
  return '<div class="hdr"><span class="home">⌂ בית</span>'+
    '<div class="t">תחביבים</div></div><div class="pad">'+
    strip(2)+'<div class="lab">התחביבים שלי</div>'+
    card(o)+'<div class="gap"></div>'+
    '<div class="press tray">'+heat(11,20)+key()+'</div>'+
    '<div class="lab">השנה · כל יום שתרגלת</div>'+
    bd(o)+'<div class="lab">על מה הזמן הלך</div></div>';
};
V.deep=function(){
  var o=HOB[2];
  return '<div class="hdr"><span class="home">⌂ בית</span>'+
    '<button class="back">‹ תחביבים</button><div class="t">גיטרה</div></div><div class="pad">'+
    card(o)+'<div class="gap"></div>'+
    '<div class="press tray">'+heat(11,20)+key()+'</div>'+
    '<div class="lab">השנה · כל יום שתרגלת</div>'+
    bd(o)+'<div class="lab">על מה הזמן הלך</div></div>';
};
var v=(location.search.match(/v=([a-z]+)/)||[])[1]||'hub';
var f=document.getElementById('frame');
var act=HOB[2], ra=ramp(act.c);
f.style.setProperty('--c1',ra[0]);f.style.setProperty('--c2',ra[1]);f.style.setProperty('--c3',ra[2]);
f.innerHTML=(V[v]||V.hub)();
f.style.transformOrigin='top left';
f.style.transform='scale('+Math.min(1,(window.innerHeight-6)/940)+')';
</script>
</body>
</html>
