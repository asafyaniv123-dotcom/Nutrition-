<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>סיום יום — the cards, in glass</title>
<!--
  Four glass treatments for the reflection board, built rather than imagined:
  the icons, the titles and the card grid are lifted from dev/index.html, and
  the ground is the app's OWN night sky - the same #221d38→#171528 the .sky
  layer already paints after dark, with the same drifting clouds and the same
  thirty twinkling stars.

  That is the argument underneath all four: the reflection is used at night,
  the app already paints a night sky, and .app{background:var(--surface)} is
  the one line hiding it. Glass over a cream page is a texture; glass over the
  sky is a window.

  ?v=frost|milk|stain|panes
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --violet500:#a690cf; --terra500:#e08a72; --green600:#6fb283;
  --water500:#3a7ca5; --amber:#c98b3f; --grey:#7a716b;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#0d0b18}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  font-family:Assistant,system-ui,sans-serif}

/* ── THE SKY, exactly as the app paints it after dark ── */
.sky{position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 8%,rgba(120,104,190,.30),transparent 62%),
             linear-gradient(165deg,#221d38,#171528)}
.cloud{position:absolute;border-radius:50%;filter:blur(20px)}
.c1{width:58vw;height:22vh;min-width:220px;min-height:150px;top:6%;right:-10%;background:rgba(255,255,255,.95);opacity:.10}
.c3{width:70vw;height:26vh;min-width:260px;min-height:180px;top:54%;left:-16%;background:rgba(255,255,255,.72);opacity:.10}
.stars i{position:absolute;background:#fff;border-radius:50%;opacity:.55}

/* ── the page over it ── */
.pg{position:relative;z-index:1;height:100%;overflow:hidden;padding:26px 16px 0}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.hd-q{font-size:21px;font-weight:800;color:#f2eefb;letter-spacing:-.3px}
.hd-n{font-size:11px;font-weight:700;color:#9a90c0;flex-shrink:0}
.hd-s{font-size:12px;color:#8d83b4;line-height:1.6;margin-bottom:18px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ── the card, shared skeleton (the app's own .rf-card) ── */
.c{position:relative;border:none;border-radius:22px;padding:16px 13px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  cursor:pointer;font-family:inherit;overflow:hidden}
.c-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.c-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.c-t{font-size:13px;font-weight:800;line-height:1.3}
.c-s{font-size:9.5px;line-height:1.4}
.c-v{position:absolute;top:10px;inset-inline-end:10px;width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1}

/* ══ A. FROST — real glass, and answering CLEARS it ══════════════════════ */
.v-frost .c{background:rgba(255,255,255,.10);backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.06),
             0 10px 24px -14px rgba(0,0,0,.6)}
.v-frost .c-ic{background:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.v-frost .c-t{color:#f4f1fb}
.v-frost .c-s{color:#a79ec8}
/* answered: the frost drops away and the hue lights along the lower edge */
.v-frost .c.done{background:rgba(255,255,255,.035);backdrop-filter:blur(4px) saturate(1.1);
  -webkit-backdrop-filter:blur(4px) saturate(1.1)}
.v-frost .c.done::after{content:"";position:absolute;inset-inline:18px;bottom:0;height:2px;
  border-radius:2px;background:var(--hue);
  box-shadow:0 0 14px 2px var(--hue),0 0 30px 6px var(--hue)}
.v-frost .c-v{background:rgba(255,255,255,.18);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* ══ B. MILK — heavy white glass, the calmest to read at night ═══════════ */
.v-milk .c{background:rgba(255,255,255,.80);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 26px -16px rgba(0,0,0,.55)}
.v-milk .c-ic{background:rgba(255,255,255,.9);box-shadow:0 3px 9px rgba(80,66,110,.14)}
.v-milk .c-t{color:#3a3530}
.v-milk .c-s{color:#8a827c}
.v-milk .c.done{background:rgba(255,255,255,.92)}
.v-milk .c.done .c-v{background:var(--hue);color:#fff}
.v-milk .c-v{background:rgba(0,0,0,.08);color:#fff}

/* ══ C. STAIN — the hue is light through the glass, at one edge ══════════ */
.v-stain .c{backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  background:linear-gradient(158deg,color-mix(in srgb,var(--hue) 34%,transparent),rgba(255,255,255,.05) 62%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -14px rgba(0,0,0,.6)}
.v-stain .c-ic{background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.v-stain .c-t{color:#f6f3fc}
.v-stain .c-s{color:#b0a7cd}
/* answered: the coloured light floods the whole pane */
.v-stain .c.done{background:linear-gradient(158deg,color-mix(in srgb,var(--hue) 62%,transparent),color-mix(in srgb,var(--hue) 22%,transparent))}
.v-stain .c-v{background:rgba(255,255,255,.22);color:#fff}

/* ══ D. PANES — two sheets with a real gap between them ══════════════════ */
.v-panes .c{background:rgba(255,255,255,.07);backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);padding-top:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 24px -14px rgba(0,0,0,.6)}
/* the icon is on the FRONT sheet: its own glass, its own shadow onto the card */
.v-panes .c-ic{background:rgba(255,255,255,.22);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 16px -6px rgba(0,0,0,.45)}
.v-panes .c-t{color:#f4f1fb}
.v-panes .c-s{color:#a79ec8}
.v-panes .c.done{background:rgba(255,255,255,.03)}
.v-panes .c.done .c-ic{background:var(--hue);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),
  0 8px 18px -5px var(--hue)}
.v-panes .c.done .c-ic svg{color:#fff!important}
.v-panes .c-v{background:rgba(255,255,255,.18);color:#fff}

.tag{position:absolute;top:10px;left:10px;z-index:3;font-size:9px;font-weight:800;
  letter-spacing:.1em;color:#fff;background:rgba(255,255,255,.14);border-radius:999px;
  padding:5px 10px;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
/* the icons, copied from RF_ICONS so a comp cannot draw a shape the app lacks */
var IC={
 face:'<circle cx="12" cy="12" r="9.2"/><circle cx="9.1" cy="9.9" r=".95" fill="currentColor" stroke="none"/><circle cx="14.9" cy="9.9" r=".95" fill="currentColor" stroke="none"/><path d="M8.6 14.8q3.4 1.7 6.8 0"/>',
 body:'<circle cx="12" cy="5.6" r="2.6"/><path d="M12 8.6v6.4"/><path d="M7.4 10.8h9.2"/><path d="M12 15 9 20.4"/><path d="m12 15 3 5.4"/>',
 star:'<path d="m12 3.6 2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 10l6-.8Z"/>',
 wave:'<path d="M3.2 14.4c2.2-4.4 4.4-4.4 6.6 0s4.4 4.4 6.6 0 4.4-4.4 4.4 0"/><path d="M3.2 8.6c2.2-4.4 4.4-4.4 6.6 0"/>',
 dumbbell:'<path d="M4.2 9.4v5.2"/><path d="M19.8 9.4v5.2"/><path d="M7 7.2v9.6"/><path d="M17 7.2v9.6"/><path d="M7 12h10"/>',
 sunrise:'<path d="M12 4.2v3.6"/><path d="m7.6 9.2-1.8-1.8"/><path d="m16.4 9.2 1.8-1.8"/><path d="M7.6 16.4a4.4 4.4 0 0 1 8.8 0"/><path d="M3.4 16.4h17.2"/><path d="M6.4 19.8h11.2"/>',
 hands:'<path d="M4.4 11.6 8 15.2a4 4 0 0 0 2.8 1.2h2.6"/><path d="M19.6 11.6 16 15.2"/><path d="M4.4 11.6V7.4a1.6 1.6 0 0 1 3.2 0v2.8"/><path d="M19.6 11.6V7.4a1.6 1.6 0 0 0-3.2 0v2.8"/><path d="M7.6 20.4h8.8"/>',
 people:'<circle cx="9.2" cy="8.6" r="3.2"/><path d="M3.6 19.6a5.6 5.6 0 0 1 11.2 0"/><path d="M16.4 6.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.6 14.6a5.6 5.6 0 0 1 2.8 5"/>',
 medal:'<circle cx="12" cy="14.6" r="5.4"/><path d="M8.4 9.6 6.2 3.6h11.6l-2.2 6"/>',
 hourglass:'<path d="M7 3.4h10"/><path d="M7 20.6h10"/><path d="M7.6 3.4c0 4 4.4 5.2 4.4 8.6s-4.4 4.6-4.4 8.6"/><path d="M16.4 3.4c0 4-4.4 5.2-4.4 8.6s4.4 4.6 4.4 8.6"/>'
};
/* the bank's own first ten cards, titles and all */
var CARDS=[
 {t:'איך הרגשת',   s:'היום, בגדול',       ic:'face',      h:'var(--terra500)', done:1},
 {t:'הגוף שלך',    s:'איך הוא הרגיש',     ic:'body',      h:'var(--green600)'},
 {t:'ציון היום',   s:'מספר אחד',          ic:'star',      h:'var(--amber)'},
 {t:'איך זרם היום',s:'עוגנים לפי שעה',    ic:'wave',      h:'var(--water500)', done:1},
 {t:'האימון',      s:'יצא לך?',           ic:'dumbbell',  h:'var(--terra500)'},
 {t:'למחר',        s:'מה אתה לוקח',       ic:'sunrise',   h:'var(--amber)'},
 {t:'הכרת תודה',   s:'על מה היום',        ic:'hands',     h:'var(--green600)', done:1},
 {t:'האדם של היום',s:'מי השפיע עליך',     ic:'people',    h:'var(--terra500)'},
 {t:'גאווה',       s:'גם משהו קטן',       ic:'medal',     h:'var(--violet500)'},
 {t:'משהו שנדחה',  s:'ולמה',              ic:'hourglass', h:'var(--grey)'}
];
var NAMES={frost:'A · FROST',milk:'B · MILK',stain:'C · STAIN',panes:'D · PANES'};
var v=(location.search.match(/v=(\w+)/)||[])[1]||'frost';

/* thirty stars, hand-seeded the way the app seeds its own */
function stars(){
  var h='<div class="stars">',i,x,y,s2,seed=7;
  for(i=0;i<30;i++){
    seed=(seed*9301+49297)%233280; x=(seed/233280*100).toFixed(1);
    seed=(seed*9301+49297)%233280; y=(seed/233280*100).toFixed(1);
    seed=(seed*9301+49297)%233280; s2=(1+seed/233280*1.6).toFixed(1);
    h+='<i style="left:'+x+'%;top:'+y+'%;width:'+s2+'px;height:'+s2+'px;opacity:'+(.25+(i%5)*.14).toFixed(2)+'"></i>';
  }
  return h+'</div>';
}
var h='<div class="sky">'+stars()+'<div class="cloud c1"></div><div class="cloud c3"></div></div>';
h+='<div class="tag">'+NAMES[v]+'</div>';
h+='<div class="pg v-'+v+'">';
h+='<div class="hd"><div class="hd-q">מה עוד להוסיף להיום?</div><div class="hd-n">3/22</div></div>';
h+='<div class="hd-s">בחר מה שמדבר אליך. אין חובה לענות על הכל, ואפשר לסיים מתי שבא לך.</div>';
h+='<div class="board">';
for(var i=0;i<CARDS.length;i++){
  var c=CARDS[i];
  h+='<button class="c'+(c.done?' done':'')+'" style="--hue:'+c.h+'">'+
     (c.done?'<span class="c-v">&#10003;</span>':'')+
     '<span class="c-ic" style="color:'+c.h+'"><svg viewBox="0 0 24 24">'+IC[c.ic]+'</svg></span>'+
     '<span class="c-t">'+c.t+'</span><span class="c-s">'+c.s+'</span></button>';
}
h+='</div></div>';
document.getElementById('frame').innerHTML=h;
/* the window here cannot be made taller, so the phone is scaled to fit; a
   transform rasterises at device resolution, so the capture stays crisp */
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
