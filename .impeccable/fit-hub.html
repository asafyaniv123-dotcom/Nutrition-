<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כושר — three structures</title>
<!--
  Three ways to arrange the כושר page, built rather than imagined: the tokens,
  the shadows and the strings are lifted from dev/index.html, so a comp cannot
  quietly invent a material the app does not have. ?v=shelf|channel|dial picks
  one; the frame is a phone at 376px, pinned to the left so a capture region is
  predictable.
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nu-ground:#e9e7e3;
  --nu-lit:rgba(255,255,255,.95);
  --nu-shade:rgba(176,168,156,.44);
  --nu-shade-soft:rgba(176,168,156,.28);
  --nu-ink:#4a453f; --nu-muted:#7d766d; --nu-amber:#f0a92e;
  --ter:#e08a72; --grn:#8fc79e; --lav:#a690cf; --blu:#7fa8cf; --gry:#a89e97;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#ffffff}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  background:var(--nu-ground);font-family:Assistant,system-ui,sans-serif;color:var(--nu-ink)}
.pad{padding:0 16px}

/* ── the two states of the one material ── */
.raise{background:var(--nu-ground);border:none;
  box-shadow:-6px -6px 15px var(--nu-lit),8px 10px 22px var(--nu-shade)}
.raise-sm{background:var(--nu-ground);border:none;
  box-shadow:-4px -4px 9px var(--nu-lit),5px 6px 13px var(--nu-shade-soft)}
.press{background:var(--nu-ground);
  box-shadow:inset 3px 4px 8px var(--nu-shade),inset -3px -3px 7px var(--nu-lit)}

/* ── the page's head, the same rank as the nutrition screen's ── */
.hd{padding:26px 16px 14px;display:flex;align-items:flex-start;justify-content:space-between}
.hd-t{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1}
.hd-d{font-size:12px;font-weight:600;color:var(--nu-muted);margin-top:6px}
.hd-home{font-size:11px;font-weight:700;color:var(--nu-muted);border-radius:999px;padding:7px 13px}

/* ── the slab that starts a workout ── */
.slab{border-radius:26px;padding:26px 20px 24px;min-height:186px;display:flex;flex-direction:column;justify-content:center;margin:2px 0 14px;position:relative;overflow:hidden}
.slab-k{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--nu-muted)}
.slab-t{font-size:30px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.slab-s{font-size:12px;font-weight:600;color:var(--nu-muted);margin-top:5px}
.slab-go{position:absolute;inset-inline-end:18px;bottom:18px;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ter)}
/* the one lit thing: a seam along the slab's lower edge */
.seam{position:absolute;inset-inline:22px;bottom:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(240,169,46,0),var(--nu-amber),rgba(240,169,46,0));
  box-shadow:0 0 18px 3px rgba(240,169,46,.55),0 0 34px 8px rgba(240,169,46,.24)}

/* ── the week ── */
.week{display:flex;gap:7px;margin-bottom:14px}
.wd{flex:1;height:62px;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px}
.wd-l{font-size:10px;font-weight:800;color:var(--nu-muted)}
.wd-dot{width:7px;height:7px;border-radius:50%;background:#ded9d2;
  box-shadow:inset 1px 1px 2px var(--nu-shade)}
.wd.done .wd-dot{background:var(--ter);box-shadow:0 0 9px 2px rgba(224,138,114,.6)}
.wd.now{box-shadow:-3px -3px 8px var(--nu-lit),4px 5px 11px var(--nu-shade-soft)}
.wd.now .wd-l{color:var(--nu-ink)}
.wd.now .wd-dot{background:var(--nu-amber);box-shadow:0 0 12px 3px rgba(240,169,46,.75)}

/* ── a door ── */
.door{display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px}
.door-ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:var(--nu-ground);
  box-shadow:-3px -3px 7px var(--nu-lit),3px 4px 9px var(--nu-shade-soft)}
.door-ic svg{width:20px;height:20px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.door-x{flex:1;min-width:0}
.door-t{font-size:13.5px;font-weight:800}
.door-s{font-size:10.5px;font-weight:600;color:var(--nu-muted);margin-top:2px}
.door-g{font-size:15px;color:#c9c2b9}

/* ── the goal, a pressed pill ── */
.goal{border-radius:20px;padding:13px 15px;margin-bottom:12px}
.goal-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.goal-k{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--nu-muted)}
.goal-r{font-size:11px;font-weight:800;color:var(--nu-ink);direction:ltr}
.goal-row{display:flex;gap:6px}
.goal-b{flex:1;border-radius:12px;padding:8px 4px;text-align:center;font-size:10px;font-weight:700;
  color:var(--nu-muted)}
.goal-b.on{color:var(--nu-ink);box-shadow:-3px -3px 7px var(--nu-lit),3px 4px 9px var(--nu-shade-soft)}

/* ── A. the shelf ── */
.shelf{border-radius:22px 22px 0 0;padding:15px 16px 20px;
  display:flex;align-items:center;justify-content:space-between}
.shelf-t{font-size:13px;font-weight:800}
.shelf-s{font-size:10.5px;font-weight:600;color:var(--nu-muted);margin-top:2px}
.shelf-grip{width:44px;height:5px;border-radius:3px;background:var(--nu-ground);
  box-shadow:inset 1px 1px 3px var(--nu-shade),inset -1px -1px 2px var(--nu-lit);
  margin:0 auto 12px}
.col{display:flex;flex-direction:column;height:100%}

/* ── B. the channel ── */
.chan{height:26px;border-radius:13px;margin:4px 0 16px;position:relative;overflow:hidden}
.chan-fill{position:absolute;inset-block:0;inset-inline-end:0;width:72%;border-radius:13px;
  background:linear-gradient(90deg,#f3b9a8,#e08a72);
  box-shadow:0 0 18px rgba(224,138,114,.75),0 0 34px rgba(224,138,114,.4)}
.chan-l{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;
  color:var(--nu-muted);margin:-10px 2px 16px}
.chan-l b{color:var(--nu-ink);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;border-radius:22px;padding:11px}
.tile{border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:86px}
.tile-t{font-size:12px;font-weight:800;line-height:1.25}
.tile-s{font-size:9.5px;font-weight:600;color:var(--nu-muted);line-height:1.35}

/* ── B2. seven tubes: the week's shape, not its count ── */
.tubes{display:flex;gap:8px;justify-content:space-between;margin:6px 0 4px}
.tube{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.tube-c{width:100%;height:96px;border-radius:14px;position:relative;overflow:hidden;
  background:var(--nu-ground);
  box-shadow:inset 3px 4px 8px var(--nu-shade),inset -3px -3px 7px var(--nu-lit)}
.tube-f{position:absolute;inset-inline:0;bottom:0;border-radius:14px;
  background:linear-gradient(180deg,#f3b9a8,#e08a72);
  box-shadow:0 -5px 14px rgba(224,138,114,.9),0 0 20px rgba(224,138,114,.5)}
.tube.now .tube-f{background:linear-gradient(180deg,#f7cf8a,var(--nu-amber));
  box-shadow:0 -5px 14px rgba(240,169,46,.95),0 0 22px rgba(240,169,46,.55)}
.tube-l{font-size:10px;font-weight:800;color:var(--nu-muted)}
.tube.now .tube-l{color:var(--nu-ink)}

/* ── B3. the arc: the instrument bent around the object ── */
.arcwrap{position:relative;width:300px;height:158px;margin:8px auto 0;overflow:hidden}
.arcwrap svg{position:absolute;inset:0;width:300px;height:300px;overflow:visible}
.arc-slab{position:absolute;inset-inline:34px;top:52px;border-radius:24px;padding:20px 18px;
  text-align:center}
.arc-k{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--nu-muted)}
.arc-t{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-top:3px}
.arc-s{font-size:11px;font-weight:600;color:var(--nu-muted);margin-top:5px}

/* ── B4. rows that say their own state ── */
.rows{border-radius:22px;padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;border-radius:16px;padding:11px 10px}
.row+.row{box-shadow:0 -1px 0 rgba(255,255,255,.85),0 -2px 0 rgba(176,168,156,.16)}
.row-x{flex:1;min-width:0}
.row-t{font-size:13px;font-weight:800}
.row-v{font-size:10.5px;font-weight:700;color:var(--nu-muted);margin-top:2px;
  unicode-bidi:plaintext}
.row-v b{color:var(--ter);font-weight:800}

/* ── B5. the band: the channel as the page's own top edge ── */
.band{position:relative;height:46px;overflow:hidden;
  background:var(--nu-ground);
  box-shadow:inset 0 5px 10px var(--nu-shade),inset 0 -3px 7px var(--nu-lit)}
.band-f{position:absolute;inset-block:0;inset-inline-end:0;width:72%;
  background:linear-gradient(90deg,#f3b9a8,#e08a72);
  box-shadow:0 0 22px rgba(224,138,114,.8),0 0 44px rgba(224,138,114,.42)}
.band-t{position:absolute;inset-block:0;width:1px;background:rgba(255,255,255,.55)}
.band-l{display:flex;justify-content:space-between;font-size:10px;font-weight:800;
  color:var(--nu-muted);padding:8px 18px 0}
.band-l b{color:var(--nu-ink)}
.slab-in{border-radius:26px;padding:22px 20px;margin:14px 0;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.slab-in .slab-t{font-size:26px}
.slab-btn{width:58px;height:58px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}

/* ── C. the dial ── */
.dialwrap{position:relative;width:344px;height:344px;margin:22px auto 0}
.rim{position:absolute;inset:0;border-radius:50%}
.disc{position:absolute;inset:46px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:var(--nu-ground);
  box-shadow:inset 0 22px 38px -26px rgba(255,255,255,.95),
             inset 0 -24px 40px -26px rgba(176,168,156,.5),
             0 14px 30px -20px rgba(176,168,156,.7)}
.disc-k{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--nu-muted)}
.disc-t{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:3px}
.disc-s{font-size:11px;font-weight:600;color:var(--nu-muted);margin-top:5px}
.notch{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--nu-ground);
  box-shadow:inset 2px 3px 6px var(--nu-shade),inset -2px -2px 5px var(--nu-lit)}
.notch svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notch.on{box-shadow:-3px -3px 8px var(--nu-lit),4px 5px 11px var(--nu-shade-soft)}
.dial-name{text-align:center;margin-top:10px}
.dial-name .n{font-size:15px;font-weight:800}
.dial-name .s{font-size:11px;font-weight:600;color:var(--nu-muted);margin-top:2px}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
/* the icons, copied from FIT_AREAS in dev/index.html so the comp cannot draw a
   shape the app does not have */
var IC={
 start:'<path d="M6.5 9v6"/><path d="M17.5 9v6"/><path d="M3.5 10.5v3"/><path d="M20.5 10.5v3"/><path d="M6.5 12h11"/>',
 build:'<path d="M12 3.5v17"/><path d="M5 8.5l7-5 7 5"/><path d="M5 15.5l7 5 7-5"/>',
 timer:'<circle cx="12" cy="13" r="7.5"/><path d="M12 13V8.8"/><path d="M9.6 3.5h4.8"/><path d="M18.4 6.2l1.4-1.4"/>',
 weights:'<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h9"/>',
 plan:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17"/><path d="M8.5 3v4"/><path d="M15.5 3v4"/>',
 stats:'<path d="M5 19V11"/><path d="M12 19V5"/><path d="M19 19v-5"/>',
 steps:'<path d="M8 4.5c1.6 0 2.6 1.2 2.6 3.1 0 2-1 3.3-1 5.1 0 1.2-.7 1.9-1.9 1.9S5.8 13.9 5.8 12.7c0-1.8-1-3.1-1-5.1C4.8 5.7 6.4 4.5 8 4.5Z"/><path d="M16.4 9c1.6 0 2.6 1.2 2.6 3.1 0 2-1 3.3-1 5.1 0 1.2-.7 1.9-1.9 1.9s-1.9-.7-1.9-1.9c0-1.8-1-3.1-1-5.1 0-1.9 1.6-3.1 3.2-3.1Z"/>',
 history:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>'
};
var DOORS=[
 {k:'build',   t:'אימון שנבנה לך', s:'לפי מה שחסר לך השבוע', c:'var(--grn)'},
 {k:'timer',   t:'סטופר וטיימרים', s:'EMOM, Tabata, אינטרוולים', c:'var(--ter)'},
 {k:'weights', t:'מעקב משקלים',    s:'כמה אתה מרים בכל תרגיל', c:'var(--lav)'},
 {k:'plan',    t:'לוז האימונים',    s:'מה עושים ומתי', c:'var(--blu)'},
 {k:'stats',   t:'המספרים שלי',     s:'נפח, שרירים, והשיא שלך', c:'var(--grn)'},
 {k:'steps',   t:'צעדים',           s:'הדבר שזז כל יום', c:'var(--grn)'},
 {k:'history', t:'היסטוריה',        s:'כל אימון שרשמת', c:'var(--gry)'}
];
function svg(k,c){return '<svg viewBox="0 0 24 24" style="stroke:'+c+'">'+IC[k]+'</svg>';}
function head(){
  return '<div class="hd"><div><div class="hd-t">כושר</div>'+
    '<div class="hd-d">יום שלישי, 22 בספטמבר</div></div>'+
    '<div class="hd-home press">⌂ בית</div></div>';
}
function slab(){
  return '<div class="pad"><div class="slab raise">'+
    '<div class="slab-k">להתחיל עכשיו</div>'+
    '<div class="slab-t">אימון חדש</div>'+
    '<div class="slab-s">האחרון: לפני 3 ימים · דחיפה</div>'+
    '<div class="slab-go raise-sm">'+svg('start','var(--ter)')+'</div>'+
    '<div class="seam"></div></div></div>';
}
function week(){
  var d=['א','ב','ג','ד','ה','ו','ש'],done={'א':1,'ג':1,'ה':1},h='<div class="pad"><div class="week">';
  for(var i=0;i<7;i++){
    var cls='wd press'+(done[d[i]]?' done':'')+(d[i]==='ג'?' now':'');
    h+='<div class="'+cls+'"><span class="wd-l">'+d[i]+'</span><span class="wd-dot"></span></div>';
  }
  return h+'</div></div>';
}
function goal(){
  var g=['כוח','מסת שריר','סיבולת שריר','בריאות כללית'],h='<div class="pad"><div class="goal press">'+
    '<div class="goal-hd"><span class="goal-k">המטרה שלי</span><span class="goal-r">6–12 חזרות</span></div>'+
    '<div class="goal-row">';
  for(var i=0;i<g.length;i++)h+='<div class="goal-b'+(i===1?' on':'')+'">'+g[i]+'</div>';
  return h+'</div></div></div>';
}

var V={};
/* ── A. THE SHELF ── two things and a shelf */
V.shelf=function(){
  return '<div class="col">'+head()+slab()+week()+'<div style="margin-top:auto">'+goal()+
    '<div class="shelf press"><div><div class="shelf-t">עוד בכושר</div>'+
    '<div class="shelf-s">שבעה מקומות · הזמנים, המספרים, ההיסטוריה</div></div>'+
    '<div class="door-g">⌃</div></div></div></div>';
};
/* ── B. THE CHANNEL ── the week as a tube, the doors as a pressed grid */
V.channel=function(){
  var h='<div class="col">'+head()+
    '<div class="pad"><div class="chan press"><div class="chan-fill"></div></div>'+
    '<div class="chan-l"><span>השבוע</span><span><b>3</b> מתוך <b>4</b></span></div></div>'+
    slab()+'<div class="pad"><div class="grid press">';
  for(var i=0;i<6;i++){
    h+='<div class="tile raise-sm"><div class="door-ic">'+svg(DOORS[i].k,DOORS[i].c)+'</div>'+
       '<div><div class="tile-t">'+DOORS[i].t+'</div><div class="tile-s">'+DOORS[i].s+'</div></div></div>';
  }
  return h+'</div></div></div>';
};
/* ── C. THE DIAL ── one object, the areas pressed into its rim */
V.dial=function(){
  var h='<div class="col">'+head()+'<div class="dialwrap"><div class="rim press"></div>';
  var all=[{k:'start'}].concat(DOORS);
  for(var i=0;i<8;i++){
    var a=-90+i*45, r=149;
    var x=Math.cos(a*Math.PI/180)*r, y=Math.sin(a*Math.PI/180)*r;
    var d=(i===0)?DOORS[0]:all[i];
    h+='<div class="notch'+(i===0?' on':'')+'" style="transform:translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)">'+
       svg(d.k,i===0?'var(--grn)':'var(--nu-muted)')+'</div>';
  }
  h+='<div class="disc"><div class="disc-k">להתחיל עכשיו</div>'+
     '<div class="disc-t">אימון חדש</div>'+
     '<div class="disc-s">האחרון: לפני 3 ימים · דחיפה</div></div></div>'+
     '<div class="dial-name"><div class="n">אימון שנבנה לך</div>'+
     '<div class="s">לפי מה שחסר לך השבוע</div></div>'+goal()+'</div>';
  return h;
};
/* the doors, as rows, for the shelf variant when it is pulled — not drawn in
   the first viewport, which is the whole point of that structure */
/* ── B2. THE SEVEN TUBES ── the week drawn the way the macros are */
V.tubes=function(){
  var d=['א','ב','ג','ד','ה','ו','ש'],fill={'א':62,'ג':48,'ה':78},h='<div class="col">'+head()+
    '<div class="pad"><div class="tubes">';
  for(var i=0;i<7;i++){
    var p=fill[d[i]]||0,now=(d[i]==='ג');
    h+='<div class="tube'+(now?' now':'')+'"><div class="tube-c">'+
       (p?'<div class="tube-f" style="height:'+p+'%"></div>':'')+'</div>'+
       '<span class="tube-l">'+d[i]+'</span></div>';
  }
  h+='</div><div class="chan-l" style="margin:10px 2px 14px"><span>השבוע</span>'+
     '<span><b>3</b> מתוך <b>4</b></span></div></div>'+slab()+
     '<div class="pad"><div class="grid press">';
  for(var j=0;j<4;j++){
    h+='<div class="tile raise-sm"><div class="door-ic">'+svg(DOORS[j].k,DOORS[j].c)+'</div>'+
       '<div><div class="tile-t">'+DOORS[j].t+'</div><div class="tile-s">'+DOORS[j].s+'</div></div></div>';
  }
  return h+'</div></div>'+goal()+'</div>';
};
/* ── B3. THE ARC ── the channel bent around the thing it is about */
V.arc=function(){
  var R=126,CX=150,CY=150,st=-198,en=-18,frac=.72;
  function pt(a){var r=a*Math.PI/180;return [CX+Math.cos(r)*R,CY+Math.sin(r)*R];}
  function path(a0,a1){
    var p0=pt(a0),p1=pt(a1);
    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+R+' '+R+' 0 0 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
  }
  var lit=st+(en-st)*frac;
  var h='<div class="col">'+head()+'<div class="arcwrap">'+
    '<svg viewBox="0 0 300 300">'+
      '<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'+
      '<feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/>'+
      '<feMergeNode in="SourceGraphic"/></feMerge></filter>'+
      '<linearGradient id="lg" x1="1" y1="0" x2="0" y2="0">'+
      '<stop offset="0" stop-color="#e08a72"/><stop offset="1" stop-color="#f3b9a8"/></linearGradient></defs>'+
      /* the empty channel: the material, pressed, never a pale wash of the fill */
      '<path d="'+path(st,en)+'" stroke="#d9d4cc" stroke-width="22" fill="none" stroke-linecap="round"/>'+
      '<path d="'+path(st,en)+'" stroke="rgba(255,255,255,.92)" stroke-width="7" fill="none" stroke-linecap="round" opacity=".75" transform="translate(0,-5)"/>'+
      '<path d="'+path(st,lit)+'" stroke="url(#lg)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)"/>'+
    '</svg>'+
    ''+
    ''+
    '</div>'+
    '<div class="chan-l" style="margin:-2px 18px 12px"><span>השבוע</span>'+
    '<span><b>3</b> מתוך <b>4</b></span></div>'+slab()+
    '<div class="pad"><div class="rows press">';
  for(var i=0;i<4;i++){
    h+='<div class="row"><div class="door-ic">'+svg(DOORS[i].k,DOORS[i].c)+'</div>'+
       '<div class="row-x"><div class="row-t">'+DOORS[i].t+'</div>'+
       '<div class="row-v">'+DOORS[i].s+'</div></div>'+
       '<div class="door-g">‹</div></div>';
  }
  return h+'</div></div>'+goal()+'</div>';
};
/* ── B4. CHANNEL AND ROWS ── every door says its own state */
V.rows=function(){
  var ST=['מחר: רגליים','3 טיימרים שמורים','65 ק״ג בלחיצת חזה','12 סטים השבוע','7,240 היום','24 אימונים'];
  var ORD=[3,1,2,4,5,6];
  var h='<div class="col">'+head()+
    '<div class="pad"><div class="chan press"><div class="chan-fill"></div></div>'+
    '<div class="chan-l"><span>השבוע</span><span><b>3</b> מתוך <b>4</b></span></div></div>'+
    slab()+'<div class="pad"><div class="rows press">';
  for(var i=0;i<6;i++){
    var d=DOORS[ORD[i]];
    h+='<div class="row"><div class="door-ic">'+svg(d.k,d.c)+'</div>'+
       '<div class="row-x"><div class="row-t">'+d.t+'</div>'+
       '<div class="row-v">'+ST[i]+'</div></div>'+
       '<div class="door-g">‹</div></div>';
  }
  return h+'</div></div></div>';
};
/* ── B5. THE BAND ── the channel is the page's top edge, and the slab inverts */
V.band=function(){
  var h='<div class="col">'+
    '<div class="band"><div class="band-f"></div>';
  for(var t=1;t<7;t++)h+='<div class="band-t" style="inset-inline-end:'+(t*14.28).toFixed(1)+'%"></div>';
  h+='</div><div class="band-l"><span>השבוע</span><span><b>3</b> מתוך <b>4</b> אימונים</span></div>'+
    head().replace('padding:26px 16px 14px','')+
    '<div class="pad"><div class="slab-in press">'+
    '<div><div class="slab-k">להתחיל עכשיו</div>'+
    '<div class="slab-t">אימון חדש</div>'+
    '<div class="slab-s">האחרון: לפני 3 ימים · דחיפה</div></div>'+
    '<div class="slab-btn raise-sm">'+svg('start','var(--ter)')+'</div></div>'+
    '<div class="grid press">';
  for(var i=0;i<6;i++){
    h+='<div class="tile raise-sm"><div class="door-ic">'+svg(DOORS[i].k,DOORS[i].c)+'</div>'+
       '<div><div class="tile-t">'+DOORS[i].t+'</div><div class="tile-s">'+DOORS[i].s+'</div></div></div>';
  }
  return h+'</div></div></div>';
};
/* the count, in the line that already carries it everywhere else */
function weekLine(m){
  return '<div class="pad"><div class="chan-l" style="margin:'+(m||'8px')+' 2px 14px">'+
    '<span>השבוע</span><span><b>3</b> מתוך <b>4</b></span></div></div>';
}
/* six doors, which is what the shorter strip buys back */
function doorGrid(n){
  var h='<div class="pad"><div class="grid press">',i;
  for(i=0;i<n;i++){
    h+='<div class="tile raise-sm"><div class="door-ic">'+svg(DOORS[i].k,DOORS[i].c)+'</div>'+
       '<div><div class="tile-t">'+DOORS[i].t+'</div><div class="tile-s">'+DOORS[i].s+'</div></div></div>';
  }
  return h+'</div></div>';
}
/* ── THE WEEK AS DOTS ── the strip leads */
V.dots=function(){
  return '<div class="col">'+head()+week()+weekLine('-4px')+slab()+doorGrid(6)+'</div>';
};
/* ── THE WEEK AS DOTS, UNDER THE WORKOUT ── the slab leads */
V.dotsdown=function(){
  return '<div class="col">'+head()+slab()+week()+weekLine('-4px')+doorGrid(6)+'</div>';
};
var v=(location.search.match(/v=(\w+)/)||[])[1]||'shelf';
document.getElementById('frame').innerHTML=(V[v]||V.shelf)();
/* the window here cannot be made taller than ~495px, so the phone is scaled to
   fit rather than cropped: a transform rasterises at device resolution, so the
   capture stays crisp. */
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
