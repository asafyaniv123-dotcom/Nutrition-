<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>B · סרט היום</title>
<style>
  :root{--ground:#e9e7e3;--lit:rgba(255,255,255,.95);--shade:rgba(176,168,156,.45);
    --shade-soft:rgba(176,168,156,.28);--ink:#4a453f;--muted:#8a827a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);
    font:400 15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  .phone{position:absolute;left:0;top:0;width:376px;height:642px;background:var(--ground);
    padding:18px 16px 12px;display:flex;flex-direction:column;overflow:hidden}
  .cap{font-size:9px;letter-spacing:.16em;color:#b8afa5;font-weight:800;text-align:center;margin-bottom:6px}
  .greet{font-size:12px;color:var(--muted)}
  .name{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}

  .disc{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--ground);width:40px;height:40px;
    box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 14px 3px var(--halo)}
  .disc svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  .fan{position:relative;height:246px;flex-shrink:0}
  .petal{position:absolute;left:50%;top:60%;width:74px;margin-left:-37px;border:none;background:none;
    padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;
    transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1))}
  .pname{font-size:9px;font-weight:700;color:var(--ink);line-height:1.15;text-align:center}
  .hub{position:absolute;left:50%;top:60%;width:114px;height:114px;margin:-57px 0 0 -57px;border-radius:50%;
    background:var(--ground);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;
    border:none;cursor:pointer;font-family:inherit;
    box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--shade)}
  .hub-ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
    background:var(--ground);
    box-shadow:inset 3px 4px 8px var(--shade),inset -3px -3px 7px var(--lit),0 0 15px 3px var(--halo)}
  .hub-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hub-t{font-size:12px;font-weight:800;color:var(--ink)}

  /* ── the day, under the arc ── */
  .sched{margin-top:14px}
  .sched-h{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:0 4px 8px}
  .srow{display:flex;align-items:center;gap:12px;background:var(--ground);border-radius:18px;
    padding:11px 14px;margin-bottom:8px;
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}
  .srow.done{box-shadow:inset 2px 3px 7px var(--shade-soft),inset -2px -2px 5px var(--lit)}
  .srow.done .stitle{color:var(--muted)}
  .stime{font-size:12px;font-weight:800;color:var(--muted);direction:ltr;unicode-bidi:isolate}
  .stitle{flex:1;font-size:13px;font-weight:700}

  .ribbon{display:flex;gap:9px;overflow:hidden}
  .rcard{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:var(--ground);
    border-radius:16px;padding:10px 8px;
    box-shadow:-4px -4px 10px var(--lit),5px 7px 15px var(--shade-soft)}
  .rcard b{font-size:11px;font-weight:800;color:var(--muted);direction:ltr;unicode-bidi:isolate}
  .rcard span{font-size:10px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rcard.done{box-shadow:inset 2px 3px 7px var(--shade-soft),inset -2px -2px 5px var(--lit)}
  .rcard.done span{color:var(--muted)}

  .rail{position:relative;height:12px;border-radius:6px;background:#e4e1dc;margin:6px 6px 14px;
    box-shadow:inset 2px 3px 6px rgba(168,160,148,.5),inset -2px -2px 5px rgba(255,255,255,.92)}
  .dot{position:absolute;top:50%;left:var(--p);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
    background:#c9962f;box-shadow:0 0 10px 2px rgba(249,206,147,.9)}
  .dot.done{background:#cfc8bf;box-shadow:none}
  .railnext{display:flex;align-items:center;gap:12px;background:var(--ground);border-radius:18px;padding:11px 14px;
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}

  .bar{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:12px}
  .bar-pill{flex:1;text-align:center;font-size:14px;font-weight:800;padding:12px 6px;border-radius:22px;
    background:var(--ground);color:var(--muted);
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}
  .bar-pill.on{color:var(--ink)}
  .bar-j{width:50px;height:50px;border-radius:50%;background:var(--ground);display:flex;align-items:center;
    justify-content:center;color:var(--muted);flex-shrink:0;
    box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--shade)}
  .bar-j svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="phone">
  <div class="cap">B · סרט היום</div>
  <div class="greet">בוקר טוב</div>
  <div class="name">Better Me</div>
  <div class="fan">
      <button class="petal" style="--a:-84.00deg;--r:150px">
        <span class="disc" style="color:#7d6aa8;--halo:rgba(191,178,224,.95)"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg></span>
        <span class="pname">תזונה</span>
      </button>
      <button class="petal" style="--a:-56.00deg;--r:150px">
        <span class="disc" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg></span>
        <span class="pname">כושר</span>
      </button>
      <button class="petal" style="--a:-28.00deg;--r:150px">
        <span class="disc" style="color:#5f9b63;--halo:rgba(191,215,180,.95)"><svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg></span>
        <span class="pname">תחביבים</span>
      </button>
      <button class="petal" style="--a:0.00deg;--r:150px">
        <span class="disc" style="color:#7a716b;--halo:rgba(205,197,188,.95)"><svg viewBox="0 0 24 24"><path d="M9.2 17.6h5.6"/><path d="M10.2 20.4h3.6"/><path d="M12 3.4a5.6 5.6 0 0 0-3.3 10.1c.5.4.8 1 .8 1.6v.4h5v-.4c0-.6.3-1.2.8-1.6A5.6 5.6 0 0 0 12 3.4Z"/></svg></span>
        <span class="pname">תובנות</span>
      </button>
      <button class="petal" style="--a:28.00deg;--r:150px">
        <span class="disc" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.6" r="3.2"/><path d="M3.6 19.6a5.6 5.6 0 0 1 11.2 0"/><path d="M16.4 6.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.6 14.6a5.6 5.6 0 0 1 2.8 5"/></svg></span>
        <span class="pname">האנשים שלי</span>
      </button>
      <button class="petal" style="--a:56.00deg;--r:150px">
        <span class="disc" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><rect x="3.6" y="5" width="16.8" height="15" rx="3"/><path d="M3.6 9.6h16.8"/><path d="M8 3.2v3.4"/><path d="M16 3.2v3.4"/></svg></span>
        <span class="pname">תכנון זמן</span>
      </button>
      <button class="petal" style="--a:84.00deg;--r:150px">
        <span class="disc" style="color:#a06b93;--halo:rgba(224,190,214,.95)"><svg viewBox="0 0 24 24"><path d="M9 3.4h6l3.2 3.1-2.3 2.2-.9-.8v12.7H7l0-12.7-.9.8L3.8 6.5Z"/></svg></span>
        <span class="pname">הארון שלי</span>
      </button>
      <button class="hub">
        <span class="hub-ic" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></span>
        <span class="hub-t">סיום יום</span>
      </button>
  </div>
  <div class="sched">
      <div class="sched-h">הלוז של היום</div>
      <div class="ribbon">
        <span class="rcard done"><b>07:00</b><span>אימון כוח</span></span>
        <span class="rcard done"><b>11:00</b><span>פגישה עם נועה</span></span>
        <span class="rcard"><b>17:00</b><span>לקנות מתנה</span></span>
        <span class="rcard"><b>20:00</b><span>שיעור גיטרה</span></span>
      </div>
    </div>
  <div class="bar">
      <span class="bar-pill on">Better</span>
      <span class="bar-j"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.4"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span>
      <span class="bar-pill">Me</span>
    </div>
</div>
</html>
