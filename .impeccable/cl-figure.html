<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הארון — the outfit as one thing</title>
<!--
  The first three were the same five lists with different shadows. This is the
  thing the screen is actually about.
  ?v=figure|tray|niche
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.44);
  --shs:rgba(176,168,156,.28);--ink:#4a453f;--muted:#7d766d;--amber:#f0a92e}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#fff}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  background:var(--g);font-family:Assistant,system-ui,sans-serif;color:var(--ink);
  display:flex;flex-direction:column}
.raise-sm{background:var(--g);box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.press{background:var(--g);box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.hd{padding:22px 16px 6px;flex-shrink:0}
.hd-t{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1}
.hd-s{font-size:12px;font-weight:600;color:var(--muted);margin-top:5px}

/* ── THE FIGURE ──
   The garments stacked touching, at the proportions CLOSET_CATS already
   carries (44/76/86/38/48). Five lists become one person. */
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:6px 0 2px}
.fig{position:relative;display:flex;flex-direction:column;align-items:center}
.pc{position:relative;display:flex;align-items:center;justify-content:center;
  width:var(--w);height:var(--h);margin-top:var(--mt,-6px)}
.pc svg{width:86%;height:86%;fill:none;stroke:#8d8478;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
/* what is NEXT in that row, peeking from both sides and half out of frame */
.nb{position:absolute;top:50%;transform:translateY(-50%);opacity:.20;
  display:flex;align-items:center;justify-content:center}
.nb svg{width:100%;height:100%;fill:none;stroke:#8d8478;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.nb.l{left:-96px}.nb.r{right:-96px}
/* the part your thumb is on */
.pc.act::after{content:"";position:absolute;inset-inline:16%;bottom:-3px;height:2px;
  border-radius:2px;background:var(--amber);
  box-shadow:0 0 12px 2px rgba(240,169,46,.6),0 0 26px 5px rgba(240,169,46,.24)}

.words{flex-shrink:0;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);
  line-height:1.7;padding:0 20px 10px}
.words b{color:var(--ink);font-weight:800}
.acts{flex-shrink:0;display:flex;gap:8px;padding:0 14px 8px}
.b{flex:1;border:none;border-radius:14px;padding:13px;font-size:12.5px;font-weight:800;
  font-family:inherit;cursor:pointer;color:var(--muted);background:var(--g);
  box-shadow:-4px -4px 9px var(--lit),5px 6px 13px var(--shs)}
.b.go{color:var(--ink)}
.small{font-size:11px}
.tag{position:absolute;top:9px;left:9px;z-index:5;font-size:9px;font-weight:800;
  letter-spacing:.1em;color:var(--muted);background:var(--g);border-radius:999px;padding:5px 10px;
  box-shadow:-2px -2px 5px var(--lit),2px 3px 6px var(--shs)}

/* ══ B. TRAY — one row opens under the figure, and only one ═══════════════ */
.tray{flex-shrink:0;margin:0 14px 10px;border-radius:18px;padding:9px 10px 10px}
.tray-l{font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--muted);margin:0 3px 7px}
.tray-r{display:flex;gap:7px;align-items:center;overflow:hidden}
.tray-c{flex-shrink:0;width:52px;height:52px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;background:var(--g)}
.tray-c svg{width:72%;height:72%;fill:none;stroke:#a89f94;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tray-c.on{box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shs)}
.tray-c.on svg{stroke:#8d8478}

/* ── WHITE LIGHT ──
   Not amber. Amber is the app's "now" signal everywhere else, but here it
   would fall on the clothes, and a warm light changes how a colour reads on
   the one screen where colour IS the decision. White says "this one" and
   says nothing about the shirt. */
.v-bars .pc.act::after,.v-bars .pc.act::before,
.v-named .pc.act::after,.v-named .pc.act::before,
.v-legend .pc.act::after,.v-legend .pc.act::before{content:"";position:absolute;
  inset-inline:6%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 26%,#fff 74%,rgba(255,255,255,0));
  box-shadow:0 0 9px 2px rgba(255,255,255,.95),0 0 22px 7px rgba(255,255,255,.55)}
.v-bars .pc.act::before,.v-named .pc.act::before,.v-legend .pc.act::before{top:-4px}
.v-bars .pc.act::after,.v-named .pc.act::after,.v-legend .pc.act::after{bottom:-4px}

/* ── THE LEGEND THAT MOVES ──
   The name of the row rides the upper light bar. One label instead of five. */
.nm{display:none}
/* one line over the recess, naming whatever the thumb is on */
.legend{flex-shrink:0;text-align:center;font-size:10px;font-weight:800;
  letter-spacing:.07em;color:var(--muted);padding:2px 0 8px}
.legend b{color:var(--ink);font-weight:800;font-size:11.5px;letter-spacing:0}
.nm b{color:var(--ink);font-weight:800}
/* the fuller legend: every part says its own name, out at the edge */
.v-legend .nm{display:block;position:absolute;top:50%;transform:translateY(-50%);
  inset-inline-start:auto;inset-inline-end:-104px;font-size:9px;font-weight:800;
  letter-spacing:.07em;color:var(--muted);white-space:nowrap;opacity:.5}
.v-legend .pc.act .nm{opacity:1}

/* ── THE TWO LIGHTS ──
   Above the whole outfit and below it. They belong to the figure, not to
   whichever piece the thumb happens to be on. */
.v-final .fig{position:relative}
.v-final .fig::before,.v-final .fig::after{content:"";position:absolute;
  inset-inline:-22px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 24%,#fff 76%,rgba(255,255,255,0));
  box-shadow:0 0 9px 2px rgba(255,255,255,.95),0 0 24px 8px rgba(255,255,255,.55)}
.v-final .fig::before{top:-16px}
.v-final .fig::after{bottom:-16px}
/* nothing singles out one garment any more */
.v-final .pc.act::before,.v-final .pc.act::after{display:none}
/* every part says its name, on the RIGHT - which is inline-start in Hebrew */
.v-final .nm{display:block;position:absolute;top:50%;transform:translateY(-50%);
  inset-inline-start:-104px;inset-inline-end:auto;font-size:9px;font-weight:800;
  letter-spacing:.07em;color:var(--muted);white-space:nowrap;opacity:.5;text-align:start}
.v-final .pc.act .nm{opacity:1}
.v-final .pc.act .nm b{color:var(--ink)}
/* and the add stays the last thing in the strip you are standing in */
.v-final .add{left:-112px}
.v-final .nb.l{left:-62px}
.v-final .nb.r{right:-62px}
.v-final .stage{padding:6px 12px 2px}
.v-final .niche{flex:1;width:100%;border-radius:150px 150px 26px 26px;
  display:flex;align-items:center;justify-content:center;
  background:var(--g);box-shadow:inset 5px 7px 14px var(--sh),inset -5px -5px 12px var(--lit)}

/* ── WHERE A GARMENT GETS IN ──
   The last thing in every strip, so the category is wherever you stood. */
.add{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:var(--muted);font-family:inherit;
  background:var(--g);box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shs);
  border:none;cursor:pointer;left:-112px}

/* the same two bars, but lighting the whole recess instead of one garment */
.v-lamp .niche{position:relative;overflow:hidden}
.v-lamp .niche::before,.v-lamp .niche::after{content:"";position:absolute;
  inset-inline:16%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 26%,#fff 74%,rgba(255,255,255,0));
  box-shadow:0 0 10px 2px rgba(255,255,255,.95),0 0 28px 9px rgba(255,255,255,.5)}
.v-lamp .niche::before{top:26px}
.v-lamp .niche::after{bottom:18px}

/* ══ C. NICHE — the figure stands in a recess, like a long mirror ═════════ */
.v-niche .stage,.v-bars .stage,.v-lamp .stage{padding:6px 22px 2px}
.v-named .stage,.v-legend .stage{padding:6px 12px 2px}
.v-niche .niche,.v-bars .niche,.v-lamp .niche,.v-named .niche,.v-legend .niche{flex:1;width:100%;border-radius:150px 150px 26px 26px;
  display:flex;align-items:center;justify-content:center;
  background:var(--g);box-shadow:inset 5px 7px 14px var(--sh),inset -5px -5px 12px var(--lit)}
.v-niche .nb.l,.v-bars .nb.l,.v-lamp .nb.l{left:-70px}
/* the neighbours pull in, so the add at the end of the strip stays whole */
.v-named .nb.l,.v-legend .nb.l{left:-62px}
.v-niche .nb.r,.v-bars .nb.r,.v-lamp .nb.r{right:-70px}
.v-named .nb.r,.v-legend .nb.r{right:-62px}
/* in the lamp the whole outfit is lit, so nothing is singled out */
.v-lamp .pc.act::after{display:none}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
var G={
 hat:'<path d="M4 17h16"/><path d="M7 17c0-5 2.2-8 5-8s5 3 5 8"/>',
 top:'<path d="M8.5 4 5 6.5l1.6 3.2L8 9v10.5h8V9l1.4.7L19 6.5 15.5 4a3.5 3.5 0 0 1-7 0Z"/>',
 bottom:'<path d="M7 4h10l1 16h-4l-2-9-2 9H6Z"/>',
 socks:'<path d="M8 4h4v8.5c0 2 1 2.8 2.6 3.6l1.6.8a2.4 2.4 0 0 1-2.2 4.3l-2.6-1.3C9.2 18.6 8 16.6 8 14Z"/>',
 shoes:'<path d="M3.5 17.5h7.2c1.8 0 3.2-1.4 4.6-1.4H20a1.5 1.5 0 0 1 0 3H3.5Z"/><path d="M3.5 17.5V8.8h3l1.8 3.4 2.4 1.4"/>'
};
/* the heights CLOSET_CATS already carries, scaled to the stage */
var BODY=[
 {k:'hat',   t:'כובע',     w:78,  h:60,  mt:0},
 {k:'top',   t:'חולצות',   w:132, h:104, mt:-10},
 {k:'bottom',t:'מכנסיים',  w:118, h:118, mt:-12},
 {k:'socks', t:'גרביים',   w:70,  h:52,  mt:-8},
 {k:'shoes', t:'נעליים',   w:104, h:62,  mt:-6}
];
var COUNT={hat:5,top:12,bottom:9,socks:6,shoes:7};
/* the variant has to be known before the pieces are drawn */
var v=(location.search.match(/v=(\w+)/)||[])[1]||'figure';
var ACT=1;   /* the part the thumb is on: the shirt */
function piece(p,i){
  var nb='';
  if(i===ACT){
    nb='<span class="nb l" style="width:'+p.w*.8+'px;height:'+p.h*.8+'px"><svg viewBox="0 0 24 24">'+G[p.k]+'</svg></span>'+
       '<span class="nb r" style="width:'+p.w*.8+'px;height:'+p.h*.8+'px"><svg viewBox="0 0 24 24">'+G[p.k]+'</svg></span>';
  }
  var showName=(v==='legend')||(v==='final')||(v==='named'&&i===ACT);
  var nm=showName?'<span class="nm"><b>'+p.t+'</b> \u00b7 '+COUNT[p.k]+'</span>':'';
  var add=(i===ACT&&(v==='named'||v==='legend'||v==='final'))?'<button class="add">+</button>':'';
  return '<div class="pc'+(i===ACT?' act':'')+'" style="--w:'+p.w+'px;--h:'+p.h+'px;--mt:'+p.mt+'px">'+
         '<svg viewBox="0 0 24 24">'+G[p.k]+'</svg>'+nb+nm+add+'</div>';
}
function figure(){
  var h='<div class="fig">',i;
  for(i=0;i<BODY.length;i++)h+=piece(BODY[i],i);
  return h+'</div>';
}
var NAMES={figure:'A · הדמות',tray:'B · מגש',niche:'C · גומחה',final:'D · שתי האורות',named:'D · שם נוסע',legend:'D2 · מקרא מלא',bars:'D · שני פסים',lamp:'E · גומחה מוארת'};

var h='<div class="tag">'+NAMES[v]+'</div>';
h+='<div class="hd"><div class="hd-t">הארון שלי</div>'+
   '<div class="hd-s">גלגל כל חלק עד שזה נראה טוב</div></div>';

if(v==='final'){
  h+='<div class="stage"><div class="niche">'+figure()+'</div></div>';
}
else if(v==='named'||v==='legend'){
  var A=BODY[ACT];
  h+='<div class="legend"><b>'+A.t+'</b> \u00b7 '+COUNT[A.k]+'</div>';
  h+='<div class="stage"><div class="niche">'+figure()+'</div></div>';
}
else if(v==='niche'||v==='bars'||v==='lamp')h+='<div class="stage"><div class="niche">'+figure()+'</div></div>';
else h+='<div class="stage">'+figure()+'</div>';

if(v==='tray'){
  h+='<div class="tray press"><div class="tray-l">חולצות · 12</div><div class="tray-r">';
  for(var t=0;t<6;t++)h+='<div class="tray-c'+(t===2?' on':'')+'"><svg viewBox="0 0 24 24">'+G.top+'</svg></div>';
  h+='</div></div>';
}else{
  h+='<div class="words">חולצה לבנה · <b>ג׳ינס כהה</b> · סניקרס</div>';
}
h+='<div class="acts"><button class="b">&#127922; גלגל הכל</button>'+
   '<button class="b go">שמור לוק</button></div>';
h+='<div class="acts"><button class="b small go">לבשתי את זה היום</button>'+
   '<button class="b small">הלוקים שלי (7)</button></div>';
document.getElementById('frame').innerHTML=h;
document.getElementById('frame').className='frame v-'+v;
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
