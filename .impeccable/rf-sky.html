<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>סיום יום — the four, on the sky</title>
<!--
  Direction 13, built with the real questions.
  Every string here is lifted verbatim from RF_STAGE1 in dev/index.html - which
  is the whole reason this is built rather than generated: the image model
  rewrote our questions every single time.

  No glass, no card, no panel. The question and the answer ARE the surface,
  which is what the reflection's own code comment has always said; it just
  said it on cream paper. The one lit thing is the writing line.
  ?q=1..4
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#080b14}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  font-family:Assistant,system-ui,sans-serif}

/* ── THE SKY ──
   Night at the top, the day's last light at the foot. Built from gradients so
   it can follow the hour later instead of being a fixed picture. */
.sky{position:absolute;inset:0;z-index:0;
  background:
    /* the sunset, low and wide */
    radial-gradient(170% 46% at 50% 102%,#e79a44 0%,#c86f2d 11%,#8d4f47 26%,#4a3c58 46%,#2a2c4a 62%,transparent 80%),
    /* the night above it */
    linear-gradient(180deg,#0b1224 0%,#101a31 34%,#16203a 62%,#1d2743 100%)}
/* the milky way: one soft diagonal band of dust, not a colour */
.mw{position:absolute;inset:-30%;z-index:0;transform:rotate(-32deg);
  background:
    radial-gradient(60% 9% at 50% 44%,rgba(214,220,244,.30),transparent 72%),
    radial-gradient(34% 6% at 33% 47%,rgba(236,222,230,.26),transparent 70%),
    radial-gradient(26% 4.5% at 66% 41%,rgba(196,210,242,.24),transparent 70%),
    radial-gradient(48% 14% at 50% 45%,rgba(150,160,200,.13),transparent 76%);
  filter:blur(9px)}
/* the dark lane that splits the band, which is what makes it read as dust */
.mw::after{content:"";position:absolute;inset:0;
  background:radial-gradient(46% 2.4% at 47% 45%,rgba(16,18,34,.55),transparent 72%);
  filter:blur(5px)}
.stars i{position:absolute;background:#fff;border-radius:50%}
/* the photographed sky: one image, and the drawing untouched over it */
.photo{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover}
/* ── THE HOUR, LIVE ──
   The colour of the sky is what carries the hour, and a gradient does that
   perfectly - it is what the app's own .sky layer already does. What the
   photograph gave that a gradient cannot is TEXTURE: dust, grain, a real
   star field. Texture does not need to know the hour.

   So the two jobs are split. The gradient below is live and follows the
   clock; the photograph above it is reduced to its light alone by screen
   blending, which adds its stars to whatever colour the hour is and
   contributes nothing where it is dark. One small file serves every hour. */
.grad{position:absolute;inset:0;z-index:0;transition:background 1.6s ease}
.tex{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;
  mix-blend-mode:screen;filter:grayscale(.55) contrast(1.15);
  transition:opacity 1.6s ease;
  /* the middle and the foot stay quiet whatever the picture does: the words
     live in the middle, and the low light belongs to the gradient, not to a
     sunset baked into a photograph */
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.28) 44%,transparent 62%);
  mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.28) 44%,transparent 62%)}
/* the type sits in the calm middle of the frame, but a night photograph is
   never uniform - one wide, edgeless darkening keeps the words readable
   without putting a shape on the screen */
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(112% 46% at 50% 46%,rgba(6,8,16,.46),rgba(6,8,16,.16) 58%,transparent 78%)}
.moon{position:absolute;z-index:1;top:92px;right:296px;width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#f4f1e6,#cfc9b8 62%,#9c9689);
  box-shadow:0 0 22px 7px rgba(226,220,200,.16)}
/* the ground the last light sinks into - a haze, not a drawn hill */
.ridge{position:absolute;z-index:1;inset-inline:0;bottom:0;height:120px;
  background:linear-gradient(180deg,transparent,rgba(26,18,24,.30) 46%,rgba(14,11,18,.72) 100%)}

/* ── THE PAGE ── type and one line, and nothing else */
.pg{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding:26px 26px 30px}
.top{display:flex;align-items:center;gap:12px;min-height:30px;flex-shrink:0;justify-content:center}
.bar{width:160px;height:1.5px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
.bar-f{height:100%;background:rgba(255,255,255,.85);border-radius:2px}
.chev{color:rgba(255,255,255,.55);font-size:15px;line-height:1}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.q{font-size:28px;font-weight:800;line-height:1.38;color:#f4f1ea;letter-spacing:-.3px;
  text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{font-size:12.5px;font-weight:600;color:#b9b3c4;line-height:1.65;margin-top:12px;
  text-shadow:0 1px 12px rgba(0,0,0,.5)}

/* ── THE ONE LIT THING ──
   A warm line lying on the sky, brightest where you are writing and fading to
   nothing at both ends. The same idea the nutrition screen was approved on:
   light inside a channel - only here the channel is under your own words. */
.write{margin-top:34px;position:relative;min-height:56px;display:flex;
  flex-direction:column;justify-content:flex-end}
.wtext{font-size:17px;line-height:1.6;color:#f4f1ea;padding:0 4px 11px;
  unicode-bidi:plaintext;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.wtext.ph{color:#8f8aa0}
.line{height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,214,150,0),rgba(255,226,180,.95) 32%,#fff0d2 50%,rgba(255,226,180,.95) 68%,rgba(255,214,150,0));
  box-shadow:0 0 14px 1px rgba(255,205,140,.55),0 0 34px 5px rgba(255,190,110,.22)}
/* the caret, sitting on the line where the light is brightest */
.caret{position:absolute;bottom:0;left:50%;width:1.5px;height:22px;
  background:#fff0d2;box-shadow:0 0 12px 2px rgba(255,214,150,.75)}

/* the photo answer, in the same language: a glyph over the lit line */
.glyph{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.glyph svg{width:21px;height:21px;fill:none;stroke:#e6e1d6;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
/* the song, once it has a name */
.artist{font-size:12px;font-weight:600;color:#b9b3c4;margin-top:11px}

.next{width:100%;border:none;border-radius:999px;padding:16px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;color:#231f2b;background:#f6f3ec;margin-top:24px;
  flex-shrink:0;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.ghost{width:100%;background:none;border:none;padding:13px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,.78);cursor:pointer;font-family:inherit;
  text-shadow:0 1px 10px rgba(0,0,0,.65)}
.tag{position:absolute;top:10px;left:10px;z-index:4;font-size:9px;font-weight:800;
  letter-spacing:.1em;color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
/* verbatim from RF_STAGE1 */
var Q=[
 {q:'מה היה הרגע הכי טוב שלך היום?',sub:'',ph:'אפילו רגע קטן.',kind:'text'},
 {q:'איזו תמונה מספרת את היום שלך?',sub:'זה יכול להיות רגע, מקום, אדם, משהו שעשית — או פשוט תמונה שמרגישה כמו היום שעבר עליך.',kind:'photo'},
 {q:'מה השיר של היום שלך?',sub:'איזה שיר הכי מתאים למה שעבר עליך היום?',ph:'שם השיר',kind:'song'},
 {q:'יש משפט שלקחת איתך היום?',sub:'משהו ששמעת, קראת או חשבת ולא עזב אותך.',ph:'משפט, מחשבה, רגע...',kind:'text'}
];
/* a fixed seed, so the sky is the same picture every time it is judged */
function stars(){
  var h='<div class="stars">',i,x,y,s,o,seed=11;
  function r(){seed=(seed*9301+49297)%233280;return seed/233280;}
  for(i=0;i<430;i++){
    x=(r()*100).toFixed(2); y=(r()*86).toFixed(2);
    /* the band is denser and brighter along the diagonal */
    var d=Math.abs((100-x)*0.62-y+6), near=d<13;
    s=(near?.7+r()*1.5:.5+r()*.9).toFixed(2);
    o=(near?.4+r()*.58:.1+r()*.34).toFixed(2);
    h+='<i style="left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;opacity:'+o+'"></i>';
  }
  return h+'</div>';
}
var n=Math.min(4,Math.max(1,+((location.search.match(/q=(\d)/)||[])[1]||1)));
var q=Q[n-1];

var sky=(location.search.match(/sky=(\w+)/)||[])[1]||'a';
/* The reflection cannot reuse the app's six sky colours: those are daylight
   pastels for a cream page, and white type would vanish on them at noon. Same
   six moments, rewritten dark enough to hold the words at every hour. */
var RF_SKY={
  night:  {a:'#0b1224',b:'#1d2743',low:'#2a2c4a',warm:'#3a3352',tex:.62},
  dawn:   {a:'#141a33',b:'#2d2a4a',low:'#5b3f52',warm:'#8a5a4e',tex:.34},
  morning:{a:'#1b2742',b:'#2e3c5c',low:'#4a5573',warm:'#6a7590',tex:.12},
  day:    {a:'#22314f',b:'#35456a',low:'#53628a',warm:'#7c88a8',tex:.06},
  golden: {a:'#161c33',b:'#33294a',low:'#7a4a45',warm:'#c47a3a',tex:.30},
  dusk:   {a:'#0e1428',b:'#231f43',low:'#4a3552',warm:'#a05a45',tex:.48}
};
var hour=(location.search.match(/hour=(\w+)/)||[])[1]||'';
var P=RF_SKY[hour];
var h = P
  ? '<div class="grad" style="background:'+
      'radial-gradient(170% 44% at 50% 102%,'+P.warm+' 0%,'+P.low+' 22%,'+P.b+' 52%,transparent 78%),'+
      'linear-gradient(180deg,'+P.a+' 0%,'+P.b+' 100%)"></div>'+
    '<div class="tex" style="background-image:url(sky/'+sky+'.png);opacity:'+P.tex+'"></div>'+
    '<div class="scrim"></div>'
  : (sky==='css')
  ? '<div class="sky"></div><div class="mw"></div>'+stars()+'<div class="moon"></div><div class="ridge"></div>'
  : '<div class="photo" style="background-image:url(sky/'+sky+'.png)"></div><div class="scrim"></div>';
h+='<div class="tag">'+n+' / 4</div>';
h+='<div class="pg">';
h+='<div class="top"><div class="bar"><div class="bar-f" style="width:'+(n*25)+'%"></div></div>'+
   '<span class="chev">&#8250;</span></div>';
h+='<div class="body">';
h+='<div class="q">'+q.q+'</div>';
if(q.sub)h+='<div class="sub">'+q.sub+'</div>';

if(q.kind==='text'){
  h+='<div class="write">'+
     (n===1
       ? '<div class="wtext">הלכנו ברגל הביתה מהים והשמש ירדה בדיוק כשעברנו את הגשר.</div>'
       : '<div class="wtext ph">'+q.ph+'</div>')+
     '<div class="line"></div>'+(n===1?'<div class="caret"></div>':'')+'</div>';
}
else if(q.kind==='photo'){
  h+='<div class="write"><div class="glyph"><svg viewBox="0 0 24 24">'+
     '<rect x="3" y="5.5" width="18" height="14" rx="3"/><circle cx="12" cy="12.5" r="3.4"/>'+
     '<path d="M8.2 5.5 9.6 3.4h4.8l1.4 2.1"/></svg></div>'+
     '<div class="line"></div></div>';
}
else if(q.kind==='song'){
  h+='<div class="write"><div class="wtext">שביל החלב</div><div class="line"></div></div>'+
     '<div class="artist">שלמה ארצי</div>';
}
h+='</div>';
h+='<button class="next">המשך</button>';
if(n===1)h+='<button class="ghost">לא עכשיו</button>';
h+='</div>';
document.getElementById('frame').innerHTML=h;
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
