<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: nutrition-full.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#ece6f5}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:752px">
  <div class="r-clock region chrome" data-region="clock"><!-- system clock belongs to the phone, not the page --></div>
  <div class="r-status region chrome" data-region="status"><!-- system status icons belong to the phone, not the page --></div>
  <div class="r-back region control" data-region="back"><!-- round translucent white back button with a chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop back); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-title region text" data-region="title"><!-- Nutrition, dark navy, bold, centred --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-date region text" data-region="date"><!-- Saturday, 19 September between two small chevrons --><p style="font-size:var(--r-date-font);line-height:1.05;margin:0">date</p></div>
  <div class="r-tabs region control" data-region="tabs"><!-- translucent segmented control History, Today (selected, whiter), Recipes, Profile: rebuild the control's chrome from the crop (comp-spec.mjs --crop tabs); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-tubes-card region chrome" data-region="tubes-card"><!-- translucent white card with a thin light border holding the four tubes --></div>
  <div class="r-tubes-title region text" data-region="tubes-title"><!-- Today, dark navy, bold --><p style="font-size:var(--r-tubes-title-font);line-height:1.05;margin:0">tubes-title</p></div>
  <figure class="r-tube-cal region plate" data-region="tube-cal"><img src="../../../assets/plates/tube-cal.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-tube-pro region plate" data-region="tube-pro"><img src="../../../assets/plates/tube-pro.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-tube-carb region plate" data-region="tube-carb"><img src="../../../assets/plates/tube-carb.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-tube-fat region plate" data-region="tube-fat"><img src="../../../assets/plates/tube-fat.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-tube-labels region text" data-region="tube-labels"><!-- Calories, Protein, Carbs, Fat in bold navy with value / target in grey under each --><p style="font-size:var(--r-tube-labels-font);line-height:1.05;margin:0">tube-labels</p></div>
  <div class="r-chip-kcal region control" data-region="chip-kcal"><!-- translucent white chip: orange flame line icon, 495 kcal, left today: rebuild the control's chrome from the crop (comp-spec.mjs --crop chip-kcal); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chip-p region control" data-region="chip-p"><!-- translucent white chip: coral line icon, 51 g, left today: rebuild the control's chrome from the crop (comp-spec.mjs --crop chip-p); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chip-c region control" data-region="chip-c"><!-- translucent white chip: green line icon, 50 g, left today: rebuild the control's chrome from the crop (comp-spec.mjs --crop chip-c); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chip-f region control" data-region="chip-f"><!-- translucent white chip: blue drop line icon, 15 g, left today: rebuild the control's chrome from the crop (comp-spec.mjs --crop chip-f); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-water-card region chrome" data-region="water-card"><!-- translucent white card for water --></div>
  <div class="r-water-title region text" data-region="water-title"><!-- blue drop icon and Water, navy --><p style="font-size:var(--r-water-title-font);line-height:1.05;margin:0">water-title</p></div>
  <figure class="r-water-tube region plate" data-region="water-tube"><img src="../../../assets/plates/water-tube.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-water-value region text" data-region="water-value"><!-- 1,500 / 3,000 ml --><p style="font-size:var(--r-water-value-font);line-height:1.05;margin:0">water-value</p></div>
  <div class="r-water-buttons region control" data-region="water-buttons"><!-- two small translucent pill buttons +250 and +500: rebuild the control's chrome from the crop (comp-spec.mjs --crop water-buttons); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-meals-card region chrome" data-region="meals-card"><!-- translucent white card holding the meals --></div>
  <div class="r-meals-title region text" data-region="meals-title"><!-- Meals, navy, bold --><p style="font-size:var(--r-meals-title-font);line-height:1.05;margin:0">meals-title</p></div>
  <div class="r-meal-1 region control" data-region="meal-1"><!-- row: yellow sun icon, Breakfast, 520 kcal, chevron, in a lighter translucent row: rebuild the control's chrome from the crop (comp-spec.mjs --crop meal-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-meal-2 region control" data-region="meal-2"><!-- rows: green fork icon Lunch 680 kcal, purple apple icon Snack 280 kcal: rebuild the control's chrome from the crop (comp-spec.mjs --crop meal-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-fab region control" data-region="fab"><!-- round translucent white add button with a plus: rebuild the control's chrome from the crop (comp-spec.mjs --crop fab); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-tabbar region control" data-region="tabbar"><!-- translucent tab bar: Better with a leaf icon selected, Journal, Me: rebuild the control's chrome from the crop (comp-spec.mjs --crop tabbar); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
