<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>הרצף כעיגול</title>
<!--
  Three readings of "a soft circle on the left, without words", shown as a
  picture so that nothing has to be written into the app before it is chosen.
  None of them is amber: amber is the clock now.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
  :root{--ground:#e9e7e3;--lit:rgba(255,255,255,.95);--shade-soft:rgba(176,168,156,.28);
    --ink:#4a453f;--muted:#8a827a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);font:400 15px/1.45 'Assistant',system-ui,sans-serif;color:var(--ink)}
  .rack{display:flex;gap:26px;padding:28px 20px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;width:96px}
  .cap{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-align:center;line-height:1.3}
  .stk{width:46px;height:46px;border-radius:50%;background:var(--ground);border:none;padding:0;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    box-shadow:-4px -4px 10px var(--lit),5px 7px 15px var(--shade-soft)}
  /* 1 · the flame over the number */
  .v1 .f{font-size:11px;line-height:1}
  .v1 .n{font-size:15px;font-weight:800;line-height:1.1;color:var(--ink)}
  /* 2 · the number alone, warmth behind it */
  .v2 .f{display:none}
  .v2 .n{font-size:18px;font-weight:800;color:#b5715c}
  .v2.stk{box-shadow:-4px -4px 10px var(--lit),5px 7px 15px var(--shade-soft),0 0 15px 4px rgba(240,190,170,.85)}
  /* 3 · the flame alone, the number as a mark */
  .v3{overflow:visible}
  .v3 .f{font-size:19px;line-height:1}
  .v3 .n{position:absolute;bottom:-2px;inset-inline-start:-2px;min-width:19px;height:19px;border-radius:10px;
    font-size:10px;font-weight:800;color:var(--ink);background:var(--ground);
    display:flex;align-items:center;justify-content:center;
    box-shadow:-1px -1px 3px var(--lit),2px 2px 5px var(--shade-soft)}
</style>
<div class="rack">
  <div class="col"><button class="stk v1"><span class="f">🔥</span><span class="n">2</span></button>
    <span class="cap">1 · להבה מעל המספר</span></div>
  <div class="col"><button class="stk v2"><span class="f">🔥</span><span class="n">2</span></button>
    <span class="cap">2 · רק המספר, האור נושא את החום</span></div>
  <div class="col"><button class="stk v3"><span class="f">🔥</span><span class="n">2</span></button>
    <span class="cap">3 · רק הלהבה, המספר כסימן</span></div>
</div>
</html>
