<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Nutrition — the chosen design</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  The design Asaf chose (.impeccable/mocks/screen/glow-i2-both.png), rebuilt as
  a real page so live mode can edit it element by element. Every colour here was
  SAMPLED out of that image, not chosen: ground #e9e7e3, surfaces #e8e6e3,
  fills #f9ce93 #fdb7a7 #bfd7b4 #b2cded.
  This is not the app. It is the drawing, made editable. Nothing here ships
  until it is ported into dev/index.html deliberately.
-->
<style>
  :root{
    --ground:#e9e7e3;
    --lit:rgba(255,255,255,.95);
    --shade:rgba(176,168,156,.45);
    --shade-soft:rgba(176,168,156,.28);
    --ink:#4a453f;
    --muted:#8a827a;
    --cal:#f9ce93; --pro:#fdb7a7; --carb:#bfd7b4; --fat:#b2cded;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#cfccc7}
  body{font:400 15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);
    display:flex;justify-content:center;min-height:100vh}
  /* one phone, so the soft material is judged at the size it will be used */
  .phone{width:376px;min-height:812px;background:var(--ground);padding:22px 18px 18px;display:flex;flex-direction:column;gap:16px}

  /* ── THE TUBES ── the hero: four channels pressed into a raised panel */
  .tubes{background:var(--ground);border-radius:28px;padding:22px 18px 18px;
    box-shadow:-9px -9px 20px var(--lit),11px 14px 30px var(--shade)}
  .tube-row{display:flex;justify-content:space-around;align-items:flex-end}
  .tube{width:36px;height:196px;border-radius:18px;background:#e4e1dc;position:relative;overflow:hidden;
    box-shadow:inset 3px 5px 9px rgba(168,160,148,.55),inset -3px -3px 7px rgba(255,255,255,.95)}
  .fill{position:absolute;left:0;right:0;bottom:0;border-radius:18px}
  /* No light above the colour: Asaf picked this over both glow variants -
     "i dont want the color to have an extra light above it". The fill ends
     where it ends, and the empty part of the channel stays the material. */
  .t1 .fill{height:75%;background:var(--cal)}
  .t2 .fill{height:64%;background:var(--pro)}
  .t3 .fill{height:68%;background:var(--carb)}
  .t4 .fill{height:71%;background:var(--fat)}
  .tube-labels{display:flex;justify-content:space-around;margin-top:14px;text-align:center}
  .tl{width:76px}
  .tl b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
  .tl span{display:block;font-size:12px;color:var(--muted);margin-top:2px;direction:ltr;unicode-bidi:isolate}

  /* ── A ROW ── the ground raised into a pill, with one lit disc on it */
  .row{display:flex;align-items:center;gap:14px;background:var(--ground);border-radius:22px;padding:13px 16px;
    box-shadow:-6px -6px 14px var(--lit),7px 9px 20px var(--shade-soft)}
  .disc{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--ground);
    display:flex;align-items:center;justify-content:center;
    box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft)}
  .disc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  /* the colour is light: the glyph takes it, and the same colour leaks from
     behind the disc onto the ground beside it */
  .d-water{color:#5b8fc9;box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 15px 4px rgba(178,205,237,.95)}
  .d-dawn {color:#c9962f;box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 15px 4px rgba(249,206,147,.95)}
  .d-noon {color:#5f9b63;box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 15px 4px rgba(191,215,180,.95)}
  .d-dusk {color:#c4726c;box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 15px 4px rgba(253,183,167,.95)}
  .row-name{flex:1}
  .row-name b{display:block;font-size:15px;font-weight:600}
  .row-name span{font-size:13px;color:var(--muted)}
  .row-val{font-size:14px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
  .row-val b{color:var(--ink);font-weight:600;margin-inline-start:6px}

  /* ── THE WRITE-LINE ── the one lit bar on the screen */
  .write{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;
    background:var(--ground);border-radius:24px;padding:16px;font-size:15px;color:var(--ink);
    box-shadow:-6px -6px 14px var(--lit),7px 9px 20px var(--shade-soft),
      0 0 22px 5px rgba(255,226,170,.9),0 0 46px 12px rgba(255,214,140,.45)}
  .write svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

  /* ── THE TAB BAR ── one raised pill, four quiet glyphs */
  .tabs{margin-top:auto;display:flex;justify-content:space-around;align-items:center;
    background:var(--ground);border-radius:24px;padding:14px;color:var(--muted);
    box-shadow:-6px -6px 14px var(--lit),7px 9px 20px var(--shade-soft)}
  .tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>

<div class="phone">
  <div class="tubes">
    <div class="tube-row">
      <div class="tube t1"><div class="fill"></div></div>
      <div class="tube t2"><div class="fill"></div></div>
      <div class="tube t3"><div class="fill"></div></div>
      <div class="tube t4"><div class="fill"></div></div>
    </div>
    <div class="tube-labels">
      <div class="tl"><b>Calories</b><span>1,480 / 1,975</span></div>
      <div class="tl"><b>Protein</b><span>96 / 150 g</span></div>
      <div class="tl"><b>Carbs</b><span>142 / 210 g</span></div>
      <div class="tl"><b>Fat</b><span>44 / 62 g</span></div>
    </div>
  </div>

  <div class="row">
    <span class="disc d-water"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 6-10 6-10z"/></svg></span>
    <span class="row-name"><b>Water</b><span>1,500 / 2,400 ml</span></span>
    <span class="row-val">1.5 <b>L</b></span>
  </div>

  <div class="row">
    <span class="disc d-dawn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></span>
    <span class="row-name"><b>Breakfast</b><span>8:20</span></span>
    <span class="row-val"><b>520</b></span>
  </div>

  <div class="row">
    <span class="disc d-noon"><svg viewBox="0 0 24 24"><path d="M5.5 3v4.2M8.5 3v4.2M11.5 3v4.2M5.5 7.2h6M8.5 7.2V21M18.2 21v-9M18.2 12c-2 0-2.9-1-2.9-2.6 0-2.4 1-4.9 2.9-6.4z"/></svg></span>
    <span class="row-name"><b>Lunch</b><span>13:40</span></span>
    <span class="row-val"><b>680</b></span>
  </div>

  <div class="row">
    <span class="disc d-dusk"><svg viewBox="0 0 24 24"><path d="M12 4a6 6 0 1 0 6 8 5 5 0 0 1-6-8z"/></svg></span>
    <span class="row-name"><b>Snack</b><span>19:10</span></span>
    <span class="row-val"><b>280</b></span>
  </div>

  <div class="write">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Add what you ate
  </div>

  <div class="tabs">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 4.5-7 9-7 9z"/></svg>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
  </div>
</div>
</body>
</html>
