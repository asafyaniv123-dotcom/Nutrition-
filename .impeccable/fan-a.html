<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>A · חריץ</title>
<style>
  :root{--ground:#e9e7e3;--lit:rgba(255,255,255,.95);--shade:rgba(176,168,156,.45);
    --shade-soft:rgba(176,168,156,.28);--ink:#4a453f;--muted:#8a827a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);
    font:400 15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  /* absolute at the edge: headless will not make a window narrower than about
     500px, so a centred phone falls outside a 376px screenshot */
  .phone{position:absolute;left:0;top:0;width:376px;height:642px;background:var(--ground);
    padding:22px 18px 16px;display:flex;flex-direction:column;overflow:hidden}
  .cap{font-size:9px;letter-spacing:.16em;color:#b8afa5;font-weight:800;text-align:center;margin-bottom:10px}
  .greet{font-size:13px;color:var(--muted)}
  .name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}

  .disc{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--ground);flex-shrink:0;width:var(--d);height:var(--d);
    box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 14px 3px var(--halo)}
  .disc svg{width:calc(var(--d) * .46);height:calc(var(--d) * .46);fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .fan{position:relative;flex:1}
  /* physical left with a physical margin: mixing a logical offset with a
     physical one is what threw the arc off centre in Hebrew */
  .petal{position:absolute;left:50%;top:var(--top);width:var(--d);margin-left:calc(var(--d) / -2);
    border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:5px;
    transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1))}
  .pname{font-size:8.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .hub{position:absolute;left:50%;top:var(--top);width:var(--hub);height:var(--hub);
    margin:calc(var(--hub) / -2) 0 0 calc(var(--hub) / -2);border-radius:50%;background:var(--ground);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    box-shadow:inset 4px 5px 10px var(--shade),inset -4px -4px 9px var(--lit)}
  .hub b{font-size:21px;font-weight:800}
  .hub span{font-size:9px;color:var(--muted)}
  /* the groove: a channel pressed into the ground for the discs to sit in */
  .groove{position:absolute;left:50%;top:var(--top);width:calc(var(--r2) * 2);height:calc(var(--r2) * 2);
    margin:calc(var(--r2) * -1) 0 0 calc(var(--r2) * -1);border-radius:50%;pointer-events:none;
    box-shadow:inset 2px 3px 6px rgba(168,160,148,.45),inset -2px -2px 5px rgba(255,255,255,.9)}

  .bar{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:14px}
  .bar-pill{flex:1;text-align:center;font-size:14px;font-weight:800;padding:13px 6px;border-radius:22px;
    background:var(--ground);color:var(--muted);
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}
  .bar-pill.on{color:var(--ink)}
  .bar-j{width:52px;height:52px;border-radius:50%;background:var(--ground);display:flex;align-items:center;
    justify-content:center;color:var(--muted);flex-shrink:0;
    box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--shade)}
  .bar-j svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="phone" style="--d:42px;--hub:104px;--top:58%;--r2:140px">
  <div class="cap">A · חריץ</div>
  <div class="greet">בוקר טוב</div>
  <div class="name">Better Me</div>
  <div class="fan">
      <div class="groove"></div>
      <button class="petal" style="--a:-75.00deg;--r:140px" title="תזונה">
        <span class="disc" style="color:#7d6aa8;--halo:rgba(191,178,224,.95)"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg></span>
      </button>
      <button class="petal" style="--a:-53.57deg;--r:140px" title="כושר">
        <span class="disc" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg></span>
      </button>
      <button class="petal" style="--a:-32.14deg;--r:140px" title="תחביבים">
        <span class="disc" style="color:#5f9b63;--halo:rgba(191,215,180,.95)"><svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg></span>
      </button>
      <button class="petal" style="--a:-10.71deg;--r:140px" title="סיום יום">
        <span class="disc" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></span>
      </button>
      <button class="petal" style="--a:10.71deg;--r:140px" title="תובנות">
        <span class="disc" style="color:#7a716b;--halo:rgba(205,197,188,.95)"><svg viewBox="0 0 24 24"><path d="M9.2 17.6h5.6"/><path d="M10.2 20.4h3.6"/><path d="M12 3.4a5.6 5.6 0 0 0-3.3 10.1c.5.4.8 1 .8 1.6v.4h5v-.4c0-.6.3-1.2.8-1.6A5.6 5.6 0 0 0 12 3.4Z"/></svg></span>
      </button>
      <button class="petal" style="--a:32.14deg;--r:140px" title="האנשים שלי">
        <span class="disc" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.6" r="3.2"/><path d="M3.6 19.6a5.6 5.6 0 0 1 11.2 0"/><path d="M16.4 6.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.6 14.6a5.6 5.6 0 0 1 2.8 5"/></svg></span>
      </button>
      <button class="petal" style="--a:53.57deg;--r:140px" title="תכנון זמן">
        <span class="disc" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><rect x="3.6" y="5" width="16.8" height="15" rx="3"/><path d="M3.6 9.6h16.8"/><path d="M8 3.2v3.4"/><path d="M16 3.2v3.4"/></svg></span>
      </button>
      <button class="petal" style="--a:75.00deg;--r:140px" title="הארון שלי">
        <span class="disc" style="color:#a06b93;--halo:rgba(224,190,214,.95)"><svg viewBox="0 0 24 24"><path d="M9 3.4h6l3.2 3.1-2.3 2.2-.9-.8v12.7H7l0-12.7-.9.8L3.8 6.5Z"/></svg></span>
      </button>
      <div class="hub"><b>4</b><span>נכתבו היום</span></div>
  </div>
  <div class="bar">
      <span class="bar-pill on">Better</span>
      <span class="bar-j"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.4"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span>
      <span class="bar-pill">Me</span>
    </div>
</div>
</html>
