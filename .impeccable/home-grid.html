<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>Home 2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Built from dev/index.html: the areas, their titles and their icons are the
  app's own. Nothing here is loaded by the app; it is a place to look.
-->
<style>
  :root{--ground:#e9e7e3;--lit:rgba(255,255,255,.95);--shade:rgba(176,168,156,.45);
    --shade-soft:rgba(176,168,156,.28);--ink:#4a453f;--muted:#8a827a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);
    font:400 15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  .phone{width:100%;max-width:376px;min-height:642px;margin:0 auto;background:var(--ground);
    padding:22px 18px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .cap{font-size:9px;letter-spacing:.16em;color:#b8afa5;font-weight:800;text-align:center;margin-bottom:10px}
  .greet{font-size:13px;color:var(--muted)}
  .name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px}

  /* one icon treatment everywhere: the ground raised into a disc, the glyph in
     its own colour, and the same colour leaking out from behind it */
  .disc{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--ground);flex-shrink:0;
    box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--shade-soft),0 0 14px 3px var(--halo)}
  .d1{width:40px;height:40px}.d1 svg{width:19px;height:19px}
  .d2{width:42px;height:42px}.d2 svg{width:20px;height:20px}
  .disc svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* 1 - the fan. Physical left with a physical margin: mixing a logical
     offset with a physical one is what threw the arc off centre in Hebrew. */
  .fan{position:relative;flex:1}
  .petal{position:absolute;left:50%;top:56%;width:42px;margin-left:-21px;border:none;background:none;
    padding:0;cursor:pointer;
    transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1))}
  .hub{position:absolute;left:50%;top:56%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
    background:var(--ground);display:flex;align-items:center;justify-content:center;flex-direction:column;
    box-shadow:inset 4px 5px 10px var(--shade),inset -4px -4px 9px var(--lit)}
  .hub b{font-size:21px;font-weight:800}
  .hub span{font-size:9px;color:var(--muted)}

  /* 2 - the grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:11px;border:none;cursor:pointer;
    background:var(--ground);border-radius:24px;padding:15px 13px;font-family:inherit;text-align:start;
    box-shadow:-6px -6px 14px var(--lit),7px 9px 20px var(--shade-soft)}
  .tile-t{font-size:13px;font-weight:700}

  /* 3 - the column */
  .spine{display:flex;align-items:center;gap:13px;background:var(--ground);border-radius:24px;padding:15px;
    margin-bottom:14px;cursor:pointer;border:none;width:100%;font-family:inherit;text-align:start;
    box-shadow:-6px -6px 14px var(--lit),7px 9px 20px var(--shade-soft),
      0 0 22px 5px rgba(255,226,170,.85),0 0 44px 12px rgba(255,214,140,.4)}
  .spine-t{flex:1}
  .spine-t b{display:block;font-size:15px;font-weight:700}
  .spine-t span{font-size:12px;color:var(--muted)}
  .col{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--ground);border:none;border-radius:20px;
    padding:10px 13px;cursor:pointer;font-family:inherit;text-align:start;
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}
  .row-t{flex:1;font-size:14px;font-weight:700}
  .row-go{color:var(--muted);font-size:17px}

  /* the app's own bar, so these read as the same app as the nutrition screen */
  .bar{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:14px}
  .bar-pill{flex:1;text-align:center;font-size:14px;font-weight:800;padding:13px 6px;border-radius:22px;
    background:var(--ground);color:var(--muted);
    box-shadow:-5px -5px 12px var(--lit),6px 8px 17px var(--shade-soft)}
  .bar-pill.on{color:var(--ink)}
  .bar-j{width:52px;height:52px;border-radius:50%;background:var(--ground);display:flex;align-items:center;
    justify-content:center;color:var(--muted);flex-shrink:0;
    box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--shade)}
  .bar-j svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* the rack, only on the page that shows all three */
  /* headless Chrome will not make a window narrower than about 500px, so a
     centred phone falls outside a 376px screenshot. On its own page it sits
     at the edge instead; the rack still centres. */
  body:not(.rack) .phone{position:absolute;left:0;top:0;margin:0}
  body.rack{background:#d6d3ce}
  body.rack .wrap{display:flex;gap:26px;padding:26px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
  body.rack .phone{border-radius:32px;height:700px;min-height:0}
</style>
<div class="phone">
    <div class="cap">2 · רשת</div>
    <div class="greet">בוקר טוב</div>
    <div class="name">Better Me</div>
    <div class="grid">
      <button class="tile"><span class="disc d2" style="color:#7d6aa8;--halo:rgba(191,178,224,.95)"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8Z"/><path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 3"/><path d="M13.5 7c0-1 1-1.5 1-2.5s-1-1.5-1-1.5"/></svg></span><span class="tile-t">תזונה</span></button>
      <button class="tile"><span class="disc d2" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><path d="M3 9.5v5"/><path d="M6.5 6v12"/><path d="M17.5 6v12"/><path d="M21 9.5v5"/><path d="M6.5 12h11"/></svg></span><span class="tile-t">כושר</span></button>
      <button class="tile"><span class="disc d2" style="color:#5f9b63;--halo:rgba(191,215,180,.95)"><svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 1.9 1.9 0 0 0 1.5-3.1 1.9 1.9 0 0 1 1.5-3.1h2.1a3 3 0 0 0 2.9-3A8.8 8.8 0 0 0 12 3.2Z"/><circle cx="8.2" cy="10" r=".9"/><circle cx="12" cy="7.6" r=".9"/><circle cx="15.8" cy="10" r=".9"/></svg></span><span class="tile-t">תחביבים</span></button>
      <button class="tile"><span class="disc d2" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4 8.6 8.6 0 1 0 20 14.4Z"/></svg></span><span class="tile-t">סיום יום</span></button>
      <button class="tile"><span class="disc d2" style="color:#7a716b;--halo:rgba(205,197,188,.95)"><svg viewBox="0 0 24 24"><path d="M9.2 17.6h5.6"/><path d="M10.2 20.4h3.6"/><path d="M12 3.4a5.6 5.6 0 0 0-3.3 10.1c.5.4.8 1 .8 1.6v.4h5v-.4c0-.6.3-1.2.8-1.6A5.6 5.6 0 0 0 12 3.4Z"/></svg></span><span class="tile-t">תובנות</span></button>
      <button class="tile"><span class="disc d2" style="color:#b5715c;--halo:rgba(240,190,170,.95)"><svg viewBox="0 0 24 24"><circle cx="9.2" cy="8.6" r="3.2"/><path d="M3.6 19.6a5.6 5.6 0 0 1 11.2 0"/><path d="M16.4 6.3a3.2 3.2 0 0 1 0 6.1"/><path d="M17.6 14.6a5.6 5.6 0 0 1 2.8 5"/></svg></span><span class="tile-t">האנשים שלי</span></button>
      <button class="tile"><span class="disc d2" style="color:#4d7fbe;--halo:rgba(178,205,237,.95)"><svg viewBox="0 0 24 24"><rect x="3.6" y="5" width="16.8" height="15" rx="3"/><path d="M3.6 9.6h16.8"/><path d="M8 3.2v3.4"/><path d="M16 3.2v3.4"/></svg></span><span class="tile-t">תכנון זמן</span></button>
      <button class="tile"><span class="disc d2" style="color:#a06b93;--halo:rgba(224,190,214,.95)"><svg viewBox="0 0 24 24"><path d="M9 3.4h6l3.2 3.1-2.3 2.2-.9-.8v12.7H7l0-12.7-.9.8L3.8 6.5Z"/></svg></span><span class="tile-t">הארון שלי</span></button>
    </div>
    <div class="bar">
      <span class="bar-pill on">Better</span>
      <span class="bar-j"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.4"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg></span>
      <span class="bar-pill">Me</span>
    </div>
  </div>
</html>
