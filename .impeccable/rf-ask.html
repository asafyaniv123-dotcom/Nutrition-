<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>סיום יום — the four that open it</title>
<!--
  The four opening questions of סיום יום, in the frost glass Asaf picked, over
  the app's own night sky. Questions, sub-lines and field placeholders are
  lifted verbatim from RF_STAGE1 in dev/index.html.
  ?q=1..4  &p=float|full
-->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--violet500:#a690cf;--violet300:#c9bce0;--amber:#f0a92e}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;background:#0d0b18}
.frame{position:absolute;left:0;top:0;width:376px;height:740px;overflow:hidden;
  font-family:Assistant,system-ui,sans-serif}

/* the app's own night sky */
.sky{position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 80% at 50% 8%,rgba(120,104,190,.30),transparent 62%),
             linear-gradient(165deg,#221d38,#171528)}
.cloud{position:absolute;border-radius:50%;filter:blur(22px)}
.c1{width:280px;height:170px;top:4%;right:-14%;background:#fff;opacity:.10}
.c3{width:320px;height:200px;top:58%;left:-20%;background:#fff;opacity:.09}
.stars i{position:absolute;background:#fff;border-radius:50%}

.pg{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:22px 16px 20px}
/* the progress hairline and the two escapes, on the sky rather than on glass */
.top{display:flex;align-items:center;gap:12px;min-height:34px;flex-shrink:0}
.ico{background:none;border:none;padding:6px 8px;font-size:17px;color:#7f76a4;cursor:pointer;line-height:1}
.bar{flex:1;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.bar-f{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--violet300),var(--violet500));
  box-shadow:0 0 10px 1px rgba(166,144,207,.8)}
.skip{background:none;border:none;padding:6px 4px;font-size:12px;color:#7f76a4;cursor:pointer;font-family:inherit}

/* ── THE PANE ── one sheet of frosted glass, and everything is on it */
.pane{background:rgba(255,255,255,.10);backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);border-radius:28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.06),
             0 22px 50px -26px rgba(0,0,0,.75);
  padding:28px 22px 24px;display:flex;flex-direction:column}
.p-float{margin:auto 0;max-height:74%}
.p-full{flex:1;margin-top:18px;border-radius:28px 28px 0 0;margin-bottom:-20px;padding-bottom:34px}

.q{font-size:25px;font-weight:800;line-height:1.35;color:#f6f3fc;letter-spacing:-.3px}
.sub{font-size:13px;color:#a79ec8;line-height:1.65;margin-top:10px}
.field{margin-top:26px;flex:1;display:flex;flex-direction:column}

/* the writing line: a channel pressed into the glass, lit where you are */
.in{width:100%;border:none;background:rgba(0,0,0,.14);border-radius:16px;
  padding:16px 15px;font-size:17px;line-height:1.65;color:#f6f3fc;font-family:inherit;
  resize:none;outline:none;flex:1;min-height:132px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.10)}
.in.lit{box-shadow:inset 0 2px 8px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.10),
  0 0 0 1px rgba(166,144,207,.55),0 0 18px -2px rgba(166,144,207,.5)}
.in-ph{color:#8981ae}
.one{min-height:0;flex:0 0 auto}

/* the photo well */
.drop{flex:1;min-height:180px;border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:#a79ec8;font-size:13px;
  background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.drop svg{width:30px;height:30px;fill:none;stroke:#a79ec8;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* a song, once it is named */
.song{display:flex;align-items:center;gap:12px;border-radius:16px;padding:11px;margin-top:12px;
  background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.song-a{width:44px;height:44px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(140deg,#6b5a92,#3e3358);display:flex;align-items:center;
  justify-content:center;color:#d9d0f0;font-size:17px}
.song-x{display:flex;flex-direction:column;min-width:0}
.song-t{font-size:13.5px;font-weight:800;color:#f2eefb}
.song-s{font-size:11px;color:#a79ec8;margin-top:2px}

/* the one lit thing on the screen */
.next{width:100%;border:none;border-radius:18px;padding:16px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;color:#fff;margin-top:20px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(201,188,224,.92),rgba(166,144,207,.92));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px -10px rgba(166,144,207,.75)}
.ghost{width:100%;background:none;border:none;padding:12px;font-size:13px;font-weight:700;
  color:#8981ae;cursor:pointer;font-family:inherit}
.tag{position:absolute;top:10px;left:10px;z-index:3;font-size:9px;font-weight:800;
  letter-spacing:.1em;color:#fff;background:rgba(255,255,255,.14);border-radius:999px;
  padding:5px 10px;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
var Q=[
 {n:1,q:'מה היה הרגע הכי טוב שלך היום?',sub:'',ph:'אפילו רגע קטן.',kind:'text'},
 {n:2,q:'איזו תמונה מספרת את היום שלך?',sub:'זה יכול להיות רגע, מקום, אדם, משהו שעשית — או פשוט תמונה שמרגישה כמו היום שעבר עליך.',kind:'photo'},
 {n:3,q:'מה השיר של היום שלך?',sub:'איזה שיר הכי מתאים למה שעבר עליך היום?',ph:'שם השיר',kind:'song'},
 {n:4,q:'יש משפט שלקחת איתך היום?',sub:'משהו ששמעת, קראת או חשבת ולא עזב אותך.',ph:'משפט, מחשבה, רגע...',kind:'text'}
];
function stars(){
  var h='<div class="stars">',i,x,y,s2,seed=7;
  for(i=0;i<30;i++){
    seed=(seed*9301+49297)%233280; x=(seed/233280*100).toFixed(1);
    seed=(seed*9301+49297)%233280; y=(seed/233280*100).toFixed(1);
    seed=(seed*9301+49297)%233280; s2=(1+seed/233280*1.6).toFixed(1);
    h+='<i style="left:'+x+'%;top:'+y+'%;width:'+s2+'px;height:'+s2+'px;opacity:'+(.22+(i%5)*.15).toFixed(2)+'"></i>';
  }
  return h+'</div>';
}
var qs=new URLSearchParams(location.search);
var n=Math.min(4,Math.max(1,+(qs.get('q')||1))), p=qs.get('p')||'float';
var q=Q[n-1];

var h='<div class="sky">'+stars()+'<div class="cloud c1"></div><div class="cloud c3"></div></div>';
h+='<div class="tag">'+n+' / 4 · '+(p==='full'?'FULL':'FLOAT')+'</div>';
h+='<div class="pg">';
h+='<div class="top"><button class="ico">&#8249;</button>'+
   '<div class="bar"><div class="bar-f" style="width:'+(n*25)+'%"></div></div>'+
   '<button class="skip">דלג</button></div>';
h+='<div class="pane p-'+p+'">';
h+='<div class="q">'+q.q+'</div>';
if(q.sub)h+='<div class="sub">'+q.sub+'</div>';
h+='<div class="field">';
if(q.kind==='text'){
  h+='<div class="in'+(n===1?' lit':'')+'">'+(n===1
    ? 'הלכנו ברגל הביתה מהים והשמש ירדה בדיוק כשעברנו את הגשר.'
    : '<span class="in-ph">'+q.ph+'</span>')+'</div>';
}
else if(q.kind==='photo'){
  h+='<div class="drop"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="14" rx="3"/>'+
     '<circle cx="12" cy="12.5" r="3.4"/><path d="M8.2 5.5 9.6 3.4h4.8l1.4 2.1"/></svg>'+
     '<span>תמונה מהיום</span></div>';
}
else if(q.kind==='song'){
  h+='<div class="in one lit">שביל החלב</div>';
  h+='<div class="song"><span class="song-a">&#9835;</span>'+
     '<span class="song-x"><span class="song-t">שביל החלב</span>'+
     '<span class="song-s">שלמה ארצי</span></span></div>';
}
h+='</div>';
h+='<button class="next">המשך</button>';
if(n===1)h+='<button class="ghost">לא עכשיו</button>';
h+='</div></div>';
document.getElementById('frame').innerHTML=h;
var f=document.getElementById('frame');
var k=Math.min(1,(window.innerHeight-6)/740);
f.style.transformOrigin='top left';
f.style.transform='scale('+k+')';
</script>
</body>
</html>
