<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>ממשק שני: צ׳אט — אב־טיפוס</title>
<style>
/* THE SECOND INTERFACE (Asaf, 25 Oct): "like there is Claude and Claude Code -
   a switch between one interface and another that is just a chat."
   Empty: Mip in the middle and a greeting by the hour. The areas as rounded
   rectangles above the writing line; choosing one slides it up to stand at
   the top centre, and from then on the talk is with that area; tapping it
   there returns to the general chat. What is said lands where it belongs.
   Two options, the same behaviour, a different material for the areas:
   A - our material: each area raised out of the ground, its colour only as
       the light of its icon, one row that scrolls.
   B - glass: the areas as clear glass over a soft field of their own light,
       all eight visible in two rows. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#f2eee9;--lit:rgba(255,255,255,.96);--sh:rgba(170,156,140,.42);--sh2:rgba(170,156,140,.26);--ink:#4a453f;--mu:#6d675e;--am:#f0a92e}
html,body{margin:0;background:#2b2724;font-family:Assistant,"Segoe UI",sans-serif}
.bar{max-width:430px;margin:0 auto;padding:12px 14px 6px;color:#efe6d8}
.bar h1{font-size:19px;margin:0 0 4px}.bar p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#cfc4b4}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{border:none;border-radius:999px;padding:8px 13px;font:700 13.5px Assistant,sans-serif;background:#3d3732;color:#e6dccd;cursor:pointer}
.sw button.on{background:#efe6d8;color:#2b2724}
.wrap{display:flex;justify-content:center;padding:10px 0 30px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;border-radius:34px;background:var(--g);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45);transform-origin:50% 0}
button{font-family:inherit}
/* the switch, top start corner: dial / chat, a pressed channel with the lit one raised */
.mode{position:absolute;top:18px;inset-inline-start:16px;z-index:30;display:flex;gap:2px;padding:4px;border-radius:999px;
  box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.mode button{width:40px;height:34px;border:none;border-radius:999px;background:transparent;color:var(--mu);cursor:pointer;display:grid;place-items:center}
.mode button.on{background:var(--g);color:var(--ink);box-shadow:-2px -2px 5px var(--lit),2px 3px 7px var(--sh2)}
.mode svg{width:19px;height:19px}
.dial{position:absolute;inset:0;background:url(dial.png) center top/100% auto no-repeat var(--g);transition:opacity .35s}
.dial.off{opacity:0;pointer-events:none}
.chat{position:absolute;inset:0;transition:opacity .35s}
.chat.off{opacity:0;pointer-events:none}
/* the top: the chosen area stands here */
.head{position:absolute;top:16px;left:0;right:0;height:46px;display:flex;justify-content:center;pointer-events:none;z-index:20}
/* the empty state */
.empty{position:absolute;left:0;right:0;top:120px;text-align:center;transition:opacity .3s,transform .4s}
.empty.gone{opacity:0;transform:translateY(-20px);pointer-events:none}
.sign{position:relative;width:150px;height:150px;margin:0 auto}
.mip{position:absolute;inset:0;transition:opacity .55s ease,transform .7s cubic-bezier(.22,.61,.36,1),filter .55s ease}
.picked .mip{opacity:0;transform:scale(.86) translateY(-6px);filter:blur(6px)}
.adisc{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;
  opacity:0;transform:scale(.9);filter:blur(4px);transition:opacity .6s ease .25s,transform .8s cubic-bezier(.22,.61,.36,1) .2s,filter .6s ease .25s;
  background:rgba(255,255,255,.46);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(110,92,72,.05),0 14px 34px -8px rgba(110,92,72,.16)}
.adisc::before{content:"";position:absolute;inset:14px;z-index:-1;border-radius:50%;filter:blur(18px);background:color-mix(in srgb,var(--c) 34%,transparent)}
.adisc svg{width:40px;height:40px;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.picked .adisc{opacity:1;transform:none;filter:none}
.hello,.hello2{transition:opacity .35s ease}
.swap .hello,.swap .hello2{opacity:0}
.it .av.area{border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.46);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.95),0 4px 10px -3px rgba(110,92,72,.14)}
.it .av.area svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hello{font-size:28px;font-weight:800;margin:16px 0 4px;letter-spacing:-.3px}
.hello2{font-size:16px;color:var(--mu);margin:0}
/* the talk */
.talk{transition:opacity .3s ease}
.ph bdi{white-space:nowrap}
.talk.out{opacity:0}
.talk{position:absolute;left:0;right:0;top:76px;bottom:var(--dock,190px);overflow-y:auto;padding:8px 18px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.talk::-webkit-scrollbar{display:none}
.me{align-self:flex-start;max-width:78%;padding:11px 15px;border-radius:20px 20px 6px 20px;font-size:16px;line-height:1.45;font-weight:600;
  box-shadow:-3px -3px 8px var(--lit),4px 5px 12px var(--sh2)}
.it{align-self:flex-end;max-width:86%;display:flex;gap:9px;align-items:flex-start;font-size:16px;line-height:1.55}
.it .av{flex:none;width:38px;height:38px;margin-top:-4px;background:url(../../dev/assets/beem-f-happy.png) center/125% no-repeat,url(../../dev/assets/beem-body.png) center/125% no-repeat}
.logged{margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;font-size:14.5px;font-weight:700;
  box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.logged .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--g);box-shadow:-2px -2px 5px var(--lit),2px 3px 7px var(--sh2)}
.logged .ic svg{width:17px;height:17px}
.logged small{display:block;font-weight:600;color:var(--mu);font-size:12.5px}
.dots{display:flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:#c8bdb0;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.3}}
/* the dock: areas above the writing line */
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 0 26px;z-index:10}
.areas{padding:0 16px 14px}
.row{display:flex;align-items:center;gap:10px;padding:0 16px}
.in{flex:1;height:56px;border:none;border-radius:999px;padding:0 20px;font:600 16px Assistant,sans-serif;color:var(--ink);background:var(--g);outline:none;
  box-shadow:inset 3px 4px 9px var(--sh),inset -3px -3px 8px var(--lit)}
.in::placeholder{color:#8f877d}
.rb{flex:none;width:52px;height:52px;border:none;border-radius:50%;background:var(--g);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh2)}
.rb:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.rb svg{width:21px;height:21px}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 16px 12px}
.sug.one{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
.sug.one::-webkit-scrollbar{display:none}
.sug.one button{flex:none}
.sug button{border:none;border-radius:999px;padding:8px 13px;font:700 13.5px Assistant,sans-serif;color:var(--mu);background:transparent;cursor:pointer;
  box-shadow:inset 1.5px 2px 5px var(--sh2),inset -1.5px -1.5px 4px var(--lit)}
/* an area: icon + name */
.ar{display:flex;align-items:center;gap:8px;border:none;cursor:pointer;color:var(--ink);font:800 14.5px Assistant,sans-serif;white-space:nowrap;
  padding:0 15px 0 12px;height:44px;border-radius:16px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.ar svg,.logged .ic svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ar svg{width:19px;height:19px;flex:none;color:var(--c);filter:drop-shadow(0 0 5px var(--c))}
.ar.hide{opacity:0;pointer-events:none}
/* the others leave softly, one after another, then the row folds away */
.areas{transition:max-height .55s cubic-bezier(.4,0,.2,1),padding .55s cubic-bezier(.4,0,.2,1);max-height:240px;overflow:hidden}
.ph .ar.leave{opacity:0;transform:translateY(8px) scale(.94);filter:blur(4px);pointer-events:none;
  transition:opacity .42s ease var(--d,0s),transform .5s cubic-bezier(.4,0,.2,1) var(--d,0s),filter .42s ease var(--d,0s)}
.areas.folded{max-height:0;padding-top:0;padding-bottom:0}
.ar.top{pointer-events:auto}
.ar.top::after{content:"×";margin-inline-start:4px;font-size:17px;color:var(--mu);font-weight:700}

/* A - our material, one row that scrolls */
.A .areas{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 16px}
.A .areas::-webkit-scrollbar{display:none}
.A .ar{background:var(--g);box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh2)}
.A .ar:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
/* B - glass over a field of the areas' own light, two rows */
.B{--glass:rgba(255,255,255,.46);--rim:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.95);
  --haze:0 1px 2px rgba(110,92,72,.05),0 10px 26px -6px rgba(110,92,72,.12)}
.B .dock::before{content:"";position:absolute;left:-14%;right:-14%;bottom:30px;height:250px;z-index:-1;filter:blur(46px);opacity:.6;
  transition:opacity .6s,height .6s;
  background:radial-gradient(30% 42% at 12% 42%,rgba(166,144,207,.38),transparent),radial-gradient(28% 44% at 38% 32%,rgba(224,138,114,.32),transparent),
    radial-gradient(28% 42% at 62% 44%,rgba(111,178,131,.32),transparent),radial-gradient(30% 44% at 88% 36%,rgba(58,124,165,.28),transparent),
    radial-gradient(44% 32% at 50% 82%,rgba(240,169,46,.22),transparent)}
.B.picked .dock::before{opacity:.22;height:120px}
.B .glass,.B .ar,.B .in,.B .rb,.B .sug button{background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:var(--rim),var(--haze)}
.B .areas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 14px}
.B .ar{justify-content:center;flex-direction:column;gap:5px;height:66px;padding:0 4px;border-radius:20px;
  font:700 12.5px Assistant,sans-serif;color:#5a544c;letter-spacing:.1px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,background .2s}
.B .ar svg{width:20px;height:20px;stroke-width:1.7;filter:drop-shadow(0 0 2.5px color-mix(in srgb,var(--c) 45%,transparent))}
.B .ar:active{transform:scale(.97);background:rgba(255,255,255,.3)}
.B .ar.top{flex-direction:row;height:42px;padding:0 14px 0 12px;font-size:14.5px;gap:8px;border-radius:999px;color:var(--ink)}
.B .ar.top::before{content:"";position:absolute;inset:6px 10px -10px;z-index:-1;border-radius:999px;filter:blur(14px);background:color-mix(in srgb,var(--c) 30%,transparent)}
.B .ar.top{position:relative}
.B .ar.top::after{font-weight:600;color:#8f877d}
.B .sug{gap:8px;padding:0 16px 12px}
.B .sug button{color:#5a544c;font-weight:700;padding:8px 14px}
.B .in{height:54px;color:var(--ink)}
.B .in::placeholder{color:#9a9188}
.B .rb{width:50px;height:50px;color:#5a544c}
.B .rb:active{transform:scale(.96);background:rgba(255,255,255,.3)}
.B .me{background:var(--glass);box-shadow:var(--rim),var(--haze);font-weight:600}
.B .logged{background:rgba(255,255,255,.3);box-shadow:var(--rim),0 1px 2px rgba(110,92,72,.04)}
.B .logged .ic{background:var(--glass);box-shadow:var(--rim)}
.B .mode{background:rgba(255,255,255,.28);box-shadow:var(--rim),inset 1px 2px 5px rgba(110,92,72,.1)}
.B .mode button.on{background:var(--glass);box-shadow:var(--rim),var(--haze)}
</style></head><body>
<div class="bar">
  <h1>ממשק שני: צ׳אט</h1>
  <p>אותה התנהגות בשתיהן: מיפ וברכה כשריק, האזורים מעל שורת הכתיבה, ובחירת אזור מעלה אותו לראש המסך. נסה לכתוב (״אכלתי חביתה ושתי פרוסות״, ״לזכור להתקשר לאמא״, ״3 סטים סקוואט 60 קילו״), לבחור אזור, וללחוץ עליו שוב למעלה. המתג בפינה עובר לחוגה.</p>
  <div class="sw"><button id="bB" class="on" onclick="pick('B')">זכוכית, רכה יותר</button><button id="bA" onclick="pick('A')">א׳ · החומר שלנו (לשם השוואה)</button></div>
</div>
<div class="wrap"><div class="ph B" id="ph">
  <div class="dial off" id="dial"></div>
  <div class="mode"><button id="mDial" onclick="mode('dial')" aria-label="חוגה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    <button id="mChat" class="on" onclick="mode('chat')" aria-label="צ׳אט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 18.5 4 21l3.6-1.4A8.5 8.5 0 1 0 5 18.5Z"/></svg></button></div>
  <div class="chat" id="chat">
    <div class="head" id="head"></div>
    <div class="empty" id="empty"><div class="sign"><div class="mip" id="mip"></div><div class="adisc" id="adisc"></div></div><div class="hello" id="hello"></div><p class="hello2" id="hello2">על מה נדבר?</p></div>
    <div class="talk" id="talk"></div>
    <div class="dock" id="dock"><div class="sug" id="sug"></div><div class="areas" id="areas"></div>
      <div class="row"><input class="in" id="in" placeholder="כתוב, או ספר מה קרה…" onkeydown="if(event.key==='Enter')send()">
        <button class="rb" aria-label="דבר"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
        <button class="rb" onclick="send()" aria-label="שלח"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
  </div>
</div></div>
<script>
/* [key, name, question when empty, suggestions] - each suggestion is
   something the area really does, and has its own answer in SCRIPT */
var AREAS=[['nutrition','תזונה','מה אכלת היום?',['אכלתי חביתה משתי ביצים ושתי פרוסות','כמה חלבון נשאר לי היום?','שתיתי 2 כוסות מים','שקלתי 72.4']],
  ['fitness','כושר','מה עשית היום?',['סקוואט 3×8 ב-60 קילו','מה האימון הבא שלי?','בנה לי אימון של 30 דקות','הלכתי היום 6,000 צעדים']],
  ['planning','תכנון זמן','מה צריך לעשות?',['מחר ב-10 רופא שיניים','כל רביעי 9–10 מדיטציה','לזכור להתקשר לאמא','מה יש לי היום?']],
  ['people','האנשים שלי','על מי נדבר?',['דיברתי עם נועה בטלפון','נועה התחילה עבודה חדשה','למי לא התקשרתי מזמן?']],
  ['hobbies','תחביבים','במה התעסקת היום?',['ניגנתי גיטרה חצי שעה','קראתי 20 עמודים','כמה ניגנתי השבוע?']],
  ['closet','הארון שלי','מה נלבש?',['תרכיב לי לוק להיום','לבשתי היום את הלוק הכחול','מה לא לבשתי הרבה זמן?']],
  ['insights','תובנות','על מה תרצה לכתוב?',['תן לי שאלה לכתוב עליה','למדתי היום שאני צריך יותר שקט בבוקר','מה כתבתי בחודש האחרון?']],
  ['endofday','סיום יום','איך היה היום?',['בוא נסכם את היום','הרגע הכי טוב היום: ארוחת ערב עם המשפחה','איך הרצף שלי?']]];
var GENERAL=['אכלתי חביתה משתי ביצים ושתי פרוסות','מחר ב-10 רופא שיניים','נועה התחילה עבודה חדשה','שתיתי 2 כוסות מים'];
var ICON={},COL={};
var ph=document.getElementById('ph'),cur=null,started=false,beem=null;
function pick(v){ph.className='ph '+v;bA.classList.toggle('on',v==='A');bB.classList.toggle('on',v==='B');reset();}
function mode(m){dial.classList.toggle('off',m!=='dial');chat.classList.toggle('off',m==='dial');mDial.classList.toggle('on',m==='dial');mChat.classList.toggle('on',m!=='dial');}
function greet(){var h=new Date().getHours();return h>=4&&h<12?'בוקר טוב':h<17?'צהריים טובים':h<22?'ערב טוב':'לילה טוב';}
function area(k){return AREAS.filter(function(a){return a[0]===k;})[0];}
function drawAreas(){
  areas.innerHTML=AREAS.map(function(a){return '<button class="ar" data-k="'+a[0]+'" style="--c:'+(COL[a[0]]||'#999')+'" onclick="choose(\''+a[0]+'\',this)">'+(ICON[a[0]]||'')+'<span>'+a[1]+'</span></button>';}).join('');
  sizeDock();
}
function drawSug(){
  var list=cur?area(cur)[3]:GENERAL,asked=[].map.call(talk.querySelectorAll('[data-q]'),function(e){return e.dataset.q;});
  if(started)list=list.filter(function(q){return asked.indexOf(q)<0;});
  sug.classList.toggle('one',started);
  sug.innerHTML=list.map(function(q){return '<button data-say="'+q+'" onclick="say(this.dataset.say)">'+ltr(q)+'</button>';}).join('');sizeDock();}
function sizeDock(){requestAnimationFrame(function(){talk.style.setProperty('--dock','');ph.style.setProperty('--dock',dock.offsetHeight+'px');});}
/* choose: the pill slides from its place to the top centre (FLIP) */
function choose(k,el){
  if(cur===k){back();return;}
  if(cur)back(true);
  var r0=el.getBoundingClientRect(),s=ph.getBoundingClientRect(),sc=s.width/390;
  var top=el.cloneNode(true);top.classList.add('top');top.onclick=function(){back();};
  head.appendChild(top);
  var r1=top.getBoundingClientRect();
  top.style.transition='none';
  top.style.transform='translate('+((r0.left-r1.left)/sc)+'px,'+((r0.top-r1.top)/sc)+'px) scale('+(r0.width/r1.width)+','+(r0.height/r1.height)+')';
  top.style.transformOrigin='0 0';
  el.classList.add('hide');
  /* one uniform scale on the way up: the glass never stretches */
  var k0=r0.height/r1.height;
  top.style.transform='translate('+((r0.left+(r0.width-r1.width*k0)/2-r1.left)/sc)+'px,'+((r0.top-r1.top)/sc)+'px) scale('+k0+')';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    top.style.transition='transform .85s cubic-bezier(.22,.61,.36,1),opacity .5s ease';top.style.transform='';});});
  cur=k;var a=area(k);
  adisc.style.setProperty('--c',COL[k]);adisc.innerHTML=ICON[k]||'';
  /* the words change while they are out of sight */
  empty.classList.add('swap');
  setTimeout(function(){hello.textContent=a[2];hello2.textContent='מדבר עם '+a[1];empty.classList.remove('swap');},380);
  ph.classList.add('picked');
  /* the others leave from the chosen one outwards */
  var list=[].slice.call(areas.children),at=list.indexOf(el);
  list.forEach(function(b,i){if(b===el)return;b.style.setProperty('--d',(Math.abs(i-at)*0.045)+'s');b.classList.add('leave');});
  clearTimeout(window._fold);window._fold=setTimeout(function(){if(cur)areas.classList.add('folded');sizeDock();},430);
  setTimeout(sizeDock,1000);
  thread(k);
  drawSug();
}
function back(silent){
  var top=head.firstChild;
  if(top&&!silent){top.style.transition='opacity .4s ease,transform .5s ease';top.style.opacity='0';top.style.transform='translateY(-6px) scale(.96)';

function match(t){
  if(SCRIPT[t])return t;
  var best='',score=0,words=t.split(/\s+/).filter(function(w){return w.length>2;});
  Object.keys(SCRIPT).forEach(function(q){
    if(cur&&SCRIPT[q][0]!==cur)return;
    var n=words.filter(function(w){return q.indexOf(w)>=0;}).length;
    if(n>score){score=n;best=q;}
  });
  return score?best:'';
}
