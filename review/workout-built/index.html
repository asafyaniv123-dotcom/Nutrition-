<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet"><title>מסך האימון, כפי שנבנה</title><style>body{margin:0;background:#2b2724;color:#efe6d8;font-family:Assistant,Arial,sans-serif}main{max-width:900px;margin:0 auto;padding:18px 14px 50px}h1{font-size:22px;margin:0 0 6px}p{color:#cfc4b4;font-size:14.5px;line-height:1.55;margin:0 0 6px}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px}figure{margin:0}img{width:100%;border-radius:16px;display:block}h2{font-size:16px;margin:8px 0 2px}figcaption p{font-size:13.5px}</style></head><body><main><h1>מסך האימון, כפי שנבנה ב־dev</h1><p>כיוון ט׳: ארבעה אזורים מסודרים, ומגירה קבועה למטה עם המנוחה ודרגת הקושי. צילומים מהאפליקציה עצמה, באימון עם שלושה תרגילים: אחד הסתיים ושניים באמצע.</p><div class="row"><figure><img loading="lazy" src="0-before.png"><figcaption><h2>היום ביציב</h2><p>המסך כמו שהוא אצלך עכשיו.</p></figcaption></figure><figure><img loading="lazy" src="1-top.png"><figcaption><h2>ב־dev: ראש המסך</h2><p>שורת התרגילים: "פרפר במכונה" שהסתיים שקוע עם אור ירוק־מרווה ווי ירוק. השם, "💡 איך מבצעים" לידו, היעד, החלף / הסר / סופרסט. ובתחתית המגירה: המנוחה, וגלגלת דרגת הקושי עם נקודת צבע לכל דרגה.</p></figcaption></figure><figure><img loading="lazy" src="2-sets.png"><figcaption><h2>הסטים</h2><p>שורה לכל סט. סט שנרשם ירוק עם וי, והסט הבא במסגרת. מתחתם משקל, חזרות ו־+, וההערה.</p></figcaption></figure><figure><img loading="lazy" src="3-edit.png"><figcaption><h2>לחיצה על סט שנרשם</h2><p>נפתחים ערוך / מחק / ביטול, והסט שנבחר מסומן.</p></figcaption></figure><figure><img loading="lazy" src="4-rest.png"><figcaption><h2>המנוחה רצה</h2><p>אחרי "התחל" השעון יושב מעל המגירה, בהיר עם "דלג", במקום הפס הכהה.</p></figcaption></figure><figure><img loading="lazy" src="5-superset.png"><figcaption><h2>סופרסט עם…</h2><p>ברשימת התרגילים לבחירה, "פרפר במכונה" שכבר עשית מסומן בירוק, כדי שלא תבחר אותו בטעות.</p></figcaption></figure></div></main></body></html>
