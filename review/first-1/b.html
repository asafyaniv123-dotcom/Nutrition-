<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>צעד 1 · ב · מתוך הבאר</title>
<style>
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.44);--ink:#4a453f;--mu:#6d675e}
html,body{margin:0;height:100%;background:var(--g);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif}
.s{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:22px 24px 34px}
.lang{align-self:flex-start;border:none;background:var(--g);border-radius:999px;padding:8px 14px;font:700 13px inherit;color:var(--mu);
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%}
/* the well of סיום יום - where he lives - pressed into the ground, its light rising */
.well{position:relative;width:200px;height:200px;border-radius:50%;margin-bottom:26px;
  box-shadow:inset 8px 10px 18px var(--sh),inset -8px -8px 16px var(--lit),0 0 0 1px rgba(255,255,255,.4)}
.well::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;animation:fade 1.4s ease .2s forwards;
  background:radial-gradient(85% 70% at 50% 100%,rgba(77,127,190,.5),rgba(120,168,226,.3) 38%,rgba(178,205,237,.12) 62%,transparent 80%)}
/* he rises out of it, the rim cutting him until he is clear */
.clip{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.bm{position:absolute;left:20px;top:20px;width:160px;height:160px;transform:translateY(120px);animation:rise 1.5s cubic-bezier(.2,.9,.3,1) .7s forwards}
h1{font-size:30px;font-weight:800;margin:0 0 10px;letter-spacing:-.4px;opacity:0;animation:up .6s ease 1.8s forwards}
p{font-size:16px;line-height:1.6;color:var(--mu);margin:0;max-width:300px;opacity:0;animation:up .6s ease 2.1s forwards}
.local{font-size:12.5px;color:var(--mu);margin-top:16px;opacity:0;animation:up .6s ease 2.4s forwards}
.go{width:100%;max-width:340px;border:none;border-radius:18px;padding:17px;background:var(--g);font:800 17px inherit;color:var(--ink);
  box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh);opacity:0;animation:up .6s ease 2.7s forwards}
@keyframes rise{to{transform:none}}@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body><div class="s">
<button class="lang">עברית ▾</button>
<div class="mid">
  <div class="well"><div class="clip"><div class="bm" id="b"></div></div></div>
  <h1>היי, אני בים.</h1>
  <p>אני גר בסוף היום שלך. כל ערב נעצור כאן יחד ונסתכל עליו.</p>
  <div class="local">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
</div>
<button class="go">נעים להכיר</button>
</div>
<script src="beem.js"></script><script>beemHello(document.getElementById('b'));</script>
</body></html>
