<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>צעד 1 · ג · הוא מדבר</title>
<style>
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.44);--sh2:rgba(176,168,156,.28);--ink:#4a453f;--mu:#6d675e}
html,body{margin:0;height:100%;background:var(--g);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif}
.s{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:22px 20px 34px}
.lang{align-self:flex-start;border:none;background:var(--g);border-radius:999px;padding:8px 14px;font:700 13px inherit;color:var(--mu);
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh)}
.talk{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.who{display:flex;align-items:flex-end;gap:10px}
.bm{flex:0 0 96px;width:96px;height:96px}
.bubbles{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* his words arrive one at a time, as someone speaking - raised, not boxed */
.bb{background:var(--g);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:17px;line-height:1.45;font-weight:600;
  box-shadow:-4px -4px 10px var(--lit),5px 7px 15px var(--sh2);opacity:0;transform:translateY(6px) scale(.97);transform-origin:100% 100%}
[dir=rtl] .bb{border-radius:20px 20px 6px 20px}
.bb.on{animation:pop .45s cubic-bezier(.2,.9,.3,1) forwards}
.bb b{font-weight:800}
.local{font-size:12.5px;color:var(--mu);margin:6px 2px 0;opacity:0;transition:opacity .5s}
.local.on{opacity:1}
/* the answer is hers, on the other side, as a reply */
.reply{align-self:flex-end;border:none;border-radius:20px 20px 6px 20px;padding:14px 20px;background:var(--g);font:800 17px inherit;color:var(--ink);
  box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh);opacity:0;transition:opacity .5s,transform .5s;transform:translateY(8px)}
[dir=rtl] .reply{border-radius:20px 20px 20px 6px}
.reply.on{opacity:1;transform:none}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bb{opacity:1;transform:none}.local,.reply{opacity:1;transform:none}}
</style></head><body><div class="s">
<button class="lang">עברית ▾</button>
<div class="talk">
  <div class="who">
    <div class="bm" id="b"></div>
    <div class="bubbles">
      <div class="bb">היי!</div>
      <div class="bb">אני <b>בים</b>.</div>
      <div class="bb">כל ערב אני מחכה לך בסוף היום, כדי לעצור רגע ולהסתכל עליו יחד.</div>
      <div class="bb">נכיר?</div>
    </div>
  </div>
  <div class="local" id="l">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
</div>
<button class="reply" id="r">היי בים, נעים להכיר</button>
</div>
<script src="beem.js"></script><script>
beemHello(document.getElementById('b'));
var bs=document.querySelectorAll('.bb'),t=700;
bs.forEach(function(e,i){setTimeout(function(){e.classList.add('on');},t);t+= i===1?900:(i===2?1700:800);});
setTimeout(function(){document.getElementById('l').classList.add('on');},t);
setTimeout(function(){document.getElementById('r').classList.add('on');},t+400);
</script>
</body></html>
