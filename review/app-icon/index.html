<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>App icon</title>
<style>
/* the app icon, rendered from the real Beem kit on the first run's sand,
   1024x1024 with no transparency (Apple's rule). tools/make-app-icon.mjs
   photographs it. Class names are ic-*: the kit owns .beem and .ring. */
html,body{margin:0;background:#ece3d4}
.ic-sq{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:radial-gradient(circle at 50% 46%,#f5efe5 0%,#ece3d4 58%,#e2d6c4 100%)}
.ic-b{position:absolute;left:112px;top:112px;width:800px;height:800px}
</style></head><body>
<div class="ic-sq"><div class="ic-b" id="b"></div></div>
<script src="beem.js"></script>
<script>
var sc=document.createElement('script');sc.src='../../vendor/beem-app.js';
sc.onload=function(){BeemKit.ready.then(function(){
  window.B=BeemKit.mount(document.getElementById('b'),{play:{dur:1e9,ev:[[0,'face','happy'],[0,'mode',{idle:0,breathe:[0,4]}]]}});
  setTimeout(function(){window.READY=1;},2500);});};
document.head.appendChild(sc);
</script></body></html>
