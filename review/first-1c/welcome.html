<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ברוכים הבאים ל־Better Me</title>
<style>
/* ג's colour - golden hour sand and a hint of low sun from the left - with
   ב's layout, and Beem in the dial's place: already there, already smiling */
:root{--g:#ece3d4;--lit:rgba(255,251,243,.92);--sh:rgba(186,160,124,.46);--ink:#4a453f;--mu:#5f5850}
html,body{margin:0;height:100%;background:var(--g);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif}
.s{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:22px 24px 34px;position:relative;overflow:hidden}
.s::before{content:"";position:absolute;inset:0 auto auto 0;width:72%;height:520px;pointer-events:none;
  background:radial-gradient(34% 14% at 3% 2%,rgba(255,255,250,.5),transparent 70%),
    linear-gradient(118deg,transparent 6%,rgba(255,255,252,.5) 12%,rgba(255,255,252,.18) 17%,rgba(255,255,252,0) 21%,
      rgba(150,118,80,.05) 24%,rgba(150,118,80,0) 27%,rgba(255,255,252,.28) 31%,rgba(255,255,252,0) 36%,transparent 40%);
  -webkit-mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);
  filter:blur(6px)}
.lang{align-self:flex-start;border:none;background:var(--g);border-radius:999px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:13px;color:var(--mu);
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh);position:relative;z-index:2}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;position:relative;z-index:1}
.bm{width:230px;height:230px;margin:0 0 22px}
.wel{font-size:15px;font-weight:700;color:var(--mu);margin-bottom:6px}
.name{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:0 0 14px;direction:ltr}
p{font-size:16px;line-height:1.6;color:var(--mu);margin:0;max-width:340px;text-wrap:balance}
.local{font-size:12.5px;color:var(--mu);margin-top:14px}
.go{width:100%;max-width:340px;border:none;border-radius:18px;padding:17px;background:var(--g);font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh);position:relative;z-index:2}
.mid>*:not(.bm){opacity:0;animation:up .7s ease forwards}
.wel{animation-delay:.3s!important}.name{animation-delay:.5s!important}p{animation-delay:.75s!important}.local{animation-delay:1s!important}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mid>*{animation:none!important;opacity:1!important}}
</style></head><body><div class="s">
<button class="lang">עברית ▾</button>
<div class="mid">
  <div class="bm" id="b"></div>
  <div class="wel">ברוכים הבאים ל־</div>
  <div class="name">Better Me</div>
  <p>התכוננו להפוך לגרסה הטובה ביותר של עצמכם.</p>
  <div class="local">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
</div>
<button class="go">נתחיל</button>
</div>
<script src="beem.js"></script><script>beemHello(document.getElementById('b'), SMILE);</script>
</body></html>
