<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>לנסות: במקום חמשת הכפתורים</title>
<style>
/* PERSON CONTACT, LIVE - a prototype to try by hand (30 Oct 2026). Asaf found
   the page of pictures (review/person-contact) hard to follow, so this is the
   same five options as one working phone: a switcher on top, one line saying
   what to try, and the page itself. State lives in memory; nothing is saved.
   The material is the one photographed from dev for the static page. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.44);--sh2:rgba(176,168,156,.28);
  --ink:#4a453f;--mu:#6d675e;--amber:#f0a92e;--dk:#2b2724}
html,body{margin:0;background:var(--g);font-family:Assistant,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button{font-family:inherit;color:inherit}
/* the page is the phone; on a wide screen, a phone in the middle */
.ph{position:relative;min-height:100vh;background:var(--g)}
@media (min-width:600px){
  html,body{background:var(--dk)}
  .ph{width:390px;height:844px;min-height:0;margin:24px auto;border-radius:40px;overflow:hidden;transform:translateZ(0);
    box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .sc{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .sc::-webkit-scrollbar{display:none}
}
/* ── the prototype's own strip, dark so it never reads as the app ── */
.sw{position:sticky;top:0;z-index:50;background:var(--dk);color:#efe6d8;padding:8px 0 7px}
.sw-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 10px}
.sw-row::-webkit-scrollbar{display:none}
.sw-row button{flex:none;border:none;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:700;background:#3d3732;color:#e6dccd;cursor:pointer;white-space:nowrap}
.sw-row button b{font-weight:800;margin-inline-end:4px;color:#f0c98a}
.sw-row button.on{background:#efe6d8;color:var(--dk)}
.sw-row button.on b{color:#9a5e10}
.sw-row .rec{font-size:10px;font-weight:800;background:#9fd08a;color:var(--dk);border-radius:999px;padding:3px 8px;margin-inline-start:5px}
.sw-try{display:flex;align-items:center;gap:8px;padding:7px 12px 0;font-size:13px;line-height:1.4;color:#d6ccbd}
.sw-try span{flex:1;min-width:0}
.sw-try button{flex:none;border:none;background:none;color:#f0c98a;font-size:12.5px;font-weight:800;cursor:pointer;padding:2px 0}
.sw-demo{display:flex;gap:6px;flex-wrap:wrap;padding:7px 12px 0}
.sw-demo button{border:1px dashed #6f6559;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:none;color:#e6dccd;cursor:pointer}
.sw-demo button.on{background:#efe6d8;color:var(--dk);border-style:solid;border-color:#efe6d8}

/* ── the app, as photographed ── */
.hd{position:relative;height:104px;box-shadow:0 10px 18px -18px var(--sh)}
.home{position:absolute;top:16px;right:20px;border:none;padding:5px 13px;border-radius:13px;font-size:12px;font-weight:800;color:var(--mu);background:var(--g);
  box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2);cursor:pointer}
.ttl{position:absolute;top:42px;right:20px;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
.mip{position:absolute;top:12px;left:14px;width:60px;height:60px;border-radius:50%;background:var(--g);overflow:hidden;
  box-shadow:-4px -4px 10px var(--lit),5px 6px 14px var(--sh2)}
.mip .bm{position:absolute;left:7px;top:7px;width:46px;height:46px}
.ct{padding:0 14px 120px}
.tabs{position:fixed;right:12px;left:12px;bottom:14px;height:70px;border-radius:30px;z-index:20;background:var(--g);
  box-shadow:-4px -4px 10px var(--lit),5px 6px 14px var(--sh2)}
.tabs span{position:absolute;top:4px;height:46px;width:42%;border-radius:20px;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mu)}
.tabs .tb{left:4px;color:var(--ink);box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.tabs .tm{right:4px}
.tabs .tc{position:absolute;left:50%;top:-10px;width:52px;height:52px;margin-left:-26px;border-radius:50%;display:grid;place-items:center;
  background:var(--g);box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.tabs .tc svg{width:18px;height:18px;fill:none;stroke:var(--mu);stroke-width:1.8}
.back{display:inline-flex;align-items:center;gap:4px;margin:14px 0 12px;border:none;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--mu);
  background:var(--g);box-shadow:-3px -3px 6px var(--lit),3px 4px 8px var(--sh2);cursor:pointer}
.face{position:relative;height:420px;border-radius:26px;overflow:hidden;background:var(--g);box-shadow:-4px -4px 10px var(--lit),5px 6px 14px var(--sh2)}
.face .bloom{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 55% 0%,var(--fb,rgba(64,131,102,.55)),transparent 78%)}
.face .e{position:absolute;top:16px;left:16px;border-radius:12px;padding:8px 13px;font-size:11px;font-weight:800;color:var(--mu);
  background:var(--g);box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.face .x{position:absolute;right:22px;left:22px;bottom:20px}
.face .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.face .r{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:6px}
.face .s{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--mu);margin-top:9px;transition:color .3s}
.face .s.new{color:var(--ink);font-weight:700}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px 2px rgba(240,169,46,.6)}
.ways{display:flex;gap:7px;margin:16px 0 18px}
.ways button{flex:1;border:none;border-radius:14px;padding:12px 4px;font-size:11px;font-weight:800;color:var(--mu);background:var(--g);cursor:pointer;
  box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.ways button.on,.ways button:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit);color:var(--ink)}
.panel{border-radius:20px;padding:17px 17px 15px;box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.k{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mu)}
.v{display:block;font-size:13px;font-weight:600;line-height:1.7;margin-top:5px;white-space:pre-wrap}
.v+.k{margin-top:15px}
.plab{font-size:11px;font-weight:600;color:var(--mu);margin:9px 6px 16px}
.add,.one{display:flex;width:100%;align-items:center;justify-content:center;gap:9px;border:none;border-radius:16px;padding:14px;font-size:14px;font-weight:800;
  background:var(--g);cursor:pointer;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.add{font-size:13px;border-radius:18px;margin-bottom:18px}

.one.on,.one:active,.add:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}

.lp{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.hint{font-size:11px;font-weight:600;color:var(--mu);text-align:center;margin:0 0 16px}
.mem{display:flex;gap:12px}
.mem .l{display:flex;flex-direction:column;align-items:center;flex:0 0 10px}
.mem .l i{width:9px;height:9px;border-radius:50%;background:#d6d0c8;margin-top:5px;box-shadow:inset 1px 1px 2px rgba(120,110,98,.3)}
.mem.fresh .l i{background:var(--amber);box-shadow:0 0 8px 2px rgba(240,169,46,.55)}
.mem .l span{width:2px;flex:1;background:#ddd7cf;margin:4px 0 -4px}
.mem .t{flex:1;min-width:0;padding-bottom:16px}
.mem .w{display:block;font-size:9.5px;font-weight:700;color:var(--mu)}
.mem .c{display:block;font-size:13px;font-weight:600;line-height:1.7;margin-top:4px;white-space:pre-wrap}
.mem .b{display:flex;gap:12px;margin-top:6px;font-size:10.5px;font-weight:700;color:var(--mu)}
/* the status line as the button (option 2) */
.stb{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:none;border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--ink);
  background:var(--g);cursor:pointer;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.stb .ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--mu);
  box-shadow:inset 1px 2px 3px var(--sh),inset -1px -1px 2px var(--lit)}
.stb.on{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
/* menus, sheets, toast */
.veil{position:fixed;inset:0;z-index:60;background:rgba(233,231,227,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
.dim{position:fixed;inset:0;z-index:60;background:rgba(60,52,44,.42);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.menu{position:fixed;right:28px;left:28px;z-index:61;border-radius:20px;padding:8px;background:var(--g);
  box-shadow:-4px -4px 10px var(--lit),8px 10px 26px rgba(120,104,88,.3);animation:pop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.menu .mh{font-size:11.5px;font-weight:800;color:var(--mu);padding:6px 10px 8px}
.menu button.it{display:block;width:100%;text-align:start;border:none;background:none;border-radius:14px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
.menu button.it:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.menu .dd{display:flex;gap:6px;flex-wrap:wrap;padding:2px 10px 8px}
.menu .dd button{border:none;border-radius:13px;padding:9px 13px;font-size:13px;font-weight:800;background:var(--g);cursor:pointer;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--g);border-radius:30px 30px 0 0;padding:14px 18px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(40,30,20,.18);animation:up .3s cubic-bezier(.2,.9,.3,1);max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:4px;border-radius:2px;background:#d6d0c8;margin:0 auto 16px}
.sh-t{font-size:21px;font-weight:800;margin:0 4px 3px}
.sh-s{font-size:13px;font-weight:600;color:var(--mu);margin:0 4px 16px;line-height:1.55}
.ta{display:block;width:100%;border:none;outline:none;resize:none;border-radius:20px;padding:16px 18px;min-height:128px;font-family:inherit;font-size:16px;font-weight:600;line-height:1.6;
  color:var(--ink);background:var(--g);box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.ta::placeholder,.field::placeholder{color:var(--mu);font-weight:600}
.note{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--mu);margin:12px 6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chips button{border:none;border-radius:16px;padding:9px 14px;font-size:12.5px;font-weight:800;color:var(--mu);background:var(--g);cursor:pointer;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.chips button.on{color:var(--ink);box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.save{display:block;width:100%;border:none;border-radius:20px;padding:16px;font-size:15px;font-weight:800;background:var(--g);cursor:pointer;box-shadow:-5px -5px 12px var(--lit),7px 9px 18px var(--sh)}
.save:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.way{display:flex;width:100%;align-items:center;gap:13px;border:none;border-radius:20px;padding:13px 15px;margin-bottom:11px;background:var(--g);cursor:pointer;text-align:start;
  box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}
.way:active{box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.way .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 2px 3px 6px var(--sh2),inset -2px -2px 5px var(--lit)}
.way .ic svg{width:19px;height:19px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.way b{display:block;font-size:15.5px;font-weight:800}
.way small{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:1px;direction:ltr;text-align:right}
.field{display:block;width:100%;border:none;outline:none;border-radius:16px;padding:14px 16px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:12px;
  background:var(--g);box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.fine{font-size:12px;font-weight:600;color:var(--mu);line-height:1.55;margin:10px 6px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:104px;z-index:80;transform:translateX(-50%);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:800;white-space:nowrap;
  background:var(--g);box-shadow:-3px -3px 8px var(--lit),5px 7px 18px rgba(120,104,88,.3);animation:toast 1.6s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit),0 0 0 3px rgba(240,169,46,.35)}}
/* home and My people (the "chance" option) */
.hm-top{position:relative;height:150px}
.hm-tb{position:absolute;top:18px;left:118px;width:82px;height:38px;border-radius:19px;box-shadow:inset 2px 3px 6px var(--sh2),inset -2px -2px 5px var(--lit)}
.hm-mn{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:14px;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2);display:grid;place-items:center}
.hm-mn i{display:block;width:16px;height:2px;background:var(--mu);box-shadow:0 -5px 0 var(--mu),0 5px 0 var(--mu)}
.hm-g{position:absolute;top:84px;right:20px;font-size:27px;font-weight:800}
.hm-d{position:absolute;top:122px;right:20px;font-size:13px;font-weight:600;color:var(--mu)}
.dial{width:290px;height:290px;margin:14px auto 26px;border-radius:50%;display:grid;place-items:center;
  box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh2),inset 0 0 0 10px var(--g),inset 0 0 0 12px rgba(176,168,156,.35)}
.dial button{border:none;width:120px;height:120px;border-radius:50%;background:var(--g);font-size:13px;font-weight:800;color:var(--mu);cursor:pointer;

.cmd{display:flex;gap:10px;align-items:flex-end;margin:0 6px}

.offer b{display:block;font-size:15px;font-weight:800}
.offer .qt{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin-top:2px;line-height:1.45}

.btn{border:none;border-radius:15px;padding:10px 14px;font-size:13.5px;font-weight:800;text-align:center;background:var(--g);cursor:pointer;box-shadow:-3px -3px 7px var(--lit),3px 4px 9px var(--sh2)}

<div class="ph" id="ph"><div class="sc" id="sc">

<script>
var PP_HUES=['#408366','#726cb1','#a16646','#4c76b4','#9d6686','#467d7d','#807645','#a9625d','#5b759d','#618047'];
function hue(n){var h=0,i;for(i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return PP_HUES[h%PP_HUES.length];}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function av(n,s){return '<span class="av" style="background:'+hue(n)+';width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*.42)+'px">'+esc(n.charAt(0))+'</span>';}

/* ── the status line ── */
function statusText(s){
  if(!s.st)return CUR==='2'?'עדיין לא דיברתם · 12 ימים':'דיברנו לפני 12 ימים';
  var t={today:'דיברתם היום',yesterday:'דיברתם אתמול'}[s.st]||('דיברתם לפני '+s.st+' ימים');
  return t+(s.src?' · '+s.src:'');
}
function statusHTML(s){
  if(CUR==='2'){
    return s.st?'<button class="stb on" data-a="st">'+esc(statusText(s))+'<span class="ck">✓</span></button>'
               :'<button class="stb" data-a="st"><i class="dot"></i>'+esc(statusText(s))+'<span class="ck"></span></button>';
  }
  return '<span class="s'+(s.st?' new':'')+'">'+esc(statusText(s))+'</span>';
}

var MEET='פגשתי את דנה בחוף, היא מורה ליוגה';
function meetHTML(){
  var s=st(),h='';
  if(s.view==='home'){
    h+='<div class="dial"><button>סיום יום</button></div>';
    h+='<div class="cmd"><button class="go" data-a="send" aria-label="שלח">'+SV.up+'</button><textarea id="cmd" rows="1" placeholder="מה אכלת, מה לזכור, מה לעשות…"></textarea></div>';

      '<div class="bs"><button class="btn w" data-a="offer-yes">להוסיף</button><button class="btn ql" data-a="offer-no">לא עכשיו</button></div></div>';

/* ── draw ── */
var _mipOn=false;
function render(top){
  var s=st(),ct=document.getElementById('ct'),hd=document.getElementById('hd');
  var homeV=CUR==='meet'&&s.view==='home';
  hd.querySelector('#hd-t').textContent=CUR!=='meet'?'ויין':(s.view==='people'?'האנשים שלי':s.view==='person'?s.people[s.person].name:'');
  hd.querySelector('#hd-home').style.display=homeV?'none':'';
  if(homeV){ct.innerHTML='<div class="hm-top" style="margin:-104px -14px 0"><div class="hm-tb"></div><div class="hm-mn"><i></i></div><div class="hm-g">ערב טוב, אסף</div><div class="hm-d">יום שישי, 30 באוקטובר</div></div>'+meetHTML();}
  else ct.innerHTML=CUR==='meet'?meetHTML():personHTML();
  if(homeV)hd.style.boxShadow='none';else hd.style.boxShadow='';
  bindLP();
  if(top)scrollTopAll();
  var c=document.getElementById('cmd');if(c)c.addEventListener('input',function(){c.style.height='auto';c.style.height=c.scrollHeight+'px';});
}
function scroller(){return matchMedia('(min-width:600px)').matches?document.getElementById('sc'):document.scrollingElement;}
function scrollTopAll(){scroller().scrollTop=0;}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.getElementById('ph').appendChild(x);setTimeout(function(){x.remove();},1700);}
function layer(h){document.getElementById('layer').innerHTML=h;}
function closeLayer(){layer('');}
function setToday(src){var s=st();s.st='today';s.src=src||'';}

/* ── option 1: tap toggles, a long press opens the days ── */
var _lpT=null,_lpFired=false,_lpAt=0;
/* the finger that held the chip is lifted over the veil the menu just put
   under it - that release must not count as a tap on the veil */
document.addEventListener('click',function(e){if(_lpAt){_lpAt=0;e.stopPropagation();e.preventDefault();}},true);
/* however long it was held: the swallow ends with the release, so a new touch always counts */
document.addEventListener('pointerdown',function(){if(_lpAt&&!_lpT)_lpAt=0;},true);
document.addEventListener('pointerup',function(){if(_lpAt)setTimeout(function(){_lpAt=0;},400);},true);
function bindLP(){
  var b=document.getElementById('lp');if(!b)return;
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  b.addEventListener('pointerdown',function(e){_lpFired=false;clearTimeout(_lpT);
    _lpT=setTimeout(function(){_lpT=null;_lpFired=true;_lpAt=Date.now();daysMenu();try{navigator.vibrate&&navigator.vibrate(12);}catch(er){}},450);});
  ['pointerup','pointercancel','pointerleave'].forEach(function(k){b.addEventListener(k,function(){clearTimeout(_lpT);});});
  b.addEventListener('click',function(e){if(_lpFired){e.preventDefault();return;}var s=st();if(s.st){s.st=null;}else setToday();render();});
}
function daysMenu(){
  var r=document.getElementById('lp').getBoundingClientRect(),top=Math.max(110,r.top-238);
  layer('<div class="veil" data-a="close"></div><div class="menu" style="top:'+top+'px"><div class="mh">מתי דיברתם?</div>'+
    '<button class="it" data-a="day" data-d="today">היום</button><button class="it" data-a="day" data-d="yesterday">אתמול</button>'+
    '<button class="it" data-a="days">לפני כמה ימים</button><div class="dd" id="dd" style="display:none">'+
    [2,3,4,5,6].map(function(n){return '<button data-a="day" data-d="'+n+'">'+n+' ימים</button>';}).join('')+'</div></div>');
}

/* ── sheets ── */
function memSheet(){
  layer('<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><div class="sh-t">משהו שאני רוצה לזכור</div><div class="sh-s">על ויין</div>'+
    '<textarea class="ta" id="mem-in" placeholder="מה היית רוצה לזכור?"></textarea>'+
    '<div class="note"><i class="dot"></i>זה גם יסמן שדיברתם היום</div>'+
    '<div class="chips" id="mem-k"><button>הערה</button><button>זיכרון</button><button>תובנה</button><button class="on">שיחה</button><button>חשוב</button></div>'+
    '<button class="save" data-a="mem-save">שמור</button></div>');
}
function writeSheet(){
  var s=st();
  if(!s.hasNum||!s.num){
    layer('<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><div class="sh-t">אין לויין מספר עדיין</div><div class="sh-s">הוסף מספר, ובפעם הבאה הכפתור יפתח לך את השיחה איתו.</div>'+
      '<input class="field" id="num-in" type="tel" inputmode="tel" placeholder="מספר טלפון" autocomplete="off" style="direction:ltr;text-align:right">'+
      '<button class="save" data-a="num-save">שמור מספר</button><div class="fine">או לבחור מאנשי הקשר בטלפון</div></div>');
    return;
  }
  layer('<div class="dim" data-a="close"></div><div class="sheet"><div class="grab"></div><div class="sh-t">לכתוב לויין</div><div class="sh-s">כשתחזור, נרשום שדיברתם — רק אם השתמשת באחד מאלה.</div>'+
    '<button class="way" data-a="go" data-k="wa"><span class="ic">'+SV.wa+'</span><span><b>וואטסאפ</b><small>'+esc(s.num)+'</small></span></button>'+
    '<button class="way" data-a="go" data-k="sms"><span class="ic">'+SV.sms+'</span><span><b>הודעה</b><small>'+esc(s.num)+'</small></span></button>'+
    '<button class="way" data-a="go" data-k="tel"><span class="ic">'+SV.tel+'</span><span><b>שיחה</b><small>'+esc(s.num)+'</small></span></button></div>');
}
var GO={wa:['פותח את וואטסאפ…','כתבת לו בוואטסאפ'],sms:['פותח את ההודעות…','שלחת לו הודעה'],tel:['מתקשר לויין…','התקשרת אליו']};

/* ── every tap ── */
document.getElementById('ph').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),s=st();
  if(a==='close'){closeLayer();return;}
  if(a==='way'){var i=+b.getAttribute('data-i'),W=['הודעה','שיחה','פגישה','וידאו','אחר'];s.ways=i;setToday(W[i]);s.mems.unshift({w:'היום · שיחה',c:'יצירת קשר: '+W[i],fresh:1});
    s.mems.forEach(function(m,j){if(j)m.fresh=0;});render();toast('נרשם ✓');return;}
  if(a==='st'){if(s.st)s.st=null;else setToday();render();return;}
  if(a==='day'){var d=b.getAttribute('data-d');s.st=d;s.src='';closeLayer();render();return;}
  if(a==='days'){var dd=document.getElementById('dd');if(dd)dd.style.display='flex';return;}
  if(a==='mem'){memSheet();setTimeout(function(){var t=document.getElementById('mem-in');if(t)t.focus();},320);return;}
  if(a==='mem-save'){var t=document.getElementById('mem-in'),v=t?t.value.trim():'';if(!v){t&&t.focus();toast('כתוב משהו…');return;}
    var k=document.querySelector('#mem-k .on');s.mems.forEach(function(m){m.fresh=0;});s.mems.unshift({w:'היום · '+(k?k.textContent:'שיחה'),c:v,fresh:1});
    setToday(CUR==='5'?'זיכרון חדש':'');closeLayer();render();toast('נשמר ✓');
    setTimeout(function(){var tl=document.getElementById('tl');if(tl)tl.scrollIntoView({behavior:'smooth',block:'center'});},120);return;}
  if(b.parentNode&&b.parentNode.id==='mem-k'){[].forEach.call(b.parentNode.children,function(x){x.classList.toggle('on',x===b);});return;}
  if(a==='write'){writeSheet();return;}
  if(a==='num-save'){var n=document.getElementById('num-in'),nv=n?n.value.trim():'';if(!nv){n&&n.focus();return;}s.num=nv;s.hasNum=true;paintSw();writeSheet();return;}
  if(a==='go'){var g=GO[b.getAttribute('data-k')];closeLayer();toast(g[0]);setTimeout(function(){setToday(g[1]);render();},900);return;}
  /* the chance option */
  if(a==='sug'){var c=document.getElementById('cmd');if(c){c.value=MEET;c.dispatchEvent(new Event('input'));c.focus();}return;}
  if(a==='send'){var c2=document.getElementById('cmd'),q=c2?c2.value.trim():'';if(!q)return;
    s.said=q;s.offer=null;var m=q.match(/(?:פגשתי את|פגשתי|הכרתי את|הכרתי)\s+([^\s,.!?]+)/);
    if(m&&!s.people.some(function(p){return p.name===m[1];}))s.offer={name:m[1],line:q};
    render();setTimeout(function(){var o=document.getElementById('offer');if(o)o.scrollIntoView({behavior:'smooth',block:'center'});},60);return;}
  if(a==='offer-no'){var o=document.getElementById('offer');if(o){o.classList.add('out');setTimeout(function(){s.offer=null;render();},420);}return;}
  if(a==='offer-yes'){var of=s.offer;s.people.unshift({name:of.name,sub:of.line,d:'היום',mems:[of.line]});s.newRow=of.name;s.offer=null;s.said='';s.view='people';render(true);toast(of.name+' נוספה לאנשים שלי');return;}
  if(a==='met-open'){s.metOpen=true;render();setTimeout(function(){var i=document.getElementById('met-n');if(i)i.focus();},60);return;}
  if(a==='met-add'){var nn=(document.getElementById('met-n')||{}).value||'',ll=(document.getElementById('met-l')||{}).value||'';nn=nn.trim();ll=ll.trim();
    if(!nn){var f=document.getElementById('met-n');f&&f.focus();return;}
    s.people.unshift({name:nn,sub:ll||'פגשנו היום',d:'היום',mems:ll?[ll]:[]});s.newRow=nn;s.metOpen=false;render();toast('נוסף ✓');return;}
  if(a==='row'){s.person=+b.getAttribute('data-i');s.view='person';render(true);return;}
  if(a==='to-people'){s.view='people';s.newRow='';render(true);return;}
});
