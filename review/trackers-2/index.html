<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<title>המעקבים, סבב שני</title>
<style>
/* TRACKERS, ROUND 2 (Asaf, 26 Oct): mood, hobbies, steps (the idea) and body
   weight were liked - but "not precise, and not like the earlier version,
   which is much prettier and in our line"; the rest were "crowded, trying too
   hard". So every chart now speaks the approved one (review/progress-proto,
   E): one quiet accent as light, a smooth line or a satin fill in a pressed
   channel, numbers in small raised labels, faint guides, lots of air. Each is
   still its own - by its one shape, not by more things on it.
   Fills are the satin approved for nutrition's tubes; channels are pressed
   into the one material. One colour per chart. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(168,160,148,.5);--sh2:rgba(168,160,148,.3);--ink:#4a453f;--mu:#6d675e}
html,body{margin:0;background:#2b2724;font-family:Assistant,"Segoe UI",sans-serif}
.bar{max-width:430px;margin:0 auto;padding:12px 14px 6px;color:#efe6d8}
.bar h1{font-size:19px;margin:0 0 4px}.bar p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#cfc4b4}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{border:none;border-radius:999px;padding:7px 12px;font:700 13px Assistant,sans-serif;background:#3d3732;color:#e6dccd;cursor:pointer}
.sw button.on{background:#efe6d8;color:#2b2724}
.sw button.liked::after{content:" ♥";color:#f0a092}
.again{margin-top:8px;border:none;border-radius:999px;padding:6px 12px;font:700 13px Assistant,sans-serif;background:#efe6d8;color:#2b2724;cursor:pointer}
.wrap{display:flex;justify-content:center;padding:10px 0 30px}
.ph{position:relative;width:390px;height:860px;overflow:hidden;border-radius:34px;background:var(--g);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45);transform-origin:50% 0;padding:26px 20px}
h2{margin:0;font-size:24px;font-weight:800}
.mini{direction:ltr;display:flex;gap:12px;margin-top:20px;align-items:stretch}
.mini .m{flex:1;border-radius:20px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.mini .m span{font-size:13px;color:var(--mu);font-weight:700}
.mini .m b{font-size:30px;font-weight:800;margin-top:2px}
.mini .m b small{font-size:13px;color:var(--mu);margin-inline-start:3px;font-weight:700}
.mini .then{box-shadow:inset 3px 4px 9px var(--sh),inset -3px -3px 8px var(--lit)}
.mini .now{box-shadow:-5px -5px 12px var(--lit),6px 7px 15px var(--sh2)}
.mini .now em{align-self:center;margin-top:6px;padding:4px 11px;border-radius:999px;font-style:normal;font-size:13px;font-weight:800;color:#4f7d4b;direction:rtl;
  box-shadow:inset 1px 2px 4px var(--sh2),inset -1px -1px 3px var(--lit)}
.card{border-radius:24px;padding:16px 14px 10px;margin-top:20px;box-shadow:-5px -5px 12px var(--lit),6px 7px 15px var(--sh2)}
.card svg{display:block;width:100%;direction:ltr;overflow:visible}
svg text{font:700 11px Assistant,sans-serif;fill:#8f877d}
svg text.n{font:800 12px Assistant,sans-serif;fill:#6d675e}
svg text.b{font:800 14px Assistant,sans-serif;fill:#4a453f}
.note{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border-radius:20px;box-shadow:-4px -4px 10px var(--lit),5px 6px 13px var(--sh2);font-size:15px;font-weight:700}
.note .d{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 2px 3px 5px var(--sh),inset -2px -2px 4px var(--lit)}
.note .d i{width:10px;height:10px;border-radius:50%}
.note small{display:block;color:var(--mu);font-weight:600;font-size:13px;margin-top:2px}
/* the pressed channel and the satin fill */
.ch{position:relative;overflow:hidden;background:#e6e3de;box-shadow:inset 3px 5px 9px rgba(168,160,148,.5),inset -3px -3px 7px rgba(255,255,255,.95)}
.fl{position:absolute;left:0;right:0;bottom:0;border-radius:inherit;background:linear-gradient(0deg,var(--dp) -10%,var(--c) 70%,var(--hi) 115%);
  box-shadow:inset 4px 0 7px -3px rgba(0,0,0,.1),inset -4px 0 7px -3px rgba(0,0,0,.12),inset 0 3px 4px -2px rgba(255,255,255,.7)}
.fl.h{top:0;bottom:0;left:auto;right:0;background:linear-gradient(270deg,var(--dp) -10%,var(--c) 70%,var(--hi) 115%)}
.tg{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 2px 4px rgba(120,100,80,.14);font-size:12px;font-weight:800;color:#6d675e;white-space:nowrap}
.tg.lit{background:#fff;color:#4a453f;font-size:13.5px}
.lb{font-size:11.5px;font-weight:700;color:#8f877d}
.goal{position:absolute;left:50%;transform:translateX(-50%);padding:2px 10px;border-radius:999px;background:#ece9e5;font-size:12px;font-weight:800;color:#6d675e;
  box-shadow:-2px -2px 4px rgba(255,255,255,.9),2px 3px 6px rgba(168,160,148,.35)}
/* the goal in the tubes: a notch of light */
.ch .gm,.gleg .gm{position:absolute;left:3px;right:3px;height:3px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.95),0 0 10px rgba(166,144,207,.7);z-index:2}
.gleg{direction:rtl;display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 2px;font-size:12px;font-weight:700;color:#6d675e}
.gleg .gm{position:relative;display:inline-block;width:22px;left:auto;right:auto;background:#fff}
/* strength: lift channels */
.lift{display:grid;gap:16px;padding:4px 2px}
.lr{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:10px}
.ln{font-size:14.5px;font-weight:800;color:#4a453f;white-space:nowrap}
.ln .star{color:#e2a93f;margin-inline-start:4px;font-size:12px;text-shadow:0 0 6px rgba(233,180,76,.7)}
.lch{position:relative;height:18px;border-radius:9px;background:#e6e3de;box-shadow:inset 2px 3px 6px rgba(168,160,148,.45),inset -2px -2px 5px rgba(255,255,255,.95);overflow:hidden}
.lbase{position:absolute;top:0;bottom:0;right:0;z-index:2;border-radius:9px 0 0 9px;background:linear-gradient(270deg,rgba(236,233,229,.62) calc(100% - 12px),rgba(236,233,229,0))}
.lgain{position:absolute;top:0;bottom:0;right:0;border-radius:9px;background:linear-gradient(270deg,var(--dp) -10%,var(--c) 70%,var(--hi) 115%);
  box-shadow:inset 0 3px 4px -2px rgba(255,255,255,.7),inset 0 -3px 5px -3px rgba(0,0,0,.12)}
.lv{direction:ltr;display:flex;align-items:baseline;gap:5px;justify-content:flex-end}
.lv span{font-size:12px;color:#8f877d;font-weight:700}.lv span::after{content:" →";}
.lv b{font-size:16px;font-weight:800;color:#4a453f}
.lv em{display:none}
/* strength: loaded bars */
.bbs{display:grid;gap:6px}
.bbr{padding:3px 2px 0;border-bottom:1px solid rgba(168,160,148,.16)}.bbr:last-child{border-bottom:none}
.bbh{display:flex;justify-content:space-between;align-items:baseline}
.bbv{font-size:12px;color:#6d675e;font-weight:700}.bbv b{font-size:17px;color:#4a453f}
.bbv em{font-style:normal;color:#4f7d4b;font-weight:800;margin-inline-start:6px;padding:2px 7px;border-radius:999px;box-shadow:inset 1px 2px 4px rgba(168,160,148,.3),inset -1px -1px 3px rgba(255,255,255,.95)}
.bb{display:block;width:100%;height:58px;direction:ltr}
.bb text.pt{font:800 11px Assistant,sans-serif;fill:#8f877d;animation:slide .7s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--d) + 650ms);--from:0px}
.bb text.pt.nw{fill:#c0603f}
.plate{animation:slide .7s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--d) + 500ms)}
@keyframes slide{from{transform:translateX(var(--from));opacity:0}to{transform:none;opacity:1}}
/* the book */
.bcov{position:relative;flex:none;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;padding:12px 10px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,#e9c88a,#d9a441);color:#4a3418;box-shadow:-3px -3px 8px rgba(255,255,255,.9),5px 7px 14px rgba(140,110,70,.35);direction:rtl}
.bcov i{position:absolute;left:5px;top:0;bottom:0;width:3px;background:rgba(90,60,20,.18);border-radius:2px}
.bcov b{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:14px;line-height:1.25}
.bcov span{font-size:10.5px;font-weight:700;opacity:.75}
.bcov.done b{font-size:17px}.bcov.done span{font-size:12px}
.bk{direction:rtl;display:flex;gap:16px;align-items:center}
.bki{flex:1;display:grid;gap:10px}
.bkp b{font-size:30px;font-weight:800;line-height:1}.bkp span{display:block;font-size:13px;color:#6d675e;font-weight:700;margin-top:2px}
.bch{position:relative;height:16px;border-radius:8px;overflow:hidden;background:#e6e3de;box-shadow:inset 2px 3px 6px rgba(168,160,148,.45),inset -2px -2px 5px rgba(255,255,255,.95)}
.qh{font-size:13px;font-weight:800;color:#6d675e;margin:18px 2px 8px}
.qt{position:relative;margin-bottom:9px;padding:11px 14px 9px 14px;border-radius:16px;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:15px;line-height:1.5;color:#4a453f;
  box-shadow:inset 2px 3px 6px rgba(168,160,148,.35),inset -2px -2px 5px rgba(255,255,255,.95)}
.qt small{display:block;font-family:Assistant,sans-serif;font-size:11px;color:#8f877d;font-weight:700;margin-top:3px}
.fin{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;text-align:center}
.fin .glow{position:absolute;top:0;left:50%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,rgba(241,196,112,.45),transparent 65%)}
.fint{margin-top:16px;font-size:13px;font-weight:800;color:#b07a1e}
.finb{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:22px;font-weight:700;color:#4a453f;margin-top:2px}
.fins{direction:rtl;display:flex;gap:10px;margin-top:12px}
.fins span{border-radius:14px;padding:7px 12px;font-size:11.5px;color:#6d675e;font-weight:700;box-shadow:-3px -3px 7px rgba(255,255,255,.95),3px 4px 9px rgba(168,160,148,.3)}
.fins b{display:block;font-size:17px;color:#4a453f}
.pages{display:grid;gap:10px;margin-top:16px}
.pg{padding:12px 16px 10px;border-radius:6px 14px 14px 6px;background:#f5f1e8;box-shadow:-2px -2px 6px rgba(255,255,255,.9),3px 4px 10px rgba(168,160,148,.3);
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(180,160,130,.18) 23px 24px)}
.pg p{margin:0;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:15px;line-height:24px;color:#4a453f}
.pg small{display:block;font-size:11px;color:#8f877d;font-weight:700;margin-top:4px}
/* mood legend */
.mleg{direction:rtl;display:flex;justify-content:center;gap:12px;margin:12px 0 2px;flex-wrap:wrap}
.mleg span{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#6d675e}
.mleg i{width:14px;height:14px;border-radius:50%;box-shadow:inset 1px 1px 2px rgba(255,255,255,.7),0 1px 2px rgba(120,100,80,.2)}
/* strength: one row per exercise */
.ex{display:grid;grid-template-columns:1fr 128px 54px;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(168,160,148,.18)}
.ex:last-child{border-bottom:none}
.ex .nm{font-size:15px;font-weight:800;color:#4a453f}
.ex .nm small{display:block;font-size:12.5px;color:#6d675e;font-weight:700;margin-top:1px}
.ex svg{width:128px;height:38px;direction:ltr;overflow:visible}
.ex em{justify-self:start;font-style:normal;font-size:12.5px;font-weight:800;color:#4f7d4b;padding:3px 8px;border-radius:999px;direction:ltr;
  box-shadow:inset 1px 2px 4px rgba(168,160,148,.3),inset -1px -1px 3px rgba(255,255,255,.95)}
.ex .pr{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e9b44c;box-shadow:0 0 6px #e9b44c;margin-inline-start:6px;vertical-align:2px}
/* volume: the pie */
.pie{direction:rtl;display:flex;align-items:center;gap:14px;padding:6px 4px}
.pie .well{position:relative;flex:none;width:170px;height:170px;border-radius:50%;box-shadow:inset 3px 4px 10px rgba(168,160,148,.5),inset -3px -3px 9px rgba(255,255,255,.95)}
.pie svg{position:absolute;inset:0;width:100%;height:100%}
.pie .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pie .ctr b{font-size:30px;font-weight:800;line-height:1}.pie .ctr small{font-size:12px;color:#6d675e;font-weight:700}
.pie ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;flex:1}
.pie li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#4a453f}
.pie li i{flex:none;width:12px;height:12px;border-radius:50%}
.pie li span{margin-inline-start:auto;font-size:12.5px;color:#6d675e;font-weight:700}
/* columns (calories, water) */
.cols{direction:ltr;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.col .tg{font-size:11px;padding:2px 6px}.col .tg.lit{font-size:12px}
.col .ch{width:26px;border-radius:13px}
.col .ch.glass{width:34px;border-radius:12px}
/* rows (volume) */
.rows{display:grid;gap:14px;padding:4px 2px}
.row{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:10px}
.row .nm{font-size:13.5px;font-weight:800;color:var(--ink)}
.row .ch{height:22px;border-radius:11px}
.row .was{position:absolute;top:4px;bottom:4px;width:2px;border-radius:1px;background:rgba(120,100,80,.35)}
/* discs (workouts, evenings) */
.week{direction:rtl;display:flex;justify-content:space-between;margin:6px 2px}
.dsc{display:flex;flex-direction:column;align-items:center;gap:8px}
.dsc i{width:36px;height:36px;border-radius:50%;box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.past{display:flex;align-items:center;justify-content:center;gap:5px;margin:22px 0 6px;direction:ltr;position:relative;padding-top:20px}
.past>span:first-child{position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;color:var(--mu);font-weight:700}
.past .tg{padding:2px 8px}
/* rings (hobbies) */
.rings{direction:rtl;display:flex;justify-content:space-around;padding:6px 0}
.rg{display:flex;flex-direction:column;align-items:center;gap:6px}
.rg .well{position:relative;width:96px;height:96px;border-radius:50%;box-shadow:inset 3px 4px 9px var(--sh),inset -3px -3px 8px var(--lit)}
.rg svg{position:absolute;inset:0}
.rg .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rg .ctr b{font-size:22px;font-weight:800;line-height:1}
.rg .ctr small{font-size:10.5px;color:var(--mu);font-weight:700;margin-top:2px}
.rg .nm{font-size:14.5px;font-weight:800}
/* mood: the sky in a pressed channel */
.sky{position:relative;height:150px;border-radius:20px;overflow:hidden;box-shadow:inset 3px 5px 10px rgba(120,100,80,.25),inset -3px -3px 8px rgba(255,255,255,.7)}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.nums{direction:ltr;display:flex;justify-content:space-between;margin:10px 4px 0}
.nums b{flex:1;text-align:center;font-size:12px;font-weight:800;color:#6d675e}
.nums b.lit{color:#4a453f;font-size:13.5px}
.dates{direction:ltr;display:flex;justify-content:space-between;margin:4px 4px 0}
.dates i{flex:1;text-align:center;font-style:normal;font-size:10.5px;font-weight:700;color:#8f877d}
</style></head><body>
<div class="bar">
  <h1>המעקבים, סבב שני</h1>
  <p>כולם בשפה של הגרף שאהבת: אור שקט בצבע אחד, קו חלק או מילוי סאטן בערוץ לחוץ, מספרים בתוויות, הרבה אוויר. ♥ = מה שאהבת בסבב הקודם.</p>
  <div class="sw" id="sw"></div>
  <button class="again" onclick="draw()">הכניסה שוב ↺</button>
</div>
<div class="wrap"><div class="ph" id="ph"></div></div>
<script>
var W=330,DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
var C={violet:['#a690cf','#8d7ab0','#ddd2f2'],coral:['#f09a85','#e9775c','#ffd0c3'],terra:['#e9946f','#d9724f','#ffd2bd'],blue:['#8db3df','#6f97c8','#d6e5f5'],green:['#86bf84','#5f9f60','#cfe6c9'],amber:['#f1c470','#d9a441','#fbe6bd']};
function nf(x){return Number(x).toLocaleString('he-IL');}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function smooth(P){var n=P.length,d=[],m=[],i;for(i=0;i<n-1;i++)d.push((P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]));
  m[0]=d[0];m[n-1]=d[n-2];for(i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  var p='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(i=0;i<n-1;i++){var h=(P[i+1][0]-P[i][0])/3;p+=' C'+(P[i][0]+h).toFixed(1)+' '+(P[i][1]+m[i]*h).toFixed(1)+' '+(P[i+1][0]-h).toFixed(1)+' '+(P[i+1][1]-m[i+1]*h).toFixed(1)+' '+P[i+1][0].toFixed(1)+' '+P[i+1][1].toFixed(1);}
  return p;}
function tagS(x,y,t,lit){var w=String(t).length*6.8+16;
  return '<g class="an" data-x="'+x.toFixed(0)+'"><rect x="'+(x-w/2).toFixed(1)+'" y="'+(y-11).toFixed(1)+'" width="'+w.toFixed(1)+'" height="22" rx="11" fill="'+(lit?'#fff':'rgba(255,255,255,.72)')+'" style="filter:drop-shadow(0 2px 4px rgba(120,100,80,.14))"/>'+
    '<text x="'+x.toFixed(1)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="middle" class="'+(lit?'b':'n')+'">'+t+'</text></g>';}
/* the goal: a small raised label sitting on a faint line */
function goalTag(x,y,g){var t='יעד '+g,w=t.length*6.6+18;
  return '<rect x="'+(x-w/2).toFixed(1)+'" y="'+(y-11).toFixed(1)+'" width="'+w.toFixed(1)+'" height="22" rx="11" fill="#ece9e5" style="filter:drop-shadow(-2px -2px 3px rgba(255,255,255,.9)) drop-shadow(2px 3px 4px rgba(168,160,148,.35))"/>'+
    '<text x="'+x.toFixed(1)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="middle" class="n">'+t+'</text>';}
function frame(o){
  return '<h2>'+o.t+'</h2>'+(o.noMini?'':'<div class="mini"><div class="m then"><span>'+o.thenL+'</span><b>'+o.thenV+'</b></div>'+
    '<div class="m now"><span>'+o.nowL+'</span><b>'+o.nowV+'</b><em>'+o.chip+'</em></div></div>')+
    '<div class="card" id="cc">'+o.chart+'</div>'+
    '<div class="note"><span class="d"><i style="background:'+o.c+';box-shadow:0 0 8px '+o.c+'"></i></span><div>'+o.say+'<small>'+o.sub+'</small></div></div>';}

/* the approved line (progress-proto E), for a series of 8 weeks */
function line(v,col,o){
  o=o||{};var Hd=250,pt=46,pb=38,px=24,n=v.length,c=col[0],hi=col[2];
  var lo=Math.min.apply(null,v.concat(o.goal!=null?[o.goal]:[])),up=Math.max.apply(null,v),pad=(up-lo||1)*0.22;
  var X=function(k){return px+k*(W-2*px)/(n-1);},Y=function(x){return pt+(1-(x-lo+pad)/(up-lo+2*pad))*(Hd-pt-pb);};
  var P=v.map(function(x,k){return [X(k),Y(x)];}),d=smooth(P),id=o.id||'l';

  s+='</g><g clip-path="url(#rv)"><path d="'+smooth(P)+'" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".95"/></g>';
  P.forEach(function(p,i){s+='<circle class="an" data-x="'+(p[0]*W/Wd).toFixed(0)+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===13?5:3.2)+'" fill="#fff"/>';});
  s+='</svg>';
  var h='<div class="sky">'+s+'</div><div class="nums">'+R.map(function(r,i){return '<b class="an'+(i===13?' lit':'')+'" data-x="'+((i+.5)/n*W).toFixed(0)+'">'+r+'</b>';}).join('')+'</div>'+
    '<div class="dates">'+R.map(function(r,i){return '<i>'+(i%2?(i===13?'היום':(12+i)+'.10'):'')+'</i>';}).join('')+'</div>'+
    '<div class="mleg">'+['כבד','נמוך','בסדר','טוב','מצוין'].map(function(t,i){return '<span><i style="background:'+COL[i]+'"></i>'+t+'</span>';}).join('')+'</div>';
  return frame({noMini:1,t:'מצב רוח',thenL:'ממוצע שבוע שעבר',thenV:'6.4',nowL:'ממוצע השבוע',nowV:'7.7',chip:'<bdi dir="ltr">+1.3</bdi>',c:'#f2b98f',
    chart:h,say:'השבוע הכי בהיר מזה חודש',sub:'הגוון הוא מצב הרוח, הקו והמספרים - ציון היום'});}};

T.moons={name:'ערבים שסוכמו',build:function(){
  var wk=[1,1,1,2,1,1,0],past=['5/7','6/7','6/7','6/7'],c=C.amber,h='<div class="week">';
  wk.forEach(function(s,i){var x=W-(i+.5)/7*W,st='';
    if(s===1)st='background:radial-gradient(circle at 38% 32%,#fff6dc,'+c[0]+' 55%,'+c[1]+');box-shadow:0 0 14px '+c[0]+'88,inset 0 2px 3px rgba(255,255,255,.6)';
    if(s===2)st='background:radial-gradient(circle at 70% 30%,#e9e7e3 46%,transparent 47%),radial-gradient(circle at 38% 32%,#fff6dc,'+c[0]+' 55%,'+c[1]+');box-shadow:0 0 10px '+c[0]+'66';
    h+='<div class="dsc an" data-x="'+x.toFixed(0)+'"><i style="'+st+'"></i><span class="lb">'+DAYS[i]+'</span></div>';});
  h+='</div><div class="past"><span dir="rtl">השבועות הקודמים</span>'+past.map(function(p,k){return '<span class="tg an" data-x="'+(k*60)+'">'+p+'</span>';}).join('')+'</div>';
  return frame({t:'ערבים שסוכמו',thenL:'לפני חודש',thenV:'5<small>מתוך 7</small>',nowL:'השבוע',nowV:'6<small>מתוך 7</small>',chip:'<bdi dir="ltr">+1</bdi> ערב',c:c[0],
    chart:h,say:'15 ערבים ברצף',sub:'חצי ירח = יום החסד'});}};

var ORDER=['weight','food','water','strength','volume','steps','hobbies','mood','book','bookdone'],CUR='weight';
document.getElementById('sw').innerHTML=ORDER.map(function(k){return '<button class="'+(T[k].liked?'liked':'')+'" data-k="'+k+'" onclick="pick(\''+k+'\')">'+T[k].name+'</button>';}).join('');
function pick(k){CUR=k;draw();}
function draw(){[].forEach.call(document.querySelectorAll('#sw button'),function(b){b.classList.toggle('on',b.dataset.k===CUR);});
  document.getElementById('ph').innerHTML=T[CUR].build();enter();}
/* the card glides in from the left; a sweep runs left to right, lines draw
   behind it, and each piece - and each satin fill - arrives as it passes */
function enter(){
  var c=document.getElementById('cc'),r=document.getElementById('rvR'),an=c.querySelectorAll('.an'),gr=c.querySelectorAll('.grow'),RW=r?+r.getAttribute('width'):0;
  c.style.transition='none';c.style.opacity='0';c.style.transform='translateX(-60px)';if(r)r.setAttribute('width','0');
  [].forEach.call(an,function(e){e.style.transition='none';e.style.opacity='0';e.style.transform='translateY(6px)';});
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    c.style.transition='opacity .5s ease,transform .7s cubic-bezier(.22,.61,.36,1)';c.style.opacity='1';c.style.transform='none';
    var t0=performance.now(),D=1400,at=function(x){var f=Math.min(1,Math.max(0,x/W));return 250+D*(1-Math.pow(1-f,1/3))*0.95;};
    if(r)(function step(t){var p=Math.max(0,Math.min(1,(t-t0-250)/D)),e=1-Math.pow(1-p,3);r.setAttribute('width',(e*RW).toFixed(1));if(p<1)requestAnimationFrame(step);})(t0);
    [].forEach.call(an,function(e){var x=+e.getAttribute('data-x')||0;
      setTimeout(function(){e.style.transition='opacity .35s ease,transform .45s cubic-bezier(.22,.61,.36,1)';e.style.opacity='1';e.style.transform='none';
        [].forEach.call(e.querySelectorAll('.grow'),function(g){g.style.transition=(g.dataset.dim==='w'?'width':'height')+' .9s cubic-bezier(.22,.61,.36,1)';g.style[g.dataset.dim==='w'?'width':'height']=g.dataset.v+'%';});},at(x));});
  });});
}
draw();
function fit(){var s=Math.min(1,(innerWidth-8)/390);document.getElementById('ph').style.transform='scale('+s+')';document.querySelector('.wrap').style.height=(860*s+30)+'px';}
addEventListener('resize',fit);fit();
</script>
