<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ברוכים הבאים · ג · השעה שלך</title>
<link rel="stylesheet" href="common.css">
<style>
/* THE HOUR SHE ARRIVES IN: the welcome is drawn in the material of the hour,
   as the home screen will be - here golden hour: sand, and a hint of low sun
   from the left. The name sits large on it, nothing else competes. */
:root{--g:#ece3d4;--lit:rgba(255,251,243,.92);--sh:rgba(186,160,124,.46)}
.s::before{content:"";position:absolute;inset:0 auto auto 0;width:72%;height:520px;pointer-events:none;
  background:radial-gradient(34% 14% at 3% 2%,rgba(255,255,250,.5),transparent 70%),
    linear-gradient(118deg,transparent 6%,rgba(255,255,252,.5) 12%,rgba(255,255,252,.18) 17%,rgba(255,255,252,0) 21%,
      rgba(150,118,80,.05) 24%,rgba(150,118,80,0) 27%,rgba(255,255,252,.28) 31%,rgba(255,255,252,0) 36%,transparent 40%);
  -webkit-mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);
  filter:blur(6px);opacity:0;animation:fadein 2s ease .2s forwards}
.mid{justify-content:flex-start;padding-top:18vh;align-items:flex-start;text-align:start}
.hour{font-size:15px;font-weight:700;color:var(--mu);margin-bottom:8px;opacity:0;animation:up .7s ease .4s forwards}
.wel{font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:0;opacity:0;animation:up .8s ease .7s forwards}
.name{display:block;font-size:52px;letter-spacing:-1.2px;direction:ltr;text-align:start;unicode-bidi:plaintext}
p{font-size:16px;line-height:1.6;color:var(--mu);margin:18px 0 0;max-width:290px;opacity:0;animation:up .7s ease 1.1s forwards}
.dial{align-self:center;margin-top:auto;margin-bottom:26px;opacity:0;animation:up .9s ease 1.4s forwards}
.local{align-self:center;margin-bottom:14px;opacity:0;animation:up .7s ease 1.7s forwards}
.go{opacity:0;animation:up .7s ease 1.9s forwards}
@keyframes fadein{to{opacity:1}}
</style></head><body><div class="s">
<button class="lang">עברית ▾</button>
<div class="mid">
  <div class="hour">שעת ערב, 18:20</div>
  <div class="wel">ברוכים הבאים ל־<span class="name">Better Me</span></div>
  <p>מקום אחד ליום שלך. המסך משתנה עם השעות, כמו היום עצמו.</p>
  <div class="dial" id="d"></div>
</div>
<div class="local">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
<button class="go">נתחיל</button>
</div>
<script src="dial.js"></script><script>welcomeDial(document.getElementById('d'),150,{at:18*60+20});</script>
</body></html>
