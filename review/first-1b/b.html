<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ברוכים הבאים · ב · החוגה נבנית</title>
<link rel="stylesheet" href="common.css">
<style>
/* THE DIAL BUILDS ITSELF, then the name: the plate rises, the rim draws, the
   amber runs to now, the well lights - the home screen she is about to own */
.big{margin:6px 0 30px}
.big .wd-plate{animation:rise .9s cubic-bezier(.2,.9,.3,1) both}
.big svg line{opacity:0;animation:fade .6s ease .7s forwards}
.big .wd-lit{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s ease-out 1s forwards}
.big .wd-now{opacity:0;animation:fade .4s ease 2.5s forwards}
.big .wd-well::before{opacity:0;animation:fade 1.2s ease 1.6s forwards}
.wel{font-size:15px;font-weight:700;color:var(--mu);margin-bottom:6px;opacity:0;animation:up .7s ease 2.6s forwards}
.name{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:0 0 14px;direction:ltr;opacity:0;animation:up .8s ease 2.8s forwards}
p{font-size:16px;line-height:1.6;color:var(--mu);margin:0;max-width:300px;opacity:0;animation:up .7s ease 3.1s forwards}
.local{margin-top:14px;opacity:0;animation:up .7s ease 3.3s forwards}
.go{opacity:0;animation:up .7s ease 3.5s forwards}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
</style></head><body><div class="s">
<button class="lang">עברית ▾</button>
<div class="mid">
  <div class="big" id="d"></div>
  <div class="wel">ברוכים הבאים ל־</div>
  <div class="name">Better Me</div>
  <p>היום שלך, במקום אחד.</p>
  <div class="local">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
</div>
<button class="go">נתחיל</button>
</div>
<script src="dial.js"></script><script>welcomeDial(document.getElementById('d'),250,{at:20*60+10});</script>
</body></html>
