<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>הצינורות של התזונה — אב־טיפוס</title>
<style>
/* THE TUBES (Asaf, 25 Oct): "I don't like that after a meal is logged there
   are lines - as if the meals are divided. I'd like the graphic of what
   fills our tubes to be prettier."
   Today: one flat pastel band per meal with a white hairline on top.
   Three fills, the same channel and numbers. None has a line in it.
   A - one light: a single fill that is a lamp - deep at the bottom, brightest
       at its surface, a glowing surface line, a glass highlight down the side.
   B - liquid light: A, with a soft living surface - a slow wave at the top.
   C - meals as light: A, where the newest meal is simply brighter, fading
       into the earlier ones with no edge between them. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(168,160,148,.5);--ink:#4a453f;--mu:#6d675e}
html,body{margin:0;background:#2b2724;font-family:Assistant,"Segoe UI",sans-serif}
.bar{max-width:430px;margin:0 auto;padding:12px 14px 6px;color:#efe6d8}
.bar h1{font-size:19px;margin:0 0 4px}.bar p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#cfc4b4}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{border:none;border-radius:999px;padding:8px 13px;font:700 13.5px Assistant,sans-serif;background:#3d3732;color:#e6dccd;cursor:pointer}
.sw button.on{background:#efe6d8;color:#2b2724}
.wrap{display:flex;justify-content:center;padding:10px 0 30px}
.ph{position:relative;width:390px;height:430px;overflow:hidden;border-radius:34px;background:var(--g);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45);transform-origin:50% 0;padding:24px 18px}
.card{border-radius:26px;padding:18px 14px 16px;box-shadow:-5px -5px 12px var(--lit),6px 8px 18px rgba(168,160,148,.32)}
.cols{display:flex;justify-content:space-between;gap:4px}
.col{width:74px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lbl{font-size:16px;font-weight:800}.val{font-size:14px;color:var(--mu);font-weight:700;white-space:nowrap}
/* the channel, as shipped */
.track{position:relative;width:30px;height:148px;border-radius:15px;overflow:hidden;background:#e6e3de;
  box-shadow:inset 3px 5px 9px rgba(168,160,148,.5),inset -3px -3px 7px rgba(255,255,255,.95)}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .9s cubic-bezier(.22,.61,.36,1);border-radius:0 0 15px 15px}
/* NOW: bands with a hairline */
.now .band{position:absolute;left:0;right:0;border-top:1.5px solid rgba(255,255,255,.92);transition:height .9s,bottom .9s}
.now .band.first{border-top:none}
/* A - one light */
.A .fill,.B .fill,.C .fill{
  background:
    linear-gradient(90deg,rgba(255,255,255,0) 8%,rgba(255,255,255,.28) 30%,rgba(255,255,255,0) 58%),
    linear-gradient(0deg,var(--deep) 0%,var(--c) 55%,var(--hi) 100%);
  box-shadow:0 0 14px -2px var(--c)}
.A .fill::before,.B .fill::before,.C .fill::before{content:"";position:absolute;left:0;right:0;top:-3px;height:12px;border-radius:50%;filter:blur(3px);
  background:radial-gradient(70% 60% at 50% 45%,rgba(255,255,255,.8),var(--hi) 55%,transparent 80%)}
.A .fill::after,.B .fill::after,.C .fill::after{content:"";position:absolute;left:0;right:0;top:-18px;height:26px;pointer-events:none;
  background:radial-gradient(60% 50% at 50% 70%,var(--glow),transparent 75%)}
/* A1 - glass rod: a cylinder, no bloom */
.A1 .fill{background:
    linear-gradient(90deg,rgba(0,0,0,.07) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,.38) 34%,rgba(255,255,255,0) 50%,rgba(0,0,0,.05) 82%,rgba(0,0,0,.11) 100%),
    linear-gradient(0deg,var(--deep) 0%,var(--c) 60%,var(--hi) 100%)}
.A1 .fill::before{content:"";position:absolute;left:2px;right:2px;top:0;height:7px;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
/* A2 - satin: matte, a meniscus top, shading at the walls */
.A2 .fill{border-radius:15px 15px 15px 15px;background:linear-gradient(0deg,var(--deep) -10%,var(--c) 70%,var(--hi) 115%);
  box-shadow:inset 4px 0 7px -3px rgba(0,0,0,.10),inset -4px 0 7px -3px rgba(0,0,0,.12),inset 0 3px 4px -2px rgba(255,255,255,.7)}
/* A3 - pearl: even and pale, one soft light near the top */
.A3 .fill{background:linear-gradient(0deg,var(--deep) -40%,var(--c) 45%,var(--hi) 100%)}
.A3 .fill::before{content:"";position:absolute;left:6px;top:7px;width:8px;height:22px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.75),rgba(255,255,255,0) 100%)}
.A3 .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 30% 0%,rgba(255,255,255,.25),rgba(255,255,255,0) 60%)}
/* B - a living surface */
.B .fill::before{display:none}
.B .wave{position:absolute;left:-30px;right:-30px;top:-5px;height:10px;pointer-events:none}
.B .wave svg{position:absolute;left:0;top:0;width:180px;height:10px;animation:wv 5.5s linear infinite}
.B .wave svg+svg{animation-duration:8s;opacity:.6}
@keyframes wv{to{transform:translateX(-60px)}}
/* C - the newest meal is brighter, with no edge */
.C .newest{position:absolute;left:0;right:0;top:0;pointer-events:none;transition:height .9s;
  background:linear-gradient(0deg,rgba(255,255,255,0),rgba(255,255,255,.42) 70%,rgba(255,255,255,.55))}
.controls{display:flex;gap:8px;justify-content:center;margin-top:22px}
.controls button{border:none;border-radius:999px;padding:10px 16px;font:800 14px Assistant,sans-serif;color:var(--ink);cursor:pointer;background:var(--g);
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px rgba(168,160,148,.3)}
.note{text-align:center;color:var(--mu);font-size:13px;margin-top:12px;line-height:1.5}
</style></head><body>
<div class="bar">
  <h1>הצינורות של התזונה</h1>
  <p>א׳ כמו שאהבת, ושלוש גרסאות שקטות שלו: בלי הילה שיוצאת מהצינור, והעומק בא מצורת האור בתוכו. "הוסף ארוחה" מראה איך המילוי עולה.</p>
  <div class="sw"><button data-v="now" onclick="pick('now')">היום</button><button data-v="A" class="on" onclick="pick('A')">א׳ · אור אחד</button>
    <button data-v="A1" onclick="pick('A1')">א1 · מוט זכוכית</button><button data-v="A2" onclick="pick('A2')">א2 · סאטן</button><button data-v="A3" onclick="pick('A3')">א3 · פנינה</button></div>
</div>
<div class="wrap"><div class="ph A" id="ph">
  <div class="card"><div class="cols" id="cols"></div></div>
  <div class="controls"><button onclick="addMeal()">הוסף ארוחה</button><button onclick="reset()">התחל מחדש</button></div>
  <div class="note" id="note"></div>
</div></div>
<script>
/* the app's own colours (--nu-cal, --nu-pro, --nu-carb, --nu-fat), each with a
   deeper and a brighter step of the same hue */
var COLS=[{k:'kcal',l:'קק"ל',t:1975,u:'',c:'#f9ce93',deep:'#f0ad5a',hi:'#fde7c4',glow:'rgba(255,214,150,.75)'},
  {k:'p',l:'חלבון',t:155,u:'ג',c:'#fdb7a7',deep:'#f48f78',hi:'#ffdcd2',glow:'rgba(255,190,170,.75)'},
  {k:'c',l:'פחמימה',t:200,u:'ג',c:'#bfd7b4',deep:'#93bb83',hi:'#e2eedb',glow:'rgba(190,225,175,.75)'},
  {k:'f',l:'שומן',t:60,u:'ג',c:'#b2cded',deep:'#86ade0',hi:'#dbe8f8',glow:'rgba(175,205,240,.75)'}];
var MEALS=[{kcal:330,p:20,c:27,f:16},{kcal:520,p:42,c:30,f:24},{kcal:150,p:12,c:15,f:4},{kcal:610,p:38,c:70,f:18}];
var n=3,v='A';
function pick(x){v=x;document.getElementById('ph').className='ph '+x;[].forEach.call(document.querySelectorAll('.sw button'),function(b){b.classList.toggle('on',b.dataset.v===x);});draw(true);}
function sums(k,m){var s=0;for(var i=0;i<m;i++)s+=MEALS[i][k];return s;}
function draw(instant){
  var h='';
  COLS.forEach(function(c,ci){
    var tot=sums(c.k,n),pct=Math.min(100,tot/c.t*100),last=n?MEALS[n-1][c.k]/c.t*100:0;
    var inner='';
    if(v==='now'){var b=0;for(var i=0;i<n;i++){var s=MEALS[i][c.k]/c.t*100;if(b+s>100)s=100-b;
      inner+='<div class="band'+(i===0?' first':'')+'" style="bottom:'+b+'%;height:'+s+'%;background:'+(i===n-1?c.c:c.hi)+'"></div>';b+=s;}}
    else{
      inner='<div class="fill" data-p="'+pct+'" style="height:'+(instant?pct:0)+'%">'+
        (v==='B'?'<div class="wave">'+wave(c.hi,1)+wave('#fff',.9)+'</div>':'')+
        (v==='C'&&pct?'<div class="newest" style="height:'+Math.min(100,last/pct*100)+'%"></div>':'')+'</div>';
    }
    h+='<div class="col" style="--c:'+c.c+';--deep:'+c.deep+';--hi:'+c.hi+';--glow:'+c.glow+'"><div class="track">'+inner+'</div>'+
       '<div class="lbl">'+c.l+'</div><div class="val">'+tot.toLocaleString()+(c.u?c.u:'')+' / '+c.t.toLocaleString()+(c.u?c.u:'')+'</div></div>';
  });
  document.getElementById('cols').innerHTML=h;
  if(!instant)requestAnimationFrame(function(){requestAnimationFrame(function(){[].forEach.call(document.querySelectorAll('.fill[data-p]'),function(f){f.style.height=f.dataset.p+'%';});});});
  document.getElementById('note').textContent=n+' ארוחות היום';
}
function wave(col,op){return '<svg viewBox="0 0 180 10" preserveAspectRatio="none" style="opacity:'+op+'"><path d="M0 5 Q15 1 30 5 T60 5 T90 5 T120 5 T150 5 T180 5 V10 H0Z" fill="'+col+'"/></svg>';}
function addMeal(){if(n<MEALS.length){var prev=[].map.call(document.querySelectorAll('.fill[data-p]'),function(f){return f.dataset.p;});n++;draw(true);
  if(v!=='now'){var fs=document.querySelectorAll('.fill[data-p]');[].forEach.call(fs,function(f,i){var to=f.dataset.p;f.style.transition='none';f.style.height=prev[i]+'%';
    requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.transition='';f.style.height=to+'%';});});});}}}
function reset(){n=1;draw(false);}
draw(false);
function fit(){var s=Math.min(1,(innerWidth-8)/390);document.getElementById('ph').style.transform='scale('+s+')';document.querySelector(".wrap").style.height=(430*s+30)+'px';}
addEventListener('resize',fit);fit();
</script>
</body></html>
