<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>הכניסה: צעדים 1–2</title>
<style>
/* ONE BEEM FOR THE WHOLE DOOR. He is one element that never leaves: on
   "נתחיל" he slides to the left and shrinks, and each step's words arrive
   beside him, as if he is the one asking. */
:root{--g:#ece3d4;--lit:rgba(255,251,243,.92);--sh:rgba(186,160,124,.46);--sh2:rgba(186,160,124,.3);--ink:#4a453f;--mu:#5f5850}
html,body{margin:0;height:100%;background:var(--g);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif;overflow:hidden}
.s{height:100%;box-sizing:border-box;position:relative;overflow:hidden}
.s::before{content:"";position:absolute;inset:0 auto auto 0;width:72%;height:520px;pointer-events:none;
  background:radial-gradient(34% 14% at 3% 2%,rgba(255,255,250,.5),transparent 70%),
    linear-gradient(118deg,transparent 6%,rgba(255,255,252,.5) 12%,rgba(255,255,252,.18) 17%,rgba(255,255,252,0) 21%,
      rgba(150,118,80,.05) 24%,rgba(150,118,80,0) 27%,rgba(255,255,252,.28) 31%,rgba(255,255,252,0) 36%,transparent 40%);
  -webkit-mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);mask-image:radial-gradient(120% 90% at 0% 0%,#000 0,#000 30%,transparent 72%);
  filter:blur(6px)}
.lang{position:absolute;top:22px;right:24px;z-index:3;border:none;background:var(--g);border-radius:999px;padding:8px 14px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--mu);box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh);transition:opacity .4s}
.s:not(.at-1) .lang{opacity:0;pointer-events:none}
/* Beem: centred and large on the welcome; small, at the left, from step 2 */
#beem{position:absolute;z-index:2;width:230px;height:230px;left:calc(50% - 115px);top:17%;
  transition:left .85s cubic-bezier(.2,.9,.3,1),top .85s cubic-bezier(.2,.9,.3,1),transform .85s cubic-bezier(.2,.9,.3,1);transform-origin:0 0}
.s:not(.at-1) #beem{left:14px;top:46px;transform:scale(.5)}
/* the steps */
.scr{position:absolute;inset:0;box-sizing:border-box;padding:22px 24px 34px;display:flex;flex-direction:column;
  opacity:0;transform:translateX(-24px);pointer-events:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.3,1)}
.scr.on{opacity:1;transform:none;pointer-events:auto;transition-delay:.25s}
.scr.gone{opacity:0;transform:translateX(30px)}
.go{width:100%;border:none;border-radius:18px;padding:17px;background:var(--g);font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  box-shadow:-6px -6px 15px var(--lit),8px 10px 22px var(--sh);transition:opacity .3s}
.go:disabled{opacity:.45}
.skip{border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--mu);margin-top:12px;padding:8px}
/* 1 · welcome */
#s1{align-items:center;text-align:center}
#s1 .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9vh}
#s1 .wel{font-size:15px;font-weight:700;color:var(--mu);margin-bottom:6px}
#s1 .name{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:0 0 14px;direction:ltr}
#s1 p{font-size:16px;line-height:1.6;color:var(--mu);margin:0;max-width:340px;text-wrap:balance}
#s1 .local{font-size:12.5px;color:var(--mu);margin-top:14px}
/* 2 · his question, beside him */
.ask{padding-top:150px;flex:1;display:flex;flex-direction:column}
.q{font-size:30px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin:0 0 8px}
.why{font-size:15px;line-height:1.55;color:var(--mu);margin:0 0 26px;max-width:320px}
.field{width:100%;box-sizing:border-box;border:none;border-radius:18px;padding:17px 18px;background:var(--g);font-family:inherit;font-size:20px;font-weight:700;color:var(--ink);
  box-shadow:inset 4px 5px 10px var(--sh),inset -4px -4px 9px var(--lit);outline:none}
.field::placeholder{color:#8f877d;font-weight:600}
.said{font-size:18px;font-weight:800;color:var(--ink);min-height:28px;margin:18px 2px 0;opacity:0;transition:opacity .4s}
.said.on{opacity:1}
.rows{display:flex;flex-direction:column;gap:12px}
.row{border:none;border-radius:18px;padding:17px 18px;background:var(--g);font-family:inherit;font-weight:800;font-size:18px;color:var(--ink);text-align:start;
  box-shadow:-5px -5px 12px var(--lit),6px 8px 16px var(--sh2)}
.row.on{box-shadow:inset 4px 5px 10px var(--sh),inset -4px -4px 9px var(--lit)}
.end{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center;padding-top:120px}
.end .q{font-size:28px}
.next{font-size:14px;color:var(--mu);margin-top:16px}
@media (prefers-reduced-motion:reduce){#beem,.scr{transition:none}}
</style></head><body><div class="s at-1" id="s">
<button class="lang">עברית ▾</button>
<div id="beem"></div>

<section class="scr on" id="s1">
  <div class="mid">
    <div class="wel">ברוכים הבאים ל־</div>
    <div class="name">Better Me</div>
    <p>התכוננו להפוך לגרסה הטובה ביותר של עצמכם.</p>
    <div class="local">בלי חשבון. הכול נשאר על הטלפון הזה.</div>
  </div>
  <button class="go" onclick="to(2)">נתחיל</button>
</section>

<section class="scr" id="s2">
  <div class="ask">
    <div class="q">היי, אני בים.<br>איך קוראים לך?</div>
    <div class="why">רק כדי שאדע איך לפנות אלייך. אפשר גם בלי.</div>
    <input class="field" id="nm" placeholder="השם שלך" autocomplete="given-name" maxlength="24">
    <div class="said" id="said"></div>
  </div>
  <button class="go" id="g2" onclick="named()" disabled>אפשר להמשיך</button>
  <button class="skip" onclick="to(3)">אולי אחר כך</button>
</section>

<section class="scr" id="s3">
  <div class="ask">
    <div class="q" id="q3">איך לפנות אלייך?</div>
    <div class="why">בעברית כל משפט נושא מגדר, אז זה משנה איך אדבר איתך בכל מסך.</div>
    <div class="rows">
      <button class="row" onclick="addr('f',this)">בלשון נקבה</button>
      <button class="row" onclick="addr('m',this)">בלשון זכר</button>
    </div>
  </div>
</section>

<section class="scr" id="s4">
  <div class="end">
    <div class="q" id="q4"></div>
    <div class="next">כאן מתחיל צעד 3: מה חשוב לך.</div>
  </div>
</section>
</div>

<script src="beem.js"></script>
<script>
var B=null,name='',cur=1;
/* his small reactions, from the kit's own faces and motions */
var S={
  smile:SMILE,
  listen:{dur:4000,ev:[[0,'face','curious'],[0,'mode',{breathe:[.016,4],idle:0}],[200,'look',0,-6]]},
  think:{dur:4000,ev:[[0,'face','thinking'],[0,'mode',{breathe:[.016,4],idle:0}]]},
  glad:{dur:6000,ev:[[0,'face','happy'],[0,'mode',{breathe:[.018,4],idle:0}],[150,'nod',1,10],[1100,'face','wink'],[1500,'face','happy'],
    [1700,'fx',{t:'rings',v:{sc:[1.1,1.13,1.16]},d:1600,s:100}],[3400,'fx',{t:'rings',v:{sc:1},d:1600,s:100}]]}
};
function play(k){if(B)B.play(S[k]);}
var sc=document.createElement('script');sc.src='../../vendor/beem-app.js';
sc.onload=function(){BeemKit.ready.then(function(){B=BeemKit.mount(document.getElementById('beem'),{play:SMILE});});};
document.head.appendChild(sc);

function to(n){
  var a=document.getElementById('s'+cur),b=document.getElementById('s'+n);
  a.classList.remove('on');a.classList.add('gone');
  b.classList.remove('gone');b.classList.add('on');
  document.getElementById('s').className='s at-'+n;cur=n;
  if(n===2){play('listen');setTimeout(function(){document.getElementById('nm').focus();},700);}
  if(n===3)play('smile');
}
var nm=document.getElementById('nm'),tq=0;
nm.addEventListener('input',function(){
  document.getElementById('g2').disabled=!nm.value.trim();
  play('think');clearTimeout(tq);tq=setTimeout(function(){play('listen');},900);
});
nm.addEventListener('keydown',function(e){if(e.key==='Enter'&&nm.value.trim())named();});
function named(){
  name=nm.value.trim();nm.blur();
  var s=document.getElementById('said');s.textContent='נעים מאוד, '+name+'.';s.classList.add('on');
  play('glad');setTimeout(function(){to(3);},1500);
}
function addr(g,el){
  el.classList.add('on');play('glad');
  /* the very next sentence already speaks to her the way she chose */
  document.getElementById('q4').textContent=(g==='f'?'מעולה. ברוכה הבאה':'מעולה. ברוך הבא')+(name?', '+name:'')+'.';
  setTimeout(function(){to(4);},900);
}
</script>
</body></html>
