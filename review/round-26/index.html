<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>ארבע החלטות — 26.10</title>
<style>
/* Asaf's TestFlight notes 3-6 (26 Oct), as options before anything is built:
   3 the well over the first reflection, 4 a goals screen after the nutrition
   questions, 5 the goal without the purple line, 6 Mip explaining each area. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#2b2724;font-family:Assistant,sans-serif;color:#efe6d8}
.bar{max-width:440px;margin:0 auto;padding:12px 14px 4px}
.bar h1{font-size:19px;margin:0 0 4px}.bar p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#cfc4b4}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sw button{border:none;border-radius:999px;padding:7px 12px;font:700 13px Assistant,sans-serif;background:#3d3732;color:#e6dccd;cursor:pointer}
.sw button.on{background:#efe6d8;color:#2b2724}
.note{max-width:440px;margin:0 auto;padding:0 14px;font-size:13.5px;line-height:1.55;color:#cfc4b4;min-height:42px}
.wrap{display:flex;justify-content:center;padding:8px 0 30px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;border-radius:46px;transform-origin:50% 0;box-shadow:0 18px 50px rgba(0,0,0,.45);flex:none}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
/* the first run's cream material */
.cream{background:#ece3d4;color:#4a453f;--g:#ece3d4;--lit:rgba(255,251,243,.92);--sh:rgba(186,160,124,.46);--sh2:rgba(186,160,124,.3)}
/* the app's soft white */
.soft{background:#e9e7e3;color:#4a453f;--g:#e9e7e3;--lit:rgba(255,255,255,.95);--sh:rgba(168,160,148,.5);--sh2:rgba(168,160,148,.3)}
.mip{position:absolute}
.q{position:absolute;left:24px;right:24px;text-align:center}
.q h2{font-size:30px;font-weight:800;line-height:1.2;margin:0}
.q p{font-size:15px;color:#6d675e;margin:10px 0 0}
.field{position:absolute;left:24px;right:24px;height:110px;border-radius:26px;background:var(--g);
  box-shadow:inset 3px 4px 9px var(--sh),inset -3px -3px 8px var(--lit);padding:18px;text-align:center;color:#8a8278;font-size:16px}
.btn{position:absolute;left:24px;right:24px;height:58px;border-radius:24px;background:var(--g);display:grid;place-items:center;font-weight:800;font-size:17px;
  box-shadow:-5px -5px 12px var(--lit),7px 9px 20px var(--sh)}
.link{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:15px;color:#6d675e}
.dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:9px}
.dots i{width:10px;height:10px;border-radius:50%;box-shadow:inset 1px 2px 3px var(--sh),inset -1px -1px 2px var(--lit)}
.dots i.on{background:#f0a92e}
.dots i.now{width:26px;border-radius:6px;background:#f6d9a6;box-shadow:inset 1px 2px 3px rgba(186,140,70,.35)}
.step{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#8a8278}
/* goals */
.gh{position:absolute;left:24px;right:24px;text-align:center}
.gh h2{font-size:28px;font-weight:800;margin:0}.gh p{font-size:14.5px;color:#6d675e;margin:8px 0 0;line-height:1.5}
.kc{position:absolute;left:50%;width:190px;height:190px;margin-left:-95px;border-radius:50%;background:var(--g);display:grid;place-items:center;text-align:center;
  box-shadow:inset 6px 8px 16px var(--sh),inset -6px -6px 14px var(--lit)}
.kc b{display:block;font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.kc span{display:block;font-size:13px;color:#6d675e;font-weight:700;margin-top:4px}
.tubes{position:absolute;left:30px;right:30px;display:flex;justify-content:space-between}
.tb{width:70px;text-align:center}
.tb .t{position:relative;height:150px;width:52px;margin:0 auto;border-radius:26px;background:var(--g);overflow:hidden;
  box-shadow:inset 3px 4px 8px var(--sh),inset -3px -3px 7px var(--lit)}
.tb .t i{position:absolute;left:5px;right:5px;bottom:5px;border-radius:22px;transform-origin:50% 100%;animation:fill 1.4s cubic-bezier(.22,.61,.36,1) both}
@keyframes fill{from{transform:scaleY(0)}}
.tb b{display:block;font-size:15px;margin-top:10px}.tb span{display:block;font-size:12.5px;color:#6d675e;font-weight:700}
.rows{position:absolute;left:24px;right:24px;display:flex;flex-direction:column;gap:12px}
.rw{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:22px;background:var(--g);box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--sh2)}
.rw i{width:12px;height:12px;border-radius:50%;flex:none}
.rw b{flex:1;font-size:16px}.rw span{font-size:17px;font-weight:800}
.rw small{font-size:12.5px;color:#6d675e;font-weight:700;margin-inline-start:4px}
/* chart */
.card{position:absolute;left:16px;right:16px;border-radius:28px;background:var(--g);padding:18px 16px 14px;box-shadow:-5px -5px 12px var(--lit),7px 9px 22px var(--sh2)}
.card h3{margin:0 0 4px;font-size:15px;color:#6d675e}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:-2px -2px 5px var(--lit),3px 3px 7px var(--sh2)}
.leg{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#6d675e;font-weight:700}
svg text{font-family:Assistant,sans-serif}
.col{display:flex;justify-content:space-between;align-items:flex-end;height:210px;margin-top:14px;padding:0 4px}
.cl{width:30px;text-align:center}
.cl .t{position:relative;height:180px;width:26px;margin:0 auto;border-radius:13px;background:var(--g);overflow:hidden;box-shadow:inset 2px 3px 6px var(--sh),inset -2px -2px 5px var(--lit)}
.cl .t i{position:absolute;left:4px;right:4px;bottom:4px;border-radius:10px;background:linear-gradient(#f3b866,#e98a4f);transform-origin:50% 100%;animation:fill 1.2s cubic-bezier(.22,.61,.36,1) both}
.cl .t i.full{background:linear-gradient(#f6c46b,#f0a92e)}
.cl .t i.over{background:linear-gradient(#ee9f86,#d9735a)}
.cl .t i.under{background:linear-gradient(#f5dcae,#efc27c)}
.cl span{display:block;font-size:11.5px;color:#8a8278;font-weight:700;margin-top:6px}
/* areas */
.ahd{position:absolute;top:54px;right:22px;left:22px}
.ahd h2{font-size:34px;font-weight:800;margin:0}.ahd p{font-size:14px;color:#6d675e;margin:8px 0 0}
.ghost{position:absolute;left:18px;right:18px;border-radius:24px;background:var(--g);box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--sh2)}
.niche{position:absolute;top:48px;left:16px;width:78px;height:78px;border-radius:50%;background:var(--g);box-shadow:-4px -4px 10px var(--lit),5px 7px 16px var(--sh2)}
.veil{position:absolute;inset:0;background:rgba(74,69,63,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .5s both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;border-radius:34px;background:var(--g);padding:22px 24px 24px;text-align:center;
  box-shadow:0 -10px 40px rgba(110,92,72,.25);animation:up .6s cubic-bezier(.22,.61,.36,1) both}
@keyframes up{from{transform:translateY(110%)}}
.sheet h3{font-size:24px;margin:6px 0 8px}.sheet p{font-size:15.5px;line-height:1.55;color:#5f5850;margin:0 0 18px}
.sheet .ok{height:54px;border-radius:22px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--g);box-shadow:-4px -4px 10px var(--lit),6px 8px 18px var(--sh)}
.bub{position:absolute;top:118px;left:22px;right:22px;border-radius:26px;background:#fbfaf8;padding:16px 18px 14px;box-shadow:0 14px 34px rgba(110,92,72,.22);
  transform-origin:12% 0;animation:pop .55s .25s cubic-bezier(.3,1.4,.5,1) both}
.bub::before{content:"";position:absolute;top:-9px;left:42px;width:20px;height:20px;background:#fbfaf8;transform:rotate(45deg);border-radius:4px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.bub b{display:block;font-size:17px;margin-bottom:4px}.bub p{margin:0;font-size:15px;line-height:1.5;color:#5f5850}
.bub .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.bub .row span{font-size:13px;color:#8a8278;font-weight:700}
.bub .row button{border:none;border-radius:999px;padding:8px 16px;font:800 14px Assistant,sans-serif;color:#4a453f;background:#e9e7e3;box-shadow:-2px -2px 5px #fff,3px 3px 8px rgba(168,160,148,.35)}
.list{max-width:440px;margin:0 auto;padding:0 14px 40px}
.list .it{background:#3a342f;border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:14px;line-height:1.55}
.list .it b{color:#f0c98a}
</style></head><body>
<div class="bar">
  <h1>ארבע החלטות מהבדיקה ב־TestFlight</h1>
  <p>נקודות 1 ו־2 כבר תוקנו ב־dev. כאן 3 עד 6: לכל אחת שתי דרכים. בחר אות לכל מספר.</p>
  <div class="sw" id="topic"><button data-k="well" class="on">3 · הבאר</button><button data-k="goals">4 · המטרות</button><button data-k="chart">5 · היעד בגרף</button><button data-k="areas">6 · מיפ מסביר</button></div>
  <div class="sw" id="opt"></div>
</div>
<div class="note" id="note"></div>
<div class="wrap"><div class="ph" id="ph"></div></div>
<div class="list" id="list"></div>
<script>window.BEEM_ASSET_BASE='../../dev/assets/';</script>
<script src="../../vendor/beem-app.js"></script>
<script>
var AREAS=[
 ['תזונה','כאן רושמים מה אכלת, במילים או בתמונה. אני סופר קלוריות, חלבון ומים, ומראה איך היום מתקדם מול המטרות שלך.'],
 ['כושר','כאן בונים תוכנית אימונים ורושמים כל אימון. אני עוקב אחרי המשקלות והחזרות ומראה לך כשאתה מתחזק.'],
 ['הארון שלי','כאן מצלמים את הבגדים שלך. אחר כך אפשר להרכיב מהם לוקים ולראות מה באמת לובשים.'],
 ['תכנון זמן','כאן מתכננים את השבוע ואת היום שאחרי. כותבים מה חשוב, גוררים לשעה, ואני מזכיר כשמגיע הזמן.'],
 ['האנשים שלי','כאן שומרים את האנשים שחשובים לך: מה קורה איתם, ימי הולדת, ומתי דיברתם. כשעובר זמן, אני מזכיר.'],
 ['תחביבים','כאן עוקבים אחרי מה שאתה אוהב לעשות: כמה זמן, כמה פעמים, ואיך זה מתקדם.'],
 ['תובנות','כאן נשמרות מחשבות, שאלות וגילויים. משפט שעלה לך במהלך היום, כדי שלא ילך לאיבוד.'],
 ['סיום יום','כל ערב כמה שאלות קצרות על היום. זה הלב של האפליקציה: מכאן אני לומד מה עובד בשבילך.']];
var T={
 well:{note:'בשאלה הראשונה של סיום יום עמדה באר שקופה ליד מיפ. היא הייתה אמורה להתמלא עם כל תשובה, כמו המרכז של החוגה בבית, אבל שום דבר לא הסביר את זה.',
  o:{A:'בלי באר: רק מיפ, במרכז',B:'במקומה התקדמות ברורה: נקודות ו"שאלה 2 מתוך 4"'}},
 goals:{note:'היום, כשמסיימים את השאלון, נכנסים ישר לאזור. במקום זה, מסך אחד שמראה מה יצא מהתשובות ולמה, לפני שנכנסים.',
  o:{A:'הצינורות של המסך היומי, מתמלאים עד היעד',B:'שורות פשוטות, מספר ליד כל אחת'}},
 chart:{note:'הקו הסגול המקווקו מסמן את היעד. שתי דרכים בלי קו בכלל:',
  o:{A:'נקודות על הגרף, היעד כתווית אחת למעלה',B:'צינור לכל יום: מלא = הגיע ליעד'}},
 areas:{note:'בכניסה הראשונה לכל אזור מיפ אומר במשפט מה עושים בו. פעם אחת לכל אזור, וכל המשפטים מופיעים למטה.',
  o:{A:'דף שעולה מלמטה, עם מיפ גדול',B:'בועה שיוצאת ממיפ שבפינה'}}
};
var K='well',O='A',AR=3;
function mount(el,size,play){if(!window.BeemKit)return;BeemKit.ready.then(function(){if(el.isConnected)BeemKit.mount(el,play?{play:play}:{});});}
function draw(){
  var t=T[K],ph=document.getElementById('ph'),h='';
  document.getElementById('note').textContent=t.note;
  document.getElementById('opt').innerHTML=Object.keys(t.o).map(function(k){return '<button data-o="'+k+'" class="'+(k===O?'on':'')+'">'+k+' · '+t.o[k]+'</button>';}).join('');
  [].forEach.call(document.querySelectorAll('#opt button'),function(b){b.onclick=function(){O=b.dataset.o;draw();};});
  var L='';
  if(K==='well'){
    h='<div class="scr on cream">';
    if(O==='A')h+='<div class="mip" id="m1" style="left:110px;top:80px;width:170px;height:170px"></div>';
    else h+='<div class="mip" id="m1" style="left:120px;top:76px;width:150px;height:150px"></div><div class="dots" style="top:250px"><i class="on"></i><i class="now"></i><i></i><i></i></div><div class="step" style="top:270px">שאלה 2 מתוך 4</div>';
    h+='<div class="q" style="top:'+(O==='A'?300:316)+'px"><h2>מה היה הרגע הכי טוב שלך היום?</h2><p>אפילו רגע קטן.</p></div>'+
      '<div class="field" style="top:'+(O==='A'?440:456)+'px">כתוב כאן…</div><div class="btn" style="top:690px">שמרתי</div><div class="link" style="top:775px">אין לי משהו היום</div></div>';
  }
  if(K==='goals'){
    h='<div class="scr on cream"><div class="mip" id="m1" style="left:150px;top:48px;width:90px;height:90px"></div>'+
      '<div class="gh" style="top:150px"><h2>המטרות שלך</h2><p>לפי מה שסיפרת: ירידה של כחצי קילו בשבוע,<br>בלי לוותר על חלבון.</p></div>';
    if(O==='A'){
      h+='<div class="kc" style="top:250px"><div><b>2,180</b><span>קק״ל ביום</span></div></div>'+
        '<div class="tubes" style="top:470px">'+
        [['חלבון','150 ג׳','#c7b2e8','#a690cf',.9],['פחמימה','210 ג׳','#f3c98a','#e9a24f',.75],['שומן','70 ג׳','#f2b2a0','#e48a73',.55],['מים','2.4 ל׳','#bcd6ee','#8db8e0',.8]]
        .map(function(x,i){return '<div class="tb"><div class="t"><i style="top:'+(150*(1-x[4]))+'px;background:linear-gradient('+x[2]+','+x[3]+');animation-delay:'+(.3+i*.15)+'s"></i></div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('')+'</div>';
    }else{
      h+='<div class="rows" style="top:250px">'+
        [['קלוריות','2,180','קק״ל','#f0a92e'],['חלבון','150','ג׳','#a690cf'],['פחמימה','210','ג׳','#e9a24f'],['שומן','70','ג׳','#e48a73'],['מים','2.4','ליטר','#8db8e0']]
        .map(function(x){return '<div class="rw"><i style="background:'+x[3]+'"></i><b>'+x[0]+'</b><span>'+x[1]+'<small>'+x[2]+'</small></span></div>';}).join('')+'</div>';
    }
    h+='<div class="btn" style="top:690px">מתחילים</div><div class="link" style="top:775px">לשנות את המטרות</div></div>';
  }
  if(K==='chart'){
    var v=[1650,2410,2180,1820,2230,1500,2460],g=2180,d=['20.10','21.10','22.10','23.10','24.10','25.10','26.10'];
    h='<div class="scr on soft"><div class="ahd" style="top:54px"><h2>היסטוריה</h2></div><div class="card" style="top:140px">';
    if(O==='A'){
      var W=326,H=230,mx=2900,mn=1500,pts=v.map(function(x,i){return [12+i*(W-24)/6,H-20-(x-mn)/(mx-mn)*(H-50)];});
      h+='<div style="display:flex;justify-content:space-between;align-items:center"><h3>צריכה קלורית</h3><span class="chip">יעד 2,180</span></div>'+
        '<svg viewBox="0 0 '+W+' '+(H+20)+'" width="100%"><polyline fill="none" stroke="#e98a4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p.join(',');}).join(' ')+'"/>'+
        pts.map(function(p,i){var near=Math.abs(v[i]-g)/g<=.06;return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(near?7:5.5)+'" fill="'+(near?'#f0a92e':'#e9e7e3')+'" stroke="'+(near?'#fff':'#e98a4f')+'" stroke-width="2.5"/><text x="'+p[0]+'" y="'+(p[1]-14)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#6d675e">'+v[i].toLocaleString('en')+'</text><text x="'+p[0]+'" y="'+(H+14)+'" text-anchor="middle" font-size="11" fill="#8a8278">'+d[i]+'</text>';}).join('')+'</svg>'+
        '<div class="leg"><span>נקודה ענברית = יום קרוב ליעד</span></div>';
    }else{
      h+='<div style="display:flex;justify-content:space-between;align-items:center"><h3>צריכה קלורית</h3><span class="chip">יעד 2,180</span></div><div class="col">'+
        v.map(function(x,i){var r=Math.min(1,x/g),c=x>g*1.06?'over':x>=g*.94?'full':'under';return '<div class="cl"><div class="t"><i class="'+c+'" style="top:'+(4+172*(1-r))+'px;animation-delay:'+(i*.08)+'s"></i></div><span>'+d[i].slice(0,2)+'</span></div>';}).join('')+
        '</div><div class="leg"><span>מלא בענבר = ביעד · אדמדם = מעל היעד · חלקי = מתחת</span></div>';
    }
    h+='</div></div>';
  }
  if(K==='areas'){
    var a=AREAS[AR];
    h='<div class="scr on soft"><div class="niche" id="nb"></div><div class="mip" id="m0" style="left:16px;top:48px;width:78px;height:78px"></div>'+
      '<div class="ahd" style="top:58px;left:110px"><h2 style="text-align:right">'+a[0]+'</h2></div>'+
      '<div class="ghost" style="top:200px;height:70px"></div><div class="ghost" style="top:290px;height:150px"></div><div class="ghost" style="top:460px;height:200px"></div>';
    if(O==='A')h+='<div class="veil"></div><div class="sheet"><div class="mip" id="m1" style="position:relative;width:120px;height:120px;margin:0 auto"></div><h3>'+a[0]+'</h3><p>'+a[1]+'</p><div class="ok">הבנתי</div></div>';
    else h+='<div class="bub"><b>'+a[0]+'</b><p>'+a[1]+'</p><div class="row"><span>פעם אחת, בכניסה הראשונה</span><button>הבנתי</button></div></div>';
    h+='</div>';
    L='<div class="sw" style="max-width:440px;margin:0 auto 10px;padding:0 14px">'+AREAS.map(function(x,i){return '<button data-a="'+i+'" class="'+(i===AR?'on':'')+'" style="border:none;border-radius:999px;padding:6px 11px;font:700 12.5px Assistant,sans-serif;background:'+(i===AR?'#efe6d8':'#3d3732')+';color:'+(i===AR?'#2b2724':'#e6dccd')+'">'+x[0]+'</button>';}).join('')+'</div>'+
      AREAS.map(function(x){return '<div class="it"><b>'+x[0]+'</b> — '+x[1]+'</div>';}).join('');
  }
  ph.innerHTML=h;
