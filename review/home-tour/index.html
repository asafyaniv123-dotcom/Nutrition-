<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>המסך הראשי: בים מראה</title>
<style>
/* THE FIRST LOOK AT HOME. She lands on the real screen and Beem shows her four
   things, one at a time: everything else dims, the one thing stays lit, and his
   card sits on the side that is free. Drawn over a capture of dev's home. */
:root{--g:#ece3d4;--lit:rgba(255,251,243,.92);--sh:rgba(186,160,124,.46);--sh2:rgba(186,160,124,.3);--ink:#4a453f;--mu:#5f5850}
html,body{margin:0;height:100%;background:#2b2724;font-family:Assistant,"Segoe UI",Arial,sans-serif;overflow:hidden}
.ph{position:absolute;left:50%;top:0;width:390px;height:844px;transform-origin:50% 0;background:url(home.png) 0 0/390px 844px no-repeat}
svg.dim{position:absolute;inset:0;width:390px;height:844px;pointer-events:none}
svg.dim path{fill:rgba(42,34,27,.58);transition:d .6s cubic-bezier(.2,.9,.3,1)}
.ring{fill:none;stroke:rgba(255,246,228,.85);stroke-width:2;stroke-dasharray:4 6;opacity:.0;transition:opacity .4s}
.card{position:absolute;left:16px;right:16px;background:var(--g);border-radius:24px;padding:16px 18px 14px;color:var(--ink);
  box-shadow:0 18px 40px rgba(20,14,8,.35);transition:top .6s cubic-bezier(.2,.9,.3,1),opacity .3s}
.row{display:flex;gap:12px;align-items:flex-start}
.bm{flex:0 0 64px;width:64px;height:64px;margin-top:-4px}
.t{font-size:19px;font-weight:800;line-height:1.3;margin:2px 0 6px}
.d{font-size:15.5px;line-height:1.55;color:var(--mu)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#cdbfac}.dots i.on{background:#b0782e}
.btns{display:flex;gap:6px;align-items:center}
.skip{border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;color:var(--mu);padding:8px}
.next{border:none;border-radius:999px;padding:10px 20px;background:var(--g);font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);
  box-shadow:-3px -3px 8px var(--lit),4px 5px 11px var(--sh)}
</style></head><body>
<div class="ph" id="ph">
  <svg class="dim" viewBox="0 0 390 844"><path id="hole" fill-rule="evenodd"/><circle class="ring" id="ring"/></svg>
  <div class="card" id="card">
    <div class="row"><div class="bm" id="b"></div><div><div class="t" id="t"></div><div class="d" id="d"></div></div></div>
    <div class="foot"><div class="dots" id="dots"></div><div class="btns"><button class="skip" id="sk" onclick="end()">דלגי</button><button class="next" id="nx" onclick="go(1)">הבא</button></div></div>
  </div>
</div>
<script src="beem.js"></script>
<script>
/* fit the 390x844 capture to whatever phone opens this */
function fit(){var s=Math.min(innerWidth/390,innerHeight/844),p=document.getElementById('ph');p.style.transform='translateX(-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
/* the four things, measured on the capture (tools/shoot-home.mjs, home-noa) */
var STEPS=[
  {c:[195,322,182],t:'זו החוגה שלך.',d:'כל האזורים שבחרת יושבים עליה. סובבי אותה באגודל, ולחיצה על אזור פותחת אותו.',card:'below'},
  {c:[195,322,58],t:'וזו הבאר.',d:'כל ערב, כשתסכמי את היום, היא מתמלאת באור. זה הלב של הכול.',card:'below'},
  {ring:[195,322,182,158],t:'השפה של החוגה היא היום שלך.',d:'השעות מסביב, הדברים שבלו״ז כנקודות צבעוניות, והאור הכתום מראה איפה את עכשיו.',card:'below'},
  {r:[20,520,350,48,24],t:'ופה פשוט כותבים.',d:'מה אכלת, מה לזכור, מה לעשות. אפשר גם לדבר. אני כבר אדע לאן זה שייך.',card:'above'}
];
var k=0;
function circ(cx,cy,r){return 'M'+(cx-r)+' '+cy+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0Z';}
function rrect(x,y,w,h,r){return 'M'+(x+r)+' '+y+'h'+(w-2*r)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'v'+(h-2*r)+'a'+r+' '+r+' 0 0 1 '+(-r)+' '+r+'h'+(2*r-w)+'a'+r+' '+r+' 0 0 1 '+(-r)+' '+(-r)+'v'+(2*r-h)+'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'Z';}
function show(){
  var s=STEPS[k],full='M0 0H390V844H0Z',hole,top;
  if(s.c){hole=circ(s.c[0],s.c[1],s.c[2]+6);top=s.c[1]+s.c[2]+22;}
  else if(s.ring){hole=circ(s.ring[0],s.ring[1],s.ring[2]+6)+circ(s.ring[0],s.ring[1],s.ring[3]);top=s.ring[1]+s.ring[2]+22;}
  else{hole=rrect(s.r[0]-6,s.r[1]-6,s.r[2]+12,s.r[3]+12,s.r[4]+6);top=s.r[1]-200;}
  document.getElementById('hole').setAttribute('d',full+hole);
  var c=document.getElementById('card');c.style.top=top+'px';
  document.getElementById('t').textContent=s.t;document.getElementById('d').textContent=s.d;
  var h='';for(var i=0;i<STEPS.length;i++)h+='<i'+(i===k?' class="on"':'')+'></i>';document.getElementById('dots').innerHTML=h;
  document.getElementById('nx').textContent=k===STEPS.length-1?'הבנתי':'הבא';
  if(window.B)B.play({dur:3200,ev:[[0,'face',k%2?'content':'happy'],[0,'mode',{breathe:[.018,4],idle:0}],[150,'look',k===3?0:0,k===3?10:-10],[600,'nod',1,7]]});
}
function go(d){k+=d;if(k>=STEPS.length)return end();show();}
function end(){document.getElementById('card').style.opacity=0;document.getElementById('hole').setAttribute('d','');}
var sc=document.createElement('script');sc.src='../../vendor/beem-app.js';
sc.onload=function(){BeemKit.ready.then(function(){window.B=BeemKit.mount(document.getElementById('b'),{play:SMILE});show();});};
document.head.appendChild(sc);
show();
</script>
</body></html>
