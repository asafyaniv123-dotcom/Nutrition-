<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>הפעם הראשונה בכל אזור</title>
<style>
/* THE FIRST TIME IN AN AREA, reached the way she will reach it: from the dial.
   A press on an area lights it where it sits, then its screen opens with a card:
   the SAME icon she just pressed, Beem, what the area is for, three things,
   one first action. Nothing here exists only for the demo - no strip of
   objects she would later look for and not find. */
:root{--g:#f1ece4;--lit:rgba(255,255,255,.95);--sh:rgba(176,168,156,.44);--sh2:rgba(176,168,156,.28);--ink:#4a453f;--mu:#5f5850}
html,body{margin:0;height:100%;background:#2b2724;font-family:Assistant,"Segoe UI",Arial,sans-serif;overflow:hidden}
.ph{position:absolute;left:50%;top:0;width:390px;height:844px;transform-origin:50% 0;overflow:hidden}
.layer{position:absolute;inset:0;background:0 0/390px 844px no-repeat;transition:opacity .45s ease}
#home{background-image:url(home.png)}
#area{opacity:0;pointer-events:none}
.ph.in #area{opacity:1;pointer-events:auto}
.ph.in #home{opacity:0;pointer-events:none}
/* the dial's areas, pressable where they are drawn */
.hot{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.halo{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;pointer-events:none;opacity:0;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 70%,transparent),0 0 26px 10px color-mix(in srgb,var(--a) 45%,transparent);transition:opacity .25s}
.halo.on{opacity:1;animation:pulse .7s ease}
/* the first-time hint on home: one soft pulse on nutrition, so she knows to press */
.halo.hint{opacity:.85;animation:hint 2.2s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes hint{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.08);opacity:.9}}
.dim{position:absolute;inset:0;background:rgba(42,34,27,.42)}
.card{position:absolute;left:0;right:0;bottom:0;background:var(--g);border-radius:28px 28px 0 0;padding:14px 22px 26px;color:var(--ink);
  transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.9,.3,1) .15s;box-shadow:0 -12px 34px rgba(20,14,8,.22)}
.ph.in .card{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#d4c9ba;margin:0 auto 12px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
/* the dial's own disc: raised, line icon in the area's colour, a soft glow of it */
.disc{width:62px;height:62px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:var(--a);
  box-shadow:-4px -4px 10px var(--lit),5px 7px 14px var(--sh),0 0 18px 4px color-mix(in srgb,var(--a) 35%,transparent)}
.disc svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bm{width:58px;height:58px;margin-inline-start:auto}
.t{font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin:4px 0 6px}
.l{font-size:16.5px;line-height:1.55;color:var(--mu);margin:0 0 14px}
.pts{display:flex;flex-direction:column;gap:9px;margin:0 0 18px;padding:0;list-style:none}
.pts li{display:flex;gap:10px;align-items:baseline;font-size:16px;font-weight:700;line-height:1.4}
.pts li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--a);transform:translateY(-1px)}
.go{width:100%;border:none;border-radius:18px;padding:16px;background:var(--g);font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  box-shadow:-5px -5px 13px var(--lit),7px 9px 20px var(--sh),inset 0 -3px 0 color-mix(in srgb,var(--a) 55%,transparent)}
.later{display:block;width:100%;border:none;background:none;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--mu);margin-top:8px;padding:8px}
@media (prefers-reduced-motion:reduce){.layer,.card{transition:none}.halo.hint{animation:none}}
</style></head><body>
<div class="ph" id="ph">
  <div class="layer" id="home"></div>
  <div class="layer" id="area">
    <div class="dim"></div>
    <div class="card" id="card">
      <div class="grab"></div>
      <div class="top"><div class="disc" id="disc"></div><div class="bm" id="b"></div></div>
      <div class="t" id="t"></div>
      <p class="l" id="l"></p>
      <ul class="pts" id="pts"></ul>
      <button class="go" id="go" onclick="back()"></button>
      <button class="later" id="later" onclick="back()"></button>
    </div>
  </div>
</div>
<script src="beem.js"></script>
<script>
function fit(){var s=Math.min(innerWidth/390,innerHeight/844),p=document.getElementById('ph');p.style.transform='translateX(-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
/* where each area sits on the dial, measured on the capture (home-noa17) */
var AT={nutrition:[195,204],fitness:[103,248],hobbies:[80,348],insights:[144,428],people:[246,428],planning:[310,348],closet:[287,248]};
var A={
  nutrition:{a:'#8a6fc7',t:'תזונה',l:'כאן רושמים מה אכלת, בלי לספור קלוריות בראש.',
    pts:['כותבים, מצלמים או מדברים, ואני מחשב','חלבון, פחמימות ושומן לאורך היום','מים בלחיצה אחת'],
    go:'לרשום ארוחה ראשונה',later:'רוצה יעדים אישיים? 4 שאלות קצרות'},
  fitness:{a:'#d9775a',t:'כושר',l:'כאן האימונים שלך: מה עשית, איך התקדמת, ומה עושים היום.',
    pts:['רושמים אימון, עם משקלים וחזרות','שיאים אישיים, ואני חוגג איתך','אימון מוכן כשאין כוח לחשוב'],
    go:'להתחיל אימון ראשון',later:'לבנות לי תוכנית, 3 שאלות'},
  hobbies:{a:'#5f9a6e',t:'תחביבים',l:'הדברים שעושים לך טוב, ולאן הזמן שלך באמת הולך.',
    pts:['מוסיפים תחביב במילה אחת','מסמנים בכל פעם שעשית אותו','רואים לאורך שבועות מה מקבל מקום'],
    go:'להוסיף תחביב ראשון',later:'אחר כך'},
  insights:{a:'#9a8f86',t:'תובנות',l:'שאלות עמוקות יותר על החיים, כשבא לך. אין פה חובה.',
    pts:['נושאים: אני, אנשים, החיים, העולם','שאלה אחת בכל פעם, בקצב שלך','התשובות נשמרות ונהיות תמונה של מי שאת'],
    go:'לבחור שאלה ראשונה',later:'אחר כך'},
  people:{a:'#d9775a',t:'האנשים שלי',l:'מי שחשובים לך, כדי שאף אחד לא ייעלם בין הימים.',
    pts:['מוסיפים אדם, עם תמונה אם בא לך','תזכורת עדינה כשמזמן לא דיברתם','מי היה איתך, בכל סיכום ערב'],
    go:'להוסיף אדם ראשון',later:'אחר כך'},
  planning:{a:'#4d7fbe',t:'תכנון זמן',l:'מספרים לי מה צריך לקרות, ואני עוזר לסדר את היום והשבוע.',
    pts:['כותבים או אומרים מה יש מחר','השבוע כולו במבט אחד','מה שתכננת מופיע על שעון החוגה'],
    go:'לתכנן את מחר',later:'אחר כך'},
  closet:{a:'#b07aa1',t:'הארון שלי',l:'מצלמים בגדים פעם אחת, ואז מרכיבים לוקים ורואים מה לבשת.',
    pts:['מצלמים, והרקע נעלם לבד','מרכיבים לוק מהבגדים שלך','רואים מה לובשים, ומה נשכח בארון'],
    go:'לצלם בגד ראשון',later:'אחר כך'}
};
var ICONS={},seen={};
fetch('icons.json').then(function(r){return r.json();}).then(function(j){ICONS=j;});
/* the pressable spots and their halos, on the home layer */
(function(){
  var h='';
  Object.keys(AT).forEach(function(k){var p=AT[k];
    h+='<div class="halo'+(k==='nutrition'?' hint':'')+'" id="h-'+k+'" style="left:'+p[0]+'px;top:'+p[1]+'px;--a:'+A[k].a+'"></div>'+
       '<button class="hot" style="left:'+p[0]+'px;top:'+p[1]+'px" onclick="open1(\''+k+'\')" aria-label="'+A[k].t+'"></button>';});
  document.getElementById('home').innerHTML=h;
})();
function open1(k){
  var a=A[k],ph=document.getElementById('ph'),hl=document.getElementById('h-'+k);
  document.querySelectorAll('.halo').forEach(function(x){x.classList.remove('hint','on');});
  hl.classList.add('on');
  setTimeout(function(){
    var ar=document.getElementById('area');
    ar.style.backgroundImage='url(bg/'+k+'.png)';ar.style.setProperty('--a',a.a);
    document.getElementById('disc').innerHTML=ICONS[k]||'';
    document.getElementById('t').textContent=a.t;document.getElementById('l').textContent=a.l;
    document.getElementById('pts').innerHTML=a.pts.map(function(x){return '<li>'+x+'</li>';}).join('');
    document.getElementById('go').textContent=a.go;document.getElementById('later').textContent=a.later;
    ph.classList.add('in');seen[k]=1;
    if(window.B)B.play({dur:3200,ev:[[0,'face','happy'],[0,'mode',{breathe:[.018,4],idle:0}],[200,'look',-8,-6],[700,'nod',1,7]]});
  },650);
}
function back(){
  var ph=document.getElementById('ph');ph.classList.remove('in');
  document.querySelectorAll('.halo').forEach(function(x){x.classList.remove('on');});
}
var sc=document.createElement('script');sc.src='../../vendor/beem-app.js';
sc.onload=function(){BeemKit.ready.then(function(){window.B=BeemKit.mount(document.getElementById('b'),{play:SMILE});});};
document.head.appendChild(sc);
</script>
</body></html>
