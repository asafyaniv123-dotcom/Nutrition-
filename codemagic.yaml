# The iPhone build, in the cloud - there is no Mac here. Codemagic builds the
# Capacitor shell in native/ around the STABLE app (index.html + stable/),
# signs it with the App Store Connect API key, and sends it to TestFlight.
#
# One-time setup in Codemagic (with Asaf):
#   Team settings > Integrations > Developer Portal: add the App Store Connect
#   API key and name it exactly "BetterMe ASC".
#   Application > Environment variables: CERTIFICATE_PRIVATE_KEY (secret) in
#   the group "appstore_signing" - an RSA key that only lives there and on
#   Asaf's machine. With it, the build creates the distribution certificate
#   and the App Store profile itself the first time, and reuses them after.
# Started by hand from the Codemagic dashboard; every build gets the next
# TestFlight build number.
workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BetterMe ASC
    environment:
      groups:
        - appstore_signing
      node: 22
      xcode: latest
      vars:
        APP_STORE_APPLE_ID: "6826332851"   # the app record in App Store Connect (created 23 Oct 2026)
    scripts:
      - name: Install Capacitor
        script: cd native && npm ci
      - name: Assemble the stable app into the shell
        script: node tools/native-www.mjs && node tools/native-plist.mjs && node tools/native-icon.mjs && cd native && npx cap sync ios
      - name: Signing - create or fetch the certificate and profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.asafyaniv.betterme" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Next build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd native/ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build the IPA
        script: xcode-project build-ipa --project native/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # internal testers get every upload with no review; external testers need
        # the beta test information filled in App Store Connect first - set this
        # back to true then
        submit_to_testflight: false
