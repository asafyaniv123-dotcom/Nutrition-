var _stopPhotoData='';

function previewStopPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=400;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _stopPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('stop-photo-prev');
      if(prev)prev.innerHTML='<img src="'+_stopPhotoData+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px">';
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function createTrip(){
  var name=document.getElementById('trip-name-inp');
  var date=document.getElementById('trip-date-inp');
  if(!name||!name.value.trim())return;
  var trips=loadTrips();
  var idx=trips.length;
  trips.push({name:name.value.trim(),startDate:date&&date.value?new Date(date.value).getTime():Date.now(),stops:[]});
  saveTrips(trips);saveActiveTrip(idx);_tripView='active';renderTrip();
}

function deleteTrip(idx){
  var trips=loadTrips();trips.splice(idx,1);saveTrips(trips);
  var active=loadActiveTrip();
  if(active===idx)saveActiveTrip(-1);
  else if(active>idx)saveActiveTrip(active-1);
  renderTripIntro();
}

function detectLocation(){
  var btn=document.getElementById('detect-loc-btn');
  if(btn){btn.textContent='\u05D7\u05D5\u05E4\u05E9...\u23F3';btn.disabled=true;}
  if(!navigator.geolocation){showToast('\u05D2\u05D9\u05D0\u05D5\u05DC\u05D5\u05E7\u05E6\u05D9\u05D4 \u05DC\u05D0 \u05D6\u05DE\u05D9\u05DF');return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=he')
      .then(function(r){return r.json();})
      .then(function(data){
        var place=data.address.city||data.address.town||data.address.village||data.address.county||'';
        var country=data.address.country||'';
        var placeInp=document.getElementById('stop-place');
        var countryInp=document.getElementById('stop-country');
        if(placeInp&&place)placeInp.value=place;
        if(countryInp&&country)countryInp.value=country;
        if(btn){btn.textContent='\u2713 \u05E0\u05DE\u05E6\u05D0!';btn.disabled=false;}
        showToast('\u2713 '+place+', '+country);
      }).catch(function(){
        if(btn){btn.textContent='\u05D6\u05D4\u05D4 \u05DE\u05D9\u05E7\u05D5\u05DD \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA';btn.disabled=false;}
        showToast('\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D1\u05D7\u05D9\u05E4\u05D5\u05E9');
      });
  },function(){
    if(btn){btn.textContent='\u05D6\u05D4\u05D4 \u05DE\u05D9\u05E7\u05D5\u05DD \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA';btn.disabled=false;}
    showToast('\u05DC\u05D0 \u05E0\u05D9\u05EA\u05DF \u05DC\u05E7\u05D1\u05DC \u05DE\u05D9\u05E7\u05D5\u05DD');
  });
}

function saveStop(){
  var place=document.getElementById('stop-place');
  var country=document.getElementById('stop-country');
  var date=document.getElementById('stop-date');
  var note=document.getElementById('stop-note');
  if(!place||!place.value.trim()){showToast('\u05E0\u05D0 \u05DC\u05D4\u05D6\u05D9\u05DF \u05E9\u05DD \u05DE\u05E7\u05D5\u05DD');return;}
  var trips=loadTrips();
  var idx=loadActiveTrip();
  if(!trips[idx])return;
  trips[idx].stops.push({
    place:place.value.trim(),
    country:country?country.value.trim():'',
    date:date&&date.value?new Date(date.value).getTime():Date.now(),
    note:note?note.value.trim():'',
    photo:_stopPhotoData||''
  });
  _stopPhotoData='';
  saveTrips(trips);_tripView='active';renderTrip();
  showToast('\u2713 '+place.value.trim()+' \u05E0\u05D5\u05E1\u05E4\u05D4!');
}

function deleteStop(tripIdx,stopIdx){
  var trips=loadTrips();
  if(trips[tripIdx])trips[tripIdx].stops.splice(stopIdx,1);
  saveTrips(trips);renderTrip();
}

function renderTripToggle(){
  var el=document.getElementById('trip-toggle-strip');if(!el)return;
  var isOn=loadActiveTrip()>=0&&loadTrips().length>0;
  var h='<div style="background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 4px 16px rgba(200,180,160,.1);display:flex;align-items:center;gap:14px">';
  h+='<div style="flex:1">';
  h+='<div style="font-size:13px;font-weight:700;color:#4a4340">\u05DE\u05E6\u05D1 \u05D8\u05D9\u05D5\u05DC</div>';
  h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+(isOn?'\u05D4\u05D8\u05D9\u05D5\u05DC \u05E4\u05E2\u05D9\u05DC &mdash; '+loadTrips()[loadActiveTrip()].name:'\u05DB\u05D1\u05D5\u05D9')+'</div>';
  h+='</div>';
  if(isOn){
    h+='<button onclick="enterModule(\'trip\')" style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border:none;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#4f6ef7">\u05E4\u05EA\u05D7</button>';
  }
  h+='<button class="trip-toggle-track'+(isOn?' on':'')+'" onclick="onTripToggle('+(isOn?'false':'true')+')" id="trip-toggle-btn">';
  h+='<div class="trip-toggle-thumb"></div></button>';
  h+='</div>';
  el.innerHTML=h;
}

function onTripToggle(turnOn){
  if(turnOn){
    // Confirm dialog
    var overlay=document.createElement('div');
    overlay.id='trip-confirm-overlay';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(74,67,64,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px';
    overlay.innerHTML=
      '<div style="background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)">'  +
      '<div style="font-size:44px;margin-bottom:12px">&#x1F334;&#x2708;</div>'+
      '<div style="font-size:18px;font-weight:800;color:#4a4340;margin-bottom:8px">\u05E2\u05D1\u05D5\u05E8 \u05DC\u05DE\u05E6\u05D1 \u05D8\u05D9\u05D5\u05DC?</div>'+
      '<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">\u05EA\u05EA\u05D7\u05D9\u05DC \u05D0\u05EA \u05DE\u05E1\u05DC\u05D5\u05DC \u05D4\u05D8\u05D9\u05D5\u05DC<br>\u05D5\u05EA\u05D5\u05DB\u05DC \u05DC\u05E9\u05DE\u05D5\u05E8 \u05E2\u05E6\u05D9\u05E8\u05D5\u05EA \u05D5\u05D6\u05D9\u05DB\u05E8\u05D5\u05E0\u05D5\u05EA</div>'+
      '<div style="display:flex;gap:10px">'  +
      '<button onclick="confirmTripOn()" style="flex:1;background:linear-gradient(135deg,#4f6ef7,#3d4fd6);border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">\u05DB\u05DF, \u05D9\u05D0\u05DC\u05DC\u05D4!</button>'+
      '<button onclick="document.getElementById(\'trip-confirm-overlay\').remove()" style="flex:1;background:#f5f0eb;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#a89e97">\u05D1\u05D9\u05D8\u05D5\u05DC</button>'+
      '</div></div>';
    document.body.appendChild(overlay);
  } else {
    // Turn off — just clear active trip
    saveActiveTrip(-1);
    renderTripToggle();
  }
}

function confirmTripOn(){
  var ov=document.getElementById('trip-confirm-overlay');if(ov)ov.remove();
  // Plane animation across screen
  var plane=document.createElement('div');
  plane.style.cssText='position:fixed;top:50%;right:-80px;transform:translateY(-50%);font-size:52px;z-index:600;pointer-events:none;animation:fly-across 1.4s cubic-bezier(.4,0,.2,1) forwards';
  plane.textContent='\u2708';
  document.body.appendChild(plane);
  setTimeout(function(){if(plane.parentNode)plane.remove();},1500);
  // After animation, go to trip module
  setTimeout(function(){
    enterModule('trip');
  },900);
}
