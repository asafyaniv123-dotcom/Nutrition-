  lib.push({name:meal.name,kcal:meal.kcal,p:meal.p,c:meal.c,f:meal.f,photo:meal.photo||''});
  lib.sort(function(a,b){return a.name.localeCompare(b.name,'he');});
  saveLibData(lib);showToast('\u2713 \u05E0\u05E9\u05DE\u05E8 \u05D1\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4!');

function calcComposed(meal){

}

var _mealPhotoData='';

function handleMealPhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var size=300;canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      var scale=Math.max(size/img.width,size/img.height);
      ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);
      _mealPhotoData=canvas.toDataURL('image/jpeg',0.75);
      var prev=document.getElementById('meal-photo-prev');
      var imgEl=document.getElementById('meal-photo-img');
      var clr=document.getElementById('meal-photo-clear');
      if(prev){prev.style.display='block';}
      if(imgEl){imgEl.src=_mealPhotoData;}
      if(clr){clr.style.display='inline';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function clearMealPhoto(){
  _mealPhotoData='';
  var prev=document.getElementById('meal-photo-prev');var clr=document.getElementById('meal-photo-clear');
  if(prev)prev.style.display='none';if(clr)clr.style.display='none';
}

  saveDay(curDate,day);if(saveToLib)addMealToLib(meal);saveToLib=false;manOpen=false;_mealPhotoData='';render();

function nextQuestion(){
  var q=QUESTIONS[interviewStep];
  if(q.type==='stars'){if(!interviewAnswers[q.id]){showToast('\u05D1\u05D7\u05E8 \u05DB\u05D5\u05DB\u05D1');return;}}
  else if(q.type==='text'||q.type==='number'){var inp=document.getElementById('q-inp');if(inp)interviewAnswers[q.id]=q.type==='number'?(parseInt(inp.value)||0):inp.value.trim();}
  else if(q.type==='timeclock'){/* saved live via clockSetHour */}
  else if(q.type==='flow'){/* stops saved via addFlowStop */}
  else if(q.type==='photo'){var pv=document.getElementById('photo-prev');if(pv&&pv.src)interviewAnswers.photo=pv.src;var cap=document.getElementById('photo-caption-inp');if(cap)interviewAnswers.photoCaption=cap.value.trim();}
  interviewStep++;if(interviewStep>=QUESTIONS.length)finishInterview();else render();
}

function handlePhotoUpload(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');var mw=600,mh=600;var w=img.width,h=img.height;
      if(w>mw){h=Math.round(h*mw/w);w=mw;}if(h>mh){w=Math.round(w*mh/h);h=mh;}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      var data=canvas.toDataURL('image/jpeg',0.7);interviewAnswers.photo=data;
      var area=document.getElementById('photo-area');if(area)area.innerHTML='<img id="photo-prev" src="'+data+'" class="photo-preview">';
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

  saveSummary(curDate,{

function r2f(v){return Math.round(v*100)/100;}
function clockSelCat(cat){window._clockSelCat=cat;renderInterview();}
function clockSetHour(hr){
  if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
  var cat=window._clockSelCat||'sleep';
  interviewAnswers.timeclock[hr]=cat;
}

var _CLK_COLORS={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162',none:''};

function clockPtForHour(h){
  var ang=(-90+h*(720/24))*Math.PI/180;
  var r=52+(h/24)*(128-52);
  return {x:140+r*Math.cos(ang),y:145+r*Math.sin(ang),r:r};
}

function clockDraw(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var clk=interviewAnswers.timeclock||new Array(25).fill('none');
  var CX=140,CY=145,R_IN=52,R_OUT=128;
  ctx.clearRect(0,0,280,290);
  // Background spiral
  ctx.beginPath();
  for(var t=0;t<=480;t++){
    var f=t/480;var a=(-90+f*720)*Math.PI/180;var r=R_IN+f*(R_OUT-R_IN);
    t===0?ctx.moveTo(CX+r*Math.cos(a),CY+r*Math.sin(a)):ctx.lineTo(CX+r*Math.cos(a),CY+r*Math.sin(a));
  }
  ctx.strokeStyle='rgba(160,155,150,.15)';ctx.lineWidth=16;ctx.lineCap='round';ctx.stroke();
  // Colored arcs
  var i=0;
  while(i<25){
    if(clk[i]==='none'){i++;continue;}
    var col=clk[i],st=i;
    while(i<25&&clk[i]===col)i++;
    var en=i-1;
    ctx.beginPath();
    var steps=Math.max((en-st)*24,1);
    for(var s=0;s<=steps;s++){
      var f2=st+(s/steps)*(en-st);
      var a2=(-90+f2*(720/24))*Math.PI/180;var r2=R_IN+(f2/24)*(R_OUT-R_IN);
      s===0?ctx.moveTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2)):ctx.lineTo(CX+r2*Math.cos(a2),CY+r2*Math.sin(a2));
    }
    ctx.strokeStyle=_CLK_COLORS[col];ctx.lineWidth=14;ctx.lineCap='round';
    ctx.shadowColor=_CLK_COLORS[col];ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
  }
  // Labels
  [0,6,12,18,24].forEach(function(h){
    var p=clockPtForHour(h);var lr=p.r+18;
    var a=(-90+h*(720/24))*Math.PI/180;
    ctx.fillStyle='rgba(140,133,125,.55)';ctx.font='600 9px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,CX+lr*Math.cos(a),CY+lr*Math.sin(a));
  });
  // Dots
  for(var h=0;h<=24;h++){
    var p=clockPtForHour(h);var filled=clk[h]!=='none';
    ctx.save();ctx.translate(p.x,p.y);
    if(filled){
      var grd=ctx.createRadialGradient(0,0,3,0,0,20);
      grd.addColorStop(0,_CLK_COLORS[clk[h]]+'66');grd.addColorStop(1,_CLK_COLORS[clk[h]]+'00');
      ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fillStyle=_CLK_COLORS[clk[h]];ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
      ctx.fillStyle='rgba(160,155,150,.08)';ctx.fill();
      ctx.strokeStyle='rgba(160,155,150,.35)';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.fillStyle=filled?'rgba(0,0,0,.45)':'rgba(130,125,120,.6)';
    ctx.font='600 7px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h,0,0.5);ctx.restore();
  }
}

function clockNearestHour(canvas,cx,cy){
  var rect=canvas.getBoundingClientRect();
  var sx=(cx-rect.left)*(280/rect.width),sy=(cy-rect.top)*(290/rect.height);
  var best=-1,bestD=999;
  for(var h=0;h<=24;h++){var p=clockPtForHour(h);var d=Math.hypot(sx-p.x,sy-p.y);if(d<bestD){bestD=d;best=h;}}
  return bestD<22?best:-1;
}

function clockInitDrag(){
  var canvas=document.getElementById('clock-canvas');if(!canvas)return;
  clockDraw();
  var dragging=false;
  var CLK_LABELS={sleep:'\u05E9\u05D9\u05E0\u05D4',work:'\u05E2\u05D1\u05D5\u05D3\u05D4',social:'\u05D7\u05D1\u05E8\u05EA\u05D9',other:'\u05D0\u05D7\u05E8'};
  function paint(e){
    var pt=e.touches?e.touches[0]:e;
    var h=clockNearestHour(canvas,pt.clientX,pt.clientY);if(h<0)return;
    var cat=window._clockSelCat||'sleep';
    if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
    if(interviewAnswers.timeclock[h]===cat)return;
    interviewAnswers.timeclock[h]=cat;clockDraw();
    var clk=interviewAnswers.timeclock;
    var cnts={sleep:0,work:0,social:0,other:0};
    for(var i=0;i<25;i++){if(cnts[clk[i]]!==undefined)cnts[clk[i]]++;}
    var statsEl=document.getElementById('clock-stats');
    if(statsEl){var sh='';Object.keys(cnts).forEach(function(k){if(cnts[k]>0)sh+='<div style="text-align:center"><div style="font-size:16px;font-weight:800;color:'+_CLK_COLORS[k]+'">'+cnts[k]+'h</div><div style="font-size:9px;color:#a89e97">'+CLK_LABELS[k]+'</div></div>';});statsEl.innerHTML=sh;}
  }
  canvas.addEventListener('mousedown',function(e){dragging=true;paint(e);});
  canvas.addEventListener('mousemove',function(e){if(dragging)paint(e);});
  canvas.addEventListener('mouseup',function(){dragging=false;});
  canvas.addEventListener('touchstart',function(e){dragging=true;paint(e);e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(dragging){paint(e);e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',function(){dragging=false;});
}

function hrPos(hr,CX,CY,R_INNER,R_OUTER){
  var ang=(-90+hr*30)*Math.PI/180;
  var r=R_INNER+(hr/23)*(R_OUTER-R_INNER);
  return {x:r2f(CX+r*Math.cos(ang)),y:r2f(CY+r*Math.sin(ang)),r:r};
}

function renderInterview(){
  var q=QUESTIONS[interviewStep];
  var html='<div class="interview"><div class="q-num">\u05E9\u05D0\u05DC\u05D4 '+(interviewStep+1)+' \u05DE\u05EA\u05D5\u05DA '+QUESTIONS.length+'</div><div class="q-text">'+q.text+'</div>';
  if(q.type==='stars'){var cur=interviewAnswers[q.id]||0;html+='<div class="stars-row">';for(var i=1;i<=5;i++)html+='<button class="star-btn'+(i<=cur?' sel':'')+'" onclick="starSelect('+i+')">&#9733;</button>';html+='</div>';}
  else if(q.type==='text'){html+='<textarea id="q-inp" class="q-input" placeholder="'+(q.placeholder||'')+'" rows="3">'+(interviewAnswers[q.id]||'')+'</textarea>';}
  else if(q.type==='timeclock'){
    if(!interviewAnswers.timeclock)interviewAnswers.timeclock=new Array(25).fill('none');
    var clk=interviewAnswers.timeclock;
    var CLK_COLORS={sleep:'#f3b9a8',work:'#8fc79e',social:'#c9b8f0',other:'#e8c162',none:''};
    var CLK_LABELS={sleep:'\u05E9\u05D9\u05E0\u05D4',work:'\u05E2\u05D1\u05D5\u05D3\u05D4',social:'\u05D7\u05D1\u05E8\u05EA\u05D9',other:'\u05D0\u05D7\u05E8',none:'\u05E0\u05E7\u05D4'};

  // Build a map of dates that have reminders
  function dateHasReminder(ds){
    var all=[].concat(remData.today||[],remData.week||[],remData.month||[]);
    return all.some(function(r){return r.date===ds;});
  }

  var h='<div style="background:#fff;border-radius:22px;padding:16px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(200,180,160,.12)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<button class="cal-nav" onclick="homeCalPrev()">&#8250;</button>';
  h+='<div style="font-size:13px;font-weight:700">'+mn[mo]+' '+y+'</div>';
  h+='<button class="cal-nav" onclick="homeCalNext()">&#8249;</button>';
  h+='</div><div class="cal-grid">';
  for(var d=0;d<7;d++)h+='<div class="cal-dh">'+dn[d]+'</div>';
  var sd=first.getDay();for(var pad=0;pad<sd;pad++)h+='<div></div>';
  for(var day=1;day<=last.getDate();day++){
    var ds=y+'-'+(mo<9?'0':'')+(mo+1)+'-'+(day<10?'0':'')+day;

    var isT=ds===todayStr();
    var dots='';
    if(sum)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#a690cf;margin:0 1px;display:inline-block"></div>';
    if(hasRem)dots+='<div style="width:4px;height:4px;border-radius:50%;background:#e08a72;margin:0 1px;display:inline-block"></div>';
    var dotRow=dots?'<div style="display:flex;justify-content:center;margin-top:1px">'+dots+'</div>':'';

      var cls='cal-d'+(sum?' has':'')+(isT?' today':'');

      h+=(isT?'<strong>'+day+'</strong>':day);
      h+=dotRow;
      h+='</button>';
    }
  }
  h+='</div></div>';
  return h;
}

function homeCalPrev(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);refreshHomeCal();}
function homeCalNext(){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);refreshHomeCal();}

function loadCalReminders(ds){

  ['today','week','month'].forEach(function(tab){

      if(r.date===ds)all.push({tab:tab,idx:idx,item:r});

  return all;
}

function calDaySelectScope(scope){
  _calDayScope=scope;
  ['today','week','month'].forEach(function(s){
    var btn=document.getElementById('calscope-'+s);
    if(!btn)return;
    btn.style.background=s===scope?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb';

function addCalDayItem(ds){
  var inp=document.getElementById('calday-inp');
  if(!inp||!inp.value.trim())return;
  var timeInp=document.getElementById('calday-time');
  var time=timeInp?timeInp.value:'';

  // Auto-determine scope from the date
  var today=todayStr();
  var todayDate=new Date(today+'T12:00:00');
  var itemDate=new Date(ds+'T12:00:00');
  var diffDays=Math.round((itemDate-todayDate)/(1000*60*60*24));
  var scope;
  if(diffDays===0) scope='today';
  else if(diffDays>0&&diffDays<=7) scope='week';
  else scope='month';

  var data=loadReminders();
  if(!data[scope])data[scope]=[];
  data[scope].push({text:inp.value.trim(),type:_calDayType,status:'open',date:ds,time:time});
  saveReminders(data);
  inp.value='';
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function deleteCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab])data[tab].splice(idx,1);
  saveReminders(data);
  closeCalDay();openCalDay(ds);
  refreshHomeCal();
  renderReminders();
}

function toggleCalRem(tab,idx,ds){
  var data=loadReminders();
  if(data[tab]&&data[tab][idx]){
    var cur=data[tab][idx].status||'open';
    data[tab][idx].status=cur==='done'?'open':'done';
    saveReminders(data);
  }
  closeCalDay();openCalDay(ds);
  renderReminders();
}

    }

    var cnts2={sleep:0,work:0,social:0,other:0};

    h+='<div style="display:flex;align-items:center;gap:16px">'+svgS;
    h+='<div style="display:flex;flex-direction:column;gap:6px">';

    for(var ki2=0;ki2<ckeys2.length;ki2++){var ck2=ckeys2[ki2];if(cnts2[ck2]>0)h+='<div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:'+TC[ck2]+';display:inline-block;flex-shrink:0"></span><span style="font-size:11px;color:#4a4340">'+TL[ck2]+' <b>'+cnts2[ck2]+'h</b></span></div>';}

  if(sum.quote)h+='<div style="border-right:3px solid #a690cf;padding:10px 14px;background:rgba(201,188,224,.09);border-radius:0 14px 14px 0;margin-bottom:12px"><div style="font-size:9px;color:#a89e97;margin-bottom:5px">\u05DE\u05E9\u05E4\u05D8 \u05E9\u05EA\u05E4\u05E1</div><div style="font-size:13px;line-height:1.7;font-style:italic">&#8220;'+esc(sum.quote)+'&#8221;</div></div>';
  h+='<div style="text-align:center;font-size:10px;color:#a89e97;margin-top:8px">&#x1F331; \u05D9\u05D5\u05DD \u05DE\u05D5\u05E6\u05DC\u05D7</div></div>';
  div.innerHTML=h;document.body.appendChild(div);
}

function renderCoachQuestionnaire(){
  var q=COACH_QUESTIONS[_coachStep];
  var h='<div style="padding:20px 0">';
  h+='<div style="font-size:10px;color:#a89e97;letter-spacing:.1em;margin-bottom:8px">\u05E9\u05D0\u05DC\u05D4 '+(_coachStep+1)+' \u05DE\u05EA\u05D5\u05DA '+COACH_QUESTIONS.length+'</div>';
  h+='<div style="font-size:20px;font-weight:800;color:#4a4340;margin-bottom:24px;line-height:1.4">'+q.q+'</div>';
  if(q.type==='choice'){
    h+='<div style="display:flex;flex-direction:column;gap:10px">';
    for(var oi=0;oi<q.options.length;oi++){
      var opt=q.options[oi];var isSel=_coachAnswers[q.id]===opt;
      h+='<button onclick="coachSelectOption(\''+q.id+'\','+oi+')" style="background:'+(isSel?'linear-gradient(135deg,#c9bce0,#a690cf)':'#fff')+';border:2px solid '+(isSel?'#a690cf':'#f0ebe3')+';border-radius:16px;padding:14px 18px;font-size:13px;font-weight:700;cursor:pointer;color:'+(isSel?'#fff':'#4a4340')+';text-align:right">'+esc(opt)+'</button>';
    }
    h+='</div>';
  } else {
    h+='<textarea id="coach-text-inp" class="q-input" rows="3" placeholder="'+(q.placeholder||'')+'" style="min-height:80px">'+(  _coachAnswers[q.id]||'')+'</textarea>';
  }
  h+='<div style="display:flex;gap:10px;margin-top:24px">';
  if(_coachStep>0)h+='<button onclick="_coachStep--;renderFitness()" style="background:#f5f0eb;border:none;border-radius:14px;padding:14px 20px;font-size:13px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; \u05D7\u05D6\u05E8\u05D4</button>';
  h+='<button onclick="coachNextStep()" style="flex:1;background:linear-gradient(135deg,#c9bce0,#a690cf);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">'+(_coachStep===COACH_QUESTIONS.length-1?'\u05D1\u05E0\u05D4 \u05EA\u05D5\u05DB\u05E0\u05D9\u05EA &#10003;':'\u05D4\u05DE\u05E9\u05DA &#8594;')+'</button>';
  h+='</div></div>';
  document.getElementById('hdr-title').textContent='\u05DE\u05D0\u05DE\u05DF \u05D0\u05D9\u05E9\u05D9';
  document.getElementById('content').innerHTML=h;
}

function coachSelectOption(id,oi){
  var q=COACH_QUESTIONS.find(function(x){return x.id===id;});
  if(q)_coachAnswers[id]=q.options[oi];
  renderFitness();
}
function coachNextStep(){
  var q=COACH_QUESTIONS[_coachStep];
  if(q.type==='text'){var inp=document.getElementById('coach-text-inp');if(inp)_coachAnswers[q.id]=inp.value.trim()||'\u05DC\u05D0';}
  if(!_coachAnswers[q.id]){showToast('\u05D1\u05D7\u05E8 \u05EA\u05E9\u05D5\u05D1\u05D4');return;}
  if(_coachStep<COACH_QUESTIONS.length-1){_coachStep++;renderFitness();}
  else{buildCoachPlan();}
}

    '- \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF: '+a.experience+'\n- \u05E6\u05D9\u05D5\u05D3: '+a.equipment+'\n- \u05D9\u05DE\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF: '+a.days+'\n- \u05DE\u05D8\u05E8\u05D4: '+a.goal+'\n- \u05D6\u05DE\u05DF: '+a.session+'\n- \u05DE\u05D2\u05D1\u05DC\u05D5\u05EA: '+a.limit+'\n\n'+
    '\u05D4\u05D7\u05D6\u05E8 JSON \u05D1\u05DC\u05D1\u05D3 \u05E1\u05DC\u05DC \u05D8\u05E7\u05E1\u05D8 \u05E0\u05D5\u05E1\u05E3:\n'+
    '{"summary":"\u05EA\u05D9\u05D0\u05D5\u05E8 \u05E7\u05E6\u05E8","daysPerWeek":"\u05D8\u05E7\u05E1\u05D8","equipment":"\u05D4\u05E6\u05D9\u05D5\u05D3","days":[{"name":"\u05E9\u05DD \u05D0\u05D9\u05DE\u05D5\u05DF","focus":"\u05E7\u05D1\u05D5\u05E6\u05EA \u05E9\u05E8\u05D9\u05E8","exercises":[{"name":"\u05E9\u05DD","sets":3,"reps":"8-12","note":"\u05D4\u05E2\u05E8\u05D4"}]}]}';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var text=data.content.map(function(i){return i.text||'';}).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var plan=JSON.parse(clean);
    plan.answers=a;saveCoachPlan(plan);_fitView='coach-plan';renderFitness();
  })
  .catch(function(){showToast('\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D1\u05D1\u05E0\u05D9\u05D9\u05EA \u05D4\u05EA\u05D5\u05DB\u05E0\u05D9\u05EA');_fitView='home';renderFitness();});
}

function createTemplateFromPlan(dayIdx){
  var plan=loadCoachPlan();if(!plan||!plan.days[dayIdx])return;
  var day=plan.days[dayIdx];var templates=loadTemplates();
  templates.push({name:day.name,exercises:(day.exercises||[]).map(function(ex){return{name:ex.name,targetSets:ex.sets,targetReps:parseInt(ex.reps)||10,sets:[]};})});
  saveTemplates(templates);showToast('\u2713 '+day.name+' \u05E0\u05D5\u05E1\u05E4\u05D4 \u05DC\u05EA\u05D1\u05E0\u05D9\u05D5\u05EA!');
}

function loadTemplates(){try{var x=localStorage.getItem('fit_templates');return x?JSON.parse(x):[];}catch(e){return[];}}
function saveTemplates(arr){try{localStorage.setItem('fit_templates',JSON.stringify(arr));}catch(e){}}
function loadWorkoutLog(){try{var x=localStorage.getItem('fit_log');return x?JSON.parse(x):[];}catch(e){return[];}}
function saveWorkoutLog(arr){try{localStorage.setItem('fit_log',JSON.stringify(arr));}catch(e){}}
function loadPRs(){try{var x=localStorage.getItem('fit_prs');return x?JSON.parse(x):{};}catch(e){return{};}}
function savePRs(obj){try{localStorage.setItem('fit_prs',JSON.stringify(obj));}catch(e){}}

var _fitView='home'; // 'home' | 'editTemplate' | 'workout' | 'history' | 'progress'
var _fitEditIdx=-1;  // template being edited (-1 = new)
var _fitWorkout=null; // active workout state
var _fitHistExercise=null; // which exercise to show progress for

function renderFitness(){
  document.getElementById('hdr-title').textContent='\u05DB\u05D5\u05E9\u05E8';
  if(_fitView==='home')renderFitHome();
  else if(_fitView==='editTemplate')renderFitEditTemplate();
  else if(_fitView==='workout')renderFitWorkout();
  else if(_fitView==='history')renderFitHistory();
  else if(_fitView==='progress')renderFitProgress();
  else if(_fitView==='summary')renderFitSummary();
  else if(_fitView==='coach-q')renderCoachQuestionnaire();
  else if(_fitView==='coach-plan')renderCoachPlan();
  else if(_fitView==='edit-program')renderEditProgram();
  else if(_fitView==='view-program')renderViewProgram();
  else if(_fitView==='weekly-plan')renderWeeklyPlan();
  else if(_fitView==='edit-week-day')renderEditWeekDay();
}

  var weekPlan=loadWeekPlan();
  var entry=window._editWeekEntry||{type:'rest',label:'',note:''};
  var labelInp=document.getElementById('wday-label');
  var noteInp=document.getElementById('wday-note');
  if(labelInp)entry.label=labelInp.value.trim();
  if(noteInp)entry.note=noteInp.value.trim();

  _fitView='weekly-plan';renderFitness();

function wizQ(text){
  return '<div style="font-size:18px;font-weight:800;color:#4a4340;margin-bottom:18px;line-height:1.4">'+text+'</div>';
}
function wizChip(label,onclick,active){
  return '<button onclick="'+onclick+'" style="border:none;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;background:'+(active?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb')+';color:'+(active?'#fff':'#4a4340')+'">'+esc(label)+'</button>';
}

function finalizeProgramWizard(){
  var progs=loadPrograms();
  var prog={
    id:_wiz.prog.id||Date.now(),
    name:_wiz.prog.name,
    splitType:_wiz.prog.splitType,
    daysPerWeek:_wiz.prog.daysPerWeek,
    goal:_wiz.prog.goal,
    exercises:[] // flat list from all days
  };
  // Store all days' exercises flat for the view-program tracker
  var allEx=[];
  for(var di=0;di<_wiz.days.length;di++){
    var day=_wiz.days[di];
    for(var ei=0;ei<day.exercises.length;ei++){
      var ex=day.exercises[ei];
      ex.day=day.name;
      allEx.push(ex);
    }
  }
  prog.exercises=allEx;
  if(_fitProgIdx>=0)progs[_fitProgIdx]=prog;
  else progs.push(prog);
  savePrograms(progs);
  _fitProgIdx=progs.indexOf(prog);
  showToast('\u2713 '+prog.name+' \u05E0\u05E9\u05DE\u05E8\u05D4!');
  _fitView='view-program';renderFitness();
}

function addProgEx(){} // kept for compat
function renderEditProgWithProg(){}
function removeProgEx(ei){if(window._editProg)window._editProg.exercises.splice(ei,1);renderEditProgram();}
function saveProgram(){finalizeProgramWizard();}
function deleteProgram(){
  var progs=loadPrograms();progs.splice(_fitProgIdx,1);savePrograms(progs);
  _fitView='home';renderFitness();
}

  var progs=loadPrograms();

  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h+='<div style="font-size:16px;font-weight:800;color:#4a4340">'+esc(prog.name)+'</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; \u05D7\u05D6\u05E8\u05D4</button>';
  h+='</div>';

  for(var ei=0;ei<prog.exercises.length;ei++){
    var ex=prog.exercises[ei];
    var exLog=loadProgLog(prog.id,ex.name);
    var lastEntry=exLog.length>0?exLog[exLog.length-1]:null;
    var pr=exLog.length>0?Math.max.apply(null,exLog.map(function(e){return e.weight;})):0;

    h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
    // Exercise header
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
    h+='<div><div style="font-size:14px;font-weight:800;color:#4a4340">'+esc(ex.name)+'</div>';
    h+='<div style="font-size:10px;color:#a89e97;margin-top:2px">'+ex.sets+' \u05E1\u05D8 &times; '+ex.targetReps+' \u05D7\u05D6\u05E8</div></div>';
    if(pr>0)h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:6px 10px;text-align:center"><div style="font-size:14px;font-weight:800;color:#b45309">'+pr+'kg</div><div style="font-size:8px;color:#b45309;font-weight:700">PR</div></div>';
    h+='</div>';

    // Last entry
    if(lastEntry){
      var dd=new Date(lastEntry.date);
      h+='<div style="background:#f5f0eb;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#6a6360">';
      h+='\u05D0\u05D7\u05E8\u05D5\u05DF: '+lastEntry.weight+'kg &times; '+lastEntry.reps+' \u05D7\u05D6\u05E8 &mdash; '+dd.getDate()+'/'+(dd.getMonth()+1);
      h+='</div>';
    }

    // Log new entry
    h+='<div style="display:flex;gap:6px;align-items:center">';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">kg</div>';
    h+='<input id="prog-w-'+ei+'" class="mtnm" type="number" step="0.5" placeholder="'+(lastEntry?lastEntry.weight:ex.baseWeight||0)+'" style="width:100%"></div>';
    h+='<div style="flex:1"><div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:3px">\u05D7\u05D6\u05E8\u05D5\u05EA</div>';
    h+='<input id="prog-r-'+ei+'" class="mtnm" type="number" placeholder="'+ex.targetReps+'" style="width:100%"></div>';
    h+='<button onclick="logProgEntry('+_fitProgIdx+','+ei+')" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;align-self:flex-end">\u05E8\u05E9\u05D5\u05DD</button>';
    h+='</div>';

    // Mini history chart
    if(exLog.length>1){
      var recent=exLog.slice(-8);
      var maxW=Math.max.apply(null,recent.map(function(e){return e.weight;}));
      var minW=Math.max(0,Math.min.apply(null,recent.map(function(e){return e.weight;}))-5);
      var W=280,H=50,PL=0,PT=4,PB=14,cW=W,cH=H-PT-PB;
      var n=Math.max(recent.length-1,1);
      function xp(i){return PL+i*(cW/n);}
      function yp(v){return PT+cH*(1-(v-minW)/(maxW-minW||1));}
      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:10px">';
      if(recent.length>1){
        var lp='M'+xp(0)+','+yp(recent[0].weight);
        for(var ri=1;ri<recent.length;ri++)lp+=' L'+xp(ri)+','+yp(recent[ri].weight);
        svg+='<path d="'+lp+'" fill="none" stroke="#a690cf" stroke-width="2" stroke-linecap="round"/>';
      }
      recent.forEach(function(e,ri){
        var isPR=e.weight>=pr;
        svg+='<circle cx="'+xp(ri)+'" cy="'+yp(e.weight)+'" r="'+(isPR?5:3)+'" fill="'+(isPR?'#e8c162':'#a690cf')+'" stroke="#fff" stroke-width="1.5"/>';
        svg+='<text x="'+xp(ri)+'" y="'+(H-1)+'" text-anchor="middle" font-size="8" fill="#c0b8b0">'+e.weight+'</text>';
      });
      svg+='</svg>';
      h+=svg;
    }

    h+='</div>';
  }
  h+='</div>';
  document.getElementById('hdr-title').textContent=esc(prog.name);
  document.getElementById('content').innerHTML=h;
}

function logProgEntry(progIdx,exIdx){
  var progs=loadPrograms();var prog=progs[progIdx];
  if(!prog||!prog.exercises[exIdx])return;
  var ex=prog.exercises[exIdx];
  var wInp=document.getElementById('prog-w-'+exIdx);
  var rInp=document.getElementById('prog-r-'+exIdx);
  var weight=parseFloat(wInp&&wInp.value)||0;
  var reps=parseInt(rInp&&rInp.value)||ex.targetReps;
  if(!weight){showToast('\u05D4\u05D6\u05DF \u05DE\u05E9\u05E7\u05DC');return;}
  var log=loadProgLog(prog.id,ex.name);
  log.push({date:Date.now(),weight:weight,reps:reps});
  saveProgLog(prog.id,ex.name,log);
  // Check PR
  var prevPR=log.slice(0,-1).reduce(function(m,e){return Math.max(m,e.weight);},0);
  if(weight>prevPR&&prevPR>0)showToast('&#9733; PR \u05D7\u05D3\u05E9! '+weight+'kg \u05D1'+ex.name);
  else showToast('\u2713 \u05E0\u05E8\u05E9\u05DD!');
  renderViewProgram();
}

function addFitExercise(){

  var reps=document.getElementById('fit-ex-reps');
  if(!name||!name.value.trim())return;

      var nm=document.getElementById('fit-tpl-name');

function logSet(){
  if(!_fitWorkout)return;
  var w=document.getElementById('fit-w');var r=document.getElementById('fit-r');var rpeInp=document.getElementById('fit-rpe');
  var weight=parseFloat(w?w.value:0)||0;var reps=parseInt(r?r.value:0)||0;
  var rpe=rpeInp&&rpeInp.value?parseFloat(rpeInp.value):null;
  if(!reps)return;
  var ex=_fitWorkout.exercises[_fitWorkout.currentEx];
  ex.sets.push({weight:weight,reps:reps,rpe:rpe});
  // Update PR
  if(weight>0){
    var prs=loadPRs();var key=ex.name;
    if(weight>(prs[key]||0)){prs[key]=weight;savePRs(prs);showToast('&#9733; PR \u05D7\u05D3\u05E9! '+weight+'kg \u05D1'+key);}
  }
  renderFitness();
}

function removeSet(idx){
  if(!_fitWorkout)return;
  _fitWorkout.exercises[_fitWorkout.currentEx].sets.splice(idx,1);
  renderFitness();
}

function finishWorkout(){
  if(!_fitWorkout)return;
  var w=_fitWorkout;
  var log=loadWorkoutLog();
  var entry={
    date:Date.now(),name:w.name,
    duration:Math.floor((Date.now()-w.startTime)/60000),
    exercises:w.exercises.map(function(ex){
      return{name:ex.name,targetSets:ex.targetSets,targetReps:ex.targetReps,sets:ex.sets.slice()};
    })
  };
  log.push(entry);saveWorkoutLog(log);
  _fitWorkout=null;
  _fitView='summary';
  _fitSummaryEntry=entry;
  renderFitness();
}

var _fitSummaryEntry=null;

function calcRPE(weight,reps,targetReps){
  // Rough RPE: if reps === target → ~7, more → lower, fewer → higher
  var diff=reps-targetReps;
  if(diff>=3)return 5;
  if(diff===2)return 6;
  if(diff===1)return 6.5;
  if(diff===0)return 7.5;
  if(diff===-1)return 8.5;
  if(diff<=-2)return 9.5;
  return 7;
}

function renderFitSummary(){
  var entry=_fitSummaryEntry;
  if(!entry){_fitView='home';renderFitness();return;}
  var log=loadWorkoutLog();
  var prev=null;
  for(var i=log.length-2;i>=0;i--){if(log[i].name===entry.name){prev=log[i];break;}}
  var prs=loadPRs();

  // RPE color by spec: <6 green, 6-7.4 amber, 7.5-8.9 orange, ≥9 coral, null gray
  function rpeColor(rpe){
    if(rpe===null||rpe===undefined)return '#ADA79A';
    if(rpe<6)return '#4C9A4C';
    if(rpe<7.5)return '#E0A020';
    if(rpe<9)return '#E0691E';
    return '#D33A2C';
  }

  // Totals — volume only on weighted exercises (spec 4.1)
  var totalSets=0,rpeSum=0,rpeCount=0,totalVol=0;
  entry.exercises.forEach(function(ex){
    ex.sets.forEach(function(s){
      totalSets++;
      if(s.weight>0)totalVol+=(s.weight||0)*(s.reps||0);
      if(s.rpe!=null){rpeSum+=s.rpe;rpeCount++;}
    });
  });
  var avgRPE=rpeCount>0?Math.round(rpeSum/rpeCount*10)/10:null;
  var maxVol=0;
  entry.exercises.forEach(function(ex){
    var v=ex.sets.reduce(function(a,s){return a+(s.weight>0?(s.weight||0)*(s.reps||0):0);},0);
    if(v>maxVol)maxVol=v;
  });

  var d2=new Date(entry.date);

var _fitProgressEx='';

function renderFitProgress(){
  var log=loadWorkoutLog();
  var prs=loadPRs();

  // Collect all exercise names from history
  var exNames={};
  for(var i=0;i<log.length;i++){
    for(var j=0;j<log[i].exercises.length;j++){
      exNames[log[i].exercises[j].name]=true;
    }
  }
  var exList=Object.keys(exNames).sort();

  // If no exercise selected yet, pick first
  if(!_fitProgressEx&&exList.length>0)_fitProgressEx=exList[0];

  var h='<div style="padding-bottom:20px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div style="font-size:15px;font-weight:800;color:#4a4340">\u05D2\u05E8\u05E3 \u05D4\u05EA\u05E7\u05D3\u05DE\u05D5\u05EA</div>';
  h+='<button onclick="_fitView=\'home\';renderFitness()" style="background:#f5f0eb;border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#a89e97">&#8249; \u05D7\u05D6\u05E8\u05D4</button>';
  h+='</div>';

  if(exList.length===0){
    h+='<div style="text-align:center;padding:60px 20px;color:#c0b8b0;font-size:13px">\u05E2\u05D3\u05D9\u05D9\u05DF \u05DC\u05D0 \u05D1\u05E6\u05E2\u05EA \u05D0\u05D9\u05DE\u05D5\u05DF</div>';
    h+='</div>';document.getElementById('content').innerHTML=h;return;
  }

  // PRs strip
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">PR \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD</div>';
  var prKeys=Object.keys(prs);
  if(prKeys.length===0){h+='<div style="font-size:12px;color:#c0b8b0">\u05E2\u05D3\u05D9\u05D9\u05DF \u05D0\u05D9\u05DF</div>';}
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(var pi=0;pi<prKeys.length;pi++){
    h+='<div style="background:linear-gradient(135deg,#fef9e7,#fef3c7);border-radius:10px;padding:5px 10px;font-size:11px;font-weight:700;color:#b45309">';
    h+='&#9733; '+esc(prKeys[pi])+' &mdash; '+prs[prKeys[pi]]+'kg</div>';
  }
  h+='</div></div>';

  // Exercise selector
  h+='<div style="background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
  h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:8px">\u05D1\u05D7\u05E8 \u05EA\u05E8\u05D2\u05D9\u05DC</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
  for(var ei=0;ei<exList.length;ei++){
    var isSel=_fitProgressEx===exList[ei];
    h+='<button onclick="_fitProgressEx=\''+exList[ei].replace(/'/g,'')+'\';renderFitProgress()" style="border:none;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;background:'+(isSel?'linear-gradient(135deg,#c9bce0,#a690cf)':'#f5f0eb')+';color:'+(isSel?'#fff':'#6a6360')+'">'+esc(exList[ei])+'</button>';
  }
  h+='</div></div>';

  // Build data points for selected exercise
  if(_fitProgressEx){
    var pts=[];
    for(var li=0;li<log.length;li++){
      var entry=log[li];
      for(var exi=0;exi<entry.exercises.length;exi++){
        if(entry.exercises[exi].name===_fitProgressEx){
          var best1RM=entry.exercises[exi].sets.reduce(function(mx,s){return Math.max(mx,s.weight||0);},0);
          var totalV=entry.exercises[exi].sets.reduce(function(a,s){return a+(s.weight||0)*(s.reps||0);},0);
          if(best1RM>0||totalV>0)pts.push({date:entry.date,weight:best1RM,vol:totalV});
        }
      }
    }

    if(pts.length<2){
      h+='<div style="background:#fff;border-radius:18px;padding:24px;text-align:center;color:#c0b8b0;font-size:12px;box-shadow:0 2px 10px rgba(200,180,160,.1)">\u05E6\u05E8\u05D9\u05DA \u05DC\u05E4\u05D7\u05D5\u05EA 2 \u05D0\u05D9\u05DE\u05D5\u05E0\u05D9\u05DD \u05DC\u05D2\u05E8\u05E3</div>';
    } else {
      // SVG chart
      var W=320,H=140,PL=40,PR=12,PT=12,PB=24,cW=W-PL-PR,cH=H-PT-PB;
      var wVals=pts.map(function(p){return p.weight;});
      var minW=Math.max(0,Math.min.apply(null,wVals)-5);
      var maxW=Math.max.apply(null,wVals)+5;
      function xp2(i){return PL+i*(cW/(pts.length-1));}
      function yp2(v){return PT+cH*(1-(v-minW)/(maxW-minW));}

      var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
      // Grid
      for(var gi=0;gi<=3;gi++){
        var gv=minW+(maxW-minW)*gi/3;
        var gy=yp2(gv);
        svg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+cW)+'" y2="'+gy+'" stroke="#f2ede6" stroke-width="1"/>';
        svg+='<text x="'+(PL-3)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#c0b8b0">'+Math.round(gv)+'</text>';
      }
      // Area
      var aPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi2=1;pi2<pts.length;pi2++)aPath+=' L'+xp2(pi2)+','+yp2(pts[pi2].weight);
      aPath+=' L'+xp2(pts.length-1)+','+(PT+cH)+' L'+xp2(0)+','+(PT+cH)+' Z';
      svg+='<path d="'+aPath+'" fill="#a690cf" opacity="0.12"/>';
      // Line
      var lPath='M'+xp2(0)+','+yp2(pts[0].weight);
      for(var pi3=1;pi3<pts.length;pi3++)lPath+=' L'+xp2(pi3)+','+yp2(pts[pi3].weight);
      svg+='<path d="'+lPath+'" fill="none" stroke="#a690cf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
      // Dots + dates
      for(var pi4=0;pi4<pts.length;pi4++){
        var dd=new Date(pts[pi4].date);
        svg+='<circle cx="'+xp2(pi4)+'" cy="'+yp2(pts[pi4].weight)+'" r="4" fill="#a690cf" stroke="#fff" stroke-width="2"/>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#a89e97">'+dd.getDate()+'/'+(dd.getMonth()+1)+'</text>';
        svg+='<text x="'+xp2(pi4)+'" y="'+(yp2(pts[pi4].weight)-7)+'" text-anchor="middle" font-size="8" fill="#a690cf" font-weight="700">'+pts[pi4].weight+'</text>';
      }
      svg+='</svg>';

      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1);margin-bottom:12px">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">'+esc(_fitProgressEx)+' &mdash; \u05E2\u05DC\u05D9\u05D9\u05EA \u05DE\u05E9\u05E7\u05DC (kg)</div>';
      h+=svg;

      // Delta
      var delta=pts[pts.length-1].weight-pts[0].weight;
      var pct2=pts[0].weight>0?Math.round(delta/pts[0].weight*100):0;
      h+='<div style="display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid #f5f0eb">';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#a690cf">'+pts[0].weight+'kg</div><div style="font-size:9px;color:#a89e97">\u05D4\u05EA\u05D7\u05DC\u05D4</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:'+(delta>=0?'#8fc79e':'#e08a72')+'">'+(delta>=0?'+':'')+delta+'kg</div><div style="font-size:9px;color:#a89e97">\u05E9\u05D9\u05E4\u05D5\u05E8 ('+pct2+'%)</div></div>';
      h+='<div style="text-align:center"><div style="font-size:18px;font-weight:800;color:#e08a72">'+pts[pts.length-1].weight+'kg</div><div style="font-size:9px;color:#a89e97">\u05E2\u05DB\u05E9\u05D9\u05D5</div></div>';
      h+='</div></div>';

      // Volume chart
      var vVals=pts.map(function(p){return p.vol;});
      var maxV=Math.max.apply(null,vVals);
      h+='<div style="background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(200,180,160,.1)">';
      h+='<div style="font-size:10px;color:#a89e97;font-weight:700;letter-spacing:.1em;margin-bottom:10px">\u05E0\u05E4\u05D7 \u05DC\u05E4\u05D9 \u05D0\u05D9\u05DE\u05D5\u05DF</div>';
      h+='<div style="display:flex;align-items:flex-end;gap:5px;height:60px">';
      for(var vi=0;vi<pts.length;vi++){
        var bh=maxV>0?Math.round(pts[vi].vol/maxV*52):4;
        var dd2=new Date(pts[vi].date);
        h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
        h+='<div style="font-size:8px;color:#a89e97">'+pts[vi].vol+'</div>';
        h+='<div style="width:100%;height:'+bh+'px;background:linear-gradient(180deg,#bfe0c7,#8fc79e);border-radius:4px 4px 0 0"></div>';
        h+='<div style="font-size:7px;color:#c0b8b0">'+dd2.getDate()+'/'+(dd2.getMonth()+1)+'</div>';
        h+='</div>';
      }
      h+='</div></div>';
    }
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

/* ── HABIT TRACKER ── */
function loadHabits(){try{var x=localStorage.getItem('habits_list');return x?JSON.parse(x):['\u05E9\u05EA\u05D9\u05D9\u05EA \u05DE\u05D9\u05DD','\u05D0\u05D9\u05DE\u05D5\u05DF','\u05E7\u05E8\u05D9\u05D0\u05D4'];}catch(e){return[];}}
function saveHabits(arr){try{localStorage.setItem('habits_list',JSON.stringify(arr));}catch(e){}}
function loadHabitLog(){try{var x=localStorage.getItem('habits_log');return x?JSON.parse(x):{};}catch(e){return{};}}
function saveHabitLog(obj){try{localStorage.setItem('habits_log',JSON.stringify(obj));}catch(e){}}

function toggleHabitAnim(habitIdx,day,cellId){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  var nowDone=!log[key];
  log[key]=nowDone;
  saveHabitLog(log);

  // Instant visual update — animate before full re-render
  var cell=document.getElementById(cellId);
  if(cell){
    if(nowDone){
      cell.style.background='rgba(143,199,158,.12)';
      cell.style.borderColor='#6db88a';
      cell.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" style="overflow:visible">'+
        '<line x1="3" y1="3" x2="13" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round" class="hx-draw" style="stroke-dasharray:20;stroke-dashoffset:20;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) forwards"/>'+
        '<line x1="13" y1="3" x2="3" y2="13" stroke="#6db88a" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:20;stroke-dashoffset:20;animation:hx-stroke1 .22s cubic-bezier(.4,0,.2,1) .12s forwards"/>'+
        '</svg>';
    } else {
      cell.style.background='transparent';
      cell.style.borderColor='#ccc7c0';
      cell.innerHTML='';
    }
  }
  // Full re-render after animation completes
  setTimeout(function(){renderHabits();},380);
}

function toggleHabit(habitIdx,day){
  var habits=loadHabits();
  var habit=habits[habitIdx];
  if(!habit)return;
  var log=loadHabitLog();
  var key=habit+'__'+day;
  log[key]=!log[key];
  saveHabitLog(log);
  renderHabits();
}

function addHabit(){
  var inp=document.getElementById('new-habit-inp');
  if(!inp)return;
  var name=inp.value.trim();
  if(!name)return;
  var habits=loadHabits();
  if(habits.indexOf(name)!==-1){showToast('\u05DB\u05D1\u05E8 \u05E7\u05D9\u05D9\u05DD');return;}
  habits.push(name);
  saveHabits(habits);
  inp.value='';
  renderHabits();
}

function deleteHabit(idx){
  var habits=loadHabits();
  habits.splice(idx,1);
  saveHabits(habits);
  renderHabits();
}

  var habits=loadHabits();

  var now=new Date();

  h+='<div style="font-size:18px;font-weight:800;color:#4a4340">'+mn[mo]+' '+y+'</div>';
  h+='<div style="font-size:11px;color:#8fc79e;margin-top:2px;font-style:italic">progress, not perfection</div>';

  h+='<input id="new-habit-inp" class="mtin" style="flex:1;margin-bottom:0" placeholder="\u05D4\u05D5\u05E1\u05E3 \u05D4\u05E8\u05D2\u05DC \u05D7\u05D3\u05E9..." onkeydown="if(event.key===\'Enter\')addHabit()">';
  h+='<button onclick="addHabit()" style="background:linear-gradient(135deg,#bfe0c7,#8fc79e);border:none;border-radius:11px;padding:0 16px;font-size:18px;cursor:pointer;color:#fff;flex-shrink:0">+</button>';
  h+='</div>';

  // ── OVERALL STAT ──
  var totalDone=0,totalPossible=todayD*habits.length;
  for(var hh=0;hh<habits.length;hh++)for(var dd2=1;dd2<=todayD;dd2++)if(log[habits[hh]+'__'+dd2])totalDone++;
  var overallPct=totalPossible>0?Math.round(totalDone/totalPossible*100):0;
  h+='<div style="background:linear-gradient(135deg,#f0eafa,#eaf5ee);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px">';
  h+='<div style="font-size:28px;font-weight:800;color:#a690cf">'+overallPct+'%</div>';
  h+='<div style="flex:1"><div style="font-size:12px;font-weight:700;color:#4a4340">\u05E2\u05E7\u05D1\u05D9\u05D5\u05EA \u05DB\u05DC\u05DC\u05D9\u05EA</div>';
  h+='<div style="font-size:10px;color:#a89e97;margin-bottom:5px">'+totalDone+' / '+totalPossible+' \u05D9\u05DE\u05D9\u05DD \u05D1\u05D5\u05E6\u05E2\u05D5</div>';
  h+='<div style="height:5px;background:rgba(255,255,255,.6);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+overallPct+'%;background:linear-gradient(90deg,#c9bce0,#8fc79e);border-radius:3px;transition:width .6s"></div></div></div>';
  h+='</div>';

  // ── THIS MONTH I WILL + NOTES ──
  var goals=loadHabitGoals();
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
  h+='<div style="background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(200,180,160,.08)">';
  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px;letter-spacing:.05em">THIS MONTH I WILL</div>';
  for(var gi=0;gi<goals.length;gi++){
    h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
    h+='<div onclick="toggleGoal('+gi+')" style="width:13px;height:13px;border-radius:3px;border:1.5px solid '+(goals[gi].done?'#8fc79e':'#c9bce0')+';background:'+(goals[gi].done?'#8fc79e':'transparent')+';cursor:pointer;flex-shrink:0"></div>';
    h+='<div style="font-size:11px;color:'+(goals[gi].done?'#a89e97':'#4a4340')+';'+(goals[gi].done?'text-decoration:line-through;':'')+';flex:1;line-height:1.3">'+esc(goals[gi].text)+'</div>';
    h+='<button onclick="deleteGoal('+gi+')" style="background:none;border:none;cursor:pointer;color:#f3b9a8;font-size:12px;padding:0;flex-shrink:0">&times;</button>';

  h+='<textarea id="habit-notes" onchange="saveHabitNotes(this.value)" style="width:100%;border:none;font-size:11px;resize:none;outline:none;color:#4a4340;line-height:1.8;background:transparent;height:80px;direction:rtl" placeholder="...">'+esc(loadHabitNotes())+'</textarea>';
  h+='</div></div>';

  if(habits.length===0){
    h+='<div style="text-align:center;padding:32px 20px;color:#a89e97;font-size:13px">\u05D4\u05D5\u05E1\u05E3 \u05D0\u05EA \u05D4\u05D4\u05E8\u05D2\u05DC \u05D4\u05E8\u05D0\u05E9\u05D5\u05DF \u05E9\u05DC\u05DA &#x2B06;</div>';

  for(var hi=0;hi<habits.length;hi++){
    h+='<th style="text-align:center;padding:0 4px 12px;border-right:'+(hi<habits.length-1?'1.5px solid #f0ebe3':'none')+'">';

    h+='<div style="background:linear-gradient(135deg,#f0eafa,#eaf5ee);border:1.5px solid #c9bce0;border-radius:12px;padding:6px 10px;min-width:56px;max-width:72px;position:relative">';

    h+='</div>';

    h+='<td style="padding:3px 6px;text-align:right;white-space:nowrap;line-height:1">';
    h+='<span style="font-size:'+(isToday?'12':'10')+'px;font-weight:'+(isToday?'800':'400')+';color:'+(isToday?'#a690cf':(isFuture?'#c0b8b0':'#6a6360'))+'">'+d+' <span style="font-size:8px;color:#c0b8b0">'+dayLbl+'</span></span>';
    h+='</td>';
    for(var hi2=0;hi2<habits.length;hi2++){
      var done=!!log[habits[hi2]+'__'+d];
      var borderCol=done?'#6db88a':(isToday?'#a690cf':(isFuture?'#e8e4de':'#ccc7c0'));
      var bgCol=done?'rgba(143,199,158,.12)':'transparent';
      h+='<td style="text-align:center;padding:3px 4px;border-right:'+(hi2<habits.length-1?'1.5px solid #f0ebe3':'none')+'">';
      if(!isFuture){

        h+='<div id="'+cellId+'" onclick="toggleHabitAnim(\''+hi2+'\','+d+',\''+cellId+'\')" style="width:28px;height:28px;border-radius:5px;background:'+bgCol+';border:2px solid '+borderCol+';margin:0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s">';
        if(done){
          // Static X — no animation class, animation only happens on toggle

  // % footer row
  h+='<tr style="border-top:1.5px solid #f0ebe3">';
  h+='<td style="padding:8px 6px;font-size:10px;color:#a89e97;font-weight:700;text-align:right">%</td>';
  for(var hi3=0;hi3<habits.length;hi3++){
    var done2=0;
    for(var ddd=1;ddd<=todayD;ddd++)if(log[habits[hi3]+'__'+ddd])done2++;
    var pct=todayD>0?Math.round(done2/todayD*100):0;
    h+='<td style="text-align:center;padding:8px 4px;border-right:'+(hi3<habits.length-1?'1.5px solid #f0ebe3':'none')+'"><div style="font-size:13px;font-weight:800;color:'+(pct>=70?'#8fc79e':pct>=40?'#e8c162':'#e08a72')+'">'+pct+'</div></td>';
  }
  h+='</tr>';
  h+='</tbody></table></div>';

  document.getElementById('content').innerHTML=h;
}

function loadHabitGoals(){try{var x=localStorage.getItem('habit_goals');return x?JSON.parse(x):[{text:'\u05DC\u05D4\u05D9\u05D5\u05EA \u05E2\u05E7\u05D1\u05D9',done:false},{text:'\u05DC\u05D1\u05D8\u05D5\u05D7 \u05D1\u05EA\u05D4\u05DC\u05D9\u05DA',done:false}];}catch(e){return[];}}
function saveHabitGoals(arr){try{localStorage.setItem('habit_goals',JSON.stringify(arr));}catch(e){}}
function loadHabitNotes(){try{return localStorage.getItem('habit_notes')||'';}catch(e){return '';}}
function saveHabitNotes(v){try{localStorage.setItem('habit_notes',v);}catch(e){}}

function addGoal(){
  var inp=document.getElementById('new-goal-inp');if(!inp)return;
  var t=inp.value.trim();if(!t)return;
  var goals=loadHabitGoals();goals.push({text:t,done:false});saveHabitGoals(goals);renderHabits();
}
function toggleGoal(idx){
  var goals=loadHabitGoals();if(goals[idx])goals[idx].done=!goals[idx].done;saveHabitGoals(goals);renderHabits();
}
function deleteGoal(idx){
  var goals=loadHabitGoals();goals.splice(idx,1);saveHabitGoals(goals);renderHabits();
}

// Status cycle on tap: open → done → migrated → cancelled → started → open
var BJ_STATUSES=['open','done','migrated','cancelled','started'];

function bjSymbol(type,status){
  var t=BJ_TYPES.find(function(x){return x.id===type;})||BJ_TYPES[0];
  if(status==='done'){
    // Filled version
    if(type==='task')return '&#9632;'; // ■
    if(type==='event')return '&#9679;'; // ●
    if(type==='appt')return '&#9650;'; // ▲
    return '<span style="text-decoration:line-through">'+t.sym+'</span>';
  }
  if(status==='migrated') return t.sym+'<span style="font-size:9px">&rarr;</span>';
  if(status==='cancelled') return '<span style="text-decoration:line-through;color:#c0b8b0">'+t.sym+'</span>';
  if(status==='started') return t.sym+'<span style="font-size:9px">/</span>';
  return t.sym; // open
}

function bjTextStyle(status){
  if(status==='done')return 'color:#a89e97;text-decoration:line-through;';
  if(status==='cancelled')return 'color:#c0b8b0;text-decoration:line-through;';
  if(status==='migrated')return 'color:#a89e97;font-style:italic;';
  return 'color:#4a4340;';
}

var _newRemType='task';
var _arcPressTimer=null;
var _arcOpen=false;

function startArcPress(e){
  if(e&&e.preventDefault)e.preventDefault();
  _arcPressTimer=setTimeout(function(){openArc();},500);
}
function cancelArcPress(){
  clearTimeout(_arcPressTimer);
}
function openArc(){
  _arcOpen=true;
  var arc=document.getElementById('rem-arc');
  if(arc){arc.style.display='block';}
  // Close on tap outside
  setTimeout(function(){
    document.addEventListener('touchstart',closeArcOutside,{once:true});
    document.addEventListener('mousedown',closeArcOutside,{once:true});
  },50);
}
function closeArcOutside(e){
  var arc=document.getElementById('rem-arc');
  if(arc&&!arc.contains(e.target)){closeArc();}
}
function closeArc(){
  _arcOpen=false;
  var arc=document.getElementById('rem-arc');
  if(arc)arc.style.display='none';
}
function selectArcType(typeId){
  _newRemType=typeId;
  closeArc();
  renderReminders();
}

var _remLongPressIdx=-1;
function startRemLongPress(idx){
  _remLongPressIdx=idx;
  _longPressTimer=setTimeout(function(){openRemTypePicker(idx);},600);
}
function cancelRemLongPress(){clearTimeout(_longPressTimer);}
function openRemTypePicker(idx){
  _remLongPressIdx=idx;
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='flex';
}
function closeRemTypePicker(){
  var ov=document.getElementById('rem-type-overlay');
  if(ov)ov.style.display='none';
}
function pickRemType(typeId){
  var data=loadReminders();
  if(data[_remTab]&&data[_remTab][_remLongPressIdx]){
    data[_remTab][_remLongPressIdx].type=typeId;
    saveReminders(data);
  }
  closeRemTypePicker();
  renderReminders();
}
function cycleRemStatus(idx){
  var data=loadReminders();
  if(!data[_remTab]||!data[_remTab][idx])return;
  var cur=data[_remTab][idx].status||'open';
  var next=BJ_STATUSES[(BJ_STATUSES.indexOf(cur)+1)%BJ_STATUSES.length];
  data[_remTab][idx].status=next;
  saveReminders(data);renderReminders();
}
function toggleRemLegend(){_legendOpen=!_legendOpen;renderReminders();}

function setRemTab(tab){_remTab=tab;renderReminders();}

function addReminder(){
  var inp=document.getElementById('rem-inp');if(!inp)return;
  var txt=inp.value.trim();if(!txt)return;
  var data=loadReminders();
  if(!data[_remTab])data[_remTab]=[];
  data[_remTab].push({text:txt,type:_newRemType||'task',status:'open'});
  saveReminders(data);inp.value='';renderReminders();
}

function deleteReminder(idx){
  var data=loadReminders();
  if(data[_remTab])data[_remTab].splice(idx,1);
  saveReminders(data);renderReminders();
}

function clearDoneReminders(){
  var data=loadReminders();
  if(data[_remTab])data[_remTab]=data[_remTab].filter(function(i){return i.status!=='done';});
  saveReminders(data);renderReminders();
}

var _editRecipePhoto='';
function handleRecipePhoto(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=600,maxH=400;
      var scale=Math.min(maxW/img.width,maxH/img.height,1);
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      _editRecipePhoto=canvas.toDataURL('image/jpeg',0.8);
      var prev=document.getElementById('rec-photo-prev');
      if(prev){prev.outerHTML='<img src="'+_editRecipePhoto+'" id="rec-photo-prev" style="width:100%;max-height:180px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:block">';}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function saveRecipe(){
  var name=document.getElementById('rec-name');
  if(!name||!name.value.trim()){showToast('\u05E0\u05D0 \u05D4\u05D6\u05DF \u05E9\u05DD \u05DE\u05EA\u05DB\u05D5\u05DF');return;}
  var recipes=loadRecipes();
  var rec={
    name:(name.value.trim()),
    time:(document.getElementById('rec-time')||{}).value||'',
    servings:(document.getElementById('rec-servings')||{}).value||'',
    difficulty:(document.getElementById('rec-difficulty')||{}).value||'',
    tags:(document.getElementById('rec-tags')||{}).value||'',
    ingredients:(document.getElementById('rec-ingredients')||{}).value||'',
    instructions:(document.getElementById('rec-instructions')||{}).value||'',
    notes:(document.getElementById('rec-notes')||{}).value||'',
    photo:_editRecipePhoto||''
  };
  if(_recipeIdx>=0)recipes[_recipeIdx]=rec;
  else{recipes.push(rec);_recipeIdx=recipes.length-1;}
  saveRecipes(recipes);
  _recipeView='view';render();
  showToast('\u2713 '+rec.name+' \u05E0\u05E9\u05DE\u05E8!');
}

function deleteRecipe(){
  var recipes=loadRecipes();recipes.splice(_recipeIdx,1);saveRecipes(recipes);
  _recipeIdx=-1;_recipeView='list';render();
}
/* ── GOALS MODULE ── */
var _goalsView='home'; // home | view-goal | edit-goal | add-sub
var _goalIdx=-1;
var _subLevel=''; // 'monthly'|'weekly'|'daily'

var GOAL_HORIZONS=[
  {id:'dream',label:'\u05D4\u05D7\u05DC\u05D5\u05DD \u05D4\u05D2\u05D3\u05D5\u05DC',color:'#4f6ef7',bg:'#e8f0ff',emoji:'&#x2728;',desc:'\u05DC\u05D0\u05DF \u05D0\u05E0\u05D9 \u05D4\u05D5\u05DC\u05DA \u05D1\u05D7\u05D9\u05D9\u05DD'},
  {id:'yearly',label:'\u05DE\u05D8\u05E8\u05D4 \u05E9\u05E0\u05EA\u05D9\u05EA',color:'#a690cf',bg:'#f0eafa',emoji:'&#x1F4C5;',desc:'\u05E2\u05D3 \u05E1\u05D5\u05E3 \u05D4\u05E9\u05E0\u05D4'},
  {id:'project',label:'\u05E4\u05E8\u05D5\u05D9\u05E7\u05D8',color:'#e08a72',bg:'#fff0eb',emoji:'&#x1F4CC;',desc:'\u05DE\u05E9\u05D4\u05D5 \u05E1\u05E4\u05E6\u05D9\u05E4\u05D9 \u05DC\u05D1\u05E6\u05E2'}
];

function loadGoals(){try{var x=localStorage.getItem('goals_v1');return x?JSON.parse(x):[];}catch(e){return[];}}
function saveGoals(arr){try{localStorage.setItem('goals_v1',JSON.stringify(arr));}catch(e){}}

function renderGoals(){
  document.getElementById('hdr-title').textContent='\u05DE\u05D8\u05E8\u05D5\u05EA';
  if(_goalsView==='view-goal')return renderViewGoal();
  if(_goalsView==='edit-goal')return renderEditGoal();
  if(_goalsView==='add-sub')return renderAddSub();
  renderGoalsHome();
}

function renderGoalsHome(){
  var goals=loadGoals();
  var h='<div style="padding-bottom:30px">';
  h+='<div style="font-size:12px;color:#a89e97;line-height:1.6;margin-bottom:20px">\u05D7\u05DC\u05D5\u05DE\u05D5\u05EA \u05D4\u05DD \u05DC\u05D0 \u05DE\u05E9\u05D0\u05DC\u05D5\u05EA \u2014 \u05D4\u05DD \u05DE\u05D8\u05E8\u05D5\u05EA \u05E9\u05E2\u05D5\u05D3 \u05DC\u05D0 \u05D4\u05D5\u05D2\u05D3\u05E8\u05D5 \u05D1\u05D1\u05D9\u05E8\u05D5\u05E8.</div>';

  if(goals.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F3AF;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">\u05D0\u05D9\u05D6\u05D4 \u05D7\u05DC\u05D5\u05DD \u05D0\u05EA\u05D4 \u05E8\u05D5\u05E6\u05D4 \u05DC\u05D4\u05D2\u05E9\u05D9\u05DD?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">\u05D4\u05EA\u05D7\u05DC \u05DE\u05D4\u05D7\u05DC\u05D5\u05DD \u05D4\u05D2\u05D3\u05D5\u05DC \u2014\u05D5\u05E4\u05E8\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05DC\u05E6\u05E2\u05D3\u05D9\u05DD \u05E7\u05D8\u05E0\u05D9\u05DD.</div>';
    h+='<button onclick="_goalsView=\'edit-goal\';_goalIdx=-1;renderGoals()" style="background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ \u05D4\u05D2\u05D3\u05E8 \u05DE\u05D8\u05E8\u05D4</button>';
    h+='</div>';
  } else {
    // Group by horizon
    for(var hi=0;hi<GOAL_HORIZONS.length;hi++){
      var hor=GOAL_HORIZONS[hi];
      var horGoals=goals.filter(function(g){return g.horizon===hor.id;});
      if(horGoals.length===0)continue;
      h+='<div style="font-size:10px;font-weight:800;color:'+hor.color+';letter-spacing:.1em;margin-bottom:8px;margin-top:16px">'+hor.emoji+' '+hor.label.toUpperCase()+'</div>';
      for(var gi=0;gi<horGoals.length;gi++){
        var g=horGoals[gi];var gidx=goals.indexOf(g);
        var subs=g.subs||[];
        var doneSubs=subs.filter(function(s){return s.done;}).length;
        var pct=subs.length?Math.round(doneSubs/subs.length*100):0;

        h+='<div onclick="_goalIdx='+gidx+';_goalsView=\'view-goal\';renderGoals()" style="background:#fff;border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(200,180,160,.1);border-right:4px solid '+hor.color+'">';
        h+='<div style="font-size:15px;font-weight:800;color:#4a4340;margin-bottom:3px">'+esc(g.title)+'</div>';
        if(g.why)h+='<div style="font-size:11px;color:#a89e97;margin-bottom:8px;line-height:1.4;font-style:italic">'+esc(g.why)+'</div>';
        if(subs.length>0){
          h+='<div style="display:flex;align-items:center;gap:8px">';
          h+='<div style="flex:1;height:5px;background:#f0ebe3;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+hor.color+';border-radius:3px;transition:width .5s"></div></div>';
          h+='<div style="font-size:10px;color:'+hor.color+';font-weight:700">'+doneSubs+'/'+subs.length+'</div>';
          h+='</div>';
        }
        // Next action
        var nextSub=subs.find(function(s){return !s.done;});
        if(nextSub)h+='<div style="margin-top:8px;font-size:11px;color:#6a6360;background:#f5f0eb;border-radius:8px;padding:5px 10px">\u05E6\u05E2\u05D3 \u05D4\u05D1\u05D0: '+esc(nextSub.text)+'</div>';
        h+='</div>';
      }
    }
    h+='<button onclick="_goalsView=\'edit-goal\';_goalIdx=-1;renderGoals()" style="width:100%;background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:16px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px">+ \u05D4\u05D2\u05D3\u05E8 \u05DE\u05D8\u05E8\u05D4</button>';
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

function renderViewGoal(){
  var goals=loadGoals();var g=goals[_goalIdx];
  if(!g){_goalsView='home';renderGoals();return;}
  var hor=GOAL_HORIZONS.find(function(h){return h.id===g.horizon;})||GOAL_HORIZONS[0];
  var subs=g.subs||[];
  document.getElementById('hdr-title').textContent=esc(g.title);

  var h='<div style="padding-bottom:30px">';
  h+='<button onclick="_goalsView=\'home\';renderGoals()" style="background:none;border:none;font-size:12px;color:#a89e97;cursor:pointer;margin-bottom:14px;display:block">&#8249; \u05DE\u05D8\u05E8\u05D5\u05EA</button>';

  h+='<textarea id="goal-why" class="q-input" rows="2" placeholder="\u05E2\u05DE\u05D5\u05E7 \u05DC\u05E8\u05D2\u05E2, \u05DC\u05D0 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D4\u05E9\u05D8\u05D7\u05D9\u05EA\u05D9\u05EA..." style="min-height:60px;margin-bottom:14px">'+esc(g.why||'')+'</textarea>';

  h+='<div style="font-size:9px;color:#a89e97;font-weight:700;margin-bottom:8px">\u05D0\u05D5\u05E4\u05E7 \u05D6\u05DE\u05DF</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">';

    h+='<button onclick="setGoalHorizon(\''+hor.id+'\')" id="ghor-'+hor.id+'" style="border:2px solid '+(isSel?hor.color:'#f0ebe3')+';border-radius:14px;padding:12px 16px;cursor:pointer;background:'+(isSel?hor.bg:'#fff')+';text-align:right;display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:20px">'+hor.emoji+'</span>';
    h+='<div><div style="font-size:13px;font-weight:700;color:#4a4340">'+hor.label+'</div><div style="font-size:10px;color:#a89e97">'+hor.desc+'</div></div>';
    if(isSel)h+='<span style="margin-right:auto;color:'+hor.color+';font-size:16px">&#10003;</span>';
    h+='</button>';
  }
  h+='<input id="goal-horizon" type="hidden" value="'+(g.horizon||'dream')+'">';

  h+='<button onclick="saveGoalEdit()" style="width:100%;background:linear-gradient(135deg,#8fc79e,#4C9A4C);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">\u05E9\u05DE\u05D5\u05E8</button>';

function setGoalHorizon(id){
  var inp=document.getElementById('goal-horizon');if(inp)inp.value=id;
  GOAL_HORIZONS.forEach(function(hor){
    var btn=document.getElementById('ghor-'+hor.id);if(!btn)return;
    var isSel=hor.id===id;
    btn.style.borderColor=isSel?hor.color:'#f0ebe3';
    btn.style.background=isSel?hor.bg:'#fff';
  });
}

function saveGoalEdit(){
  var title=document.getElementById('goal-title');
  if(!title||!title.value.trim()){showToast('\u05E0\u05D0 \u05D4\u05D6\u05DF \u05DE\u05D8\u05E8\u05D4');return;}
  var goals=loadGoals();
  var existing=_goalIdx>=0?goals[_goalIdx]:{subs:[],blocking:''};
  var updated=Object.assign({},existing,{
    title:title.value.trim(),
    why:(document.getElementById('goal-why')||{}).value||'',
    horizon:(document.getElementById('goal-horizon')||{}).value||'dream'
  });
  if(_goalIdx>=0)goals[_goalIdx]=updated;
  else{goals.push(updated);_goalIdx=goals.length-1;}
  saveGoals(goals);showToast('\u05E0\u05E9\u05DE\u05E8 &#10003;');
  _goalsView='view-goal';renderGoals();
}

function saveGoalSub(){
  var inp=document.getElementById('sub-text');
  if(!inp||!inp.value.trim()){showToast('\u05DB\u05EA\u05D5\u05D1 \u05DE\u05E9\u05D4\u05D5...');return;}
  var goals=loadGoals();
  if(!goals[_goalIdx].subs)goals[_goalIdx].subs=[];
  goals[_goalIdx].subs.push({text:inp.value.trim(),level:_subLevel,done:false,id:Date.now()+''});
  saveGoals(goals);showToast('\u05E0\u05D5\u05E1\u05E3 &#10003;');
  _goalsView='view-goal';renderGoals();
}

function toggleGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs&&goals[_goalIdx].subs[sidx])
    goals[_goalIdx].subs[sidx].done=!goals[_goalIdx].subs[sidx].done;
  saveGoals(goals);renderGoals();
}

function deleteGoalSub(sidx){
  var goals=loadGoals();
  if(goals[_goalIdx]&&goals[_goalIdx].subs)goals[_goalIdx].subs.splice(sidx,1);
  saveGoals(goals);renderGoals();
}

function saveGoalBlocking(){
  var inp=document.getElementById('goal-block-inp');
  var goals=loadGoals();
  if(goals[_goalIdx])goals[_goalIdx].blocking=(inp||{}).value||'';
  saveGoals(goals);showToast('\u05E0\u05E9\u05DE\u05E8 &#10003;');
}

function deleteGoal(){
  var goals=loadGoals();goals.splice(_goalIdx,1);saveGoals(goals);
  _goalIdx=-1;_goalsView='home';renderGoals();
}

function loadPeople(){try{var x=localStorage.getItem('people_v2');return x?JSON.parse(x):[];}catch(e){return[];}}
function savePeople(arr){try{localStorage.setItem('people_v2',JSON.stringify(arr));}catch(e){}}

function daysSince(ts){if(!ts)return null;return Math.floor((Date.now()-ts)/(1000*60*60*24));}

function renderPeople(){
  document.getElementById('hdr-title').textContent='\u05D4\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05DC\u05D9';
  if(_peopleView==='person')return renderPersonPage();
  if(_peopleView==='edit-person')return renderEditPerson();
  if(_peopleView==='add-memory')return renderAddMemory();
  renderPeopleHome();
}

function renderPeopleHome(){
  var people=loadPeople();
  var h='<div style="padding-bottom:30px">';

  // Subtitle
  h+='<div style="font-size:12px;color:#a89e97;margin-bottom:18px;line-height:1.6">\u05D4\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05D0\u05E0\u05D9 \u05E8\u05D5\u05E6\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E0\u05D5\u05DB\u05D7 \u05D1\u05D7\u05D9\u05D9\u05DD \u05E9\u05DC\u05D4\u05DD.</div>';

  if(people.length===0){
    h+='<div style="text-align:center;padding:50px 20px">';
    h+='<div style="font-size:52px;margin-bottom:16px">&#x1F9E1;</div>';
    h+='<div style="font-size:17px;font-weight:800;color:#4a4340;margin-bottom:8px">\u05DE\u05D9 \u05D4\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05DC\u05DA?</div>';
    h+='<div style="font-size:13px;color:#a89e97;margin-bottom:24px;line-height:1.6">\u05D4\u05EA\u05D7\u05DC \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05D0\u05EA \u05D4\u05D0\u05E0\u05E9\u05D9\u05DD \u05E9\u05D0\u05EA\u05D4 \u05E8\u05D5\u05E6\u05D4 \u05DC\u05D6\u05DB\u05D5\u05E8<br>\u05D5\u05DC\u05D4\u05D9\u05D5\u05EA \u05E0\u05D5\u05DB\u05D7 \u05D1\u05D7\u05D9\u05D9\u05DD \u05E9\u05DC\u05D4\u05DD.</div>';
    h+='<button onclick="_peopleView=\'edit-person\';_personIdx=-1;renderPeople()" style="background:linear-gradient(135deg,#f3b9a8,#e08a72);border:none;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">+ \u05D4\u05D5\u05E1\u05E3 \u05D0\u05D3\u05DD</button>';
    h+='</div>';
  } else {
    // Gentle reminders strip
    var toCheck=people.filter(function(p){
      if(!p.contactFreq||p.contactFreq==='none')return false;
      var days=daysSince(p.lastContact);if(days===null)return true;
      var thresholds={daily:1,weekly:7,biweekly:14,monthly:30,occasionally:60};
      return days>=(thresholds[p.contactFreq]||30);
    });
    if(toCheck.length>0){
      h+='<div style="background:linear-gradient(135deg,#fff9f0,#fff5e8);border-radius:18px;padding:14px;margin-bottom:16px;border:1px solid #f3b9a855">';
      h+='<div style="font-size:11px;font-weight:700;color:#e08a72;margin-bottom:10px">\u05D0\u05D5\u05DC\u05D9 \u05D4\u05D2\u05D9\u05E2 \u05D4\u05D6\u05DE\u05DF \u05DC\u05D1\u05D3\u05D5\u05E7 \u05DE\u05D4 \u05E9\u05DC\u05D5\u05DD...</div>';
      for(var ri=0;ri<Math.min(toCheck.length,3);ri++){
        var rp=toCheck[ri];var rdays=daysSince(rp.lastContact);
        h+='<div onclick="_personIdx=people.indexOf(rp);_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #f5f0eb">';
        h+=personAvatar(rp,32);
        h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#4a4340">'+esc(rp.name)+'</div>';
        h+='<div style="font-size:10px;color:#a89e97">'+(rdays===null?'\u05E2\u05D3\u05D9\u05D9\u05DF \u05DC\u05D0 \u05D3\u05D9\u05D1\u05E8\u05EA\u05DD':'\u05E2\u05D1\u05E8\u05D5 '+rdays+' \u05D9\u05DE\u05D9\u05DD')+'</div></div>';
        h+='</div>';
      }
      h+='</div>';
    }

    // Upcoming dates
    var now=new Date();var upcoming=[];
    for(var pi2=0;pi2<people.length;pi2++){
      var p2=people[pi2];
      var dates2=p2.importantDates||[];
      for(var di=0;di<dates2.length;di++){
        var d2=dates2[di];var dt=new Date(d2.date);
        // For yearly, find next occurrence
        var next=new Date(now.getFullYear(),dt.getMonth(),dt.getDate());
        if(next<now)next=new Date(now.getFullYear()+1,dt.getMonth(),dt.getDate());
        var inDays=Math.ceil((next-now)/(1000*60*60*24));
        if(inDays<=14)upcoming.push({person:p2,pidx:pi2,date:d2,inDays:inDays});
      }
    }
    upcoming.sort(function(a,b){return a.inDays-b.inDays;});
    if(upcoming.length>0){
      h+='<div style="background:linear-gradient(135deg,#e8f0ff,#dde8ff);border-radius:18px;padding:14px;margin-bottom:16px">';
      h+='<div style="font-size:11px;font-weight:700;color:#4f6ef7;margin-bottom:10px">&#x1F4C5; \u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD \u05E7\u05E8\u05D5\u05D1\u05D9\u05DD</div>';
      for(var ui=0;ui<upcoming.length;ui++){
        var u=upcoming[ui];
        h+='<div onclick="_personIdx='+u.pidx+';_peopleView=\'person\';renderPeople()" style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(79,110,247,.1)">';

  h+='<textarea id="mem-text" class="q-input" rows="5" autofocus placeholder="\u05DE\u05D4 \u05D4\u05D9\u05D9\u05EA \u05E8\u05D5\u05E6\u05D4 \u05DC\u05D6\u05DB\u05D5\u05E8?" style="min-height:120px;margin-bottom:16px;font-size:15px"></textarea>';

  }
  h+='</div>';
  h+='<button onclick="saveMemory()" style="width:100%;background:linear-gradient(135deg,#f3b9a8,#e08a72);border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff">\u05E9\u05DE\u05D5\u05E8</button>';

function setMemType(typeId){
  window._newMemType=typeId;
  MEMORY_TYPES.forEach(function(mt){
    var btn=document.getElementById('mtype-'+mt.id);
    if(btn){btn.style.background=mt.id===typeId?'linear-gradient(135deg,#f3b9a8,#e08a72)':'#f5f0eb';btn.style.color=mt.id===typeId?'#fff':'#6a6360';}
  });
}

function saveMemory(){
  var inp=document.getElementById('mem-text');
  if(!inp||!inp.value.trim()){showToast('\u05DB\u05EA\u05D5\u05D1 \u05DE\u05E9\u05D4\u05D5...');return;}
  var people=loadPeople();
  if(!people[_personIdx].memories)people[_personIdx].memories=[];
  people[_personIdx].memories.push({id:Date.now()+'',content:inp.value.trim(),type:window._newMemType||'note',date:Date.now(),pinned:false});
  savePeople(people);
  showToast('\u05E0\u05E9\u05DE\u05E8 &#10003;');
  _peopleView='person';renderPeople();
}

function deleteMemory(memId){
  var people=loadPeople();
  people[_personIdx].memories=(people[_personIdx].memories||[]).filter(function(m){return m.id!==memId;});
  savePeople(people);renderPeople();
}

function togglePinMemory(memId){
  var people=loadPeople();
  var mems=people[_personIdx].memories||[];
  for(var i=0;i<mems.length;i++){if(mems[i].id===memId)mems[i].pinned=!mems[i].pinned;}
  savePeople(people);renderPeople();
}

function logContact(type){
  var people=loadPeople();
  people[_personIdx].lastContact=Date.now();
  if(!people[_personIdx].memories)people[_personIdx].memories=[];
  people[_personIdx].memories.push({id:Date.now()+'',content:'\u05D9\u05E6\u05D9\u05E8\u05EA \u05E7\u05E9\u05E8: '+type,type:'conversation',date:Date.now(),pinned:false});
  savePeople(people);showToast('\u05E0\u05E8\u05E9\u05DD &#10003;');renderPeople();
}

function deletePersonDate(di){
  var people=loadPeople();
  (people[_personIdx].importantDates||[]).splice(di,1);
  savePeople(people);renderPeople();
}

function selectFreq(val){
  var inp=document.getElementById('ep-freq');
  if(inp)inp.value=val;
  var freqs=['none','occasionally','monthly','biweekly','weekly','daily'];
  for(var i=0;i<freqs.length;i++){
    var btn=document.getElementById('freq-btn-'+freqs[i]);
    if(!btn)continue;
    if(freqs[i]===val){btn.style.background='linear-gradient(135deg,#c9bce0,#a690cf)';btn.style.color='#fff';}
    else{btn.style.background='#f5f0eb';btn.style.color='#6a6360';}
  }
}

function addDateToPerson(){
  var title=document.getElementById('ep-date-title');
  var val=document.getElementById('ep-date-val');
  var dtype=document.getElementById('ep-dtype');
  var yearly=document.getElementById('ep-yearly');
  if(!title||!title.value.trim()||!val||!val.value){showToast('\u05DE\u05DC\u05D0 \u05E9\u05DD \u05D5\u05EA\u05D0\u05E8\u05D9\u05DA');return;}
  var people=loadPeople();
  var p=_personIdx>=0?people[_personIdx]:null;
  if(!p){// temp — will save with person
    window._pendingDates=window._pendingDates||[];
    window._pendingDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
    showToast('\u05EA\u05D0\u05E8\u05D9\u05DA \u05E0\u05D5\u05E1\u05E3');title.value='';val.value='';return;
  }
  if(!p.importantDates)p.importantDates=[];
  p.importantDates.push({title:title.value.trim(),date:val.value,type:dtype.value,yearly:yearly.checked});
  savePeople(people);showToast('\u05EA\u05D0\u05E8\u05D9\u05DA \u05E0\u05D5\u05E1\u05E3 &#10003;');title.value='';val.value='';
}

function savePersonEdit(){
  var name=document.getElementById('ep-name');
  if(!name||!name.value.trim()){showToast('\u05E0\u05D0 \u05D4\u05D6\u05DF \u05E9\u05DD');return;}
  var people=loadPeople();
  var existing=_personIdx>=0?people[_personIdx]:{memories:[],importantDates:[]};
  var updated=Object.assign({},existing,{
    name:name.value.trim(),
    relationship:(document.getElementById('ep-rel')||{}).value||'',
    whatTheyMean:(document.getElementById('ep-mean')||{}).value||'',
    whatILove:(document.getElementById('ep-love')||{}).value||'',
    currentUpdate:(document.getElementById('ep-update')||{}).value||'',
    toAsk:(document.getElementById('ep-ask')||{}).value||'',
    contactFreq:(document.getElementById('ep-freq')||{}).value||'monthly'
  });
  // Merge pending dates
  if(window._pendingDates&&window._pendingDates.length){
    updated.importantDates=(updated.importantDates||[]).concat(window._pendingDates);
    window._pendingDates=[];
  }
  if(_personIdx>=0)people[_personIdx]=updated;
  else{people.push(updated);_personIdx=people.length-1;}
  savePeople(people);
  showToast('\u05E0\u05E9\u05DE\u05E8 &#10003;');
  _peopleView='person';renderPeople();
}

function deletePerson(){
  var people=loadPeople();people.splice(_personIdx,1);savePeople(people);
  _personIdx=-1;_peopleView='home';renderPeople();
}

function saveInsEntry(){
  var textInp=document.getElementById('ins-text');
  if(!textInp||!textInp.value.trim()){showToast('\u05DB\u05EA\u05D5\u05D1 \u05DE\u05E9\u05D4\u05D5...');return;}
  var changedFrom=(document.getElementById('ins-changed-from')||{}).value||'';
  var changedWhy=(document.getElementById('ins-changed-why')||{}).value||'';
  var data=loadInsights();
  var key=insKey(_insCat,_insQ);
  if(!data[key])data[key]=[];
  data[key].push({text:textInp.value.trim(),date:Date.now(),changedFrom:changedFrom.trim()||null,changedWhy:changedWhy.trim()||null});
  saveInsights(data);
  showToast('\u05EA\u05D5\u05D1\u05E0\u05D4 \u05E0\u05E9\u05DE\u05E8\u05D4 &#10003;');
  _insView='q';renderInsights();
}

function deleteInsEntry(idx){
  var data=loadInsights();var key=insKey(_insCat,_insQ);
  if(data[key])data[key].splice(idx,1);
  saveInsights(data);renderInsights();
}

function saveBookLibrary(arr){try{localStorage.setItem('book_library',JSON.stringify(arr));}catch(e){}}

function finishBook(){
  var book=loadBook();
  if(!book.title)return;
  var lib=loadBookLibrary();
  var quotes=loadBookQuotes();
  // Check if already in library
  var exists=lib.some(function(b){return b.title===book.title;});
  if(!exists){
    lib.unshift({
      title:book.title,cover:book.cover||'',
      totalPages:book.total||book.page,
      finishedDate:new Date().toISOString().slice(0,10),
      quotes:quotes.slice()
    });
    saveBookLibrary(lib);
  }
  // Clear current book + quotes
  saveBook({title:'',page:0,total:0,cover:''});
  saveBookQuotes([]);
  showToast('\u2713 \u05D4\u05E1\u05E4\u05E8 \u05E0\u05D5\u05E1\u05E3 \u05DC\u05E1\u05E4\u05E8\u05D9\u05D9\u05D4!');
  renderBookWidget();
}

var _libraryOpenIdx=-1;

function deleteLibraryBook(idx){

function onBookPageSlide(val){

  var book=loadBook();

  var disp=document.querySelector('#home-book [style*="font-size:15px;font-weight:700;color:#a690cf"]');

function handleBookCover(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var maxW=400,maxH=600;
      var w=img.width,h=img.height;
      var scale=Math.min(maxW/w,maxH/h,1);
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(h*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      var book=loadBook();book.cover=canvas.toDataURL('image/jpeg',0.85);
      saveBook(book);renderBookWidget();openBookEdit();
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
